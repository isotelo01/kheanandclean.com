<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Molly's Wonderland</title>
<link rel="icon" type="image/png" href="molly-icon-180.png">
<link rel="apple-touch-icon" href="molly-icon-180.png">
<meta name="apple-mobile-web-app-title" content="Molly's Wonderland">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Molly's Wonderland">
<meta property="og:description" content="Decorate your land, dress up Molly, and fill the castle">
<meta property="og:image" content="https://kheanandclean.com/kids/molly-preview.png">

<meta property="og:image:height" content="630">

<script src="molly-art.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #fde2ff; color: #3a2340; touch-action: none; }
  svg { display: block; width: 100%; height: auto; }
  .screen { position: fixed; inset: 0; display: none; flex-direction: column; height: 100dvh; }
  .screen.on { display: flex; }
  button { font-family: inherit; color: inherit; border: none; cursor: pointer; }

  /* top bar */
  .bar { display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 10px 8px; background: rgba(255,255,255,.85); z-index: 5; }
  .bar h2 { flex: 1; margin: 0; font-size: 22px; font-weight: 900; color: #a24bd1; text-align: center; }
  .rb { width: 48px; height: 48px; border-radius: 16px; background: #fff; box-shadow: 0 3px 0 #e6b8e0; font-size: 26px; display: grid; place-items: center; flex: none; }
  .rb:active { transform: translateY(2px); box-shadow: 0 1px 0 #e6b8e0; }
  .rb.lit { background: #ffe27a; box-shadow: 0 0 0 4px #ffb3d9, 0 3px 0 #e0a800; }

  /* home */
  #home { background: linear-gradient(#8fd3ff 0%, #c9ecff 55%, #8ee08e 55%, #6cc96c 100%); align-items: center; justify-content: center; overflow: hidden; }
  #home .bgrain { position: absolute; width: 70vmin; right: -14vmin; top: calc(55vh - 36vmin); opacity: .85; }
  #home .bgcastle { position: absolute; width: 30vmin; right: 4vw; top: calc(55vh - 28vmin); }
  #home .bgtree { position: absolute; width: 30vmin; left: -4vmin; top: calc(55vh - 34vmin); }
  .title { position: relative; margin: 0 0 4px; font-size: clamp(34px, 9vw, 64px); font-weight: 900; color: #fff; text-align: center; line-height: 1.05;
    text-shadow: 3px 3px 0 #d65db1, 6px 6px 0 #7b2cbf; z-index: 2; }
  .stars { position: relative; color: #ffd23f; font-size: 22px; letter-spacing: 6px; z-index: 2; }
  .heroes { position: relative; display: flex; align-items: flex-end; gap: 4px; z-index: 2; margin-top: 6px; }
  .heroes .m { width: min(42vw, 30vh, 220px); cursor: pointer; }
  .heroes .p { width: min(22vw, 16vh, 115px); cursor: pointer; margin-bottom: 4px; }
  .sign { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 10px; margin-top: 14px; width: min(86vw, 340px); }
  .sign button { font-size: 26px; font-weight: 900; padding: 14px 18px; border-radius: 20px; color: #fff; text-align: left; display: flex; align-items: center; gap: 12px;
    box-shadow: 0 6px 0 rgba(0,0,0,.22); }
  .sign button:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.22); }
  .sign .e { font-size: 32px; }

  /* scenes */
  .scene { position: relative; flex: 1; overflow: hidden; }
  .land { background: linear-gradient(var(--sky1), var(--sky2) 48%, #8ee08e 48%, #5fbf5f 100%); --sky1:#7cc8ff; --sky2:#d4f0ff; transition: background .6s; }
  .land.sunset { --sky1:#ff9fb6; --sky2:#ffd08a; }
  .land.night { --sky1:#1c1452; --sky2:#5b3b9e; }
  .land .path { position: absolute; left: 38%; right: 38%; top: 48%; bottom: 0; background: linear-gradient(#f2d4a8, #e8c08a); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); opacity: .9; }
  .land .nightstars { position: absolute; inset: 0 0 52% 0; opacity: 0; transition: opacity .6s; pointer-events: none;
    background-image: radial-gradient(2px 2px at 10% 20%, #fff, transparent), radial-gradient(2px 2px at 30% 60%, #fff, transparent), radial-gradient(3px 3px at 55% 25%, #fff6c2, transparent),
      radial-gradient(2px 2px at 75% 50%, #fff, transparent), radial-gradient(2px 2px at 88% 15%, #fff, transparent), radial-gradient(3px 3px at 45% 80%, #fff6c2, transparent), radial-gradient(2px 2px at 20% 85%, #fff, transparent); }
  .land.night .nightstars { opacity: 1; }
  .land .sun { position: absolute; right: 8%; top: 6%; width: 13vmin; height: 13vmin; border-radius: 50%; background: #ffe14d; box-shadow: 0 0 30px #ffe14d; transition: all .6s; pointer-events: auto; cursor: pointer; z-index: 1; }
  .sun svg { width: 100%; height: 100%; }
  .land.sunset .sun { top: 30%; background: #ff9a2e; box-shadow: 0 0 40px #ff9a2e; }
  .land.night .sun { background: #fff6c2; box-shadow: 0 0 24px #fff6c2; width: 10vmin; height: 10vmin; top: 6%; }
  .room { background: linear-gradient(var(--wall) 0 62%, #f3c9a0 62%, #e6b07e 100%); --wall:#ffd9ec; transition: background .6s; }
  .room.w1 { --wall:#e6d1ff; } .room.w2 { --wall:#d3eeff; } .room.w3 { --wall:#fff0c2; }
  .room.tile { background: linear-gradient(var(--wall) 0 62%, transparent 62%), repeating-conic-gradient(#fff 0 25%, #ffd9ec 0 50%) 0 0 / 44px 44px; }
  .room.w4 { --wall:#d9f5dc; }
  .ttl { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #roomName { background: #fde2ff; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 800; color: #d65db1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rarrow { position: absolute; top: 40%; width: 46px; height: 64px; border-radius: 16px; background: rgba(255,255,255,.75); font-size: 24px; color: #d65db1; z-index: 9000; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  .rarrow.l { left: 6px; } .rarrow.r { right: 6px; }
  .roommenu { position: absolute; inset: 8px; z-index: 20000; background: rgba(255,255,255,.97); border-radius: 22px; padding: 12px; display: none; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; align-content: start; overflow-y: auto; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
  .roommenu.on { display: grid; }
  .roommenu button { background: #fff0fa; border: 3px solid #ffd1ea; border-radius: 18px; padding: 12px 6px; font-size: 16px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .roommenu button .e { font-size: 34px; }
  .roommenu button.on { border-color: #d65db1; }
  .room .stripes { position: absolute; inset: 0 0 38% 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 18px, transparent 18px 44px); pointer-events: none; }

  .item { position: absolute; transform: translate(-50%, -100%); touch-action: none; cursor: grab; }
  .item .in { transform-origin: 50% 100%; }
  .item.flip .in { transform: scaleX(-1); }
  .item .emo { font-size: var(--fs); line-height: 1; text-align: center; }
  .item.sel { outline: 3px dashed #d65db1; outline-offset: 4px; border-radius: 12px; }
  .item.dance .in { animation: dance .9s ease-in-out; }
  .item.flip.dance .in { animation: danceF .9s ease-in-out; }
  @keyframes dance { 0%,100% { transform: none; } 25% { transform: rotate(-14deg) scale(1.15); } 50% { transform: translateY(-20%) scale(1.25); } 75% { transform: rotate(14deg) scale(1.15); } }
  @keyframes danceF { 0%,100% { transform: scaleX(-1); } 25% { transform: scaleX(-1) rotate(-14deg) scale(1.15); } 50% { transform: scaleX(-1) translateY(-20%) scale(1.25); } 75% { transform: scaleX(-1) rotate(14deg) scale(1.15); } }
  .grow .in { animation: grow .5s cubic-bezier(.3,1.6,.5,1); }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
  .hop { animation: hop .5s ease-out; }
  @keyframes hop { 40% { transform: translateY(-18%); } }

  .item.walk .in { animation: waddle .46s ease-in-out infinite; }
  @keyframes waddle { 0%,100% { transform: rotate(-7deg); } 25% { transform: translateY(-7%); } 50% { transform: rotate(7deg); } 75% { transform: translateY(-7%); } }
  .item.enter .in { animation: enter .7s ease-in forwards; }
  @keyframes enter { to { transform: translateY(-8%) scale(.25); opacity: 0; } }
  .walkline { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 99998; }
  .fx { position: absolute; pointer-events: none; font-size: 26px; z-index: 9999; animation: fx 1s ease-out forwards; }
  @keyframes fx { from { opacity: 1; transform: translate(-50%,-50%) scale(.6); } to { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); } }

  .selbar { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); display: none; gap: 8px; background: rgba(255,255,255,.95); padding: 8px; border-radius: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.18); z-index: 10000; }
  .selbar.on { display: flex; }
  .selbar button { width: 48px; height: 48px; border-radius: 14px; background: #fde2ff; font-size: 24px; }
  .selbar button.del { background: #ffd1d1; }

  /* tray */
  .tray { background: #fff; padding: 8px 0 max(8px, env(safe-area-inset-bottom)); box-shadow: 0 -4px 12px rgba(0,0,0,.1); z-index: 5; }
  .tabs { display: flex; gap: 6px; padding: 0 10px 8px; overflow-x: auto; }
  .tabs button { flex: none; padding: 8px 14px; border-radius: 999px; background: #f4e6f7; font-size: 17px; font-weight: 800; }
  .tabs button.on { background: #d65db1; color: #fff; }
  .row { display: flex; gap: 8px; overflow-x: auto; padding: 0 10px; touch-action: pan-x; scrollbar-width: none; }
  .row::-webkit-scrollbar { display: none; }
  .row button { flex: none; width: 72px; height: 72px; border-radius: 18px; background: #fff6fb; border: 3px solid #ffd1ea; font-size: 40px; display: grid; place-items: center; padding: 6px; touch-action: pan-x; }
  .row button:active { transform: scale(.92); }
  .row button svg { max-height: 56px; width: auto; max-width: 56px; }

  /* dress up */
  #dress { background: linear-gradient(#ffe6f4, #e9d6ff); }
  .dwrap { flex: 1; display: flex; gap: 10px; padding: 10px; min-height: 0; }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; min-height: 0; }
  .stage .m { position: absolute; inset: 0; cursor: pointer; }
  .stage .m svg { width: 100%; height: 100%; }
  .opts { width: min(46vw, 330px); overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px; touch-action: pan-y; }
  .opts h3 { margin: 0; font-size: 18px; color: #a24bd1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; }
  .grid button { background: #fff; border-radius: 16px; padding: 8px 4px; font-size: 30px; font-weight: 800; border: 3px solid #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: pan-y; }
  .grid button small { font-size: 12px; }
  .grid button.on { border-color: #d65db1; background: #fff0fa; }
  .who { display: flex; gap: 8px; }
  .who button { flex: 1; background: #fff; border: 3px solid #fff; border-radius: 18px; padding: 6px; display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 900; touch-action: pan-y; }
  .who button svg { width: 40px; height: 40px; flex: none; }
  .who button.on { border-color: #d65db1; background: #fff0fa; color: #a24bd1; }
  .sw { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #e6b8e0; }
  #viewer3d { position: fixed; inset: 0; z-index: 50; background: #fde2ff; display: none; }
  #viewer3d.on { display: block; }
  #viewer3d iframe { width: 100%; height: 100%; border: 0; display: block; }
  #close3d { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 12px; width: 58px; height: 58px; border-radius: 50%; background: #fff; font-size: 30px; font-weight: 900; box-shadow: 0 4px 0 rgba(0,0,0,.25); z-index: 2; }
  @media (max-aspect-ratio: 3/4) {
    .dwrap { flex-direction: column; }
    .stage { flex: 1; }
    .opts { width: 100%; flex: none; max-height: 42%; }
  }
</style>
</head>
<body>

<!-- HOME -->
<section class="screen on" id="home">
  <div class="bgrain" id="hRain"></div>
  <div class="bgtree" id="hTree"></div>
  <div class="bgcastle" id="hCastle"></div>
  <h1 class="title">Molly's<br>Wonderland</h1>
  <div class="stars">★ ★ ★</div>
  <div class="heroes"><div class="m" id="hMolly"></div><div class="p" id="hPippi"></div></div>
  <div class="sign">
    <button style="background:#5fbf5f" data-go="land"><span class="e">🌸</span>Wonderland</button>
    <button style="background:#d65db1" data-go="castle"><span class="e">🏰</span>Castle</button>
    <button style="background:#a24bd1" data-go="dress"><span class="e">👗</span>Dress Up</button>
  </div>
</section>

<!-- LAND -->
<section class="screen" id="land">
  <div class="bar">
    <button class="rb" data-go="home">⬅️</button>
    <h2>Wonderland</h2>
    <button class="rb" id="landSky">🌗</button>
    <button class="rb wandBtn">🪄</button>
  </div>
  <div class="scene land" id="landScene"><div class="nightstars"></div><div class="sun" id="sun"></div><div class="path"></div></div>
  <div class="tray"><div class="tabs" id="landTabs"></div><div class="row" id="landRow"></div></div>
</section>

<!-- CASTLE -->
<section class="screen" id="castle">
  <div class="bar">
    <button class="rb" data-go="home">⬅️</button>
    <div class="ttl"><h2>Castle</h2><button id="roomName"></button></div>
    <button class="rb" id="castle3d" style="font-size:18px;font-weight:900;color:#a24bd1">3D</button>
    <button class="rb" id="wallBtn">🎨</button>
    <button class="rb wandBtn">🪄</button>
  </div>
  <div class="scene room" id="castleScene"><div class="stripes"></div>
    <button class="rarrow l" id="roomPrev">◀</button><button class="rarrow r" id="roomNext">▶</button>
    <div class="roommenu" id="roomMenu"></div>
  </div>
  <div class="tray"><div class="tabs" id="castleTabs"></div><div class="row" id="castleRow"></div></div>
</section>

<!-- DRESS UP -->
<section class="screen" id="dress">
  <div class="bar">
    <button class="rb" data-go="home">⬅️</button>
    <h2>Dress Up</h2>
    <button class="rb" id="view3d" style="font-size:18px;font-weight:900;color:#a24bd1">3D</button>
    <button class="rb" id="dressReset">🧽</button>
  </div>
  <div class="dwrap">
    <div class="stage"><div class="m" id="dMolly"></div></div>
    <div class="opts" id="dOpts"></div>
  </div>
</section>

<div id="viewer3d"><button id="close3d" aria-label="Close">✕</button><iframe title="3D"></iframe></div>
<div class="selbar" id="selbar">
  <button data-a="small">➖</button>
  <button data-a="big">➕</button>
  <button data-a="flip">↔️</button>
  <button data-a="front">⬆️</button>
  <button class="del" data-a="del">🗑️</button>
  <button data-a="done">✅</button>
</div>

<script>
const A = window.MollyArt;
const $ = (s, r = document) => r.querySelector(s);

/* ---------- save ---------- */
const KEY = 'mollyWonderland1';
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
if (!S) S = {
  outfit: { dress: 'pink', crown: true, wand: false, bow: true, necklace: false, blush: true, gloss: false, shadow: false, glitter: false },
  sky: 0, wall: 0,
  land: [
    { k: 'rainbow', x: 22, y: 46, s: 1.1 }, { k: 'castle', x: 78, y: 52, s: 1 }, { k: 'pinktree', x: 12, y: 62, s: 1 },
    { k: 'pond', x: 70, y: 82, s: 1 }, { k: 'f1', x: 30, y: 78, s: 1 }, { k: 'f3', x: 88, y: 92, s: 1 },
    { k: 'molly', x: 46, y: 88, s: 1 }, { k: 'pippi', x: 58, y: 92, s: 1 }
  ],
  castle: [
    { k: 'window', x: 22, y: 42, s: 1 }, { k: 'chandelier', x: 55, y: 28, s: 1 }, { k: 'rug', x: 52, y: 92, s: 1.1 },
    { k: 'bed', x: 78, y: 78, s: 1 }, { k: 'throne', x: 30, y: 82, s: 1 }
  ]
};
/* castle rooms (a big house: grand hall with the staircase, living, kitchen, dining, bedrooms, bath, playroom) */
const ROOMS = [
  { id: 'foyer', name: 'Grand Hall', e: '🏰', floor: 'tile', items: [
    { k: 'stairs', x: 50, y: 86, s: 1.25 }, { k: 'chandelier', x: 50, y: 22, s: 1 }, { k: 'door', x: 12, y: 64, s: 1 },
    { k: 'rug', x: 50, y: 97, s: 1 }, { k: 'c12', x: 90, y: 84, s: 1 }, { k: 'c17', x: 88, y: 40, s: 1 } ] },
  { id: 'living', name: 'Great Room', e: '🛋️', floor: 'wood', items: [
    { k: 'fireplace', x: 50, y: 64, s: 1.1 }, { k: 'sofa', x: 46, y: 92, s: 1.1 }, { k: 'window', x: 16, y: 46, s: 1 },
    { k: 'window', x: 84, y: 46, s: 1 }, { k: 'lamp', x: 88, y: 86, s: 1 }, { k: 'bookshelf', x: 12, y: 84, s: 1 }, { k: 'rug', x: 50, y: 98, s: 1.2 } ] },
  { id: 'kitchen', name: 'Kitchen', e: '🧁', floor: 'tile', items: [
    { k: 'fridge', x: 10, y: 70, s: 1 }, { k: 'stove', x: 28, y: 70, s: 1 }, { k: 'counter', x: 56, y: 70, s: 1.1 }, { k: 'window', x: 56, y: 40, s: .8 },
    { k: 'c1', x: 50, y: 50, s: 1 }, { k: 'table', x: 74, y: 94, s: 1 }, { k: 'cupcake', x: 70, y: 80, s: .8 }, { k: 'c3', x: 80, y: 80, s: .8 } ] },
  { id: 'dining', name: 'Dining Room', e: '🍽️', floor: 'wood', items: [
    { k: 'chandelier', x: 50, y: 22, s: 1 }, { k: 'window', x: 20, y: 46, s: 1 }, { k: 'window', x: 80, y: 46, s: 1 },
    { k: 'c14', x: 22, y: 90, s: 1 }, { k: 'longtable', x: 50, y: 92, s: 1.1 }, { k: 'c14', x: 78, y: 90, s: 1, f: 1 }, { k: 'c3', x: 50, y: 78, s: .9 } ] },
  { id: 'master', name: 'Princess Bedroom', e: '👑', floor: 'wood', items: null },
  { id: 'kids', name: "Kids' Room", e: '🧸', floor: 'wood', items: [
    { k: 'kidbed', x: 72, y: 84, s: 1.1 }, { k: 'window', x: 30, y: 44, s: 1 }, { k: 'toybox', x: 24, y: 86, s: 1 },
    { k: 'teddy', x: 46, y: 90, s: 1 }, { k: 'rug', x: 50, y: 97, s: 1 }, { k: 'lamp', x: 90, y: 80, s: .9 } ] },
  { id: 'bath', name: 'Bathroom', e: '🛁', floor: 'tile', items: [
    { k: 'tub', x: 68, y: 88, s: 1.1 }, { k: 'sink', x: 16, y: 80, s: 1 }, { k: 'toilet', x: 38, y: 86, s: 1.3 },
    { k: 'mirror', x: 16, y: 50, s: .6 }, { k: 'a4', x: 70, y: 66, s: .7 }, { k: 'soap', x: 20, y: 60, s: .8 }, { k: 'window', x: 70, y: 40, s: .8 } ] },
  { id: 'play', name: 'Playroom', e: '🎨', floor: 'wood', items: [
    { k: 'toybox', x: 20, y: 86, s: 1 }, { k: 'c19', x: 72, y: 82, s: 1 }, { k: 'bookshelf', x: 90, y: 76, s: .9 }, { k: 'window', x: 40, y: 44, s: 1 },
    { k: 'puzzle', x: 44, y: 92, s: 1 }, { k: 'dice', x: 54, y: 94, s: 1 }, { k: 'balloon', x: 12, y: 50, s: 1 }, { k: 'rug', x: 48, y: 98, s: 1 } ] }
];
const ROOM = id => ROOMS.find(r => r.id === id) || ROOMS[0];
const MASTER_START = [{ k: 'window', x: 22, y: 42, s: 1 }, { k: 'chandelier', x: 55, y: 28, s: 1 }, { k: 'rug', x: 52, y: 92, s: 1.1 }, { k: 'bed', x: 78, y: 78, s: 1 }, { k: 'throne', x: 30, y: 82, s: 1 }];
// rooms nobody has changed yet (the 3D castle furnishes those once, so 2D and 3D match)
const freshRooms = () => ROOMS.filter(r => JSON.stringify(S.rooms[r.id]) === JSON.stringify(r.items || MASTER_START)).map(r => r.id);
if (!S.rooms) {
  S.rooms = {}; ROOMS.forEach(r => { S.rooms[r.id] = r.items ? JSON.parse(JSON.stringify(r.items)) : (S.castle || []); });
  S.room = 'foyer'; S.walls = { master: S.wall || 0 };
}
const NO_OUTFIT = () => ({ lashes: false, dress: 'none', crown: false, wand: false, bow: false, necklace: false, blush: false, gloss: false, shadow: false, glitter: false, glasses: false, flower: false });
if (!S.pippiOutfit) S.pippiOutfit = Object.assign(NO_OUTFIT(), { bow: true });
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ---------- sounds ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, d, type = 'sine', vol = .18, f2) {

const snd = {
  pop: () => tone(520, 0, .12, 'sine', .2, 900),
  boop: () => tone(300, 0, .1, 'triangle', .15),
  sparkle: () => [1047, 1319, 1568, 2093, 1568, 2093].forEach((f, i) => tone(f, i * .06, .25, 'sine', .09)),
  chirp: () => { tone(1800, 0, .08, 'sine', .14, 2600); tone(1900, .12, .08, 'sine', .14, 2800); },
  giggle: () => [660, 880, 740, 990].forEach((f, i) => tone(f, i * .08, .12, 'triangle', .12)),
  trash: () => tone(400, 0, .25, 'sawtooth', .07, 120),
  step: () => tone(240, 0, .05, 'triangle', .07)

function burst(parent, x, y, n = 10, list = FXE) {
  for (let i = 0; i < n; i++) {
    const e = document.createElement('div'); e.className = 'fx';
    e.textContent = list[Math.floor(Math.random() * list.length)];
    const a = Math.random() * Math.PI * 2, r = 40 + Math.random() * 70;
    e.style.left = x + 'px'; e.style.top = y + 'px';
    e.style.setProperty('--dx', Math.cos(a) * r + 'px'); e.style.setProperty('--dy', Math.sin(a) * r + 'px');
    parent.appendChild(e); setTimeout(() => e.remove(), 1000);
  }
}

const FLAT = { rug: 1, pond: 1 }; // lie on the floor, always behind standing things
const zOf = it => it.z != null ? 1000 + it.z : FLAT[it.k] ? 1 : Math.round(it.y * 10);
const wandOn = { v: false };
let sel = null; // {scene, item, el}
const selbar = $('#selbar');

function makeScene(name, el, tabsEl, rowEl, tabs) {
  const getList = () => name === 'castle' ? S.rooms[S.room] : S[name];
  let list = getList();
  function draw() {
    list = getList();
    el.querySelectorAll('.item').forEach(n => n.remove());
    list.forEach(it => el.appendChild(itemEl(it)));
    order();
  }
  function order() { [...el.querySelectorAll('.item')].forEach(n => { n.style.zIndex = zOf(n._it); }); }
  function itemEl(it) {
    const n = document.createElement('div'); n.className = 'item' + (it.f ? ' flip' : ''); n._it = it;
    n.innerHTML = '<div class="in">' + art(it.k) + '</div>';
    place(n); bind(n); return n;
  }
  function place(n) { const it = n._it; n.style.left = it.x + '%'; n.style.top = it.y + '%'; n.style.width = (CAT[it.k].w * it.s * sceneScale()) + 'px'; }
  function sceneScale() { return Math.max(.6, Math.min(1.5, el.clientWidth / 420, el.clientHeight / 560)); }
  function bind(n) {
    let sx, sy, ox, oy, moved, id;
    n.addEventListener('pointerdown', ev => {
      ev.stopPropagation(); id = ev.pointerId; n.setPointerCapture(id);
      const r = el.getBoundingClientRect(); sx = ev.clientX; sy = ev.clientY; ox = n._it.x; oy = n._it.y; moved = false; n._r = r;
    });
    n.addEventListener('pointermove', ev => {
      if (ev.pointerId !== id || sx == null) return;
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 8) return;
      moved = true;
      if (walker(n)) { if (!n._walking) line(n._it.x, n._it.y, (ev.clientX - n._r.left) / n._r.width * 100, (ev.clientY - n._r.top) / n._r.height * 100); return; }
      n._it.x = Math.max(0, Math.min(100, ox + dx / n._r.width * 100));
      n._it.y = Math.max(5, Math.min(100, oy + dy / n._r.height * 100));
      place(n); n.style.zIndex = zOf(n._it);
    });
    const up = ev => {
      if (ev.pointerId !== id || sx == null) return; sx = null;
      if (moved && walker(n)) { if (n._walking) { line(); return; } walkMolly(n, ev.clientX, ev.clientY); return; }
      if (moved) { save(); select(n); return; }
      tapItem(n);
    };
    n.addEventListener('pointerup', up); n.addEventListener('pointercancel', up);
  }
  /* Molly walks where you drag (Wonderland only); Pippi follows; walking into the castle goes inside */
  const walker = n => name === 'land' && n._it.k === 'molly' && !wandOn.v;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let lineEl = null;
  function line(x1, y1, x2, y2) {
    if (x1 == null) { if (lineEl) lineEl.remove(); lineEl = null; return; }
    if (!lineEl) { lineEl = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); lineEl.setAttribute('class', 'walkline'); el.appendChild(lineEl); }
    const r = el.getBoundingClientRect(), X = v => v / 100 * r.width, Y = v => v / 100 * r.height;
    lineEl.setAttribute('viewBox', '0 0 ' + r.width + ' ' + r.height);
    lineEl.innerHTML = '<line x1="' + X(x1) + '" y1="' + Y(y1) + '" x2="' + X(x2) + '" y2="' + Y(y2) + '" stroke="#fff" stroke-width="7" stroke-dasharray="2 14" stroke-linecap="round"/>' +
      '<line x1="' + X(x1) + '" y1="' + Y(y1) + '" x2="' + X(x2) + '" y2="' + Y(y2) + '" stroke="#d65db1" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>' +
      '<circle cx="' + X(x2) + '" cy="' + Y(y2) + '" r="11" fill="#ff6fb1" stroke="#fff" stroke-width="4"/>';
  }
  function walkTo(n, tx, ty) {
    return new Promise(res => {
      const it = n._it, sx = it.x, sy = it.y, r = el.getBoundingClientRect();
      const dist = Math.hypot((tx - sx) * r.width / 100, (ty - sy) * r.height / 100);
      const dur = Math.max(350, dist / 150 * 1000), t0 = performance.now(); let step = 0;
      n.classList.add('walk');
      (function f(now) {
        const k = Math.min(1, (now - t0) / dur);
        it.x = sx + (tx - sx) * k; it.y = sy + (ty - sy) * k; place(n);
        n.style.zIndex = zOf(it);
        if (now - step > 230) { step = now; snd.step(); }
        if (k < 1) requestAnimationFrame(f); else { n.classList.remove('walk'); res(); }
      })(t0);
    });
  }
  async function walkMolly(n, cx, cy) {
    n._walking = true;
    const r = el.getBoundingClientRect();
    let tx = Math.max(2, Math.min(98, (cx - r.left) / r.width * 100)), ty = Math.max(30, Math.min(100, (cy - r.top) / r.height * 100));
    const items = [...el.querySelectorAll('.item')];
    const castle = items.find(c => { if (c._it.k !== 'castle') return false; const b = c.getBoundingClientRect(); return cx >= b.left && cx <= b.right && cy >= b.top && cy <= b.bottom; });
    if (castle) { tx = castle._it.x; ty = castle._it.y; }
    line(n._it.x, n._it.y, tx, ty);
    const pip = items.find(c => c._it.k === 'pippi' && !c._walking);
    const back = tx >= n._it.x ? -7 : 7;
    let pw = Promise.resolve();
    if (pip) { pip._walking = true; pw = wait(350).then(() => walkTo(pip, castle ? tx : Math.max(2, Math.min(98, tx + back)), castle ? ty : Math.min(100, ty + 2))); }

    if (pip) { pip.classList.add('enter'); snd.chirp(); }
    await wait(700);
    n._walking = false; if (pip) pip._walking = false; save();
    enterCastle(!!pip);
  }
  function tapItem(n) {
    const k = n._it.k, r = el.getBoundingClientRect(), b = n.getBoundingClientRect();
    if (k === 'pippi') snd.chirp(); else if (k === 'molly') snd.giggle(); else snd.boop();
    n.classList.remove('dance'); void n.offsetWidth; n.classList.add('dance'); setTimeout(() => n.classList.remove('dance'), 900);
    if (wandOn.v) { snd.sparkle(); burst(el, b.left - r.left + b.width / 2, b.top - r.top + b.height / 2, 14); deselect(); return; }
    select(n);
  }
  function add(k, x, y, grow) {
    const it = { k, x: x != null ? x : 30 + Math.random() * 40, y: y != null ? y : (name === 'land' ? 60 : 70) + Math.random() * 25, s: 1 };

      const fl = ['f1', 'f2', 'f3', 'f4', 'f5', 'heart', 'star', 'a5'];
      const n = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) {
        const px = (x + (Math.random() - .5) * 120) / r.width * 100, py = (y + (Math.random() - .3) * 60) / r.height * 100;
        setTimeout(() => add(fl[Math.floor(Math.random() * fl.length)], Math.max(2, Math.min(98, px)), Math.max(20, Math.min(99, py)), true), i * 90);
      }
    } else {
      const fl = ['heart', 'star', 'sparkle', 'c2', 'c15', 'c16'];
      add(fl[Math.floor(Math.random() * fl.length)], x / r.width * 100, Math.max(15, y / r.height * 100 + 4), true);
    }
  });
  // tray
  let tab = 0;
  function tray() {
    tabsEl.innerHTML = tabs.map((t, i) => '<button class="' + (i === tab ? 'on' : '') + '" data-t="' + i + '">' + t[0] + '</button>').join('');
    rowEl.innerHTML = tabs[tab][1].map(k => '<button data-k="' + k + '">' + icon(k) + '</button>').join('');
    rowEl.scrollLeft = 0;
  }
  tabsEl.addEventListener('click', ev => { const b = ev.target.closest('button'); if (!b) return; tab = +b.dataset.t; snd.boop(); tray(); });
  let rowDown = null;
  rowEl.addEventListener('pointerdown', ev => { rowDown = { x: ev.clientX, y: ev.clientY }; });
  rowEl.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (rowDown && Math.abs(ev.clientX - rowDown.x) > 10) return;

}

function select(n) {
  if (sel && sel.el !== n) sel.el.classList.remove('sel');
  const scene = n.closest('.scene') === landS.el ? landS : castleS;
  sel = { el: n, scene }; n.classList.add('sel'); selbar.classList.add('on');
  scene.el.appendChild(selbar);
}
function deselect() { if (sel) sel.el.classList.remove('sel'); sel = null; selbar.classList.remove('on'); }
selbar.addEventListener('pointerdown', ev => ev.stopPropagation());
selbar.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b || !sel) return;
  const it = sel.el._it, sc = sel.scene, a = b.dataset.a;
  if (a === 'big') { it.s = Math.min(3.5, it.s * 1.2); snd.pop(); }
  if (a === 'small') { it.s = Math.max(.35, it.s / 1.2); snd.boop(); }
  if (a === 'flip') { it.f = !it.f; sel.el.classList.toggle('flip', !!it.f); snd.boop(); }
  if (a === 'front') { const m = Math.max(0, ...sc.list.map(i => i.z || 0)); it.z = m + 1; sc.order(); snd.boop(); }
  if (a === 'del') { sc.list.splice(sc.list.indexOf(it), 1); sel.el.remove(); snd.trash(); deselect(); save(); return; }
  if (a === 'done') { deselect(); snd.boop(); return; }
  sc.place(sel.el); save();
});

const landS = makeScene('land', $('#landScene'), $('#landTabs'), $('#landRow'), LAND_TABS);
const castleS = makeScene('castle', $('#castleScene'), $('#castleTabs'), $('#castleRow'), CASTLE_TABS);

async function enterCastle(withPippi) {
  S.room = 'foyer';
  go('castle');
  const L = castleS.list, wanted = withPippi ? ['molly', 'pippi'] : ['molly'];
  wanted.forEach(k => { if (!L.some(i => i.k === k)) L.push({ k, x: 50, y: 90, s: 1 }); });
  castleS.draw();
  const els = [...castleS.el.querySelectorAll('.item')];
  const m = els.find(e => e._it.k === 'molly'), p = withPippi && els.find(e => e._it.k === 'pippi');
  [[m, 50], [p, 58]].forEach(([e, sx]) => { if (e) { e._it.x = sx; e._it.y = 100; castleS.place(e); } });
  const pw = p ? new Promise(r => setTimeout(r, 400)).then(() => castleS.walkTo(p, 58, 92)) : null;
  await castleS.walkTo(m, 47, 87);
  if (pw) await pw;
  snd.giggle(); save();
}

    const on = t === 'dress' || t === 'shoes' ? (o[t] || 'none') === k : !!o[k];
    const face = v.startsWith('#') ? '<span class="sw" style="background:' + v + '"></span>' : v;
    return '<button class="' + (on ? 'on' : '') + '" data-t="' + t + '" data-k="' + k + '">' + face + '<small>' + l + '</small></button>';
  }).join('') + '</div>').join('');
}
$('#dOpts').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.who) { who = b.dataset.who; dressDraw(); who === 'pippi' ? snd.chirp() : snd.giggle(); return; }
  const o = outfit();
  if (b.dataset.t === 'dress' || b.dataset.t === 'shoes') o[b.dataset.t] = b.dataset.k; else o[b.dataset.k] = !o[b.dataset.k];
  save(); dressDraw(); snd.sparkle();
  const st = $('.stage'), r = st.getBoundingClientRect(); burst(st, r.width / 2, r.height / 2, 10);
});
$('#dMolly').addEventListener('click', () => {
  const m = $('#dMolly'); m.classList.remove('hop'); void m.offsetWidth; m.classList.add('hop'); who === 'pippi' ? snd.chirp() : snd.giggle();
  if (outfit().wand) { snd.sparkle(); const st = $('.stage'), r = st.getBoundingClientRect(); burst(st, r.width * .7, r.height * .35, 16); }
});
$('#view3d').onclick = () => {
  snd.sparkle();
  const enc = x => encodeURIComponent(JSON.stringify(x));
  $('#viewer3d iframe').src = 'molly-3d.html#who=' + who + '&m=' + enc(S.outfit) + '&p=' + enc(S.pippiOutfit);
  $('#viewer3d').classList.add('on');
};
$('#close3d').onclick = () => {
  $('#viewer3d').classList.remove('on'); $('#viewer3d iframe').src = 'about:blank'; snd.boop();
  try { const n = JSON.parse(localStorage.getItem(KEY) || 'null'); if (n && n.rooms) { S.rooms = n.rooms; S.seed3d = n.seed3d; } } catch (e) {}   // pick up changes made in 3D
  if ($('#castle').classList.contains('on')) castleS.draw();
};
$('#dressReset').onclick = () => { if (who === 'molly') S.outfit = NO_OUTFIT(); else S.pippiOutfit = NO_OUTFIT(); save(); dressDraw(); snd.boop(); };

/* ---------- home + nav ---------- */
function homeDraw() {
  $('#hMolly').innerHTML = A.molly(S.outfit); $('#hPippi').innerHTML = A.pippi(S.pippiOutfit);
  $('#hRain').innerHTML = A.PIECES.rainbow; $('#hCastle').innerHTML = A.PIECES.castle; $('#hTree').innerHTML = A.PIECES.pinktree;
}
$('#hPippi').onclick = e => { const p = e.currentTarget; p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop'); snd.chirp(); };
$('#hMolly').onclick = e => { const p = e.currentTarget; p.classList.remove('hop'); void p.offsetWidth; p.classList.add('hop'); snd.giggle(); };

function go(id) {
  deselect();
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  if (id === 'home') homeDraw();
  if (id === 'land') { landS.draw(); landS.tray(); sky(); sunDraw(); }
  if (id === 'castle') { castleS.draw(); castleS.setTab(ROOM_TAB[S.room] || 0); wall(); }
  if (id === 'dress') dressDraw();
}
document.addEventListener('click', ev => { const b = ev.target.closest('[data-go]'); if (b) { snd.pop(); go(b.dataset.go); } });
window.addEventListener('resize', () => { landS.el.querySelectorAll('.item').forEach(n => landS.place(n)); castleS.el.querySelectorAll('.item').forEach(n => castleS.place(n)); });
homeDraw();
</script>
</body>
</html>
