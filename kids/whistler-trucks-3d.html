<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #8fd3ff; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .round { font: inherit; font-size: 24px; width: 54px; height: 54px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.3); text-decoration: none; display: flex; align-items: center; justify-content: center; color: #1a1a1a; cursor: pointer; }
  #name { font-size: clamp(24px, 6vw, 40px); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #d62828, 5px 5px 0 #1a1a1a; text-align: center; }
  #pick { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(5, auto); gap: 8px; }
  @media (max-width: 560px) { #pick { grid-template-columns: repeat(2, auto); } }
  #pick button { font: inherit; font-size: 17px; font-weight: 800; padding: 12px 14px; border: 4px solid transparent; border-radius: 16px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; }
  #pick button.sel { border-color: #ffd60a; transform: translateY(-3px); }
  #jump, #crush { position: fixed; top: 76px; left: calc(50% - 82px); transform: translateX(-50%); font: inherit; font-size: 24px; font-weight: 900; padding: 12px 26px; border: none; border-radius: 18px; background: #ffd60a; color: #1a1a1a; box-shadow: 0 6px 0 #1a1a1a; cursor: pointer; }
  #crush { left: calc(50% + 82px); background: #ff8c1a; }

  @media (max-width: 520px) { body:not(.embed) #jump, body:not(.embed) #crush { font-size: 19px; padding: 10px 16px; } body:not(.embed) #jump { left: calc(50% - 68px); } body:not(.embed) #crush { left: calc(50% + 68px); } }
  #jump:active, #crush:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #1a1a1a; }
  /* in the game pop-up: a little round video button at the bottom */
  body.embed #jump, body.embed #crush { top: auto; bottom: 26px; width: 76px; height: 76px; padding: 0; border-radius: 50%; font-size: 36px; }
  #banner { position: fixed; bottom: 4%; left: 50%; transform: translate(-50%,0) scale(0); font-size: clamp(40px, 10vw, 84px); font-weight: 900; color: #ffd60a; text-shadow: 4px 4px 0 #d62828, 8px 8px 0 #1a1a1a; transition: transform .3s; pointer-events: none; white-space: nowrap; }
  #banner.show { transform: translate(-50%,0) scale(1); }

  /* race */
  #race { position: fixed; top: 136px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 22px; font-weight: 900; padding: 10px 24px; border: none; border-radius: 18px; background: #2e9e44; color: #fff; box-shadow: 0 6px 0 #1a1a1a; cursor: pointer; white-space: nowrap; }
  body.embed #race { top: auto; bottom: 26px; width: 76px; height: 76px; padding: 0; border-radius: 50%; font-size: 34px; }
  body.stunting #race, body.racing #pick, body.racing #jump, body.racing #crush, body.racing #race, body.racing #hint, body.racing #spin, body.racing #wheelie { visibility: hidden; }
  #raceX { position: fixed; top: 76px; right: 14px; display: none; }

  #racePick { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; z-index: 20; }

  #racePick .box { position: relative; background: #fff; border-radius: 22px; padding: 16px; width: min(92vw, 420px); text-align: center; box-shadow: 0 8px 0 #1a1a1a; }
  #racePick h2 { margin: 0 0 4px; font-size: 24px; }
  #racePick p { margin: 0 0 10px; font-size: 15px; color: #555; }
  #rpX { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border-radius: 50%; border: none; background: #eee; font-size: 20px; font-weight: 900; cursor: pointer; }
  #rpList { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  #rpList button { font: inherit; font-size: 17px; font-weight: 800; padding: 12px 8px; border-radius: 14px; border: 4px solid transparent; color: #fff; opacity: .4; cursor: pointer; }
  #rpList button.on { opacity: 1; border-color: #ffd60a; }
  #rpGo { margin-top: 12px; font: inherit; font-size: 24px; font-weight: 900; padding: 12px 30px; border: none; border-radius: 16px; background: #2e9e44; color: #fff; box-shadow: 0 5px 0 #1a1a1a; cursor: pointer; }
  #rpGo:disabled { opacity: .4; }
  #hint { position: fixed; top: 196px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.85); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 15px; transition: opacity .6s; pointer-events: none; }

<script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { TRUCKS, std, mesh, buildTruck, schoolBus, car3d, TIRE_R, buildArena, Exhaust, bump } from "./trucks3d.js?v=5";


/* ---------- scene ---------- */
const view = document.getElementById('view');
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(ren.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8fd3ff');
scene.fog = new THREE.Fog('#8fd3ff', 60, 170);

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
// far enough back that the truck driving laps around the ring never runs into the camera
function fitCam() { const asp = innerWidth / innerHeight, far = asp < 1 ? Math.min(30, 14 / asp) : 13.5; cam.position.set(far * 0.62, 5 + (far - 13.5) * .12, far * 0.78); }
fitCam();
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.target.set(0, 1.5, 0);
ctl.minDistance = 4; ctl.maxDistance = 30; ctl.maxPolarAngle = Math.PI * 0.68; ctl.enablePan = false;
const GROUND_Y = .08;   // the camera never goes below the ground (low enough to peek up under the truck)
function keepAboveGround() { if (cam.position.y < GROUND_Y) cam.position.y = GROUND_Y; }
ctl.autoRotate = false; ctl.autoRotateSpeed = 2.2;   // the truck drives laps instead of the view spinning
let driving = true, lapA = 0;
const LAP_R = 4.4, LAP_V = 3.2;   // drives around the yellow ring

scene.add(new THREE.HemisphereLight('#ffffff', '#8b5a2b', 1.4));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(5, 9, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
scene.add(sun);
const underLight = new THREE.DirectionalLight('#ffffff', 1.1); underLight.position.set(1, -6, 2); scene.add(underLight);   // lights the underside

const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshStandardMaterial({ color: '#8b5a2b', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(4.2, 4.6, 64), new THREE.MeshStandardMaterial({ color: '#ffd60a', roughness: .8 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; scene.add(ring);
const arena = buildArena(); scene.add(arena);   // outdoor arena with cheering fans
const smoke = new Exhaust(scene);


/* ---------- picker ---------- */
const trucks = TRUCKS.map(buildTruck);
let current = null;
const pick = document.getElementById('pick');
TRUCKS.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.name; b.style.background = t.body;
  b.onclick = () => show(i);
  pick.appendChild(b);
});
let curIdx = 0;
function show(i) {
  curIdx = i;
  if (current) scene.remove(current);
  current = trucks[i]; current.position.y = 3; current.userData.drop = 0;
  scene.add(current);
  document.getElementById('name').textContent = TRUCKS[i].name;
  [...pick.children].forEach((b, k) => b.classList.toggle('sel', k === i));
}
// ?truck=0-3 opens that truck; ?embed=1 is the pop-up inside the game (no picker, no home button)
const qs = new URLSearchParams(location.search);
show(Math.min(TRUCKS.length - 1, Math.max(0, parseInt(qs.get('truck'), 10) || 0)));
if (qs.has('embed')) {
  document.body.classList.add('embed');
  document.getElementById('jump').textContent = '🎬';
  document.getElementById('jump').setAttribute('aria-label', 'Play the jump');
  document.getElementById('crush').textContent = '💥';
  document.getElementById('crush').setAttribute('aria-label', 'Crush the cars');
  document.getElementById('race').textContent = '🏁';
  document.getElementById('race').setAttribute('aria-label', 'Race');
  pick.style.display = 'none';
  document.querySelector('#top a').style.visibility = 'hidden';
}

const spinBtn = document.getElementById('spin');
// 🔄 = drive laps on / park in the middle
spinBtn.onclick = () => { driving = !driving; spinBtn.style.opacity = driving ? 1 : .5; if (!driving && current) { current.position.x = 0; current.position.z = 0; current.rotation.y = 0; } };
ctl.addEventListener('start', () => { document.getElementById('hint').style.opacity = 0; });

// 🛞 wheelie: front wheels pop up, balances on the back wheels, then slams down
let wh = null;
const WH_T = 2.2, WH_UP = .35, WH_DOWN = .4, WH_MAX = .55, AXLE_X = 1.2;
document.getElementById('wheelie').onclick = () => {
  if (wh || stunt || !current) return;
  wh = { t: 0 }; startEngine(); engineRev(95); sayVO('wheelie');
};


/* ---------- jump stunt ---------- */
const RAMP_H = 2.6, RAMP_L = 4.5, LAUNCH = 6.5;            // ramps end/start at x = ±6.5
const TH = Math.atan(RAMP_H / RAMP_L), VX = 15, G = 20, VY = VX * Math.tan(TH);
const T_GROUND = 1.0, T_RAMP = RAMP_L / VX, T_AIR = 2 * LAUNCH / VX, T_RUN = 1.5;
const START_X = -LAUNCH - RAMP_L - VX * T_GROUND;
let stunt = null, stuntSet = null;
// two lanes: the truck you picked drives the near lane, a buddy truck (the next one in the list) races the far lane
const LANE = 3.2, BUDDY_LAG = .18;
let buddy = null, smoke2 = null;

/* ---------- dirt track for the jump and the crush ----------
   72 long, 14 wide: room for the ramps, buses and cars, and two monster trucks side by side.
   Packed dirt with tire ruts, loose dirt berms along both sides, dirt clods, lighter arena floor around it. */
const TRACK_L = 72, TRACK_W = 14;
let dirtTex = null;
function dirtTexture() {
  if (dirtTex) return dirtTex;
  const W = 1024, H = 256, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {          // speckled dirt
    const n = Math.random(), k = (y * W + x) * 4, v = 0.82 + n * .3 + (Math.random() < .015 ? -.35 : 0);
    d[k] = 112 * v; d[k + 1] = 74 * v; d[k + 2] = 42 * v; d[k + 3] = 255;
  }
  c.putImageData(img, 0, 0);
  // tire ruts: two lanes (one per truck), each a pair of darker, packed wheel tracks
  [-3.2, 3.2].forEach(lane => [-1.27, 1.27].forEach(w => {
    const y = (lane + w + TRACK_W / 2) / TRACK_W * H;
    c.fillStyle = 'rgba(55,34,18,.45)'; c.fillRect(0, y - 9, W, 18);
    c.fillStyle = 'rgba(40,24,12,.35)';
    for (let x = 0; x < W; x += 14) c.fillRect(x, y - 8, 6, 16);       // tread marks
  }));
  // a few darker wet patches
  for (let i = 0; i < 26; i++) { c.fillStyle = 'rgba(60,38,20,.25)'; c.beginPath(); c.ellipse(Math.random() * W, Math.random() * H, 20 + Math.random() * 60, 8 + Math.random() * 20, 0, 0, 7); c.fill(); }
  dirtTex = new THREE.CanvasTexture(cv); dirtTex.colorSpace = THREE.SRGBColorSpace; dirtTex.wrapS = THREE.RepeatWrapping; dirtTex.repeat.set(3, 1); dirtTex.anisotropy = 8;
  return dirtTex;
}
function dirtTrack() {
  const g = new THREE.Group();
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: '#9a7650', roughness: 1 }));   // packed arena floor
  floor.rotation.x = -Math.PI / 2; floor.position.y = .002; floor.receiveShadow = true; g.add(floor);
  const track = new THREE.Mesh(new THREE.PlaneGeometry(TRACK_L, TRACK_W), new THREE.MeshStandardMaterial({ map: dirtTexture(), roughness: 1 }));
  track.rotation.x = -Math.PI / 2; track.position.y = .006; track.receiveShadow = true; g.add(track);
  const dirt = new THREE.MeshStandardMaterial({ color: '#6b4626', roughness: 1, flatShading: true });
  [-1, 1].forEach(side => {
    // berm: a long mound of loose dirt, lumpy so it doesn't look like a pipe
    const geo = new THREE.CylinderGeometry(1.3, 1.3, TRACK_L, 10, 24, false, 0, Math.PI);
    const p = geo.attributes.position;
    for (let i = 0; i < p.count; i++) { const r = Math.hypot(p.getX(i), p.getZ(i)); if (r > .5) { const s = 1 + (Math.random() - .5) * .22; p.setX(i, p.getX(i) * s); p.setZ(i, p.getZ(i) * s); } }
    geo.computeVertexNormals();
    const berm = new THREE.Mesh(geo, dirt); berm.rotation.z = Math.PI / 2;   // lies along the track, rounded side up
    berm.scale.set(.75, 1, 1); berm.position.set(0, 0, side * (TRACK_W / 2 + .9));
    berm.castShadow = berm.receiveShadow = true; g.add(berm);
    // rounded ends
    [-1, 1].forEach(e => { const cap = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 8, 0, Math.PI * 2, 0, Math.PI / 2), dirt); cap.scale.set(1, .75, 1); cap.position.set(e * TRACK_L / 2, 0, side * (TRACK_W / 2 + .9)); cap.castShadow = true; g.add(cap); });
  });
  // dirt clods along the edges of the track
  const clod = new THREE.DodecahedronGeometry(.18, 0);
  for (let i = 0; i < 90; i++) {
    const m = new THREE.Mesh(clod, dirt), side = Math.random() < .5 ? -1 : 1;
    m.position.set((Math.random() - .5) * TRACK_L * .95, .08, side * (TRACK_W / 2 - Math.random() * 1.6));
    m.scale.setScalar(.6 + Math.random() * 1.4); m.rotation.set(Math.random() * 3, Math.random() * 3, 0); m.castShadow = true; g.add(m);
  }
  return g;
}

function buildStuntSet() {
  const g = new THREE.Group();
  g.add(dirtTrack());
  const rampMat = std('#8a8a8a', { metalness: .5, roughness: .4 });
  const stripe = std('#ffd60a');
  const wedge = pts => { const m = mesh(new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(p => new THREE.Vector2(...p))), { depth: 3.4, bevelEnabled: false }), rampMat); m.position.z = -1.7; return m; };
  [-LANE, LANE].forEach(z => {                  // ramps and a row of buses in each lane
    const up = wedge([[-LAUNCH - RAMP_L, 0], [-LAUNCH, 0], [-LAUNCH, RAMP_H]]), down = wedge([[LAUNCH, RAMP_H], [LAUNCH, 0], [LAUNCH + RAMP_L, 0]]);
    up.position.z = down.position.z = z - 1.7; g.add(up, down);
    [-1, 1].forEach(s => { const lip = mesh(new THREE.BoxGeometry(.12, .1, 3.45), stripe); lip.position.set(s * LAUNCH, RAMP_H, z); g.add(lip); });
    [-3.6, -1.2, 1.2, 3.6].forEach(x => { const b = schoolBus(); b.position.set(x, 0, z + .55); g.add(b); });
  });
  return g;
}

// sound: engine rumble while driving, thud on landing
let actx = null, engine = null;
function startEngine() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const t = actx.currentTime, lp = actx.createBiquadFilter(), g = actx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 4; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .1);
    const oscs = [0, 70].map(d => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 40; o.detune.value = d; o.connect(lp); o.start(); return o; });
    lp.connect(g).connect(actx.destination);
    engine = { oscs, g };
  } catch (e) { engine = null; }
}
function engineRev(f) { if (engine) engine.oscs.forEach(o => o.frequency.setTargetAtTime(f, actx.currentTime, .15)); }
function stopEngine() { if (!engine) return; const t = actx.currentTime; engine.g.gain.setTargetAtTime(.0001, t, .2); engine.oscs.forEach(o => o.stop(t + 1)); engine = null; }
function thud() {
  if (!actx) return;
  const n = actx.sampleRate * .4, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 1.2; s.connect(f).connect(g).connect(actx.destination); s.start();
}

function startJump(kind = 'jump') {
  if (stunt || !current) return;
  const set = kind === 'crush' ? buildCrushSet() : (stuntSet = stuntSet || buildStuntSet());
  scene.add(set); ring.visible = false;
  document.getElementById('banner').textContent = kind === 'crush' ? 'CRUSHED!' : 'BIG JUMP!';
  scene.fog.near = 60; scene.fog.far = 170;
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); sun.shadow.camera.updateProjectionMatrix();
  document.body.classList.add('stunting');
  ctl.enabled = true; ctl.autoRotate = false;   // drag to look around the truck while it plays
  current.userData.drop = 1;
  stunt = { kind, set, tau: -0.9, landed: false, snap: true };
  buddy = trucks[(curIdx + 1) % trucks.length]; buddy.position.set(0, 0, -LANE); buddy.rotation.set(0, 0, 0); scene.add(buddy);
  smoke2 = smoke2 || new Exhaust(scene);
  if (wh) { wh = null; stopEngine(); }
  startEngine();
}

function endJump() {
  scene.remove(stunt.set); ring.visible = true;
  if (buddy) { scene.remove(buddy); buddy = null; }
  scene.fog.near = 60; scene.fog.far = 170;
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); sun.shadow.camera.updateProjectionMatrix();
  current.position.set(0, 0, 0); current.rotation.set(0, 0, 0);
  sun.position.set(5, 9, 4); sun.target.position.set(0, 0, 0);
  fitCam(); ctl.target.set(0, 1.5, 0); ctl.enabled = true; ctl.autoRotate = false;
  document.body.classList.remove('stunting');
  document.getElementById('banner').classList.remove('show');
  stopEngine(); stunt = null;
}

// where a truck is at time tau in the jump (k keeps each truck's own landing thud)
function jumpPose(tau, s, k) {
  const t1 = T_GROUND, t2 = t1 + T_RAMP, t3 = t2 + T_AIR, t4 = t3 + T_RAMP, t5 = t4 + T_RUN;
  let x, y = 0, pitch = 0, speed = VX, inAir = false, rev = 45;
  if (tau < 0) { x = START_X; speed = 0; y = Math.abs(Math.sin(tau * 40)) * .03; rev = 55; }
  else if (tau < t1) { x = START_X + VX * tau; rev = 70; }
  else if (tau < t2) { x = START_X + VX * tau; y = (x - (-LAUNCH - RAMP_L)) * Math.tan(TH); pitch = TH; rev = 85; }
  else if (tau < t3) { const ta = tau - t2; x = -LAUNCH + VX * ta; y = RAMP_H + VY * ta - G * ta * ta / 2; pitch = Math.atan2(VY - G * ta, VX); inAir = true; rev = 95; }
  else if (tau < t4) { if (k !== null && !s['landed' + k]) { s['landed' + k] = true; thud(); } x = LAUNCH + VX * (tau - t3); y = RAMP_H - (x - LAUNCH) * Math.tan(TH); pitch = -TH; rev = 60; }
  else if (tau < t5) {
    const tr = tau - t4, a = VX / T_RUN;
    x = LAUNCH + RAMP_L + VX * tr - a * tr * tr / 2; speed = VX - a * tr;
    y = .35 * Math.exp(-5 * tr) * Math.abs(Math.sin(tr * 11));
    pitch = -.08 * Math.exp(-4 * tr) * Math.sin(tr * 11);
  }
  else { x = LAUNCH + RAMP_L + VX * T_RUN / 2; speed = 0; }

}
function poseTruck(truck, p, z, dt, scale, tau) {
  truck.position.set(p.x, p.y, z);
  truck.rotation.set(0, 0, p.pitch);
  if (!p.inAir && p.speed > 0) { const b = bump(tau, true); truck.position.y += b.y; truck.rotation.x = b.rx; truck.rotation.z += b.rz; }   // bump along
  truck.userData.wheels.forEach(w => w.rotation.z -= dt * scale * p.speed / TIRE_R);
}
function stuntStep(dt) {
  const s = stunt;
  const scale = jumpPose(s.tau, s, null).inAir ? .38 : 1;     // slow motion over the buses
  s.tau += dt * scale;
  const a = jumpPose(s.tau, s, ''), b = jumpPose(s.tau - BUDDY_LAG, s, '2');   // your truck, and the buddy a split second behind
  if (a.done && b.done) return endJump();
  engineRev(a.rev);
  if (a.airT > T_AIR * .25) { document.getElementById('banner').classList.add('show'); if (!s.said) { s.said = 1; sayVO('big_jump'); } }
  poseTruck(current, a, LANE, dt, scale, s.tau);
  if (buddy) poseTruck(buddy, b, -LANE, dt, scale, s.tau + 7);
  const x = a.x, y = a.y;
  sun.position.set(x + 5, 9, 4); sun.target.position.set(x, 0, 0);

  // chase camera from the side, far enough back to see both lanes
  const zoff = 16 * Math.max(1, .85 / cam.aspect);   // back up on narrow phone screens
  const want = new THREE.Vector3(x - 5, 4.6 + y * .4 + (zoff - 16) * .15, zoff), look = new THREE.Vector3(x + 1.5, 1.8 + y * .5, 0);
  followCam(s, want, look);
}
// The camera rides along with the truck; dragging turns it around the truck (kept until the stunt ends).
function followCam(s, want, look) {
  if (s.snap) { cam.position.copy(want); ctl.target.copy(look); s.snap = false; }
  else { cam.position.add(look.clone().sub(ctl.target)); ctl.target.copy(look); }

}
scene.add(sun.target);
document.getElementById('jump').onclick = () => startJump('jump');
document.getElementById('crush').onclick = () => startJump('crush');

/* ---------- crush stunt: drive over 4 cars ---------- */
const CRUSH_X = [-2.9, -1.45, 0, 1.45, 2.9], CRUSH_START = -15, CRUSH_END = 12, CRUSH_V = 6.5, CAR_HALF = .68;   // 5 cars side by side
const CAR_COLORS = ['#e53935', '#1e63d6', '#fdd835', '#2e9e44', '#8e44ad', '#fb8c00'];
function buildCrushSet() {
  const g = new THREE.Group();
  g.add(dirtTrack());
  // a row of cars in each lane: [your lane, buddy's lane]
  g.userData.lanes = [LANE, -LANE].map(z => {
    const colors = [...CAR_COLORS].sort(() => Math.random() - .5);
    return CRUSH_X.map((x, i) => {
      const c = car3d(colors[i % colors.length]); c.position.set(x, 0, z); c.rotation.y = Math.PI / 2; c.userData.crush = 0; c.userData.hit = false;   // sideways across the path
      c.userData.tilt = (Math.random() - .5) * .25; g.add(c); return c;
    });
  });
  return g;
}
// one truck driving over its lane of cars: squash each car when the front tires reach it, ride up on top of them
function rideCars(truck, x, speed, cars, st, dt, tau, z) {
  let crushed = 0;
  cars.forEach(c => {
    const u = c.userData;
    if (!u.hit && x + 1.2 >= c.position.x - CAR_HALF - .25) { u.hit = true; thud(); }
    if (u.hit && u.crush < 1) u.crush = Math.min(1, u.crush + dt * 4);
    const k = 1 - Math.pow(1 - u.crush, 3);
    c.scale.set(1 + .05 * k, 1 - .7 * k, 1 + .08 * k);
    c.rotation.z = u.tilt * k;
    if (u.crush >= 1) crushed++;
  });
  const topAt = wx => { let h = 0; cars.forEach(c => { if (Math.abs(wx - c.position.x) < CAR_HALF + .15) h = Math.max(h, 1.15 * c.scale.y); }); return h; };
  const hf = topAt(x + 1.2), hr = topAt(x - 1.2);
  const wantY = (hf + hr) / 2, wantP = Math.atan2(hf - hr, 2.4);
  const k = 1 - Math.exp(-dt * 16);
  st.y = (st.y ?? 0) + (wantY - (st.y ?? 0)) * k;
  st.p = (st.p ?? 0) + (wantP - (st.p ?? 0)) * k;
  const shake = speed ? Math.sin(tau * 50) * .02 : 0;
  truck.position.set(x, st.y + Math.abs(shake), z);
  truck.rotation.set(shake * .5, 0, st.p);
  if (speed) { const b = bump(tau, true); truck.position.y += b.y * .7; truck.rotation.x += b.rx; truck.rotation.z += b.rz; }
  truck.userData.wheels.forEach(w => w.rotation.z -= dt * speed / TIRE_R);
  return crushed;
}
function crushStep(dt) {
  const s = stunt, [mine, theirs] = s.set.userData.lanes;
  s.tau += dt;
  const runT = (CRUSH_END - CRUSH_START) / CRUSH_V;
  if (s.tau > runT + BUDDY_LAG + 1.6) return endJump();
  const xAt = tau => tau < 0 ? CRUSH_START : tau < runT ? CRUSH_START + CRUSH_V * tau : CRUSH_END;
  const spAt = tau => tau >= 0 && tau < runT ? CRUSH_V : 0;
  engineRev(s.tau < 0 ? 55 : s.tau < runT ? 75 : 45);
  s.a = s.a || {}; s.b = s.b || {};
  const x = xAt(s.tau);
  let crushed = rideCars(current, x, spAt(s.tau), mine, s.a, dt, s.tau, LANE);
  if (buddy) crushed += rideCars(buddy, xAt(s.tau - BUDDY_LAG), spAt(s.tau - BUDDY_LAG), theirs, s.b, dt, s.tau + 3, -LANE);
  if (crushed === mine.length + (buddy ? theirs.length : 0)) { document.getElementById('banner').classList.add('show'); if (!s.said) { s.said = 1; sayVO('crush'); } }
  sun.position.set(x + 5, 9, 4); sun.target.position.set(x, 0, 0);

  const zoff = 15 * Math.max(1, .85 / cam.aspect);   // far enough back to see both lanes
  const want = new THREE.Vector3(x - 4, 4.2 + (zoff - 15) * .15, zoff), look = new THREE.Vector3(x + 1.5, 1.2, 0);
  followCam(s, want, look);
}

/* ---------- voiceovers: the recorded line if there is one, otherwise the device voice ---------- */
const slugName = n => n.toLowerCase().replace(/[^a-z]+/g, '_');
const VO = { race_pick: 'Pick your racers!', race_3: 'Three!', race_2: 'Two!', race_1: 'One!', race_go: 'Go!', big_jump: 'Big jump! Monster truck jump!', crush: 'Crushed!', wheelie: 'Wheelie!' };
TRUCKS.forEach(t => { VO['race_win_' + slugName(t.name)] = t.name + ' wins!'; });
function speak(text) {
  if (!window.speechSynthesis) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 1; u.pitch = 1.1; speechSynthesis.speak(u); } catch (e) {}
}
function sayVO(key) {
  const text = VO[key] || key;
  try { if (window.KidVoice && KidVoice.has(key)) { KidVoice.play([key]).then(ok => { if (!ok) speak(text); }); return; } } catch (e) {}
  speak(text);
}

/* ---------- race: oval dirt track, pick the trucks, random winner ---------- */
const OV = { SL: 24, R: 15, W: 15, LAPS: 2 };          // straight length, middle radius of the turns, track width, laps
OV.P = 2 * OV.SL + 2 * Math.PI * OV.R;                  // one lap around the middle of the track
function ovalAt(s, d) {                                 // spot and heading at distance s around the track, d = lane (+ = outside)
  const { SL, R, P } = OV, h = SL / 2, r = R + d, arc = Math.PI * R;
  s = ((s % P) + P) % P;
  if (s < SL) return { x: -h + s, z: r, yaw: 0 };                                          // front straight
  s -= SL; if (s < arc) { const th = s / R; return { x: h + r * Math.sin(th), z: r * Math.cos(th), yaw: th }; }   // far turn
  s -= arc; if (s < SL) return { x: h - s, z: -r, yaw: Math.PI };                          // back straight
  s -= SL; const th = Math.PI + s / R; return { x: -h + r * Math.sin(th), z: r * Math.cos(th), yaw: th };          // near turn
}
let plainTex = null;
function plainDirtTexture() {
  if (plainTex) return plainTex;
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'), img = c.createImageData(S, S), d = img.data;
  for (let i = 0; i < S * S; i++) { const v = .82 + Math.random() * .3 + (Math.random() < .015 ? -.35 : 0); d[i * 4] = 112 * v; d[i * 4 + 1] = 74 * v; d[i * 4 + 2] = 42 * v; d[i * 4 + 3] = 255; }
  c.putImageData(img, 0, 0);
  for (let i = 0; i < 8; i++) { c.fillStyle = 'rgba(60,38,20,.25)'; c.beginPath(); c.ellipse(Math.random() * S, Math.random() * S, 10 + Math.random() * 30, 6 + Math.random() * 14, 0, 0, 7); c.fill(); }
  plainTex = new THREE.CanvasTexture(cv); plainTex.colorSpace = THREE.SRGBColorSpace; plainTex.wrapS = plainTex.wrapT = THREE.RepeatWrapping; plainTex.repeat.set(.12, .12); plainTex.anisotropy = 8;
  return plainTex;
}
let ovalSet = null;
function buildOvalSet() {
  const g = new THREE.Group(), h = OV.SL / 2;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: '#9a7650', roughness: 1 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = .004; floor.receiveShadow = true; g.add(floor);
  const stadium = r => { const sh = new THREE.Shape(); sh.moveTo(-h, r); sh.lineTo(h, r); sh.absarc(h, 0, r, Math.PI / 2, -Math.PI / 2, true); sh.lineTo(-h, -r); sh.absarc(-h, 0, r, -Math.PI / 2, Math.PI / 2, true); return sh; };
  const ringShape = stadium(OV.R + OV.W / 2); ringShape.holes.push(stadium(OV.R - OV.W / 2));
  const track = new THREE.Mesh(new THREE.ShapeGeometry(ringShape, 64), new THREE.MeshStandardMaterial({ map: plainDirtTexture(), roughness: 1 }));
  track.rotation.x = -Math.PI / 2; track.position.y = .01; track.receiveShadow = true; g.add(track);
  const infield = new THREE.Mesh(new THREE.ShapeGeometry(stadium(OV.R - OV.W / 2 - 1.8), 48), new THREE.MeshStandardMaterial({ color: '#5fae4a', roughness: 1 }));
  infield.rotation.x = -Math.PI / 2; infield.position.y = .012; infield.receiveShadow = true; g.add(infield);
  // dirt berms around the outside and the inside of the track
  const dirt = new THREE.MeshStandardMaterial({ color: '#6b4626', roughness: 1, flatShading: true }), lump = new THREE.SphereGeometry(1, 7, 5);
  [[OV.W / 2 + 1, 130], [-OV.W / 2 - .9, 70]].forEach(([d, n]) => {
    for (let i = 0; i < n; i++) {
      const p = ovalAt(i / n * OV.P, d), m = new THREE.Mesh(lump, dirt);
      m.position.set(p.x, 0, p.z); m.scale.set(1.2 + Math.random() * .5, .55 + Math.random() * .3, 1.2 + Math.random() * .5); m.rotation.y = Math.random() * 3;
      m.castShadow = m.receiveShadow = true; g.add(m);
    }
  });
  // checkered start / finish line across the front straight
  const cv = document.createElement('canvas'); cv.width = 32; cv.height = 256; const c = cv.getContext('2d');
  for (let y = 0; y < 32; y++) for (let x = 0; x < 4; x++) { c.fillStyle = (x + y) % 2 ? '#111' : '#fff'; c.fillRect(x * 8, y * 8, 8, 8); }
  const lt = new THREE.CanvasTexture(cv); lt.colorSpace = THREE.SRGBColorSpace; lt.magFilter = THREE.NearestFilter;
  const line = new THREE.Mesh(new THREE.PlaneGeometry(1.2, OV.W), new THREE.MeshStandardMaterial({ map: lt, roughness: .8 }));
  line.rotation.x = -Math.PI / 2; line.position.set(0, .02, OV.R); g.add(line);
  return g;
}
let race = null;
const smokes = {};
function startRace(list) {
  if (stunt || race || list.length < 2) return;
  ovalSet = ovalSet || buildOvalSet(); scene.add(ovalSet); ring.visible = false; ground.visible = false;
  if (wh) { wh = null; stopEngine(); }
  scene.remove(current);
  const n = list.length, gap = Math.min(3, (OV.W - 3) / Math.max(1, n - 1));
  const Tw = 15 + Math.random() * 4, win = Math.floor(Math.random() * n);   // who wins is random every race
  const racers = list.map((ti, k) => {
    const truck = trucks[ti]; scene.add(truck); truck.userData.drop = 1;
    return { ti, truck, d: (k - (n - 1) / 2) * gap, T: k === win ? Tw : Tw * (1.03 + Math.random() * .12),
             amp: (Math.random() - .5) * .08, k: 1 + Math.floor(Math.random() * 3), s: 0, done: false,   // amp/k: speeding up and slowing down, so the lead changes
             smoke: smokes[ti] || (smokes[ti] = new Exhaust(scene)) };
  });
  race = { racers, t: -3.3, win, snap: true, D: OV.LAPS * OV.P, s0: OV.SL / 2 - 3, shown: false, go: false };
  racers.forEach(r => { const p = ovalAt(race.s0, r.d); r.truck.position.set(p.x, 0, p.z); r.truck.rotation.set(0, p.yaw, 0); });
  Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 30, bottom: -30 }); sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(10, 40, 20); sun.target.position.set(0, 0, 0);
  const ban = document.getElementById('banner'); ban.style.fontSize = 'clamp(26px, 7vw, 64px)'; ban.classList.remove('show');
  document.body.classList.add('racing'); startEngine(); engineRev(50);
}
function raceStep(dt) {
  const R0 = race, ban = document.getElementById('banner');
  R0.t += dt;
  if (R0.t < 0) { const c = Math.ceil(-R0.t); if (c <= 3 && ban.textContent !== String(c)) { ban.textContent = String(c); ban.classList.add('show'); engineRev(50 + (3 - c) * 12); sayVO('race_' + c); } }
  else if (!R0.go) { R0.go = true; ban.textContent = 'GO!'; ban.classList.add('show'); engineRev(90); sayVO('race_go'); setTimeout(() => { if (race && !race.shown) ban.classList.remove('show'); }, 900); }
  let lead = R0.racers[0], allDone = true;
  R0.racers.forEach(r => {
    const u = Math.max(0, Math.min(1, R0.t / r.T));
    const ue = (u < .08 ? u * u / .16 : u - .04) / .96;                         // ease off the line
    const prog = Math.min(1, ue + r.amp * Math.sin(2 * Math.PI * r.k * u) * (1 - u));
    const s = prog * R0.D, ds = Math.max(0, s - r.s); r.s = s;
    if (u >= 1 && !r.done) r.done = true;
    if (!r.done) allDone = false;
    const p = ovalAt(R0.s0 + s, r.d), b = bump(R0.t * 1.3 + r.ti, ds > .001);
    r.truck.position.set(p.x, b.y, p.z); r.truck.rotation.set(b.rx, p.yaw, b.rz);
    r.truck.userData.wheels.forEach(w => w.rotation.z -= ds / TIRE_R);
    r.smoke.update(dt, r.truck, ds > .001 ? 24 : 7);
    if (r.s > lead.s) lead = r;
  });
  const w = R0.racers[R0.win];
  if (w.done && !R0.shown) { R0.shown = true; ban.textContent = '🏆 ' + TRUCKS[w.ti].name.toUpperCase() + ' WINS!'; ban.classList.add('show'); thud(); engineRev(60); sayVO('race_win_' + slugName(TRUCKS[w.ti].name)); }
  if (allDone && R0.t > Math.max(...R0.racers.map(r => r.T)) + 3) return endRace();
  // the camera follows the leader (the winner once they cross the line); drag to look around
  const f = R0.shown ? w : lead, look = new THREE.Vector3(f.truck.position.x, 1.5, f.truck.position.z);
  const back = Math.max(1, .85 / cam.aspect);   // from behind and to the side, so the trucks show side by side
  followCam(R0, look.clone().add(new THREE.Vector3(-15 * back, 12, 17 * back)), look);
}
function endRace() {
  race.racers.forEach(r => scene.remove(r.truck));
  scene.remove(ovalSet); ring.visible = true; ground.visible = true;
  scene.add(current); current.position.set(0, 0, 0); current.rotation.set(0, 0, 0); current.userData.drop = 0;
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); sun.shadow.camera.updateProjectionMatrix();
  sun.position.set(5, 9, 4); sun.target.position.set(0, 0, 0);
  fitCam(); ctl.target.set(0, 1.5, 0);
  const ban = document.getElementById('banner'); ban.classList.remove('show'); ban.style.fontSize = '';
  document.body.classList.remove('racing'); stopEngine(); race = null;
}
// race picker
const rp = document.getElementById('racePick'), rpList = document.getElementById('rpList'), rpGo = document.getElementById('rpGo');
let rpSel = [];
function drawRp() { [...rpList.children].forEach(b => b.classList.toggle('on', rpSel.includes(+b.dataset.i))); rpGo.disabled = rpSel.length < 2; }
document.getElementById('race').onclick = () => {
  if (stunt || race) return;
  rpSel = [curIdx, (curIdx + 1) % TRUCKS.length];
  rpList.innerHTML = TRUCKS.map((t, i) => `<button data-i="${i}" style="background:${t.body}">${t.name}</button>`).join('');
  drawRp(); rp.classList.add('on'); sayVO('race_pick');
};
rpList.onclick = e => { const b = e.target.closest('button'); if (!b) return; const i = +b.dataset.i; rpSel = rpSel.includes(i) ? rpSel.filter(x => x !== i) : [...rpSel, i]; drawRp(); };
rpGo.onclick = () => { if (rpSel.length < 2) return; rp.classList.remove('on'); startRace(rpSel.slice().sort((a, b) => a - b)); };
document.getElementById('rpX').onclick = () => rp.classList.remove('on');
document.getElementById('raceX').onclick = () => { if (race) endRace(); };

/* ---------- animate ---------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), .12), t = clock.elapsedTime;
  arena.userData.update(t);
  if (race) { raceStep(dt); ren.render(scene, cam); requestAnimationFrame(loop); return; }
  if (stunt) { (stunt.kind === 'crush' ? crushStep : stuntStep)(dt); smoke.update(dt, current, 24); if (buddy && smoke2) smoke2.update(dt, buddy, 24); ren.render(scene, cam); requestAnimationFrame(loop); return; }
  if (current) {
    // drop in with a bounce, then idle with a little engine shake
    const u = current.userData;
    if (u.drop < 1) { u.drop = Math.min(1, u.drop + dt * 1.6); const s = u.drop; current.position.y = 3 * Math.pow(1 - s, 2) * Math.abs(Math.cos(s * 9)); }
    else { const b = bump(t, driving); current.position.y = b.y; current.rotation.x = b.rx; current.rotation.z = b.rz; }   // idling rumble / bumps while driving
    if (driving) {
      // drive around the ring: move along it, face the way it's going, wheels roll at the real speed
      lapA += dt * LAP_V / LAP_R;
      current.position.x = LAP_R * Math.sin(lapA); current.position.z = LAP_R * Math.cos(lapA);
      current.rotation.y = lapA;
      u.wheels.forEach(w => w.rotation.z -= dt * LAP_V / TIRE_R);
    }
    if (wh) {
      // tip up around the back wheels: ease up, wobble while balancing, then drop
      wh.t += dt;
      const k = wh.t < WH_UP ? Math.sin(wh.t / WH_UP * Math.PI / 2) : wh.t < WH_T - WH_DOWN ? 1 : Math.max(0, (WH_T - wh.t) / WH_DOWN);
      const p = WH_MAX * k * k + (k === 1 ? Math.sin(wh.t * 9) * .04 : 0), r = TIRE_R;
      const dx = -AXLE_X + AXLE_X * Math.cos(p) + r * Math.sin(p), dy = r + AXLE_X * Math.sin(p) - r * Math.cos(p);
      const yaw = current.rotation.y;
      current.rotation.z += p;
      current.position.x += dx * Math.cos(yaw); current.position.z -= dx * Math.sin(yaw); current.position.y += dy;
      if (wh.t >= WH_T) { wh = null; thud(); stopEngine(); }
    }
    smoke.update(dt, current, driving || wh ? 16 : 7);
  }
  ctl.update(); keepAboveGround();
  ren.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); if (!stunt) fitCam(); });
</script>
