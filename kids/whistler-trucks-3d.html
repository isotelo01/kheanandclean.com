<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Whistler's Monster Trucks 3D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: #8fd3ff; }
  #view { position: fixed; inset: 0; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  .round { font: inherit; font-size: 24px; width: 54px; height: 54px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.3); text-decoration: none; display: flex; align-items: center; justify-content: center; color: #1a1a1a; cursor: pointer; }
  #name { font-size: clamp(24px, 6vw, 40px); font-weight: 900; color: #fff; text-shadow: 3px 3px 0 #d62828, 5px 5px 0 #1a1a1a; text-align: center; }
  #pick { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(4, auto); gap: 8px; }
  @media (max-width: 560px) { #pick { grid-template-columns: repeat(2, auto); } }
  #pick button { font: inherit; font-size: 17px; font-weight: 800; padding: 12px 14px; border: 4px solid transparent; border-radius: 16px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.35); cursor: pointer; white-space: nowrap; }
  #pick button.sel { border-color: #ffd60a; transform: translateY(-3px); }
  #jump { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); font: inherit; font-size: 24px; font-weight: 900; padding: 12px 26px; border: none; border-radius: 18px; background: #ffd60a; color: #1a1a1a; box-shadow: 0 6px 0 #1a1a1a; cursor: pointer; }
  #jump:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #1a1a1a; }
  /* in the game pop-up: a little round video button at the bottom */
  body.embed #jump { top: auto; bottom: 26px; width: 76px; height: 76px; padding: 0; border-radius: 50%; font-size: 36px; }
  #banner { position: fixed; bottom: 4%; left: 50%; transform: translate(-50%,0) scale(0); font-size: clamp(40px, 10vw, 84px); font-weight: 900; color: #ffd60a; text-shadow: 4px 4px 0 #d62828, 8px 8px 0 #1a1a1a; transition: transform .3s; pointer-events: none; white-space: nowrap; }
  #banner.show { transform: translate(-50%,0) scale(1); }
  body.stunting #pick, body.stunting #jump, body.stunting #hint, body.stunting #spin { visibility: hidden; }
  #hint { position: fixed; top: 150px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,.85); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 15px; transition: opacity .6s; pointer-events: none; }
</style>
</head>
<body>
<div id="view"></div>
<div id="top">
  <a class="round" href="./whistler-trucks.html" aria-label="Back to the game">🏠</a>
  <div id="name"></div>
  <button class="round" id="spin" aria-label="Spin on or off">🔄</button>
</div>
<div id="hint">Drag to turn the truck · Pinch to zoom</div>
<div id="pick"></div>
<button id="jump">🚀 Jump!</button>
<div id="banner">BIG JUMP!</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

// Same four trucks as the 2D game.
const TRUCKS = [
  { name: 'Flame Fang',    body: '#d62828', accent: '#ff8c1a', rim: '#ffd60a', deco: 'flames' },
  { name: 'Skull Crusher', body: '#2b2b2b', accent: '#9be564', rim: '#9be564', deco: 'skull' },
  { name: 'Thunder Bolt',  body: '#1565c0', accent: '#ffd60a', rim: '#c0c0c0', deco: 'bolt' },
  { name: 'Dragon Roar',   body: '#1d7a2e', accent: '#a0e426', rim: '#ff6f00', deco: 'dragon' }
];

/* ---------- scene ---------- */
const view = document.getElementById('view');
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.setSize(innerWidth, innerHeight);
ren.shadowMap.enabled = true; ren.shadowMap.type = THREE.PCFSoftShadowMap;
ren.outputColorSpace = THREE.SRGBColorSpace;
view.appendChild(ren.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#8fd3ff');
scene.fog = new THREE.Fog('#8fd3ff', 24, 50);

const cam = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
function fitCam() { const asp = innerWidth / innerHeight, far = asp < 1 ? Math.min(24, 9.2 / asp) : 8.5; cam.position.set(far * 0.62, 3.6 + (far - 8.5) * .12, far * 0.78); }
fitCam();
const ctl = new OrbitControls(cam, ren.domElement);
ctl.enableDamping = true; ctl.target.set(0, 1.5, 0);
ctl.minDistance = 4; ctl.maxDistance = 30; ctl.maxPolarAngle = Math.PI * 0.49; ctl.enablePan = false;
ctl.autoRotate = true; ctl.autoRotateSpeed = 2.2;

scene.add(new THREE.HemisphereLight('#ffffff', '#8b5a2b', 1.4));
const sun = new THREE.DirectionalLight('#ffffff', 2.2);
sun.position.set(5, 9, 4); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03;
Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 });
scene.add(sun);

const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 64), new THREE.MeshStandardMaterial({ color: '#8b5a2b', roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const ring = new THREE.Mesh(new THREE.RingGeometry(4.2, 4.6, 64), new THREE.MeshStandardMaterial({ color: '#ffd60a', roughness: .8 }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.01; scene.add(ring);

/* ---------- helpers ---------- */
const std = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: .5, metalness: .1, ...extra });
const BLACK = std('#1b1b1b', { roughness: .9 });
function mesh(geo, mat, cast = true) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = true; return m; }
// convert the 2D drawing's coordinates (SVG) to 3D units
const P = (x, y) => new THREE.Vector2((x - 126) / 60, (100 - y) / 60);

function svgTexture(svg, w, h) {
  const img = new Image(), cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  img.onload = () => { cv.getContext('2d').drawImage(img, 0, 0, w, h); tex.needsUpdate = true; };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  return tex;
}

// side paint, drawn from the same artwork as the 2D trucks
function decoSVG(t) {
  let d = '';
  if (t.deco === 'flames') d = `
    <path d="M36 98 C52 90 58 72 52 58 C66 70 76 66 80 56 C88 70 100 74 106 60 C112 74 128 78 138 66 C140 80 158 86 188 88 L188 98 Z" fill="${t.accent}" stroke="#111" stroke-width="2.5"/>
    <path d="M44 98 C58 92 62 82 60 72 C70 80 80 78 84 70 C90 82 104 84 110 74 C116 84 130 88 140 80 C144 90 160 92 186 94 L186 98 Z" fill="#ffd60a"/>`;
  else if (t.deco === 'skull') d = `
    <path d="M72 58 L128 98 M128 58 L72 98" stroke="#111" stroke-width="11" stroke-linecap="round"/>
    <path d="M72 58 L128 98 M128 58 L72 98" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round"/>
    <rect x="89" y="80" width="22" height="14" rx="3" fill="#f5f5f5" stroke="#111" stroke-width="3"/>
    <circle cx="100" cy="72" r="16" fill="#f5f5f5" stroke="#111" stroke-width="3"/>
    <circle cx="94" cy="71" r="5" fill="#111"/><circle cx="106" cy="71" r="5" fill="#111"/>
    <path d="M100 76 l-3 5 h6 z" fill="#111"/><path d="M95 84 v8 M100 84 v8 M105 84 v8" stroke="#111" stroke-width="2"/>
    <path d="M140 64 h40 M146 76 h34 M152 88 h28" stroke="${t.accent}" stroke-width="5" stroke-linecap="round"/>`;
  else if (t.deco === 'bolt') d = `
    <path d="M58 57 L108 57 L90 74 L128 74 L66 99 L84 82 L50 82 Z" fill="${t.accent}" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <path d="M142 60 L170 60 L160 72 L182 72 L146 96 L156 82 L136 82 Z" fill="${t.accent}" stroke="#111" stroke-width="3" stroke-linejoin="round"/>`;
  else if (t.deco === 'dragon') {
    for (let row = 0; row < 3; row++) for (let x = 42 + (row % 2) * 8; x < 186; x += 16)
      d += `<path d="M${x - 8} ${66 + row * 12} a8 8 0 0 0 16 0" fill="${t.accent}" stroke="#111" stroke-width="1.5"/>`;
  }
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 52 160 48" width="1280" height="384">${d}</svg>`;
}

// angry face for the front grille
function faceSVG() {
  let teeth = '';
  for (let x = 14; x < 186; x += 17) teeth += `<path d="M${x} 66 l8.5 16 l8.5 -16 z M${x} 100 l8.5 -14 l8.5 14 z" fill="#fff"/>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 104" width="800" height="416">
    <path d="M18 18 L80 30 L76 50 L22 46 Z M182 18 L120 30 L124 50 L178 46 Z" fill="#fff" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="58" cy="38" r="8" fill="#111"/><circle cx="142" cy="38" r="8" fill="#111"/>
    <path d="M10 8 L88 26 M190 8 L112 26" stroke="#111" stroke-width="10" stroke-linecap="round"/>
    <rect x="10" y="64" width="180" height="38" rx="6" fill="#111"/>${teeth}
  </svg>`;
}

/* ---------- truck builder ---------- */
const W = 1.6;               // body width
const TIRE_R = 1.0, TIRE_W = 0.85;
const BODY_Y = 1.62;         // bottom of the body

function tire(t) {
  const g = new THREE.Group();
  const rubber = mesh(new THREE.CylinderGeometry(TIRE_R * .92, TIRE_R * .92, TIRE_W, 40), BLACK);
  rubber.rotation.x = Math.PI / 2; g.add(rubber);
  const sidewall = mesh(new THREE.TorusGeometry(TIRE_R * .62, .06, 8, 40), std('#333', { roughness: .9 }));
  sidewall.position.z = TIRE_W / 2; g.add(sidewall);
  const sw2 = sidewall.clone(); sw2.position.z = -TIRE_W / 2; g.add(sw2);
  const lugGeo = new THREE.BoxGeometry(0.2, 0.26, TIRE_W * 1.02);
  for (let k = 0; k < 18; k++) {
    const a = k / 18 * Math.PI * 2, lug = mesh(lugGeo, BLACK);
    lug.position.set(Math.cos(a) * TIRE_R * .95, Math.sin(a) * TIRE_R * .95, 0); lug.rotation.z = a; g.add(lug);
  }
  const rimMat = std(t.rim, { metalness: .5, roughness: .3 });
  [1, -1].forEach(side => {
    const rim = mesh(new THREE.CylinderGeometry(.42, .42, .08, 24), rimMat);
    rim.rotation.x = Math.PI / 2; rim.position.z = side * (TIRE_W / 2 + .01); g.add(rim);
    const hub = mesh(new THREE.CylinderGeometry(.13, .13, .14, 16), BLACK);
    hub.rotation.x = Math.PI / 2; hub.position.z = side * (TIRE_W / 2 + .03); g.add(hub);
    for (let b = 0; b < 5; b++) {
      const a = b / 5 * Math.PI * 2, bolt = mesh(new THREE.CylinderGeometry(.04, .04, .12, 8), BLACK);
      bolt.rotation.x = Math.PI / 2; bolt.position.set(Math.cos(a) * .27, Math.sin(a) * .27, side * (TIRE_W / 2 + .03)); g.add(bolt);
    }
  });
  return g;
}

class Helix extends THREE.Curve {
  constructor(r, h, turns) { super(); this.r = r; this.h = h; this.turns = turns; }
  getPoint(u, out = new THREE.Vector3()) { const a = u * this.turns * Math.PI * 2; return out.set(Math.cos(a) * this.r, u * this.h, Math.sin(a) * this.r); }
}

function buildTruck(t) {
  const truck = new THREE.Group(), wheels = [];
  const bodyMat = std(t.body, { metalness: .35, roughness: .35 });
  const accentMat = std(t.accent, { metalness: .3, roughness: .4 });

  // body: the 2D side outline, pushed out into 3D
  const pts = [[30,100],[30,62],[40,52],[112,52],[124,22],[178,22],[189,30],[196,52],[214,56],[222,68],[222,100]].map(p => P(...p));
  const body = mesh(new THREE.ExtrudeGeometry(new THREE.Shape(pts), { depth: W, bevelEnabled: true, bevelSize: .05, bevelThickness: .05, bevelSegments: 3 }), bodyMat);
  body.position.set(0, BODY_Y, -W / 2); truck.add(body);

  // windows (side and front)
  const glass = std('#bfe9ff', { metalness: .2, roughness: .1 });
  const win = mesh(new THREE.ExtrudeGeometry(new THREE.Shape([[128,50],[120,50],[128,28],[174,28],[182,50]].map(p => P(...p))), { depth: W + .14, bevelEnabled: false }), glass, false);
  win.position.set(0, BODY_Y, -(W + .14) / 2); truck.add(win);
  const ws = mesh(new THREE.BoxGeometry(.05, .3, W - .2), glass, false);
  const a = P(184, 30), b = P(194, 50);
  ws.position.set((a.x + b.x) / 2 + .05, BODY_Y + (a.y + b.y) / 2, 0); ws.rotation.z = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2; truck.add(ws);

  // side paint (both sides)
  const decoTex = svgTexture(decoSVG(t), 1280, 384);
  const dTL = P(30, 52), dBR = P(190, 100);
  const decoGeo = new THREE.PlaneGeometry(dBR.x - dTL.x, dTL.y - dBR.y);
  [1, -1].forEach(side => {
    // double-sided so the far side shows a mirror image with the paint still facing forward
    const m = new THREE.Mesh(decoGeo, new THREE.MeshStandardMaterial({ map: decoTex, transparent: true, roughness: .4, side: THREE.DoubleSide }));
    m.position.set((dTL.x + dBR.x) / 2, BODY_Y + (dTL.y + dBR.y) / 2, side * (W / 2 + .056));
    truck.add(m);
  });

  // angry face on the front
  const fTop = P(222, 58), fBot = P(222, 100);
  const face = new THREE.Mesh(new THREE.PlaneGeometry(W - .1, fTop.y - fBot.y), new THREE.MeshStandardMaterial({ map: svgTexture(faceSVG(), 800, 416), transparent: true, roughness: .4 }));
  face.position.set(fTop.x + .056, BODY_Y + (fTop.y + fBot.y) / 2, 0); face.rotation.y = Math.PI / 2; truck.add(face);

  // roof: light bar, or dragon spikes
  const roofY = BODY_Y + P(0, 22).y + .05;
  if (t.deco === 'dragon') {
    for (let x = 116; x <= 172; x += 14) {
      const sp = mesh(new THREE.ConeGeometry(.13, .38, 4), accentMat);
      sp.position.set(P(x, 0).x, roofY + .19, 0); truck.add(sp);
    }
  } else {
    const bar = mesh(new THREE.BoxGeometry(.9, .07, W - .3), BLACK); bar.position.set(P(153, 0).x, roofY, 0); truck.add(bar);
    const lightMat = std('#ffd60a', { emissive: '#ffb300', emissiveIntensity: .6 });
    [-0.5, -0.17, 0.17, 0.5].forEach(z => { const l = mesh(new THREE.BoxGeometry(.16, .14, .18), lightMat); l.position.set(P(153, 0).x + .25, roofY + .1, z); truck.add(l); });
  }

  // exhaust stacks
  [1, -1].forEach(side => {
    const ex = mesh(new THREE.CylinderGeometry(.07, .07, .7, 12), std('#b0b0b0', { metalness: .9, roughness: .2 }));
    ex.position.set(P(105, 0).x, BODY_Y + P(0, 52).y + .3, side * (W / 2 - .12)); truck.add(ex);
  });

  // chassis, axles, springs
  const chassis = mesh(new THREE.BoxGeometry(3.1, .2, 1.1), std('#444', { metalness: .6 }));
  chassis.position.set(0, BODY_Y - .2, 0); truck.add(chassis);
  const WX = [-1.2, 1.2];
  WX.forEach(x => {
    const axle = mesh(new THREE.CylinderGeometry(.09, .09, 2.5, 12), std('#555', { metalness: .7 }));
    axle.rotation.x = Math.PI / 2; axle.position.set(x, TIRE_R, 0); truck.add(axle);
    [1, -1].forEach(side => {
      const spring = mesh(new THREE.TubeGeometry(new Helix(.12, BODY_Y - .2 - TIRE_R, 6), 80, .03, 6), accentMat);
      spring.position.set(x, TIRE_R, side * .55); truck.add(spring);
      const shock = mesh(new THREE.CylinderGeometry(.045, .045, BODY_Y - TIRE_R, 8), std('#ddd', { metalness: .8 }));
      shock.position.set(x, (BODY_Y + TIRE_R) / 2 - .1, side * .55); truck.add(shock);
      const w = tire(t); w.position.set(x, TIRE_R, side * (W / 2 + TIRE_W / 2 + .05)); truck.add(w); wheels.push(w);
    });
  });

  truck.userData.wheels = wheels;
  return truck;
}

/* ---------- picker ---------- */
const trucks = TRUCKS.map(buildTruck);
let current = null;
const pick = document.getElementById('pick');
TRUCKS.forEach((t, i) => {
  const b = document.createElement('button');
  b.textContent = t.name; b.style.background = t.body;
  b.onclick = () => show(i);
  pick.appendChild(b);
});
function show(i) {
  if (current) scene.remove(current);
  current = trucks[i]; current.position.y = 3; current.userData.drop = 0;
  scene.add(current);
  document.getElementById('name').textContent = TRUCKS[i].name;
  [...pick.children].forEach((b, k) => b.classList.toggle('sel', k === i));
}
// ?truck=0-3 opens that truck; ?embed=1 is the pop-up inside the game (no picker, no home button)
const qs = new URLSearchParams(location.search);
show(Math.min(TRUCKS.length - 1, Math.max(0, parseInt(qs.get('truck'), 10) || 0)));
if (qs.has('embed')) {
  document.body.classList.add('embed');
  document.getElementById('jump').textContent = '🎬';
  document.getElementById('jump').setAttribute('aria-label', 'Play the jump');
  pick.style.display = 'none';
  document.querySelector('#top a').style.visibility = 'hidden';
}

const spinBtn = document.getElementById('spin');
spinBtn.onclick = () => { ctl.autoRotate = !ctl.autoRotate; spinBtn.style.opacity = ctl.autoRotate ? 1 : .5; };
ctl.addEventListener('start', () => { document.getElementById('hint').style.opacity = 0; });

/* ---------- school bus ---------- */
function textTex(text, w, h, bg, fg) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'); c.fillStyle = bg; c.fillRect(0, 0, w, h);
  c.fillStyle = fg; c.font = `900 ${h * .62}px Arial, sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText(text, w / 2, h / 2 + 2);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; return tx;
}
const busParts = {
  yellow: std('#f7b500', { metalness: .2, roughness: .45 }),
  black: std('#151515', { roughness: .8 }),
  glass: std('#1f3550', { metalness: .3, roughness: .15 }),
  red: std('#e53935', { emissive: '#b71c1c', emissiveIntensity: .4 }),
  amber: std('#ffb300', { emissive: '#ff8f00', emissiveIntensity: .4 }),
  sign: new THREE.MeshStandardMaterial({ map: textTex('SCHOOL BUS', 512, 96, '#f7b500', '#111'), roughness: .5 })
};
function schoolBus() {
  // long side faces the jump; front hood points +z
  const g = new THREE.Group(), M = busParts;
  const BW = 1.6, BH = 1.8, BASE = .45, BL = 5.5, BZ = -.55; // box body
  const front = BZ + BL / 2;
  const add = (geo, mat, x, y, z) => { const m = mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  add(new THREE.BoxGeometry(BW, BH, BL), M.yellow, 0, BASE + BH / 2, BZ);
  add(new THREE.BoxGeometry(BW * .92, .14, BL * .98), M.yellow, 0, BASE + BH + .07, BZ);
  add(new THREE.BoxGeometry(BW * .88, .85, 1.1), M.yellow, 0, BASE + .42, front + .55);
  add(new THREE.BoxGeometry(BW * .7, .5, .05), M.black, 0, BASE + .45, front + 1.11);
  add(new THREE.BoxGeometry(BW + .1, .2, .14), M.black, 0, BASE + .12, front + 1.16);
  add(new THREE.BoxGeometry(BW + .1, .2, .14), M.black, 0, BASE + .12, BZ - BL / 2 - .05);
  [.55, 1.0].forEach(y => add(new THREE.BoxGeometry(BW + .03, .06, BL), M.black, 0, BASE + y, BZ));
  for (let i = 0; i < 8; i++) add(new THREE.BoxGeometry(BW + .04, .55, .5), M.glass, 0, BASE + 1.38, BZ - BL / 2 + .55 + i * .64);
  add(new THREE.BoxGeometry(BW * .86, .62, .05), M.glass, 0, BASE + 1.3, front + .01);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(BW * .9, .26), M.sign);
  sign.position.set(0, BASE + BH - .16, front + .03); g.add(sign);
  const back = sign.clone(); back.position.z = BZ - BL / 2 - .03; back.rotation.y = Math.PI; g.add(back);
  [-1, 1].forEach(s => {
    add(new THREE.BoxGeometry(.18, .14, .06), M.amber, s * .55, BASE + BH - .16 + .0, front + .02).position.x = s * .66;
    add(new THREE.BoxGeometry(.18, .14, .06), M.red, s * .66, BASE + BH - .16, BZ - BL / 2 - .02);
    [front + .6, BZ - BL / 2 + 1.1].forEach(z => {
      const w = add(new THREE.CylinderGeometry(.45, .45, .32, 20), M.black, s * (BW / 2 - .1), .45, z);
      w.rotation.z = Math.PI / 2;
    });
  });
  g.traverse(o => { o.receiveShadow = false; });   // buses still cast shadows; skipping self-shadow avoids roof blotches
  return g;
}

/* ---------- jump stunt ---------- */
const RAMP_H = 2.6, RAMP_L = 4.5, LAUNCH = 6.5;            // ramps end/start at x = ±6.5
const TH = Math.atan(RAMP_H / RAMP_L), VX = 15, G = 20, VY = VX * Math.tan(TH);
const T_GROUND = 1.0, T_RAMP = RAMP_L / VX, T_AIR = 2 * LAUNCH / VX, T_RUN = 1.5;
const START_X = -LAUNCH - RAMP_L - VX * T_GROUND;
let stunt = null, stuntSet = null;

function buildStuntSet() {
  const g = new THREE.Group();
  const track = new THREE.Mesh(new THREE.PlaneGeometry(140, 90), new THREE.MeshStandardMaterial({ color: '#7a4a22', roughness: 1 }));
  track.rotation.x = -Math.PI / 2; track.position.y = .003; track.receiveShadow = true; g.add(track);
  const rampMat = std('#8a8a8a', { metalness: .5, roughness: .4 });
  const stripe = std('#ffd60a');
  const wedge = pts => { const m = mesh(new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(p => new THREE.Vector2(...p))), { depth: 3.4, bevelEnabled: false }), rampMat); m.position.z = -1.7; return m; };
  g.add(wedge([[-LAUNCH - RAMP_L, 0], [-LAUNCH, 0], [-LAUNCH, RAMP_H]]));
  g.add(wedge([[LAUNCH, RAMP_H], [LAUNCH, 0], [LAUNCH + RAMP_L, 0]]));
  [-1, 1].forEach(s => { const lip = mesh(new THREE.BoxGeometry(.12, .1, 3.45), stripe); lip.position.set(s * LAUNCH, RAMP_H, 0); g.add(lip); });
  [-3.6, -1.2, 1.2, 3.6].forEach(x => { const b = schoolBus(); b.position.x = x; g.add(b); });
  return g;
}

// sound: engine rumble while driving, thud on landing
let actx = null, engine = null;
function startEngine() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const t = actx.currentTime, lp = actx.createBiquadFilter(), g = actx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 320; lp.Q.value = 4; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t + .1);
    const oscs = [0, 70].map(d => { const o = actx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 40; o.detune.value = d; o.connect(lp); o.start(); return o; });
    lp.connect(g).connect(actx.destination);
    engine = { oscs, g };
  } catch (e) { engine = null; }
}
function engineRev(f) { if (engine) engine.oscs.forEach(o => o.frequency.setTargetAtTime(f, actx.currentTime, .15)); }
function stopEngine() { if (!engine) return; const t = actx.currentTime; engine.g.gain.setTargetAtTime(.0001, t, .2); engine.oscs.forEach(o => o.stop(t + 1)); engine = null; }
function thud() {
  if (!actx) return;
  const n = actx.sampleRate * .4, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 1.2; s.connect(f).connect(g).connect(actx.destination); s.start();
}

function startJump() {
  if (stunt || !current) return;
  stuntSet = stuntSet || buildStuntSet();
  scene.add(stuntSet); ring.visible = false;
  scene.fog.near = 30; scene.fog.far = 70;
  Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16 }); sun.shadow.camera.updateProjectionMatrix();
  document.body.classList.add('stunting');
  ctl.enabled = false; ctl.autoRotate = false;
  current.userData.drop = 1;
  stunt = { tau: -0.9, landed: false, snap: true };
  startEngine();
}

function endJump() {
  scene.remove(stuntSet); ring.visible = true;
  scene.fog.near = 24; scene.fog.far = 50;
  Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5 }); sun.shadow.camera.updateProjectionMatrix();
  current.position.set(0, 0, 0); current.rotation.set(0, 0, 0);
  sun.position.set(5, 9, 4); sun.target.position.set(0, 0, 0);
  fitCam(); ctl.target.set(0, 1.5, 0); ctl.enabled = true; ctl.autoRotate = spinBtn.style.opacity !== '0.5';
  document.body.classList.remove('stunting');
  document.getElementById('banner').classList.remove('show');
  stopEngine(); stunt = null;
}

function stuntStep(dt) {
  const s = stunt;
  const t1 = T_GROUND, t2 = t1 + T_RAMP, t3 = t2 + T_AIR, t4 = t3 + T_RAMP, t5 = t4 + T_RUN;
  const inAir = s.tau > t2 && s.tau < t3;
  const scale = inAir ? .38 : 1;                      // slow motion over the buses
  s.tau += dt * scale;
  const tau = s.tau;
  let x, y = 0, pitch = 0, speed = VX;
  if (tau < 0) { x = START_X; speed = 0; y = Math.abs(Math.sin(tau * 40)) * .03; engineRev(55); }
  else if (tau < t1) { x = START_X + VX * tau; engineRev(70); }
  else if (tau < t2) { x = START_X + VX * tau; y = (x - (-LAUNCH - RAMP_L)) * Math.tan(TH); pitch = TH; engineRev(85); }
  else if (tau < t3) {
    const ta = tau - t2; x = -LAUNCH + VX * ta; y = RAMP_H + VY * ta - G * ta * ta / 2;
    pitch = Math.atan2(VY - G * ta, VX); engineRev(95);
    if (ta > T_AIR * .25) document.getElementById('banner').classList.add('show');
  }
  else if (tau < t4) {
    if (!s.landed) { s.landed = true; thud(); }
    x = LAUNCH + VX * (tau - t3); y = RAMP_H - (x - LAUNCH) * Math.tan(TH); pitch = -TH; engineRev(60);
  }
  else if (tau < t5) {
    const tr = tau - t4, a = VX / T_RUN;
    x = LAUNCH + RAMP_L + VX * tr - a * tr * tr / 2; speed = VX - a * tr;
    y = .35 * Math.exp(-5 * tr) * Math.abs(Math.sin(tr * 11));
    pitch = -.08 * Math.exp(-4 * tr) * Math.sin(tr * 11); engineRev(45);
  }
  else { x = LAUNCH + RAMP_L + VX * T_RUN / 2; speed = 0; if (tau > t5 + 1.4) return endJump(); }

  current.position.set(x, y, 0);
  current.rotation.set(0, 0, pitch);
  current.userData.wheels.forEach(w => w.rotation.z -= dt * scale * speed / TIRE_R);
  sun.position.set(x + 5, 9, 4); sun.target.position.set(x, 0, 0);

  // chase camera from the side
  const zoff = 15 * Math.max(1, .85 / cam.aspect);   // back up on narrow phone screens
  const want = new THREE.Vector3(x - 5, 4.2 + y * .4 + (zoff - 15) * .15, zoff), look = new THREE.Vector3(x + 1.5, 1.8 + y * .5, 0);
  if (s.snap) { cam.position.copy(want); s.snap = false; } else cam.position.lerp(want, 1 - Math.exp(-dt * 5));
  cam.lookAt(look);
}
scene.add(sun.target);
document.getElementById('jump').onclick = startJump;

/* ---------- animate ---------- */
const clock = new THREE.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (stunt) { stuntStep(dt); ren.render(scene, cam); requestAnimationFrame(loop); return; }
  if (current) {
    // drop in with a bounce, then idle with a little engine shake
    const u = current.userData;
    if (u.drop < 1) { u.drop = Math.min(1, u.drop + dt * 1.6); const s = u.drop; current.position.y = 3 * Math.pow(1 - s, 2) * Math.abs(Math.cos(s * 9)); }
    else current.position.y = Math.abs(Math.sin(t * 22)) * .015;
    u.wheels.forEach(w => w.rotation.z -= dt * 1.5);
  }
  ctl.update();
  ren.render(scene, cam);
  requestAnimationFrame(loop);
}
loop();

addEventListener('resize', () => { ren.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); if (!stunt) fitCam(); });
</script>
