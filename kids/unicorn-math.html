<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Unicorn Math</title>
<link rel="icon" type="image/png" href="unicorn-icon-180.png">
<link rel="apple-touch-icon" href="unicorn-icon-180.png">
<meta name="apple-mobile-web-app-title" content="Unicorn Math">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="Unicorn Math">
<meta property="og:description" content="Adding and taking away with a unicorn">
<meta property="og:image" content="https://kheanandclean.com/kids/unicorn-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://kheanandclean.com/kids/unicorn-math.html">
<meta name="twitter:card" content="summary_large_image">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #fde4f2 0%, #e9ddff 55%, #d8f1ff 100%);
    color: #4a2c6d;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; overflow-x: hidden; user-select: none;
  }
  .top {
    width: 100%; display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; font-size: 22px; font-weight: 700;
  }
  .top button {
    font: inherit; font-size: 18px; border: 0; border-radius: 14px;
    padding: 8px 14px; background: #fff; color: #7b3fb5; box-shadow: 0 3px 0 #d3b8f0;
  }
  .screen { display: none; width: 100%; max-width: 720px; padding: 8px 16px 32px; text-align: center; }
  .screen.on { display: block; }
  h1 { font-size: 40px; margin: 10px 0 4px; }
  .sub { font-size: 20px; margin: 0 0 20px; }
  .big-unicorn { font-size: 110px; line-height: 1; margin: 6px 0; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .pick { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 16px auto; max-width: 420px; }
  .pick button, .row button {
    font: inherit; font-size: 26px; font-weight: 700; border: 0; border-radius: 22px;
    padding: 18px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15);
  }
  .add { background: #ff7eb6; } .sub-b { background: #9b6bff; } .mix { background: #4cc3ff; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 8px 0 18px; }
  .row button { font-size: 20px; padding: 12px 18px; background: #fff; color: #7b3fb5; }
  .row button.sel { background: #7b3fb5; color: #fff; }
  .label { font-size: 18px; font-weight: 700; margin-top: 10px; }

  .problem { font-size: 72px; font-weight: 800; margin: 14px 0 6px; letter-spacing: 2px; }
  .counters { min-height: 70px; font-size: 34px; line-height: 1.3; margin-bottom: 10px; }
  .counters .gone { opacity: .25; filter: grayscale(1); }
  .counters .op { font-size: 34px; margin: 0 10px; color: #7b3fb5; font-weight: 800; }
  .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 480px; margin: 0 auto; }
  .answers button {
    font: inherit; font-size: 48px; font-weight: 800; border: 0; border-radius: 24px;
    padding: 22px 0; background: #fff; color: #4a2c6d; box-shadow: 0 6px 0 #d3b8f0;
  }
  .answers button:active { transform: translateY(3px); box-shadow: 0 3px 0 #d3b8f0; }
  .answers button.right { background: #7ee0a1; color: #fff; }
  .answers button.wrong { background: #ffb3b3; color: #fff; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .msg { font-size: 28px; font-weight: 800; min-height: 40px; margin: 14px 0; }
  .progress { height: 22px; background: #fff; border-radius: 12px; overflow: hidden; margin: 6px auto 4px; max-width: 480px; }
  .progress div { height: 100%; width: 0; background: linear-gradient(90deg,#ff7eb6,#ffd166,#7ee0a1,#4cc3ff,#9b6bff); transition: width .4s; }
  .small { font-size: 16px; }
  .say { font: inherit; font-size: 18px; border: 0; border-radius: 14px; padding: 8px 14px; background: #fff; color: #7b3fb5; margin-top: 8px; }

  .stable { font-size: 46px; line-height: 1.4; min-height: 60px; margin: 10px 0; word-wrap: break-word; }
  .reward .big-unicorn { font-size: 140px; }

  /* number path: one box per number, unicorn hops box to box */
  .path-wrap { overflow-x: auto; margin: 4px auto 0; padding: 46px 4px 26px; max-width: 100%; }
  .path { display: flex; gap: 4px; justify-content: center; min-width: max-content; margin: 0 auto; }
  .cell {
    position: relative; width: 40px; height: 44px; border-radius: 10px; background: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700;
    color: #7b6a93; box-shadow: 0 3px 0 #d3b8f0; flex: none;
  }
  .path.wide { gap: 3px; }
  .path.wide .cell { width: 28px; font-size: 14px; }
  .cell.start { background: #ffe08a; color: #4a2c6d; }
  .cell.hop { background: #ffc2dc; color: #4a2c6d; }
  .cell.here { background: #b79bff; color: #fff; }
  .cell .uni { position: absolute; top: -44px; left: 50%; transform: translateX(-50%); font-size: 34px; transition: left .2s; }
  .cell .hopn { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #c2408a; font-weight: 800; }
  .slider { width: 100%; max-width: 560px; margin: 26px auto 2px; display: block; height: 40px; accent-color: #9b6bff; }
  .hops { font-size: 20px; font-weight: 700; min-height: 28px; }

  /* finger writing */
  .write { display: none; }
  .write.on { display: block; }
  .pads { display: flex; gap: 12px; justify-content: center; margin: 6px 0 8px; }
  .pad { background: #fff; border-radius: 22px; box-shadow: 0 6px 0 #d3b8f0; touch-action: none; display: block; }
  .seen { font-size: 22px; font-weight: 700; min-height: 32px; }
  .seen b { font-size: 34px; color: #7b3fb5; }
  .wbtns { display: flex; gap: 12px; justify-content: center; margin-top: 6px; }
  .wbtns button { font: inherit; font-size: 24px; font-weight: 800; border: 0; border-radius: 20px; padding: 14px 26px; color: #fff; box-shadow: 0 5px 0 rgba(0,0,0,.15); }
  .wbtns .erase { background: #c9b6e6; }
  .wbtns .check { background: #ff7eb6; }
  .wbtns .check:disabled { opacity: .45; }

  .spark { position: fixed; pointer-events: none; font-size: 30px; z-index: 10; animation: fly 1.2s ease-out forwards; }
  @keyframes fly { to { transform: translate(var(--x), var(--y)) rotate(360deg); opacity: 0; } }
</style>
</head>
<body>

<div class="top">
  <span>⭐ <span id="stars">0</span></span>
  <button id="homeBtn" style="display:none">🏠 Home</button>
</div>

<!-- HOME -->
<div class="screen on" id="home">
  <div class="big-unicorn">🦄</div>
  <h1>Unicorn Math</h1>
  <p class="sub">Help the unicorn find the magic numbers!</p>

  <div class="label">How big are the numbers?</div>
  <div class="row" id="levels">
    <button data-max="5" class="sel">Up to 5</button>
    <button data-max="10">Up to 10</button>
    <button data-max="20">Up to 20</button>
  </div>

  <div class="label">How do you answer?</div>
  <div class="row" id="answerHow">
    <button data-how="write" class="sel">✍️ Write it</button>
    <button data-how="tap">👆 Tap it</button>
  </div>

  <div class="pick">
    <button class="add" data-mode="add">➕ Adding</button>
    <button class="sub-b" data-mode="sub">➖ Taking away</button>
    <button class="mix" data-mode="mix">🌈 Mix it up</button>
  </div>

  <div class="label">My unicorn friends</div>
  <div class="stable" id="stableHome"></div>
</div>

<!-- GAME -->
<div class="screen" id="game">
  <div class="progress"><div id="bar"></div></div>
  <div class="small" id="count"></div>
  <div class="problem" id="problem"></div>
  <div class="path-wrap"><div class="path" id="path"></div></div>
  <input type="range" class="slider" id="slider" min="0" max="5" step="1" value="0" aria-label="Move the unicorn">
  <div class="hops" id="hops"></div>
  <div class="answers" id="answers"></div>
  <div class="write" id="write">
    <div class="pads" id="pads"></div>
    <div class="seen" id="seen">Write the answer with your finger</div>
    <div class="wbtns">
      <button class="erase" id="eraseBtn">Erase</button>
      <button class="check" id="checkBtn" disabled>Check ✨</button>
    </div>
  </div>
  <div class="msg" id="msg"></div>
  <button class="say" id="sayBtn">🔊 Read it to me</button>
</div>

<!-- REWARD -->
<div class="screen reward" id="reward">
  <h1>You did it! 🎉</h1>
  <div class="big-unicorn" id="newFriend">🦄</div>
  <p class="sub" id="rewardText"></p>
  <div class="stable" id="stableReward"></div>
  <div class="pick">
    <button class="add" id="again">Play again</button>
    <button class="mix" id="goHome">Home</button>
  </div>
</div>

<script src="digits.js?v=2"></script>
<script>
(function () {
  var ROUND = 10;
  var FRIENDS = ["🦄","🌈","🦋","🌸","⭐","🍭","🧁","🌙","💖","🎀","🍦","🌟","🪄","🍓","☁️","👑"];
  var PRAISE = ["Magical!","Sparkly!","You got it!","Super star!","Rainbow power!","Amazing!","Yay!"];
  var TRY = ["Try again!","So close!","Oops, one more try!"];

  var state = { max: 5, mode: "add", how: "write", n: 0, right: 0, missed: false, a: 0, b: 0, op: "+", ans: 0 };
  var save = { stars: 0, friends: [] };

  try { var s = JSON.parse(localStorage.getItem("unicornMath") || "null"); if (s) save = s; } catch (e) {}
  function persist() { try { localStorage.setItem("unicornMath", JSON.stringify(save)); } catch (e) {} }

  function $(id) { return document.getElementById(id); }
  function show(id) {
    ["home","game","reward"].forEach(function (x) { $(x).classList.toggle("on", x === id); });
    $("homeBtn").style.display = id === "home" ? "none" : "inline-block";
  }
  function rand(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function drawStars() {
    $("stars").textContent = save.stars;
    var txt = save.friends.length ? save.friends.join(" ") : "Play to earn unicorn friends!";
    $("stableHome").textContent = txt;
    $("stableReward").textContent = txt;
    $("stableHome").style.fontSize = save.friends.length ? "46px" : "18px";
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) return;
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9; u.pitch = 1.3;
      speechSynthesis.speak(u);
    } catch (e) {}
  }
  function sayProblem() {
    speak(state.a + (state.op === "+" ? " plus " : " take away ") + state.b + " equals what?");
  }

  // ---- home controls
  Array.prototype.forEach.call(document.querySelectorAll("#levels button"), function (b) {
    b.onclick = function () {
      document.querySelectorAll("#levels button").forEach(function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
      state.max = +b.getAttribute("data-max");
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#answerHow button"), function (b) {
    b.onclick = function () {
      document.querySelectorAll("#answerHow button").forEach(function (x) { x.classList.remove("sel"); });
      b.classList.add("sel");
      state.how = b.getAttribute("data-how");
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#home .pick button"), function (b) {
    b.onclick = function () { state.mode = b.getAttribute("data-mode"); start(); };
  });
  $("homeBtn").onclick = function () { drawStars(); show("home"); };
  $("goHome").onclick = function () { drawStars(); show("home"); };
  $("again").onclick = start;
  $("sayBtn").onclick = sayProblem;

  function start() { state.n = 0; state.right = 0; show("game"); next(); }

  function next() {
    state.n++;
    state.missed = false;
    var op = state.mode === "mix" ? pickOne(["+","-"]) : (state.mode === "add" ? "+" : "-");
    var a, b, ans, max = state.max;
    if (op === "+") {
      ans = rand(1, max); a = rand(0, ans); b = ans - a;
    } else {
      a = rand(1, max); b = rand(0, a); ans = a - b;
    }
    state.a = a; state.b = b; state.op = op; state.ans = ans;

    $("bar").style.width = ((state.n - 1) / ROUND * 100) + "%";
    $("count").textContent = "Question " + state.n + " of " + ROUND;
    $("problem").textContent = a + " " + (op === "+" ? "+" : "−") + " " + b + " = ?";
    $("msg").textContent = "";

    buildPath();

    // writing mode: finger pads instead of answer buttons
    $("answers").style.display = state.how === "write" ? "none" : "";
    $("write").classList.toggle("on", state.how === "write");
    if (state.how === "write") { buildPads(); return; }

    // answer choices
    var opts = [ans];
    while (opts.length < 4) {
      var w = ans + rand(-3, 3);
      if (w >= 0 && w <= max + 3 && opts.indexOf(w) < 0) opts.push(w);
    }
    opts.sort(function () { return Math.random() - 0.5; });
    var box = $("answers");
    box.innerHTML = "";
    opts.forEach(function (v) {
      var btn = document.createElement("button");
      btn.textContent = v;
      btn.onclick = function () { choose(btn, v); };
      box.appendChild(btn);
    });
  }

  function choose(btn, v) {
    if (btn.disabled) return;
    if (v === state.ans) {
      btn.classList.add("right");
      Array.prototype.forEach.call(document.querySelectorAll("#answers button"), function (x) { x.disabled = true; });
      if (!state.missed) { state.right++; save.stars++; persist(); drawStars(); }
      var p = pickOne(PRAISE);
      $("msg").textContent = p + " 🌈";
      speak(p);
      sparkle(btn);
      setTimeout(function () { state.n >= ROUND ? finish() : next(); }, 1300);
    } else {
      state.missed = true;
      btn.classList.add("wrong");
      btn.disabled = true;
      var t = pickOne(TRY);
      $("msg").textContent = t;
      speak(t);
    }
  }

  // ---- number path (a box for every number; count the hops, not the lines)
  function buildPath() {
    var path = $("path"), max = state.max, html = "";
    path.classList.toggle("wide", max > 10);
    for (var i = 0; i <= max; i++) html += '<div class="cell" data-n="' + i + '">' + i + "</div>";
    path.innerHTML = html;
    var s = $("slider");
    s.max = max; s.value = state.a;
    movePath();
  }
  function movePath() {
    var pos = +$("slider").value, a = state.a, cells = $("path").children, hops = Math.abs(pos - a);
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i], n = +c.getAttribute("data-n");
      c.className = "cell";
      c.innerHTML = n;
      var between = pos > a ? (n > a && n < pos) : (n < a && n > pos);
      if (n === a) c.classList.add("start");
      if (between) c.classList.add("hop");
      if (n === pos && pos !== a) c.classList.add("here");
      if (n === pos) c.innerHTML += '<span class="uni">🦄</span>';
      if (between || (n === pos && pos !== a)) c.innerHTML += '<span class="hopn">' + Math.abs(n - a) + "</span>";
    }
    var here = cells[pos];
    if (here && here.scrollIntoView) here.scrollIntoView({ block: "nearest", inline: "center" });
    var dir = state.op === "+" ? "forward" : "back";
    $("hops").textContent = state.b === 0 && hops === 0
      ? "Zero hops! The unicorn stays put."
      : hops === 0
      ? "Slide the unicorn " + dir + " " + state.b + (state.b === 1 ? " hop" : " hops")
      : hops + (hops === 1 ? " hop" : " hops");
  }
  $("slider").oninput = movePath;

  // ---- finger writing pads
  var pads = [];
  function buildPads() {
    // one writing box; wide enough for two numbers when answers can reach 10+
    var box = $("pads");
    box.innerHTML = "";
    pads = [];
    var screenW = Math.min(window.innerWidth, 720) - 40;
    var w = state.max >= 10 ? Math.min(400, screenW) : Math.min(220, screenW), h = 210;
    var cv = document.createElement("canvas");
    cv.className = "pad";
    cv.style.width = w + "px"; cv.style.height = h + "px";
    var dpr = window.devicePixelRatio || 1;
    cv.width = w * dpr; cv.height = h * dpr;
    box.appendChild(cv);
    pads.push(makePad(cv, dpr));
    updateSeen();
  }
  function makePad(cv, dpr) {
    var ctx = cv.getContext("2d"), pad = { cv: cv, strokes: [], cur: null };
    ctx.scale(dpr, dpr);
    ctx.lineWidth = 9; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#7b3fb5";
    function pt(e) { var r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
    cv.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (x) {}
      var p = pt(e);
      pad.cur = [p]; pad.strokes.push(pad.cur);
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y); ctx.stroke();
    });
    cv.addEventListener("pointermove", function (e) {
      if (!pad.cur) return;
      e.preventDefault();
      var p = pt(e), last = pad.cur[pad.cur.length - 1];
      pad.cur.push(p);
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    function end() { if (pad.cur) { pad.cur = null; updateSeen(); } }
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    pad.clear = function () { pad.strokes = []; pad.cur = null; ctx.clearRect(0, 0, cv.width, cv.height); };
    return pad;
  }
  function readAnswer(expected) {
    var strokes = [];
    pads.forEach(function (p) { strokes = strokes.concat(p.strokes); });
    return window.readNumber ? window.readNumber(strokes, expected) : null;
  }
  function updateSeen() {
    var v = readAnswer();
    $("seen").innerHTML = v === null ? "Write the answer with your finger" : "I see: <b>" + v + "</b>";
    $("checkBtn").disabled = v === null;
  }
  function erase() { pads.forEach(function (p) { p.clear(); }); updateSeen(); }
  $("eraseBtn").onclick = erase;
  $("checkBtn").onclick = function () {
    var v = readAnswer(state.ans);
    if (v === null) return;
    if (v === state.ans) {
      $("checkBtn").disabled = true;
      $("seen").innerHTML = "I see: <b>" + v + "</b>";
      if (!state.missed) { state.right++; save.stars++; persist(); drawStars(); }
      var p = pickOne(PRAISE);
      $("msg").textContent = p + " 🌈";
      speak(p);
      $("slider").value = state.ans; movePath();
      sparkle($("checkBtn"));
      setTimeout(function () { state.n >= ROUND ? finish() : next(); }, 1300);
    } else {
      state.missed = true;
      var t = pickOne(TRY);
      $("msg").textContent = t + " Use the unicorn to count the hops.";
      speak(t);
      erase();
    }
  };

  function sparkle(el) {
    var r = el.getBoundingClientRect();
    var bits = ["✨","⭐","💖","🌈","🦄"];
    for (var i = 0; i < 12; i++) {
      var s = document.createElement("div");
      s.className = "spark";
      s.textContent = pickOne(bits);
      s.style.left = (r.left + r.width / 2) + "px";
      s.style.top = (r.top + r.height / 2) + "px";
      s.style.setProperty("--x", rand(-160, 160) + "px");
      s.style.setProperty("--y", rand(-200, 60) + "px");
      document.body.appendChild(s);
      setTimeout(function (n) { return function () { n.remove(); }; }(s), 1300);
    }
  }

  function finish() {
    $("bar").style.width = "100%";
    var friend = pickOne(FRIENDS);
    save.friends.push(friend);
    persist(); drawStars();
    $("newFriend").textContent = friend;
    $("rewardText").textContent = "You got " + state.right + " out of " + ROUND + " on the first try! A new friend joined your stable.";
    speak("You did it! A new friend joined your stable!");
    show("reward");
    for (var i = 0; i < 3; i++) setTimeout(function () { sparkle($("newFriend")); }, i * 300);
  }

  drawStars();
})();
</script>
</body>
</html>
