<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Molly's Castle 3D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#8fd3ff, #e6f6ff); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #3a2340; }
  #c { position: fixed; inset: 0; }
  #c canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  button { font-family: inherit; color: inherit; border: none; cursor: pointer; }
  #top { position: fixed; left: 12px; top: max(10px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-start; gap: 4px; pointer-events: none; }
  #top h1 { margin: 0; font-size: 24px; font-weight: 900; color: #a24bd1; text-shadow: 0 2px 0 #fff; }
  #roomLbl { background: #fff; border-radius: 999px; padding: 4px 12px; font-size: 15px; font-weight: 800; color: #d65db1; box-shadow: 0 3px 0 rgba(0,0,0,.12); }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 8px max(10px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.85) 30%); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button { flex: none; padding: 9px 13px; border-radius: 999px; background: #fff; font-size: 15px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.12); touch-action: pan-x; }
  .chips button.on { background: #d65db1; color: #fff; }
  .chips button.fl { background: #a24bd1; color: #fff; }
  .chips button.fl.dim { background: #e6d1ff; color: #7b2cbf; }
  #addBtn { background: #ffe27a !important; }
  #sel { position: fixed; left: 50%; transform: translateX(-50%); bottom: 118px; display: none; gap: 8px; background: rgba(255,255,255,.96); padding: 8px; border-radius: 20px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  #sel.on { display: flex; }
  #sel button { width: 50px; height: 50px; border-radius: 14px; background: #fde2ff; font-size: 24px; }
  #sel button.del { background: #ffd1d1; }
  #add { position: fixed; left: 8px; right: 8px; bottom: 118px; max-height: 50%; overflow-y: auto; display: none; background: rgba(255,255,255,.97); border-radius: 22px; padding: 10px; box-shadow: 0 8px 20px rgba(0,0,0,.2); grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; touch-action: pan-y; }
  #add.on { display: grid; }
  #add button { background: #fff0fa; border: 3px solid #ffd1ea; border-radius: 16px; padding: 8px 4px; font-size: 13px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: pan-y; }
  #add button span { font-size: 30px; }
  #joy { position: fixed; left: 16px; bottom: 120px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.55); border: 4px solid rgba(214,93,177,.55); display: none; touch-action: none; }
  #joy.on { display: block; }
  #knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: #d65db1; box-shadow: 0 4px 0 rgba(0,0,0,.2); pointer-events: none; }
  .chips button.walk { background: #5fbf5f; color: #fff; }
  #hint { position: fixed; left: 0; right: 0; top: 46%; text-align: center; font-size: 20px; font-weight: 900; color: #a24bd1; pointer-events: none; text-shadow: 0 2px 0 #fff; }
</style>
<script src="molly-art.js"></script>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/controls/OrbitControls.js":"./vendor/OrbitControls.js"}}</script>
</head>
<body>
<div id="c"></div>
<div id="top"><h1>Castle</h1><div id="roomLbl">Grand Hall</div></div>
<div id="hint">Building the castle…</div>
<div id="sel">
  <button data-a="color">🎨</button><button data-a="rot">🔄</button><button data-a="small">➖</button><button data-a="big">➕</button>
  <button class="del" data-a="del">🗑️</button><button data-a="done">✅</button>
</div>
<div id="add"></div>
<div id="joy"><div id="knob"></div></div>
<div id="bottom">
  <div class="chips" id="rooms"></div>
  <div class="chips" id="floors"></div>
</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { makeFigure } from "./molly-figures3d.js";

/* A ~3,000 sq ft two-story castle house (1 unit = 1 foot).
   Downstairs: Grand Hall with a grand staircase, Great Room, Kitchen, Dining Room, Powder Room.
   Upstairs: Princess Bedroom, Bathroom, Kids' Room, Playroom, and a balcony hall over the Grand Hall. */
const UP = 10;           // upstairs floor height
const WALL_H = 9;
const ROOMS = [
  { id: 'foyer',   name: 'Grand Hall',       f: 0, x: [-6, 6],   z: [-4, 19],  floor: 'tile' },
  { id: 'living',  name: 'Great Room',       f: 0, x: [6, 20],   z: [-19, 19], floor: 'wood' },
  { id: 'kitchen', name: 'Kitchen',          f: 0, x: [-20, -6], z: [-19, 0],  floor: 'tile' },
  { id: 'dining',  name: 'Dining Room',      f: 0, x: [-20, -6], z: [0, 19],   floor: 'wood' },
  { id: 'powder',  name: 'Powder Room',      f: 0, x: [-6, 6],   z: [-19, -10], floor: 'tile' },
  { id: 'hall0',   name: 'Back Hall',        f: 0, x: [-6, 6],   z: [-10, -4], floor: 'wood', hidden: true },
  { id: 'master',  name: 'Princess Bedroom', f: 1, x: [6, 20],   z: [-19, 6],  floor: 'carpet' },
  { id: 'bath',    name: 'Bathroom',         f: 1, x: [6, 20],   z: [6, 19],   floor: 'tile' },
  { id: 'kids',    name: "Kids' Room",       f: 1, x: [-20, -6], z: [0, 19],   floor: 'carpetB' },
  { id: 'play',    name: 'Playroom',         f: 1, x: [-20, -6], z: [-19, 0],  floor: 'carpetY' },
  { id: 'hall1',   name: 'Balcony',          f: 1, x: [-6, 6],   z: [-19, 2],  floor: 'wood' }
];
const roomOf = id => ROOMS.find(r => r.id === id);
const roomAt = (x, z, f) => ROOMS.find(r => r.f === f && x >= r.x[0] && x <= r.x[1] && z >= r.z[0] && z <= r.z[1]);

/* ---------- renderer ---------- */
const box = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
box.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#9fdcff'); scene.fog = new THREE.Fog('#9fdcff', 120, 260);
const camera = new THREE.PerspectiveCamera(45, 1, .5, 600);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = 1.32; controls.minDistance = 10; controls.maxDistance = 140;
controls.screenSpacePanning = false;
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8e0a8, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(40, 80, 50); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 10, far: 200 }); scene.add(sun);

/* ---------- materials ---------- */
const M = {}; const mat = (c, x = {}) => { const k = c + JSON.stringify(x); return M[k] || (M[k] = new THREE.MeshStandardMaterial({ color: c, roughness: .6, ...x })); };
function canvasTex(draw, rep) { const cv = document.createElement('canvas'); cv.width = cv.height = 128; draw(cv.getContext('2d')); const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); return t; }
const FLOORS = {
  tile: () => new THREE.MeshStandardMaterial({ map: canvasTex(g => { g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#ffd9ec'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64); }, 1), roughness: .3 }),
  wood: () => new THREE.MeshStandardMaterial({ map: canvasTex(g => { g.fillStyle = '#e8bd8a'; g.fillRect(0, 0, 128, 128); g.fillStyle = '#d9a86f'; for (let i = 0; i < 128; i += 16) g.fillRect(0, i, 128, 2); g.fillRect(40, 0, 2, 16); g.fillRect(90, 16, 2, 16); g.fillRect(20, 32, 2, 16); g.fillRect(70, 48, 2, 16); g.fillRect(110, 64, 2, 16); g.fillRect(50, 80, 2, 16); g.fillRect(10, 96, 2, 16); g.fillRect(80, 112, 2, 16); }, 1), roughness: .5 }),
  carpet: () => mat('#ffc6e2', { roughness: .95 }), carpetB: () => mat('#cfe8ff', { roughness: .95 }), carpetY: () => mat('#fff0b3', { roughness: .95 })
};
const WALL = mat('#fff4fb', { roughness: .8 }), WALL_IN = mat('#ffe6f4', { roughness: .8 }), TRIM = mat('#ffd23f', { metalness: .4, roughness: .35 });
const GLASS = new THREE.MeshStandardMaterial({ color: '#bfe6ff', transparent: true, opacity: .35, roughness: .05, metalness: .2 });

function bx(w, h, d, m, x, y, z, parent) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = true; b.receiveShadow = true; parent.add(b); return b; }
function cyl(rt, rb, h, m, x, y, z, parent, seg = 20) { const c = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m); c.position.set(x, y, z); c.castShadow = true; c.receiveShadow = true; parent.add(c); return c; }
function sph(r, m, x, y, z, parent, sc) { const s = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), m); s.position.set(x, y, z); if (sc) s.scale.set(...sc); s.castShadow = true; parent.add(s); return s; }

/* ---------- the house ---------- */
const COLL = [[], []];   // wall boxes you can't walk through, per floor
const WALLM = [];        // wall meshes (faded when they hide Molly)
const level = [new THREE.Group(), new THREE.Group()]; scene.add(level[0], level[1]); level[1].position.y = UP;
const ROOF = new THREE.Group(); ROOF.position.y = UP; ROOF.visible = false; scene.add(ROOF);
// wall along x (axis 'x', z fixed) or along z (axis 'z', x fixed); openings: [{at, w, type:'door'|'window', sill, h}]
function wall(axis, fixed, a, b, f, open = [], m = WALL, t = .5) {
  const P = level[f], H = WALL_H, segs = []; let cur = a;
  open = open.slice().sort((p, q) => p.at - q.at);
  const piece = (from, to, y0, y1) => {
    const len = to - from; if (len <= .01 || y1 - y0 <= .01) return;
    const mid = (from + to) / 2, cy = (y0 + y1) / 2;
    if (y0 < 3) COLL[f].push(axis === 'x' ? { x0: from, x1: to, z0: fixed - t / 2, z1: fixed + t / 2 } : { x0: fixed - t / 2, x1: fixed + t / 2, z0: from, z1: to });
    WALLM.push(axis === 'x' ? bx(len, y1 - y0, t, m, mid, cy, fixed, P) : bx(t, y1 - y0, len, m, fixed, cy, mid, P));
  };
  open.forEach(o => {
    const s0 = o.at - o.w / 2, s1 = o.at + o.w / 2;
    piece(cur, s0, 0, H);
    if (o.type === 'door') piece(s0, s1, 7.5, H);
    else {
      const sill = o.sill ?? 3, top = sill + (o.h ?? 4.5);
      piece(s0, s1, 0, sill); piece(s0, s1, top, H);
      const gl = new THREE.Mesh(new THREE.BoxGeometry(axis === 'x' ? o.w : .1, top - sill, axis === 'x' ? .1 : o.w), GLASS);
      gl.position.set(axis === 'x' ? o.at : fixed, (sill + top) / 2, axis === 'x' ? fixed : o.at); P.add(gl);
      // golden frame + cross
      const fw = axis === 'x' ? [o.w + .4, .25, t + .2] : [t + .2, .25, o.w + .4];
      bx(...fw, TRIM, axis === 'x' ? o.at : fixed, sill, axis === 'x' ? fixed : o.at, P);
      bx(...fw, TRIM, axis === 'x' ? o.at : fixed, top, axis === 'x' ? fixed : o.at, P);
      bx(axis === 'x' ? .15 : t + .1, top - sill, axis === 'x' ? t + .1 : .15, TRIM, axis === 'x' ? o.at : fixed, (sill + top) / 2, axis === 'x' ? fixed : o.at, P);
    }
    cur = s1;
  });
  piece(cur, b, 0, H);
  // top trim
  if (axis === 'x') bx(b - a, .3, t + .15, TRIM, (a + b) / 2, H + .15, fixed, P); else bx(t + .15, .3, b - a, TRIM, fixed, H + .15, (a + b) / 2, P);
}
const W = (at, w = 5, sill, h) => ({ at, w, type: 'window', sill, h });
const D = (at, w = 3.5) => ({ at, w, type: 'door' });

function buildHouse() {
  // floors
  ROOMS.forEach(r => {
    const w = r.x[1] - r.x[0], d = r.z[1] - r.z[0], m = FLOORS[r.floor]();
    if (m.map) m.map.repeat.set(w / 4, d / 4);
    const slab = new THREE.Mesh(new THREE.BoxGeometry(w, .4, d), m);
    slab.position.set((r.x[0] + r.x[1]) / 2, -.2, (r.z[0] + r.z[1]) / 2); slab.receiveShadow = true; level[r.f].add(slab);
  });
  // ceilings under the upstairs floors (part of the upstairs, so they only show when walking or looking upstairs)
  ROOMS.filter(r => r.f === 1).forEach(r => {
    const c = new THREE.Mesh(new THREE.PlaneGeometry(r.x[1] - r.x[0], r.z[1] - r.z[0]), mat('#fffaf2', { side: THREE.DoubleSide, roughness: .9 }));
    c.rotation.x = Math.PI / 2; c.position.set((r.x[0] + r.x[1]) / 2, -.42, (r.z[0] + r.z[1]) / 2); level[1].add(c);
  });
  // roof over the upstairs: only shown while walking inside, so the castle feels like a real place
  bx(41, .5, 39, mat('#ffe6f4', { roughness: .8 }), 0, WALL_H + .55, 0, ROOF);
  // upstairs balcony bits beside the stair opening (x -6..6, z 2..8 is open between the two side flights)
  // ground exterior
  wall('x', -19, -20, 20, 0, [W(-13), W(0, 3, 5, 2.5), W(13, 6)]);
  wall('x', 19, -20, 20, 0, [W(-13, 6), { at: 0, w: 6, type: 'door' }, W(13, 6)]);
  wall('z', -20, -19, 19, 0, [W(-9), W(10, 6)]);
  wall('z', 20, -19, 19, 0, [W(-12), W(12)]);
  // ground interior
  wall('z', -6, -19, 19, 0, [D(-7), D(12, 6)], WALL_IN, .4);
  wall('z', 6, -19, 19, 0, [D(-7), D(10, 7)], WALL_IN, .4);
  wall('x', 0, -20, -6, 0, [D(-13, 7)], WALL_IN, .4);
  wall('x', -4, -6, 6, 0, [D(0, 7)], WALL_IN, .4);
  wall('x', -10, -6, 6, 0, [D(3)], WALL_IN, .4);
  // upstairs exterior (big window over the front door lights the Grand Hall)
  wall('x', -19, -20, 20, 1, [W(-13), W(0, 4), W(13, 6)]);
  wall('x', 19, -20, 20, 1, [W(-13), W(0, 7, 1.5, 6), W(13)]);
  wall('z', -20, -19, 19, 1, [W(-9), W(10)]);
  wall('z', 20, -19, 19, 1, [W(-12, 6), W(12, 3)]);
  // upstairs interior
  wall('z', -6, -19, 19, 1, [D(-10), D(0)], WALL_IN, .4);
  wall('z', 6, -19, 19, 1, [D(-6)], WALL_IN, .4);
  wall('x', 0, -20, -6, 1, [], WALL_IN, .4);
  wall('x', 6, 6, 20, 1, [D(9)], WALL_IN, .4);
  // fireplace wall chimney in the Great Room
  bx(1.5, 9, 7, mat('#fff4fb'), 19.2, 4.5, 0, level[0]); COLL[0].push({ x0: 18.4, x1: 20, z0: -3.5, z1: 3.5 });
  COLL[1].push({ x0: -2.5, x1: 2.5, z0: 1.9, z1: 2.1 });   // balcony railing
  buildStairs(); buildYard();
}

/* grand staircase: a wide center flight up to a landing, then two flights split left and right to the balcony */
function buildStairs() {
  const G = level[0], step = mat('#ffffff', { roughness: .5 }), run = mat('#ff8fc8', { roughness: .9 }), s0 = WALLM.length;
  setTimeout(() => WALLM.slice(s0).forEach(m => { if (!m.material.transparent) m.userData.stair = 1; }));   // steps don't fade while walking
  const rise = 5 / 7;
  for (let i = 0; i < 7; i++) {              // center flight: z 18 -> 12, 0 -> 5 ft
    const top = rise * (i + 1), z = 18 - i * (6 / 7) - (6 / 7) / 2;
    WALLM.push(bx(8, top, 6 / 7, step, 0, top / 2, z, G)); bx(4.5, .06, 6 / 7, run, 0, top + .03, z, G);
  }
  WALLM.push(bx(11, 5, 4, step, 0, 2.5, 10, G)); bx(6, .06, 4, run, 0, 5.03, 10, G);   // landing z 12 -> 8
  [-1, 1].forEach(sd => {                     // side flights: z 8 -> 2, 5 -> 10 ft
    for (let i = 0; i < 7; i++) {
      const top = 5 + rise * (i + 1), z = 8 - i * (6 / 7) - (6 / 7) / 2;
      WALLM.push(bx(3, top, 6 / 7, step, sd * 4, top / 2, z, G)); bx(1.8, .06, 6 / 7, run, sd * 4, top + .03, z, G);
    }
    // golden railings along the inside edge of each side flight
    const r = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, Math.hypot(6, 5), 8), TRIM);
    r.position.set(sd * 2.5, 5 + 2.5 + 3, 5); r.rotation.x = -Math.atan2(6, 5); G.add(r);
    for (let i = 0; i <= 6; i++) { const y = 5 + rise * i; cyl(.07, .07, 3, TRIM, sd * 2.5, y + 1.5, 8 - i, G, 6); }
  });
  // center flight railings
  [-1, 1].forEach(sd => {
    const r = new THREE.Mesh(new THREE.CylinderGeometry(.12, .12, Math.hypot(6, 5), 8), TRIM);
    r.position.set(sd * 4, 2.5 + 3, 15); r.rotation.x = -Math.atan2(6, 5); G.add(r);
    for (let i = 0; i <= 6; i++) cyl(.07, .07, 3, TRIM, sd * 4, rise * i + 1.5, 18 - i, G, 6);
    sph(.35, TRIM, sd * 4, 3.4, 18.2, G);
  });
  // balcony railing upstairs between the two flights, and along the stair opening
  const B = level[1];
  bx(5, .2, .2, TRIM, 0, 3, 2, B); for (let x = -2.5; x <= 2.5; x += .8) cyl(.06, .06, 3, TRIM, x, 1.5, 2, B, 6);
  // chandelier in the two-story Grand Hall
  const ch = new THREE.Group(); ch.position.set(0, 15, 13); G.add(ch);
  cyl(.06, .06, 4, TRIM, 0, 2, 0, ch, 6); const ring = new THREE.Mesh(new THREE.TorusGeometry(1.6, .1, 8, 32), TRIM); ring.rotation.x = Math.PI / 2; ch.add(ring);
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; cyl(.08, .08, .5, mat('#fff6c2'), Math.cos(a) * 1.6, .3, Math.sin(a) * 1.6, ch, 6); sph(.12, mat('#ffa53b', { emissive: '#ffa53b', emissiveIntensity: .8 }), Math.cos(a) * 1.6, .65, Math.sin(a) * 1.6, ch); }
  sph(.5, mat('#bfe6ff', { transparent: true, opacity: .8 }), 0, -.6, 0, ch);
  const glow = new THREE.PointLight('#fff1d6', 25, 22); glow.position.set(0, 14, 13); G.add(glow);
}

/* yard: lawn, path to the front door, fence, trees, flowers and a pond */
function buildYard() {
  const Y = new THREE.Group(); scene.add(Y);
  const grass = new THREE.Mesh(new THREE.CircleGeometry(130, 64), mat('#8ee08e', { roughness: 1 })); grass.rotation.x = -Math.PI / 2; grass.position.y = -.42; grass.receiveShadow = true; Y.add(grass);
  const path = new THREE.Mesh(new THREE.PlaneGeometry(6, 24), mat('#f2d4a8')); path.rotation.x = -Math.PI / 2; path.position.set(0, -.38, 31); path.receiveShadow = true; Y.add(path);
  const post = mat('#ffffff'), rail = mat('#ffffff');
  for (let i = 0; i < 96; i++) {           // round picket fence
    const a = i / 96 * Math.PI * 2; if (Math.abs(a - Math.PI / 2) < .08) continue;
    cyl(.15, .15, 3, post, Math.cos(a) * 46, 1.1, Math.sin(a) * 46, Y, 6);
  }
  const fr = new THREE.Mesh(new THREE.TorusGeometry(46, .1, 6, 160), rail); fr.rotation.x = Math.PI / 2; fr.position.y = 2; Y.add(fr);
  const TREE = [[-32, -28, '#ffb3d9'], [32, -30, '#ffb3d9'], [-36, 18, '#7ed37e'], [36, 22, '#ffb3d9'], [-24, 36, '#7ed37e'], [26, 38, '#ffb3d9'], [0, -36, '#7ed37e'], [-40, -6, '#ffb3d9'], [40, -2, '#7ed37e']];
  TREE.forEach(([x, z, c]) => { cyl(.6, .9, 7, mat('#9b6a43'), x, 3.1, z, Y, 10); sph(4, mat(c), x, 8.5, z, Y); sph(2.8, mat(c), x - 2.4, 7.4, z + 1, Y); sph(2.6, mat(c), x + 2.4, 7.6, z - 1, Y); });
  const FL = ['#ff6fb1', '#ffe14d', '#b77dff', '#ff5a5a', '#59b7ff', '#ffffff'];
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, r = 25 + Math.random() * 19, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.abs(x) < 5 && z > 18) continue;
    cyl(.05, .05, .8, mat('#4caf50'), x, 0, z, Y, 4); sph(.35, mat(FL[i % FL.length]), x, .5, z, Y);
  }
  // flower beds along the front of the house
  for (let x = -19; x <= 19; x += 1.4) { if (Math.abs(x) < 4) continue; sph(.6, mat('#6ad46a'), x, .1, 20.3, Y); sph(.25, mat(FL[Math.abs(Math.round(x)) % FL.length]), x, .55, 20.4, Y); }
