<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Kids Games</title>
<link rel="apple-touch-icon" href="unicorn-icon-180.png">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(#8fd3ff, #fde2ff);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 20px 16px; gap: 22px;
  }
  h1 { margin: 0; font-size: clamp(34px, 8vw, 56px); color: #fff; text-shadow: 3px 3px 0 #7b2cbf, 6px 6px 0 #1a1a1a; text-align: center; }
  .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; width: 100%; max-width: 640px; }
  @media (max-width: 480px) { .games { grid-template-columns: 1fr; max-width: 340px; } }
  a.game {
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-decoration: none;
    background: #fff; border-radius: 26px; padding: 18px 14px 20px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
    border: 5px solid var(--c); color: #1a1a1a; transition: transform .1s;
  }
  a.game:active { transform: translateY(5px); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
  a.game img { width: 100%; max-width: 200px; aspect-ratio: 1; object-fit: contain; }
  a.game .t { font-size: 26px; font-weight: 900; text-align: center; line-height: 1.15; }
  a.game .s { font-size: 16px; font-weight: 600; color: #555; text-align: center; }
</style>
</head>
<body>
  <h1>Kids Games</h1>
  <div class="games">
    <a class="game" href="unicorn-math.html" style="--c:#c77dff">
      <img src="unicorn-icon-512.png" alt="">
      <div class="t">Unicorn Math</div>
      <div class="s">Adding and taking away</div>
    </a>
    <a class="game" href="whistler-trucks.html" style="--c:#d62828">
      <img src="trucks-icon-512.png" alt="">
      <div class="t">Whistler's Monster Trucks</div>
      <div class="s">Colors, counting, letters and jumps</div>
    </a>
    <a class="game" href="molly-wonderland.html" style="--c:#ff6fb1">
      <img src="molly-icon-512.png" alt="">
      <div class="t">Molly's Wonderland</div>
      <div class="s">Decorate, dress up and castle fun</div>
    </a>
  </div>
</body>
</html>
