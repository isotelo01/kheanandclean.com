<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="/images/favicon-lotus-192.png">
<title>Instant Quote &middot; Khean &amp; Clean</title>
<meta name="description" content="Answer a few quick questions and get your carpet, tile, upholstery or hard floor cleaning price in about two minutes.">
<meta name="theme-color" content="#0A0A0B">
<meta property="og:title" content="Get your cleaning price in 2 minutes · Khean & Clean">
<meta property="og:image" content="https://kheanandclean.com/images/hero-van.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
/* Quote Finder: the guided walkthrough. One question at a time; the answers fill the
   same estimate the homepage and the in-house estimator use (pricing.js + the Settings
   prices via pricing-live.js), and the lead it files carries estimateData, so New quote
   on the Leads page rebuilds it in the estimator. Plain Archivo everywhere. */
:root{
  --ink:#0A0A0B; --ink-2:#161310; --card:#1b1814; --line:rgba(244,239,226,.16);
  --gold:#E3B64A; --gold-d:#b98f2e; --ivory:#F4EFE2; --muted:rgba(244,239,226,.62);
  --green:#7fd1a4; --red:#ff9b8a;
}
*{ box-sizing:border-box; }
html,body{ margin:0; }
body{ min-height:100svh; background:var(--ink); color:var(--ivory);
  font:400 17px/1.45 "Archivo",system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased; }
[hidden]{ display:none !important; }
h1:focus{ outline:none; }
a{ color:var(--gold); }
.wrap{ max-width:560px; margin:0 auto; padding:16px 16px calc(32px + env(safe-area-inset-bottom)); }
/* Letterhead */
/* Slim top bar: small logo (goes to the home page) with the phone number right next to it (tap to call). */
.head{ display:flex; align-items:center; gap:12px; padding:4px 0 10px; border-bottom:1px solid var(--line); margin-bottom:14px; }
.head img{ display:block; width:auto; height:42px; margin:0; }
.head p{ margin:0; font-size:.95rem; font-weight:600; letter-spacing:.02em; color:var(--gold); }
.head a{ color:inherit; text-decoration:none; }
.head p a{ display:inline-flex; align-items:center; gap:6px; padding:6px 0; }
/* Progress */
.bar{ height:4px; background:rgba(255,255,255,.08); border-radius:4px; overflow:hidden; margin:0 0 20px; }
.sqft{ margin:-12px 0 16px; text-align:right; color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums; }
.sqft b{ color:var(--gold); }
/* Running price breakdown under the sq ft line: each service, its line items, then the total. */
.inv{ margin:-6px 0 16px; padding:10px 14px; border:1px solid var(--line); border-radius:10px; font-size:1.05rem; line-height:1.45; color:var(--muted); font-variant-numeric:tabular-nums; }
.inv .r{ display:flex; justify-content:space-between; gap:10px; }
.inv .svc{ color:#fff; font-weight:700; margin-top:6px; }
.inv .svc:first-child{ margin-top:0; }
.inv .it{ padding-left:12px; }
.pcold{ margin:0 0 16px; border:1px solid var(--line); border-radius:10px; padding:10px 14px; color:var(--muted); }
.pcold summary{ cursor:pointer; display:flex; justify-content:space-between; color:#fff; font-weight:700; list-style:none; }
.pcold summary::-webkit-details-marker{ display:none; }
.pcold summary::after{ content:"▾"; margin-left:8px; color:var(--gold); }
.pcold[open] summary::after{ content:"▴"; }
.pcold summary b{ margin-left:auto; font-weight:600; color:var(--muted); }
.pcold .inv{ margin:10px 0 0; border:0; padding:0; }
body.hideSum .inv.pc{ display:block; }   /* the confirm page shows its own boxes */
.inv .phhd{ color:var(--gold); font-weight:700; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
.inv .phhd + .svc{ margin-top:0; }
.inv .tot{ border-top:1px solid var(--line); margin-top:8px; padding-top:6px; color:#fff; font-weight:700; }
.inv .tot b{ color:var(--gold); }
.inv .note{ font-size:.78rem; margin-top:2px; }
/* Package line: underlined, tap to drop down every room with its sq ft. */
.inv .drop{ cursor:pointer; }
.inv .drop > span:first-child{ text-decoration:underline; text-underline-offset:3px; }
.inv .drop i{ font-style:normal; display:inline-block; margin-left:4px; transition:transform .2s; }
.inv .drop.open i{ transform:rotate(180deg); }
.inv .rm{ padding-left:26px; font-size:.97em; }
.inv .tot{ margin-top:8px; padding-top:8px; border-top:1px solid var(--line); color:#fff; font-weight:700; font-size:1.15em; }
.inv .tot b{ color:var(--gold); }
body:not(.rp) .sqft.dup{ display:none; }   /* total lives at the bottom of the box instead */
.inv .gold{ color:var(--gold); }
.inv [hidden]{ display:none; }
.bar i{ display:block; height:100%; width:0; background:var(--gold); transition:width .3s ease; }
/* First screen: full screen, no letterhead (it comes back on the next screen). */
body.first .head, body.first .bar, body.first .sqft, body.first .inv{ display:none; }
body.rp .inv{ display:none; }   /* no price breakdown on the room-by-room photo screens */
body.hideSum .sqft, body.hideSum .inv{ display:none; }   /* keep the question the focus until the photo step */
body.first .wrap{ padding-top:calc(28px + env(safe-area-inset-top)); }
/* Opening: thank you, we're here for you, then the question slides up to the top. */
.intro{ position:fixed; inset:0; z-index:50; background:var(--ink); display:flex; align-items:center; justify-content:center;
  padding:24px; text-align:center; cursor:pointer; transition:background-color .35s ease; }
.intro p{ position:absolute; left:0; top:0; margin:0; width:max-content; text-align:left; transform-origin:0 0;
  font:700 1.55rem/1.2 "Archivo",system-ui,sans-serif; color:var(--ivory); opacity:0;
  transition:transform .9s cubic-bezier(.2,.8,.2,1), opacity .6s ease; }
.intro p .g{ color:var(--gold); }
.intro p.d{ font-size:1.15rem; font-weight:500; color:var(--muted); }
.intro.lift{ background:transparent; pointer-events:none; }
/* The intro's starry backdrop, kept dimmed behind every screen of the builder. */
.sky{ position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; opacity:.6;
  background:radial-gradient(120% 75% at 50% 32%, #1c1609 0%, #08090d 52%, #000 100%); }
.sky canvas{ position:absolute; inset:0; width:100%; height:100%; }
.sky .rays{ position:absolute; left:50%; top:34%; width:170vmax; height:170vmax; translate:-50% -50%; opacity:.55;
  background:conic-gradient(from 0deg, transparent 0 7%, rgba(227,182,74,.09) 10%, transparent 13% 28%, rgba(227,182,74,.06) 31%, transparent 35% 54%, rgba(227,182,74,.08) 57%, transparent 61% 79%, rgba(227,182,74,.06) 82%, transparent 86%);
  -webkit-mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); animation:i2spin 60s linear infinite; }
/* New opening (intro2): logo drawn in by a gold scan line, ring, shimmer, sparks, blur-in words. */
.intro2{ position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:24px; text-align:center; overflow:hidden; cursor:pointer;
  background:radial-gradient(120% 75% at 50% 32%, #1c1609 0%, #08090d 52%, #000 100%); transition:opacity .75s ease, filter .75s ease, transform .75s ease; }
.intro2.out{ opacity:0; filter:blur(8px); transform:scale(1.04); pointer-events:none; }
.intro2 canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.intro2 .rays{ position:absolute; left:50%; top:34%; width:170vmax; height:170vmax; translate:-50% -50%; opacity:0; transition:opacity 1.8s ease; pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0 7%, rgba(227,182,74,.09) 10%, transparent 13% 28%, rgba(227,182,74,.06) 31%, transparent 35% 54%, rgba(227,182,74,.08) 57%, transparent 61% 79%, rgba(227,182,74,.06) 82%, transparent 86%);
  -webkit-mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); animation:i2spin 30s linear infinite; }
.intro2.on .rays{ opacity:1; }
@keyframes i2spin{ to{ rotate:360deg; } }
.intro2 .mark{ position:relative; width:min(54vw,230px); aspect-ratio:1280/1143; z-index:1; margin-bottom:calc(min(54vw,230px) * .22); }
.intro2 .mark img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; clip-path:inset(100% 0 0 0); transition:clip-path 1.6s cubic-bezier(.45,.05,.25,1), filter 1.2s ease;
  filter:drop-shadow(0 0 22px rgba(227,182,74,.55)) brightness(1.25); }
.intro2.on .mark img{ clip-path:inset(-10% -10% -10% -10%); }
.intro2.drawn .mark img{ filter:drop-shadow(0 0 14px rgba(227,182,74,.35)) brightness(1); }
.intro2 .scan{ position:absolute; left:-12%; right:-12%; bottom:0; height:3px; border-radius:3px; opacity:0;
  background:linear-gradient(90deg, transparent, #fff3cf 30%, #fffaf0 50%, #fff3cf 70%, transparent); box-shadow:0 0 16px 4px rgba(227,182,74,.85), 0 0 46px 10px rgba(227,182,74,.35);
  transition:bottom 1.6s cubic-bezier(.45,.05,.25,1), opacity .3s ease; }
.intro2.on .scan{ bottom:100%; opacity:1; }
.intro2.drawn .scan{ opacity:0; }
.intro2 .shine{ position:absolute; inset:0; pointer-events:none; background:linear-gradient(105deg, transparent 38%, rgba(255,246,220,.85) 50%, transparent 62%) no-repeat; background-size:260% 100%; background-position:160% 0;
  -webkit-mask:url(/images/logo-clear-1280.png) center/contain no-repeat; mask:url(/images/logo-clear-1280.png) center/contain no-repeat; mix-blend-mode:screen; }
.intro2.drawn .shine{ transition:background-position 1.3s ease .15s; background-position:-60% 0; }
.intro2 svg{ position:absolute; left:50%; top:50%; width:150%; height:auto; translate:-50% -50%; overflow:visible; pointer-events:none; }
.intro2 circle{ fill:none; stroke:#E3B64A; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(227,182,74,.9)); }
.intro2 .r1{ stroke-width:1.1; stroke-dasharray:352; stroke-dashoffset:352; transform-origin:60px 60px; transform:rotate(-90deg); transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1); }
.intro2.drawn .r1{ stroke-dashoffset:0; }
.intro2 .r2{ stroke-width:.6; stroke-dasharray:2 7; opacity:0; transform-origin:60px 60px; transition:opacity 1s ease .4s; animation:i2spin 18s linear infinite reverse; }
.intro2.drawn .r2{ opacity:.7; }
.intro2 .lines{ position:relative; z-index:1; max-width:560px; }
.intro2 .lines p{ margin:0 0 10px; font:700 1.45rem/1.3 "Archivo",sans-serif; color:#fff; letter-spacing:.005em; }
.intro2 .lines p.d{ font:500 1.02rem/1.45 "Archivo",sans-serif; color:var(--muted); margin-top:8px; }
.intro2 .w{ display:inline-block; opacity:0; filter:blur(10px); transform:translateY(14px); }
.intro2 .lines p.in .w{ animation:i2word .75s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes i2word{ to{ opacity:1; filter:blur(0); transform:none; } }
.intro2 .g{ background:linear-gradient(100deg, #b8862e, #f7e7a8 45%, #e3b64a 60%, #b8862e); -webkit-background-clip:text; background-clip:text; color:transparent; }
.intro2 .skip{ position:absolute; bottom:max(22px, env(safe-area-inset-bottom)); left:50%; translate:-50% 0; z-index:1; font:500 .8rem "Archivo",sans-serif; color:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:6px 14px; opacity:0; animation:i2word .6s ease 1.4s forwards; filter:none; transform:none; }
@keyframes i2in{ from{ opacity:0; filter:blur(10px); transform:translateY(14px); } to{ opacity:1; filter:blur(0); transform:none; } }
.step.go-in h1, .step.go-in .lead{ animation:i2in .7s cubic-bezier(.2,.8,.2,1) both; }
.step.enter h1, .step.enter .lead{ opacity:0; }
.step.enter .opt, .step.enter .go{ opacity:0; transform:translateY(16px); }
.step.go-in .opt, .step.go-in .go{ animation:rise .68s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise{ to{ opacity:1; transform:none; } }
/* "Signature" in red script, like the home page. */
.sigScript{ font-family:"Dancing Script",cursive; font-weight:600; font-size:1.3em; line-height:1; color:#EA5545; }
.opt small .sigScript{ font-size:1.35em; }
/* More info button + package pop-up */
.moreinfo{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin:6px 0 0; padding:12px 16px; cursor:pointer;
  font:600 .95rem "Archivo",sans-serif; color:var(--gold); background:linear-gradient(180deg, rgba(227,182,74,.10), rgba(227,182,74,.03));
  border:1px solid rgba(227,182,74,.55); border-radius:999px; box-shadow:0 0 0 0 rgba(227,182,74,0), inset 0 1px 0 rgba(255,255,255,.06); transition:box-shadow .25s, transform .15s; }
.moreinfo:hover{ box-shadow:0 0 22px rgba(227,182,74,.25), inset 0 1px 0 rgba(255,255,255,.06); }
.moreinfo:active{ transform:scale(.98); }
.pkgpop{ position:fixed; inset:0; z-index:70; background:rgba(0,0,0,0); display:flex; align-items:flex-end; justify-content:center; transition:background .3s; }
.pkgpop.on{ background:rgba(0,0,0,.72); }
.pkgsheet{ width:100%; max-width:980px; max-height:88vh; overflow:auto; background:#0b0b0c; border:1px solid rgba(227,182,74,.35); border-bottom:0; border-radius:20px 20px 0 0;
  padding:16px 0 22px; transform:translateY(100%); transition:transform .38s cubic-bezier(.2,.8,.2,1); }
.pkgpop.on .pkgsheet{ transform:none; }
.pkgtop{ display:flex; justify-content:space-between; align-items:center; padding:0 18px 12px; color:#fff; font:700 1.1rem "Archivo",sans-serif; }
.pkgx{ background:none; border:1px solid rgba(255,255,255,.25); color:#fff; width:34px; height:34px; border-radius:50%; font-size:1.3rem; line-height:1; cursor:pointer; }
.pkgrow{ display:grid; grid-auto-flow:column; grid-auto-columns:min(82%,300px); gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 18px 8px; -webkit-overflow-scrolling:touch; }
@media (min-width:900px){ .pkgrow{ grid-auto-flow:row; grid-template-columns:repeat(4,1fr); overflow:visible; } .pkghint{ display:none; } }
.pk{ position:relative; scroll-snap-align:center; background:linear-gradient(170deg,#17140d,#0d0d0f 60%); border:1px solid rgba(227,182,74,.3); border-radius:16px; padding:18px 16px;
  color:#fff; opacity:0; transform:translateY(14px); animation:qOpt .5s cubic-bezier(.2,.8,.2,1) .12s forwards; }
.pk.pick{ border-color:var(--gold); box-shadow:0 0 26px rgba(227,182,74,.18); }
.pk .flag{ position:absolute; top:-10px; right:14px; background:var(--gold); color:#111; font:700 .72rem "Archivo",sans-serif; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:999px; }
.pk .no{ margin:0 0 4px; font:600 .72rem "Archivo",sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.pk h3{ margin:0 0 6px; font:700 1.25rem "Archivo",sans-serif; }
.pk h3 .gold{ color:var(--gold); }
.pk .rate{ margin:0 0 8px; color:var(--gold); font:600 1rem "Archivo",sans-serif; }
.pk .for{ margin:0 0 10px; color:var(--muted); font-size:.92rem; line-height:1.4; }
.pk ul{ margin:0; padding:0; list-style:none; }
.pk li{ position:relative; padding:5px 0 5px 22px; font-size:.92rem; border-top:1px solid rgba(255,255,255,.06); }
.pk li::before{ content:"\2713"; position:absolute; left:0; color:var(--gold); }
.pk li.carry{ color:var(--gold); font-weight:600; }
.pkghint{ margin:8px 0 0; text-align:center; color:var(--muted); font-size:.8rem; }
/* "More info" pill inside each package box, on the right */
.opt.hasinfo{ align-items:center; }
.optinfo{ flex:none; display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; margin:-4px -6px -4px 0; border-radius:999px; cursor:pointer;
  font:600 .82rem "Archivo",sans-serif; color:var(--gold); border:1px solid rgba(227,182,74,.55); background:rgba(227,182,74,.08); white-space:nowrap; transition:background .2s, box-shadow .2s; }
.optinfo:hover, .optinfo:focus-visible{ background:rgba(227,182,74,.18); box-shadow:0 0 14px rgba(227,182,74,.25); outline:none; }
.opt[aria-pressed="true"].hasinfo::after{ display:none; }
/* Estimate: + next to a service's sq ft drops down its rooms */
.est .ln.sub{ align-items:center; }
.rmtog{ flex:none; width:24px; height:24px; margin-right:8px; border-radius:50%; border:1px solid rgba(227,182,74,.6); background:rgba(227,182,74,.1); color:var(--gold);
  font:700 1rem/1 "Archivo",sans-serif; cursor:pointer; padding:0; }
.rmlist{ margin:2px 0 6px 32px; padding-left:10px; border-left:2px solid rgba(227,182,74,.35); }
.est .ln.rm{ font-size:.86rem; color:var(--muted); padding:3px 0; display:flex; gap:10px; }
.est .ln.rm span:first-child{ flex:1; }
.est .ln.rm .rq{ white-space:nowrap; }
.pkgpop.one{ align-items:center; padding:16px; }
.pkgpop.one .pkgsheet{ max-width:420px; border-bottom:1px solid rgba(227,182,74,.35); border-radius:20px; transform:translateY(24px) scale(.96); opacity:0; transition:transform .32s cubic-bezier(.2,.8,.2,1), opacity .25s; }
.pkgpop.one.on .pkgsheet{ transform:none; opacity:1; }
.pkgpop.one .pkgrow{ grid-auto-flow:row; grid-template-columns:1fr; overflow:visible; }
.pkgact{ padding:6px 18px 0; }
.pkgact .go{ width:100%; margin:0; }
/* Between questions: tapped answer glows, old question slides away and blurs, new one glides in. */
#screen{ position:relative; overflow-x:clip; }
.step.leaving{ position:absolute; top:0; left:0; right:0; pointer-events:none; animation:qOutL .32s cubic-bezier(.55,0,.8,.3) .12s both; }
.step.leaving.to-right{ animation-name:qOutR; }
@keyframes qOutL{ to{ opacity:0; transform:translateX(-22%) scale(.96); filter:blur(8px); } }
@keyframes qOutR{ to{ opacity:0; transform:translateX(22%) scale(.96); filter:blur(8px); } }
.step.from-right{ animation:qInR .55s cubic-bezier(.2,.8,.2,1) .4s both; }
.step.from-left{ animation:qInL .55s cubic-bezier(.2,.8,.2,1) .4s both; }
@keyframes qInR{ from{ opacity:0; transform:translateX(20%); filter:blur(8px); } to{ opacity:1; transform:none; filter:blur(0); } }
@keyframes qInL{ from{ opacity:0; transform:translateX(-20%); filter:blur(8px); } to{ opacity:1; transform:none; filter:blur(0); } }
.opt.q-in, .go.q-in{ animation:qOpt .55s cubic-bezier(.2,.8,.2,1) both; }
@keyframes qOpt{ from{ opacity:0; transform:translateY(12px); } to{ opacity:1; transform:none; } }
.opt.picked, .go.picked{ animation:qPick .5s ease both; border-color:var(--gold); }
@keyframes qPick{ 0%{ box-shadow:0 0 0 0 rgba(227,182,74,0); } 35%{ box-shadow:0 0 0 2px rgba(227,182,74,.95), 0 0 30px 6px rgba(227,182,74,.55); background:rgba(227,182,74,.3); transform:scale(1.02); } 100%{ box-shadow:0 0 0 1px rgba(227,182,74,.8), 0 0 16px 2px rgba(227,182,74,.3); background:rgba(227,182,74,.22); transform:scale(1); } }
/* Screens */
.step h1{ font-size:1.55rem; line-height:1.2; margin:0 0 8px; font-weight:700; }
.step .lead{ margin:0 0 18px; color:var(--muted); }
.step .pitch{ margin:0 0 18px; padding:12px 14px; border-left:3px solid var(--gold); background:rgba(227,182,74,.07); border-radius:0 10px 10px 0; }
.opts{ display:grid; gap:10px; }
.grplab{ margin:10px 0 -2px; color:var(--gold); font-size:.8rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
.opt{ display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; text-align:left;
  background:var(--card); color:var(--ivory); border:1px solid var(--line); border-radius:14px;
  padding:15px 16px; font:600 1.02rem "Archivo",sans-serif; cursor:pointer; }
.opt small{ display:block; font-weight:400; font-size:.85rem; color:var(--muted); margin-top:2px; }
/* Room photos: First floor / Second floor toggle (two-story homes). */
.flseg{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:10px 0 12px; }
.flseg button{ font:600 13px system-ui,sans-serif; color:var(--ivory); background:transparent; border:1px solid rgba(244,239,226,.35); border-radius:999px; padding:6px 0; cursor:pointer; }
.flseg button[aria-pressed="true"]{ background:var(--gold); color:#000; border-color:var(--gold); }
/* After a room's photos: Review [room] and Next room cards slide in one after the other. */
.nx{ display:grid; gap:14px; margin-top:28px; }
.nx button{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; border-radius:18px; padding:14px 16px;
  font:600 1.1rem "Archivo",sans-serif; cursor:pointer; animation:nxIn .6s cubic-bezier(.2,.8,.2,1) both; transition:transform .15s; }
.nx button:nth-child(2){ animation-delay:.14s; }
.nx button:active{ transform:scale(.97); }
.nx .rv{ background:linear-gradient(135deg,rgba(227,182,74,.18),rgba(227,182,74,.04)); color:var(--ivory); border:1px solid rgba(227,182,74,.55); box-shadow:0 8px 24px rgba(0,0,0,.35); }
.nx .rv img{ width:58px; height:58px; border-radius:12px; object-fit:cover; flex:none; border:1px solid rgba(227,182,74,.5); }
.nx .rv small{ display:block; font-weight:400; font-size:.85rem; color:var(--muted); margin-top:3px; }
.nx .nr{ justify-content:center; padding:20px 16px; border:0; color:#140f05;
  background:linear-gradient(180deg,#F2CB66,var(--gold) 55%,var(--gold-d)); box-shadow:0 10px 28px rgba(227,182,74,.28), inset 0 1px 0 rgba(255,255,255,.45); }
.nx .ar{ margin-left:auto; font-size:1.4rem; color:var(--gold); }
.nx .nr .ar{ margin-left:4px; color:inherit; }
@keyframes nxIn{ from{ opacity:0; transform:translateX(48px); filter:blur(6px); } to{ opacity:1; transform:none; filter:blur(0); } }
@media (prefers-reduced-motion:reduce){ .nx button{ animation:none; } }

<body>
<div class="wrap">
  <header class="head">
    <a href="/"><img src="/images/logo-clear-1280.png" alt="Khean &amp; Clean Steam Cleaning" width="1280" height="420"></a>
    <p><a href="tel:+19167672520" aria-label="Call Khean &amp; Clean"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>(916) 767-2520</a></p>
  </header>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

<!-- Prices: pricing.js holds the starting prices, pricing-live.js lays the Settings prices over them. -->
<link rel="stylesheet" href="/quote-form.css"><!-- the open-days calendar look (scoped to .kcq) -->
<script src="/day-picker.js"></script>
<script src="/inHouseEstimator/pricing.js"></script>
<script src="/inHouseEstimator/pricing-live.js"></script>
<script src="/inHouseEstimator/burst-cam.js?v=20261106a" defer></script>
<script>
(function(){
  'use strict';
  var P = window.KC_PRICING, S = P.SERVICES;
  var screen = document.getElementById('screen'), backBtn = document.getElementById('back'), bar = document.getElementById('bar');

  /* Bedroom sizes for this walkthrough: a standard bedroom is 12x12, a master is
     12x14 (standard) or 14x16 (large). They go into the estimate as square feet. */
  var BED = 144, MASTER = { med:{ label:'Standard', dims:'about 12×14', sqft:168 }, lg:{ label:'Large', dims:'about 14×16', sqft:224 } };
  /* Master bedrooms are a list, one size each ('med' or 'lg'); matching sizes group together. */
  var masterSqft = function(k){ return (A.master[k || 'carpet'] || []).reduce(function(t, z){ return t + MASTER[z].sqft; }, 0); };
  var masterText = function(k){
    var l = A.master[k || 'carpet'] || [], g = [];
    ['med','lg'].forEach(function(z){ var n = l.filter(function(x){ return x === z; }).length; if(n) g.push(MASTER[z].label + ' × ' + n); });
    return g.join(', ') + ' (' + masterSqft(k) + ' sq ft)';
  };

  /* Room lists per floor type. Each key is a room from pricing.js / Settings (its size comes
     from there); 'beds' is the standard bedroom above. */
  var LISTS = {
    carpet: ['beds','living','hallway','stairs','den','loft','closet','dining'],
    tile:   ['kitchen','fullBath','masterBath','halfBath','foyer','grandFoyer','laundry'],
    lvp:    ['kitchen','living','dining','foyer','hallway','beds','fullBath','laundry','stairs'],
    stone:  ['kitchen','foyer','fullBath','masterBath','halfBath','dining','living','laundry','stairs']
  };
  /* Every room shows on every floor type: each list keeps its own most-likely rooms first,
     then the rest of the rooms follow. */
  var ALL_ROOMS = ['beds','living','greatRoom','kitchen','dining','den','loft','hallway','closet',
    'foyer','grandFoyer','fullBath','masterBath','halfBath','laundry','stairs'];
  Object.keys(LISTS).forEach(function(k){
    LISTS[k] = LISTS[k].concat(ALL_ROOMS.filter(function(x){ return LISTS[k].indexOf(x) < 0; }));
  });
  var NAMES = { beds:'Bedrooms', living:'Living / family rooms', hallway:'Hallways', stairs:'Flights of stairs',
    den:'Office / den', loft:'Loft / bonus room', closet:'Walk-in closets', dining:'Dining room',
    kitchen:'Kitchen', fullBath:'Bathrooms', masterBath:'Master bathroom', halfBath:'Half bath / powder room',
    foyer:'Entry / foyer', grandFoyer:'Grand foyer', laundry:'Laundry room', greatRoom:'Great room' };
  var SVC = {
    carpet:{ name:'Carpet', word:'carpet' }, tile:{ name:'Tile & grout', word:'tile' },
    upholstery:{ name:'Upholstery', word:'furniture' }, lvp:{ name:'Hardwood / LVP', word:'hardwood' },
    rugs:{ name:'Area rugs', word:'rugs' },
    stone:{ name:'Natural stone', word:'stone' }, other:{ name:'Other', word:'other' }
  };
  var ORDER = ['carpet','tile','lvp','stone','upholstery'];
  /* What they can pick on "What would you like cleaned?". Area rugs price as the carpet rug add-on,
     so someone who only wants rugs skips the carpet questions. */
  var PICKS = ['carpet','rugs','tile','lvp','stone','upholstery','other'];

  var room = function(k){ var r = null; P.ROOM_TYPES.forEach(function(x){ if(x.key === k) r = x; }); return r; };
  var sqftOf = function(k){ return k === 'beds' ? BED : ((room(k) || {}).sqft || 0); };
  var stairsPrice = function(){ var r = room('stairs'); return r && r.flat != null ? r.flat : S.carpet.addons.stairs.linear; };
  var money = function(n){ return '$' + Math.round(n).toLocaleString('en-US'); };
  var cents = function(n){ return '$' + n.toFixed(2); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

  /* Everything the customer answers. */
  var A = { problem:'', svcs:[], story:'', rooms:{}, master:{}, rugs:{ med:0, lg:0 }, pet:0, stain:0,
            vacuum:'', tier:'', matters:'', seal:'', uph:{}, uphPets:'', uphSpots:{}, uphN:{}, photos:[], skippedPhotos:false, disc:{} };
  ORDER.forEach(function(k){ A.rooms[k] = {}; });

  /* Photos-first: a room's measured size replaces its standard size (bedroom 144, etc.). */
  function stdSize(rm){ var p = rm.id.split('_'); return p[1] === 'master' ? ((MASTER[(A.master[p[0]] || [])[+p[2]]] || {}).sqft || 0) : sqftOf(p[1]); }
  var PH = false;   /* true while working out the "Estimated from photos" box: rooms use their photo-measured size */
  var NOPH = false, SPLIT = false;   /* NOPH: the usual sizes even after "Use new numbers"; SPLIT: one line per room (Bedroom 1, 2, 3) */
  function phOn(){ return !NOPH && (A.photoFirst || PH || (A.usePh && cur !== sPhotos)); }   /* A.usePh: they tapped "Use new numbers", so the price uses the photo sizes; the photos page always shows the estimator's sizes */
  function roomSize(rm){ var r = phOn() && A.photoSqft && A.photoSqft[rm.id]; return r && r.sqft ? r.sqft : stdSize(rm); }
  function photoDelta(k){
    if(!phOn() || !A.photoSqft) return 0;
    return photoRooms().reduce(function(t, rm){ var r = A.photoSqft[rm.id];
      return rm.id.indexOf(k + '_') === 0 && !rm.stairs && r && r.sqft ? t + r.sqft - stdSize(rm) : t; }, 0);
  }
  function sqftFor(svc){
    var t = 0, r = A.rooms[svc] || {};
    Object.keys(r).forEach(function(k){ if(k !== 'stairs') t += (r[k] || 0) * sqftOf(k); });
    t += masterSqft(svc) + photoDelta(svc);
    return t;
  }

  /* ---- The estimate: the same STATE the estimators use, priced the same way ---- */
  function buildState(){
    var st = {};
    ['carpet','tile','stone','lvp','commcarpet','commhard'].forEach(function(k){
      var rooms = {}, addons = {}, defs = S[k].addons || {};
      P.ROOM_TYPES.forEach(function(rt){ rooms[rt.key] = 0; });
      Object.keys(defs).forEach(function(a){
        addons[a] = { on:false };
        if(defs[a].needsQty) addons[a].qty = defs[a].qtyDefault;
        if(defs[a].sizes){ addons[a].sizes = {}; defs[a].sizes.forEach(function(z){ addons[a].sizes[z.key] = 0; }); }
      });
      st[k] = { mode:'sqft', sqft:0, rooms:rooms, collapsed:false, addons:addons, touched:false };
    });
    st.upholstery = { items:{}, touched:false };
    S.upholstery.items.forEach(function(it){ st.upholstery.items[it.key] = A.uph[it.key] || 0; });

    ['carpet','tile','lvp','stone'].forEach(function(k){
      if(A.svcs.indexOf(k) < 0) return;
      var s = st[k], r = A.rooms[k], extra = 0;
      s.mode = 'room';
      Object.keys(r).forEach(function(rk){
        if(!r[rk]) return;
        if(rk === 'beds') extra += r[rk] * BED;               /* bedrooms ride in as square feet */
        else if(s.rooms[rk] != null) s.rooms[rk] = r[rk];
        else extra += r[rk] * sqftOf(rk);
      });
      extra += masterSqft(k) + photoDelta(k);
      if(extra) s.rooms.addSqft = (s.rooms.addSqft || 0) + extra;
      s.touched = true;
    });
    var c = st.carpet;
    c.tier = A.tier || 'deep';
    c.addons.dry.on = c.tier !== 'essential';
    c.dryDefaultApplied = true;
    if(has('rugs') && (A.rugs.med || A.rugs.lg)) c.touched = true;   /* rugs only: they ride on the carpet line */
    if(A.rugs.med || A.rugs.lg){ c.addons.rug.on = true; c.addons.rug.sizes.med = A.rugs.med; c.addons.rug.sizes.lg = A.rugs.lg; }
    if(A.pet){ c.addons.pet.on = true; c.addons.pet.qty = A.pet; }
    if(A.stain){ c.addons.stain.on = true; c.addons.stain.qty = A.stain; }
    if(A.vacuum === 'us' && c.addons.hair) c.addons.hair.on = true;
    if(A.seal && st.tile.addons[A.seal]){ st.tile.addons[A.seal].on = true; st.tile.addons[A.seal].qty = sqftFor('tile'); }
    if(A.svcs.indexOf('upholstery') > -1) st.upholstery.touched = true;
    return st;
  }

  /* Same rules as computeServiceItems on the homepage and in app.js. */
  /* Every room behind a service's square footage, for the drop-down on the estimate (stairs are their own line). */
  function roomLines(k, rate){
    if(SPLIT && !phOn()) return photoRooms().filter(function(rm){ return rm.id.indexOf(k + '_') === 0 && !rm.stairs; }).map(function(rm){
      var sq = stdSize(rm); return { t: rm.t.split(' · ')[0], sq: sq, cost: sq * rate, id: rm.id }; });
    if(phOn() && A.photoSqft) return photoRooms().filter(function(rm){ return rm.id.indexOf(k + '_') === 0 && !rm.stairs; }).map(function(rm){
      var sq = roomSize(rm), m = A.photoSqft[rm.id] || {};   /* measured rooms show their size from the photos, e.g. 12′ × 14′* */
      var dim = m.sqft && m.L && m.W ? ' · ' + Math.round(m.L) + '′ × ' + Math.round(m.W) + '′*' : '';
      return { t: rm.t.split(' · ')[0] + dim, sq: sq, cost: sq * rate, id: rm.id }; });
    var r = (A.svcs.indexOf(k) > -1 && A.rooms[k]) || {}, out = [];
    Object.keys(r).forEach(function(rk){
      var n = r[rk] || 0; if(!n || rk === 'stairs') return;
      var each = sqftOf(rk); if(!each) return;
      out.push({ t: (ONE[rk] || NAMES[rk] || rk) + (n > 1 ? ' × ' + n : ''), sq: n * each, cost: n * each * rate });
    });
    ['med','lg'].forEach(function(z){
      var n = (A.master[k] || []).filter(function(x){ return x === z; }).length;
      if(n) out.push({ t: 'Master bedroom (' + MASTER[z].label.toLowerCase() + ')' + (n > 1 ? ' × ' + n : ''), sq: n * MASTER[z].sqft, cost: n * MASTER[z].sqft * rate });
    });
    return out;
  }
  function items(k, st){
    var s = S[k], x = st[k], out = [];
    if(s.mode !== 'area'){
      s.items.forEach(function(it){ var q = x.items[it.key] || 0; if(q > 0) out.push({ label: it.name + (q > 1 ? ' × ' + q : ''), cost: q * it.ft * s.rate }); });
      return out;
    }
    var sqft = 0, flat = 0;
    P.ROOM_TYPES.forEach(function(rt){ var q = x.rooms[rt.key] || 0; if(rt.flat != null) flat += q * rt.flat; else sqft += q * rt.sqft; });
    var rate = k === 'carpet' ? s.tiers[x.tier || 'essential'].sqft : s.rate;
    if(sqft > 0) out.push({ label: (k === 'carpet' ? s.tiers[x.tier].name : s.name) + ' — Est. ' + sqft.toLocaleString() + ' sq ft', cost: sqft * rate, rooms: roomLines(k, rate), sq: sqft });
    if(flat > 0) out.push({ label: (x.rooms.stairs >= 2 ? 'Flights of Stairs × ' + x.rooms.stairs : 'Flight of Stairs'), cost: flat, flights: x.rooms.stairs || 1 });
    Object.keys(s.addons || {}).forEach(function(a){
      var d = s.addons[a], o = x.addons[a];
      if(a === 'stairs') return;
      if(k === 'carpet' && x.tier === 'signature' && ['dry','deo','prot'].indexOf(a) > -1) return;
      if(k === 'carpet' && x.tier === 'essential' && ['prot','filter'].indexOf(a) > -1) return;
      if(k === 'carpet' && x.tier === 'quickdry' && ['dry','prot'].indexOf(a) > -1) return;
      if(k === 'carpet' && x.tier === 'deep' && a === 'dry'){ if(!sqft) return; out.push({ label: d.name, cost: 0, included: true }); return; }
      if(!o || !o.on) return;
      if(d.sizes){ d.sizes.forEach(function(z){ var n = (o.sizes || {})[z.key] || 0; if(n > 0) out.push({ label: d.name + ' — ' + z.label + ' × ' + n, cost: n * z.price }); }); return; }
      var cost = d.needsQty ? (o.qty || 0) * d.linear : d.flat ? d.flat : sqft * d.sqft;
      var nm = d.name;
      if((a === 'pet' || a === 'stain') && o.qty > 1) nm += ' × ' + o.qty;
      if(cost > 0) out.push({ label: nm, cost: cost });
    });
    return out;
  }
  function estimate(){
    var st = buildState(), rows = [], sum = 0;
    ORDER.forEach(function(k){
      if(!st[k].touched) return;
      var it = items(k, st), cost = it.reduce(function(t, i){ return t + i.cost; }, 0);
      if(cost <= 0) return;
      rows.push({ key:k, name: k === 'carpet' && !has('carpet') ? 'Area Rug Cleaning' : S[k].name, cost:cost, items:it }); sum += cost;
    });
    if(A.whole && A.wholeSqft){
      var wc = Math.round(A.wholeSqft * WH_RATE * 100) / 100;
      rows.unshift({ key:'whole', name:'Whole home, all floors', cost:wc, items:[{ label:A.wholeSqft.toLocaleString() + ' sq ft × $' + WH_RATE.toFixed(2), cost:wc }] });
      sum += wc;
    }
    var min = window.KC_MINJOB != null ? window.KC_MINJOB : 150;
    return { st:st, rows:rows, sum:sum, total: rows.length ? Math.max(sum, min) : 0, min:min };
  }

  /* ---- Screens ---- */
  var hist = [], navDir = '';
  /* Inside the room photos: Back steps photos -> floor question -> room list instead of leaving the screen. */
  var rpBack = null;
  function show(fn, push){
    rpBack = null;
    if(push !== false && cur) hist.push(cur);
    cur = fn; invAll = false;
    document.body.classList.toggle('hideSum', [sPhotos, sPrice, sDisc].indexOf(fn) < 0);   /* schedule and thank-you pages show the priced quote instead; contact page is just the fields */
    document.body.classList.toggle('first', fn === sName);
    document.body.classList.remove('rp');
    backBtn.hidden = !hist.length; resetBtn.hidden = !hist.length;
    /* Moving between questions: the answer they tapped glows gold, the old question slides off and blurs
       out, the new one glides in from the other side (going Back reverses it). Redraws don't animate. */
    var dir = navDir || (push !== false ? 'fwd' : ''); navDir = '';
    [].forEach.call(screen.querySelectorAll('.step.leaving'), function(x){ x.remove(); });
    var old = screen.querySelector('.step');
    var anim = dir && old && !document.querySelector('.intro2') && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    if(anim){
      if(lastTap && Date.now() - lastTapAt < 800 && old.contains(lastTap)) lastTap.classList.add('picked');
      old.classList.add('leaving', dir === 'back' ? 'to-right' : 'to-left');
      setTimeout(function(){ old.remove(); }, 700);
    } else screen.innerHTML = '';
    var el = document.createElement('section'); el.className = 'step';
    screen.appendChild(el);
    fn(el);
    if(anim){
      el.classList.add(dir === 'back' ? 'from-left' : 'from-right');
      [].forEach.call(el.querySelectorAll('.opt, .go'), function(x, i){ x.classList.add('q-in'); x.style.animationDelay = (480 + Math.min(i, 10) * 45) + 'ms'; });
      el.addEventListener('animationend', function done(e){ if(e.target !== el) return; el.classList.remove('from-left', 'from-right'); el.removeEventListener('animationend', done); });
    }
    var i = FLOW().indexOf(fn); bar.style.width = (i < 0 ? 100 : Math.round(100 * i / (FLOW().length - 1))) + '%';
    window.scrollTo(0, 0);
    drawSqft();
    var h = el.querySelector('h1'); if(h){ h.tabIndex = -1; h.focus({ preventScroll:true }); }
    save();
  }
  /* Total estimated square feet (same math as the running total at the top). */
  function sqftTotal(){
    if(A.whole && A.wholeSqft) return A.wholeSqft;
    var t = 0; ORDER.forEach(function(k){ if(k !== 'upholstery' && has(k)){ var n = sqftFor(k); if(n > 0) t += n; } });
    return t;
  }
  /* Running square footage at the top (no price), updated on every tap. */
  function drawSqft(){
    var box = document.getElementById('sqft'), parts = [], total = 0;
    ORDER.forEach(function(k){
      if(k === 'upholstery' || !has(k)) return;
      var n = sqftFor(k); if(n > 0){ total += n; parts.push(SVC[k].word.charAt(0).toUpperCase() + SVC[k].word.slice(1) + ' ' + n.toLocaleString()); }
    });
    if(A.whole && A.wholeSqft){ total = A.wholeSqft; parts = []; }
    box.hidden = !total;
    box.innerHTML = total ? (parts.length > 1 ? esc(parts.join(' · ')) + '<br>' : '') + 'Est. <b>' + total.toLocaleString() + ' sq ft</b>' : '';
    drawInv();
  }
  /* Breakdown at the top: square feet on the right (no prices). Stairs show a count; rugs and extras just their name. */
  function drawInv(){
    drawPh();
    var inv = document.getElementById('inv'), e;
    try{ e = estimate(); }catch(err){ e = null; }
    if(!invOpen) invOpen = {};
    if(!e || !e.rows.length){ inv.hidden = true; inv.innerHTML = ''; document.getElementById('sqft').classList.remove('dup'); return; }
    var tot = sqftTotal(), h = invHtml(e, invOpen, '');
    if(tot) h += '<div class="r tot"><span>Total</span><b>' + tot.toLocaleString() + ' sq ft</b></div>';
    inv.innerHTML = h; inv.hidden = false;
    document.getElementById('sqft').classList.toggle('dup', !!tot);
  }
  /* The quote breakdown: service, package with its room drop-down, stairs, add-ons. ns keeps each box's drop-downs separate. */
  function invHtml(e, open, ns){
    var op = function(k){ return invAll || open[k]; };
    var h = '', ft = function(n){ return n ? n.toLocaleString() + ' sf' : ''; };   /* rows say sf; only the Total says sq ft */
    /* Package names keep their branding: gold "Deep", red script "Signature". */
    var brand = function(t){ return esc(t).replace(/^Deep\b/, '<span class="gold">Deep</span>').replace(/^Signature\b/, '<span class="sigScript">Signature</span>'); };
    e.rows.forEach(function(r){
      var rsq = r.key === 'whole' ? A.wholeSqft : r.items.reduce(function(t, i){ return t + (i.sq || 0); }, 0);
      /* One line that just repeats the header (Tile, Hardwood): the header itself becomes the dropdown. */
      var only = r.items.length === 1 ? r.items[0] : null;
      if(only && only.sq && only.label.replace(/ — .*sq ft$/, '') === r.name){
        var oid = ns + r.key, orms = only.rooms || [];
        h += '<div class="r svc' + (orms.length ? ' drop' + (op(oid) ? ' open' : '') + '" data-drop="' + oid + '" role="button" tabindex="0" aria-expanded="' + !!op(oid) : '') + '"><span>' + esc(r.name) + (orms.length ? '<i>▾</i>' : '') + '</span><span>' + ft(rsq) + '</span></div>';
        orms.forEach(function(x){ h += '<div class="r rm"' + (op(oid) ? '' : ' hidden') + '><span>' + esc(x.t) + '</span><span>' + ft(x.sq) + '</span></div>'; });
        return;
      }
      h += '<div class="r svc"><span>' + esc(r.name) + '</span><span>' + ft(rsq) + '</span></div>';
      r.items.forEach(function(i){
        var label = i.sq ? i.label.replace(/ — .*sq ft$/, '') : r.key === 'whole' ? 'All floors' : i.label.replace(/^Flights? of Stairs.*$/, 'Stairs');
        var right = i.sq ? (i.sq === rsq ? '' : ft(i.sq)) : i.flights ? i.flights + (i.flights > 1 ? ' flights' : ' flight') : '';   /* same as the service line above: shown once */
        var rms = i.sq && i.rooms && i.rooms.length ? i.rooms : null, id = ns + r.key;
        if(!rms){ h += '<div class="r it"><span>' + esc(label) + '</span><span>' + right + '</span></div>'; return; }
        h += '<div class="r it drop' + (op(id) ? ' open' : '') + '" data-drop="' + id + '" role="button" tabindex="0" aria-expanded="' + !!op(id) + '"><span>' + brand(label) + '<i>▾</i></span><span>' + right + '</span></div>';
        rms.forEach(function(x){ h += '<div class="r rm"' + (op(id) ? '' : ' hidden') + '><span>' + esc(x.t) + '</span><span>' + ft(x.sq) + '</span></div>'; });
      });
    });

  function upSoon(){ clearTimeout(upT); upT = setTimeout(function(){ firebase().then(function(fb){ return upPending(fb); }).catch(function(){ upWarn(); }); }, 1500); }
  /* A photo didn't upload: a small note at the bottom, once a minute at most. It's still on the phone and tries again on the next photo or Done. */
  var upWarnAt = 0;
  function upWarn(){
    if(Date.now() - upWarnAt < 6e4) return; upWarnAt = Date.now();
    var n = document.createElement('div');
    n.textContent = 'A photo didn’t upload yet. It’s saved on your phone and will try again.';
    n.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:10000;background:#2a1d0c;color:#fff;border:1px solid #e3b343;border-radius:12px;padding:12px 14px;font:500 14px system-ui,sans-serif;text-align:center';
    document.body.appendChild(n); setTimeout(function(){ n.remove(); }, 5000);
  }
  /* At Send: finish anything not uploaded yet, then list every photo still in the quote. */
  function upload(fb){
    return upPending(fb).then(function(){ return A.photos.map(function(f){ return f._up; }).filter(Boolean); });
  }
  function saveLead(fb, lead){
    var row = Object.assign({}, lead, { status:'new', source:'estimator', createdAt: fb.fs.serverTimestamp() });
    if(row.services === undefined) delete row.services;   /* only whole-home leads carry services */
    if(!row.softLeadId) delete row.softLeadId;
    var leads = fb.fs.collection(fb.db, 'leads');
    return fb.fs.addDoc(leads, row).then(function(r){ return r.id; }, function(err){
      /* Same fallback as the homepage: if the database won't take the texting answers, they go at the top of the message. */
      if(!err || err.code !== 'permission-denied') throw err;
      var plain = Object.assign({}, row), top = [];
      delete plain.smsConsent; delete plain.marketingConsent;
      if(lead.smsConsent) top.push('OK to text: yes');
      if(lead.marketingConsent) top.push('OK to text specials: yes');
      plain.message = top.join('\n') + (top.length ? '\n\n' : '') + plain.message;
      return fb.fs.addDoc(leads, plain).then(function(r){ return r.id; });
    });
  }

  function send(el, $){
    var err = $('err'), btn = $('send'), sms = el.querySelector('input[name="sms"]:checked');
    var name = $('nm').value.trim(), phone = $('ph').value.trim(), email = $('em').value.trim();
    var phOk = phone.replace(/\D/g, '').length >= 10, emOk = EMAIL_RE.test(email);
    /* Name, plus a phone number or an email (at least one). Address is optional. */
    var bad = !name ? ['nm', 'Please tell us your name.']
      : !phone && !email ? ['ph', 'Please give us a phone number or an email.']
      : phone && !phOk ? ['ph', 'Please give us a 10-digit phone number.']
      : email && !emOk ? ['em', 'Please check your email address.']
      : phone && !sms ? ['smsQ', 'Please choose Yes or No for texting.'] : null;
    if(bad){ err.textContent = bad[1]; var t = $(bad[0]); if(t.focus) t.focus(); t.scrollIntoView({ block:'center' }); return; }
    err.textContent = '';
    if(A.noPics && !A.askedComments){ comments(el, $); return; }   // one last box before it sends
    btn.disabled = true; btn.textContent = A.photos.length ? 'Uploading photos…' : 'Sending…';
    var e = estimate(), msg = summary(e), smsYes = !!sms && sms.value === 'Yes', promoYes = $('promo').checked;
    textedQuote = smsYes && e.rows.length > 0;   /* the backend texts them their estimate link */
    var key = Date.now() + '_' + Math.random().toString(36).slice(2, 8), isBot = $('hp').checked;
    var addr = { street: $('st').value.trim(), city: $('ct').value.trim(), state:'CA', zip: $('zp').value.trim() };
    var fd = new FormData();
    fd.append('access_key', '2e49144b-d36b-4e13-bec4-aad215f7abc6');
    fd.append('subject', 'Walkthrough quote from ' + name + (e.rows.length ? ' — ' + money(e.total) : ''));
    fd.append('from_name', 'Khean & Clean estimator');
    fd.append('name', name); fd.append('phone', phone); fd.append('email', email);
    fd.append('address', [addr.street, addr.city, 'CA ' + addr.zip].filter(Boolean).join(', '));
    fd.append('message', msg);
    fd.append('when', A.when || '');
    if(e.rows.length) fd.append('estimate', estText(e));
    fd.append('sms_consent', smsYes ? 'Yes' : 'No'); fd.append('marketing_consent', promoYes ? 'Yes' : 'No');
    if(isBot) fd.append('botcheck', 'true');
    fd.append('saved_quote_link', savedLink());   /* opens their saved quote in the Instant Quote to edit */

    (isBot ? Promise.resolve() : firebase().then(function(fb){
      return (A.photos.length ? upload(fb) : Promise.resolve([])).then(function(paths){
        fd.append('photo_count', String(paths.length));
        btn.textContent = 'Sending…';
        return saveLead(fb, {
          page:'quote-finder', savedQuoteLink: savedLink(), photoPaths: paths, when: A.when && A.when !== 'Flexible' ? A.when : '', name:name, phone:phone, email:email,
          addresses:[addr], type:'residential', smsConsent: smsYes, marketingConsent: promoYes, softLeadId: A.softLeadId || undefined,
          /* The estimate in the estimators' own snapshot format, so New quote rebuilds it. */
          estimateData: e.rows.length ? JSON.stringify({ v:1, active: (e.rows.filter(function(r){ return r.key !== 'whole'; })[0] || { key:'carpet' }).key, state: e.st, discAmt:'', discPct:'', waiveMin:false, quote: quoteOf(e) }) : '',
          services: A.whole ? ['Whole house'] : undefined,
          /* The answers already went into the estimate (estimateData) and the email; the lead's
             message box (customer notes) gets only what the customer typed: Other request, comments. */
          message: [has('other') && A.otherText ? 'Other request: ' + A.otherText : '', A.comments ? 'Additional comments: ' + A.comments : ''].filter(Boolean).join('\n')
        });
      });
    })).catch(function(x){
      /* The lead didn't reach the Leads page: say so at the top of the email, with the exact error, so it's never lost quietly. */
      console.error('Lead save failed', x);
      fd.set('message', 'LEAD SAVE FAILED (not on the Leads page): ' + ((x && (x.code || x.message)) || String(x)) + '\n\n' + msg);
      fd.set('subject', 'LEAD SAVE FAILED: ' + fd.get('subject'));
    })
    .then(function(){ return fetch('https://api.web3forms.com/submit', { method:'POST', headers:{ Accept:'application/json' }, body: fd }); })
    .then(function(r){ return r.json().catch(function(){ return { success: r.ok }; }); })
    .then(function(res){
      if(!res || !res.success) throw new Error((res && res.message) || 'failed');
      if(typeof gtag === 'function') gtag('event', 'generate_lead', { form_name:'quote_finder' });
      /* Sent: nothing is wiped. Their answers and photos stay as a saved copy (on the phone and in Firebase),
         so they can come back, change rooms and send a new request. Reset still starts over. */
      A.sentAt = Date.now(); keepSent(); cloudDone();
      show(sDone, false);
    })
    .catch(function(x){
      console.error(x);
      err.innerHTML = 'Something went wrong sending that. Please call <a href="tel:+19167672520">(916) 767-2520</a> and we’ll sort it out.';
      btn.disabled = false; btn.textContent = 'Send my quote';
    });
  }

  /* Fresh Settings prices came in: redraw the screen that's open so its prices match. */
  window.addEventListener('kc:prices', function(){ if(cur && cur !== sContact) show(cur, false); });
  /* Saved progress: the answers and the step they're on stay in this browser, so a refresh or an
     interruption picks up where they left off (kept 14 days). Photos are kept on the phone too (IndexedDB). */
  screen.addEventListener('click', function(){ save(); });
  screen.addEventListener('input', function(){ save(); });
  screen.addEventListener('change', function(){ save(); });
  setInterval(keepPhotos, 2000);   /* camera shots land outside the screen; catch them too */
  function startSaved(saved){
    Object.keys(saved.a).forEach(function(k){ A[k] = saved.a[k]; });
    A.photos = [];
    var f0 = FLOW(), sent = !!A.sentAt;
    hist = sent ? f0.slice(0, Math.max(0, f0.indexOf(sPrice))) : (saved.hist || []).map(function(n){ return f0[n]; }).filter(Boolean);
    phReady = false;   /* photos come back from the phone a moment after the page; snapped rooms wait for them */
    show(sent ? sPrice : (f0[saved.at] || sName), false);   /* a sent quote opens at their quote */
    loadPhotos().then(function(ph){
      A.photos = ph;
      return recoverPhotos();
    }).then(function(){
      phReady = true;
      if(sent){ var f1 = FLOW(); hist = f1.slice(0, Math.max(0, f1.indexOf(sPrice))); }   /* photo screens are in the flow now */
      var ph = A.photos;
      if(!ph.length){ if(cur === sSnap || cur === sConfirm) show(cur, false); return; }
      photoSig = '';
      keepPhotos(); upNow();   /* finish uploads, then any photo measuring left */
      if(cur === sPhotos || cur === sSnap || cur === sConfirm || cur === sReport || cur === sPrice) show(cur, false);   // redraw so their thumbnails show
    });
  }
  var saved = null;
  try{ saved = JSON.parse(localStorage.getItem(SAVE) || 'null'); }catch(e){}
  var qid = null; try{ qid = new URLSearchParams(location.search).get('q'); }catch(e){}
  /* Link texted to an existing contact (?n=Name&p=9165551234&e=email): their name and number come filled in.
     Only fills what's still empty, then takes them off the address bar. */
  var link = {}, linkQS = /[?&](n|p|e)=/.test(location.search) ? location.search : '';
  try{ var sp = new URLSearchParams(location.search);
    link = { nm:(sp.get('n') || '').trim().slice(0, 80), ph:(sp.get('p') || '').replace(/\D/g, '').slice(-10), em:(sp.get('e') || '').trim().slice(0, 160) }; }catch(e){}
  function fillFromLink(){
    if(!link.nm && !link.ph && !link.em) return;
    var C = A.contact = A.contact || {};
    if(link.nm && !A.name){ A.name = link.nm; }
    if(link.nm && !C.nm) C.nm = link.nm;
    if(link.ph.length === 10 && !C.ph) C.ph = '(' + link.ph.slice(0, 3) + ') ' + link.ph.slice(3, 6) + '-' + link.ph.slice(6);
    if(EMAIL_RE.test(link.em) && !C.em) C.em = link.em;
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
  }
  if(qid){
    /* Saved-quote link: load that quote's copy from Firebase onto this phone, then open it like a returning customer. */
    show(sName, false);
    screen.querySelector('.step').innerHTML = '<div class="gather"><div class="ring" aria-hidden="true"></div><h1>Opening your saved quote…</h1></div>';
    firebase().then(function(fb){ return fb.fs.getDoc(fb.fs.doc(fb.db, 'quoteProgress', qid)); }).then(function(d){
      var x = d && d.exists() ? d.data() : null, a = x && x.answers ? JSON.parse(x.answers) : null;
      if(!a) throw new Error('not found');
      try{
        localStorage.setItem(PID, qid);
        localStorage.setItem(UPL, x.photos || '[]');   /* their uploaded photos come back down from Firebase */
        history.replaceState(null, '', location.pathname);
      }catch(e){}
      dropPhotos(); try{ localStorage.setItem(UPL, x.photos || '[]'); }catch(e){}
      if(!a.sentAt) a.sentAt = Date.now();
      startSaved({ a:a, at:1, hist:[], t:Date.now() });
    }).catch(function(x){
      console.warn('Saved quote not opened', x && (x.code || x.message));
      screen.querySelector('.step').innerHTML = '<h1>We couldn’t open that saved quote</h1><p class="lead">Please call or text <a href="tel:+19167672520">(916) 767-2520</a> and we’ll send you a new link.</p>';
    });
  } else if(saved && saved.a && saved.at > 0 && (saved.a.sentAt || Date.now() - (saved.t || 0) < 14 * 864e5)){
    startSaved(saved);   /* sent quotes are kept for good; unfinished ones 14 days */
    fillFromLink();
  } else {
    fillFromLink();
    show(sName, false);
    intro();
  }

  /* Starry backdrop behind the whole builder: the intro's glow and rays, dimmer, with a few slow gold sparks.
     Still (no sparks) for people who turn motion off; pauses while the tab is hidden. */
  (function sky(){
    var bg = document.createElement('div'); bg.className = 'sky'; bg.setAttribute('aria-hidden', 'true');
    bg.innerHTML = '<div class="rays"></div><canvas></canvas>';
    document.body.insertBefore(bg, document.body.firstChild);
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){ bg.querySelector('.rays').style.animation = 'none'; return; }
    var cv = bg.querySelector('canvas'), g = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), P = [];
    var size = function(){ cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
    size(); addEventListener('resize', size);
    for(var k = 0; k < 28; k++) P.push({ x:Math.random() * cv.width, y:Math.random() * cv.height, vx:(Math.random() - .5) * .1 * dpr,
      vy:-(Math.random() * .22 + .05) * dpr, r:(Math.random() * 1.4 + .5) * dpr, tw:Math.random() * 6, age:Math.random() * 300 });
    var tick = function(){
      if(!document.hidden){
        g.clearRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
        P.forEach(function(q){
          q.age++; q.x += q.vx; q.y += q.vy;
          if(q.y < -10){ q.y = cv.height + 10; q.x = Math.random() * cv.width; }
          var a = .5 * (.5 + .5 * Math.sin(q.age * .05 + q.tw));
          var gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r * 4);
          gr.addColorStop(0, 'rgba(255,240,200,' + a + ')'); gr.addColorStop(.35, 'rgba(227,182,74,' + a * .7 + ')'); gr.addColorStop(1, 'rgba(227,182,74,0)');
          g.fillStyle = gr; g.beginPath(); g.arc(q.x, q.y, q.r * 4, 0, Math.PI * 2); g.fill();
        });
      }
      requestAnimationFrame(tick);
    };
    tick();
  })();

  /* Opening graphic: the K&C logo is drawn in from the bottom by a glowing gold scan line, a gold ring
     draws itself around it while a shimmer sweeps the logo and gold sparks burst out, then the welcome
     lines come in word by word out of a soft blur. The screen then fades away and the first question
     and its choices rise in. About 7 seconds; a tap skips it. Skipped for people who turn motion off. */
  function intro(){
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var step = screen.querySelector('.step'), h1 = step && step.querySelector('h1');
    if(!h1) return;
    step.classList.add('enter');
    var words = function(html){ return html.replace(/(<span class="g">[^<]*<\/span>)|([^\s<]+)/g, function(m){ return '<span class="w">' + m + '</span>'; }); };
    var ov = document.createElement('div'); ov.className = 'intro2'; ov.setAttribute('aria-hidden', 'true');
    ov.innerHTML = '<div class="rays"></div><canvas></canvas>' +
      '<div class="mark"><svg viewBox="0 0 120 120"><circle class="r1" cx="60" cy="60" r="56"/><circle class="r2" cx="60" cy="60" r="51"/></svg>' +
        '<img src="/images/logo-clear-1280.png" alt=""><i class="scan"></i><i class="shine"></i></div>' +
      '<div class="lines"><p>' + words('Thank you for choosing <span class="g">Khean &amp; Clean</span>') + '</p>' +
        '<p>' + words('Welcome to our <span class="g">Instant Quote</span>') + '</p>' +
        '<p class="d">' + words('Answer a few quick questions and snap some photos for the most accurate quote.') + '</p></div>' +
      '<span class="skip">Tap to skip</span>';
    document.body.appendChild(ov);
    var timers = [], ended = false, raf = 0;
    var at = function(ms, f){ timers.push(setTimeout(f, ms)); };

    /* Gold sparks: drifting up the whole time, plus one burst out of the logo when it finishes drawing. */
    var cv = ov.querySelector('canvas'), g = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), P = [];
    var size = function(){ cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
    size(); addEventListener('resize', size);
    var spark = function(x, y, vx, vy, life){ P.push({ x:x, y:y, vx:vx, vy:vy, life:life, age:0, r:(Math.random() * 1.6 + .6) * dpr, tw:Math.random() * 6 }); };
    for(var k = 0; k < 46; k++) spark(Math.random() * cv.width, Math.random() * cv.height, (Math.random() - .5) * .15 * dpr, -(Math.random() * .35 + .1) * dpr, 400 + Math.random() * 400);
    var tick = function(){
      g.clearRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
      for(var i = P.length - 1; i >= 0; i--){ var q = P[i]; q.age++; q.x += q.vx; q.y += q.vy; q.vx *= .992; q.vy = q.vy * .992 - .002 * dpr;
        if(q.age > q.life){ if(P.length < 120 && !q.burst){ q.x = Math.random() * cv.width; q.y = cv.height + 10; q.age = 0; } else { P.splice(i, 1); continue; } }
        var a = Math.min(1, q.age / 30) * Math.min(1, (q.life - q.age) / 60) * (.55 + .45 * Math.sin(q.age * .12 + q.tw));
        var gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r * 4);
        gr.addColorStop(0, 'rgba(255,240,200,' + a + ')'); gr.addColorStop(.35, 'rgba(227,182,74,' + a * .7 + ')'); gr.addColorStop(1, 'rgba(227,182,74,0)');
        g.fillStyle = gr; g.beginPath(); g.arc(q.x, q.y, q.r * 4, 0, Math.PI * 2); g.fill(); }
      raf = requestAnimationFrame(tick); };
    tick();
    var burst = function(){
      var m = ov.querySelector('.mark').getBoundingClientRect(), cx = (m.left + m.width / 2) * dpr, cy = (m.top + m.height / 2) * dpr;
      for(var j = 0; j < 70; j++){ var an = Math.random() * Math.PI * 2, sp = (Math.random() * 3 + 1.2) * dpr;
        spark(cx + Math.cos(an) * m.width * .35 * dpr, cy + Math.sin(an) * m.height * .35 * dpr, Math.cos(an) * sp, Math.sin(an) * sp, 70 + Math.random() * 60);
        P[P.length - 1].burst = true; } };

    var showLine = function(n){ var p = ov.querySelectorAll('.lines p')[n]; if(!p) return;
      [].forEach.call(p.querySelectorAll('.w'), function(w, i){ w.style.animationDelay = (i * 70) + 'ms'; }); p.classList.add('in'); };
    var reveal = function(){
      if(ended) return; ended = true; timers.forEach(clearTimeout);
      step = screen.querySelector('.step') || step;
      step.classList.remove('enter'); step.classList.add('go-in');
      [].forEach.call(step.querySelectorAll('.opt, .go'), function(x, i){ x.style.animationDelay = (120 + i * 70) + 'ms'; });
      ov.classList.add('out');
      setTimeout(function(){ cancelAnimationFrame(raf); removeEventListener('resize', size); if(ov.parentNode) ov.parentNode.removeChild(ov); }, 800);
    };
    at(30, function(){ ov.classList.add('on'); });          /* light rays fade in, logo starts drawing */
    at(1700, function(){ ov.classList.add('drawn'); burst(); });   /* ring draws, shimmer sweeps, sparks burst */
    at(2500, function(){ showLine(0); });
    at(3500, function(){ showLine(1); });
    at(4700, function(){ showLine(2); });
    at(9200, reveal);   /* holds 2 seconds longer on the last line before the first question */
    ov.onclick = reveal;
  }

})();
/* Text consent: ticking the specials box also picks "Yes, text me"; picking "No thanks" unticks the specials box. */
document.addEventListener('change', function(e){
  var t = e.target, YES = 'input[name="sms_consent"][value="Yes"],input[name="sms"][value="Yes"]', PROMO = 'input[name="marketing_consent"],#promo';
  if(!t || !t.matches) return;
  function near(el, sel){ for(var p = el.parentElement; p; p = p.parentElement){ var f = p.querySelector(sel); if(f) return f; } return null; }
  var other = null, want;
  if(t.matches(PROMO) && t.checked){ other = near(t, YES); want = true; }
  else if((t.name === 'sms_consent' || t.name === 'sms') && t.value === 'No' && t.checked){ other = near(t, PROMO); want = false; }
  if(other && other.checked !== want){ other.checked = want; other.dispatchEvent(new Event('change', { bubbles: true })); }
});
</script>
