.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:20px;margin-top:18px}
button{font:600 15px "Archivo";background:var(--navy);color:#fff;border:0;border-radius:6px;padding:11px 20px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
a.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:10px 16px;margin-left:8px}
.log{margin-top:16px;font-size:14px;max-height:340px;overflow:auto;border-top:1px solid var(--line);padding-top:10px}
.log div{padding:3px 0;border-bottom:1px solid #f1f3f6}
.ok{color:var(--green);font-weight:600}
.skip{color:var(--muted)}
.err{color:var(--red);font-weight:600}
p.note{color:var(--muted);font-size:14px}

const logEl = document.getElementById("log"), go = document.getElementById("go");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (cls, msg) => { logEl.insertAdjacentHTML("beforeend", '<div class="' + cls + '">' + esc(msg) + '</div>'); logEl.scrollTop = logEl.scrollHeight; };

function randomId(){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => abc[b % abc.length]).join("");
}

async function exists(pk, ek){
  for (const [f, v] of [["phoneKey", pk], ["emailKey", ek]]) {
    if (!v) continue;
    const s = await getDocs(query(collection(db, "customers"), where(f, "==", v), limit(1)));
    if (!s.empty) return true;
  }
  return false;
}

go.addEventListener("click", async () => {
  go.disabled = true;
  let added = 0, skipped = 0, failed = 0;
  for (const r of ROWS) {
    try {
      if ((r.phoneKey || r.emailKey) && await exists(r.phoneKey, r.emailKey)) {
        say("skip", "Already on file: " + r.name); skipped++; continue;
      }
      await setDoc(doc(db, "customers", randomId()), Object.assign({}, r, {
        source: "import", createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      }));
      say("ok", "Added " + r.name); added++;
    } catch (e) {
      console.error(e);
      say("err", "Failed " + r.name + ": " + e.message); failed++;
    }
  }
  say("", "Done. " + added + " added, " + skipped + " skipped, " + failed + " failed.");
  go.textContent = "Import again";
  go.disabled = false;
});

onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=import-contacts.html"); return; }
  document.getElementById("authwait")?.remove();
});
</script>
