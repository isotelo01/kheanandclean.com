<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex, nofollow">
<title>KC Jones &middot; Khean &amp; Clean</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../images/icon-180.png">
<style>
/* Manager: the head bot. Tap Call and talk; it answers out loud and keeps listening until you hang up.
   It can read the app's data and read/change the other bots' rules (backend: managerBot). Staff only. */
:root{--navy:#172239;--gold:#E3B64A;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 90px}
.back{color:var(--muted);font-size:14px;text-decoration:none}
h1{font:700 28px/1.2 system-ui,sans-serif;margin:8px 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.panel{background:#fff;border-radius:12px;padding:16px;margin:0 0 12px;box-shadow:0 1px 6px rgba(23,34,57,.08)}
.callbox{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 16px}
.call{width:96px;height:96px;border-radius:50%;border:0;background:#2e8a57;color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.call svg{width:42px;height:42px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.call.on{background:#b3261e}
.call.on svg{transform:rotate(135deg)}
.call.listen{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(46,138,87,.25)}}
.state{font-weight:600;min-height:1.5em}
.chat{display:flex;flex-direction:column;gap:8px;max-height:44vh;overflow-y:auto;padding:4px 0 8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.msg.err{align-self:center;background:transparent;color:#b3261e;font-size:13.5px}
.msg.note{align-self:center;background:transparent;color:#2e8a57;font-size:13.5px}
.ask{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;font:15px/1.45 system-ui,sans-serif;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;height:44px;resize:vertical;background:#fff;color:var(--ink)}
button.btn{font:600 15px system-ui,sans-serif;padding:9px 18px;border-radius:999px;border:0;background:var(--navy);color:#fff;cursor:pointer}
button.ghost{font:600 14px system-ui,sans-serif;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.muted{color:var(--muted);font-size:14px}
:where(a,button):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
<link rel="stylesheet" href="./theme-dark.css">
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <a class="back" href="./hub.html">&lsaquo; Hub</a>
  <h1>KC Jones</h1>
  <p class="sub">KC Jones is your manager bot. Ask about leads, jobs, invoices and texts, or tell it how to train the other <a href="./bots.html">bots</a>.</p>
  <section class="panel callbox">
    <button type="button" class="call" id="callBtn" aria-label="Call KC"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></button>
    <div class="state" id="state">Tap to call</div>
    <div class="muted" id="micNote"></div>
  </section>
  <section class="panel">
    <div class="chat" id="chat"></div>
    <div class="ask"><textarea id="say" placeholder="Or type to it…"></textarea><button type="button" class="btn" id="sendBtn">Send</button></div>
    <div class="row"><button type="button" class="ghost" id="clearChat">New conversation</button></div>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const auth = getAuth(app);
const managerBot = httpsCallable(getFunctions(app, "us-central1"), "managerBot", { timeout: 190000 });
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "5SNJ2DzfrycMrEfbex73Lywf7KB3", "eoYah1xNcaT7R4lAMOVFFMS7ITN2"];
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

/* The conversation lives for this browser tab only (refresh keeps it, closing the tab clears it). */
let history = [];
try { history = JSON.parse(sessionStorage.getItem("mgrHistory") || "[]"); } catch (e) { history = []; }
const keep = () => { try { sessionStorage.setItem("mgrHistory", JSON.stringify(history.slice(-30))); } catch (e) {} };
let inCall = false, rec = null, busy = false;

function bubble(cls, text) {
  const d = document.createElement("div"); d.className = "msg " + cls; d.textContent = text;
  $("chat").appendChild(d); $("chat").scrollTop = $("chat").scrollHeight; return d;
}
history.forEach(m => bubble(m.role === "user" ? "me" : "bot", m.text));
const setState = t => { $("state").textContent = t; };

async function send(text) {
  text = String(text || "").trim(); if (!text || busy) return;
  busy = true; $("say").value = ""; $("sendBtn").disabled = true;
  history.push({ role: "user", text }); bubble("me", text);
  const wait = bubble("bot", "…"); setState(inCall ? "Thinking…" : "Tap to call");
  let reply = "", audio = null;
  try {
    const r = await managerBot({ history, voice: inCall });
    audio = (r.data && r.data.audio) || null;
    reply = (r.data && r.data.reply) || "(no answer)";
    history.push({ role: "assistant", text: reply }); keep(); wait.textContent = reply;
    if (r.data && r.data.changed) bubble("note", "Bot rules updated.");
  } catch (e) {
    console.error(e); history.pop(); wait.remove(); bubble("err", e.message || "Couldn't reach KC.");
  }
  busy = false; $("sendBtn").disabled = false;
  if (inCall) { if (reply) speak(reply, listen, audio); else listen(); }
}

/* Male voice, so the Manager never sounds like the other bots. Uses the first male English voice the
   phone or computer has; if it has none, it drops the pitch instead. */
const MALE = /\b(male|guy|david|mark|andrew|brian|christopher|eric|roger|steffan|aaron|arthur|daniel|fred|alex|rishi|tom|james|oliver|reed|evan|nathan)\b/i;
let maleVoice = null;
function pickVoice() {
  try {
    const en = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    maleVoice = en.find(v => /en-US/i.test(v.lang) && MALE.test(v.name) && !/female/i.test(v.name)) || en.find(v => MALE.test(v.name) && !/female/i.test(v.name)) || null;
  } catch (e) {}
}
pickVoice();
try { speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}

/* KC Jones's real voice comes back from the backend as an MP3 (Google Chirp 3 HD "Charon").
   One audio player, unlocked on the Call tap, so phones let it play later. If there's no MP3, the device voice reads it. */
const player = new Audio();
let stopPlayer = null;
function unlockPlayer() {
  try { player.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="; player.play().catch(() => {}); } catch (e) {}
}
function speak(t, then, audio) {
  if (audio) {
    setState("Talking… (tap the chat to cut in)");
    let done = false; const fin = () => { if (done) return; done = true; stopPlayer = null; if (then) then(); };
    player.onended = fin;
    player.onerror = () => { done = true; stopPlayer = null; speak(t, then); };
    stopPlayer = () => { try { player.pause(); } catch (e) {} fin(); };
    player.src = "data:audio/mpeg;base64," + audio;
    player.play().catch(() => { if (!done) { done = true; stopPlayer = null; speak(t, then); } });
    return;
  }
  try {
    speechSynthesis.cancel(); setState("Talking… (tap the chat to cut in)");
    const u = new SpeechSynthesisUtterance(t); u.rate = 1.05;
    if (!maleVoice) pickVoice();
    if (maleVoice) u.voice = maleVoice; else u.pitch = 0.7;
    u.onend = u.onerror = () => { if (then) then(); };
    speechSynthesis.speak(u);
  } catch (e) { if (then) then(); }
}

/* In a call it listens, sends when you stop talking, reads the answer out, then listens again. */
function listen() {
  if (!inCall || !SR || busy) return;
  rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
  let heard = "";
  rec.onresult = e => { heard = ""; for (const r of e.results) heard += r[0].transcript; $("say").value = heard.trim(); };
  rec.onerror = e => { if (e.error === "not-allowed") { bubble("err", "Mic is blocked. Allow the microphone for this site."); hangUp(); } };
  rec.onend = () => { rec = null; $("callBtn").classList.remove("listen"); if (!inCall) return; const t = $("say").value.trim(); if (t) send(t); else setTimeout(listen, 250); };
  $("callBtn").classList.add("listen"); setState("Listening…");
  try { rec.start(); } catch (e) { setTimeout(listen, 500); }
}
function startCall() {
  inCall = true; $("callBtn").classList.add("on"); $("callBtn").setAttribute("aria-label", "Hang up");
  unlockPlayer();
  if (history.length) { listen(); return; }
  const hi = "Hey, it's KC Jones. What do you need?";
  setState("Calling…");
  managerBot({ sayOnly: hi }).then(r => { if (inCall) speak(hi, listen, r.data && r.data.audio); }).catch(() => { if (inCall) speak(hi, listen); });
}
function hangUp() {
  inCall = false; $("callBtn").classList.remove("on", "listen"); $("callBtn").setAttribute("aria-label", "Call KC");
  if (rec) { try { rec.abort(); } catch (e) {} rec = null; }
  try { speechSynthesis.cancel(); } catch (e) {}
  if (stopPlayer) stopPlayer();
  setState("Tap to call");
}
$("callBtn").onclick = () => inCall ? hangUp() : startCall();
$("chat").onclick = () => { if (!inCall) return; if (stopPlayer) stopPlayer(); else if (speechSynthesis.speaking) speechSynthesis.cancel(); };
$("sendBtn").onclick = () => send($("say").value);
$("say").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("say").value); } };
$("clearChat").onclick = () => { history = []; keep(); $("chat").innerHTML = ""; };
if (!SR) { $("micNote").textContent = "Voice isn't supported in this browser. Type below instead."; $("callBtn").disabled = true; }

onAuthStateChanged(auth, u => {
  if (!u) { location.replace("./login.html?next=manager.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  $("authwait")?.remove();
  if (new URLSearchParams(location.search).get("call") === "1" && SR) startCall();
});
</script>
<script src="./tabbar.js" defer></script>
</body>
</html>
