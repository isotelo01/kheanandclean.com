<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:nowrap;margin-left:auto}
.nav a,.nav button{display:inline-flex;align-items:center;padding:10px 14px}
.nav .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.col{display:grid;gap:10px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:14px}
.col .colhead{grid-column:1/-1}
.colhead{font:700 13px "Archivo",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 2px}
.row{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:14px 16px}
.row:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
/* Card tint; the open lead's panel gets the same tint (tintOf picks it).
   Green = a finished estimate is on it, any status: ready to send, money.
   Red = still New and needs a callback: photo quote form, or an estimator run
   that never finished an estimate. Plain white once Contacted or Quoted. */
.row.t-green,.panel.t-green{background:#e2f3e7}
.row.t-red,.panel.t-red{background:#f9e7e6}
/* Gold star in the tile's corner when the customer picked a day. */
.row{position:relative}
.row .star{position:absolute;top:9px;right:12px;color:var(--gold);font-size:19px;line-height:1;text-shadow:0 1px 1px rgba(23,34,57,.35)}
.row .star+.who{padding-right:24px}
.who{font-weight:700}
.meta{color:var(--muted);font-size:14px}
/* A customer's change to a quote they were sent ("Edit date or message"): needs approving. */
.meta.chg{color:var(--ink);font-weight:700}
.meta.ref{color:#b8860b;font-weight:700}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.panel h2{font:700 20px "Archivo",system-ui,sans-serif;margin:24px 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.panel h2:first-child{margin-top:0}
h1#title[hidden]{display:none}   /* its inline-block style was beating "hidden" */
.nlhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;border-bottom:2px solid var(--gold);padding-bottom:6px}

@media(max-width:620px){.rrow{grid-template-columns:1fr;gap:2px}}

.rval{font-size:16px;color:var(--ink);white-space:pre-wrap}

.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}

.msgrow #msgView{margin-top:4px}

/* Edit contact: name, address, and as many phones / emails as needed */
#contactEdit label{display:block;font-size:13px;margin:10px 0 4px;opacity:.8}

#contactEdit .crow{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:6px;margin-bottom:6px}
#contactEdit textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:8px 10px;border:1px solid #c9cedb;border-radius:6px;resize:vertical}
#contactEdit .phbtn{display:inline-flex;align-items:center;gap:8px;margin-top:2px;padding:9px 14px;border:1px solid #c9cedb;border-radius:8px;background:#fff;color:#172239;font:600 15px system-ui,sans-serif;cursor:pointer}
#contactEdit .phbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

#contactEdit .csz{display:grid;grid-template-columns:minmax(0,1fr) 56px 84px;gap:6px}
#contactEdit .x{width:36px;height:38px;border:1px solid #c9cedb;border-radius:6px;background:none;color:#e05a4f;font-size:20px;cursor:pointer}
.pcell{position:relative}
.pdel{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border:2px solid #fff;border-radius:50%;background:#1c2230;color:#fff;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.4);padding:0;z-index:2}
.pdel:hover{background:#b23b3b}
.pdel:disabled{opacity:.5;cursor:default}
.lbox__fig{position:relative;display:inline-flex;max-width:95vw;max-height:90vh}
.lbox img{display:block;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:6px}
.lbox__x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:2px solid #fff;border-radius:50%;background:#1c2230;color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.lbox__x:hover{background:#333a4d}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.new:disabled,.ghost:disabled{opacity:.6;cursor:default}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
/* History: converted and trashed leads, kept 30 days then erased. */
.row.done{background:#f7f8fa}
.exp{font-size:13px;font-weight:600;color:var(--red);margin-top:4px}
.note a{color:var(--navy);font-weight:600}
</style>

<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1 id="title">Leads</h1>
    <div class="nav">
      <button type="button" class="new" id="createLead" aria-label="Create lead"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <a class="ghost" href="./approved-leads.html" aria-label="Approved"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"/><path d="M22 4 12 14l-3-3"/></svg></a>
      <a class="ghost" href="./customers.html" aria-label="Contacts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg></a>
      <a class="ghost" id="navSwap" href="#trash" aria-label="Trash"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg></a>
    </div>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script src="./phone-format.js"></script>
<script src="./places.js" defer></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore as fsGetFirestore, initializeFirestore, collection, query, where, limit, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, serverTimestamp, runTransaction }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { syncProfileToQuotes } from "./profile-sync.js";   /* saved edits go onto this lead's quotes */
/* iPhone Safari keeps dropping the database's live connection; use steadier long-polling there (same as the job sheet). */
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };

import { tagContacts } from "./contacts.js";   /* everyone with a name and a number is a Contact */
import { sameName, stackPatch } from "./contact-match.js";   /* when two entries are the same person */
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref, getDownloadURL, uploadBytes } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const storage = getStorage(app);

const view = document.getElementById("view"), titleEl = document.getElementById("title");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Whole-house quick quote lead: its square footage (from "About 2,000 sq ft x $0.39 ..."), else 0. */
const wholeSqft = l => {
  const svcs = Array.isArray(l.services) ? l.services : String(l.services || "").split(",");
  if (!svcs.some(s => /whole[- ]?house/i.test(s)) && !/WHOLE-HOUSE QUICK QUOTE/i.test(l.message || "")) return 0;
  const m = /About\s+([\d,]+)\s*sq\s*ft/i.exec(l.message || "");
  return m ? Number(m[1].replace(/,/g, "")) || 0 : 0;
};

/* Create lead: asks for a name (the only thing needed) and files it as a New lead, profile only.
   No estimate yet: Start estimate on the lead's profile makes the draft (see startEstimate). */
/* Opens the full New lead / Contact form (same as the hub's gold button), not the old name pop-up. */
document.getElementById("createLead").addEventListener("click", () => { location.hash = "#new"; });
/* The hub's + (next to Open full calendar) asks for the name there and comes here as ?create=<name>. */
/* Long side 2000px, JPEG ~85%. If the phone can't read the picture, the original goes up as is. */
async function shrinkPhoto(file) {
  try {
    const img = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, 2000 / Math.max(img.width, img.height));
    const c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const out = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
    if (out) return out;
  } catch (e) { console.warn("shrinkPhoto", e); }
  return file;
}
/* Same person already on file? Phone or email match, or the exact same full name.
   Open leads first, then contacts. Returns { col, rec, why } or null. */
async function findDupe(name, extra){
  const pk = phoneKey(extra.phone), ek = emailKey(extra.email);
  const norm = s => String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
  const full = norm(name), fullOk = full.split(" ").length > 1;
  const why = r => pk && phonesOf(r).map(phoneKey).includes(pk) ? "same phone"
    : ek && emailsOf(r).map(emailKey).includes(ek) ? "same email"
    : fullOk && (norm(r.name) === full || norm(r.business) === full) ? "same name" : "";
  if (!all) { try { await load(); } catch (e) { console.error("dupe check", e); } }
  const lead = (all || []).find(l => !l.trashed && !l.converted && why(l));
  if (lead) return { col: "leads", rec: lead, why: why(lead) };
  try {
    let cust = (pk || ek) ? await findMatch(pk ? [pk] : [], ek ? [ek] : []) : null;
    if (!cust && fullOk) {
      const s = await getDocs(query(collection(db, "customers"), where("name", "==", String(name).trim()), limit(5)));
      const hit = s.docs.find(d => !d.data().trashed);
      if (hit) cust = { id: hit.id, ...hit.data() };
    }
    if (cust) return { col: "customers", rec: cust, why: why(cust) || "same phone or email" };
  } catch (e) { console.error("dupe check (contacts)", e); }
  return null;
}

async function createLead(name, b, extra = {}, next = "", files = []) {
  const orig = b.innerHTML; b.disabled = true; b.textContent = "Checking\u2026";
  try {
    /* Stacking: if this looks like someone already on file, ask first.
       OK = add it to them. Cancel = save a separate contact. */
    const dupe = await findDupe(name, extra);
    if (dupe) {
      const r = dupe.rec, dn = r.business || r.name || "Someone";
      if (confirm("This looks like " + dn + " (" + dupe.why + ").\n\nOK = add this to " + dn + "\nCancel = save as a separate contact")) {
        const tRef = doc(db, dupe.col, r.id), paths = [];
        for (let i = 0; i < files.length; i++) {
          b.textContent = "Uploading photo " + (i + 1) + " of " + files.length + "\u2026";
          const blob = await shrinkPhoto(files[i]);
          const p = "quick-quote-photos/" + r.id + "/" + Date.now() + "-" + i + ".jpg";
          await uploadBytes(ref(storage, p), blob, { contentType: "image/jpeg" });
          paths.push(p);
        }
        b.textContent = "Saving\u2026";
        const stack = stackPatch(r, { phones: [extra.phone], emails: [extra.email], addresses: extra.addresses || [],
          business: extra.business, notes: dupe.col === "customers" ? extra.message : "", photoPaths: paths });
        if (dupe.col === "leads" && String(extra.message || "").trim() && !String(r.message || "").includes(extra.message.trim()))
          stack.message = (r.message ? String(r.message).trim() + "\n\n" : "") + extra.message.trim();
        await updateDoc(tRef, { ...stack, updatedAt: serverTimestamp() });
        all = null;
        const goCust = dupe.col === "customers" ? r.id : (r.converted && r.customerId) || "";
        location.href = next || (goCust ? "./customers.html#" + encodeURIComponent(goCust) : "./leads.html#" + encodeURIComponent(r.id));
        return;
      }
    }
    b.textContent = "Creating\u2026";
    const lRef = doc(collection(db, "leads"));
    /* Photos from the New lead / Contact form: shrunk to a phone-friendly JPEG, saved under
       quick-quote-photos/<lead id>/ (same place as website photos), so they carry into the profile. */
    if (files.length) {
      const paths = [];
      for (let i = 0; i < files.length; i++) {
        b.textContent = "Uploading photo " + (i + 1) + " of " + files.length + "\u2026";
        const blob = await shrinkPhoto(files[i]);
        const p = "quick-quote-photos/" + lRef.id + "/" + Date.now() + "-" + i + ".jpg";
        await uploadBytes(ref(storage, p), blob, { contentType: "image/jpeg" });
        paths.push(p);
      }
      extra.photoPaths = paths;
      b.textContent = "Creating\u2026";
    }
    await setDoc(lRef, { ...extra, name, source: "onsite", status: "new",
      createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    /* Filed where it belongs, then on to the next page:
       business types convert to Contacts first (then Contacts, or Texts / Promotions);
       Residential stays a lead (then the Leads list, or Texts / Promotions). */
    if (CONTACT_TYPES[extra.type]) { autoConvert(lRef.id, next); location.href = "./leads.html#" + encodeURIComponent(lRef.id); return; }
    if (next) { location.href = next; return; }
    all = null;
    if (location.hash) location.hash = ""; else showList();
  } catch (err) {
    console.error(err); alert("Couldn't create the lead: " + err.message);
    b.disabled = false; b.innerHTML = orig;
  }
}
/* Start estimate (lead profile, no estimate yet): blank job sheet, a draft quote in "quotes"
   marked fromJobSheet + onsiteEstimate. Summarize > Send estimate turns it into a normal sent quote. */
async function startEstimate(l, b) {
  const orig = b.innerHTML; b.disabled = true; b.textContent = "Starting\u2026";
  try {
    /* Same Q- numbers as the estimator (meta/counters.quote). */
    const n = await runTransaction(db, async tx => {
      const ref = doc(db, "meta", "counters"), s = await tx.get(ref);
      const next = (s.exists() && s.data().quote ? s.data().quote : 1000) + 1;
      tx.set(ref, { quote: next }, { merge: true });
      return next;
    });
    const number = "Q-" + n, qRef = doc(collection(db, "quotes"));
    await setDoc(qRef, { number, type: "quote", status: "draft", fromJobSheet: true, onsiteEstimate: true,
      customer: { name: l.name || l.business || "" }, leadId: l.id, lines: [], subtotal: 0, total: 0,
      date: new Date().toISOString().slice(0, 10), createdAt: serverTimestamp() });
    await updateDoc(doc(db, "leads", l.id), { status: "quoted", quoteId: qRef.id, quoteNumber: number, updatedAt: serverTimestamp() });
    location.href = "./job-sheet.html?id=" + encodeURIComponent(qRef.id);
  } catch (err) {
    console.error(err); alert("Couldn't start the estimate: " + err.message);
    b.disabled = false; b.innerHTML = orig;
  }
}

/* #new: empty New lead form (the hub's +). Only the name is required. Save files the lead
   the same way as Create lead, with the phone, email and address, and opens a blank job sheet. */
function showNewLead() {
  titleEl.textContent = "New lead / Contact"; document.title = "New lead / Contact \u00b7 Khean & Clean";
  view.innerHTML = '<div class="panel" id="contactEdit"><div class="nlhead"><h2>New lead / Contact</h2>' +
    '<button type="button" class="new" id="nlSaveTop">Save</button></div>' +
    /* Business card scanner: front, then back. Reads the card on the phone and fills empty boxes. */
    '<button type="button" class="phbtn" id="nlCardBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 10h6M6 14h9"/></svg><span>Scan business card</span></button>' +
    '<input type="file" id="nlCardIn" accept="image/*" hidden><span class="note" id="nlCardNote"></span>' +
    '<label for="nlName">Name</label><input id="nlName" autocomplete="off" autocapitalize="words">' +
    '<label for="nlType">Type</label>' + typeSelect("nlType") +
    /* Business name: shows for every type except Residential. */
    '<div id="nlBizWrap" hidden><label for="nlBiz">Business name</label><input id="nlBiz" autocomplete="off" autocapitalize="words"></div>' +
    '<label for="nlPhone">Phone</label><input id="nlPhone" type="tel" autocomplete="off">' +
    '<label for="nlEmail">Email</label><input id="nlEmail" type="email" autocomplete="off" autocapitalize="off">' +
    /* Street: Google autofill (places.js, id ends in Addr) as you type, and the phone's own
       AutoFill (address tokens) fills street, city, state and zip together from a contact. */

  const loadOcr = () => window.Tesseract ? Promise.resolve() : new Promise((ok, no) => {

  /* Shrink to 1800px and turn grey so the reader does better and phones don't choke. */

  const parseCard = text => {

    /* Phones: skip fax lines; prefer a line marked cell / mobile / c / m. */

    lines.forEach(l => { (l.match(/(?:\+?1[\s.-]*)?\(?\d{3}\)?[\s.-]*\d{3}[\s.-]*\d{4}/g) || []).forEach(p => {
      if (/\bfax\b|\bf[:.]/i.test(l)) return;

    }); });
    const ph = phones.find(p => p.cell) || phones[0];
    if (ph) out.phone = "(" + ph.d.slice(0, 3) + ") " + ph.d.slice(3, 6) + "-" + ph.d.slice(6);
    const csz = all.match(/([A-Za-z .]+),?\s+([A-Z]{2})\.?\s+(\d{5})(?:-\d{4})?/);
    if (csz) { out.city = csz[1].replace(/^.*\d\s*/, "").trim(); out.state = csz[2]; out.zip = csz[3]; }
    const st = lines.find(l => /^\d+\s+\S+.*\b(st|street|ave|avenue|way|rd|road|dr|drive|blvd|ln|lane|ct|court|pl|place|pkwy|parkway|cir|circle|hwy|suite|ste)\b/i.test(l));

    const BIZ = /\b(inc|llc|co|corp|company|realty|real estate|properties|property|management|group|services|homes|partners|associates|brokerage|keller|coldwell|century|compass|remax|re\/max|sotheby|berkshire|exp)\b/i;
    const JOB = /\b(agent|realtor|broker|manager|director|owner|president|ceo|associate|specialist|consultant|dre|lic|license|www|http|\.com)\b/i;
    const biz = lines.find(l => BIZ.test(l) && !/@/.test(l) && !/\d{3}/.test(l)); if (biz) out.business = biz;

  cardBtn.addEventListener("click", () => cardIn.click());

    if (v("nlPhone")) extra.phone = v("nlPhone");

      : mode === "promo" ? "./promotions.html?to=" + encodeURIComponent(to) + "&name=" + encodeURIComponent(name) : "";
    createLead(name, b, extra, next, picked);

  document.getElementById("nlSaveTop").addEventListener("click", e => save(e.currentTarget, ""));   /* same Save, at the top */
  document.getElementById("nlText").addEventListener("click", e => save(e.currentTarget, "text"));

/* Lead status. No status on file = new. */
const STATUSES = [

];
const statusOf = l => STATUSES.find(s => s.v === l.status) || STATUSES[0];
/* Tint shared by the tile and the open lead. Green: a finished estimate is on
   it (only the website estimator's last step saves estimateData), any status.
   Red: still New and needs a callback (photo quote form, or an estimator run
   with no finished estimate). Anything else: plain white. */
const CALLBACK = ["quick-quote", "estimator", "in-depth-estimator"];
const tintOf = l => String(l.estimateData || "").trim() ? "t-green"
  : statusOf(l).v === "new" && CALLBACK.includes(l.source) ? "t-red" : "";

/* Same field names as customers.html. Leads saved before the rename have
   flat street/city/zip and property_type, so fall back to those. */
const addrOf = l => (Array.isArray(l.addresses) && l.addresses[0]) ||
  { street: l.street, city: l.city, state: l.street || l.city ? "CA" : "", zip: l.zip };
const cityLine = a => [[a.city, a.state].filter(Boolean).join(", "), a.zip].filter(Boolean).join(" ");
/* Lead type dropdown (New lead form and the lead's contact Edit). A type not on the list
   (older leads) is kept as its own option so saving doesn't change it. */
const LEAD_TYPES = ["Residential", "Commercial", "Business partner", "Property manager", "Realtor", "Other"];
/* These lead types go straight to Contacts (customers.html) as that category when saved. */
const CONTACT_TYPES = { "business partner": "partner", "property manager": "pm", "realtor": "realtor", "other": "other" };
/* next: where to go once converted (Texts / Promotions); blank = the new contact's page. */
const autoConvert = (id, next) => { try { sessionStorage.setItem("kc_autoConvert", id); sessionStorage.setItem("kc_autoNext", next || ""); } catch (e) {} };
const typeSelect = (id, cur = "residential") => {
  const list = LEAD_TYPES.some(t => t.toLowerCase() === cur) ? LEAD_TYPES : [cur.charAt(0).toUpperCase() + cur.slice(1)].concat(LEAD_TYPES);
  return '<select id="' + id + '">' + list.map(t => '<option value="' + esc(t.toLowerCase()) + '"' +
    (t.toLowerCase() === cur ? ' selected' : '') + '>' + esc(t) + '</option>').join("") + '</select>';
};
const typeLabel = l => {
  const t = String(l.type || l.property_type || "residential").toLowerCase();
  return t.charAt(0).toUpperCase() + t.slice(1);
};
/* Partner referral: business name and code, read from the "REFERRAL from X (code KC…)" line
   the partner portal writes, so older referral leads work too. null for every other lead. */
const refOf = l => {
  const m = String(l.message || "").match(/^REFERRAL from (.+?) \(code ([A-Z0-9]+)\)/m);
  return m ? { from: m[1], code: m[2] } : null;
};
const servicesOf = l => Array.isArray(l.services) ? l.services.join(", ") : String(l.services || "");
/* The website's Yes / No text-message choice (smsConsent). If the database refused that
   field, a "Yes" survives as the message's first line and a "No" leaves no trace, so a
   lead without either reads "Not recorded" rather than "Not asked". */
const textOk = l => l.smsConsent === true || /^OK to text: yes/m.test(String(l.message || "")) ? true
  : l.smsConsent === false ? false : null;
const textingOf = l => { const t = textOk(l); return t === true ? "Yes, OK to text" : t === false ? "No, do not text" : "Not recorded"; };
/* The website's optional "text me specials" checkbox (marketingConsent). Same idea: if the
   database refused the field, a Yes survives as an "OK to text specials: yes" line at the top
   of the message (second line when the texting Yes is there too). */
const promoOk = l => l.marketingConsent === true || /^OK to text specials: yes/m.test(String(l.message || "")) ? true
  : l.marketingConsent === false ? false : null;
const promoOf = l => { const t = promoOk(l); return t === true ? "Yes, OK to text specials" : t === false ? "No, do not text specials" : "Not recorded"; };
/* Those "OK to text..." lines already show as the Texting / Specials rows, so the Message box
   hides them. They stay saved at the top of the message, since the rows read them from there. */
const CONSENT_LINE = /^OK to text( specials)?: (yes|no)$/i;
const msgParts = l => {
  /* Anywhere in the message, not just the top: a lead merged from two visits carries them twice. */
  const head = [], body = String(l.message || "").split("\n").filter(s => {
    if (!CONSENT_LINE.test(s.trim())) return true;
    if (!head.includes(s.trim())) head.push(s.trim());
    return false;
  });
  return { head, body: body.join("\n").replace(/\n{3,}/g, "\n\n").trim() };
};
const ms = t => !t ? 0 : typeof t.toMillis === "function" ? t.toMillis() : (Date.parse(t) || 0);
const when = l => { const m = ms(l.createdAt); return m ? new Date(m).toLocaleString(undefined,
  { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; };
/* The day the customer asked for on the website, saved as "10/05/26 AM" (or "PM",
   "All day", or just the date). Shown as "Mon, Oct 5 · AM"; anything else (like "ASAP") as typed. */
const wantsDay = l => {
  const s = String(l.when || "").trim();
  const m = /^(\d{2})\/(\d{2})\/(\d{2})(?:\s+(AM|PM|All day))?$/i.exec(s);
  if (!m) return s;
  const d = new Date(2000 + +m[3], +m[1] - 1, +m[2]);
  return d.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }) + (m[4] ? " \u00b7 " + m[4] : "");
};
/* Leads come from a public form, so only real https links are shown as photos. */
const photosOf = l => (Array.isArray(l.photoUrls) ? l.photoUrls : []).filter(u => /^https:\/\//.test(String(u)));
/* Newer leads store where each photo sits in Storage. Only quick-quote paths are accepted. */
const pathsOf = l => (Array.isArray(l.photoPaths) ? l.photoPaths : [])
  .filter(p => typeof p === "string" && p.startsWith("quick-quote-photos/") && !p.includes(".."));
const photoCount = l => photosOf(l).length + pathsOf(l).length;

/* An older duplicate of a lead can hold what the newer one lacks: photos,
   services, the day wanted, the estimate, a typed message. carryOver() returns
   just those (or null). The kept lead keeps its own source; its color comes
   from what is on it (see tintOf). The estimator's canned details-only line
   is never carried. */
const SOFT_MSG = "Opened the estimator (details only, no estimate yet)";
const blank = v => !String(Array.isArray(v) ? v.join("") : (v || "")).trim();
const carryOver = (older, newer) => {
  const out = {};
  const nPaths = Array.isArray(newer.photoPaths) ? newer.photoPaths : [];
  const addPaths = pathsOf(older).filter(p => !nPaths.includes(p));
  if (addPaths.length) out.photoPaths = nPaths.concat(addPaths);
  const nUrls = Array.isArray(newer.photoUrls) ? newer.photoUrls : [];
  const addUrls = photosOf(older).filter(u => !nUrls.includes(u));
  if (addUrls.length) out.photoUrls = nUrls.concat(addUrls);
  for (const f of ["services", "when", "estimateData", "editOf", "editOfNumber"]) if (blank(newer[f]) && !blank(older[f])) out[f] = older[f];
  const om = String(older.message || "").trim(), nm = String(newer.message || "").trim();
  if (om && om !== SOFT_MSG && !nm.includes(om)) out.message = (nm && nm !== SOFT_MSG) ? nm + "\n\n" + om : om;
  if (!Object.keys(out).length) return null;
  return out;
};

/* ---- History: converted and trashed leads stay 30 days, then are erased.
   Same rule as the customers Trash. A browser page can only erase while it is
   open, so the sweep runs each time the leads list loads. ---- */
const HISTORY_DAYS = 30, msDay = 86400000;
const historyMs = l => l.trashed ? ms(l.trashedAt) : l.converted ? ms(l.convertedAt) : 0;
const inHistory = l => !!(l.trashed || l.converted);
/* Old lead: still open, but nothing has changed on it for 30 days. They move to the Old leads page (#old). */
const OLD_DAYS = 30;
const isOld = l => !inHistory(l) && Date.now() - (ms(l.updatedAt) || ms(l.createdAt)) > OLD_DAYS * 86400000;
const daysLeft = l => { const t = historyMs(l); return t ? HISTORY_DAYS - Math.floor((Date.now() - t) / msDay) : null; };
const leftLabel = l => {
  const d = daysLeft(l);
  if (d === null) return "";
  const verb = l.trashed ? "Erased" : "Falls off";
  return d <= 1 ? verb + " tomorrow" : verb + " in " + d + " days";
};

/* Same match keys and id format as customers.html, so converted leads line up. */
const phoneKey = s => { const d = String(s || "").replace(/\D/g, "").slice(-10); return d.length === 10 ? d : ""; };
const emailKey = s => String(s || "").trim().toLowerCase();
const one = v => { const t = String(v || "").trim(); return t ? [t] : []; };
/* Every phone / email on the lead: the main one first, then any extras added with Edit. */
const listOf = (main, more) => { const out = [];
  [main].concat(Array.isArray(more) ? more : []).forEach(v => { const t = String(v || "").trim(); if (t && !out.includes(t)) out.push(t); });
  return out; };
const phonesOf = l => listOf(l.phone, l.phones);
/* (916) 324-2497 for any 10-digit US number; anything else shows as typed. */
const fmtPhone = v => { const d = String(v || "").replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
  return d.length === 10 ? "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6) : String(v || "").trim(); };
const emailsOf = l => listOf(l.email, l.emails);
function randomId(){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => abc[b % abc.length]).join("");
}
async function findMatch(pks, eks){
  const tries = [];
  pks.forEach(v => tries.push(["phoneKeys", "array-contains", v], ["phoneKey", "==", v]));
  eks.forEach(v => tries.push(["emailKeys", "array-contains", v], ["emailKey", "==", v]));
  for (const [f, op, v] of tries) {
    if (!v) continue;
    const s = await getDocs(query(collection(db, "customers"), where(f, op, v), limit(10)));
    const hit = s.docs.find(d => !d.data().trashed);   /* trashed contacts don't count */
    if (hit) return { id: hit.id, ...hit.data() };
  }
  return null;
}

let all = null, purged = 0;
async function load(){
  const snap = await getDocs(collection(db, "leads"));
  all = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => ms(b.createdAt) - ms(a.createdAt));
  tagContacts(db, "leads", all);
  /* Leads made by Create lead before Oct 29 copied the texts in. Trim them to the referral note,
     like every other text lead (the conversation stays on the Texts page). Runs once per lead. */
  for (const l of all) {
    if (!(l.source === "text" || l.source === "call") || !/\n*What they texted:/.test(l.message || "")) continue;
    const msg = String(l.message).replace(/\n*What they texted:[\s\S]*$/, "")
      .replace(/^(Referred by .+?)\s+[-–—]\s?[A-Z][a-z'’-]+\.$/m, "$1.").trim();
    try { await updateDoc(doc(db, "leads", l.id), { message: msg }); l.message = msg; }
    catch (e) { console.warn("trim lead " + l.id, e); }
  }
  for (const l of all.slice()) {
    const d = daysLeft(l);
    if (d === null || d > 0) continue;
    try { await deleteDoc(doc(db, "leads", l.id)); all = all.filter(x => x.id !== l.id); purged++; }
    catch (e) { console.error("Could not erase lead " + l.id, e); }
  }
  /* A newer lead from the same person (same phone or email, or tagged with the
     soft lead's id) replaces an older one nobody has worked yet. The older one
     goes to Trash, so it can still be restored for 30 days. */
  const untouched = x => !x.trashed && !x.converted && (x.status || "new") === "new" && !x.staffNotes && !x.quoteId;
  for (const newer of all.filter(x => !x.trashed && !x.converted)) {
    if (newer.trashed) continue;   /* went to Trash earlier in this same pass */
    const pk = phoneKey(newer.phone), ek = emailKey(newer.email);
    for (const older of all) {
      if (older.id === newer.id || !untouched(older)) continue;
      if (ms(older.createdAt) >= ms(newer.createdAt)) continue;
      const same = older.id === newer.softLeadId ||
        (pk && phoneKey(older.phone) === pk) || (ek && emailKey(older.email) === ek);
      if (!same) continue;
      /* Anything the older lead has that the newer one lacks moves over first.
         If that save fails, the older lead is left alone so nothing is lost. */
      const carry = carryOver(older, newer);
      if (carry) {
        try {
          await updateDoc(doc(db, "leads", newer.id), Object.assign({}, carry, { updatedAt: serverTimestamp() }));
          Object.assign(newer, carry);
        } catch (e) { console.error("Could not copy lead " + older.id + " onto " + newer.id, e); continue; }
      }
      try {
        await updateDoc(doc(db, "leads", older.id), { trashed: true, trashedAt: serverTimestamp(), updatedAt: serverTimestamp() });
        older.trashed = true; older.trashedAt = new Date().toISOString();
      } catch (e) { console.error("Could not trash duplicate lead " + older.id, e); }
    }
  }
}

/* ---- List: newest first, grouped by status ---- */
async function showList(old = false){
  titleEl.textContent = old ? "Old leads" : "Leads";
  document.title = (old ? "Old leads" : "Leads") + " · Khean & Clean";
  if (!all) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try { await load(); }
    catch (e) {
      console.error(e);
      view.innerHTML = '<div class="msg">Could not load leads: ' + esc(e.message) + '</div>';
      return;
    }
  }
  const card = l => {
    const n = photoCount(l);
    const lines = [cityLine(addrOf(l)), l.phone, servicesOf(l),
      [when(l), n ? n + (n === 1 ? " photo" : " photos") : ""].filter(Boolean).join(" · ")];
    return '<a class="row ' + (inHistory(l) ? "done" : tintOf(l)) + '" href="#' + encodeURIComponent(l.id) + '">' +
      (String(l.when || "").trim() ? '<span class="star" title="Wants ' + esc(wantsDay(l)) + '" aria-label="Wants ' + esc(wantsDay(l)) + '">\u2605</span>' : '') +
      '<div class="who">' + esc(l.name || "No name") + '</div>' +
      (l.leadNumber ? '<div class="meta">' + esc(l.leadNumber) + (l.page === "quote-finder" ? ' \u00b7 Instant Quote' : '') + '</div>' : '') +
      (refOf(l) ? '<div class="meta ref">Referral from ' + esc(refOf(l).from) + '</div>' : '') +
      (l.editOfNumber ? '<div class="meta chg">Change request \u00b7 ' + esc(l.editOfNumber) + '</div>' : '') +
      lines.filter(x => x && String(x).trim()).map(x => '<div class="meta">' + esc(x) + '</div>').join("") +
      (inHistory(l) ? '<div class="exp">' + esc(leftLabel(l)) + '</div>' : '') +
    '</a>';
  };
  const olds = all.filter(isOld);
  const live0 = old ? olds : all.filter(l => !inHistory(l) && !isOld(l));
  const iq = old ? [] : live0.filter(l => l.page === "quote-finder");   /* Instant Quote leads: started or sent, not approved yet */
  const live = live0.filter(l => !iq.includes(l));
  const converted = old ? [] : all.filter(l => l.converted && !l.trashed);
  view.innerHTML = (old
      ? '<div class="msg">No change in ' + OLD_DAYS + ' days. Open one and update it to move it back to Leads. <a href="#">Back to Leads</a></div>'
      : olds.length ? '<div class="actions"><a class="ghost" href="#old">Old leads (' + olds.length + ')</a></div>' : '') +
    (iq.length ? '<section class="col"><h3 class="colhead">Instant Quote leads (' + iq.length + ')</h3>' + iq.map(card).join("") + '</section>' : "") +
    (live.length
    ? STATUSES.map(s => {
        const inS = live.filter(l => statusOf(l).v === s.v);
        return inS.length ? '<section class="col"><h3 class="colhead">' + (s.v === "quoted" ? "Quoted, not hired" : s.label) + ' (' + inS.length + ')</h3>' +
          inS.map(card).join("") + '</section>' : "";
      }).join("")
    : iq.length ? "" : '<div class="msg">' + (old ? "No old leads." : "No open leads. Quick quotes from the website land here.") + '</div>') +
    (converted.length
      ? '<section class="col"><h3 class="colhead">Quoted leads (' + converted.length + ')</h3>' +
        converted.map(card).join("") + '</section>' : "") +
    (purged ? '<div class="msg">' + purged + (purged === 1 ? " lead" : " leads") + ' erased after 30 days.</div>' : "");
}

/* ---- Trash: deleted leads, erased 30 days after deleting ---- */
async function showTrash(){
  titleEl.textContent = "Trash";
  document.title = "Lead trash · Khean & Clean";
  if (!all) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try { await load(); }
    catch (e) { console.error(e); view.innerHTML = '<div class="msg">Could not load leads: ' + esc(e.message) + '</div>'; return; }
  }
  const rows = all.filter(l => l.trashed);
  view.innerHTML = (rows.length
    ? '<section class="col"><h3 class="colhead">Deleted leads (' + rows.length + ')</h3>' + rows.map(l =>
        '<a class="row done" href="#' + encodeURIComponent(l.id) + '">' +
          '<div class="who">' + esc(l.name || "No name") + '</div>' +
          [l.phone, l.email].filter(Boolean).map(x => '<div class="meta">' + esc(x) + '</div>').join("") +
          '<div class="exp">' + esc(leftLabel(l)) + '</div>' +
        '</a>').join("") + '</section>'
    : '<div class="msg">The trash is empty.</div>') +
    '<div class="actions"><a class="ghost" href="#">Back to leads</a></div>';
}

/* ---- One lead: details, photos, status ---- */
const rrow = (lab, val) =>
  '<div class="rrow"><div class="rlab">' + lab + '</div><div class="rval' +
  (val ? '' : ' empty') + '">' + (val ? esc(val) : "—") + '</div></div>';
/* A bare value with no label — contact lines where the meaning is obvious. */
const prow = val => val ? '<div class="prow">' + esc(val).replace(/\n/g, "<br>") + '</div>' : '';

async function showLead(id){
  let l = all && all.find(x => x.id === id);
  if (!l) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try {
      const s = await getDoc(doc(db, "leads", id));
      if (!s.exists()) { view.innerHTML = '<div class="msg">That lead isn’t on file. <a href="#">Back to leads</a></div>'; return; }
      l = { id, ...s.data() };
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>';
      return;
    }
  }
  titleEl.textContent = l.name || "Lead";
  document.title = titleEl.textContent + " · Khean & Clean";

  const a = addrOf(l), photos = photosOf(l);
  const tel = String(l.phone || "").replace(/[^\d+]/g, "");
  const cur = statusOf(l).v;
  view.innerHTML =
    '<div class="panel' + (inHistory(l) ? '' : ' ' + tintOf(l)) + '">' +
      '<div class="leadhead"><h2>Lead' + (l.leadNumber ? ' ' + esc(l.leadNumber) : '') + '</h2>' +
        (when(l) ? '<span class="leadtime">' + esc(when(l)) + '</span>' : '') +
      '</div>' +
      '<div class="read">' +
        '<div class="msghead"><div class="rlab">Contact</div><button type="button" class="ghost tiny" id="editContact">Edit</button></div>' +
        '<div class="contact" id="contactView">' +
          prow(l.name) +
          (function(){
            const full = [a.street, cityLine(a)].filter(Boolean).join("\n");
            if (!full) return "";
            /* Plain maps link so each device opens its preferred maps app. */
            const q = encodeURIComponent([a.street, cityLine(a)].filter(Boolean).join(", "));
            return '<div class="prow"><a class="maplink" href="https://maps.google.com/?q=' + q +
              '" target="_blank" rel="noopener">' + esc(full).replace(/\n/g, "<br>") + '</a></div>';
          })() +
          phonesOf(l).map(fmtPhone).map(prow).join("") + emailsOf(l).map(prow).join("") +
        '</div>' +
        '<div id="contactEdit" hidden>' +
          '<label>Name</label><input id="ceName" autocomplete="off" value="' + esc(l.name || "") + '">' +
          '<label for="ceType">Type</label>' + typeSelect("ceType", String(l.type || l.property_type || "residential").toLowerCase()) +
          '<label>Street</label><input id="ceAddr" type="text" autocomplete="off" value="' + esc(a.street || "") + '">' +
          '<label>City / State / Zip</label><div class="csz"><input id="ceCity" value="' + esc(a.city || "") + '" aria-label="City">' +
            '<input id="ceState" value="' + esc(a.state || "CA") + '" aria-label="State" maxlength="2">' +
            '<input id="ceZip" value="' + esc(a.zip || "") + '" aria-label="Zip" inputmode="numeric" maxlength="10"></div>' +
          '<label>Phones (the first one is the main one)</label><div id="cePhones"></div>' +
          '<button type="button" class="ghost tiny" data-ceadd="phone">+ Add phone</button>' +
          '<label>Emails (the first one is the main one)</label><div id="ceEmails"></div>' +
          '<button type="button" class="ghost tiny" data-ceadd="email">+ Add email</button>' +
          '<div class="actions"><button type="button" class="new" id="saveContact">Save</button>' +
            '<button type="button" class="ghost" id="savePromo">Save &amp; text a promotion</button>' +   /* saves, then opens Promotions for this number */
            '<button type="button" class="ghost" id="cancelContact">Cancel</button><span class="note" id="contactMsg"></span></div>' +
        '</div>' +
        /* A change to a quote already sent: approve it by updating that quote and resending it. */
        (l.editOf ? '<div class="rrow"><div class="rlab">Changes</div><div class="rval">Quote ' + esc(l.editOfNumber || "") +
          ' \u00b7 <a href="./index.html?edit=' + encodeURIComponent(l.editOf) + '&amp;from=quotes">Open it to update and resend</a></div></div>' : "") +
        (refOf(l) ? rrow("Referred by", refOf(l).from + " \u00b7 code " + refOf(l).code) : "") +
        rrow("Type", typeLabel(l)) +
        (String(l.when || "").trim() ? rrow("Wants", wantsDay(l)) : "") +
        rrow("Services", servicesOf(l)) +
        rrow("Texting", textingOf(l)) +
        rrow("Specials", promoOf(l)) +
        /* Quote builder lead with its estimate already filed: just the quote, not the long summary. */
        (l.page === "quote-finder" && l.quoteId
          ? '<div class="rrow"><div class="rlab">Message</div><div class="actions" style="margin-top:6px"><a class="new" href="./quote.html?id=' +
              encodeURIComponent(l.quoteId) + '" target="_blank" rel="noopener">View quote' + (l.quoteNumber ? ' ' + esc(l.quoteNumber) : '') + '</a></div></div>' :
        '<div class="rrow msgrow"><div class="msghead"><div class="rlab">Message</div>' +
          '<button type="button" class="ghost tiny" id="editMsg">Edit</button></div>' +
          '<div class="rval' + (msgParts(l).body ? '' : ' empty') + '" id="msgView">' + (msgParts(l).body ? esc(msgParts(l).body) : "\u2014") + '</div>' +
          '<div id="msgEdit" hidden><textarea id="msgText" rows="3">' + esc(msgParts(l).body) + '</textarea>' +
            '<div class="actions"><button type="button" class="new" id="saveMsg">Save</button>' +
            '<button type="button" class="ghost" id="cancelMsg">Cancel</button>' +
            '<span class="note" id="msgMsg"></span></div></div>' +
        '</div>') +
      '</div>' +
      '<div class="actions">' +
        (tel ? '<a class="ghost" href="tel:' + esc(tel) + '">Call</a><a class="ghost" href="./texts.html#' + esc(String(tel).replace(/\D/g, "").slice(-10)) + '">Text</a>' : '') +   /* business line, not your cell */
        /* Text a promotion: Promotions page with this lead filled in as Send to (quote builder, quick quote, QR...). */
        (tel ? '<a class="ghost" href="./promotions.html?to=' + encodeURIComponent(String(tel).replace(/\D/g, "").slice(-10)) + '&name=' + encodeURIComponent(l.name || "") + '">Text a promotion</a>'
          : '<button type="button" class="ghost" id="promoNoTel">Text a promotion</button>') +   /* no number yet: opens Edit contact to add one */
        (l.email ? '<a class="ghost" href="./email.html#new/' + encodeURIComponent(l.email) + '">Email</a>' : '') +   /* app's Mail, from kheanandclean.com */
      '</div>' +
      '<h2>Photos</h2>' +
      '<div id="photos"><div class="msg">' + (photoCount(l) ? 'Loading photos&hellip;' : 'No photos with this lead.') + '</div></div>' +
      /* Status: just the current one, set on its own (Call / Text / Email -> Contacted).
         Once there's a quote, no status at all: only the quote buttons. */
      (l.quoteId
        ? '<div class="actions" id="quoteLinks" style="margin-top:22px"></div>'
        : '<h2>Status</h2><div class="actions"><span class="new" id="stLabel" style="cursor:default">' + esc(statusOf(l).label) + '</span><button type="button" class="new" id="startEst">Start estimate</button></div>') +
      /* Partner referral: the status the partner sees in their portal's Referrals list. */
      (l.referralId
        ? '<h2>Referral</h2><div class="actions"><select id="refSt" disabled>' +
            [["submitted","Submitted"],["booked","Booked"],["done","Job done"],["paid","Paid out"],["closed","Closed"]]
              .map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join("") +
          '</select><span class="note" id="refStMsg">The partner sees this in their portal.</span></div>'
        : "") +
      '<h2>Notes</h2>' +
      '<div class="notesbox">' +
        '<textarea id="staffNotes" rows="4" placeholder="Notes about this lead\u2026">' + esc(l.staffNotes || "") + '</textarea>' +
        '<div class="actions"><button type="button" class="ghost" id="saveNotes">Save notes</button>' +
        '<span class="note" id="notesMsg"></span></div>' +
      '</div>' +
      (l.converted
        ? '<p class="note">Converted to a customer. ' +
            (l.customerId ? '<a href="./customers.html#' + encodeURIComponent(l.customerId) + '">Open customer</a>. ' : '') +
            esc(leftLabel(l)) + '.</p>'
        : '') +
      (l.trashed ? '<p class="note err">In the trash. ' + esc(leftLabel(l)) + '.</p>' : '') +
      '<div class="actions">' +
        (!l.trashed ? '<button type="button" class="new" id="quoteBtn">' + (wholeSqft(l) ? 'Build whole-house estimate' : 'New quote') + '</button>' : '') +
        (!l.trashed && cur === "quoted" ? '<button type="button" class="ghost" id="cancelQuoteBtn">Quote canceled</button>' : '') +
        (!l.converted && !l.trashed ? '<button type="button" class="new" id="convertBtn">Convert to customer</button>' : '') +
        (l.trashed
          ? '<button type="button" class="ghost" id="restoreBtn">Restore</button>'
          : '<button type="button" class="ghost" id="delBtn">Delete</button>') +
        '<a class="ghost" href="#">Back to leads</a>' +
        '<span class="note" id="note"></span>' +
      '</div>' +
    '</div>';

  /* Quote links under Status: Open quote always; Job sheet once the quote is approved.
     An approved quote keeps its id when it moves from "quotes" to "acceptedQuotes". */
  if (l.quoteId) (async () => {
    const box = document.getElementById("quoteLinks");
    const qid = encodeURIComponent(l.quoteId), num = l.quoteNumber ? " " + esc(l.quoteNumber) : "";
    let from = "quotes", upd = null;
    try { if ((await getDoc(doc(db, "acceptedQuotes", l.quoteId))).exists()) from = "acceptedQuotes";
      else { const s = await getDoc(doc(db, "quotes", l.quoteId)); if (s.exists() && s.data().fromJobSheet) upd = s.data(); } }
    catch (e) { console.error("Quote lookup", e); }
    if (!box || !box.isConnected) return;
    /* Updated quote from a job sheet, waiting on approval: the original quote and the job sheet stay reachable. */
    const og = upd && upd.originalQuote;
    box.innerHTML = '<a class="ghost" href="./index.html?edit=' + qid + '&amp;from=' + from + '">Open quote' + num + '</a>' +
      (og ? '<a class="ghost" href="./quote.html?id=' + qid + '&amp;original=1" target="_blank" rel="noopener">Original quote' +
        (og.total != null ? ' &middot; $' + Number(og.total).toFixed(2) : '') + '</a>' : '') +
      (from === "acceptedQuotes" || upd ? '<a class="ghost" href="./job-sheet.html?id=' + qid + '">Job sheet</a>' : '');
  })();

  /* Photos. Older leads carry links; newer ones carry storage paths, which only
     a signed-in staff member can turn into links. */
  if (photoCount(l)) (async () => {
    const fromPaths = await Promise.all(pathsOf(l).map(p =>
      getDownloadURL(ref(storage, p)).catch(e => { console.error("Photo " + p, e); return null; })));
    /* Each tile remembers which array and value it came from, so the X trashes the right one. */
    const pathList = pathsOf(l);
    const tiles = photos.map(u => ({ url: u, kind: "url", val: u }))
      .concat(fromPaths.map((u, i) => u ? { url: u, kind: "path", val: pathList[i] } : null).filter(Boolean));
    const box = document.getElementById("photos");
    if (!box || !box.isConnected) return;
    box.innerHTML = tiles.length
      ? '<div class="pgrid">' + tiles.map(t =>
          '<div class="pcell"><a href="' + esc(t.url) + '" class="pshot" data-full="' + esc(t.url) + '"><img src="' + esc(t.url) + '" alt="" loading="lazy"></a>'
          + '<button type="button" class="pdel" data-kind="' + esc(t.kind) + '" data-val="' + esc(t.val) + '" aria-label="Remove photo">\u00d7</button></div>').join("") + '</div>'
      : '<div class="msg">The photos for this lead could not be loaded.</div>';

    /* X on a thumbnail: move that photo into trashedPhotos and drop it from its array.
       It disappears from the row right away. The file stays in Storage for now;
       sweeping trashed photos out of Storage is a later step. */
    box.addEventListener("click", async e => {
      const btn = e.target.closest(".pdel");
      if (!btn) return;
      e.preventDefault();
      const kind = btn.dataset.kind, val = btn.dataset.val;
      const cur = all && all.find(x => x.id === id);
      if (!cur) return;
      const field = kind === "path" ? "photoPaths" : "photoUrls";
      const left = (Array.isArray(cur[field]) ? cur[field] : []).filter(v => v !== val);
      const trashed = (Array.isArray(cur.trashedPhotos) ? cur.trashedPhotos : []).concat([{ kind, val, at: new Date().toISOString() }]);
      btn.disabled = true;
      try {
        await updateDoc(doc(db, "leads", id), { [field]: left, trashedPhotos: trashed, updatedAt: serverTimestamp() });
        patchLocal({ [field]: left, trashedPhotos: trashed });
        location.reload();
      } catch (err) { console.error(err); btn.disabled = false; alert("Could not remove the photo: " + err.message); }
    });
  })();

  const note = document.getElementById("note");
  const say = (html, isErr) => { note.innerHTML = html; note.classList.toggle("err", !!isErr); };
  const patchLocal = p => { if (all) all = all.map(x => x.id === id ? Object.assign({}, x, p) : x); };

  /* Delete = move to trash. Erased for good 30 days later; Restore until then. */
  const delBtn = document.getElementById("delBtn"), restoreBtn = document.getElementById("restoreBtn");
  if (delBtn) delBtn.addEventListener("click", async () => {
    if (!confirm("Move this lead to the trash? It is erased for good after 30 days. You can restore it until then.")) return;
    delBtn.disabled = true; say("Moving to trash…");
    try {
      await updateDoc(doc(db, "leads", id), { trashed: true, trashedAt: serverTimestamp(), updatedAt: serverTimestamp() });
      patchLocal({ trashed: true, trashedAt: new Date().toISOString() });
      location.hash = "#";
    } catch (e) { console.error(e); say("Could not delete: " + esc(e.message), true); delBtn.disabled = false; }
  });
  if (restoreBtn) restoreBtn.addEventListener("click", async () => {
    restoreBtn.disabled = true; say("Restoring…");
    try {
      await updateDoc(doc(db, "leads", id), { trashed: false, trashedAt: null, updatedAt: serverTimestamp() });
      patchLocal({ trashed: false, trashedAt: null });
      showLead(id);
    } catch (e) { console.error(e); say("Could not restore: " + esc(e.message), true); restoreBtn.disabled = false; }
  });

  /* Convert = make a customer from this lead (or link to the one already on file),
     then mark the lead converted. It stays in Converted for 30 days, then is erased. */
  const convertBtn = document.getElementById("convertBtn");
  const quoteBtn = document.getElementById("quoteBtn");
  if (quoteBtn) quoteBtn.addEventListener("click", async () => {
    const a = addrOf(l);
    /* Hand the estimator just the customer fields it asks for. It reads
       this on load, fills the form, then clears it. */
    const prefill = {
      type: String(l.type || l.property_type || "residential").toLowerCase(),
      business: l.business || l.company || "",
      name: l.name || "",
      phone: l.phone || "",
      email: l.email || "",
      street: a.street || "",
      city: a.city || "",
      state: a.state || "",
      zip: a.zip || "",
      message: l.message || "",
      /* Yes / No / null; the estimator shows these as Texting and Specials. */
      texting: textOk(l),
      specials: promoOk(l),
      /* The services ticked on the website form; the estimator shows them as chips. */
      services: Array.isArray(l.services) ? l.services : String(l.services || "").split(",").map(s => s.trim()).filter(Boolean),
      leadId: l.id,
      /* The day the customer asked for ("10/05/26 AM"), so Job date fills in. */
      when: typeof l.when === "string" ? l.when : "",
      /* Homepage estimator choices, so the estimate rebuilds itself. */
      estimateData: typeof l.estimateData === "string" ? l.estimateData : "",
      /* Whole-house quick quote (partner portal): its square footage, so the estimator adds the
         whole-house line at the realtor package price. */
      wholeHouseSqft: wholeSqft(l)
    };
    try { sessionStorage.setItem("kc_prefill", JSON.stringify(prefill)); } catch (e) {}
    /* Mark the lead quoted before handing off. Wait for the write so a fast
       navigation can't drop it; if it fails, still open the estimator. */
    if (quoteBtn) quoteBtn.disabled = true;
    try {
      await updateDoc(doc(db, "leads", l.id), { status: "quoted", updatedAt: serverTimestamp() });
    } catch (e) { console.error(e); }
    location.href = "./index.html";
  });

  let auto = false;
  if (convertBtn) convertBtn.addEventListener("click", async () => {
    convertBtn.disabled = true; say("Checking customers…");
    try {
      const phones = phonesOf(l), emails = emailsOf(l);
      const phoneKeys = phones.map(phoneKey).filter(Boolean), emailKeys = emails.map(emailKey).filter(Boolean);
      let dup = await findMatch(phoneKeys, emailKeys);
      let customerId;
      /* Stacking rule (contact-match.js): name + phone/email match stacks on its own;
         a phone/email match with a different name asks; no match = new contact. */
      if (dup && !sameName(l.name || l.business, dup)) {
        const dn = dup.business || dup.name || "Someone";
        if (!confirm(dn + " already has that phone or email, but the name is different (" + (l.name || l.business || "no name") + ").\n\nOK = add this to " + dn + "\nCancel = keep them as a separate contact")) dup = null;
      }
      if (dup) {
        customerId = dup.id;
        /* Stack everything new on this lead (phones, emails, address, business, notes, photos) on their profile. */
        const a0 = addrOf(l);
        const stack = stackPatch(dup, { phones, emails, addresses: [a0], business: l.business,
          notes: l.message ? String(l.message).trim() : "", photoPaths: pathsOf(l) });
        try { await updateDoc(doc(db, "customers", customerId), { ...stack, updatedAt: serverTimestamp() }); Object.assign(dup, stack); }
        catch (e) { console.error("Could not stack the lead onto the contact", e); }
        const dt = CONTACT_TYPES[String(l.type || "").toLowerCase()];
        if (dt && dup.type !== dt) {
          try { await updateDoc(doc(db, "customers", customerId), { type: dt, updatedAt: serverTimestamp() }); }
          catch (e) { console.error("Could not set the contact's category", e); }
        }
        /* The newest text choice wins, so a "No" here overrides an older "Yes" on file.
           If the database refuses it, the link still goes through. */
        if (textOk(l) !== null) {
          try { await updateDoc(doc(db, "customers", customerId), { smsConsent: textOk(l), updatedAt: serverTimestamp() }); }
          catch (e) { console.error("Could not update the customer's text choice", e); }
        }
        /* Existing customer sent by a partner: add who referred them to their notes. */
        if (refOf(l) && !/^Referred by /m.test(String(dup.notes || ""))) {
          const line = "Referred by " + refOf(l).from + " (code " + refOf(l).code + ")";
          try { await updateDoc(doc(db, "customers", customerId), { notes: line + (dup.notes ? "\n\n" + dup.notes : ""), updatedAt: serverTimestamp() }); }
          catch (e) { console.error("Could not add the referral to the customer's notes", e); }
        }
      } else {
        say("Creating customer…");
        const a = addrOf(l);
        const addresses = (a.street || a.city || a.zip)
          ? [{ street: a.street || "", city: a.city || "", state: a.state || "CA", zip: a.zip || "" }] : [];
        const t = String(l.type || l.property_type || "residential").toLowerCase();
        const notes = [
          refOf(l) ? "Referred by " + refOf(l).from + " (code " + refOf(l).code + ")" : "",
          l.message ? String(l.message).trim() : "",
          servicesOf(l) ? "Asked about: " + servicesOf(l) : "",
          "From website lead" + (when(l) ? ", " + when(l) : "") + "."
        ].filter(Boolean).join("\n\n");
        const phone = phones[0] || "", email = emails[0] || "";
        customerId = randomId();
        const cust = {
          type: CONTACT_TYPES[t] || (t === "commercial" ? "commercial" : "residential"), business: String(l.business || "").trim(),
          name: String(l.name || "").trim(), phone, email, notes, addresses,
          phones, emails, phoneKeys, emailKeys, phoneKey: phoneKey(phone), emailKey: emailKey(email),
          /* Carried over so the photos survive after the lead is erased. */
          photoUrls: photosOf(l), photoPaths: pathsOf(l),
          source: "lead", leadId: id, createdAt: serverTimestamp(), updatedAt: serverTimestamp()
        };
        /* The lead's text choice. If the database refuses that field, the customer is saved
           without it and the answer goes in their notes instead, so Convert never breaks. */
        if (textOk(l) !== null) cust.smsConsent = textOk(l);
        try { await setDoc(doc(db, "customers", customerId), cust); }
        catch (e) {
          if (!("smsConsent" in cust) || e.code !== "permission-denied") throw e;
          delete cust.smsConsent;
          if (!/^OK to text: /m.test(cust.notes)) cust.notes += "\n\nOK to text: " + (textOk(l) ? "yes" : "no");
          await setDoc(doc(db, "customers", customerId), cust);
        }
      }
      await updateDoc(doc(db, "leads", id), { converted: true, convertedAt: serverTimestamp(), customerId, updatedAt: serverTimestamp() });
      patchLocal({ converted: true, convertedAt: new Date().toISOString(), customerId });
      if (auto) {
        let nx = ""; try { nx = sessionStorage.getItem("kc_autoNext") || ""; sessionStorage.removeItem("kc_autoNext"); } catch (e) {}
        location.href = nx || "./customers.html#" + encodeURIComponent(customerId); return;
      }
      showLead(id);
    } catch (e) { console.error(e); say("Could not convert: " + esc(e.message), true); convertBtn.disabled = false; auto = false; }
  });
  /* Saved as business partner / property manager / realtor / other: convert right away. */
  let ac = null; try { ac = sessionStorage.getItem("kc_autoConvert"); } catch (e) {}
  if (ac === id) { try { sessionStorage.removeItem("kc_autoConvert"); } catch (e) {} if (convertBtn) { auto = true; convertBtn.click(); } }

  view.querySelectorAll("[data-status]").forEach(b => b.addEventListener("click", async () => {
    const v = b.dataset.status;
    if (v === cur) return;
    view.querySelectorAll("[data-status]").forEach(x => { x.disabled = true; });
    note.classList.remove("err"); note.textContent = "Saving…";
    try {
      await updateDoc(doc(db, "leads", id), { status: v, updatedAt: serverTimestamp() });
      if (all) all = all.map(x => x.id === id ? Object.assign({}, x, { status: v }) : x);
      else l = Object.assign({}, l, { status: v });
      showLead(id);
    } catch (e) {
      console.error(e);
      note.classList.add("err"); note.textContent = "Could not save: " + e.message;
      view.querySelectorAll("[data-status]").forEach(x => { x.disabled = false; });
    }
  }));

  /* Edit the contact in place: name, address, and as many phones and emails as needed.
     The first phone / email stays in phone / email (what search, Call and Convert use);
     all of them are kept in phones / emails. */
  const editContact = document.getElementById("editContact");
  const ceRow = (kind, v) => '<div class="crow"><input data-ce="' + kind + '" value="' + esc(v) + '" ' +
    (kind === "phone" ? 'type="tel" inputmode="tel" placeholder="Phone"' : 'type="email" inputmode="email" placeholder="Email"') +
    ' autocomplete="off"><button type="button" class="x" data-cedel aria-label="Remove">&times;</button></div>';
  const ceFill = () => {
    const p = phonesOf(l), e = emailsOf(l);
    document.getElementById("cePhones").innerHTML = (p.length ? p.map(fmtPhone) : [""]).map(v => ceRow("phone", v)).join("");
    document.getElementById("ceEmails").innerHTML = (e.length ? e : [""]).map(v => ceRow("email", v)).join("");
  };
  const ceShow = on => {
    document.getElementById("contactView").hidden = on;
    document.getElementById("contactEdit").hidden = !on;
    editContact.hidden = on;
  };
  if (editContact) {
    editContact.addEventListener("click", () => { ceFill(); ceShow(true); document.getElementById("ceName").focus(); });
    document.getElementById("promoNoTel")?.addEventListener("click", () => {
      editContact.click(); const ph = document.querySelector('#cePhones [data-ce="phone"]');
      document.getElementById("contactEdit").scrollIntoView({ block: "center" }); if (ph) ph.focus(); });
    document.getElementById("cancelContact").addEventListener("click", () => ceShow(false));
    document.getElementById("contactEdit").addEventListener("click", e => {
      const add = e.target.closest("[data-ceadd]");
      if (add) {
        const k = add.dataset.ceadd, box = document.getElementById(k === "phone" ? "cePhones" : "ceEmails");
        box.insertAdjacentHTML("beforeend", ceRow(k, ""));
        box.lastElementChild.querySelector("input").focus();
        return;
      }
      const del = e.target.closest("[data-cedel]");
      if (del) del.closest(".crow").remove();
    });
    /* Save & text a promotion: same save as Save, then Promotions with this lead as Send to. */
    const saveContactNow = async (promo) => {
      const btn = document.getElementById(promo ? "savePromo" : "saveContact"), msg = document.getElementById("contactMsg");
      const vals = k => listOf("", [...document.querySelectorAll('#contactEdit [data-ce="' + k + '"]')].map(x => x.value));
      const v = id => document.getElementById(id).value.trim();
      const phones = listOf("", vals("phone").map(fmtPhone)), emails = vals("email");
      const bad = emails.find(x => !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));
      if (bad) { msg.classList.add("err"); msg.textContent = "\u201c" + bad + "\u201d doesn\u2019t look like an email."; return; }
      const promoTo = String(phones[0] || "").replace(/\D/g, "").slice(-10);
      if (promo && promoTo.length !== 10) { msg.classList.add("err"); msg.textContent = "Add a 10-digit phone number to text a promotion."; return; }
      const street = v("ceAddr"), city = v("ceCity"), state = v("ceState").toUpperCase(), zip = v("ceZip");
      const p = { name: v("ceName"), type: v("ceType"), phone: phones[0] || "", email: emails[0] || "", phones, emails,
        street, city, zip };
      /* Leads that already keep an addresses list: change the first address there too. */
      if (Array.isArray(l.addresses) && l.addresses.length)
        p.addresses = [{ ...l.addresses[0], street, city, state: state || "CA", zip }].concat(l.addresses.slice(1));
      btn.disabled = true; msg.classList.remove("err"); msg.textContent = "Saving\u2026";
      try {
        await updateDoc(doc(db, "leads", id), { ...p, updatedAt: serverTimestamp() });
        patchLocal(p);
        /* New name, address, phone or email go onto this lead's quotes and invoices too. */
        await syncProfileToQuotes(db, "leads", id, { ...l, ...p });
        /* Already a contact: a new Type here moves them to that column on the Contacts page too. */
        if (l.converted && l.customerId && LEAD_TYPES.some(t => t.toLowerCase() === p.type)) {
          const ct = CONTACT_TYPES[p.type] || (p.type === "commercial" ? "commercial" : "residential");
          try { await updateDoc(doc(db, "customers", l.customerId), { type: ct, updatedAt: serverTimestamp() }); }
          catch (e) { console.error("Could not update the contact's type", e); }
        }
        if (promo) { location.href = "./promotions.html?to=" + encodeURIComponent(promoTo) + "&name=" + encodeURIComponent(p.name); return; }
        if (CONTACT_TYPES[p.type] && !l.converted && !l.trashed) autoConvert(id);   /* straight to Contacts */
        showLead(id);
      } catch (e) { console.error(e); msg.classList.add("err"); msg.textContent = "Could not save: " + e.message; btn.disabled = false; }
    };
    document.getElementById("saveContact").addEventListener("click", () => saveContactNow(false));
    document.getElementById("savePromo").addEventListener("click", () => saveContactNow(true));
  }

  /* Edit the message in place. Saving overwrites the original message text. */
  const editMsg = document.getElementById("editMsg");
  if (editMsg) editMsg.addEventListener("click", () => {
    document.getElementById("msgView").hidden = true;
    editMsg.hidden = true;
    document.getElementById("msgEdit").hidden = false;
    document.getElementById("msgText").focus();
  });
  const cancelMsg = document.getElementById("cancelMsg");
  if (cancelMsg) cancelMsg.addEventListener("click", () => {
    document.getElementById("msgEdit").hidden = true;
    document.getElementById("msgView").hidden = false;
    document.getElementById("editMsg").hidden = false;
  });
  const saveMsg = document.getElementById("saveMsg");
  if (saveMsg) saveMsg.addEventListener("click", async () => {
    /* Put the hidden OK-to-text lines back on top so Texting / Specials don't lose them. */
    const typed = document.getElementById("msgText").value.trim(), head = msgParts(l).head;
    const text = head.length ? head.join("\n") + (typed ? "\n\n" + typed : "") : typed;
    const msg = document.getElementById("msgMsg");
    saveMsg.disabled = true; msg.classList.remove("err"); msg.textContent = "Saving\u2026";
    try {
      await updateDoc(doc(db, "leads", id), { message: text, updatedAt: serverTimestamp() });
      patchLocal({ message: text });
      showLead(id);
    } catch (e) { console.error(e); msg.classList.add("err"); msg.textContent = "Could not save: " + e.message; saveMsg.disabled = false; }
  });

  /* Call / Text / Email on a New lead: it becomes Contacted on its own. */
  view.querySelectorAll('a[href^="tel:"], a[href^="sms:"], a[href^="./texts.html"], a[href^="./email.html"], a[href^="mailto:"]').forEach(a => a.addEventListener("click", () => {
    const cur2 = (all && all.find(x => x.id === id)) || l;
    if (statusOf(cur2).v !== "new") return;
    updateDoc(doc(db, "leads", id), { status: "contacted", updatedAt: serverTimestamp() })
      .then(() => { patchLocal({ status: "contacted" }); const s = document.getElementById("stLabel"); if (s) s.textContent = "Contacted"; })
      .catch(e => console.error("Contacted", e));
  }));

  const startEst = document.getElementById("startEst");
  if (startEst) startEst.addEventListener("click", () => startEstimate({ ...l, id }, startEst));

  /* Quote canceled: drop the lead out of Quoted, back to a regular lead. */
  const cancelQuoteBtn = document.getElementById("cancelQuoteBtn");
  if (cancelQuoteBtn) cancelQuoteBtn.addEventListener("click", async () => {
    cancelQuoteBtn.disabled = true;
    try {
      await updateDoc(doc(db, "leads", id), { status: "contacted", updatedAt: serverTimestamp() });
      patchLocal({ status: "contacted" });
      showLead(id);
    } catch (e) { console.error(e); cancelQuoteBtn.disabled = false; alert("Could not update: " + e.message); }
  });

  /* Save notes onto the lead. They ride along into Convert and (step two) New quote. */
  const saveNotesBtn = document.getElementById("saveNotes");
  if (saveNotesBtn) saveNotesBtn.addEventListener("click", async () => {
    const ta = document.getElementById("staffNotes");
    const msg = document.getElementById("notesMsg");
    const text = ta ? ta.value.trim() : "";
    saveNotesBtn.disabled = true;
    msg.classList.remove("err"); msg.textContent = "Saving\u2026";
    try {
      await updateDoc(doc(db, "leads", id), { staffNotes: text, updatedAt: serverTimestamp() });
      patchLocal({ staffNotes: text });
      msg.textContent = "Saved.";
    } catch (e) { console.error(e); msg.classList.add("err"); msg.textContent = "Could not save: " + e.message; }
    saveNotesBtn.disabled = false;
  });

  /* Referral status: read the partner's referral, then each change saves straight to it. */
  const refSt = document.getElementById("refSt");
  if (refSt && l.referralId) {
    const rDoc = doc(db, "referrals", l.referralId), rMsg = document.getElementById("refStMsg");
    getDoc(rDoc).then(s => {
      if (!s.exists()) { rMsg.textContent = "The partner's referral isn\u2019t on file anymore."; return; }
      refSt.value = s.data().status || "submitted"; refSt.disabled = false;
    }).catch(e => { console.error(e); rMsg.textContent = "Could not load: " + e.message; });
    refSt.addEventListener("change", async () => {
      refSt.disabled = true; rMsg.classList.remove("err"); rMsg.textContent = "Saving\u2026";
      try { await updateDoc(rDoc, { status: refSt.value, updatedAt: serverTimestamp() }); rMsg.textContent = "Saved. The partner sees it now."; }
      catch (e) { console.error(e); rMsg.classList.add("err"); rMsg.textContent = "Could not save: " + e.message; }
      refSt.disabled = false;
    });
  }
}

/* ---- Photo lightbox: tap a photo to open over the page, tap backdrop or X to close ---- */
(function () {
  const lb = document.createElement("div");
  lb.className = "lbox";
  lb.innerHTML = '<div class="lbox__fig"><button type="button" class="lbox__x" aria-label="Close">\u00d7</button><img alt=""></div>';
  document.body.appendChild(lb);
  const img = lb.querySelector("img");
  const close = () => { lb.classList.remove("on"); img.src = ""; };
  lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".lbox__x")) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("on")) close(); });
  document.addEventListener("click", e => {
    const a = e.target.closest(".pshot");
    if (!a) return;
    e.preventDefault();
    img.src = a.dataset.full;
    lb.classList.add("on");
  });
})();

/* #<id> = one lead, nothing = list */
const route = () => {
  const h = decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0, 0);
  /* Header button: Trash on the list; Leads everywhere else. */
  const sw = document.getElementById("navSwap");
  if (sw) {
    sw.innerHTML = h
      ? '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>'
      : '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>';
    sw.setAttribute("aria-label", h ? "Leads" : "Trash");
    sw.setAttribute("href", h ? "#" : "#trash");
  }
  document.getElementById("createLead").hidden = h === "new";   /* no New lead button on the New lead form itself */
  titleEl.hidden = h === "new";   /* New lead / Contact: the form's own heading is the title */
  if (h === "trash") showTrash(); else if (h === "old") showList(true); else if (h === "new") showNewLead(); else if (h) showLead(h); else showList();
};

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=" + encodeURIComponent("leads.html" + location.hash)); return; }
  document.getElementById("authwait")?.remove();
  if (!started) {
    started = true; window.addEventListener("hashchange", route); route();
    const fromHub = (new URLSearchParams(location.search).get("create") || "").trim().slice(0, 80);
    if (fromHub) { history.replaceState(null, "", location.pathname + location.hash); createLead(fromHub, document.getElementById("createLead")); }
  }
});
