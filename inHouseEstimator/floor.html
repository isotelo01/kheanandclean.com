<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">

<title>Floor</title>
<style>
/* Floor page (Player Tracker proof of concept): the floor runs every table from here.
   - Floor plan: the building's outline (drawn with the room measurer, measure.html?building=1) with every table
     and its chairs on it. Drag a table to move it; tap it for a toolbar: open/close, rotate, size, Dealer Control.
   - Calls: drinks/service/chips/floor calls sent from Dealer Control. Done clears them.
   - Wait list (left column): "+ Add a game" builds a list per game (mostly poker); names go under each game.
     Players who joined the list from their phone show up too. Table games don't carry lists.
   Firestore: playerTracker/tables { n: { open } }, playerTracker/calls { id: { t, kind, at } },
   playerTracker/waitlist { id: { name, game (= waitgames id), at } }, playerTracker/waitgames { id: { name, at } },
   playerTracker/floorplan { n: { x, y } }, plus playerTracker/poc (same as the other pages). */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:26px;color:var(--gold)}
h2{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin:24px 0 10px}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.ok{background:var(--ok)}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px}
.tsvg{display:block;width:100%;height:auto;cursor:pointer;margin-bottom:8px}
.dc{color:var(--gold);font-weight:700;font-size:14px;text-decoration:none}
.tcard.open{border-color:var(--ok)}
.tcard .nm{font-weight:700;font-size:17px}
.tcard .nm span{color:var(--gold)}
.tcard .st{font-size:14px;color:rgba(255,255,255,.75);margin:4px 0 10px}
.sw{border-radius:999px;padding:6px 14px;font:700 14px system-ui,sans-serif;cursor:pointer;border:1px solid var(--bad);background:none;color:var(--bad)}
.sw.on{border-color:var(--ok);background:var(--ok);color:#000}
.box{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:4px 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.empty{color:rgba(255,255,255,.6);font-size:14px;padding:12px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.call{border-left:4px solid var(--gold);padding-left:10px}
.call.old .nm b{animation:pulse 1.2s infinite;color:var(--bad)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;font:inherit}
#wName{flex:1;min-width:160px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.12);margin-left:6px}
/* Wait list column on the left, floor plan on the right (stacked on a phone). */
.wrap{max-width:1400px}
/* ?embed: just the floor plan (shown inside the Waitlist page's Floor plan box). */
html.embed body{padding:0;background:transparent}
html.embed .wrap{max-width:none}
html.embed .top,html.embed #tgBox,html.embed main>h2,html.embed main>p.hint{display:none}
.cols{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.gbox{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin-top:12px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gh b{flex:1;color:var(--gold);font-size:17px}
.gh .cnt{font-size:13px;color:rgba(255,255,255,.7)}
.gh button{background:none;border:0;color:rgba(255,255,255,.55);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.gbox .add input{flex:1;min-width:0;padding:8px 10px}
[hidden]{display:none!important}
.hint{color:rgba(255,255,255,.6);font-size:13px;margin:-4px 0 8px}
#plan{width:100%;height:auto;display:block;background:#101a2e;border:1px solid rgba(255,255,255,.12);border-radius:12px;touch-action:none}
.ptbl{cursor:pointer}
body.moving .ptbl{cursor:grab}
body.moving #plan{outline:2px dashed var(--gold);outline-offset:-2px}
.ptbl.sel > rect:first-child{stroke:#E3B64A;stroke-width:2;stroke-dasharray:6 5}
/* Table strip: tap a table and its details show as one line across the top of the floor plan (wraps if needed). */
/* Table panel: title and Open/Closed on top, close x in the top-right corner, then the buttons, then dealer and seats. */
#tbar{position:relative;display:grid;gap:10px;background:#0b1220;border:1px solid var(--gold);border-radius:12px;padding:12px 48px 12px 14px;margin-bottom:8px}
#tpLive{display:grid;gap:10px}
#tpEdit:empty{display:none}
#tbar .sec,#tpForm{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:0}
#tbar .tph{display:flex;align-items:center;gap:10px}
#tbar .tph h3{margin:0;color:var(--gold);font-size:18px}
#tbar .tph .x{position:absolute;top:6px;right:8px;background:none;border:0;color:rgba(255,255,255,.7);font-size:26px;line-height:1;cursor:pointer;padding:2px 6px}
#tbar .tph .x:hover{color:#fff}
#tbar .info{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:14px}
#tbar .lbl{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em;margin:0}
#tbar .btns{display:flex;flex-wrap:wrap;gap:6px}
#tbar .btn{padding:6px 11px;font-size:13px}
#tbar .sec a:not(.btn){color:#fff}
#tbar .row{display:inline-flex;padding:0;border:0;gap:4px}
#tbar .row .nm span{display:inline;margin-left:4px;font-size:12px}
#tbar .empty{padding:0;font-size:13px}
#tbar input,#tbar select{padding:6px 8px;margin:0}
#eNum{width:70px}#eGame{width:180px}
.ptbl.dragging{cursor:grabbing;opacity:.85}
.wlbl{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
#wPhone.on{background:#38bdf8;border-color:#38bdf8;color:#000}
.bubs{display:flex;flex-wrap:wrap;gap:6px}
.bub{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:4px 11px;font:700 13px system-ui,sans-serif;cursor:pointer}
.bub.on{background:var(--ok);border-color:var(--ok);color:#000}
</style>

<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./player-tracker-hub.html">&lsaquo; Back</a><h1>Floor</h1>
    <button class="btn ghost" id="addTG" style="margin-left:auto">Add table game to wait list</button>

  <div class="cols">

        <a href="./measure.html?building=1" class="btn ghost sm" style="margin-left:6px">Edit building shape</a>
        <button class="btn ghost sm" id="moveMode" style="margin-left:4px">Edit table position on floor</button>

        <button class="btn sm" id="addPg" style="margin-left:4px">+ Add a poker game</button></p>
      <div class="add" id="addTblBox" hidden style="background:#0b1220;border:1px solid var(--gold);border-radius:12px;padding:10px">
        <input id="tGame" list="tblGames" placeholder="Game, e.g. Blackjack" autocomplete="off" style="flex:1;min-width:160px">
        <datalist id="tblGames"><option>Blackjack</option><option>Baccarat</option><option>Poker</option><option>Three Card Poker</option><option>Ultimate Texas Hold'em</option><option>Pai Gow</option></datalist>
        <select id="tSeats" aria-label="Seats"><option>5</option><option>6</option><option selected>7</option><option>8</option><option>9</option><option>10</option></select>

        <button class="btn" id="tCreate">Add table</button>
      </div>
      <!-- Poker games: star your favorites; tap Start list to open a wait list for that game; write in your own. -->
      <div id="pgBox" hidden></div>   <!-- the Games menu (pg-menu.js) -->
      <div id="tbar" hidden><div id="tpLive"></div><div id="tpEdit"></div></div>
      <svg id="plan" viewBox="0 0 900 560"></svg>
    </main>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc as fsDoc, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { ROSTER, DEALERS, CASINO, casinoDoc, withCasino, openGameNames, liveLists, expired } from "./pt-people.js";
import { pg, setPg, pgName, pgAll, stakesFor, STAKES_NL, mountPgMenu } from "./pg-menu.js";   // the Games menu (poker and table games)   // 200 test players, 10 test dealers
const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents
if (new URLSearchParams(location.search).has("embed")) document.documentElement.classList.add("embed");   // inside the Waitlist page
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), ROSTREF = doc(db, "playerTracker", "roster"), PROFREF = doc(db, "playerTracker", "profiles");
const TBLREF = doc(db, "playerTracker", "tables"), CALLREF = doc(db, "playerTracker", "calls"), WAITREF = doc(db, "playerTracker", "waitlist");
const GAMESREF = doc(db, "playerTracker", "waitgames");   // wait list games the floor built: { id: { name, at } }
const LISTREF = doc(db, "playerTracker", "tablelist");    // added tables and edits: { n: { game, seats: [..], shape, deleted } }
const PLANREF = doc(db, "playerTracker", "floorplan");    // where each table sits on the floor plan: { n: { x, y, rot, scale } }
const PGREF = doc(db, "playerTracker", "pokergames");    // poker games list: { fav: { id: true }, custom: { id: { name, at } } }
const makingList = new Set();   // lists being made for open tables (so a redraw doesn't make two)
/* What a table is called: a poker table with a game picked shows stakes + game, e.g. "1/2 No-Limit Hold'em". */
const tblLabel = tb => tb.variant ? (tb.stakes ? tb.stakes + " " : "") + tb.variant : tb.game;
const BLDREF = doc(db, "playerTracker", "building");      // building outline drawn with the room measurer's sketch tool (feet)
const FT_PX = 16;   // floor plan units per foot (a table with its chairs is about 12 ft across)

/* Same tables, test roster and dealers as the other Player Tracker pages. */
const BASE_TABLES = CASINO !== "edh" ? {} : {   // starter tables are EDH's; another casino starts blank
  1: { game: "Blackjack", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" },
  2: { game: "Baccarat", seats: [1, 2, 3, 5, 6, 7, 8], shape: "half" },   // no seat 4
  3: { game: "Poker", seats: [1, 2, 3, 4, 5, 6, 7, 8, 9], shape: "oval" },
  4: { game: "Three Card Poker", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" },
  5: { game: "Ultimate Texas Hold'em", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" }
};
let TABLES = { ...BASE_TABLES }, list = {}, panelFor = 0;   // tables 1-5 + added/edited/deleted ones (tablelist); table whose pop-up is open
function buildTables() {   // tables 1-5, changed by the floor's edits, plus added tables, minus deleted ones
  const T = { ...BASE_TABLES };
  for (const [n, t] of Object.entries(list)) {
    if (!t) continue;
    if (t.deleted) { delete T[n]; continue; }
    const b = BASE_TABLES[n] || {}, seats = Array.isArray(t.seats) ? t.seats : b.seats;
    if ((t.game || b.game) && seats) T[n] = { game: t.game || b.game, seats, shape: t.shape || b.shape || "half", variant: t.variant || "", stakes: t.stakes || "" };
  }
  TABLES = T;
}
/* One table on the floor plan, drawn from the top in a 200 x 182 box: green felt when open, grey when
   closed, a chair at each seat facing the table (gold = seated, blue = on break, red = break over 30 min,
   dark = empty), then its name, dealer and seats under it. Drag to move it; tap to open/close it. */
const tblXf = p => `translate(${p.x} ${p.y}) translate(100 91) rotate(${p.rot || 0}) scale(${p.scale || 1}) translate(-100 -91)`;
const PLAN_DEFAULT = new Proxy({ 1: { x: 40, y: 30 }, 2: { x: 350, y: 30 }, 3: { x: 660, y: 30 }, 4: { x: 40, y: 300 }, 5: { x: 350, y: 300 } },
  { get: (o, n) => o[n] || { x: 40 + ((+n - 1) % 3) * 310, y: 30 + Math.floor((+n - 1) / 3) * 270 } });   // new tables: next spot in the grid
function planTable(n, tb, open, bySeat, dealer, nSeated, nBreak, pos) {
  const felt = open ? "#0f6b3a" : "#3a3f4b", rail = open ? "#5a3518" : "#2a2e37";
  const chair = (x, y, cx, cy, s) => {   // small chair at (x,y), turned to face the table centre (cx,cy)
    const p = bySeat[s];
    const f = !p ? "#0b1220" : p.breakAt ? (Date.now() - p.breakAt > 30 * 60000 ? "#ef4444" : "#3b82f6") : "#E3B64A";
    const rot = Math.atan2(y - cy, x - cx) * 180 / Math.PI - 90;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})">`
      + `<rect x="-8" y="-6" width="16" height="12" rx="3" fill="${f}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>`
      + `<rect x="-9" y="6" width="18" height="4" rx="2" fill="${f}" stroke="rgba(255,255,255,.55)" stroke-width="1"/></g>`;
  };
  let s = `<rect width="200" height="182" fill="transparent"/>`, label;
  if (tb.shape === "oval") {
    s += `<ellipse cx="100" cy="62" rx="80" ry="42" fill="${rail}"/><ellipse data-felt="1" cx="100" cy="62" rx="71" ry="34" fill="${felt}"/>`;
    tb.seats.forEach((st, k) => { const a = (-90 + 36 * (k + 1)) * Math.PI / 180; s += chair(100 + Math.cos(a) * 94, 62 + Math.sin(a) * 52, 100, 62, st); });
    label = 68;
  } else {
    s += `<rect x="18" y="10" width="164" height="7" rx="2" fill="${rail}"/><path d="M18 16 A82 82 0 0 0 182 16 Z" fill="${rail}"/><path data-felt="1" d="M27 16 A73 73 0 0 0 173 16 Z" fill="${felt}"/>`;
    tb.seats.forEach((st, k) => { const a = Math.PI * ((k + 1) / (tb.seats.length + 1)); s += chair(100 + Math.cos(a) * 94, 16 + Math.sin(a) * 94, 100, 16, st); });
    label = 52;
  }
  s += `<text x="100" y="${label}" fill="${open ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.55)"}" font-size="26" font-weight="700" text-anchor="middle">${n}</text>`;
  if (!open) s += `<text x="100" y="${label + 18}" fill="#f87171" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle" pointer-events="none">CLOSED</text>`;
  s += `<text x="100" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">${esc(tblLabel(tb))}</text>`
     + `<text x="100" y="162" fill="rgba(255,255,255,.7)" font-size="11" text-anchor="middle">${dealer ? esc(nameOf(dealer)) : "No dealer"} &#183; ${nSeated}/${tb.seats.length} seated${nBreak ? " &#183; " + nBreak + " on break" : ""}</text>`
     + `<a href="./dealer-table.html?t=${n}"><text x="100" y="178" fill="#E3B64A" font-size="11" font-weight="700" text-anchor="middle">Dealer Control &#8250;</text></a>`;
  return `<g class="ptbl${selT === n ? " sel" : ""}" data-tbl="${n}" transform="${tblXf(pos)}">${s}</g>`;
}
const CALLS = { drinks: "Drinks", service: "Service", chips: "Chips", floor: "Floor" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = t => { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 1 ? "just now" : m < 60 ? m + "m" : Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const fail = () => { $("warn").style.display = "block"; };
let state = {}, roster = {}, profiles = {}, tables = {}, calls = {}, wait = {}, games = {}, plan = {};
let planDrag = null;   // a table being dragged around the floor plan
let moveMode = false;  // tables only move (drag, rotate, size) after "Edit table position on floor"
let building = null, selT = 0;   // building outline (from measure.html?building=1); selected table
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || DEALERS[c] || c;
const isPlayer = c => !!(ROSTER[c] || roster[c]);

function draw() {
  /* Floor plan: every table where the floor put it. Skipped mid-drag so the table doesn't jump. */
  /* The building (drawn with the room measurer's sketch tool, in feet) goes under the tables. The plan grows to fit it. */
  let bld = "", vbW = 900, vbH = 560;
  if (building && Array.isArray(building.pts) && building.pts.length >= 3) {
    const xs = building.pts.map(q => q[0]), ys = building.pts.map(q => q[1]), mx = Math.min(...xs), my = Math.min(...ys);
    const P = q => ((q[0] - mx) * FT_PX + 20).toFixed(1) + "," + ((q[1] - my) * FT_PX + 20).toFixed(1);
    bld = `<polygon points="${building.pts.map(P).join(" ")}" fill="rgba(255,255,255,.04)" stroke="rgba(227,182,74,.7)" stroke-width="4" stroke-linejoin="round"/>`
        + (building.cuts || []).filter(c => c && Array.isArray(c.pts) && c.pts.length >= 3)
            .map(c => `<polygon points="${c.pts.map(P).join(" ")}" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.35)"/>`).join("")
        + (building.walls || []).filter(w => w && w.a && w.b)   // inside walls drawn in the building editor
            .map(w => { const [x1, y1] = P(w.a).split(","), [x2, y2] = P(w.b).split(",");
              return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(227,182,74,.7)" stroke-width="4" stroke-linecap="round"/>`; }).join("");
    vbW = Math.max(vbW, (Math.max(...xs) - mx) * FT_PX + 40); vbH = Math.max(vbH, (Math.max(...ys) - my) * FT_PX + 40);
  }
  for (const n of Object.keys(TABLES)) { const q = plan[n] || PLAN_DEFAULT[n]; vbW = Math.max(vbW, q.x + 230); vbH = Math.max(vbH, q.y + 210); }
  if (!planDrag) $("plan").setAttribute("viewBox", `0 0 ${Math.round(vbW)} ${Math.round(vbH)}`);
  if (!planDrag) $("plan").innerHTML = bld + Object.entries(TABLES).map(([n, tb]) => {
    n = +n;
    const on = Object.entries(state).filter(([c, p]) => p && p.status === "seated" && (p.table || 1) === n);
    const dealer = on.find(([c]) => DEALERS[c]);
    const players = on.filter(([c]) => isPlayer(c));
    const brk = players.filter(([, p]) => p.breakAt).length;
    const open = !!(tables[n] && tables[n].open);
    const bySeat = {}; players.forEach(([, p]) => { bySeat[p.seat] = p; });
    return planTable(n, tb, open, bySeat, dealer && dealer[0], players.length, brk, plan[n] || PLAN_DEFAULT[n]);
  }).join("");

  /* Table pop-up (tap a table): open/closed, dealer, seated players (tap for their profile), rotate/size,
     Dealer Control, and Edit (number, game, delete). The live part redraws; the edit form is built once per table. */
  if (selT && TABLES[selT]) {
    const n = selT, tb = TABLES[n], q = plan[n] || PLAN_DEFAULT[n], open = !!(tables[n] && tables[n].open);
    const on = Object.entries(state).filter(([c, p]) => p && p.status === "seated" && (p.table || 1) === n);
    const dealer = on.find(([c]) => DEALERS[c]), players = on.filter(([c]) => isPlayer(c)).sort((a, b) => a[1].seat - b[1].seat);
    $("tbar").hidden = false;
    /* Poker table: pick which poker game it's running (favorites, plus whatever it's on now). It stays until changed. */
    const favIds = pgAll().filter(id => pg.fav[id]), cur = tb.variant || "";
    const curId = pgAll().find(id => pgName(id) === cur);   // then the stakes, under the game: that game's bubbles
    const pick = ovalGame(tb.game) ? `<div style="display:grid;gap:4px"><div class="lbl">Pick a game</div><select data-tv="${n}">
        <option value="">${favIds.length ? "Pick a game" : "Star games in + Add a poker game"}</option>
        ${[...new Set([...favIds.map(pgName), ...(cur ? [cur] : [])])].map(g => `<option${g === cur ? " selected" : ""}>${esc(g)}</option>`).join("")}</select>
        ${cur ? `<div class="lbl">Pick the stakes</div><div class="bubs">${[...new Set([...(curId ? stakesFor(curId) : STAKES_NL), ...(tb.stakes ? [tb.stakes] : [])])]
          .map(st => `<button class="bub${st === tb.stakes ? " on" : ""}" data-tstk="${n}" data-st="${st}">${st}</button>`).join("")}</div>` : ""}</div>` : "";
    $("tpLive").innerHTML = `<div class="tph"><h3>Table ${n} &middot; ${esc(tblLabel(tb))}</h3>
        <span class="tag" style="${open ? "background:var(--ok);color:#000" : "background:#5a1d1d"}">${open ? "Open" : "Closed"}</span>
        <button class="x" data-ta="x" aria-label="Close" title="Close">&times;</button></div>
      <div class="sec btns"><button class="btn ${open ? "" : "ok"}" data-ta="open">${open ? "Close table" : "Open table"}</button>
        <a class="btn ghost" href="./dealer-table.html?t=${n}">Dealer Control &rsaquo;</a>
        <button class="btn ghost" data-ta="edit">&#9998; Edit table</button></div>
      <div class="info"><span><span class="lbl">Dealer</span> ${dealer ? `<a href="./player-tracker.html?profile=${encodeURIComponent(dealer[0])}">${esc(nameOf(dealer[0]))}</a>` : `<span class="hint">None</span>`}</span>
        <span><span class="lbl">Seated</span> ${players.length}/${tb.seats.length}</span></div>
      ${players.length ? `<div class="sec">${players.map(([c, p]) => `<div class="row"><div class="nm"><a href="./player-tracker.html?profile=${encodeURIComponent(c)}"><b>${esc(nameOf(c))}</b></a>
          <span>Seat ${p.seat} &middot; ${p.breakAt ? "on break " + ago(p.breakAt) : "seated " + ago(p.since || Date.now())}</span></div></div>`).join("")}</div>` : ""}
      ${pick}
      ${moveMode ? "" : "<!--"}<div class="sec"><div class="lbl">On the floor plan &middot; ${Math.round(((q.rot || 0) % 360 + 360) % 360)}&deg; &middot; ${Math.round((q.scale || 1) * 100)}%</div>
        <div class="btns"><button class="btn ghost" data-ta="rl">&#10226; Rotate</button><button class="btn ghost" data-ta="rr">Rotate &#10227;</button>
        <button class="btn ghost" data-ta="sm">&minus; Smaller</button><button class="btn ghost" data-ta="lg">+ Bigger</button><button class="btn ghost" data-ta="reset">Reset</button></div></div>${moveMode ? "" : "-->"}`;
    if (panelFor !== n) {
      panelFor = n;
      $("tpEdit").innerHTML = `<div class="sec" id="tpForm" hidden>
          <div class="lbl">Table number</div><input id="eNum" type="number" inputmode="numeric" min="1" max="99" value="${n}">
          <div class="lbl">Game</div><input id="eGame" list="tblGames" value="${esc(tb.game)}" autocomplete="off">
          <div class="lbl">Seats</div><select id="eSeats">${[5, 6, 7, 8, 9, 10].map(k => `<option${k === tb.seats.length ? " selected" : ""}>${k}</option>`).join("")}</select>
          <div class="btns"><button class="btn" data-ta="save">Save</button>
            <button class="btn ghost" data-ta="del" style="color:var(--bad);border-color:var(--bad)">Delete table</button></div>
          <p class="hint" id="eMsg" style="margin-top:8px"></p></div>`;
    }
  } else { $("tbar").hidden = true; panelFor = 0; }

  /* Wait list entry (left column): one box per game the floor built, with a box to add a name and how many are
     waiting. The lists themselves are on waitlist.html. Table games don't get lists. */
  /* Lists build off open poker tables (see liveLists in pt-people.js): every open table's game gets a list. */
  for (const nm of openGameNames(tables, list)) if (!listFor(nm) && !makingList.has(nm)) {
    makingList.add(nm); const gid = "g" + Date.now() + Math.random().toString(36).slice(2, 5);
    games[gid] = { name: nm, at: Date.now() }; setDoc(GAMESREF, { [gid]: games[gid] }, { merge: true }).catch(fail);
  }
  /* Phoned-in names fall off after an hour. */
  const old = Object.keys(wait).filter(id => expired(wait[id]) && !dropping.has(id));
  if (old.length) { const upd = {}; old.forEach(id => { dropping.add(id); upd[id] = deleteField(); }); setDoc(WAITREF, upd, { merge: true }).catch(fail); }
  pgMenu.draw();
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-done]");
  if (d) { setDoc(CALLREF, { [d.dataset.done]: deleteField() }, { merge: true }).catch(fail); return; }
  const sw = e.target.closest("[data-sw]");
  if (sw) { toggleOpen(+sw.dataset.sw); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) {
    const id = rm.dataset.rm;
    if (rm.dataset.src === "app") { const p = state[id] || {}; setDoc(REF, { [id]: { ...p, status: "out", waitAt: null } }, { merge: true }).catch(fail); }
    else setDoc(WAITREF, { [id]: deleteField() }, { merge: true }).catch(fail);
    return;
  }
  const ta = e.target.closest("[data-ta]");
  if (ta && selT) {
    const n = selT, q = { ...(plan[n] || PLAN_DEFAULT[n]) }, a = ta.dataset.ta;
    if (a === "open") { toggleOpen(n); return; }
    if (a === "x") { selT = 0; draw(); return; }
    if (a === "edit") { $("tpForm").hidden = !$("tpForm").hidden; return; }
    if (a === "save") { saveTableEdit(n); return; }
    if (a === "del") {
      const seated = Object.values(state).filter(p => p && p.status === "seated" && (p.table || 1) === n).length;
      if (!confirm("Delete table " + n + " (" + TABLES[n].game + ")?" + (seated ? " " + seated + " still logged in there." : ""))) return;
      list[n] = BASE_TABLES[n] ? { deleted: true } : null;
      setDoc(LISTREF, { [n]: BASE_TABLES[n] ? { deleted: true } : deleteField() }, { merge: true }).catch(fail);
      setDoc(PLANREF, { [n]: deleteField() }, { merge: true }).catch(fail);
      setDoc(TBLREF, { [n]: deleteField() }, { merge: true }).catch(fail);
      delete plan[n]; delete tables[n]; buildTables(); selT = 0; draw(); return;
    }
    if (a === "rl") q.rot = ((q.rot || 0) - 15) % 360;
    if (a === "rr") q.rot = ((q.rot || 0) + 15) % 360;
    if (a === "sm") q.scale = Math.max(.5, Math.round(((q.scale || 1) - .1) * 10) / 10);
    if (a === "lg") q.scale = Math.min(1.5, Math.round(((q.scale || 1) + .1) * 10) / 10);
    if (a === "reset") { q.rot = 0; q.scale = 1; }
    plan[n] = q; setDoc(PLANREF, { [n]: q }, { merge: true }).catch(fail); draw();
    return;
  }
  const ga = e.target.closest("[data-gadd]");
  if (ga) { addName(ga.dataset.gadd); return; }
  const dg = e.target.closest("[data-delgame]");
  if (dg) {
    const gid = dg.dataset.delgame, inIt = Object.entries(wait).filter(([, v]) => v && v.game === gid);
    if (inIt.length && !confirm("Remove the " + games[gid].name + " list and the " + inIt.length + " name(s) on it?")) return;
    const upd = {}; inIt.forEach(([id]) => { upd[id] = deleteField(); });
    if (inIt.length) setDoc(WAITREF, upd, { merge: true }).catch(fail);
    setDoc(GAMESREF, { [gid]: deleteField() }, { merge: true }).catch(fail);
  }
});
/* Open or close a table. Hours only count at an open table: closing stops the clock for everyone seated there
   (their time so far is kept), opening starts it again (not for anyone on break). */
function toggleOpen(n) {
  const open = !(tables[n] && tables[n].open), now = Date.now(), upd = {};
  tables[n] = { ...(tables[n] || {}), open };
  setDoc(TBLREF, { [n]: { open } }, { merge: true }).catch(fail);
  for (const [c, p] of Object.entries(state)) {
    if (!p || p.status !== "seated" || (p.table || 1) !== n || !isPlayer(c)) continue;
    if (!open && p.since) upd[c] = { ...p, totalMs: (p.totalMs || 0) + now - p.since, sessionMs: (p.sessionMs || 0) + now - p.since, since: null };
    if (open && !p.since && !p.breakAt) upd[c] = { ...p, since: now };
  }
  if (Object.keys(upd).length) { Object.assign(state, upd); setDoc(REF, upd, { merge: true }).catch(fail); }
  draw();
}
/* Add a name to a game's list. */
function addName(gid) {
  const el = document.querySelector(`[data-gin="${CSS.escape(gid)}"]`), name = el && el.value.trim();
  if (!name) { if (el) el.focus(); return; }
  const id = "w" + Date.now() + Math.random().toString(36).slice(2, 6);
  wait[id] = { name, game: gid, at: Date.now() };   // show it right away
  el.value = "";
  setDoc(WAITREF, { [id]: wait[id] }, { merge: true }).catch(fail);
  draw();
}
document.addEventListener("keydown", e => { const el = e.target.closest && e.target.closest("[data-gin]"); if (el && e.key === "Enter") addName(el.dataset.gin); });
const dropping = new Set();   // phoned-in names being dropped
/* Add table game to wait list (top right): a list for a table game, e.g. Blackjack. Stays until removed. */
$("addTG").onclick = () => { $("tgBox").hidden = !$("tgBox").hidden; if (!$("tgBox").hidden) $("tgName").focus(); };
const addTG = () => {
  const name = $("tgName").value.trim(); if (!name) { $("tgName").focus(); return; }
  if (!listFor(name)) { const gid = "g" + Date.now(); games[gid] = { name, at: Date.now(), manual: true, table: true }; setDoc(GAMESREF, { [gid]: games[gid] }, { merge: true }).catch(fail); }
  else { const g = listFor(name); games[g] = { ...games[g], manual: true }; setDoc(GAMESREF, { [g]: games[g] }, { merge: true }).catch(fail); }
  $("tgName").value = ""; $("tgBox").hidden = true; draw();
};
$("tgAdd").onclick = addTG;
$("tgName").onkeydown = e => { if (e.key === "Enter") addTG(); };

/* + Add a poker game: opens the Games menu (pg-menu.js, same menu as the Waitlist page). */
const listFor = name => Object.keys(games).find(gid => games[gid] && games[gid].name === name);
const pgMenu = mountPgMenu($("pgBox"), { PGREF, GAMESREF, games: () => games, listFor, fail, after: () => draw() });
$("addPg").onclick = pgMenu.toggle;
/* A poker table's game (from the strip): saved on the table, stays until changed. */
document.addEventListener("change", e => {
  const sel = e.target.closest("[data-tv]"); if (!sel) return;
  const n = +sel.dataset.tv, v = sel.value;
  const id = pgAll().find(k => pgName(k) === v), old = (TABLES[n] || {}).stakes || "";
  const stakes = v && id && stakesFor(id).includes(old) ? old : "";   // keep the stakes if the new game has them
  list[n] = { ...(list[n] || {}), variant: v, stakes }; buildTables();
  setDoc(LISTREF, { [n]: { variant: v, stakes } }, { merge: true }).catch(fail);
  draw();
});
/* A poker table's stakes: tap a bubble under its game (tap again to clear). */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tstk]"); if (!b) return;
  const n = +b.dataset.tstk, stakes = (TABLES[n] || {}).stakes === b.dataset.st ? "" : b.dataset.st;
  list[n] = { ...(list[n] || {}), stakes }; buildTables();
  setDoc(LISTREF, { [n]: { stakes } }, { merge: true }).catch(fail);
  draw();
});

/* Edit table: new number (moves its spot, open/closed and everyone logged in there) and/or new game. */
function saveTableEdit(n) {
  const m = parseInt($("eNum").value, 10), game = $("eGame").value.trim().slice(0, 40), say = t => { $("eMsg").textContent = t; };
  if (!(m >= 1 && m <= 99)) { say("Pick a number from 1 to 99."); return; }
  if (!game) { say("Type the game."); return; }
  if (m !== n && TABLES[m]) { say("Table " + m + " is already used."); return; }
  const count = +$("eSeats").value, seats = count === TABLES[n].seats.length ? TABLES[n].seats : Array.from({ length: count }, (_, i) => i + 1);
  const lost = Object.entries(state).filter(([c, p]) => p && p.status === "seated" && (p.table || 1) === n && p.seat && !seats.includes(p.seat));
  if (lost.length) { say("Seat " + lost.map(([, p]) => p.seat).join(", ") + " is taken. Move " + (lost.length > 1 ? "them" : "that player") + " first."); return; }
  const t = { ...TABLES[n], game, seats, deleted: false }, w = {};
  if (m === n) w[n] = t;
  else {
    w[m] = t; w[n] = BASE_TABLES[n] ? { deleted: true } : deleteField();
    const pv = plan[n], tv = tables[n];   // read these before anything is written
    if (pv) { plan[m] = pv; delete plan[n]; setDoc(PLANREF, { [m]: pv, [n]: deleteField() }, { merge: true }).catch(fail); }
    if (tv) { tables[m] = tv; delete tables[n]; setDoc(TBLREF, { [m]: tv, [n]: deleteField() }, { merge: true }).catch(fail); }
    const moved = {};   // everyone logged in at this table goes with it
    for (const [c, p] of Object.entries(state)) if (p && (p.table || 1) === n && p.status === "seated") { moved[c] = { ...p, table: m }; state[c] = moved[c]; }
    if (Object.keys(moved).length) setDoc(REF, moved, { merge: true }).catch(fail);
  }
  setDoc(LISTREF, w, { merge: true }).catch(fail);
  list[m] = t; if (m !== n) list[n] = BASE_TABLES[n] ? { deleted: true } : null;
  buildTables(); selT = m; panelFor = 0; draw();
}
/* Edit table position on floor: unlocks dragging, rotate and size; tap again (Done moving tables) to lock. */
$("moveMode").onclick = () => {
  moveMode = !moveMode; document.body.classList.toggle("moving", moveMode);
  $("moveMode").textContent = moveMode ? "Done moving tables" : "Edit table position on floor";
  $("moveMode").classList.toggle("ghost", !moveMode);
  draw();
};
/* + Add a table: game, seats, shape. Gets the next number and lands in the next open spot on the plan. */
const ovalGame = g => /poker|hold.?em|omaha|stud/i.test(g) && !/three card|ultimate|pai gow/i.test(g);
$("addTbl").onclick = () => { $("addTblBox").hidden = !$("addTblBox").hidden; if (!$("addTblBox").hidden) $("tGame").focus(); };
$("tGame").oninput = () => { const o = ovalGame($("tGame").value); $("tShape").value = o ? "oval" : "half"; if (o && $("tSeats").value === "7") $("tSeats").value = "9"; };
$("tCreate").onclick = () => {
  const game = $("tGame").value.trim(); if (!game) { $("tGame").focus(); return; }
  const n = Math.max(0, ...Object.keys(TABLES).map(Number)) + 1, count = +$("tSeats").value;
  const t = { game: game.slice(0, 40), seats: Array.from({ length: count }, (_, i) => i + 1), shape: $("tShape").value, deleted: false };
  list[n] = t; buildTables();
  setDoc(LISTREF, { [n]: t }, { merge: true }).catch(fail);
  $("tGame").value = ""; $("addTblBox").hidden = true; selT = n; draw();
};

/* Floor plan: drag a table to move it (saved for everyone); a tap without dragging opens/closes it. */
const planPt = e => { const m = $("plan").getScreenCTM().inverse(); return new DOMPoint(e.clientX, e.clientY).matrixTransform(m); };
$("plan").addEventListener("pointerdown", e => {
  const g = e.target.closest(".ptbl"); if (!g || e.target.closest("a")) return;
  e.preventDefault(); $("plan").setPointerCapture(e.pointerId);
  const n = +g.dataset.tbl, p = planPt(e), at = plan[n] || PLAN_DEFAULT[n];
  planDrag = { n, g, dx: p.x - at.x, dy: p.y - at.y, x0: e.clientX, y0: e.clientY, moved: false, pos: at, felt: !!e.target.closest("[data-felt]") };
});
$("plan").addEventListener("pointermove", e => {
  const d = planDrag; if (!d || !moveMode) return;   // locked: a press is just a tap
  if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
  d.moved = true; d.g.classList.add("dragging");
  const p = planPt(e);
  const vb = $("plan").viewBox.baseVal;
  d.pos = { ...d.pos, x: Math.round(Math.min(Math.max(p.x - d.dx, -20), vb.width - 180)), y: Math.round(Math.min(Math.max(p.y - d.dy, -10), vb.height - 160)) };
  d.g.setAttribute("transform", tblXf(d.pos));
});
const endPlanDrag = e => {
  const d = planDrag; if (!d) return; planDrag = null;
  if (d.moved) { plan[d.n] = d.pos; setDoc(PLANREF, { [d.n]: d.pos }, { merge: true }).catch(fail); }
  else if (e.type === "pointerup" && d.felt && !moveMode) { toggleOpen(d.n); return; }   // tap the felt: open/close the table
  else if (e.type === "pointerup") selT = selT === d.n ? 0 : d.n;   // tap the number (or anywhere else on it): its menu; tap again to let go
  draw();
};
$("plan").addEventListener("pointerup", endPlanDrag);
$("plan").addEventListener("pointercancel", endPlanDrag);

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  if (!u) { location.replace("./login.html?next=floor.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  document.body.style.visibility = "visible";
  draw();
  const on = (ref, set) => onSnapshot(ref, snap => { $("warn").style.display = "none"; set(snap.exists() ? snap.data() : {}); draw(); }, fail);
  on(REF, v => state = v); on(TBLREF, v => tables = v); on(CALLREF, v => calls = v); on(WAITREF, v => wait = v);
  on(GAMESREF, v => games = v); on(PLANREF, v => plan = v);
  on(LISTREF, v => { list = v; buildTables(); if (selT && !TABLES[selT]) selT = 0; });
  on(PGREF, setPg);
  on(BLDREF, v => { try { building = v.sketch ? JSON.parse(v.sketch) : null; } catch (e) { building = null; } });
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  setInterval(draw, 30000);   // keep the times ticking
});
</script>
</body>
</html>
