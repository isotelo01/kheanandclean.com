<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Floor</title>
<style>
/* Floor page (Player Tracker proof of concept): the floor runs every table from here.
   - Floor plan: the building's outline (drawn with the room measurer, measure.html?building=1) with every table
     and its chairs on it. Drag a table to move it; tap it for a toolbar: open/close, rotate, size, Dealer Control.
   - Calls: drinks/service/chips/floor calls sent from Dealer Control. Done clears them.
   - Wait list (left column): "+ Add a game" builds a list per game (mostly poker); names go under each game.
     Players who joined the list from their phone show up too. Table games don't carry lists.
   Firestore: playerTracker/tables { n: { open } }, playerTracker/calls { id: { t, kind, at } },
   playerTracker/waitlist { id: { name, game (= waitgames id), at } }, playerTracker/waitgames { id: { name, at } },
   playerTracker/floorplan { n: { x, y } }, plus playerTracker/poc (same as the other pages). */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px}
h1{margin:0;font-size:26px;color:var(--gold)}
h2{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin:24px 0 10px}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.ok{background:var(--ok)}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px}
.tsvg{display:block;width:100%;height:auto;cursor:pointer;margin-bottom:8px}
.dc{color:var(--gold);font-weight:700;font-size:14px;text-decoration:none}
.tcard.open{border-color:var(--ok)}
.tcard .nm{font-weight:700;font-size:17px}
.tcard .nm span{color:var(--gold)}
.tcard .st{font-size:14px;color:rgba(255,255,255,.75);margin:4px 0 10px}
.sw{border-radius:999px;padding:6px 14px;font:700 14px system-ui,sans-serif;cursor:pointer;border:1px solid var(--bad);background:none;color:var(--bad)}
.sw.on{border-color:var(--ok);background:var(--ok);color:#000}
.box{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:4px 12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.empty{color:rgba(255,255,255,.6);font-size:14px;padding:12px 0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.call{border-left:4px solid var(--gold);padding-left:10px}
.call.old .nm b{animation:pulse 1.2s infinite;color:var(--bad)}
.add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;font:inherit}
#wName{flex:1;min-width:160px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.12);margin-left:6px}
/* Wait list column on the left, floor plan on the right (stacked on a phone). */
.wrap{max-width:1400px}
.cols{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.gbox{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin-top:12px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gh b{flex:1;color:var(--gold);font-size:17px}
.gh .cnt{font-size:13px;color:rgba(255,255,255,.7)}
.gh button{background:none;border:0;color:rgba(255,255,255,.55);font-size:22px;line-height:1;cursor:pointer;padding:0 4px}
.gbox .add input{flex:1;min-width:0;padding:8px 10px}
[hidden]{display:none!important}
.hint{color:rgba(255,255,255,.6);font-size:13px;margin:-4px 0 8px}
#plan{width:100%;height:auto;display:block;background:#101a2e;border:1px solid rgba(255,255,255,.12);border-radius:12px;touch-action:none}
.ptbl{cursor:grab}
.ptbl.sel > rect:first-child{stroke:#E3B64A;stroke-width:2;stroke-dasharray:6 5}
#tbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:#0b1220;border:1px solid var(--gold);border-radius:12px;padding:8px 10px;margin-bottom:8px}
#tbar b{color:var(--gold);margin-right:4px}
#tbar .btn{padding:7px 12px;font-size:14px}
.ptbl.dragging{cursor:grabbing;opacity:.85}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./player-tracker.html">&lsaquo; Back</a><h1>Floor</h1></div>
  <div class="warn" id="warn">Not syncing with the server.</div>
  <div class="cols">
    <aside>
      <h2>Wait list</h2>
      <button class="btn" id="addGame" style="width:100%">+ Add a game</button>
      <div class="add" id="addGameBox" hidden style="margin-top:10px">
        <input id="gName" list="gamePresets" placeholder="Game, e.g. 1/2 No-Limit Hold'em" autocomplete="off" style="flex:1;min-width:0">
        <button class="btn" id="gCreate">Create</button>
      </div>
      <datalist id="gamePresets"><option>No-Limit Hold'em</option><option>Limit Hold'em</option><option>Pot-Limit Omaha</option><option>Omaha Hi-Lo</option></datalist>
      <div id="wait"></div>
    </aside>
    <main>
      <h2>Calls</h2>
      <div class="box" id="calls"></div>
      <h2>Floor plan</h2>
      <p class="hint">Drag a table to move it. Tap a table for open/close, rotate and size.
        <a href="./measure.html?building=1" class="btn ghost sm" style="margin-left:6px">Edit building shape</a></p>
      <div id="tbar" hidden></div>
      <svg id="plan" viewBox="0 0 900 560"></svg>
    </main>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), ROSTREF = doc(db, "playerTracker", "roster"), PROFREF = doc(db, "playerTracker", "profiles");
const TBLREF = doc(db, "playerTracker", "tables"), CALLREF = doc(db, "playerTracker", "calls"), WAITREF = doc(db, "playerTracker", "waitlist");
const GAMESREF = doc(db, "playerTracker", "waitgames");   // wait list games the floor built: { id: { name, at } }
const PLANREF = doc(db, "playerTracker", "floorplan");    // where each table sits on the floor plan: { n: { x, y, rot, scale } }
const BLDREF = doc(db, "playerTracker", "building");      // building outline drawn with the room measurer's sketch tool (feet)
const FT_PX = 16;   // floor plan units per foot (a table with its chairs is about 12 ft across)

/* Same tables, test roster and dealers as the other Player Tracker pages. */
const TABLES = {
  1: { game: "Blackjack", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" },
  2: { game: "Baccarat", seats: [1, 2, 3, 5, 6, 7, 8], shape: "half" },   // no seat 4
  3: { game: "Poker", seats: [1, 2, 3, 4, 5, 6, 7, 8, 9], shape: "oval" },
  4: { game: "Three Card Poker", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" },
  5: { game: "Ultimate Texas Hold'em", seats: [1, 2, 3, 4, 5, 6, 7], shape: "half" }
};
/* One table on the floor plan, drawn from the top in a 200 x 182 box: green felt when open, grey when
   closed, a chair at each seat facing the table (gold = seated, blue = on break, red = break over 30 min,
   dark = empty), then its name, dealer and seats under it. Drag to move it; tap to open/close it. */
const tblXf = p => `translate(${p.x} ${p.y}) translate(100 91) rotate(${p.rot || 0}) scale(${p.scale || 1}) translate(-100 -91)`;
const PLAN_DEFAULT = { 1: { x: 40, y: 30 }, 2: { x: 350, y: 30 }, 3: { x: 660, y: 30 }, 4: { x: 40, y: 300 }, 5: { x: 350, y: 300 } };
function planTable(n, tb, open, bySeat, dealer, nSeated, nBreak, pos) {
  const felt = open ? "#0f6b3a" : "#3a3f4b", rail = open ? "#5a3518" : "#2a2e37";
  const chair = (x, y, cx, cy, s) => {   // small chair at (x,y), turned to face the table centre (cx,cy)
    const p = bySeat[s];
    const f = !p ? "#0b1220" : p.breakAt ? (Date.now() - p.breakAt > 30 * 60000 ? "#ef4444" : "#3b82f6") : "#E3B64A";
    const rot = Math.atan2(y - cy, x - cx) * 180 / Math.PI - 90;
    return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(1)})">`
      + `<rect x="-8" y="-6" width="16" height="12" rx="3" fill="${f}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>`
      + `<rect x="-9" y="6" width="18" height="4" rx="2" fill="${f}" stroke="rgba(255,255,255,.55)" stroke-width="1"/></g>`;
  };
  let s = `<rect width="200" height="182" fill="transparent"/>`, label;
  if (tb.shape === "oval") {
    s += `<ellipse cx="100" cy="62" rx="80" ry="42" fill="${rail}"/><ellipse cx="100" cy="62" rx="71" ry="34" fill="${felt}"/>`;
    tb.seats.forEach((st, k) => { const a = (-90 + 36 * (k + 1)) * Math.PI / 180; s += chair(100 + Math.cos(a) * 94, 62 + Math.sin(a) * 52, 100, 62, st); });
    label = 68;
  } else {
    s += `<rect x="18" y="10" width="164" height="7" rx="2" fill="${rail}"/><path d="M18 16 A82 82 0 0 0 182 16 Z" fill="${rail}"/><path d="M27 16 A73 73 0 0 0 173 16 Z" fill="${felt}"/>`;
    tb.seats.forEach((st, k) => { const a = Math.PI * ((k + 1) / (tb.seats.length + 1)); s += chair(100 + Math.cos(a) * 94, 16 + Math.sin(a) * 94, 100, 16, st); });
    label = 52;
  }
  s += `<text x="100" y="${label}" fill="${open ? "rgba(255,255,255,.9)" : "rgba(255,255,255,.55)"}" font-size="26" font-weight="700" text-anchor="middle">${n}</text>`;
  if (!open) s += `<text x="100" y="${label + 18}" fill="#f87171" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">CLOSED</text>`;
  s += `<text x="100" y="146" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">${n} &#183; ${esc(tb.game)}</text>`
     + `<text x="100" y="162" fill="rgba(255,255,255,.7)" font-size="11" text-anchor="middle">${dealer ? esc(nameOf(dealer)) : "No dealer"} &#183; ${nSeated}/${tb.seats.length} seated${nBreak ? " &#183; " + nBreak + " on break" : ""}</text>`
     + `<a href="./dealer-table.html?t=${n}"><text x="100" y="178" fill="#E3B64A" font-size="11" font-weight="700" text-anchor="middle">Dealer Control &#8250;</text></a>`;
  return `<g class="ptbl${selT === n ? " sel" : ""}" data-tbl="${n}" transform="${tblXf(pos)}">${s}</g>`;
}
const ROSTER = {
  "100001": "Doyle Brunson",  "100002": "Phil Ivey",       "100003": "Stu Ungar",
  "100004": "Johnny Moss",    "100005": "Amarillo Slim",   "100006": "Puggy Pearson",
  "100007": "Wild Bill Hickok","100008": "Doc Holliday",   "100009": "Poker Alice",
  "100010": "Wyatt Earp"
};
const DEALERS = { "D001": "Ace in the Hole", "D002": "Shuffle Off Home" };
const CALLS = { drinks: "Drinks", service: "Service", chips: "Chips", floor: "Floor" };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = t => { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 1 ? "just now" : m < 60 ? m + "m" : Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const fail = () => { $("warn").style.display = "block"; };
let state = {}, roster = {}, profiles = {}, tables = {}, calls = {}, wait = {}, games = {}, plan = {};
let planDrag = null;   // a table being dragged around the floor plan
let building = null, selT = 0;   // building outline (from measure.html?building=1); selected table
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || DEALERS[c] || c;
const isPlayer = c => !!(ROSTER[c] || roster[c]);

function draw() {
  /* Calls, oldest first (waiting longest on top). Over 5 minutes = pulsing red. */
  const cl = Object.entries(calls).filter(([, v]) => v && v.at).sort((a, b) => a[1].at - b[1].at);
  $("calls").innerHTML = cl.length ? cl.map(([id, v]) => `<div class="row call ${Date.now() - v.at > 5 * 60000 ? "old" : ""}">
      <div class="nm"><b>${esc(CALLS[v.kind] || v.kind)}</b> &middot; Table ${v.t}<span>${esc((TABLES[v.t] || {}).game || "")} &middot; ${ago(v.at)}</span></div>
      <button class="btn ok sm" data-done="${esc(id)}">Done</button></div>`).join("")
    : `<div class="empty">No calls.</div>`;

  /* Floor plan: every table where the floor put it. Skipped mid-drag so the table doesn't jump. */
  /* The building (drawn with the room measurer's sketch tool, in feet) goes under the tables. The plan grows to fit it. */
  let bld = "", vbW = 900, vbH = 560;
  if (building && Array.isArray(building.pts) && building.pts.length >= 3) {
    const xs = building.pts.map(q => q[0]), ys = building.pts.map(q => q[1]), mx = Math.min(...xs), my = Math.min(...ys);
    const P = q => ((q[0] - mx) * FT_PX + 20).toFixed(1) + "," + ((q[1] - my) * FT_PX + 20).toFixed(1);
    bld = `<polygon points="${building.pts.map(P).join(" ")}" fill="rgba(255,255,255,.04)" stroke="rgba(227,182,74,.7)" stroke-width="4" stroke-linejoin="round"/>`
        + (building.cuts || []).filter(c => c && Array.isArray(c.pts) && c.pts.length >= 3)
            .map(c => `<polygon points="${c.pts.map(P).join(" ")}" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.35)"/>`).join("");
    vbW = Math.max(vbW, (Math.max(...xs) - mx) * FT_PX + 40); vbH = Math.max(vbH, (Math.max(...ys) - my) * FT_PX + 40);
  }
  for (const n of Object.keys(TABLES)) { const q = plan[n] || PLAN_DEFAULT[n]; vbW = Math.max(vbW, q.x + 230); vbH = Math.max(vbH, q.y + 210); }
  if (!planDrag) $("plan").setAttribute("viewBox", `0 0 ${Math.round(vbW)} ${Math.round(vbH)}`);
  if (!planDrag) $("plan").innerHTML = bld + Object.entries(TABLES).map(([n, tb]) => {
    n = +n;
    const on = Object.entries(state).filter(([c, p]) => p && p.status === "seated" && (p.table || 1) === n);
    const dealer = on.find(([c]) => DEALERS[c]);
    const players = on.filter(([c]) => isPlayer(c));
    const brk = players.filter(([, p]) => p.breakAt).length;
    const open = !!(tables[n] && tables[n].open);
    const bySeat = {}; players.forEach(([, p]) => { bySeat[p.seat] = p; });
    return planTable(n, tb, open, bySeat, dealer && dealer[0], players.length, brk, plan[n] || PLAN_DEFAULT[n]);
  }).join("");

  /* Toolbar for the tapped table: open/close, rotate, size, Dealer Control. */
  if (selT && TABLES[selT]) {
    const q = plan[selT] || PLAN_DEFAULT[selT], open = !!(tables[selT] && tables[selT].open);
    $("tbar").hidden = false;
    $("tbar").innerHTML = `<b>${selT} &middot; ${esc(TABLES[selT].game)}</b>
      <button class="btn ${open ? "" : "ok"}" data-ta="open">${open ? "Close table" : "Open table"}</button>
      <button class="btn ghost" data-ta="rl" title="Rotate left">&#10226; Rotate</button><button class="btn ghost" data-ta="rr" title="Rotate right">Rotate &#10227;</button>
      <button class="btn ghost" data-ta="sm" title="Smaller">&minus; Smaller</button><button class="btn ghost" data-ta="lg" title="Bigger">+ Bigger</button>
      <span class="hint" style="margin:0">${Math.round(((q.rot || 0) % 360 + 360) % 360)}&deg; &middot; ${Math.round((q.scale || 1) * 100)}%</span>
      <button class="btn ghost" data-ta="reset">Reset</button>
      <a class="btn ghost" href="./dealer-table.html?t=${selT}">Dealer Control &rsaquo;</a>
      <button class="btn ghost" data-ta="x" aria-label="Close toolbar">&times;</button>`;
  } else $("tbar").hidden = true;

  /* Wait list: one box per game the floor built (longest wait on top), plus players who joined from
     their phone, plus any older names whose game list is gone. Table games don't get lists. */
  const row = (w, i) => `<div class="row">
      <div class="nm"><b>${i + 1}. ${esc(w.name)}</b><span>waiting ${ago(w.at)}</span></div>
      <button class="btn ghost sm" data-rm="${esc(w.id)}" data-src="${w.src}">Remove</button></div>`;
  const names = Object.entries(wait).filter(([, v]) => v && v.name).map(([id, v]) => ({ id, name: v.name, game: v.game || "", at: v.at, src: "floor" }));
  const gl = Object.entries(games).filter(([, g]) => g && g.name).sort((a, b) => a[1].at - b[1].at);
  let html = gl.map(([gid, g]) => {
    const list = names.filter(w => w.game === gid).sort((a, b) => a.at - b.at);
    return `<div class="gbox"><div class="gh"><b>${esc(g.name)}</b><span class="cnt">${list.length} waiting</span><button data-delgame="${esc(gid)}" title="Remove this list">&times;</button></div>
      <div class="add"><input data-gin="${esc(gid)}" placeholder="Add a name" autocomplete="off"><button class="btn sm" data-gadd="${esc(gid)}">Add</button></div>
      ${list.length ? list.map(row).join("") : `<div class="empty">Nobody waiting.</div>`}</div>`;
  }).join("");
  const phones = Object.entries(state).filter(([c, p]) => isPlayer(c) && p && p.status === "wait")
    .map(([c, p]) => ({ id: c, name: nameOf(c), at: p.waitAt || Date.now(), src: "app" })).sort((a, b) => a.at - b.at);
  if (phones.length) html += `<div class="gbox"><div class="gh"><b>From phones</b><span class="cnt">${phones.length} waiting</span></div>${phones.map(row).join("")}</div>`;
  const other = names.filter(w => !games[w.game]).sort((a, b) => a.at - b.at);
  if (other.length) html += `<div class="gbox"><div class="gh"><b>Other</b><span class="cnt">${other.length} waiting</span></div>${other.map(row).join("")}</div>`;
  if (!html) html = `<div class="empty">No games yet. Tap "+ Add a game" to start a list.</div>`;
  const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.gin;   // keep typing focus through a redraw
  const typed = focused ? document.activeElement.value : "";
  $("wait").innerHTML = html;
  if (focused) { const el = document.querySelector(`[data-gin="${CSS.escape(focused)}"]`); if (el) { el.value = typed; el.focus(); } }
}

document.addEventListener("click", e => {
  const d = e.target.closest("[data-done]");
  if (d) { setDoc(CALLREF, { [d.dataset.done]: deleteField() }, { merge: true }).catch(fail); return; }
  const sw = e.target.closest("[data-sw]");
  if (sw) { const n = sw.dataset.sw; setDoc(TBLREF, { [n]: { open: !(tables[n] && tables[n].open) } }, { merge: true }).catch(fail); return; }
  const rm = e.target.closest("[data-rm]");
  if (rm) {
    const id = rm.dataset.rm;
    if (rm.dataset.src === "app") { const p = state[id] || {}; setDoc(REF, { [id]: { ...p, status: "out", waitAt: null } }, { merge: true }).catch(fail); }
    else setDoc(WAITREF, { [id]: deleteField() }, { merge: true }).catch(fail);
    return;
  }
  const ta = e.target.closest("[data-ta]");
  if (ta && selT) {
    const n = selT, q = { ...(plan[n] || PLAN_DEFAULT[n]) }, a = ta.dataset.ta;
    if (a === "open") { setDoc(TBLREF, { [n]: { open: !(tables[n] && tables[n].open) } }, { merge: true }).catch(fail); return; }
    if (a === "x") { selT = 0; draw(); return; }
    if (a === "rl") q.rot = ((q.rot || 0) - 15) % 360;
    if (a === "rr") q.rot = ((q.rot || 0) + 15) % 360;
    if (a === "sm") q.scale = Math.max(.5, Math.round(((q.scale || 1) - .1) * 10) / 10);
    if (a === "lg") q.scale = Math.min(1.5, Math.round(((q.scale || 1) + .1) * 10) / 10);
    if (a === "reset") { q.rot = 0; q.scale = 1; }
    plan[n] = q; setDoc(PLANREF, { [n]: q }, { merge: true }).catch(fail); draw();
    return;
  }
  const ga = e.target.closest("[data-gadd]");
  if (ga) { addName(ga.dataset.gadd); return; }
  const dg = e.target.closest("[data-delgame]");
  if (dg) {
    const gid = dg.dataset.delgame, inIt = Object.entries(wait).filter(([, v]) => v && v.game === gid);
    if (inIt.length && !confirm("Remove the " + games[gid].name + " list and the " + inIt.length + " name(s) on it?")) return;
    const upd = {}; inIt.forEach(([id]) => { upd[id] = deleteField(); });
    if (inIt.length) setDoc(WAITREF, upd, { merge: true }).catch(fail);
    setDoc(GAMESREF, { [gid]: deleteField() }, { merge: true }).catch(fail);
  }
});
/* Add a name to a game's list. */
function addName(gid) {
  const el = document.querySelector(`[data-gin="${CSS.escape(gid)}"]`), name = el && el.value.trim();
  if (!name) { if (el) el.focus(); return; }
  const id = "w" + Date.now() + Math.random().toString(36).slice(2, 6);
  wait[id] = { name, game: gid, at: Date.now() };   // show it right away
  el.value = "";
  setDoc(WAITREF, { [id]: wait[id] }, { merge: true }).catch(fail);
  draw();
}
document.addEventListener("keydown", e => { const el = e.target.closest && e.target.closest("[data-gin]"); if (el && e.key === "Enter") addName(el.dataset.gin); });
/* + Add a game: name it (presets or type your own) and a new list appears. */
$("addGame").onclick = () => { $("addGameBox").hidden = !$("addGameBox").hidden; if (!$("addGameBox").hidden) $("gName").focus(); };
const createGame = () => {
  const name = $("gName").value.trim(); if (!name) { $("gName").focus(); return; }
  const gid = "g" + Date.now();
  games[gid] = { name, at: Date.now() };
  setDoc(GAMESREF, { [gid]: games[gid] }, { merge: true }).catch(fail);
  $("gName").value = ""; $("addGameBox").hidden = true; draw();
};
$("gCreate").onclick = createGame;
$("gName").onkeydown = e => { if (e.key === "Enter") createGame(); };

/* Floor plan: drag a table to move it (saved for everyone); a tap without dragging opens/closes it. */
const planPt = e => { const m = $("plan").getScreenCTM().inverse(); return new DOMPoint(e.clientX, e.clientY).matrixTransform(m); };
$("plan").addEventListener("pointerdown", e => {
  const g = e.target.closest(".ptbl"); if (!g || e.target.closest("a")) return;
  e.preventDefault(); $("plan").setPointerCapture(e.pointerId);
  const n = +g.dataset.tbl, p = planPt(e), at = plan[n] || PLAN_DEFAULT[n];
  planDrag = { n, g, dx: p.x - at.x, dy: p.y - at.y, x0: e.clientX, y0: e.clientY, moved: false, pos: at };
});
$("plan").addEventListener("pointermove", e => {
  const d = planDrag; if (!d) return;
  if (!d.moved && Math.hypot(e.clientX - d.x0, e.clientY - d.y0) < 6) return;
  d.moved = true; d.g.classList.add("dragging");
  const p = planPt(e);
  const vb = $("plan").viewBox.baseVal;
  d.pos = { ...d.pos, x: Math.round(Math.min(Math.max(p.x - d.dx, -20), vb.width - 180)), y: Math.round(Math.min(Math.max(p.y - d.dy, -10), vb.height - 160)) };
  d.g.setAttribute("transform", tblXf(d.pos));
});
const endPlanDrag = e => {
  const d = planDrag; if (!d) return; planDrag = null;
  if (d.moved) { plan[d.n] = d.pos; setDoc(PLANREF, { [d.n]: d.pos }, { merge: true }).catch(fail); }
  else if (e.type === "pointerup") selT = selT === d.n ? 0 : d.n;   // tap: select it (toolbar), tap again to let go
  draw();
};
$("plan").addEventListener("pointerup", endPlanDrag);
$("plan").addEventListener("pointercancel", endPlanDrag);

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  if (!u) { location.replace("./login.html?next=floor.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  document.body.style.visibility = "visible";
  draw();
  const on = (ref, set) => onSnapshot(ref, snap => { $("warn").style.display = "none"; set(snap.exists() ? snap.data() : {}); draw(); }, fail);
  on(REF, v => state = v); on(TBLREF, v => tables = v); on(CALLREF, v => calls = v); on(WAITREF, v => wait = v);
  on(GAMESREF, v => games = v); on(PLANREF, v => plan = v);
  on(BLDREF, v => { try { building = v.sketch ? JSON.parse(v.sketch) : null; } catch (e) { building = null; } });
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  setInterval(draw, 30000);   // keep the times ticking
});
</script>
