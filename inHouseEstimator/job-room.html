<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Rooms &middot; Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Room pages, opened from a line on the Job Sheet. Starter look only (same base as
   job-sheet.html) — style freely. No prices anywhere on this page. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}   /* black page behind the cards */
#authwait{position:fixed;inset:0;background:#000;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:102px;height:102px;border-radius:12px;border:3px solid var(--gold);background:var(--navy);padding:4px}   /* K&C logo, 3x the old 34px, gold border on blue */
/* Back to Job Sheet: bigger, it's the main way out (and it saves first). */
#backBtn{font-size:18px;padding:14px 22px;border:2px solid var(--gold);border-radius:10px;background:var(--navy);color:var(--gold)}   /* navy, gold text and outline */
h1{font:700 30px "Playfair Display",Georgia,serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
#title{display:none}   /* the room name already shows in the card below; kept in the page because the script fills it */
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.cname{font-size:20px;font-weight:700}
.meta{color:var(--muted);font-size:14px}
.svcname{font:700 22px "Playfair Display",Georgia,serif;margin:18px 0 4px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.svcsub{color:var(--muted);font-size:15px;margin-bottom:14px}
/* One card per room. Bedroom × 3 shows as Bedroom 1, Bedroom 2, Bedroom 3. */
.rooms{display:grid;gap:12px}
.room{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.room__name{font-weight:700;font-size:18px}
.room__size{color:var(--muted);font-size:15px}
.room__body{margin-top:8px}   /* room-by-room details go here */
/* Carpet package extras, one checkbox each per room. */
.xchk{display:flex;align-items:center;gap:12px;padding:8px 2px;border-top:1px solid #eef0f4;cursor:pointer;font-size:16px}
.xchk input{width:24px;height:24px;flex:none;accent-color:var(--green)}
.xchk.done span{text-decoration:line-through;color:var(--muted)}
.saverow{display:flex;gap:10px;align-items:center;margin-top:16px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
@media print{ .saverow{display:none} }
a.room__name{display:block;color:var(--ink);text-decoration:none}
/* One room's own page: notes, photos, Done. */
.h3{font:700 16px "Archivo";margin:18px 0 8px;color:var(--navy)}
textarea{display:block;width:100%;min-height:110px;resize:vertical;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pcell{position:relative;border-radius:8px;overflow:hidden;background:#eef0f4}
.pcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.px{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(10,14,22,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.donebox{margin-top:16px;border-top:1px solid var(--line);font-weight:700}
.donebox.done span{text-decoration:none;color:var(--green)}
/* Estimated vs actual square feet on a room. */
.sqrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:2px 0 6px}   /* EST and Actual stay on one line, phones too */
.sqrow .svcsub{margin:0;white-space:nowrap}
.actual{display:flex;align-items:center;gap:8px;flex:none;font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap}
.actual input{width:92px;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
@media (max-width:360px){ .actual input{width:76px} }
/* Fiber type: label, dropdown and (for Other) the text box, side by side on one row. */
.fibrow{display:flex;align-items:center;gap:8px;margin-top:14px}
.fiblab{flex:none;font-size:15px;font-weight:700;color:var(--navy)}
#fiberSel,#materialSel{flex:none;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
.fiberOther{flex:1;min-width:0;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.fiberOther[hidden]{display:none}
.fibnote{margin:8px 0 0;font-size:13px;color:var(--muted)}
/* Pre-Spray and Rinse: two labeled boxes side by side under Fiber type. */
.chemrow{display:flex;gap:10px;margin-top:10px}
.chem{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700;color:var(--navy)}
.chem input{width:100%;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.spot .chem{color:#fff}
.spot .chem input{background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
/* Before / Inspection / After photos: section titles, styled like the room name. */
.ptitle{font:700 20px "Playfair Display",Georgia,serif;color:var(--navy);margin:26px 0 4px;border-bottom:2px solid var(--gold);padding-bottom:5px}
/* Label over each photo spot (Threshold, Stains and more photos...). */
.plab{display:flex;align-items:center;gap:10px;margin:14px 0 6px;font-size:15px;font-weight:700;color:var(--navy)}
.pcam{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:0;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:8px;cursor:pointer}
/* A room's own page: navy card, white text. Boxes stay white; Save goes gold so it shows. */
.panel.spot{background:var(--navy);color:#fff}
.spot .cname,.spot .svcname,.spot .ptitle,.spot .plab,.spot .fiblab,.spot .actual,.spot .h3,.spot .xchk{color:#fff}
.spot .meta,.spot .svcsub,.spot .msg,.spot .fibnote,.spot .note,.spot .xchk.done span{color:#c9d0de}
.spot .note.err{color:#ffb4a6}
.spot .xchk{border-top-color:rgba(255,255,255,.15)}
.spot .donebox{border-top-color:rgba(255,255,255,.25)}
.spot .donebox.done span{color:#7fd8a8}
.spot .new{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.spot .pcam{background:var(--navy);color:var(--gold);border:2px solid var(--gold)}   /* camera buttons: navy, gold border, gold camera */
/* Actual sq ft box: black with white text, wide enough that "Measured" shows in full. */
.spot .actual input{width:108px;padding:8px;background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
.spot .actual input::placeholder{color:#aab2c3;opacity:1}
@media (max-width:360px){ .spot .actual input{width:96px;font-size:15px} }
/* Fiber type dropdown, its "Which fiber?" box and Notes: black with white text too. */
.spot #fiberSel,.spot #materialSel,.spot .fiberOther,.spot textarea{background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
.spot .fiberOther::placeholder,.spot textarea::placeholder{color:#aab2c3;opacity:1}
@media print{ .pbtns,.pcam,.px{display:none} }
@media print{ body{background:#fff} .top>div{display:none!important} .panel{box-shadow:none;padding:0} }
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1 id="title">Rooms</h1>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <a class="ghost" id="backBtn" href="./job-sheet.html">Back to Job Sheet</a>
    </div>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const storage = getStorage(app);

const view = document.getElementById("view"), titleEl = document.getElementById("title");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Labels like "Deep Cleaning — 800 sq ft @ $0.50/sq ft": keep the name and size, drop the price. */
const noPrice = t => String(t || "").replace(/\s*@\s*\$[\d.,]+\s*\/\s*sq ft/i, "").replace(/\s*\+\s*\$[\d.,]+/g, "").replace(/\s*\$[\d.,]+/g, "").trim();
/* Photos taken on a room's page: shrunk to 2400px on the long side and saved as JPEG, the
   same way the website's quick quote does it. Anything that won't open as a picture is refused. */
const shrink = file => new Promise((res, rej) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    let w = img.naturalWidth, h = img.naturalHeight; const m = 2400 / Math.max(w, h);
    if (m < 1) { w = Math.round(w * m); h = Math.round(h * m); }
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    c.toBlob(b => b ? res(b) : rej(new Error("Could not read that photo")), "image/jpeg", 0.85);
  };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file isn't a photo")); };
  img.src = url;
});
const splitLabel = t => { const s = noPrice(t), k = s.indexOf(" — "); return k < 0 ? [s, ""] : [s.slice(0, k), s.slice(k + 3)]; };

/* Which job and which line: ?id=<job>&line=<service #>&item=<item #> (item left off = the whole service).
   Held in sessionStorage too, since login.html only takes a bare page name. */
const PLACES = ["acceptedQuotes", "invoices", "paidInvoices"];
const ss = { get: k => { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
             set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
const qs = new URLSearchParams(location.search);
const saved = (() => { try { return JSON.parse(ss.get("kcJobRoom") || "{}"); } catch (e) { return {}; } })();
const id = qs.get("id") || saved.id || "";
const lineNo = qs.has("line") ? Number(qs.get("line")) : Number(saved.line);
const itemNo = qs.has("id") ? (qs.has("item") ? Number(qs.get("item")) : null) : (saved.item ?? null);
/* &room=<n> opens one room on its own page (its photos, notes and Done). */
const roomNo = qs.has("id") ? (qs.has("room") ? Number(qs.get("room")) : null) : (saved.room ?? null);
if (id) ss.set("kcJobRoom", JSON.stringify({ id, line: lineNo, item: itemNo, room: roomNo }));

async function show(){
  if (!id || !Number.isInteger(lineNo)) { view.innerHTML = '<div class="msg">No line picked. <a href="./approved-leads.html">Go to Approved Leads</a></div>'; return; }
  document.getElementById("backBtn").href = "./job-sheet.html?id=" + encodeURIComponent(id);
  let q = null, place = "";
  try {
    for (const p of PLACES) { const s = await getDoc(doc(db, p, id)); if (s.exists()) { q = s.data(); place = p; break; } }
  } catch (e) { console.error(e); view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!q) { view.innerHTML = '<div class="msg">That job isn’t on file.</div>'; return; }

  /* Rooms added or deleted on site (Job Sheet) live under onsite.lines; otherwise the quote's. */
  const line = ((q.onsite && Array.isArray(q.onsite.lines)) ? q.onsite.lines : (Array.isArray(q.lines) ? q.lines : []))[lineNo];
  if (!line) { view.innerHTML = '<div class="msg">That line isn’t on this job anymore.</div>'; return; }
  const items = Array.isArray(line.items) ? line.items : [];
  const picked = itemNo == null ? items : [items[itemNo]].filter(Boolean);

  const c = q.customer || {};
  const name = (c.business && c.name ? c.business + " — " + c.name : c.name || c.business) || "No name";
  const [svc] = splitLabel(line.label || "Service");
  titleEl.textContent = svc;
  document.title = svc + " · " + name + " · Khean & Clean";

  /* Every room on its own: a grouped room (qty 3, 330 sq ft) becomes three rooms of 110 sq ft. */
  const rooms = [];
  picked.forEach(it => {
    const j = items.indexOf(it);
    let r = 0;
    (Array.isArray(it.rooms) ? it.rooms : []).forEach(rm => {
      const n = Math.max(1, Number(rm.qty) || 1), each = Math.round((Number(rm.sqft) || 0) / n);
      for (let k = 1; k <= n; k++) {
        /* On-site rooms carry their own id (kept when other rooms are added or deleted). */
        const key = rm.id && n === 1 ? rm.id : lineNo + "-" + j + "-" + r;
        rooms.push({ name: n > 1 ? rm.name + " " + k : rm.name, sqft: each, j, r: r++, key });
      }
    });
  });

  /* Carpet package extras on this job (stain protector, accelerated drying, deodorizer):
     each carpet room gets a checkbox for each. Saved on the job under roomChecks. */
  const isExtra = it => /accelerated drying|deodori[sz]er|stain (protector|guard|repellent)|scotch ?gard/i.test(String(it.label || ""));
  /* Carpet lines are named after the package ("Deep Cleaning — 800 sq ft"): go by the line's
     service key, or the package names when an older quote has no key. */
  const isCarpet = /carpet/i.test(String(line.key || "")) ||
    /carpet|essential cleaning|deep cleaning|signature cleaning|quick dry|encapsulation/i.test(String(line.label || ""));
  /* Tile & grout line: Material type and Pre-Spray / Rinse on its pages. */
  const isTile = line.key ? line.key === "tile" : /tile/i.test(String(line.label || ""));
  const extras = isCarpet ? items.filter(isExtra).map(it => splitLabel(it.label)[0]) : [];
  const checks = new Set(Array.isArray(q.roomChecks) ? q.roomChecks : []);
  const slug = s => s.toLowerCase().replace(/[^a-z]+/g, "-");
  const xbox = (r, x) => { const k = r.key + "-" + slug(x), on = checks.has(k);
    return '<label class="xchk' + (on ? ' done' : '') + '"><input type="checkbox" data-k="' + esc(k) + '"' + (on ? ' checked' : '') + '><span>' + esc(x) + '</span></label>'; };

  /* One room, or one add-on (stairs, pet odor, stain treatment...): its own page with notes,
     photos and Done, saved on the job under spots.<key>. */
  const pickedItem = itemNo == null ? null : items[itemNo];
  let spot = null;
  /* One rug out of an Area Rugs line ("Medium (5×8) × 2" = two rugs, each its own page). */
  const rug = pickedItem && roomNo != null && !(Array.isArray(pickedItem.rooms) && pickedItem.rooms.length) &&
    String(pickedItem.label || "").match(/Area Rugs\s*—\s*(.+?)\s*×\s*(\d+)\s*$/i);
  /* After a rug is deleted on the Job Sheet the label says "× 1" but the others keep their numbers. */
  /* The number shown matches the Job Sheet: 1, 2, 3 with deleted ones not counted. */
  const shownNo = gone => roomNo + 1 - (Array.isArray(gone) ? gone.filter(g => g < roomNo).length : 0);
  if (rug && roomNo < (Number(pickedItem.rugSlots) || Number(rug[2]))) {
    /* EST from the rug's size: Medium (5×8) = 40 sq ft, Large (9×12) = 108. */
    const dm = rug[1].match(/(\d+)\s*[×x]\s*(\d+)/);
    spot = { name: "Area Rug " + shownNo(pickedItem.rugGone) + " — " + rug[1], sqft: dm ? Number(dm[1]) * Number(dm[2]) : 0,
      key: lineNo + "-" + itemNo + "-" + roomNo, isRoom: false, rug: true };
  } else if (pickedItem && roomNo != null && ["stretch", "pet", "stain"].includes(pickedItem.addonKey) &&
             roomNo < (Number(pickedItem.spotSlots) || Number(pickedItem.qty) || 0)) {
    /* One spot / room of a counted add-on (Stain treatment 3, Carpet Stretching 2...). */
    spot = { name: String(pickedItem.label || "").split(" — ")[0] + " " + shownNo(pickedItem.spotGone), sqft: 0,
      key: lineNo + "-" + itemNo + "-" + roomNo, isRoom: false };
  } else if (pickedItem && roomNo != null) {
    const rm = rooms.find(x => x.r === roomNo);
    if (rm) spot = { ...rm, isRoom: true };
  } else if (pickedItem && !(Array.isArray(pickedItem.rooms) && pickedItem.rooms.length)) {
    spot = { name: splitLabel(pickedItem.label)[0] || "Area", sqft: 0, key: lineNo + "-" + itemNo, isRoom: false,
      stairs: /stair/i.test(String(pickedItem.label || "")) };
  } else if (itemNo == null && !items.length) {
    spot = { name: svc, sqft: 0, key: String(lineNo), isRoom: false };
  }
  if (spot) { showSpot(spot); return; }

  function showSpot(spot){
    const st = (q.spots && q.spots[spot.key]) || {};
    /* Photo spots; each takes as many photos as needed. Older jobs only have photoPaths; those
       show under Before, Stains and more photos. */
    const GROUPS = {
      bThr: { field: "photosBeforeThreshold", label: "Threshold" },
      bAdj: { field: "photosBeforeAdjacent", label: "Threshold adjacent" },
      before: { field: "photosBefore", label: "Stains and more photos" },
      inspection: { field: "photosInspection", label: "" },
      aThr: { field: "photosAfterThreshold", label: "Threshold" },
      aAdj: { field: "photosAfterAdjacent", label: "Threshold adjacent" },
      after: { field: "photosAfter", label: "More photos" }
    };
    /* Not a room (stairs, area rugs, other add-ons): no Threshold spots, just Before,
       Inspection and After. Its first After photo marks it Done and is its thumbnail. */
    const SHOWN = spot.isRoom ? Object.keys(GROUPS) : ["before", "inspection", "after"];
    if (!spot.isRoom) { GROUPS.before.label = ""; GROUPS.after.label = ""; }
    const legacy = Array.isArray(st.photoPaths) ? st.photoPaths : [];
    const hasGroups = Object.values(GROUPS).some(x => Array.isArray(st[x.field])) || Array.isArray(st.photosStains);
    const groups = {};
    Object.keys(GROUPS).forEach(g => { groups[g] = (Array.isArray(st[GROUPS[g].field]) ? st[GROUPS[g].field] : []).slice(); });
    if (!hasGroups) groups.before = legacy.slice();
    /* Stains used to be its own spot; its photos now sit in "Stains and more photos". */
    const oldStains = Array.isArray(st.photosStains) ? st.photosStains : [];
    groups.before = [...oldStains, ...groups.before];
    const allPaths = () => Object.keys(GROUPS).flatMap(g => groups[g]);
    const photoFields = () => { const o = { photoPaths: allPaths() }; if (oldStains.length) o.photosStains = []; Object.keys(GROUPS).forEach(g => { o[GROUPS[g].field] = groups[g]; });
      /* Room: Done once an After Threshold photo is in. Not a room: once any After photo is in. */
      o.done = spot.isRoom ? groups.aThr.length > 0 : groups.after.length > 0;
      return o; };
    /* One small camera button per spot, next to its label. The phone itself then offers
       Take Photo or Photo Library. */
    const CAM = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    const photoBlock = g => { const one = GROUPS[g].one;
      return '<div class="plab"><span>' + GROUPS[g].label + '</span>' +
        '<button type="button" class="pcam" data-pick="' + g + '" aria-label="Add photo' + (GROUPS[g].label ? ': ' + GROUPS[g].label : '') + '">' + CAM + '</button>' +
        '<input type="file" id="pick-' + g + '" accept="image/*"' + (one ? '' : ' multiple') + ' hidden></div>' +
      '<div class="pgrid" id="pgrid-' + g + '" data-g="' + g + '"><div class="msg">Loading photos…</div></div>'; };
    const roomExtras = spot.isRoom ? extras : [];
    /* This room's fiber if it has one, otherwise the job's (set by the first room saved). */
    const FIBERS = ["Nylon", "Polyester", "Olefin", "Other"];
    const jobFib = q.jobFiber && q.jobFiber.type ? q.jobFiber : null;
    /* Rugs are often a different fiber from the carpet: they don't fill in from the job's. */
    const jobFibHere = spot.rug ? null : jobFib;
    const fib = st.fiber && st.fiber.type ? st.fiber : jobFibHere;
    const fibFromJob = !(st.fiber && st.fiber.type) && !!jobFibHere;
    /* Tile: this room's material, otherwise the job's (set by the first tile room saved). */
    const MATERIALS = ["Porcelain", "Ceramic"];
    const mat = st.material || q.jobMaterial || "";
    const matFromJob = !st.material && !!q.jobMaterial;
    titleEl.textContent = spot.name;
    document.title = spot.name + " · " + name + " · Khean & Clean";
    view.innerHTML =
      '<div class="panel spot">' +
        '<div class="cname">' + esc(name) + '</div>' +
        '<div class="meta">' + esc([q.number, svc].filter(Boolean).join(" · ")) + '</div>' +
        '<div class="svcname">' + esc(spot.name) + '</div>' +
        /* A room: the quoted size as Estimated, plus a box for what was actually measured on site. */
        (spot.isRoom || spot.rug   /* rugs too: EST from their size */
          ? '<div class="sqrow"><div class="svcsub">EST ' + (spot.sqft ? spot.sqft.toLocaleString() + ' sq ft' : '—') + '</div>' +
            '<label class="actual">Actual <input type="number" id="actualSqft" min="0" step="1" inputmode="numeric" placeholder="Measured"' +
            (Number(st.actualSqft) > 0 ? ' value="' + Number(st.actualSqft) + '"' : '') + '></label></div>'
          : (spot.sqft ? '<div class="svcsub">' + spot.sqft.toLocaleString() + ' sq ft</div>' : '')) +
        /* Fiber type, carpet rooms only. The first room saved sets it for the job, so the other
           rooms open with it filled in; any room can be switched on its own. */
        (isCarpet   /* every carpet page: rooms, stairs, rugs and the carpet add-on pages */
          ? '<div class="fibrow"><label for="fiberSel" class="fiblab">Fiber type</label>' +
            '<select id="fiberSel"><option value="">Pick one</option>' +
            FIBERS.map(f => '<option value="' + f + '"' + (fib && fib.type === f ? ' selected' : '') + '>' + f + '</option>').join("") + '</select>' +
            '<input type="text" id="fiberOther" class="fiberOther" placeholder="Which fiber?" aria-label="Other fiber" value="' + esc(fib && fib.type === "Other" ? fib.other || "" : "") + '"' + (fib && fib.type === "Other" ? '' : ' hidden') + '></div>' +
            (fibFromJob ? '<p class="fibnote">Filled in from the first room. Change it if this room is different.</p>' : '')
          : '') +
        /* Material type, tile pages only. The first tile room saved sets it for the job. */
        (isTile
          ? '<div class="fibrow"><label for="materialSel" class="fiblab">Material type</label>' +
            '<select id="materialSel"><option value="">Pick one</option>' +
            MATERIALS.map(m => '<option value="' + m + '"' + (mat === m ? ' selected' : '') + '>' + m + '</option>').join("") + '</select></div>' +
            (matFromJob ? '<p class="fibnote matnote">Filled in from the first room. Change it if this room is different.</p>' : '')
          : '') +
        /* Pre-Spray and Rinse: every page on a carpet or tile line (rooms, stairs, rugs and the
           add-ons with their own photo page). */
        (isCarpet || isTile
          ? '<div class="chemrow">' +
              '<label class="chem">Pre-Spray <input type="text" id="preSpray" value="' + esc(st.preSpray || "") + '"></label>' +
              '<label class="chem">Rinse <input type="text" id="rinse" value="' + esc(st.rinse || "") + '"></label>' +
            '</div>'
          : '') +
        (roomExtras.length ? '<h3 class="h3">In this room</h3><div class="room__body">' + roomExtras.map(x => xbox(spot, x)).join("") + '</div>' : '') +
        /* Before and Inspection photos, then the one Notes box, then After photos. */
        '<h3 class="ptitle">Before photos</h3>' + (spot.isRoom ? photoBlock("bThr") + photoBlock("bAdj") : "") + photoBlock("before") +
        '<h3 class="ptitle">Inspection photos</h3>' + photoBlock("inspection") +
        '<h3 class="h3">Notes</h3>' +
        '<textarea id="spotNotes" placeholder="What you found, spots to watch, anything for next time">' + esc(st.notes || "") + '</textarea>' +
        '<h3 class="ptitle">After photos</h3>' + (spot.isRoom ? photoBlock("aThr") + photoBlock("aAdj") : "") + photoBlock("after") +
        '<div class="saverow"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' +
      '</div>';

    const note = document.getElementById("note"), saveBtn = document.getElementById("saveBtn");
    const flag = () => { note.textContent = "Not saved yet."; note.classList.remove("err"); };
    view.addEventListener("change", e => {
      const cb = e.target.closest(".xchk input"); if (!cb) return;
      cb.closest(".xchk").classList.toggle("done", cb.checked); flag();
    });
    document.getElementById("spotNotes").addEventListener("input", flag);
    const actualEl = document.getElementById("actualSqft");
    if (actualEl) actualEl.addEventListener("input", flag);
    const otherEl = document.getElementById("fiberOther");
    view.addEventListener("change", e => {
      const r = e.target.id === "fiberSel" ? e.target : null; if (!r) return;
      otherEl.hidden = r.value !== "Other"; if (!otherEl.hidden) otherEl.focus();
      const fn = view.querySelector(".fibnote"); if (fn) fn.remove();   /* this room now has its own pick */
      flag();
    });
    if (otherEl) otherEl.addEventListener("input", flag);
    const matEl = document.getElementById("materialSel");
    if (matEl) matEl.addEventListener("change", () => { const mn = view.querySelector(".matnote"); if (mn) mn.remove(); flag(); });
    const preEl = document.getElementById("preSpray"), rinseEl = document.getElementById("rinse");
    if (preEl) preEl.addEventListener("input", flag);
    if (rinseEl) rinseEl.addEventListener("input", flag);

    const draw = async g => {
      const grid = document.getElementById("pgrid-" + g), paths = groups[g];
      const urls = await Promise.all(paths.map(p => getDownloadURL(ref(storage, p)).catch(e => { console.error("Photo " + p, e); return null; })));
      grid.innerHTML = paths.map((p, k) => urls[k]
        ? '<div class="pcell"><a href="' + esc(urls[k]) + '" target="_blank" rel="noopener"><img src="' + esc(urls[k]) + '" alt="" loading="lazy"></a>' +
          '<button type="button" class="px" data-k="' + k + '" aria-label="Remove photo">×</button></div>' : '').join("") ||
        '<div class="msg">No photos yet.</div>';
    };
    SHOWN.forEach(draw);
    /* Photos are saved onto the job as soon as they upload, so none are lost if Save isn't pressed. */
    const savePhotos = () => setDoc(doc(db, place, id), { spots: { [spot.key]: { ...photoFields(), updatedAt: serverTimestamp() } } }, { merge: true });
    const upload = async (g, files) => {
      let list = [...(files || [])]; if (!list.length) return;
      if (GROUPS[g].one) list = list.slice(0, 1);   /* one-photo spot: the new one replaces the old */
      note.classList.remove("err");
      for (let k = 0; k < list.length; k++) {
        note.textContent = "Uploading photo " + (k + 1) + " of " + list.length + "…";
        try {
          const blob = await shrink(list[k]);
          /* Same folder as the website's photos (that's what the storage rules allow). */
          const path = "quick-quote-photos/job_" + id + "_" + spot.key + "_" + g + "/" + Date.now() + "_" + k + ".jpg";
          await uploadBytes(ref(storage, path), blob, { contentType: "image/jpeg" });
          if (GROUPS[g].one) groups[g] = [path]; else groups[g].push(path);
        } catch (e) { console.error(e); note.textContent = "A photo didn’t upload: " + e.message; note.classList.add("err"); }
      }
      try { await savePhotos(); if (!note.classList.contains("err")) note.textContent = "Photos saved."; }
      catch (e) { console.error(e); note.textContent = "Photos uploaded but not saved to the job: " + e.message; note.classList.add("err"); }
      draw(g);
    };
    SHOWN.forEach(g => {
      const pickIn = document.getElementById("pick-" + g);
      view.querySelector('[data-pick="' + g + '"]').addEventListener("click", () => pickIn.click());
      pickIn.addEventListener("change", () => { upload(g, pickIn.files); pickIn.value = ""; });
      /* X takes a photo off this room (the file itself stays in storage). */
      document.getElementById("pgrid-" + g).addEventListener("click", async e => {
        const b = e.target.closest(".px"); if (!b) return;
        groups[g].splice(Number(b.dataset.k), 1);
        try { await savePhotos(); note.textContent = "Photo removed."; note.classList.remove("err"); }
        catch (err) { console.error(err); note.textContent = "Could not save: " + err.message; note.classList.add("err"); }
        draw(g);
      });
    });

    const doSave = async () => {
      saveBtn.disabled = true; note.textContent = "Saving…"; note.classList.remove("err");
      try {
        const data = { spots: { [spot.key]: { notes: document.getElementById("spotNotes").value.trim(),
          ...photoFields(), updatedAt: serverTimestamp() } } };
        /* Actual sq ft measured on site (rooms only); blank clears it. */
        if (actualEl) { const n = Math.round(Number(actualEl.value)); data.spots[spot.key].actualSqft = n > 0 ? n : null; }
        /* Pre-Spray and Rinse used in this room (carpet rooms only). */
        if (preEl) data.spots[spot.key].preSpray = preEl.value.trim();
        if (rinseEl) data.spots[spot.key].rinse = rinseEl.value.trim();
        /* Fiber type: saved on this room; the first one saved also becomes the job's, so the
           other carpet rooms open with it filled in. */
        /* Material type (tile): saved on this room; the first one saved becomes the job's. */
        if (matEl) {
          data.spots[spot.key].material = matEl.value || null;
          if (matEl.value && !q.jobMaterial) { data.jobMaterial = matEl.value; q.jobMaterial = matEl.value; }
        }
        if (otherEl) {
          const pick = document.getElementById("fiberSel").value;
          const fiber = pick ? { type: pick, other: pick === "Other" ? otherEl.value.trim() : "" } : null;
          data.spots[spot.key].fiber = fiber;
          if (fiber && !spot.rug && !(q.jobFiber && q.jobFiber.type)) {   /* a rug never sets the job's fiber */ data.jobFiber = fiber; q.jobFiber = fiber; }
        }
        let next = null;
        if (roomExtras.length) {
          const mine = new Set([...view.querySelectorAll(".room__body .xchk input")].map(x => x.dataset.k));
          const now = [...view.querySelectorAll(".room__body .xchk input:checked")].map(x => x.dataset.k);
          next = [...checks].filter(k => !mine.has(k)).concat(now);
          data.roomChecks = next;
        }
        await setDoc(doc(db, place, id), data, { merge: true });
        if (next) { checks.clear(); next.forEach(k => checks.add(k)); }
        note.textContent = "Saved.";
      } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
      finally { saveBtn.disabled = false; }
      return !note.classList.contains("err");
    };
    saveBtn.addEventListener("click", doSave);
    saveBefore = doSave;   /* Back to Job Sheet saves this room first */
  }

  const sub = picked.map(it => { const [a, b] = splitLabel(it.label || ""); return b ? a + " · " + b : a; }).filter(Boolean).join("  |  ");
  view.innerHTML =
    '<div class="panel">' +
      '<div class="cname">' + esc(name) + '</div>' +
      '<div class="meta">' + esc(q.number || "") + '</div>' +
      '<div class="svcname">' + esc(svc) + '</div>' +
      (sub ? '<div class="svcsub">' + esc(sub) + '</div>' : '') +
      (rooms.length
        ? '<div class="rooms">' + rooms.map((r, k) =>
            '<section class="room" id="room-' + (k + 1) + '">' +
              '<a class="room__name" href="./job-room.html?id=' + encodeURIComponent(id) + '&line=' + lineNo + '&item=' + r.j + '&room=' + r.r + '">' + esc(r.name) + ' ›</a>' +
              (r.sqft ? '<div class="room__size">' + r.sqft.toLocaleString() + ' sq ft</div>' : '') +
              '<div class="room__body">' + extras.map(x => xbox(r, x)).join("") + '</div>' +
            '</section>').join("") + '</div>' +
          (extras.length ? '<div class="saverow"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' : '')
        : '<div class="msg">No room breakdown on this line (it was measured by square feet, or it’s an add-on).</div>') +
    '</div>';

  const saveBtn = document.getElementById("saveBtn"), note = document.getElementById("note");
  if (!saveBtn) return;
  view.addEventListener("change", e => {
    const cb = e.target.closest(".xchk input"); if (!cb) return;
    cb.closest(".xchk").classList.toggle("done", cb.checked);
    note.textContent = "Not saved yet."; note.classList.remove("err");
  });
  /* Ticks on this page replace this page's keys only; other lines' ticks are kept. */
  const doSave = async () => {
    saveBtn.disabled = true; note.textContent = "Saving…"; note.classList.remove("err");
    try {
      const mine = new Set([...view.querySelectorAll(".xchk input")].map(x => x.dataset.k));
      const kept = [...checks].filter(k => !mine.has(k));
      const now = [...view.querySelectorAll(".xchk input:checked")].map(x => x.dataset.k);
      const next = kept.concat(now);
      await setDoc(doc(db, place, id), { roomChecks: next, roomChecksAt: serverTimestamp() }, { merge: true });
      checks.clear(); next.forEach(k => checks.add(k));
      note.textContent = "Saved.";
    } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
    finally { saveBtn.disabled = false; }
    return !note.classList.contains("err");
  };
  saveBtn.addEventListener("click", doSave);
  saveBefore = doSave;
}

/* Back to Job Sheet saves first (when the page has something to save), then goes back.
   If the save fails it stays here with the error showing, so nothing typed is lost. */
let saveBefore = null;
document.getElementById("backBtn").addEventListener("click", async e => {
  if (!saveBefore) return;
  e.preventDefault();
  const a = e.currentTarget, href = a.href;
  a.style.pointerEvents = "none"; a.textContent = "Saving…";
  const ok = await saveBefore();
  if (ok) { location.href = href; return; }
  a.style.pointerEvents = ""; a.textContent = "Back to Job Sheet";
});

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=job-room.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; show(); }
});
</script>
</body>
</html>
