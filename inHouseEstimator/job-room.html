<html lang="en">

<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
/* Room pages, opened from a line on the Job Sheet. Starter look only (same base as
   job-sheet.html) — style freely. Staff see this room's price and discount at the bottom; customers never do. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#000;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}   /* black page behind the cards */
#authwait{position:fixed;inset:0;background:#000;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:102px;height:102px;border-radius:12px;border:3px solid var(--gold);background:var(--navy);padding:4px}   /* K&C logo, 3x the old 34px, gold border on blue */
/* Back to Job Sheet: bigger, it's the main way out (and it saves first). */
#backBtn{font-size:18px;padding:14px 22px;border:2px solid var(--gold);border-radius:10px;background:var(--navy);color:var(--gold)}   /* navy, gold text and outline */
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
#title{display:none}   /* the room name already shows in the card below; kept in the page because the script fills it */
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
/* Customer view (?view=customer): the room's photos and notes, nothing to fill in or save. */
.pub .home{pointer-events:none}
.pub .actual,.pub .fibrow,.pub .fibnote,.pub .chemrow,.pub .room__body,.pub .h3+.room__body,.pub .pcam,.pub .px,.pub #spotNotes,.pub .saverow,.pub .pricebox,.pub .pempty,.pub #authwait{display:none!important}
.pub .notesro{white-space:pre-wrap;font-size:16px;line-height:1.45}
.pub .notesro:empty{display:none}
.pub .h3:has(+.notesro:empty){display:none}
.pub .h3:has(+.room__body){display:none}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.cname{font-size:20px;font-weight:700}
.meta{color:var(--muted);font-size:14px}
.svcname{font:700 22px "Archivo",system-ui,sans-serif;margin:18px 0 4px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.svcsub{color:var(--muted);font-size:15px;margin-bottom:14px}
/* One card per room. Bedroom × 3 shows as Bedroom 1, Bedroom 2, Bedroom 3. */
.rooms{display:grid;gap:12px}
.room{border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.room__name{font-weight:700;font-size:18px}
.room__size{color:var(--muted);font-size:15px}
.room__body{margin-top:8px}   /* room-by-room details go here */
/* Carpet package extras, one checkbox each per room. */
.xchk{display:flex;align-items:center;gap:12px;padding:8px 2px;border-top:1px solid #eef0f4;cursor:pointer;font-size:16px}
.xchk input{width:24px;height:24px;flex:none;accent-color:var(--green)}
.xchk.done span{text-decoration:line-through;color:var(--muted)}
.saverow{display:flex;gap:10px;align-items:center;margin-top:16px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
@media print{ .saverow{display:none} }
a.room__name{display:block;color:var(--ink);text-decoration:none}
/* One room's own page: notes, photos, Done. */
.h3{font:700 16px "Archivo";margin:18px 0 8px;color:var(--navy)}
textarea{display:block;width:100%;min-height:110px;resize:vertical;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.pcell{position:relative;border-radius:8px;overflow:hidden;background:#eef0f4}
.pcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
/* Star (bottom right): a favorite. Starred photos come up already picked on the Review request page. */
.pstar{position:absolute;bottom:6px;right:6px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(10,14,22,.65);color:#fff;font-size:19px;line-height:1;cursor:pointer}
.pstar.on{color:#E3B64A;background:rgba(10,14,22,.85)}
.px{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(10,14,22,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
.pbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.donebox{margin-top:16px;border-top:1px solid var(--line);font-weight:700}
.donebox.done span{text-decoration:none;color:var(--green)}
/* Estimated vs actual square feet on a room. */
.sqrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:2px 0 6px}   /* EST and Actual stay on one line, phones too */
.sqrow .svcsub{margin:0;white-space:nowrap}
.actual{display:flex;align-items:center;gap:8px;flex:none;font-size:15px;font-weight:600;color:var(--navy);white-space:nowrap}
.actual input{width:92px;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
@media (max-width:360px){ .actual input{width:76px} }
/* "Measure from photos" link under Est / Actual (staff only). */
.measure{display:inline-block;margin:0 0 10px;font-size:14px;font-weight:600;color:var(--gold);text-decoration:underline}
.skThumb{display:block;width:100%;max-width:240px;height:auto;margin:0 0 6px;background:#0b1220;border-radius:8px;padding:6px}
/* Fiber type: label, dropdown and (for Other) the text box, side by side on one row. */
.fibrow{display:flex;align-items:center;gap:8px;margin-top:14px}
.fiblab{flex:none;font-size:15px;font-weight:700;color:var(--navy)}
#fiberSel,#materialSel{flex:none;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
.fiberOther{flex:1;min-width:0;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.fiberOther[hidden]{display:none}
.fibnote{margin:8px 0 0;font-size:13px;color:var(--muted)}
/* Hair & debris checkbox: right end of the Fiber type row (carpet rooms only). */
.hairchk{margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--navy);cursor:pointer;white-space:nowrap}
.hairchk input{width:24px;height:24px;flex:none;margin:0;accent-color:var(--green)}
.spot .hairchk{color:#fff}
/* Pre-Spray and Rinse: two labeled boxes side by side under Fiber type. */
.chemrow{display:flex;gap:10px;margin-top:10px}
.chem{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:700;color:var(--navy)}
.chem input{width:100%;font:16px "Archivo";padding:8px 10px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.spot .chem{color:#fff}
.spot .chem input{background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
/* This room's price and discount (staff only), at the bottom above Save. Same numbers as the Job Sheet row. */
.pricebox{margin-top:18px;padding-top:12px;border-top:2px solid var(--gold)}
.prow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:18px;font-weight:700}
.pval{font-size:22px}
.psub{color:var(--muted);font-size:14px;text-align:right}
.pdisc{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:15px;font-weight:700}
.pdisc select{flex:1;min-width:0;font:16px "Archivo",system-ui,sans-serif;padding:8px 10px;border-radius:6px}
.pnote{color:var(--muted);font-size:13px;margin-top:6px}
/* Before / Inspection / After photos: section titles, styled like the room name. */
.ptitle{font:700 20px "Archivo",system-ui,sans-serif;color:var(--navy);margin:26px 0 4px;border-bottom:2px solid var(--gold);padding-bottom:5px}
/* Label over each photo spot (Threshold, Stains and more photos...). */
.plab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px;font-size:15px;font-weight:700;color:var(--navy)}
.pcam{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:600 14px "Archivo";white-space:nowrap}
/* Icon-only photo buttons (camera = Take photo, plus = Add photos), on the label's line at the right. */
.plab{flex-wrap:nowrap}
.plab>span{flex:1;min-width:0}
.pcam.picon{width:44px;height:44px;padding:0;flex:none}
/* The real file picker sits inside each button, unseen: tapping the button opens it directly (Android blocks code-opened pickers). */
.pin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
/* A room's own page: navy card, white text. Boxes stay white; Save goes gold so it shows. */
.panel.spot{background:var(--navy);color:#fff}
/* Room page: no card. Full width, just a gold line across the top. */
.wrap .panel.spot{background:transparent;border:0;border-top:2px solid var(--gold);border-radius:0;box-shadow:none;margin:0 -18px;padding:18px}
.spot .cname,.spot .svcname,.spot .ptitle,.spot .plab,.spot .fiblab,.spot .actual,.spot .h3,.spot .xchk{color:#fff}
.spot .meta,.spot .svcsub,.spot .msg,.spot .fibnote,.spot .note,.spot .xchk.done span{color:#c9d0de}
.spot .note.err{color:#ffb4a6}
.spot .xchk{border-top-color:rgba(255,255,255,.15)}
.spot .donebox{border-top-color:rgba(255,255,255,.25)}
.spot .donebox.done span{color:#7fd8a8}
.spot .new{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.spot .pcam{background:var(--navy);color:var(--gold);border:2px solid var(--gold)}   /* camera buttons: navy, gold border, gold camera */
/* Actual sq ft box: black with white text, wide enough that "Measured" shows in full. */
.spot .actual input{width:108px;padding:8px;background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
.spot .actual input::placeholder{color:#aab2c3;opacity:1}
@media (max-width:360px){ .spot .actual input{width:96px;font-size:15px} }
/* Fiber type dropdown, its "Which fiber?" box and Notes: black with white text too. */
.spot #fiberSel,.spot #materialSel,.spot .fiberOther,.spot textarea{background:#000;color:#fff;border-color:rgba(255,255,255,.35);color-scheme:dark}
.spot .fiberOther::placeholder,.spot textarea::placeholder{color:#aab2c3;opacity:1}
@media print{ .pbtns,.pcam,.px{display:none} }
@media print{ body{background:#fff} .top>div{display:none!important} .panel{box-shadow:none;padding:0} }
</style>

<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1 id="title">Rooms</h1>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <button type="button" class="ghost" id="refreshBtn">Refresh</button>
      <a class="ghost" id="backBtn" href="./job-sheet.html">Back to Job Sheet</a>
    </div>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
/* Offline versions: work with no service and sync when it's back (offline.js). */
import { getFirestore, getDoc, setDoc, uploadBytes, getDownloadURL, startOffline } from "./offline.js";

/* Mark's job sheet link (shared-job.html): his sign-in lives on its own "share" app, so it only works on the
   job sheet, its room pages and Measure. Every other page uses the normal login and asks him to sign in. */
const SHARE = (() => { try { return sessionStorage.getItem("kcShare") === "1"; } catch (e) { return false; } })();
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
}, SHARE ? "share" : "[DEFAULT]");
const db = getFirestore(app);
const storage = getStorage(app);

const view = document.getElementById("view"), titleEl = document.getElementById("title");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Labels like "Deep Cleaning — 800 sq ft @ $0.50/sq ft": keep the name and size, drop the price. */
const noPrice = t => String(t || "").replace(/\s*@\s*\$[\d.,]+\s*\/\s*sq ft/i, "").replace(/\s*\+\s*\$[\d.,]+/g, "").replace(/\s*\$[\d.,]+/g, "").trim();
/* Photos taken on a room's page: shrunk to 2400px on the long side and saved as JPEG, the
   same way the website's quick quote does it. Anything that won't open as a picture is refused. */
const shrink = file => new Promise((res, rej) => {
  const img = new Image(), url = URL.createObjectURL(file);
  img.onload = () => {
    URL.revokeObjectURL(url);
    let w = img.naturalWidth, h = img.naturalHeight; const m = 2400 / Math.max(w, h);
    if (m < 1) { w = Math.round(w * m); h = Math.round(h * m); }
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    c.toBlob(b => b ? res(b) : rej(new Error("Could not read that photo")), "image/jpeg", 0.85);
  };
  img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file isn't a photo")); };
  img.src = url;
});
const splitLabel = t => { const s = noPrice(t), k = s.indexOf(" — "); return k < 0 ? [s, ""] : [s.slice(0, k), s.slice(k + 3)]; };

/* Which job and which line: ?id=<job>&line=<service #>&item=<item #> (item left off = the whole service).
   Held in sessionStorage too, since login.html only takes a bare page name. */
const PLACES = ["acceptedQuotes", "invoices", "paidInvoices", "quotes"];   /* quotes: an on-site update waiting on approval */
const ss = { get: k => { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
             set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
const qs = new URLSearchParams(location.search);
/* ?view=customer: the room as the customer sees it from their Job Report — photos and notes only,
   nothing to fill in, nothing saved, no sign-in. */
const PUBLIC = qs.get("view") === "customer";
if (PUBLIC) document.documentElement.classList.add("pub");
const saved = (() => { try { return JSON.parse(ss.get("kcJobRoom") || "{}"); } catch (e) { return {}; } })();
const id = qs.get("id") || saved.id || "";
const lineNo = qs.has("line") ? Number(qs.get("line")) : Number(saved.line);
const itemNo = qs.has("id") ? (qs.has("item") ? Number(qs.get("item")) : null) : (saved.item ?? null);
/* &room=<n> opens one room on its own page (its photos, notes and Done). */
const roomNo = qs.has("id") ? (qs.has("room") ? Number(qs.get("room")) : null) : (saved.room ?? null);
if (id) ss.set("kcJobRoom", JSON.stringify({ id, line: lineNo, item: itemNo, room: roomNo }));

async function show(){
  if (!id || !Number.isInteger(lineNo)) { view.innerHTML = '<div class="msg">No line picked. <a href="./approved-leads.html">Go to Approved Leads</a></div>'; return; }
  document.getElementById("backBtn").href = "./job-sheet.html?id=" + encodeURIComponent(id) + (PUBLIC ? "&view=customer" : "");
  if (PUBLIC) document.getElementById("backBtn").textContent = "Back to Job Report";
  let q = null, place = "";
  try {
    for (const p of PLACES) { const s = await getDoc(doc(db, p, id)); if (s.exists()) { q = s.data(); place = p; break; } }
  } catch (e) { console.error(e); view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!q) { view.innerHTML = '<div class="msg">That job isn’t on file.</div>'; return; }

  /* Rooms added or deleted on site (Job Sheet) live under onsite.lines; otherwise the quote's. */
  const line = ((q.onsite && Array.isArray(q.onsite.lines)) ? q.onsite.lines : (Array.isArray(q.lines) ? q.lines : []))[lineNo];
  if (!line) { view.innerHTML = '<div class="msg">That line isn’t on this job anymore.</div>'; return; }
  const items = Array.isArray(line.items) ? line.items : [];
  const picked = itemNo == null ? items : [items[itemNo]].filter(Boolean);

  const c = q.customer || {};
  const name = (c.business && c.name ? c.business + " — " + c.name : c.name || c.business) || "No name";
  const [svc] = splitLabel(line.label || "Service");
  titleEl.textContent = svc;
  document.title = svc + " · " + name + " · Khean & Clean";

  /* Every room on its own: a grouped room (qty 3, 330 sq ft) becomes three rooms of 110 sq ft. */
  const rooms = [];
  picked.forEach(it => {
    const j = items.indexOf(it);
    let r = 0;
    (Array.isArray(it.rooms) ? it.rooms : []).forEach(rm => {
      const n = Math.max(1, Number(rm.qty) || 1), each = Math.round((Number(rm.sqft) || 0) / n);
      for (let k = 1; k <= n; k++) {
        /* On-site rooms carry their own id (kept when other rooms are added or deleted). */
        const key = rm.id && n === 1 ? rm.id : lineNo + "-" + j + "-" + r;
        rooms.push({ name: n > 1 ? rm.name + " " + k : rm.name, sqft: each, j, r: r++, key, track: !!it.track });
      }
    });
  });

  /* Carpet package extras on this job (stain protector, accelerated drying, deodorizer):
     each carpet room gets a checkbox for each. Saved on the job under roomChecks. */
  const isExtra = it => /accelerated drying|deodori[sz]er|stain (protector|guard|repellent)|scotch ?gard/i.test(String(it.label || ""));
  /* Carpet lines are named after the package ("Deep Cleaning — 800 sq ft"): go by the line's
     service key, or the package names when an older quote has no key. */
  const isCarpet = /carpet/i.test(String(line.key || "")) ||
    /carpet|essential cleaning|deep cleaning|signature cleaning|quick dry|encapsulation/i.test(String(line.label || ""));
  /* Tile & grout line: Material type and Pre-Spray / Rinse on its pages. */
  /* Commercial hard floor gets the same page as tile (material, Pre-Spray / Rinse), with its own materials. */
  const isHardComm = line.key === "commhard";
  const isTile = line.key ? (line.key === "tile" || isHardComm) : /tile/i.test(String(line.label || ""));
  const extras = isCarpet ? items.filter(isExtra).map(it => splitLabel(it.label)[0]) : [];
  const checks = new Set(Array.isArray(q.roomChecks) ? q.roomChecks : []);
  const slug = s => s.toLowerCase().replace(/[^a-z]+/g, "-");
  const xbox = (r, x) => { const k = r.key + "-" + slug(x), on = checks.has(k);
    return '<label class="xchk' + (on ? ' done' : '') + '"><input type="checkbox" data-k="' + esc(k) + '"' + (on ? ' checked' : '') + '><span>' + esc(x) + '</span></label>'; };

  /* One room, or one add-on (stairs, pet odor, stain treatment...): its own page with notes,
     photos and Done, saved on the job under spots.<key>. */
  const pickedItem = itemNo == null ? null : items[itemNo];
  let spot = null;
  /* Estimate's "Pet odor treatment × 6" (not yet re-saved on the Job Sheet): its count, else 0. */
  function estSplit(it){
    if (!it || it.addonKey || (Array.isArray(it.rooms) && it.rooms.length)) return 0;
    const m = String(it.label || "").trim().match(/^(Carpet Stretching|Pet odor treatment|Stain treatment)(?:\s*×\s*(\d+))?$/i);
    if (!m) return 0;
    const unit = /^carpet/i.test(m[1]) ? 100 : /^pet/i.test(m[1]) ? 50 : 15;   /* fallback when the label has no count */
    return m[2] ? Number(m[2]) : Math.round((Number(it.cost) || 0) / unit);
  }
  /* One rug out of an Area Rugs line ("Medium (5×8) × 2" = two rugs, each its own page). */
  const rug = pickedItem && roomNo != null && !(Array.isArray(pickedItem.rooms) && pickedItem.rooms.length) &&
    String(pickedItem.label || "").match(/Area Rugs\s*—\s*(.+?)\s*×\s*(\d+)\s*$/i);
  /* After a rug is deleted on the Job Sheet the label says "× 1" but the others keep their numbers. */
  /* The number shown matches the Job Sheet: 1, 2, 3 with deleted ones not counted. */
  const shownNo = gone => roomNo + 1 - (Array.isArray(gone) ? gone.filter(g => g < roomNo).length : 0);
  if (rug && roomNo < (Number(pickedItem.rugSlots) || Number(rug[2]))) {
    /* EST from the rug's size: Medium (5×8) = 40 sq ft, Large (9×12) = 108. */
    const dm = rug[1].match(/(\d+)\s*[×x]\s*(\d+)/);
    spot = { name: "Area Rug " + shownNo(pickedItem.rugGone) + " — " + rug[1], sqft: dm ? Number(dm[1]) * Number(dm[2]) : 0,
      key: lineNo + "-" + itemNo + "-" + roomNo, isRoom: false, rug: true };
  } else if (pickedItem && roomNo != null && (pickedItem.split || ["stretch", "pet", "stain"].includes(pickedItem.addonKey) || estSplit(pickedItem)) &&
             roomNo < (Number(pickedItem.spotSlots) || Number(pickedItem.qty) || estSplit(pickedItem) || 0)) {
    /* One spot / room / piece (Stain treatment 3, Carpet Stretching 2, Couch 1...). */
    const baseNm = pickedItem.baseName || String(pickedItem.label || "").split(" — ")[0].replace(/\s*×\s*\d+\s*$/, "");
    const key3 = pickedItem.addonKey || (/^carpet stretching/i.test(baseNm) ? "stretch" : /^pet odor/i.test(baseNm) ? "pet" : /^stain treatment/i.test(baseNm) ? "stain" : "");
    /* Stretching, pet odor and stain pages get the rug form (EST / Actual size); stretching has no Pre-Spray / Rinse. */
    spot = { name: baseNm + " " + shownNo(pickedItem.spotGone), sqft: 0,
      key: lineNo + "-" + itemNo + "-" + roomNo, isRoom: false,
      rugForm: !!key3, noChem: key3 === "stretch" };
  } else if (pickedItem && roomNo != null) {
    const rm = rooms.find(x => x.r === roomNo);
    if (rm) spot = { ...rm, isRoom: true };
  } else if (pickedItem && (pickedItem.track || !(Array.isArray(pickedItem.rooms) && pickedItem.rooms.length))) {   /* track: "Whole area" of a straight-sq-ft line */
    spot = { name: splitLabel(pickedItem.label)[0] || "Area", sqft: 0, key: lineNo + "-" + itemNo, isRoom: false,
      stairs: /stair/i.test(String(pickedItem.label || "")) };
  } else if (itemNo == null && !items.length) {
    spot = { name: svc, sqft: 0, key: String(lineNo), isRoom: false };
  }
  if (spot) { showSpot(spot); return; }

  function showSpot(spot){
    const st = (q.spots && q.spots[spot.key]) || {};
    /* Photo spots; each takes as many photos as needed. Older jobs only have photoPaths; those
       show under Before, Stains and more photos. */
    const GROUPS = {
      bThr: { field: "photosBeforeThreshold", label: "Threshold" },
      bAdj: { field: "photosBeforeAdjacent", label: "Threshold adjacent" },
      before: { field: "photosBefore", label: "Stains and more photos" },
      inspection: { field: "photosInspection", label: "" },
      aThr: { field: "photosAfterThreshold", label: "Threshold" },
      aAdj: { field: "photosAfterAdjacent", label: "Threshold adjacent" },
      after: { field: "photosAfter", label: "More photos" }
    };
    /* Not a room (stairs, area rugs, other add-ons): no Threshold spots, just Before,
       Inspection and After. Its first After photo marks it Done and is its thumbnail. */
    const SHOWN = spot.isRoom ? Object.keys(GROUPS) : ["before", "inspection", "after"];
    if (!spot.isRoom) { GROUPS.before.label = ""; GROUPS.after.label = ""; }
    const legacy = Array.isArray(st.photoPaths) ? st.photoPaths : [];
    const hasGroups = Object.values(GROUPS).some(x => Array.isArray(st[x.field])) || Array.isArray(st.photosStains);
    const groups = {};
    Object.keys(GROUPS).forEach(g => { groups[g] = (Array.isArray(st[GROUPS[g].field]) ? st[GROUPS[g].field] : []).slice(); });
    if (!hasGroups) groups.before = legacy.slice();
    /* Stains used to be its own spot; its photos now sit in "Stains and more photos". */
    const oldStains = Array.isArray(st.photosStains) ? st.photosStains : [];
    groups.before = [...oldStains, ...groups.before];
    const allPaths = () => Object.keys(GROUPS).flatMap(g => groups[g]);
    const photoFields = () => { const o = { photoPaths: allPaths() }; if (oldStains.length) o.photosStains = []; Object.keys(GROUPS).forEach(g => { o[GROUPS[g].field] = groups[g]; });
      /* Room: Done once an After Threshold photo is in. Not a room: once any After photo is in. */
      o.done = spot.isRoom ? groups.aThr.length > 0 : groups.after.length > 0;
      return o; };
    /* One small camera button per spot, next to its label. The phone itself then offers
       Take Photo or Photo Library. */
    const CAM = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
    const PLUS = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>';
    const photoBlock = g => { const one = GROUPS[g].one;
      return '<div class="plab"><span>' + GROUPS[g].label + '</span>' +
        /* Take photo opens the camera; Add photo(s) opens the library. */
        '<label class="pcam picon" title="Take photo" aria-label="Take photo">' + CAM + '<input type="file" class="pin" id="cap-' + g + '" accept="image/*" capture="environment"></label>' +
        '<label class="pcam picon" title="Add photo' + (one ? '' : 's') + '" aria-label="Add photo' + (one ? '' : 's') + '">' + PLUS + '<input type="file" class="pin" id="pick-' + g + '" accept="image/*"' + (one ? '' : ' multiple') + '></label></div>' +
      '<div class="pgrid" id="pgrid-' + g + '" data-g="' + g + '"><div class="msg">Loading photos…</div></div>'; };
    const roomExtras = spot.isRoom ? extras : [];
    /* Hair & debris removal: each carpet room's own checkbox (saved as spots.<room>.hair). The Job
       Sheet charges the checked rooms' sq ft; it replaces any whole-line hair & debris, so no double charge. */
    /* Quoted with hair & debris: the box starts checked. Once this room is saved, its own setting wins. */
    const lineHair = !!line.hairQuoted || items.some(it => !it.removed && it.addonKey !== "hairRoom" && /^hair & debris/i.test(String(it.label || "")));
    /* Commercial areas (tracking rooms) get it too, same as residential; tracking rooms add no money for it. */
    const showHair = spot.isRoom && isCarpet && (!spot.track || /^comm/i.test(String(line.key || "")));
    const hairOn = typeof st.hair === "boolean" ? st.hair : lineHair;
    /* This room's fiber if it has one, otherwise the job's (set by the first room saved). */
    const FIBERS = ["Nylon", "Polyester", "Olefin", "Other"];
    const jobFib = q.jobFiber && q.jobFiber.type ? q.jobFiber : null;
    /* Rugs are often a different fiber from the carpet: they don't fill in from the job's. */
    const jobFibHere = spot.rug ? null : jobFib;
    /* The section's Detergent & material (set once on the Job Sheet: "L<line>", area rugs "L<line>rug").
       Order: this room's own pick, then the section's, then the job's. */
    const sd = ((q.secDefaults || {})["L" + lineNo + (spot.rug ? "rug" : "")]) || {};
    const secFib = isCarpet && sd.material ? { type: sd.material, other: sd.materialOther || "" } : null;
    const secMat = isTile && sd.material ? sd.material : "";
    const secPre = (sd.preSpray && sd.preSpray.name) || "", secRinse = (sd.rinse && sd.rinse.name) || "";
    const fib = st.fiber && st.fiber.type ? st.fiber : (secFib || jobFibHere);
    const fibFromJob = !(st.fiber && st.fiber.type) && !!(secFib || jobFibHere);
    const fromWhere = secFib ? "Filled in from the section on the Job Sheet." : "Filled in from the first room.";
    /* Tile: this room's material, otherwise the section's, otherwise the job's (set by the first tile room saved). */
    const MATERIALS = isHardComm ? ["Porcelain", "Ceramic", "VCT", "Vinyl plank", "Concrete"] : ["Porcelain", "Ceramic"];
    const mat = st.material || secMat || q.jobMaterial || "";
    const matFromJob = !st.material && !!(secMat || q.jobMaterial);
    const matWhere = secMat ? "Filled in from the section on the Job Sheet." : "Filled in from the first room.";
    titleEl.textContent = spot.name;
    document.title = spot.name + " · " + name + " · Khean & Clean";
    view.innerHTML =
      '<div class="panel spot">' +
        '<div class="cname">' + esc(name) + '</div>' +
        '<div class="meta">' + esc([q.number, svc].filter(Boolean).join(" · ")) + '</div>' +
        '<div class="svcname">' + esc(spot.name) + '</div>' +
        /* A room: the quoted size as Estimated, plus a box for what was actually measured on site. */
        (spot.isRoom || spot.rug || spot.rugForm   /* rugs too: EST from their size; stretching/pet/stain the same form */
          ? '<div class="sqrow"><div class="svcsub">EST ' + (spot.sqft ? spot.sqft.toLocaleString() + ' sq ft' : '—') + '</div>' +
            '<label class="actual">Actual <input type="number" id="actualSqft" min="0" step="1" inputmode="numeric" placeholder="Measured"' +
            (Number(st.actualSqft) > 0 ? ' value="' + Number(st.actualSqft) + '"' : '') + '></label></div>' +
            /* Staff only: photo checklist -> measure.html works out the floor size -> comes back into Actual. */
            (PUBLIC || !spot.isRoom ? '' : '<a class="measure" id="measureLink" href="./measure.html">' + (st.sketch ? 'Open saved sketch' : 'Measure from photos') + ' &rsaquo;</a>' +
              /* Saved floor sketch from measure.html: small picture + floor type/condition */
              (typeof st.sketchSvg === "string" && st.sketchSvg.startsWith("<svg")
                ? '<img class="skThumb" alt="Floor sketch" src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(st.sketchSvg) + '">' +
                  '<div class="svcsub" style="margin:0 0 10px">' + esc((Number(st.sketchSqft) > 0 ? Number(st.sketchSqft).toLocaleString() + ' sq ft sketch' : 'Sketch') + (st.sketchFloor ? ' · ' + st.sketchFloor : '')) + '</div>'
                : ''))
          : (spot.sqft ? '<div class="svcsub">' + spot.sqft.toLocaleString() + ' sq ft</div>' : '')) +
        /* Fiber type, carpet rooms only. The first room saved sets it for the job, so the other
           rooms open with it filled in; any room can be switched on its own. */
        (isCarpet   /* every carpet page: rooms, stairs, rugs and the carpet add-on pages */
          ? '<div class="fibrow"><label for="fiberSel" class="fiblab">Fiber type</label>' +
            '<select id="fiberSel"><option value="">Pick one</option>' +
            FIBERS.map(f => '<option value="' + f + '"' + (fib && fib.type === f ? ' selected' : '') + '>' + f + '</option>').join("") + '</select>' +
            '<input type="text" id="fiberOther" class="fiberOther" placeholder="Which fiber?" aria-label="Other fiber" value="' + esc(fib && fib.type === "Other" ? fib.other || "" : "") + '"' + (fib && fib.type === "Other" ? '' : ' hidden') + '>' +
            (showHair ? '<label class="hairchk"><input type="checkbox" id="hairChk"' + (hairOn ? ' checked' : '') + '><span>Hair &amp; debris</span></label>' : '') + '</div>' +
            (fibFromJob ? '<p class="fibnote">' + fromWhere + ' Change it if this room is different.</p>' : '')
          : '') +
        /* Material type, tile pages only. The first tile room saved sets it for the job. */
        (isTile
          ? '<div class="fibrow"><label for="materialSel" class="fiblab">Material type</label>' +
            '<select id="materialSel"><option value="">Pick one</option>' +
            MATERIALS.map(m => '<option value="' + m + '"' + (mat === m ? ' selected' : '') + '>' + m + '</option>').join("") + '</select></div>' +
            (matFromJob ? '<p class="fibnote matnote">' + matWhere + ' Change it if this room is different.</p>' : '')
          : '') +
        /* Pre-Spray and Rinse: every page on a carpet or tile line (rooms, stairs, rugs and the
           add-ons with their own photo page). */
        ((isCarpet || isTile) && !spot.noChem   /* Carpet Stretching: no Pre-Spray / Rinse */
          ? '<div class="chemrow">' +
              '<label class="chem">Pre-Spray <input type="text" id="preSpray" value="' + esc(st.preSpray || secPre) + '"></label>' +
              '<label class="chem">Rinse <input type="text" id="rinse" value="' + esc(st.rinse || secRinse) + '"></label>' +
            '</div>'
          : '') +
        (roomExtras.length ? '<h3 class="h3">In this room</h3><div class="room__body">' + roomExtras.map(x => xbox(spot, x)).join("") + '</div>' : '') +
        /* Before and Inspection photos, then the one Notes box, then After photos. */
        '<h3 class="ptitle">Before photos</h3>' + (spot.isRoom ? photoBlock("bThr") + photoBlock("bAdj") : "") + photoBlock("before") +
        '<h3 class="ptitle">Inspection photos</h3>' + photoBlock("inspection") +
        '<h3 class="h3">Notes</h3>' +
        (PUBLIC ? '<div class="notesro">' + esc(st.notes || "") + '</div>' : '') +   /* customer: read-only; none at all when empty */
        '<textarea id="spotNotes" placeholder="What you found, spots to watch, anything for next time">' + esc(st.notes || "") + '</textarea>' +
        '<h3 class="ptitle">After photos</h3>' + (spot.isRoom ? photoBlock("aThr") + photoBlock("aAdj") : "") + photoBlock("after") +
        (PUBLIC ? '' : '<div class="pricebox" id="priceBox"></div>') +
        '<div class="saverow"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' +
      '</div>';

    const note = document.getElementById("note"), saveBtn = document.getElementById("saveBtn");
    const flag = () => { note.textContent = "Not saved yet."; note.classList.remove("err"); };
    view.addEventListener("change", e => {
      const cb = e.target.closest(".xchk input"); if (!cb) return;
      cb.closest(".xchk").classList.toggle("done", cb.checked); flag();
    });
    document.getElementById("spotNotes").addEventListener("input", flag);
    const hairEl = document.getElementById("hairChk");
    if (hairEl) hairEl.addEventListener("change", flag);
    const actualEl = document.getElementById("actualSqft");
    if (actualEl) actualEl.addEventListener("input", flag);
    /* Back from measure.html with ?measured=<sq ft>: drop it in Actual (not saved until Save). */
    const measured = Math.round(Number(qs.get("measured")) || 0);
    if (actualEl && measured > 0) {
      actualEl.value = measured; flag();
      note.textContent = "Measured from photos. Tap Save to keep it.";
      qs.delete("measured");   /* only once, even if the page redraws */
      const clean = new URL(location.href); clean.searchParams.delete("measured");
      history.replaceState(null, "", clean.href);
    }
    const measureLink = document.getElementById("measureLink");
    if (measureLink) measureLink.addEventListener("click", e => {
      e.preventDefault();
      if (/Not saved/.test(note.textContent) && !confirm("This room has changes that aren't saved. Leave anyway?")) return;
      const here = new URL(location.href); here.searchParams.delete("measured");
      /* Hand this room's Before + Inspection photos to the measurer so they don't get taken twice. */
      const lab = { bThr: "Threshold", bAdj: "Threshold adjacent", inspection: "Inspection", before: "Room photo" };
      const roomPhotos = Object.keys(lab).flatMap(g => (groups[g] || []).map(path => ({ path, label: lab[g] }))).slice(0, 8);
      ss.set("kcMeasurePhotos", JSON.stringify({ key: spot.key, id, place, photos: roomPhotos, sketch: typeof st.sketch === "string" ? st.sketch : "" }));
      location.href = "./measure.html?room=" + encodeURIComponent(spot.name) + "&est=" + (Number(spot.sqft) || 0) +
        "&back=" + encodeURIComponent(here.href);
    });
    const otherEl = document.getElementById("fiberOther");
    view.addEventListener("change", e => {
      const r = e.target.id === "fiberSel" ? e.target : null; if (!r) return;
      otherEl.hidden = r.value !== "Other"; if (!otherEl.hidden) otherEl.focus();
      const fn = view.querySelector(".fibnote"); if (fn) fn.remove();   /* this room now has its own pick */
      flag();
    });
    if (otherEl) otherEl.addEventListener("input", flag);
    const matEl = document.getElementById("materialSel");
    if (matEl) matEl.addEventListener("change", () => { const mn = view.querySelector(".matnote"); if (mn) mn.remove(); flag(); });
    const preEl = document.getElementById("preSpray"), rinseEl = document.getElementById("rinse");
    if (preEl) preEl.addEventListener("input", flag);
    if (rinseEl) rinseEl.addEventListener("input", flag);

    /* Favorites for the whole job (q.starred: photo paths). Tap the star to add or remove one; saved right away. */
    const starred = new Set(Array.isArray(q.starred) ? q.starred : []);
    view.addEventListener("click", async e => {
      const s = e.target.closest("[data-star]"); if (!s) return;
      e.preventDefault();
      const p = s.dataset.star, on = !starred.has(p);
      on ? starred.add(p) : starred.delete(p);
      s.classList.toggle("on", on); s.textContent = on ? "★" : "☆"; s.setAttribute("aria-pressed", String(on));
      try { await setDoc(doc(db, place, id), { starred: [...starred] }, { merge: true }); note.textContent = on ? "Starred for review requests." : "Star removed."; note.classList.remove("err"); }
      catch (err) { console.error(err); note.textContent = "Could not save the star: " + err.message; note.classList.add("err"); }
    });
    const draw = async g => {
      const grid = document.getElementById("pgrid-" + g), paths = groups[g];
      const urls = await Promise.all(paths.map(p => getDownloadURL(ref(storage, p)).catch(e => { console.error("Photo " + p, e); return null; })));
      grid.innerHTML = paths.map((p, k) => urls[k]
        ? '<div class="pcell"><a href="' + esc(urls[k]) + '" target="_blank" rel="noopener"><img src="' + esc(urls[k]) + '" alt="" loading="lazy"></a>' +
          '<button type="button" class="px" data-k="' + k + '" aria-label="Remove photo">×</button>' +
          (PUBLIC ? '' : '<button type="button" class="pstar' + (starred.has(p) ? ' on' : '') + '" data-star="' + esc(p) + '" aria-label="Favorite" aria-pressed="' + starred.has(p) + '">' + (starred.has(p) ? '★' : '☆') + '</button>') +
          '</div>' : '').join("") ||
        '<div class="msg">No photos yet.</div>';
      /* Customer view: a photo spot with nothing to show is left out, so the page is just the photos. */
      if (PUBLIC) { const lab = grid.previousElementSibling; const empty = !urls.some(Boolean);
        grid.classList.toggle("pempty", empty); if (lab && lab.classList.contains("plab")) lab.classList.toggle("pempty", empty); }
    };
    /* Customer view: a heading (Before / Inspection / After photos) with no photos under it goes too. */
    Promise.all(SHOWN.map(draw)).then(() => { if (!PUBLIC) return;
      view.querySelectorAll(".ptitle").forEach(h => { let n = h.nextElementSibling, any = false;
        while (n && !n.classList.contains("ptitle") && !n.classList.contains("h3")) { if (n.classList.contains("pgrid") && !n.classList.contains("pempty")) any = true; n = n.nextElementSibling; }
        h.classList.toggle("pempty", !any); }); });
    /* Photos are saved onto the job as soon as they upload, so none are lost if Save isn't pressed. */
    const savePhotos = () => setDoc(doc(db, place, id), { spots: { [spot.key]: { ...photoFields(), updatedAt: serverTimestamp() } } }, { merge: true });
    const upload = async (g, files) => {
      let list = [...(files || [])]; if (!list.length) return;
      if (GROUPS[g].one) list = list.slice(0, 1);   /* one-photo spot: the new one replaces the old */
      note.classList.remove("err");
      for (let k = 0; k < list.length; k++) {
        note.textContent = "Uploading photo " + (k + 1) + " of " + list.length + "…";
        try {
          const blob = await shrink(list[k]);
          /* Same folder as the website's photos (that's what the storage rules allow). */
          const path = "quick-quote-photos/job_" + id + "_" + spot.key + "_" + g + "/" + Date.now() + "_" + k + ".jpg";
          await uploadBytes(ref(storage, path), blob, { contentType: "image/jpeg" });
          if (GROUPS[g].one) groups[g] = [path]; else groups[g].push(path);
        } catch (e) { console.error(e); note.textContent = "A photo didn’t upload: " + e.message; note.classList.add("err"); }
      }
      try { await savePhotos(); if (!note.classList.contains("err")) note.textContent = "Photos saved."; }
      catch (e) { console.error(e); note.textContent = "Photos uploaded but not saved to the job: " + e.message; note.classList.add("err"); }
      draw(g);
    };
    SHOWN.forEach(g => {
      /* Take photo and Add photo(s) both upload the same way. */
      ["pick-", "cap-"].forEach(p => { const inp = document.getElementById(p + g);
        inp.addEventListener("change", () => { upload(g, inp.files); inp.value = ""; }); });
      /* X takes a photo off this room (the file itself stays in storage). */
      document.getElementById("pgrid-" + g).addEventListener("click", async e => {
        const b = e.target.closest(".px"); if (!b) return;
        groups[g].splice(Number(b.dataset.k), 1);
        try { await savePhotos(); note.textContent = "Photo removed."; note.classList.remove("err"); }
        catch (err) { console.error(err); note.textContent = "Could not save: " + err.message; note.classList.add("err"); }
        draw(g);
      });
    });

    const doSave = async () => {
      saveBtn.disabled = true; note.textContent = "Saving…"; note.classList.remove("err");
      try {
        const data = { spots: { [spot.key]: { notes: document.getElementById("spotNotes").value.trim(),
          ...photoFields(), updatedAt: serverTimestamp() } } };
        /* Actual sq ft measured on site (rooms only); blank clears it. */
        if (actualEl) { const n = Math.round(Number(actualEl.value)); data.spots[spot.key].actualSqft = n > 0 ? n : null; }
        /* Pre-Spray and Rinse used in this room (carpet rooms only). */
        /* Same as the section's product: saved blank, so the room keeps following the section. */
        if (preEl) { const v = preEl.value.trim(); data.spots[spot.key].preSpray = v === secPre ? "" : v; }
        if (rinseEl) { const v = rinseEl.value.trim(); data.spots[spot.key].rinse = v === secRinse ? "" : v; }
        /* Hair & debris removal in this room (the Job Sheet prices it). */
        if (hairEl) data.spots[spot.key].hair = hairEl.checked;
        /* Fiber type: saved on this room; the first one saved also becomes the job's, so the
           other carpet rooms open with it filled in. */
        /* Material type (tile): saved on this room; the first one saved becomes the job's. */
        if (matEl) {
          data.spots[spot.key].material = matEl.value && matEl.value !== secMat ? matEl.value : null;   /* same as the section: follow it */
          if (matEl.value && !q.jobMaterial) { data.jobMaterial = matEl.value; q.jobMaterial = matEl.value; }
        }
        if (otherEl) {
          const pick = document.getElementById("fiberSel").value;
          const fiber = pick ? { type: pick, other: pick === "Other" ? otherEl.value.trim() : "" } : null;
          /* Same as the section's fiber: saved blank, so the room keeps following the section. */
          data.spots[spot.key].fiber = secFib && fiber && fiber.type === secFib.type && (fiber.other || "") === (secFib.other || "") ? null : fiber;
          if (fiber && !spot.rug && !(q.jobFiber && q.jobFiber.type)) {   /* a rug never sets the job's fiber */ data.jobFiber = fiber; q.jobFiber = fiber; }
        }
        let next = null;
        if (roomExtras.length) {
          const mine = new Set([...view.querySelectorAll(".room__body .xchk input")].map(x => x.dataset.k));
          const now = [...view.querySelectorAll(".room__body .xchk input:checked")].map(x => x.dataset.k);
          next = [...checks].filter(k => !mine.has(k)).concat(now);
          data.roomChecks = next;
        }
        await setDoc(doc(db, place, id), data, { merge: true });
        if (next) { checks.clear(); next.forEach(k => checks.add(k)); }
        note.textContent = "Saved.";
      } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
      finally { saveBtn.disabled = false; }
      return !note.classList.contains("err");
    };
    saveBtn.addEventListener("click", doSave);
    saveBefore = doSave;   /* Back to Job Sheet saves this room first */

    /* Price and discount for this room / rug / piece, staff only. Uses the Job Sheet's own numbers
       (onsite.lines): a room's discount is rm.disc, anything else's is it.disc on its item, and the
       job's subtotal and total are saved the same way the Job Sheet saves them. */
    const priceBox = document.getElementById("priceBox");
    if (priceBox) {
      const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
      const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const linesSig = ls => JSON.stringify((Array.isArray(ls) ? ls : []).map(l => [l.label, l.cost, (l.items || []).map(it =>
        [it.label, it.cost, !!it.removed, (it.rooms || []).map(r => [r.name, r.sqft, r.qty])])]));
      const DISCS = [0, 10, 25, 50, 75, 100];
      /* Same as the Job Sheet's recalc: each room at the item's rate less its own %, then the line's sq ft add-ons and cost. */
      const recalc = l => {
        let delta = 0, lineSq = 0, any = false;
        (l.items || []).forEach(it => {
          if (it.perSqft == null) return; any = true;
          const old = Number(it.cost) || 0; let sq = 0, c = 0;
          it.rooms.forEach(rm => { rm.cost = r2((Number(rm.sqft) || 0) * it.perSqft * (1 - (Number(rm.disc) || 0) / 100)); sq += Number(rm.sqft) || 0; c += rm.cost; });
          it.cost = r2(c); delta += it.cost - old; lineSq += sq;
          it.label = String(it.label || "").replace(/[\d,]+(\s*sq ft)/i, sq.toLocaleString("en-US") + "$1");
        });
        if (any) (l.items || []).forEach(it => {
          if (it.addonPerSqft == null || it.removed || it.extra) return;
          const old = Number(it.cost) || 0; it.cost = r2(lineSq * it.addonPerSqft); delta += it.cost - old;
          it.label = String(it.label || "").replace(/[\d,]+(\s*sq ft)/i, lineSq.toLocaleString("en-US") + "$1");
        });
        if (any) { l.cost = r2((Number(l.cost) || 0) + delta); l.label = String(l.label || "").replace(/[\d,]+(\s*sq ft)/i, lineSq.toLocaleString("en-US") + "$1"); }
      };
      /* Each rug / spot / piece has its own discount (same fields the Job Sheet uses):
         it.unitDisc = { slot: % }, it.unitFull = one piece's full price. */
      const SPLIT = ["stretch", "pet", "stain"];
      const unitInfo = it => {
        if (!it || it.removed || (Array.isArray(it.rooms) && it.rooms.length)) return null;
        const rg = /^Area Rugs\b/i.test(String(it.label || "")) && noPrice(it.label).match(/^Area Rugs\s*—\s*(.+?)\s*×\s*(\d+)$/i);
        if (rg) { const count = Number(rg[2]) || 0; return { count, slots: Number(it.rugSlots) || count, gone: Array.isArray(it.rugGone) ? it.rugGone : [] }; }
        if ((it.split || SPLIT.includes(it.addonKey)) && Number(it.qty) > 0) return { count: Number(it.qty), slots: Number(it.spotSlots) || Number(it.qty), gone: Array.isArray(it.spotGone) ? it.spotGone : [] };
        return null;
      };
      const unitPrice = (it, r) => r2((Number(it.unitFull) || 0) * (1 - (Number((it.unitDisc || {})[r]) || 0) / 100));
      const unitPass = (l, it) => {
        const u = unitInfo(it); if (!u || !u.count || it.extra) return;
        if (it.unitFull == null && it.disc) {   /* older discount on the whole item: same % on each piece */
          const b = it.baseCost != null ? Number(it.baseCost) : (Number(it.cost) || 0);
          it.unitFull = r2(b / u.count); it.unitDisc = {};
          for (let r = 0; r < u.slots; r++) if (!u.gone.includes(r)) it.unitDisc[r] = it.disc;
          delete it.disc; delete it.baseCost;
        }
        if (it.unitFull == null) return;
        let c = 0; for (let r = 0; r < u.slots; r++) if (!u.gone.includes(r)) c += unitPrice(it, r);
        c = r2(c); l.cost = r2((Number(l.cost) || 0) - (Number(it.cost) || 0) + c); it.cost = c;
      };
      const locked = place === "invoices" || place === "paidInvoices";
      const info = () => {
        const ol = q.onsite && Array.isArray(q.onsite.lines) ? q.onsite.lines : null;
        const fresh = !!ol && (!q.onsite.from || q.onsite.from === linesSig(q.lines));
        const l = ol && ol[lineNo], it = l && Array.isArray(l.items) ? l.items[itemNo] : null;
        if (!it || it.removed || it.track || (Array.isArray(it.grayed) && it.grayed.includes(String(spot.key)))) return null;
        if (spot.isRoom) {
          const rm = (it.rooms || []).find(r => r.id === spot.key);
          if (!rm || it.perSqft == null) return null;
          return { ol, l, it, rm, fresh, price: Number(rm.cost) || 0, full: r2((Number(rm.sqft) || 0) * it.perSqft), disc: Number(rm.disc) || 0, n: 1 };
        }
        if ((Array.isArray(it.rooms) && it.rooms.length) || it.perSqft != null) return null;
        /* A rug, stain or pet spot: its own price and its own discount. */
        if (roomNo != null) {
          const u = unitInfo(it);
          if (!u || !u.count) { const n = Math.max(1, (rug && Number(rug[2])) || estSplit(it) || 1);   /* not split on the Job Sheet yet */
            return { ol, l, it, rm: null, fresh: false, price: r2((Number(it.cost) || 0) / n), full: r2((Number(it.cost) || 0) / n), disc: 0, n: 1 }; }
          unitPass(l, it);
          const full = it.unitFull != null ? Number(it.unitFull) : r2((Number(it.cost) || 0) / u.count);
          const d = Number((it.unitDisc || {})[roomNo]) || 0;
          return { ol, l, it, rm: null, unit: roomNo, fresh, price: r2(full * (1 - d / 100)), full, disc: d, n: 1, kept: !!it.kept || !!it.extra };
        }
        const base = it.baseCost != null ? Number(it.baseCost) : (Number(it.cost) || 0);
        return { ol, l, it, rm: null, fresh, price: Number(it.cost) || 0, full: base, disc: Number(it.disc) || 0, n: 1, kept: !!it.kept };
      };
      const paint = msg => {
        const p = info();
        if (!p) { priceBox.innerHTML = '<div class="pnote">No price on this one by itself — it’s on the Job Sheet.</div>'; return; }
        const can = p.fresh && !locked && !p.kept;
        const opts = (DISCS.includes(p.disc) ? DISCS : DISCS.concat(p.disc).sort((a, b) => a - b)).map(v =>
          '<option value="' + v + '"' + (v === p.disc ? ' selected' : '') + '>' + (v ? v + "% off" + (v === 100 ? " (free)" : "") : "No discount") + '</option>').join("") +
          '<option value="other">Other %…</option>';
        priceBox.innerHTML =
          '<div class="prow"><span>Price</span><span class="pval">' + money(p.price) + '</span></div>' +
          (p.disc ? '<div class="psub">' + money(p.full) + ' before ' + p.disc + '% off</div>' : '') +
          '<label class="pdisc">Discount <select id="discSel"' + (can ? '' : ' disabled') + '>' + opts + '</select></label>' +
          (!p.fresh ? '<div class="pnote">Open the Job Sheet once to bring its prices up to date, then come back to discount.</div>'
            : locked ? '<div class="pnote">Invoiced or paid: the price is locked.</div>' : '') +
          (msg ? '<div class="pnote">' + esc(msg) + '</div>' : '');
      };
      paint();
      priceBox.addEventListener("change", async e => {
        const s = e.target.closest("#discSel"); if (!s) return;
        const p = info(); if (!p || !p.fresh || locked || p.kept) { paint(); return; }
        let v = Number(s.value);
        if (s.value === "other") { const a = prompt("Percent off (0 to 100):", ""); v = Number(String(a || "").replace(/[^\d.]/g, ""));
          if (a == null || !isFinite(v) || String(a).trim() === "") { paint(); return; } }
        v = Math.max(0, Math.min(100, Math.round(v * 100) / 100));
        const { ol, l, it, rm } = p;
        if (rm) { if (v) rm.disc = v; else delete rm.disc; recalc(l); }
        else if (p.unit != null) {   /* just this rug / spot / piece */
          if (it.unitFull == null) it.unitFull = p.full;
          it.unitDisc = it.unitDisc || {};
          if (v) it.unitDisc[p.unit] = v; else delete it.unitDisc[p.unit];
          unitPass(l, it); }
        else { const b = it.baseCost != null ? Number(it.baseCost) : (Number(it.cost) || 0), c = r2(b * (1 - v / 100));
          l.cost = r2((Number(l.cost) || 0) - (Number(it.cost) || 0) + c); it.cost = c;
          if (v) { it.baseCost = b; it.disc = v; } else { delete it.baseCost; delete it.disc; } }
        /* Subtotal and total the Job Sheet's way: lines, the approved quote's own discount, then the job discount. */
        const jd = q.onsite.jobDisc || {}, amt = Math.max(0, Number(jd.amt) || 0), pct = Math.min(100, Math.max(0, Number(jd.pct) || 0));
        const sub = r2(ol.reduce((a, x) => a + (Number(x.cost) || 0), 0));
        const adj = r2((Number(q.total) || 0) - (Number(q.subtotal) || Number(q.total) || 0) - (sub * pct / 100 + amt));
        s.disabled = true;
        try {
          await setDoc(doc(db, place, id), { onsite: { lines: ol, subtotal: sub, total: r2(sub + adj), discount: r2(Math.max(0, -adj)),
            jobDisc: { amt, pct }, from: q.onsite.from || linesSig(q.lines), updatedAt: serverTimestamp() } }, { merge: true });
          paint("Discount saved.");
        } catch (err) { console.error(err); paint("Could not save the discount: " + err.message); }
      });
    }   /* Back to Job Sheet saves this room first */
  }

  const sub = picked.map(it => { const [a, b] = splitLabel(it.label || ""); return b ? a + " · " + b : a; }).filter(Boolean).join("  |  ");
  view.innerHTML =
    '<div class="panel">' +
      '<div class="cname">' + esc(name) + '</div>' +
      '<div class="meta">' + esc(q.number || "") + '</div>' +
      '<div class="svcname">' + esc(svc) + '</div>' +
      (sub ? '<div class="svcsub">' + esc(sub) + '</div>' : '') +
      (rooms.length
        ? '<div class="rooms">' + rooms.map((r, k) =>
            '<section class="room" id="room-' + (k + 1) + '">' +
              '<a class="room__name" href="./job-room.html?id=' + encodeURIComponent(id) + '&line=' + lineNo + '&item=' + r.j + '&room=' + r.r + '">' + esc(r.name) + ' ›</a>' +
              (r.sqft ? '<div class="room__size">' + r.sqft.toLocaleString() + ' sq ft</div>' : '') +
              '<div class="room__body">' + extras.map(x => xbox(r, x)).join("") + '</div>' +
            '</section>').join("") + '</div>' +
          (extras.length ? '<div class="saverow"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' : '')
        : '<div class="msg">No room breakdown on this line (it was measured by square feet, or it’s an add-on).</div>') +
    '</div>';

  const saveBtn = document.getElementById("saveBtn"), note = document.getElementById("note");
  if (!saveBtn) return;
  view.addEventListener("change", e => {
    const cb = e.target.closest(".xchk input"); if (!cb) return;
    cb.closest(".xchk").classList.toggle("done", cb.checked);
    note.textContent = "Not saved yet."; note.classList.remove("err");
  });
  /* Ticks on this page replace this page's keys only; other lines' ticks are kept. */
  const doSave = async () => {
    saveBtn.disabled = true; note.textContent = "Saving…"; note.classList.remove("err");
    try {
      const mine = new Set([...view.querySelectorAll(".xchk input")].map(x => x.dataset.k));
      const kept = [...checks].filter(k => !mine.has(k));
      const now = [...view.querySelectorAll(".xchk input:checked")].map(x => x.dataset.k);
      const next = kept.concat(now);
      await setDoc(doc(db, place, id), { roomChecks: next, roomChecksAt: serverTimestamp() }, { merge: true });
      checks.clear(); next.forEach(k => checks.add(k));
      note.textContent = "Saved.";
    } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
    finally { saveBtn.disabled = false; }
    return !note.classList.contains("err");
  };
  saveBtn.addEventListener("click", doSave);
  if (!PUBLIC) saveBefore = doSave;   /* customer: Back just goes back */
}

/* Back to Job Sheet saves first (when the page has something to save), then goes back.
   If the save fails it stays here with the error showing, so nothing typed is lost. */
let saveBefore = null;
document.getElementById("backBtn").addEventListener("click", async e => {
  if (!saveBefore) return;
  e.preventDefault();
  const a = e.currentTarget, href = a.href;
  a.style.pointerEvents = "none"; a.textContent = "Saving…";
  const ok = await saveBefore();
  if (ok) { location.href = href; return; }
  a.style.pointerEvents = ""; a.textContent = "Back to Job Sheet";
});
/* Refresh: saves first (same as Back to Job Sheet) when there's something to save, then reloads. */
document.getElementById("refreshBtn").addEventListener("click", async e => {
  const b = e.currentTarget; b.disabled = true;
  if (saveBefore) { b.textContent = "Saving…"; if (!(await saveBefore())) { b.disabled = false; b.textContent = "Refresh"; return; } }
  location.reload();
});

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
if (PUBLIC) { document.getElementById("authwait")?.remove(); started = true; show(); }   /* customer: no sign-in, nothing saves */
else onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=job-room.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; startOffline(storage); show(); }
});
</script>
<script>
/* Photo viewer: tapping a photo opens it big inside the page (not the bare file), with
   X to close, ‹ › and swipe to go through every photo on this page, and Download to save it. */
(function () {
  var box = null, list = [], at = 0, sx = null;
  function build() {
    box = document.createElement("div");
    box.id = "pview";
    box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Photo");
    box.style.cssText = "position:fixed;inset:0;z-index:80;background:rgba(5,8,14,.94);display:none;align-items:center;justify-content:center;touch-action:pan-y";
    box.innerHTML =
      '<img id="pvImg" alt="" style="max-width:96vw;max-height:80vh;object-fit:contain;border-radius:6px">' +
      '<button type="button" id="pvX" aria-label="Close" style="position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;font-size:26px;cursor:pointer">×</button>' +
      '<button type="button" id="pvPrev" aria-label="Previous photo" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:44px;height:60px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:30px;cursor:pointer">‹</button>' +
      '<button type="button" id="pvNext" aria-label="Next photo" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:60px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:30px;cursor:pointer">›</button>' +
      '<div style="position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:14px;color:#fff;font:600 14px system-ui,sans-serif">' +
        '<span id="pvN"></span>' +
        '<button type="button" id="pvDl" style="border:0;border-radius:8px;background:#E3B64A;color:#172239;font:700 15px system-ui,sans-serif;padding:10px 18px;cursor:pointer">Download</button></div>';
    document.body.appendChild(box);
    document.getElementById("pvX").onclick = close;
    document.getElementById("pvPrev").onclick = function () { go(-1); };
    document.getElementById("pvNext").onclick = function () { go(1); };
    document.getElementById("pvDl").onclick = download;
    box.addEventListener("click", function (e) { if (e.target === box) close(); });
    box.addEventListener("touchstart", function (e) { sx = e.touches[0].clientX; }, { passive: true });
    box.addEventListener("touchend", function (e) {
      if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
    });
  }
  function paint() {
    document.getElementById("pvImg").src = list[at];
    document.getElementById("pvN").textContent = list.length > 1 ? (at + 1) + " of " + list.length : "";
    document.getElementById("pvPrev").style.display = document.getElementById("pvNext").style.display = list.length > 1 ? "" : "none";
  }
  function go(d) { at = (at + d + list.length) % list.length; paint(); }
  function open(url) {
    if (!box) build();
    list = Array.prototype.map.call(document.querySelectorAll(".pcell a[href]"), function (a) { return a.href; });
    at = Math.max(0, list.indexOf(url)); if (!list.length) list = [url];
    paint(); box.style.display = "flex"; document.body.style.overflow = "hidden";
  }
  function close() { box.style.display = "none"; document.body.style.overflow = ""; }
  function download() {
    var url = list[at], name = "khean-clean-photo-" + (at + 1) + ".jpg", b = document.getElementById("pvDl");
    b.textContent = "Saving…";
    fetch(url).then(function (r) { return r.blob(); }).then(function (blob) {
      var file = new File([blob], name, { type: blob.type || "image/jpeg" });
      /* Phones: the share sheet has "Save Image". Computers: a normal download. */
      if (navigator.canShare && navigator.canShare({ files: [file] })) return navigator.share({ files: [file] }).catch(function () {});
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }).catch(function () { window.open(url, "_blank"); })
      .then(function () { b.textContent = "Download"; });
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest(".pcell a[href]");
    if (!a || e.target.closest(".px,.pstar")) return;
    e.preventDefault(); open(a.href);
  });
  document.addEventListener("keydown", function (e) {
    if (!box || box.style.display === "none") return;
    if (e.key === "Escape") close(); else if (e.key === "ArrowRight") go(1); else if (e.key === "ArrowLeft") go(-1);
  });
})();
</script>
