<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Promotions</title>
<style>
/* Promotions (Player Tracker): set up promotions (free play, food comp, hourly money, anything else) and give them
   to players. Hourly money counts a player's hours today on the games you pick for it.
   Data: playerTracker/promos { id: { name, type, amount, games: [..], at } },
         playerTracker/promoGiven { id: { card, name, promo, promoName, amount, note, at } }. Staff only. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:1400px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gold)}
h2{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.ok{background:var(--ok)}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px;margin-top:14px;align-items:start}
.box{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:12px 14px}
input,select{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:9px 10px;font:inherit;min-width:0}
.f{display:grid;gap:8px}
.f .r{display:flex;gap:8px;flex-wrap:wrap}
.f .r>*{flex:1}
.lbl{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.hint{color:rgba(255,255,255,.6);font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.12);white-space:nowrap}
.tag.freeplay{background:rgba(74,222,128,.18);color:var(--ok)}
.tag.food{background:rgba(251,146,60,.2);color:#fdba74}
.tag.hourly{background:rgba(56,189,248,.18);color:#7dd3fc}
.x{background:none;border:0;color:rgba(255,255,255,.5);font-size:20px;line-height:1;cursor:pointer;padding:0 4px}
.chk{display:flex;flex-wrap:wrap;gap:6px}
.chk label{display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--gold)}
.empty{color:rgba(255,255,255,.6);font-size:14px;padding:8px 0}
.amt{font-weight:800;color:var(--gold);white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./player-tracker-hub.html">&lsaquo; Player Tracker</a><h1>Promotions</h1></div>
  <div class="warn" id="warn">Not syncing with the server.</div>
  <div class="grid">
    <!-- Give a promotion to a player -->
    <div class="box f">
      <h2>Give a promotion</h2>
      <input id="gName" list="gPlayers" placeholder="Player name" autocomplete="off"><datalist id="gPlayers"></datalist>
      <select id="gPromo"></select>
      <div class="r"><input id="gAmt" inputmode="decimal" placeholder="Amount $ (optional)"><input id="gNote" placeholder="Note (optional)"></div>
      <button class="btn" id="gGive">Give</button>
      <div class="hint" id="gMsg"></div>
    </div>
    <!-- Promotions: the list, and + New -->
    <div class="box">
      <h2>Promotions</h2>
      <div id="pList"></div>
      <div class="f" style="margin-top:10px;border-top:1px solid rgba(255,255,255,.12);padding-top:10px">
        <div class="lbl">New promotion</div>
        <input id="nName" placeholder="Name, e.g. $50 Free Play">
        <div class="r"><select id="nType"><option value="freeplay">Free play</option><option value="food">Food comp</option><option value="hourly">Hourly money</option><option value="other">Other</option></select>
          <input id="nAmt" inputmode="decimal" placeholder="Amount $"></div>
        <div id="nGamesBox" hidden><div class="lbl" style="margin-bottom:4px">Counts on these games</div><div class="chk" id="nGames"></div></div>
        <div class="hint" id="nHint"></div>
        <button class="btn" id="nAdd">+ Add promotion</button>
        <div class="r" style="gap:6px"><button class="btn ghost sm" data-quick="fp">$50 Free Play</button><button class="btn ghost sm" data-quick="food">Food comp</button><button class="btn ghost sm" data-quick="hr">$1 an hour (poker)</button></div>
      </div>
    </div>
    <!-- Hourly money: earned today -->
    <div class="box"><h2>Hourly money today</h2><div id="hList"></div></div>
    <!-- Recently given -->
    <div class="box"><h2>Given</h2><div id="givenList"></div></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc as fsDoc, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { ROSTER, CASINO, casinoDoc } from "./pt-people.js";
import { TABLE_GAMES } from "./pg-menu.js";
const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), ROSTREF = doc(db, "playerTracker", "roster"), PROFREF = doc(db, "playerTracker", "profiles");
const LISTREF = doc(db, "playerTracker", "tablelist");
const PROMREF = doc(db, "playerTracker", "promos"), GIVEREF = doc(db, "playerTracker", "promoGiven");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const money = n => "$" + (Math.round(n * 100) / 100).toFixed(n % 1 ? 2 : 0);
const fail = () => { $("warn").style.display = "block"; };
let state = {}, roster = {}, profiles = {}, tlist = {}, promos = {}, given = {};
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || c;
const isPlayer = c => !!(ROSTER[c] || roster[c]);
const TYPE = { freeplay: "Free play", food: "Food comp", hourly: "Hourly", other: "Other" };

/* Games a table can run: Poker (any poker table) and each table game. The table's game decides whose hours count. */
const BASE_GAME = CASINO !== "edh" ? {} : { 1: "Blackjack", 2: "Baccarat", 3: "Poker", 4: "Three Card Poker", 5: "Ultimate Texas Hold'em" };
const tableGame = n => { const t = tlist[n] || {}; if (t.deleted) return ""; if (t.variant) return "Poker"; return t.game || BASE_GAME[n] || ""; };
const gameChoices = () => [...new Set(["Poker", ...Object.values(TABLE_GAMES), ...Object.keys({ ...BASE_GAME, ...tlist }).map(tableGame).filter(Boolean)])];
/* Hours today (same clock as the Player Tracker: banked time plus the running session). */
const liveMs = p => (p.totalMs || 0) + (p.status === "seated" && p.since ? Date.now() - p.since : 0);
const fmtHrs = ms => { const m = Math.floor(ms / 60000); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };

function draw() {
  /* Promotions list */
  const P = Object.entries(promos).filter(([, v]) => v && v.name).sort((a, b) => (a[1].at || 0) - (b[1].at || 0));
  $("pList").innerHTML = P.length ? P.map(([id, v]) => `<div class="row"><div class="nm"><b>${esc(v.name)}</b>
      <span>${v.type === "hourly" ? money(+v.amount || 0) + " an hour" + (v.games && v.games.length ? " &middot; " + v.games.map(esc).join(", ") : " &middot; pick games") : v.amount ? money(+v.amount) : ""}</span></div>
      <span class="tag ${esc(v.type)}">${TYPE[v.type] || "Other"}</span><button class="x" data-pdel="${esc(id)}" title="Delete">&times;</button></div>`).join("")
    : `<div class="empty">No promotions yet. Add one below.</div>`;
  /* Give: promotion picker */
  const cur = $("gPromo").value;
  $("gPromo").innerHTML = `<option value="">Pick a promotion</option>` + P.map(([id, v]) => `<option value="${esc(id)}"${id === cur ? " selected" : ""}>${esc(v.name)}</option>`).join("");
  const pl = [...new Set(Object.keys({ ...ROSTER, ...roster }).map(nameOf))].sort();
  if ($("gPlayers").childElementCount !== pl.length) $("gPlayers").innerHTML = pl.map(n => `<option value="${esc(n)}">`).join("");
  /* New: games checkboxes (keep what's ticked) */
  const ticked = new Set([...$("nGames").querySelectorAll("input:checked")].map(i => i.value));
  const gc = gameChoices();
  if ($("nGames").dataset.k !== gc.join("|")) { $("nGames").dataset.k = gc.join("|"); $("nGames").innerHTML = gc.map(g => `<label><input type="checkbox" value="${esc(g)}"${ticked.has(g) ? " checked" : ""}>${esc(g)}</label>`).join(""); }
  /* Hourly money today: each hourly promotion, players with hours today at a table running one of its games. */
  const H = P.filter(([, v]) => v.type === "hourly");
  $("hList").innerHTML = H.length ? H.map(([id, v]) => {
    const games = new Set(v.games || []), rate = +v.amount || 0;
    const rows = Object.entries(state).filter(([c, p]) => isPlayer(c) && p && liveMs(p) > 0 && games.has(tableGame(p.table || 1)))
      .map(([c, p]) => ({ c, ms: liveMs(p), g: tableGame(p.table || 1), t: p.table || 1 })).sort((a, b) => b.ms - a.ms);
    return `<div class="lbl" style="margin-top:6px">${esc(v.name)}</div>` + (rows.length ? rows.map(r => {
      const amt = Math.floor(r.ms / 3600000 * rate * 100) / 100;
      return `<div class="row"><div class="nm"><b>${esc(nameOf(r.c))}</b><span>Table ${r.t} &middot; ${esc(r.g)} &middot; ${fmtHrs(r.ms)}</span></div>
        <span class="amt">${money(amt)}</span><button class="btn sm ok" data-hgive="${esc(r.c)}" data-p="${esc(id)}" data-amt="${amt}" ${amt > 0 ? "" : "disabled"}>Give</button></div>`;
    }).join("") : `<div class="empty">Nobody has hours today on ${esc([...games].join(", ") || "its games")}.</div>`);
  }).join("") : `<div class="empty">No hourly promotions yet.</div>`;
  /* Given, newest first */
  const G = Object.entries(given).filter(([, v]) => v && v.at).sort((a, b) => b[1].at - a[1].at).slice(0, 40);
  $("givenList").innerHTML = G.length ? G.map(([id, v]) => `<div class="row"><div class="nm"><b>${v.card ? `<a href="./player-tracker.html?profile=${encodeURIComponent(v.card)}" style="color:inherit">${esc(v.name)}</a>` : esc(v.name)}</b>
      <span>${esc(v.promoName)}${v.note ? " &middot; " + esc(v.note) : ""} &middot; ${new Date(v.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span></div>
      ${v.amount ? `<span class="amt">${money(+v.amount)}</span>` : ""}<button class="x" data-gdel="${esc(id)}" title="Undo">&times;</button></div>`).join("")
    : `<div class="empty">Nothing given yet.</div>`;
}

/* New promotion */
const showGames = () => { const h = $("nType").value === "hourly"; $("nGamesBox").hidden = !h; $("nAmt").placeholder = h ? "$ per hour" : "Amount $"; };
$("nType").onchange = showGames;
const addPromo = (name, type, amount, games) => {
  const id = "p" + Date.now(); promos[id] = { name, type, amount: amount || 0, games: games || [], at: Date.now() };
  setDoc(PROMREF, { [id]: promos[id] }, { merge: true }).catch(fail); draw();
};
$("nAdd").onclick = () => {
  const name = $("nName").value.trim(), type = $("nType").value, amount = parseFloat($("nAmt").value.replace(/[$,]/g, "")) || 0;
  const games = [...$("nGames").querySelectorAll("input:checked")].map(i => i.value);
  if (!name) { $("nName").focus(); return; }
  if (type === "hourly" && (!amount || !games.length)) { $("nHint").textContent = "Hourly money needs an amount per hour and at least one game."; return; }
  $("nHint").textContent = ""; addPromo(name, type, amount, type === "hourly" ? games : []);
  $("nName").value = $("nAmt").value = ""; $("nGames").querySelectorAll("input").forEach(i => i.checked = false);
};
document.addEventListener("click", e => {
  const q = e.target.closest("[data-quick]");
  if (q) { const k = q.dataset.quick;
    if (k === "fp") addPromo("$50 Free Play", "freeplay", 50);
    if (k === "food") addPromo("Food comp", "food", 0);
    if (k === "hr") addPromo("$1 an hour", "hourly", 1, ["Poker"]);
    return; }
  const pd = e.target.closest("[data-pdel]");
  if (pd) { const v = promos[pd.dataset.pdel]; if (!confirm("Delete the promotion \"" + (v && v.name) + "\"? Ones already given stay in the Given list.")) return;
    delete promos[pd.dataset.pdel]; setDoc(PROMREF, { [pd.dataset.pdel]: deleteField() }, { merge: true }).catch(fail); draw(); return; }
  const gd = e.target.closest("[data-gdel]");
  if (gd) { const v = given[gd.dataset.gdel]; if (!confirm("Undo " + (v && v.promoName) + " for " + (v && v.name) + "?")) return;
    delete given[gd.dataset.gdel]; setDoc(GIVEREF, { [gd.dataset.gdel]: deleteField() }, { merge: true }).catch(fail); draw(); return; }
  const hg = e.target.closest("[data-hgive]");
  if (hg) { give(hg.dataset.hgive, nameOf(hg.dataset.hgive), hg.dataset.p, +hg.dataset.amt, "Hourly"); return; }
});
/* Give */
function give(card, name, pid, amount, note) {
  const v = promos[pid]; if (!v) return;
  const id = "g" + Date.now() + Math.random().toString(36).slice(2, 5);
  given[id] = { card: card || "", name, promo: pid, promoName: v.name, amount: amount || 0, note: note || "", at: Date.now() };
  setDoc(GIVEREF, { [id]: given[id] }, { merge: true }).catch(fail); draw();
}
$("gPromo").onchange = () => { const v = promos[$("gPromo").value]; $("gAmt").value = v && v.type !== "hourly" && v.amount ? v.amount : ""; };
$("gGive").onclick = () => {
  const name = $("gName").value.trim(), pid = $("gPromo").value;
  if (!name) { $("gName").focus(); return; }
  if (!pid) { $("gMsg").textContent = "Pick a promotion."; return; }
  const card = Object.keys({ ...ROSTER, ...roster }).find(c => nameOf(c).toLowerCase() === name.toLowerCase()) || "";
  give(card, card ? nameOf(card) : name, pid, parseFloat($("gAmt").value.replace(/[$,]/g, "")) || 0, $("gNote").value.trim());
  $("gMsg").textContent = "Gave " + promos[pid].name + " to " + (card ? nameOf(card) : name) + (card ? "." : " (not a saved player).");
  $("gName").value = $("gNote").value = $("gAmt").value = ""; $("gPromo").value = "";
};

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  /* No login for now (Player Tracker is open to anyone with the link while testing). */
  document.body.style.visibility = "visible";
  draw(); showGames();
  const on = (ref, set) => onSnapshot(ref, snap => { $("warn").style.display = "none"; set(snap.exists() ? snap.data() : {}); draw(); }, fail);
  on(REF, v => state = v); on(LISTREF, v => tlist = v); on(PROMREF, v => promos = v); on(GIVEREF, v => given = v);
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  setInterval(draw, 60000);   // keep hourly money ticking
});
</script>
</body>
</html>
