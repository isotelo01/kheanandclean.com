<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in &middot; K&amp;C Estimator</title>
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{ --navy:#0d1b2a; --gold:#e0b64a; --cream:#f4f1ea; }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100svh; display:grid; place-items:center;
  background:var(--navy); color:var(--cream);
  font:400 16px "Archivo",system-ui,-apple-system,sans-serif; padding:24px; }
.box{ width:100%; max-width:360px; text-align:center; }
.box img{ width:64px; height:64px; object-fit:contain; margin-bottom:14px; }
h1{ font:700 1.35rem "Playfair Display",serif; margin:0 0 4px; }
.sub{ margin:0 0 22px; font-size:.9rem; color:rgba(244,241,234,.62); }
label{ display:block; text-align:left; font-size:.72rem; letter-spacing:.09em;
  text-transform:uppercase; color:rgba(244,241,234,.6); margin:0 0 5px; }
input{ width:100%; background:rgba(255,255,255,.05); color:var(--cream);
  border:1px solid rgba(255,255,255,.22); border-radius:10px;
  padding:.72rem .85rem; font:inherit; margin-bottom:14px; }
input:focus{ outline:none; border-color:var(--gold); }
button{ width:100%; background:var(--gold); color:var(--navy); border:0;
  border-radius:999px; padding:.8rem; font:700 1rem "Archivo",sans-serif;
  cursor:pointer; letter-spacing:.04em; }
button[disabled]{ opacity:.6; cursor:default; }
.err{ min-height:1.2em; margin:14px 0 0; font-size:.86rem; color:#ff9b8a; }
.err.ok{ color:#9fd8b8; }
.linkbtn{ width:auto; background:none; color:rgba(244,241,234,.7); padding:4px 2px; margin-top:14px;
  border-radius:0; font:500 .85rem "Archivo",sans-serif; letter-spacing:0; text-decoration:underline; }
.linkbtn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
.back{ display:inline-block; margin-top:20px; font-size:.85rem;
  color:rgba(244,241,234,.55); text-decoration:none; }
</style>
</head>
<body>
<div class="box">
  <img src="../images/icon-180.png" alt="">
  <h1>Khean &amp; Clean</h1>
  <p class="sub">Sign in to the estimator</p>

  <form id="loginForm" autocomplete="on">
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="goBtn">Sign in</button>
  </form>
  <button type="button" class="linkbtn" id="forgotBtn">Forgot password?</button>

  <p class="err" id="err"></p>
  <a class="back" href="../index.html">Back to the website</a>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, setPersistence,
         browserLocalPersistence, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const auth = getAuth(initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
}));

/* Where to land after signing in. ?next=dashboard.html sends you there instead.
   Only a local page name is accepted, so the link can't bounce you off-site. */
const next = (() => {
  const raw = new URLSearchParams(location.search).get("next") || "index.html";
  return /^[\w.-]+\.html$/.test(raw) ? raw : "index.html";
})();

const form = document.getElementById("loginForm");
const btn  = document.getElementById("goBtn");
const err  = document.getElementById("err");

/* Already signed in? Don't make them do it twice. */
onAuthStateChanged(auth, user => { if (user) location.replace("./" + next); });

const SAYS = {
  "auth/invalid-email":       "That email doesn't look right.",
  "auth/invalid-credential":  "Email or password is wrong.",
  "auth/wrong-password":      "Email or password is wrong.",
  "auth/user-not-found":      "Email or password is wrong.",
  "auth/too-many-requests":   "Too many tries. Wait a minute and try again.",
  "auth/network-request-failed": "No connection. Check your network."
};

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = ""; err.classList.remove("ok");
  btn.disabled = true; btn.textContent = "Signing in\u2026";
  try {
    /* Local persistence: stays signed in after the tab closes. */
    await setPersistence(auth, browserLocalPersistence);
    await signInWithEmailAndPassword(auth,
      document.getElementById("email").value.trim(),
      document.getElementById("pw").value);
    location.replace("./" + next);
  } catch (ex) {
    console.error(ex);
    err.textContent = SAYS[ex.code] || "Could not sign in. Try again.";
    btn.disabled = false; btn.textContent = "Sign in";
  }
});

/* Forgot password: Firebase emails a reset link to whatever is in the Email box.
   The message is the same whether or not the address has an account, so the
   page never reveals which emails are registered. */
const forgot = document.getElementById("forgotBtn");
forgot.addEventListener("click", async () => {
  const emailEl = document.getElementById("email");
  const email = emailEl.value.trim();
  err.classList.remove("ok");
  if (!email) { err.textContent = "Type your email above first, then tap Forgot password."; emailEl.focus(); return; }
  forgot.disabled = true;
  try {
    await sendPasswordResetEmail(auth, email);
    err.classList.add("ok");
    err.textContent = "If that email has an account, a reset link is on its way. Check spam too.";
  } catch (ex) {
    console.error(ex);
    if (ex.code === "auth/user-not-found") {
      err.classList.add("ok");
      err.textContent = "If that email has an account, a reset link is on its way. Check spam too.";
    } else {
      err.textContent = SAYS[ex.code] || "Could not send the reset email. Try again.";
    }
  }
  forgot.disabled = false;
});
</script>
</body>
</html>
