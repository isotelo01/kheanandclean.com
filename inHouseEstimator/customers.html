<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Customers &middot; Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Playfair Display",Georgia,serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.bar{display:flex;gap:8px;margin-bottom:10px}
.bar input{flex:1;min-width:200px;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.count{color:var(--muted);font-size:14px;margin-bottom:10px}
.list{display:grid;gap:10px}
.col{display:grid;gap:10px;align-content:start;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:14px}
.col .colhead{grid-column:1/-1}
.colhead{font:700 13px "Archivo",system-ui,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:4px 0 2px}
.row{display:block;text-decoration:none;color:inherit;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:14px 16px}
.row:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
.who{font-weight:700}
.meta{color:var(--muted);font-size:14px}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.panel h2{font:700 20px "Playfair Display",Georgia,serif;margin:24px 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.panel h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.addr .grid{grid-template-columns:2fr 1.2fr .6fr .8fr}
@media(max-width:620px){.grid,.addr .grid{grid-template-columns:1fr}}
label{display:block;font-size:13px;font-weight:600;color:var(--muted)}
label input,label textarea{display:block;width:100%;margin-top:4px;font:16px "Archivo";padding:9px 11px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
textarea{min-height:90px;resize:vertical}
.addr{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.read{display:grid;gap:10px;margin-bottom:4px}
.rrow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:baseline}
@media(max-width:620px){.rrow{grid-template-columns:1fr;gap:2px}}
.rlab{font-size:13px;font-weight:600;color:var(--muted)}
.rval{font-size:16px;color:var(--ink);white-space:pre-wrap}
.rval.empty{color:var(--muted)}
.photos{border:2px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
.jobs{color:var(--muted);font-size:14px}
.job{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;text-decoration:none;color:inherit}
.job:hover{border-color:var(--gold);background:#fbfaf7}
.job__date{flex:0 0 110px;color:var(--muted);font-size:13px}
.job__no{flex:1 1 auto;font-weight:600}
.job__total{flex:0 0 auto;font-weight:700}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.new:disabled{opacity:.6;cursor:default}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
.note a{color:var(--navy);font-weight:600}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font:600 12px "Archivo";border-radius:999px;padding:2px 9px;white-space:nowrap}
.t-residential{background:#e6eef9;color:#1f4f8f}
.t-pm{background:#e3f1ea;color:var(--green)}
.t-realtor{background:#fbf1d8;color:#8a6412}
.t-commercial{background:#f4e4e1;color:var(--red)}
label[hidden]{display:none}
label select{display:block;width:100%;margin-top:4px;font:16px "Archivo";padding:9px 11px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./index.html" aria-label="Estimator home"><img src="../images/icon-180.png" alt=""></a>
    <h1 id="title">Customers</h1>
    <div style="display:flex;gap:10px;align-items:center;margin-left:auto">
      <a class="ghost" href="./dashboard.html">Dashboard</a>
      <a class="ghost" href="#trash">Trash</a>
      <a class="new" href="#new">Add customer</a>
    </div>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, query, where, limit, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);

const view = document.getElementById("view"), titleEl = document.getElementById("title");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s || "").replace(/\D/g, "");

/* Match keys. send.js uses the same two rules, so auto-filed and hand-added customers line up. */
const phoneKey = s => { const d = digits(s).slice(-10); return d.length === 10 ? d : ""; };
const emailKey = s => String(s || "").trim().toLowerCase();

function randomId(){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => abc[b % abc.length]).join("");
}
const addrLine = a => [a.street, [a.city, a.state].filter(Boolean).join(", "), a.zip].filter(Boolean).join(" ");
const cityLine = a => [[a.city, a.state].filter(Boolean).join(", "), a.zip].filter(Boolean).join(" ");
/* Contact type. No type on file = residential (covers everyone imported before this). */
const TYPES = [
  { v: "residential", label: "Residential",         cls: "t-residential" },
  { v: "pm",          label: "Property management", cls: "t-pm" },
  { v: "realtor",     label: "Realtor",             cls: "t-realtor" },
  { v: "commercial",  label: "Commercial",          cls: "t-commercial" }
];
const typeOf = c => TYPES.find(t => t.v === c.type) || TYPES[0];
const isBiz = c => typeOf(c).v !== "residential";
/* Business types lead with the business name; residential leads with the person. */
const displayName = c => (isBiz(c) && c.business ? c.business : c.name) || c.business || "No name";
const subName = c => isBiz(c) && c.business && c.name ? c.name : "";
const badge = c => { const t = typeOf(c); return '<span class="badge ' + t.cls + '">' + t.label + '</span>'; };
const byName = (a, b) => displayName(a).localeCompare(displayName(b), undefined, { sensitivity: "base" });
/* List is grouped into three columns; pm and realtor share one. */
const GROUPS = [
  { key: "residential", label: "Residential",           has: c => typeOf(c).v === "residential" },
  { key: "pmr",         label: "Property mgmt & realtor", has: c => ["pm","realtor"].includes(typeOf(c).v) },
  { key: "commercial",  label: "Commercial",            has: c => typeOf(c).v === "commercial" }
];

let all = null, lastTerm = "";

/* Someone already on file with this phone or email? */
async function findMatch(pk, ek, skipId){
  for (const [f, v] of [["phoneKey", pk], ["emailKey", ek]]) {
    if (!v) continue;
    const s = await getDocs(query(collection(db, "customers"), where(f, "==", v), limit(2)));
    const hit = s.docs.find(d => d.id !== skipId);
    if (hit) return { id: hit.id, ...hit.data() };
  }
  return null;
}

/* ---- List ---- */
async function showList(){
  titleEl.textContent = "Customers";
  document.title = "Customers \u00b7 Khean & Clean";
  if (!all) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try {
      const snap = await getDocs(collection(db, "customers"));
      all = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName);
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="msg">Could not load customers: ' + esc(e.message) + '</div>';
      return;
    }
  }
  view.innerHTML =
    '<div class="bar"><input id="q" type="search" placeholder="Search name, business, phone, email, or address" autocomplete="off" value="' + esc(lastTerm) + '"></div>' +
    '<div class="count" id="count"></div><div class="list" id="list"></div>';
  const q = document.getElementById("q"), listEl = document.getElementById("list"), countEl = document.getElementById("count");
  const draw = () => {
    lastTerm = q.value;
    const t = q.value.trim().toLowerCase(), td = digits(q.value);
    const rows = all.filter(c => !c.trashed).filter(c => !t ||
      [c.name, c.business, typeOf(c).label, c.email, ...(c.addresses || []).map(addrLine)].join(" ").toLowerCase().includes(t) ||
      (td.length >= 3 && digits(c.phone).includes(td)));
    countEl.textContent = rows.length + (rows.length === 1 ? " customer" : " customers") + (t ? " found" : "");
    const card = c => {
      const a = (c.addresses || [])[0] || {}, more = (c.addresses || []).length - 1;
      const lines = [
        cityLine(a) + (more > 0 ? " \u00b7 +" + more + " more" : ""),
        c.phone || ""
      ].filter(x => x.trim());
      return '<a class="row" href="#' + encodeURIComponent(c.id) + '">' +
        '<div class="who">' + esc(displayName(c)) + badge(c) + '</div>' +
        lines.map(l => '<div class="meta">' + esc(l) + '</div>').join("") +
      '</a>';
    };
    listEl.innerHTML = rows.length
      ? GROUPS.map(g => {
          const inG = rows.filter(g.has);
          return inG.length ? '<section class="col"><h3 class="colhead">' + g.label + '</h3>' +
            inG.map(card).join("") + '</section>' : "";
        }).join("")
      : '<div class="msg">' + (t ? "No customers match that." : "No customers yet. Send an estimate or press Add customer.") + '</div>';
  };
  q.addEventListener("input", draw);
  draw();
}

/* ---- Trash ---- */
/* Trashed customers are erased for good 30 days after they were trashed.
   A browser page can only do this while it is open, so we sweep on every visit. */
const TRASH_DAYS = 30;
const msDay = 86400000;
const trashedMs = c => {
  const t = c.trashedAt;
  if (!t) return null;
  if (typeof t.toMillis === "function") return t.toMillis();   /* Firestore Timestamp */
  const n = Date.parse(t);
  return isNaN(n) ? null : n;
};

/* Paid invoices keep the whole quote, so a job row can read date, number and total. */
const anyMs = t => {
  if (!t) return null;
  if (typeof t.toMillis === "function") return t.toMillis();
  const n = Date.parse(t);
  return isNaN(n) ? null : n;
};
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const shortDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";

async function showTrash(){
  titleEl.textContent = "Trash";
  document.title = "Trash \u00b7 Khean & Clean";
  if (!all) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try {
      const snap = await getDocs(collection(db, "customers"));
      all = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort(byName);
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>';
      return;
    }
  }

  /* Sweep: anything past 30 days goes for good. A customer with no trashedAt is left alone. */
  let purged = 0;
  const now = Date.now();
  for (const c of all.filter(x => x.trashed)) {
    const ms = trashedMs(c);
    if (ms === null || now - ms < TRASH_DAYS * msDay) continue;
    try { await deleteDoc(doc(db, "customers", c.id)); purged++; all = all.filter(x => x.id !== c.id); }
    catch (e) { console.error("Could not purge " + c.id, e); }
  }

  const rows = all.filter(c => c.trashed);
  const left = c => {
    const ms = trashedMs(c);
    if (ms === null) return "";
    const d = TRASH_DAYS - Math.floor((now - ms) / msDay);
    return d <= 1 ? "Erased tomorrow" : "Erased in " + d + " days";
  };
  view.innerHTML =
    '<div class="count">' + (rows.length ? rows.length + (rows.length === 1 ? " customer" : " customers") + " in the trash" : "") +
      (purged ? " &middot; " + purged + (purged === 1 ? " erased" : " erased") + " after 30 days" : "") + '</div>' +
    '<div class="list">' + (rows.length ? rows.map(c =>
      '<a class="row" href="#' + encodeURIComponent(c.id) + '">' +
        '<div class="who">' + esc(displayName(c)) + badge(c) + '</div>' +
        '<div class="meta">' + [subName(c), c.phone, c.email].filter(Boolean).map(esc).join(" &middot; ") + '</div>' +
        '<div class="meta">' + esc(left(c)) + '</div>' +
      '</a>').join("")
      : '<div class="msg">The trash is empty.</div>') + '</div>' +
    '<div class="actions"><a class="ghost" href="#">Back to customers</a></div>';
}

/* ---- Profile ---- */
const addrBlock = (a = {}) =>
  '<div class="addr"><div class="grid">' +
    '<label>Street<input data-f="street" autocomplete="off" value="' + esc(a.street) + '"></label>' +
    '<label>City<input data-f="city" autocomplete="off" value="' + esc(a.city) + '"></label>' +
    '<label>State<input data-f="state" autocomplete="off" value="' + esc(a.state ?? "CA") + '"></label>' +
    '<label>ZIP<input data-f="zip" inputmode="numeric" autocomplete="off" value="' + esc(a.zip) + '"></label>' +
  '</div></div>';

/* Read view: the profile as a record, not a form. */
const rrow = (lab, val) =>
  '<div class="rrow"><div class="rlab">' + lab + '</div><div class="rval' +
  (val ? '' : ' empty') + '">' + (val ? esc(val) : "\u2014") + '</div></div>';

function readBlock(c){
  const addrs = (c.addresses || []).filter(a => a && (a.street || a.city || a.zip));
  return '<div class="read" id="readView">' +
    rrow("Name", displayName(c)) +
    (subName(c) ? rrow("Contact", subName(c)) : "") +
    rrow("Type", typeOf(c).label) +
    rrow("Phone", c.phone) +
    rrow("Email", c.email) +
    (addrs.length
      ? addrs.map((a, n) => rrow(n ? "" : "Address",
          [a.street, cityLine(a)].filter(Boolean).join("\n"))).join("")
      : rrow("Address", "")) +
    rrow("Notes", c.notes) +
  '</div>';
}

async function showProfile(id){
  const isNew = id === "new";
  let c = { type: "residential", business: "", name: "", phone: "", email: "", notes: "", addresses: [] };
  if (!isNew) {
    c = all && all.find(x => x.id === id);
    if (!c) {
      view.innerHTML = '<div class="msg">Loading&hellip;</div>';
      try {
        const s = await getDoc(doc(db, "customers", id));
        if (!s.exists()) { view.innerHTML = '<div class="msg">That customer isn\u2019t on file. <a href="#">Back to the list</a></div>'; return; }
        c = { id, ...s.data() };
      } catch (e) {
        console.error(e);
        view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>';
        return;
      }
    }
  }
  titleEl.textContent = isNew ? "New customer" : displayName(c);
  document.title = titleEl.textContent + " \u00b7 Khean & Clean";

  const addrs = (c.addresses || []).length ? c.addresses : [{}];
  const editing = isNew;
  view.innerHTML =
    '<div class="panel">' +
      '<h2>Contact</h2>' +
      (isNew ? '' : readBlock(c)) +
      '<div id="editView">' +
      '<div class="grid" style="margin-bottom:10px">' +
        '<label>Type<select id="cType">' + TYPES.map(t =>
          '<option value="' + t.v + '"' + (t.v === typeOf(c).v ? " selected" : "") + '>' + t.label + '</option>').join("") + '</select></label>' +
        '<label id="bizWrap">Business name<input id="cBiz" autocomplete="off" value="' + esc(c.business) + '"></label>' +
      '</div>' +
      '<div class="grid">' +
        '<label>Name<input id="cName" autocomplete="off" value="' + esc(c.name) + '"></label>' +
        '<label>Phone<input id="cPhone" type="tel" autocomplete="off" value="' + esc(c.phone) + '"></label>' +
        '<label>Email<input id="cEmail" type="email" autocomplete="off" value="' + esc(c.email) + '"></label>' +
      '</div>' +
      '<h2>Addresses</h2>' +
      '<div id="addrs">' + addrs.map(addrBlock).join("") + '</div>' +
      '<button type="button" class="ghost" id="addAddr">Add address</button>' +
      '<h2>Notes</h2>' +
      '<label>Anything worth remembering<textarea id="cNotes">' + esc(c.notes) + '</textarea></label>' +
      '</div>' +
      '<h2>Job history</h2>' +
      '<div id="jobs" class="jobs">' + (isNew ? "Job history appears once this customer has a paid invoice." : "Loading\u2026") + '</div>' +
      '<h2>Photos</h2>' +
      '<div class="photos">Photos are coming later.</div>' +
      '<div class="actions">' +
        (isNew ? '' : '<button type="button" class="new" id="editBtn">Edit</button>') +
        '<button type="button" class="new" id="saveBtn">' + (isNew ? "Add customer" : "Save changes") + '</button>' +
        (isNew ? '' : '<button type="button" class="ghost" id="cancelBtn">Cancel</button>') +
        '<a class="ghost" href="#">Back to list</a>' +
        (isNew ? "" : (c.trashed
          ? '<button type="button" class="ghost" id="restoreBtn">Restore</button>'
          : '<button type="button" class="ghost" id="delBtn">Delete</button>')) +
        '<span class="note" id="note"></span>' +
      '</div>' +
    '</div>';

  const $ = i => document.getElementById(i), note = $("note"), saveBtn = $("saveBtn");
  const say = (html, isErr) => { note.innerHTML = html; note.classList.toggle("err", !!isErr); };

  /* Business name only shows for the three business types. */
  const syncType = () => { $("bizWrap").hidden = $("cType").value === "residential"; };
  $("cType").addEventListener("change", syncType);
  syncType();

  /* Read vs edit. New customers open straight into the form. */
  const setMode = on => {
    const rv = $("readView"), ev = $("editView");
    if (rv) rv.hidden = on;
    if (ev) ev.hidden = !on;
    if ($("addAddr")) $("addAddr").hidden = !on;
    if ($("editBtn")) $("editBtn").hidden = on;
    saveBtn.hidden = !on;
    if ($("cancelBtn")) $("cancelBtn").hidden = !on;
  };
  if (!isNew) {
    $("editBtn").addEventListener("click", () => { setMode(true); $("cName").focus(); });
    $("cancelBtn").addEventListener("click", () => showProfile(id));
  }
  setMode(editing);

  $("addAddr").addEventListener("click", () => {
    $("addrs").insertAdjacentHTML("beforeend", addrBlock());
    $("addrs").lastElementChild.querySelector("input").focus();
  });

  async function setTrashed(flag){
    const btn = $(flag ? "delBtn" : "restoreBtn");
    if (flag && !confirm("Move this customer to the trash? Nothing is erased \u2014 you can restore them from the Trash page.")) return;
    btn.disabled = true; say(flag ? "Moving to trash\u2026" : "Restoring\u2026");
    try {
      const patch = flag
        ? { trashed: true, trashedAt: serverTimestamp() }
        : { trashed: false, trashedAt: null };
      await setDoc(doc(db, "customers", id), patch, { merge: true });
      if (all) all = all.map(x => x.id === id ? Object.assign({}, x, { trashed: flag }) : x);
      location.hash = flag ? "#trash" : "#" + encodeURIComponent(id);
      if (!flag) showProfile(id);
    } catch (e) {
      console.error(e);
      say("Could not " + (flag ? "trash" : "restore") + ": " + esc(e.message), true);
      btn.disabled = false;
    }
  }
  /* Job history: paid invoices whose customer phone matches this one. */
  async function loadJobs(){
    const box = $("jobs");
    if (!box || isNew) return;
    const pk = phoneKey(c.phone);
    if (!pk) { box.textContent = "Add a phone number to match up past jobs."; return; }
    try {
      const snap = await getDocs(collection(db, "paidInvoices"));
      const rows = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .filter(r => phoneKey(r.customer && r.customer.phone) === pk)
        .map(r => ({ ...r, ms: anyMs(r.paidAt) }))
        .sort((a, b) => (b.ms || 0) - (a.ms || 0));
      if (!rows.length) { box.textContent = "No paid jobs yet."; return; }
      box.innerHTML = rows.map(r =>
        '<a class="job" href="./quote.html?id=' + encodeURIComponent(r.id) + '" target="_blank" rel="noopener">' +
          '<span class="job__date">' + esc(shortDate(r.ms) || "\u2014") + '</span>' +
          '<span class="job__no">' + esc(r.number || "") + '</span>' +
          '<span class="job__total">' + esc(money(r.total)) + '</span>' +
        '</a>').join("");
    } catch (e) {
      console.error(e);
      box.textContent = "Could not load job history.";
    }
  }
  loadJobs();

  $("delBtn")?.addEventListener("click", () => setTrashed(true));
  $("restoreBtn")?.addEventListener("click", () => setTrashed(false));

  saveBtn.addEventListener("click", async () => {
    const name = $("cName").value.trim(), phone = $("cPhone").value.trim(), email = $("cEmail").value.trim();
    const type = $("cType").value, business = type === "residential" ? "" : $("cBiz").value.trim();
    const addresses = [...$("addrs").querySelectorAll(".addr")].map(b => {
      const o = {};
      b.querySelectorAll("input[data-f]").forEach(i => { o[i.dataset.f] = i.value.trim(); });
      return o;
    }).filter(a => a.street || a.city || a.zip);   /* a row with only the state filled is blank */
    if (!name && !business && !phone && !email) { say("Add at least a name, business, phone, or email.", true); return; }

    saveBtn.disabled = true; say("Saving&hellip;");
    try {
      const pk = phoneKey(phone), ek = emailKey(email);
      const dup = await findMatch(pk, ek, isNew ? null : id);
      if (dup) {
        say('That phone or email is already on file for <a href="#' + encodeURIComponent(dup.id) + '">' + esc(dup.name || "another customer") + '</a>.', true);
        return;
      }
      const theId = isNew ? randomId() : id;
      const data = { type, business, name, phone, email, notes: $("cNotes").value.trim(), addresses, phoneKey: pk, emailKey: ek, updatedAt: serverTimestamp() };
      if (isNew) Object.assign(data, { source: "manual", createdAt: serverTimestamp() });
      await setDoc(doc(db, "customers", theId), data, { merge: true });

      if (all) {
        const rec = Object.assign({}, c, data, { id: theId });
        all = all.filter(x => x.id !== theId).concat(rec).sort(byName);
      }
      if (isNew) { location.hash = "#" + encodeURIComponent(theId); return; }
      titleEl.textContent = displayName(data);
      say("Saved.");
    } catch (e) {
      console.error(e);
      say("Could not save: " + esc(e.message), true);
    } finally {
      saveBtn.disabled = false;
    }
  });
}

/* #new = add, #trash = trash, #<id> = profile, nothing = list */
const route = () => {
  const h = decodeURIComponent(location.hash.slice(1));
  window.scrollTo(0, 0);
  if (h === "trash") showTrash();
  else if (h) showProfile(h);
  else showList();
};

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=customers.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; window.addEventListener("hashchange", route); route(); }
});
</script>
</body>
