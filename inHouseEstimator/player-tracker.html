<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex, nofollow">
<title>Player Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Player Tracker (proof of concept): players log in/out from a link on their phone, no app.
   Identified by player's card number. Two jobs: waitlist and table hours.
   Floor view (no ?card) is staff only. Player view (?card=100001) needs no login. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--felt:#0f6b3a;--rail:#5a3518}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font:16px/1.5 "Archivo",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 110px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
h1{font:700 28px/1.2 "Archivo",system-ui,sans-serif;margin:0;color:var(--gold)}
.back{margin-left:auto;color:var(--gold);text-decoration:none;font-weight:600}
h2{font:700 13px "Archivo",sans-serif;color:var(--gold);text-transform:uppercase;letter-spacing:.12em;margin:24px 0 10px}
.box{background:var(--navy);border:1px solid rgba(227,182,74,.5);border-radius:12px;padding:14px}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:12px 18px;font:700 16px "Archivo",sans-serif;cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn[disabled]{opacity:.35;cursor:default}
.note{color:rgba(255,255,255,.7);font-size:14px;margin:8px 0 0}
.warn{background:#5a1d1d;border:1px solid #f87171;border-radius:10px;padding:10px;font-size:14px;margin-bottom:12px;display:none}
svg.table{width:100%;height:auto;display:block}
#tblBox{cursor:zoom-in}
#tblBack{display:none}
#tblBox.full .chair{display:none}   /* full-screen (dealer) view: no chairs */
.chair{cursor:grab;touch-action:none}
#tblBox.full{position:fixed;inset:0;z-index:50;border:0;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:16px;cursor:default}
#tblBox.full #tblBack{display:block;position:absolute;top:calc(env(safe-area-inset-top) + 16px);left:16px}
#tblScan{display:none}
#tblBox.full #tblScan{display:block;position:absolute;top:calc(env(safe-area-inset-top) + 16px);right:16px}
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--navy);border:1px solid var(--gold);border-radius:12px;padding:16px;text-align:center;width:100%;max-width:440px}
.mbox .mt{font-weight:700;font-size:20px;color:var(--gold);margin-bottom:10px}
.mbox video{width:100%;border-radius:8px;background:#000}
#qrBox{display:inline-block;background:#fff;padding:12px;border-radius:8px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:150px}
.row .nm b{display:block}
.row .nm span{font-size:13px;color:rgba(255,255,255,.65)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.tag.wait{background:var(--gold);color:#000}
.tag.seated{background:var(--ok);color:#000}
.tag.out{background:rgba(255,255,255,.15)}
.me{text-align:center}
.me .who{font:700 26px "Archivo",sans-serif;color:var(--gold)}
.me .card{color:rgba(255,255,255,.65)}
.me .status{font:700 20px "Archivo",sans-serif;margin:16px 0}
.me .hrs{font:700 48px/1 system-ui,sans-serif;margin:10px 0}
.me .grid{display:grid;gap:10px;margin-top:16px}
.nm a{color:#fff;text-decoration:underline;text-decoration-color:rgba(227,182,74,.6)}
.pf{display:grid;gap:10px}
.pf label{display:grid;gap:4px;font-size:13px;color:rgba(255,255,255,.7)}
textarea{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px;font:inherit;width:100%}
input:disabled{opacity:.6}
.lg{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px}
.lg:last-child{border-bottom:0}
.lg span:first-child{width:130px;flex:none;color:rgba(255,255,255,.65)}
input{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:12px;font:inherit;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="warn" id="warn">Not syncing with the server. Changes are saved on this phone only.</div>
  <div id="floor" hidden>
    <div class="top">
      <h1>Player Tracker</h1>
      <a class="back" href="./personal.html">&lsaquo; Personal</a>
      <button onclick="location.reload()" aria-label="Refresh" title="Refresh" style="background:none;border:0;padding:4px;cursor:pointer;line-height:0"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#E3B64A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    </div>
    <div class="box" id="tblBox"><button class="btn ghost sm" id="tblBack">&lsaquo; Back</button><button class="btn sm" id="tblScan">Scan player</button><svg class="table" id="tbl" viewBox="-60 0 520 300"></svg></div>
    <h2>Waitlist</h2>
    <div class="box" id="waitList"></div>
    <h2>Dealers</h2>
    <div class="box" id="dealers"></div>
    <h2>Test players</h2>
    <div class="box" id="players"></div>
    <p class="note">Each player's link logs them in/out. Copy a link and text it to a tester.</p>
    <p style="margin-top:16px"><button class="btn ghost sm" id="reset">Reset all</button></p>
  </div>
  <div id="prof" hidden>
    <div class="top">
      <h1 id="pfName">Profile</h1>
      <a class="back" href="./player-tracker.html">&lsaquo; Tracker</a>
    </div>
    <div class="box">
      <div class="pf"><label>Name<input id="pf_name"></label>
      <label id="pfIdLbl">Card #<input id="pf_id" disabled></label>
      <label>Phone<input id="pf_phone" type="tel"></label>
      <label>Email<input id="pf_email" type="email"></label>
      <label>Birthday<input id="pf_bday" type="date"></label>
      <label>Notes<textarea id="pf_notes" rows="3"></textarea></label></div>
      <p style="margin:12px 0 0"><button class="btn" id="pfSave">Save</button> <span class="note" id="pfMsg"></span></p>
    </div>
    <h2>Today</h2>
    <div class="box" id="pfNow"></div>
    <h2>Log</h2>
    <div class="box" id="pfLog"></div>
  </div>
  <div id="player" hidden>
    <div class="box me" id="meBox"></div>
  </div>
</div>
<div id="modal" hidden><div class="mbox"><div id="mbody"></div><p style="margin:14px 0 0"><button class="btn ghost" id="mclose">Close</button></p></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc, setDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc");
const LOGREF = doc(db, "playerTracker", "log");        // { events: [{ c, a, t }] } every log in / log out
const PROFREF = doc(db, "playerTracker", "profiles");
const LAYREF = doc(db, "playerTracker", "layout");     // { seatNumber: { x, y } } where each chair was dragged to
let layout = {};
try { layout = JSON.parse(localStorage.getItem("playerTracker.layout") || "{}"); } catch (e) {}
let dragging = null, justDragged = false;  // { card: { name, phone, email, bday, notes } }

/* 10 test players: famous gamblers and Wild West legends, made-up card numbers. */
const ROSTER = {
  "100001": "Doyle Brunson",  "100002": "Phil Ivey",       "100003": "Stu Ungar",
  "100004": "Johnny Moss",    "100005": "Amarillo Slim",   "100006": "Puggy Pearson",
  "100007": "Wild Bill Hickok","100008": "Doc Holliday",   "100009": "Poker Alice",
  "100010": "Wyatt Earp"
};
/* 2 test dealers. One dealer on the table at a time; a new dealer logging in pushes the other off. */
const DEALERS = { "D001": "Ace in the Hole", "D002": "Shuffle Off Home" };
const SEATS = 7;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const LS = "playerTracker.poc";
let state = {};             // card -> { status:'out'|'wait'|'seated', seat, since, waitAt, totalMs }
try { state = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
const get = c => state[c] || { status: "out", totalMs: 0 };
const fmtHrs = ms => { const m = Math.floor(ms / 60000); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const liveMs = p => (p.totalMs || 0) + (p.status === "seated" && p.since ? Date.now() - p.since : 0);

let events = [], profiles = {};
try { events = JSON.parse(localStorage.getItem("playerTracker.log") || "[]"); profiles = JSON.parse(localStorage.getItem("playerTracker.profiles") || "{}"); } catch (e) {}
const nameOf = c => (profiles[c] && profiles[c].name) || ROSTER[c] || DEALERS[c] || c;
function logEvent(c, a) {
  const ev = { c, a, t: Date.now() };
  events.push(ev);
  try { localStorage.setItem("playerTracker.log", JSON.stringify(events.slice(-2000))); } catch (e) {}
  setDoc(LOGREF, { events: arrayUnion(ev) }, { merge: true }).catch(() => { $("warn").style.display = "block"; });
}
function save(card, p) {
  const old = get(card);
  if (old.status !== p.status) {
    const a = p.status === "wait" ? "Joined the list"
      : p.status === "seated" ? (DEALERS[card] ? "Logged in to table" : "Seated at seat " + p.seat)
      : "Logged out" + (old.status === "seated" && old.since ? " after " + fmtHrs(Date.now() - old.since) : old.status === "wait" ? " (left the list)" : "");
    logEvent(card, a);
  }
  state[card] = p;
  try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
  render();
  setDoc(REF, { [card]: p }, { merge: true }).catch(() => { $("warn").style.display = "block"; });
}
function openSeat() {
  const taken = Object.values(state).filter(p => p.status === "seated").map(p => p.seat);
  for (let s = 1; s <= SEATS; s++) if (!taken.includes(s)) return s;
  return 0;
}
/* Actions shared by floor and player views. */
const act = {
  wait(c)  { const p = get(c); save(c, { ...p, status: "wait", waitAt: Date.now() }); },
  seat(c, n) { const p = get(c); const s = n || openSeat(); if (!s) { alert("Table is full."); return; }
             save(c, { ...p, status: "seated", seat: s, since: Date.now(), waitAt: null }); },
  out(c)   { const p = get(c); save(c, { status: "out", totalMs: liveMs(p), seat: null, since: null, waitAt: null }); },
  deal(c)  { for (const d of Object.keys(DEALERS)) if (d !== c && get(d).status === "seated") act.out(d);
             const p = get(c); save(c, { ...p, status: "seated", seat: 0, since: Date.now() }); }
};
/* Seat button on a profile: asks which seat. */
function askSeat(c) {
  const taken = Object.entries(state).filter(([k, p]) => p.status === "seated" && k !== c).map(([, p]) => p.seat);
  const open = []; for (let i = 1; i <= SEATS; i++) if (!taken.includes(i)) open.push(i);
  if (!open.length) { alert("Table is full."); return; }
  const v = prompt("What seat number? Open: " + open.join(", "));
  if (v === null) return;
  const n = parseInt(v, 10);
  if (!open.includes(n)) { alert("Seat " + v + " isn't open."); return; }
  const p = get(c);
  if (p.status === "seated") save(c, { ...p, seat: n });   // moving seats keeps their time running
  else act.seat(c, n);
}
const onTableDealer = () => Object.keys(DEALERS).find(d => get(d).status === "seated");

const params = new URLSearchParams(location.search);
let myCard = params.get("card") || params.get("dealer");
if (myCard) { try { localStorage.setItem("playerTracker.card", myCard); } catch (e) {} }
else if (params.has("me")) { try { myCard = localStorage.getItem("playerTracker.card"); } catch (e) {} }

/* A chair always turns to face the middle of the table, wherever it's dragged. */
const chairXf = (x, y) => `translate(${x} ${y}) rotate(${Math.atan2(y - 40, x - 200) * 180 / Math.PI - 90})`;
function drawTable() {
  if (dragging) return;   // don't redraw under a finger mid-drag
  /* Top-down blackjack table: dealer on the straight edge at top, 7 seats around the curve. */
  const cx = 200, cy = 40, r = 170;
  let s = `<path d="M${cx - r - 14} ${cy} A ${r + 14} ${r + 14} 0 0 0 ${cx + r + 14} ${cy} Z" fill="var(--rail)"/>`
        + `<path d="M${cx - r} ${cy} A ${r} ${r} 0 0 0 ${cx + r} ${cy} Z" fill="var(--felt)"/>`
        + `<rect x="${cx - 60}" y="${cy - 28}" width="120" height="24" rx="6" fill="#222" stroke="var(--gold)"/>`
        + `<text x="${cx}" y="${cy - 11}" fill="var(--gold)" font-size="11" font-weight="700" text-anchor="middle">${esc(onTableDealer() ? nameOf(onTableDealer()) : "NO DEALER")}</text>`
        + `<rect x="${cx - 30}" y="${cy + 6}" width="60" height="22" rx="3" fill="#0b4a28" stroke="rgba(255,255,255,.4)"/>`
        + `<text x="${cx}" y="${cy + 21}" fill="#fff" font-size="9" text-anchor="middle">CHIP TRAY</text>`
        + `<path d="M${cx - 110} ${cy + 70} A 125 125 0 0 0 ${cx + 110} ${cy + 70}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>`
        + `<image href="../images/edh-casino-logo.png" x="${cx - 30}" y="${cy + 32}" width="60" height="47" opacity=".9"/>`
        + `<text x="${cx}" y="${cy + 96}" fill="rgba(255,255,255,.75)" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">BLACKJACK</text>`;
  const labels = [];   // player names, placed by their chairs after the seats are drawn
  const seated = {};
  for (const [c, p] of Object.entries(state)) if (p.status === "seated") seated[p.seat] = c;
  for (let i = 1; i <= SEATS; i++) {
    /* Seat 1 is first base (dealer's left = player's right side of the picture). */
    const a = Math.PI * (i / (SEATS + 1));
    const x = cx + Math.cos(a) * (r - 30), y = cy + Math.sin(a) * (r - 30);
    const c = seated[i];
    /* Chair outside the rail, facing the table. */
    const L = layout[i];
    const chx = L ? L.x : cx + Math.cos(a) * (r + 40), chy = L ? L.y : cy + Math.sin(a) * (r + 40);
    s += `<g class="chair" data-chair="${i}" transform="${chairXf(chx, chy)}">`
       + `<rect x="-15" y="-12" width="30" height="24" rx="6" fill="${c ? "var(--gold)" : "#3a3f4b"}" stroke="rgba(255,255,255,.5)"/>`
       + `<rect x="-17" y="12" width="34" height="7" rx="3" fill="${c ? "#b8902f" : "#2a2e37"}" stroke="rgba(255,255,255,.5)"/></g>`;
    /* Just the seat number: black when open, gold when someone's seated. */
    s += `<text x="${x}" y="${y + 7}" fill="${c ? "var(--gold)" : "#000"}" font-size="22" font-weight="700" text-anchor="middle">${i}</text>`;
    if (c) labels.push({ nm: nameOf(c), chx, chy });
  }
  /* Names go with their chair, just outside it. If a name would sit on another chair or name,
     it slides further out until it's clear. */
  const chairs = [];
  for (let i = 1; i <= SEATS; i++) {
    const a = Math.PI * (i / (SEATS + 1)), L = layout[i];
    chairs.push(L ? [L.x, L.y] : [cx + Math.cos(a) * (r + 40), cy + Math.sin(a) * (r + 40)]);
  }
  const placed = [];
  const hit = (b, o) => b.x1 < o.x2 && b.x2 > o.x1 && b.y1 < o.y2 && b.y2 > o.y1;
  for (const lb of labels) {
    const nm = lb.nm.length > 18 ? lb.nm.slice(0, 17) + "…" : lb.nm;
    const w = nm.length * 5.6 + 6, h = 13;
    /* Try spots around the chair (outward first, then below, then angled), nearest first;
       take the first that stays on screen and clear of chairs and other names. */
    const out = Math.atan2(lb.chy - cy, lb.chx - cx);
    let box = null, first = null;
    for (let d = 28; d <= 76 && !box; d += 8) {
      for (const ang of [out, Math.PI / 2, out + 0.6, out - 0.6, -Math.PI / 2]) {
        const lx = lb.chx + Math.cos(ang) * d, ly = lb.chy + Math.sin(ang) * d;
        const b = { x1: lx - w / 2, x2: lx + w / 2, y1: ly - h / 2, y2: ly + h / 2, lx, ly };
        if (b.x1 < -58 || b.x2 > 458 || b.y1 < 0 || b.y2 > 298) continue;
        first = first || b;
        const clash = placed.some(o => hit(b, o)) ||
          chairs.some(([qx, qy]) => hit(b, { x1: qx - 19, x2: qx + 19, y1: qy - 19, y2: qy + 19 }));
        if (!clash) { box = b; break; }
      }
    }
    box = box || first || { x1: lb.chx - w / 2, x2: lb.chx + w / 2, y1: lb.chy + 22, y2: lb.chy + 22 + h, lx: lb.chx, ly: lb.chy + 22 + h / 2 };
    placed.push(box);
    s += `<rect x="${box.x1}" y="${box.y1}" width="${w}" height="${h}" rx="4" fill="rgba(0,0,0,.6)"/>`
       + `<text x="${box.lx}" y="${box.ly + 4}" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">${esc(nm)}</text>`;
  }
  $("tbl").innerHTML = s;
}

function renderFloor() {
  drawTable();
  const waiting = Object.entries(state).filter(([, p]) => p.status === "wait").sort((a, b) => a[1].waitAt - b[1].waitAt);
  $("waitList").innerHTML = waiting.length ? waiting.map(([c], i) =>
    `<div class="row"><div class="nm"><b>${i + 1}. <a href="?profile=${c}">${esc(nameOf(c))}</a></b><span>#${c}</span></div>
     <button class="btn sm ok" data-a="seat" data-c="${c}">Seat</button>
     <button class="btn sm ghost" data-a="out" data-c="${c}">Remove</button></div>`).join("")
    : `<div class="note" style="margin:0">Nobody on the list.</div>`;
  const base = location.origin + location.pathname;
  $("dealers").innerHTML = Object.entries(DEALERS).map(([c, nm]) => {
    const p = get(c), link = base + "?dealer=" + c;
    const tag = p.status === "seated" ? `<span class="tag seated">On table</span>` : `<span class="tag out">Off</span>`;
    return `<div class="row"><div class="nm"><b><a href="?profile=${c}">${esc(nameOf(c))}</a></b><span>#${c} &middot; ${fmtHrs(liveMs(p))} today</span></div>${tag}
      <button class="btn sm ghost" data-a="copy" data-c="${c}" data-l="${esc(link)}">Copy link</button></div>`;
  }).join("");
  $("players").innerHTML = Object.entries(ROSTER).map(([c, nm]) => {
    const p = get(c), link = base + "?card=" + c;
    const tag = p.status === "seated" ? `<span class="tag seated">Seat ${p.seat}</span>` : p.status === "wait" ? `<span class="tag wait">Waiting</span>` : `<span class="tag out">Out</span>`;
    return `<div class="row"><div class="nm"><b><a href="?profile=${c}">${esc(nameOf(c))}</a></b><span>#${c} &middot; ${fmtHrs(liveMs(p))} today</span></div>${tag}
      <button class="btn sm" data-a="wait" data-c="${c}" ${p.status === "out" ? "" : "disabled"}>Add to waitlist</button>
      <button class="btn sm ghost" data-a="copy" data-c="${c}" data-l="${esc(link)}">Copy link</button></div>`;
  }).join("");
}

function renderDealer() {
  const p = get(myCard), on = p.status === "seated";
  $("meBox").innerHTML = `<div class="who">${esc(nameOf(myCard))}</div><div class="card">Dealer #${myCard}</div>
    <div class="status">${on ? "You're on the table" : "You're off the table"}</div>
    <div class="note">Hours today</div><div class="hrs">${fmtHrs(liveMs(p))}</div>
    <div class="grid">
      <button class="btn ok" data-a="deal" data-c="${myCard}" ${on ? "disabled" : ""}>Log in to table</button>
      <button class="btn ghost" data-a="out" data-c="${myCard}" ${on ? "" : "disabled"}>Log out</button>
    </div>`;
}

function renderPlayer() {
  if (DEALERS[myCard]) return renderDealer();
  const nm = ROSTER[myCard];
  if (!nm) { $("meBox").innerHTML = `<div class="who">Card not found</div><p class="note">Ask the floor for your link.</p>`; return; }
  const p = get(myCard);
  const st = p.status === "seated" ? `You're seated at seat ${p.seat}` : p.status === "wait" ? `You're on the list (#${
    Object.values(state).filter(q => q.status === "wait" && q.waitAt <= p.waitAt).length})` : "You're logged out";
  $("meBox").innerHTML = `<div class="who">${esc(nameOf(myCard))}</div><div class="card">Card #${myCard}</div>
    <div class="status">${st}</div>
    <div class="note">Hours today</div><div class="hrs">${fmtHrs(liveMs(p))}</div>
    <div class="grid">
      <button class="btn" data-a="wait" data-c="${myCard}" ${p.status !== "out" ? "disabled" : ""}>Join the list</button>
      <button class="btn ok" data-a="seat" data-c="${myCard}" ${p.status === "seated" ? "disabled" : ""}>Log in (I'm seated)</button>
      <button class="btn ghost" data-a="out" data-c="${myCard}" ${p.status === "out" ? "disabled" : ""}>Log out</button>
    </div>`;
}

const profId = params.get("profile");
const fmtWhen = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
let pfFilled = false;
function renderProfile() {
  const c = profId, pr = profiles[c] || {}, p = get(c), isD = !!DEALERS[c];
  $("pfName").textContent = nameOf(c);
  if (!pfFilled) {   // fill the form once so live updates don't wipe what's being typed
    $("pf_name").value = pr.name || ROSTER[c] || DEALERS[c] || "";
    $("pf_id").value = c; $("pfIdLbl").firstChild.textContent = isD ? "Dealer #" : "Card #";
    $("pf_phone").value = pr.phone || ""; $("pf_email").value = pr.email || "";
    $("pf_bday").value = pr.bday || ""; $("pf_notes").value = pr.notes || "";
    pfFilled = true;
  }
  const st = p.status === "seated" ? (isD ? "On the table" : "Seated at seat " + p.seat) : p.status === "wait" ? "On the list" : "Logged out";
  const btns = isD
    ? `<button class="btn sm ok" data-a="deal" data-c="${c}" ${p.status === "seated" ? "disabled" : ""}>Log in to table</button>
       <button class="btn sm ghost" data-a="out" data-c="${c}" ${p.status === "seated" ? "" : "disabled"}>Log out</button>`
    : `<button class="btn sm ghost" data-a="qr" data-c="${c}">QR code</button>
       <button class="btn sm ok" data-a="askSeat" data-c="${c}">${p.status === "seated" ? "Change seat" : "Seat"}</button>
       ${p.status === "seated" ? `<button class="btn sm ghost" data-a="out" data-c="${c}">Remove from seat</button>` : ""}
       ${p.status === "out" ? `<button class="btn sm" data-a="wait" data-c="${c}">Add to waitlist</button>` : ""}
       ${p.status === "wait" ? `<button class="btn sm ghost" data-a="out" data-c="${c}">Remove from list</button>` : ""}`;
  $("pfNow").innerHTML = `<div class="lg"><span>Status</span><b>${st}</b></div><div class="lg"><span>Hours today</span><b>${fmtHrs(liveMs(p))}</b></div>
    <div class="row" style="border:0;padding-bottom:0">${btns}</div>`;
  const mine = events.filter(e => e.c === c).sort((a, b) => b.t - a.t);
  $("pfLog").innerHTML = mine.length ? mine.map(e => `<div class="lg"><span>${fmtWhen(e.t)}</span>${esc(e.a)}</div>`).join("")
    : `<div class="note" style="margin:0">No log ins yet.</div>`;
}
$("pfSave").onclick = () => {
  const c = profId;
  const pr = { name: $("pf_name").value.trim(), phone: $("pf_phone").value.trim(), email: $("pf_email").value.trim(),
               bday: $("pf_bday").value, notes: $("pf_notes").value.trim() };
  profiles[c] = pr;
  try { localStorage.setItem("playerTracker.profiles", JSON.stringify(profiles)); } catch (e) {}
  $("pfMsg").textContent = "Saved";
  setTimeout(() => $("pfMsg").textContent = "", 1500);
  setDoc(PROFREF, { [c]: pr }, { merge: true }).catch(() => { $("warn").style.display = "block"; });
  render();
};

function render() { if (myCard) renderPlayer(); else if (profId) renderProfile(); else renderFloor(); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const c = b.dataset.c, a = b.dataset.a;
  if (a === "copy") {
    const l = b.dataset.l;
    (navigator.clipboard ? navigator.clipboard.writeText(l) : Promise.reject()).then(
      () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy link", 1500); },
      () => prompt("Copy this link:", l));
    return;
  }
  if (a === "askSeat") { askSeat(c); return; }
  if (a === "qr") { showQR(c); return; }
  if (act[a]) act[a](c);
});
/* Drag chairs around (regular view only). */
const tblSvg = $("tbl");
function svgPoint(e) {
  const pt = tblSvg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(tblSvg.getScreenCTM().inverse());
}
tblSvg.addEventListener("pointerdown", e => {
  const g = e.target.closest(".chair");
  if (!g || $("tblBox").classList.contains("full")) return;
  e.preventDefault();
  tblSvg.setPointerCapture(e.pointerId);
  dragging = { i: g.dataset.chair, g, moved: false };
});
tblSvg.addEventListener("pointermove", e => {
  if (!dragging) return;
  const p = svgPoint(e);
  dragging.moved = true; dragging.x = Math.round(p.x); dragging.y = Math.round(p.y);
  dragging.g.setAttribute("transform", chairXf(dragging.x, dragging.y));
});
const endDrag = () => {
  if (!dragging) return;
  const d = dragging; dragging = null;
  if (d.moved) {
    justDragged = true;
    layout[d.i] = { x: d.x, y: d.y };
    try { localStorage.setItem("playerTracker.layout", JSON.stringify(layout)); } catch (e) {}
    setDoc(LAYREF, { [d.i]: layout[d.i] }, { merge: true }).catch(() => { $("warn").style.display = "block"; });
  }
  drawTable();
};
tblSvg.addEventListener("pointerup", endDrag);
tblSvg.addEventListener("pointercancel", endDrag);
$("tblBox").onclick = e => {
  const box = $("tblBox");
  if (justDragged) { justDragged = false; return; }   // a drag isn't a tap to go full screen
  if (e.target.closest("#tblBack")) { box.classList.remove("full"); return; }
  if (e.target.closest("#tblScan")) { openScanner(); return; }
  box.classList.add("full");
};
/* ---- QR codes: each player's QR is their own link, so the iPhone camera opens it too.
   The dealer's Scan player button (full-screen view) reads it and seats them. ---- */
let scanStream = null, scanRaf = 0;
function showModal(html) { $("mbody").innerHTML = html; $("modal").hidden = false; }
function closeModal() {
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  cancelAnimationFrame(scanRaf);
  $("modal").hidden = true; $("mbody").innerHTML = "";
}
$("mclose").onclick = closeModal;
function showQR(c) {
  const link = location.origin + location.pathname + "?card=" + c;
  showModal(`<div class="mt">${esc(nameOf(c))}</div><div id="qrBox"></div><p class="note">Card #${c}</p>`);
  if (window.QRCode) new QRCode($("qrBox"), { text: link, width: 260, height: 260, colorDark: "#172239", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M });
  else $("qrBox").textContent = link;
}
async function openScanner() {
  showModal(`<div class="mt">Scan player</div><video id="scanVid" playsinline muted></video><canvas id="scanCv" hidden></canvas><p class="note" id="scanMsg">Point the camera at the player's QR code.</p>`);
  try { scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); }
  catch (e) { $("scanMsg").textContent = "Couldn't open the camera."; return; }
  const v = $("scanVid"); v.srcObject = scanStream; await v.play().catch(() => {});
  const det = "BarcodeDetector" in window ? new BarcodeDetector({ formats: ["qr_code"] }) : null;
  const cv = $("scanCv"), ctx = cv.getContext("2d", { willReadFrequently: true });
  const tick = async () => {
    if (!scanStream) return;
    let txt = null;
    if (v.readyState >= 2 && v.videoWidth) {
      if (det) { try { const r = await det.detect(v); if (r[0]) txt = r[0].rawValue; } catch (e) {} }
      else if (window.jsQR) {
        const k = Math.min(1, 640 / v.videoWidth);
        cv.width = Math.round(v.videoWidth * k); cv.height = Math.round(v.videoHeight * k);
        ctx.drawImage(v, 0, 0, cv.width, cv.height);
        const r = jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
        if (r) txt = r.data;
      }
    }
    if (txt) { handleScan(txt); return; }
    scanRaf = requestAnimationFrame(tick);
  };
  tick();
}
function handleScan(txt) {
  let card = null;
  try { card = new URL(txt).searchParams.get("card"); } catch (e) {}
  if (!card) { const m = String(txt).match(/\d{4,}/); if (m) card = m[0]; }   // a plain card number
  closeModal();
  if (!ROSTER[card]) { alert("Player not found: " + txt); return; }
  askSeat(card);
}
$("reset").onclick = () => {
  if (!confirm("Log everyone out and clear all hours?")) return;
  state = {}; try { localStorage.removeItem(LS); } catch (e) {}
  const blank = {}; for (const c of [...Object.keys(ROSTER), ...Object.keys(DEALERS)]) blank[c] = { status: "out", totalMs: 0 };
  setDoc(REF, blank).catch(() => { $("warn").style.display = "block"; });
  render();
};

function start() {
  render();
  onSnapshot(REF, snap => {
    $("warn").style.display = "none";
    state = snap.exists() ? snap.data() : {};
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    render();
  }, () => { $("warn").style.display = "block"; });
  onSnapshot(LOGREF, snap => { events = (snap.exists() && snap.data().events) || []; render(); }, () => {});
  onSnapshot(LAYREF, snap => {
    layout = snap.exists() ? snap.data() : {};
    try { localStorage.setItem("playerTracker.layout", JSON.stringify(layout)); } catch (e) {}
    render();
  }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; render(); }, () => {});
  setInterval(render, 30000);   // keep the hours ticking
}

if (myCard) { $("player").hidden = false; start(); }
else {
  /* Floor view: staff only. */
  onAuthStateChanged(getAuth(app), u => {
    if (!u) { location.replace("./login.html?next=player-tracker.html"); return; }
    if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
    $(profId ? "prof" : "floor").hidden = false; start();
  });
}
</script>
