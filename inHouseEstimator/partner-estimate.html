<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Partner Estimate &middot; Khean &amp; Clean</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1b2a">
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Partner estimate tool (B2B portal). Same prices and room sizes as the in-house estimator (pricing.js),
   with the partner discount taken off. Sending it files a lead in the app for Israel to confirm. */
:root{ --navy:#0d1b2a; --panel:#152a42; --gold:#e0b64a; --cream:#f4f1ea; --muted:rgba(244,241,234,.62); --line:rgba(224,182,74,.35); }
*{ box-sizing:border-box; }
body{ margin:0; min-height:100svh; background:var(--navy); color:var(--cream); font:400 16px/1.5 "Archivo",system-ui,-apple-system,sans-serif; }
#authwait{ position:fixed; inset:0; background:var(--navy); z-index:9; }
.wrap{ max-width:1100px; margin:0 auto; padding:20px 16px 80px; }
.back{ color:var(--muted); font-size:14px; text-decoration:none; }
h1{ font:700 1.6rem/1.2 "Playfair Display",serif; margin:8px 0 2px; }
.sub{ color:var(--muted); margin:0 0 16px; font-size:.95rem; }
.layout{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
.card{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
h2{ font:700 1.05rem "Playfair Display",serif; color:var(--gold); margin:0 0 10px; }
.tabs{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
.tabs button{ background:transparent; color:var(--cream); border:1px solid rgba(255,255,255,.25); border-radius:999px; padding:8px 14px; font:600 14px "Archivo",sans-serif; cursor:pointer; }
.tabs button.on{ background:var(--gold); color:var(--navy); border-color:var(--gold); }
.tabs button .ct{ display:inline-block; min-width:18px; margin-left:6px; padding:0 6px; border-radius:999px; background:rgba(0,0,0,.25); font-size:12px; }
label.f{ display:block; font-size:.72rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); margin:10px 0 5px; }
select,input,textarea{ width:100%; background:rgba(0,0,0,.25); color:var(--cream); border:1px solid rgba(255,255,255,.22); border-radius:10px; padding:.65rem .8rem; font:inherit; }
select option{ color:#000; }
textarea{ min-height:80px; resize:vertical; }
:where(select,input,textarea):focus{ outline:none; border-color:var(--gold); }
.rooms{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:6px; }
.room{ display:flex; align-items:center; justify-content:space-between; gap:8px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 10px; }
.room.has{ border-color:var(--gold); background:rgba(224,182,74,.08); }
.room b{ display:block; font-size:14.5px; font-weight:600; }
.room small{ color:var(--muted); font-size:12.5px; }
.cnt{ display:flex; align-items:center; gap:6px; flex:none; }
.cnt button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--gold); background:transparent; color:var(--gold); font:700 18px "Archivo",sans-serif; cursor:pointer; line-height:1; }
.cnt span{ min-width:22px; text-align:center; font-weight:700; }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.sum .line{ display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid rgba(255,255,255,.08); font-size:15px; }
.sum .line.disc{ color:#9fd8b8; }
.sum .line.total{ border:0; font:700 1.4rem "Playfair Display",serif; color:var(--gold); padding-top:10px; }
.sum .note{ font-size:13px; color:var(--muted); margin:6px 0 0; }
.empty{ color:var(--muted); font-size:14.5px; margin:0; }
.go{ width:100%; background:var(--gold); color:var(--navy); border:0; border-radius:999px; padding:.85rem; font:700 1rem "Archivo",sans-serif; cursor:pointer; margin-top:12px; }
.go[disabled]{ opacity:.55; cursor:default; }
.msg{ min-height:1.2em; margin:10px 0 0; font-size:.9rem; color:#9fd8b8; }
.msg.bad{ color:#ff9b8a; }
.sticky{ position:sticky; top:12px; }
:where(a,button):focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
@media (max-width:860px){ .layout{ grid-template-columns:1fr; } .sticky{ position:static; } }
@media (max-width:480px){ .row2{ grid-template-columns:1fr; } .rooms{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <a class="back" href="./partner.html">&lsaquo; Partner portal</a>
  <h1>Build an estimate</h1>
  <p class="sub">Pick the services and rooms. Your partner discount comes off automatically. Send it and we&rsquo;ll confirm and get it on the calendar.</p>

  <div class="layout">
    <div>
      <section class="card">
        <h2>Services</h2>
        <div class="tabs" id="tabs" role="tablist"></div>
        <div id="svcBody"></div>
      </section>

      <section class="card">
        <h2>Property</h2>
        <label class="f" for="street">Street address</label>
        <input id="street" autocomplete="street-address" maxlength="150">
        <div class="row2">
          <div><label class="f" for="city">City</label><input id="city" autocomplete="address-level2" maxlength="80"></div>
          <div><label class="f" for="zip">Zip</label><input id="zip" inputmode="numeric" autocomplete="postal-code" maxlength="10"></div>
        </div>
        <div class="row2">
          <div><label class="f" for="when">Preferred date</label><input id="when" type="date"></div>
          <div><label class="f" for="access">Access</label>
            <select id="access"><option>Vacant, lockbox</option><option>Tenant will be home</option><option>Owner will be home</option><option>I&rsquo;ll meet you there</option></select></div>
        </div>
        <label class="f" for="notes">Notes</label>
        <textarea id="notes" maxlength="1500" placeholder="Lockbox code, pets, move-out deadline, anything we should know"></textarea>
      </section>
    </div>

    <aside class="sticky">
      <section class="card sum">
        <h2>Estimate</h2>
        <div id="sum"><p class="empty">Add rooms to see your price.</p></div>
        <button type="button" class="go" id="sendBtn" disabled>Send to Khean &amp; Clean</button>
        <p class="msg" id="msg" role="status"></p>
      </section>
    </aside>
  </div>
</div>

<script src="pricing.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const auth = getAuth(app), db = getFirestore(app);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Math.round(n * 100) / 100).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---- Partner pricing: change these two numbers to change the deal. ---- */
const PARTNER_DISCOUNT = 0.15;   /* 15% off for business partners */
const MINIMUM = 150;             /* job minimum, after the discount */

const P = window.KC_PRICING;
const ROOMS = P.ROOM_TYPES.filter(r => r.key !== "addSqft");
/* Services partners can quote. Commercial ones show for Commercial partners. */
const RES = ["carpet", "tile", "lvp", "stone", "upholstery"], COMM = ["commcarpet", "commhard"];
let SVCS = RES.slice();
const state = {};   /* svcKey -> { rooms:{key:qty}, extra:sqft, tier, items:{key:qty} } */
let active = "carpet", me = null, user = null;

const st = k => state[k] || (state[k] = { rooms: {}, extra: 0, tier: "deep", items: {} });

/* One service's sq ft and price. */
function calc(k){
  const s = P.SERVICES[k], x = st(k);
  if (s.mode === "items") {
    let ft = 0; s.items.forEach(it => ft += (x.items[it.key] || 0) * it.ft);
    return { sqft: 0, price: ft * s.rate, detail: ft ? ft + " linear ft" : "" };
  }
  const rate = s.tiers ? s.tiers[x.tier].sqft : s.rate;
  let sqft = 0, flat = 0;
  ROOMS.forEach(r => { const q = x.rooms[r.key] || 0; if (!q) return; if (r.flat) flat += q * r.flat; else sqft += q * r.sqft; });
  sqft += Number(x.extra) || 0;
  return { sqft, price: sqft * rate + flat, detail: (sqft ? Math.round(sqft).toLocaleString() + " sq ft" : "") + (flat ? (sqft ? " + " : "") + "stairs" : "") };
}
const used = k => calc(k).price > 0;

function drawTabs(){
  $("tabs").innerHTML = SVCS.map(k => {
    const n = used(k) ? '<span class="ct">✓</span>' : "";
    return '<button type="button" role="tab" data-svc="' + k + '" class="' + (k === active ? "on" : "") + '" aria-selected="' + (k === active) + '">' +
      esc(P.SERVICES[k].name) + n + '</button>';
  }).join("");
}
const counter = (kind, key, q) => '<div class="cnt"><button type="button" data-' + kind + '="' + key + '" data-d="-1" aria-label="Less">−</button>' +
  '<span>' + q + '</span><button type="button" data-' + kind + '="' + key + '" data-d="1" aria-label="More">+</button></div>';

function drawBody(){
  const s = P.SERVICES[active], x = st(active);
  let h = "";
  if (s.tiers) h += '<label class="f" for="tier">Package</label><select id="tier">' +
    Object.entries(s.tiers).filter(([k]) => k !== "quickdry").map(([k, t]) =>
      '<option value="' + k + '"' + (x.tier === k ? " selected" : "") + '>' + esc(t.name) + ' · $' + t.sqft.toFixed(2) + '/sq ft</option>').join("") + '</select>';
  else if (s.mode !== "items") h += '<p class="empty">$' + s.rate.toFixed(2) + ' per sq ft</p>';
  if (s.mode === "items") {
    h += '<p class="empty">$' + s.rate + ' per linear foot</p><div class="rooms">' + s.items.map(it => {
      const q = x.items[it.key] || 0;
      return '<div class="room' + (q ? " has" : "") + '"><div><b>' + esc(it.name) + '</b><small>' + it.ft + ' linear ft</small></div>' + counter("item", it.key, q) + '</div>';
    }).join("") + '</div>';
  } else {
    h += '<label class="f">Rooms</label><div class="rooms">' + ROOMS.map(r => {
      const q = x.rooms[r.key] || 0;
      return '<div class="room' + (q ? " has" : "") + '"><div><b>' + esc(r.name) + '</b><small>' +
        (r.flat ? "$" + r.flat + " per flight" : "about " + r.sqft + " sq ft") + '</small></div>' + counter("room", r.key, q) + '</div>';
    }).join("") + '</div>' +
    '<label class="f" for="extra">Extra square feet (optional)</label><input id="extra" type="number" min="0" step="10" inputmode="numeric" value="' + (x.extra || "") + '" placeholder="e.g. 120">';
  }
  $("svcBody").innerHTML = h;
}

function drawSum(){
  const lines = SVCS.filter(used).map(k => ({ k, ...calc(k) }));
  if (!lines.length) { $("sum").innerHTML = '<p class="empty">Add rooms to see your price.</p>'; $("sendBtn").disabled = true; return; }
  const sub = lines.reduce((a, l) => a + l.price, 0), disc = sub * PARTNER_DISCOUNT;
  const total = Math.max(MINIMUM, sub - disc);
  $("sum").innerHTML = lines.map(l => '<div class="line"><span>' + esc(P.SERVICES[l.k].name) + (l.detail ? '<br><small style="color:var(--muted)">' + esc(l.detail) + '</small>' : '') +
      '</span><span>' + money(l.price) + '</span></div>').join("") +
    '<div class="line"><span>Subtotal</span><span>' + money(sub) + '</span></div>' +
    '<div class="line disc"><span>Partner discount (' + Math.round(PARTNER_DISCOUNT * 100) + '%)</span><span>−' + money(disc) + '</span></div>' +
    '<div class="line total"><span>Total</span><span>' + money(total) + '</span></div>' +
    (sub - disc < MINIMUM ? '<p class="note">$' + MINIMUM + ' job minimum applies.</p>' : '') +
    '<p class="note">Room sizes are averages. We confirm the final price on site.</p>';
  $("sendBtn").disabled = false;
  return { lines, sub, disc, total };
}
const redraw = () => { drawTabs(); drawBody(); drawSum(); };

$("tabs").addEventListener("click", e => { const b = e.target.closest("[data-svc]"); if (!b) return; active = b.dataset.svc; redraw(); });
$("svcBody").addEventListener("click", e => {
  const b = e.target.closest("[data-room],[data-item]"); if (!b) return;
  const x = st(active), d = Number(b.dataset.d);
  if (b.dataset.room) { const r = ROOMS.find(r => r.key === b.dataset.room), step = r.step || 1;
    x.rooms[r.key] = Math.max(0, Math.round(((x.rooms[r.key] || 0) + d * step) * 2) / 2); }
  else x.items[b.dataset.item] = Math.max(0, (x.items[b.dataset.item] || 0) + d);
  drawTabs(); drawBody(); drawSum();
});
$("svcBody").addEventListener("change", e => {
  if (e.target.id === "tier") { st(active).tier = e.target.value; drawTabs(); drawSum(); }
});
$("svcBody").addEventListener("input", e => {
  if (e.target.id === "extra") { st(active).extra = Math.max(0, Number(e.target.value) || 0); drawTabs(); drawSum(); }
});

/* Send: files a lead in the app (Leads page) with the full breakdown in the message. */
$("sendBtn").addEventListener("click", async () => {
  const s = drawSum(); if (!s || !user) return;
  const msg = $("msg"); msg.classList.remove("bad");
  const street = $("street").value.trim();
  if (!street) { msg.classList.add("bad"); msg.textContent = "Add the property address first."; $("street").focus(); return; }
  const btn = $("sendBtn"); btn.disabled = true; btn.textContent = "Sending…";
  const breakdown = s.lines.map(l => {
    const sv = P.SERVICES[l.k], x = st(l.k);
    const parts = sv.mode === "items"
      ? sv.items.filter(it => x.items[it.key]).map(it => x.items[it.key] + " × " + it.name)
      : ROOMS.filter(r => x.rooms[r.key]).map(r => x.rooms[r.key] + " × " + r.name).concat(x.extra ? [x.extra + " extra sq ft"] : []);
    return "• " + sv.name + (sv.tiers ? " (" + sv.tiers[x.tier].name + ")" : "") + ": " + parts.join(", ") + " = " + money(l.price);
  });
  const text = [
    "PARTNER ESTIMATE from " + (me.businessName || "") + " (" + (me.type || "Partner") + ")",
    ...breakdown,
    "Subtotal " + money(s.sub) + " · Partner discount −" + money(s.disc) + " · Total " + money(s.total),
    "Access: " + $("access").value,
    $("notes").value.trim() ? "Notes: " + $("notes").value.trim() : ""
  ].filter(Boolean).join("\n");
  try {
    await addDoc(collection(db, "leads"), {
      source: "partner-estimate", page: "partner-portal", status: "new", createdAt: serverTimestamp(),
      name: (me.contactName || "") + (me.businessName ? " (" + me.businessName + ")" : ""),
      phone: me.phone || "", email: me.email || user.email || "",
      type: String(me.type || "").toLowerCase(),
      addresses: [{ street, city: $("city").value.trim(), state: "CA", zip: $("zip").value.trim() }],
      services: s.lines.map(l => P.SERVICES[l.k].quoteValue || P.SERVICES[l.k].name),
      when: $("when").value || "",
      message: text.slice(0, 4800)
    });
    msg.textContent = "Sent! We’ll confirm the price and the date with you shortly.";
    btn.textContent = "Sent ✓";
  } catch (e) {
    console.error(e); msg.classList.add("bad");
    msg.textContent = "Couldn’t send. Try again, or call (916) 767-2520.";
    btn.disabled = false; btn.textContent = "Send to Khean & Clean";
  }
});

/* Page lock: partners (and staff, for checking it). Partners need their profile. */
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "5SNJ2DzfrycMrEfbex73Lywf7KB3", "eoYah1xNcaT7R4lAMOVFFMS7ITN2"];
onAuthStateChanged(auth, async u => {
  if (!u) { location.replace("./b2b-login.html"); return; }
  user = u;
  if (STAFF.includes(u.uid)) me = { businessName: "Staff test", contactName: u.email, type: "Commercial", email: u.email };
  else {
    let snap = null; try { snap = await getDoc(doc(db, "partners", u.uid)); } catch (e) { console.error(e); }
    if (!snap || !snap.exists()) { location.replace("./b2b-login.html"); return; }
    me = snap.data();
  }
  if (String(me.type).toLowerCase() === "commercial") SVCS = RES.concat(COMM);
  $("authwait").remove();
  redraw();
});
</script>
</body>
</html>
