<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Table Profile</title>
<style>
/* Table Profile (Player Tracker): one table's history. A month calendar; tap a day for that day's log:
   every player, dealer and guest session at this table, with seat and times.
   Player/dealer sessions come from playerTracker/log (events that carry tb = table, sn = seat).
   Guest sessions come from playerTracker/guests. Guests under 10 minutes are dropped.
   A guest session can be fixed (start/end) and given to a player, even days later; every fix records who and when. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171;--guest:#a78bfa}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:14px}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.box{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin-top:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tabs a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:5px 12px;font-size:14px}
.tabs a.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:700}
.mh{display:flex;align-items:center;gap:10px}
.mh b{flex:1;text-align:center;font-size:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal .dn{font-size:12px;color:rgba(255,255,255,.6);text-align:center}
.cal button{background:#000;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;min-height:52px;padding:4px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.cal button.today{border-color:var(--gold)}
.cal button.sel{background:var(--gold);color:#000}
.cal button .c{font-size:11px;font-weight:700;color:var(--ok)}
.cal button .g{font-size:11px;font-weight:700;color:var(--guest)}
.cal button.sel .c,.cal button.sel .g{color:#000}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:180px}
.row .nm a{color:#fff;font-weight:700;text-decoration:underline;text-decoration-color:rgba(227,182,74,.6)}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.p{background:var(--ok);color:#000}
.tag.d{background:rgba(255,255,255,.2)}
.tag.g{background:var(--guest);color:#000}
.note{color:rgba(255,255,255,.7);font-size:14px}
.note a{color:var(--gold)}
.ed{display:grid;gap:8px;width:100%;background:#000;border-radius:10px;padding:10px;margin-top:4px}
.ed label{font-size:13px;color:rgba(255,255,255,.7);display:grid;gap:2px}
.ed input{background:#0b1220;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:10px;font:inherit;width:100%}
.ed .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.edited{font-size:12px;color:var(--gold)}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./floor.html">&lsaquo; Floor</a><h1 id="title">Table</h1></div>
  <div class="warn" id="warn">Not syncing with the server.</div>
  <div class="tabs" id="tabs"></div>
  <div class="box">
    <div class="mh"><button class="btn ghost sm" id="prev" aria-label="Last month">&lsaquo;</button><b id="month"></b><button class="btn ghost sm" id="next" aria-label="Next month">&rsaquo;</button></div>
    <div class="cal" id="cal"></div>
    <p class="note" style="margin:8px 0 0"><span style="color:var(--ok)">&#9679;</span> players &nbsp; <span style="color:var(--guest)">&#9679;</span> guests</p>
  </div>
  <div class="box">
    <div style="display:flex;align-items:center;gap:10px"><b id="dayTitle" style="flex:1"></b></div>
    <div id="dayLog"></div>
  </div>
  <datalist id="playerNames"></datalist>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc as fsDoc, setDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { ROSTER, DEALERS, CASINO, casinoDoc } from "./pt-people.js";
const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), LOGREF = doc(db, "playerTracker", "log"), PROFREF = doc(db, "playerTracker", "profiles");
const ROSTREF = doc(db, "playerTracker", "roster"), GUESTREF = doc(db, "playerTracker", "guests"), LISTREF = doc(db, "playerTracker", "tablelist");
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fail = () => { $("warn").style.display = "block"; };
const fmtHrs = ms => { const m = Math.max(0, Math.floor(ms / 60000)); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const clock = t => new Date(t).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
const dayKey = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const hhmm = t => { const d = new Date(t); return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
const MIN_GUEST = 10 * 60000;   // guest sessions under 10 minutes are dropped

/* Same tables as the Floor page: EDH's starter tables 1-5, plus the floor's edits and added tables (tablelist). */
const BASE_TABLES = CASINO !== "edh" ? {} : {
  1: { game: "Blackjack" }, 2: { game: "Baccarat" }, 3: { game: "Poker" }, 4: { game: "Three Card Poker" }, 5: { game: "Ultimate Texas Hold'em" }
};
let TABLES = { ...BASE_TABLES };
const T = +(new URLSearchParams(location.search).get("t")) || 1;

let state = {}, roster = {}, profiles = {}, events = [], guests = {};
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || DEALERS[c] || c;
const isPlayer = c => !!(c && (ROSTER[c] || roster[c]));
/* Who's making a fix: the signed-in staff account, else a name asked once on this device. */
let me = "";
const whoAmI = () => {
  if (me) return me;
  let n = ""; try { n = localStorage.getItem("playerTracker.staffName") || ""; } catch (e) {}
  if (!n) { n = (prompt("Your name (saved with the fix):") || "").trim(); if (n) try { localStorage.setItem("playerTracker.staffName", n); } catch (e) {} }
  return n;
};

/* Player and dealer sessions at this table, from the log. A session starts at an event that says they're seated here
   (tb = this table) and ends at their next event (logged out, moved seat, moved table). Old log lines without a
   table number can't be placed, so they're skipped. */
function sessions() {
  const by = {};
  for (const e of [...events].sort((a, b) => a.t - b.t)) (by[e.c] = by[e.c] || []).push(e);
  const out = [];
  for (const [c, evs] of Object.entries(by)) {
    let cur = null;
    for (const e of evs) {
      if (/^Guest hours added/.test(e.a)) continue;
      const here = +e.tb === T && e.sn != null;
      /* Ends on log out / joining the list, or an event placing them at another seat or table.
         Breaks and wagers at the same seat keep the session going. */
      const ends = /^(Logged out|Joined the list)/.test(e.a) || (e.tb != null && !(here && cur && e.sn === cur.s));
      if (cur && ends) { cur.end = e.t; out.push(cur); cur = null; }
      if (!cur && here) cur = { c, s: e.sn, start: e.t, end: null };
    }
    if (cur) {   // still open: only if they're still seated here, else it ended with no log line
      const p = state[c];
      if (p && p.status === "seated" && (p.table || 1) === T) out.push(cur);
    }
  }
  return out;
}
const guestList = () => Object.entries(guests).filter(([, g]) => g && +g.t === T && (!g.end || g.end - g.start >= MIN_GUEST || g.to));

let view = new Date(); view.setDate(1);
let sel = dayKey(Date.now()), editing = null;

function render() {
  const tb = TABLES[T];
  $("title").textContent = "Table " + T + (tb ? " · " + tb.game : "");
  document.title = "Table " + T + " Profile";
  $("tabs").innerHTML = Object.keys(TABLES).sort((a, b) => a - b).map(n => `<a href="?t=${n}"${+n === T ? ' class="on"' : ""}>Table ${n}</a>`).join("");

  const ss = sessions(), gs = guestList();
  const count = {};
  for (const s of ss) { const k = dayKey(s.start); (count[k] = count[k] || { p: 0, g: 0 }).p++; }
  for (const [, g] of gs) { const k = dayKey(g.start); (count[k] = count[k] || { p: 0, g: 0 }).g++; }

  /* Calendar */
  const y = view.getFullYear(), m = view.getMonth();
  $("month").textContent = view.toLocaleDateString([], { month: "long", year: "numeric" });
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate(), today = dayKey(Date.now());
  let h = ["S", "M", "T", "W", "T", "F", "S"].map(d => `<div class="dn">${d}</div>`).join("");
  for (let i = 0; i < first; i++) h += "<div></div>";
  for (let d = 1; d <= days; d++) {
    const k = dayKey(new Date(y, m, d)), n = count[k];
    h += `<button data-day="${k}" class="${k === today ? "today " : ""}${k === sel ? "sel" : ""}">${d}`
      + (n && n.p ? `<span class="c">${n.p}</span>` : "") + (n && n.g ? `<span class="g">${n.g}</span>` : "") + `</button>`;
  }
  $("cal").innerHTML = h;

  /* That day's log */
  const [sy, sm, sd] = sel.split("-").map(Number);
  $("dayTitle").textContent = new Date(sy, sm - 1, sd).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" });
  const rows = [
    ...ss.filter(s => dayKey(s.start) === sel).map(s => ({ kind: DEALERS[s.c] ? "d" : "p", ...s })),
    ...gs.filter(([, g]) => dayKey(g.start) === sel).map(([id, g]) => ({ kind: "g", id, ...g }))
  ].sort((a, b) => a.start - b.start);
  $("dayLog").innerHTML = rows.length ? rows.map(r => {
    const when = (r.kind === "d" ? "Dealer" : "Seat " + r.s) + " &middot; " + clock(r.start) + " to " + (r.end ? clock(r.end) : "now") + " (" + fmtHrs((r.end || Date.now()) - r.start) + ")";
    if (r.kind !== "g") return `<div class="row"><div class="nm"><a href="./player-tracker.html?profile=${encodeURIComponent(r.c)}">${esc(nameOf(r.c))}</a><span>${when}</span></div>
      <span class="tag ${r.kind}">${r.kind === "d" ? "Dealer" : "Player"}</span></div>`;
    const ed = r.edits && r.edits.length ? r.edits[r.edits.length - 1] : null;
    const edTxt = ed ? `<span class="edited">Edited by ${esc(ed.by)}, ${new Date(ed.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</span>` : "";
    const right = !r.end ? `<span class="tag g">Guest &middot; sitting</span>`
      : r.to ? `<span class="note" style="margin:0">Given to <a href="./player-tracker.html?profile=${encodeURIComponent(r.to)}">${esc(nameOf(r.to))}</a></span>`
      : `<button class="btn sm ghost" data-fix="${r.id}">Fix / give hours</button>`;
    const form = editing === r.id ? `<div class="ed">
        <div class="two"><label>Start<input type="time" id="fxS" value="${hhmm(r.start)}"></label><label>End<input type="time" id="fxE" value="${hhmm(r.end)}"></label></div>
        <label>Give to player (optional)<input id="fxP" list="playerNames" placeholder="Player name" autocomplete="off"></label>
        <div><button class="btn sm ok" data-save="${r.id}">Save</button> <button class="btn sm ghost" data-cancel>Cancel</button></div></div>` : "";
    return `<div class="row"><div class="nm"><b>Guest</b><span>${when}</span>${edTxt}</div>${right}${form}</div>`;
  }).join("") : `<div class="note" style="margin-top:6px">Nothing logged at this table that day.</div>`;
}

$("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
$("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
$("cal").addEventListener("click", e => { const b = e.target.closest("[data-day]"); if (!b) return; sel = b.dataset.day; editing = null; render(); });
$("dayLog").addEventListener("click", e => {
  const f = e.target.closest("[data-fix]"), c = e.target.closest("[data-cancel]"), s = e.target.closest("[data-save]");
  if (f) { editing = f.dataset.fix; render(); return; }
  if (c) { editing = null; render(); return; }
  if (!s) return;
  const id = s.dataset.save, g = guests[id]; if (!g) return;
  const at = (base, v) => { const [hh, mm] = v.split(":").map(Number); const d = new Date(base); d.setHours(hh, mm, 0, 0); return d.getTime(); };
  const start = at(g.start, $("fxS").value), end = at(g.start, $("fxE").value);
  if (!(end > start)) { alert("End has to be after start."); return; }
  const v = $("fxP").value.trim(), mt = v.match(/#(\w+)\s*$/);
  const to = v ? (mt ? mt[1] : Object.keys({ ...ROSTER, ...roster }).find(k => nameOf(k).toLowerCase() === v.toLowerCase())) : null;
  if (v && !isPlayer(to)) { alert("Pick a player from the list."); return; }
  const by = whoAmI(); if (!by) { alert("Enter your name to save a fix."); return; }
  const edits = [...(g.edits || []), { by, at: Date.now(), from: { start: g.start, end: g.end }, to: { start, end }, ...(to ? { gave: to } : {}) }];
  const ng = { ...g, start, end, edits, ...(to ? { to } : {}) };
  guests[id] = ng; editing = null; render();
  setDoc(GUESTREF, { [id]: ng }, { merge: true }).catch(fail);
  if (to) {   // same as Give hours on the Testing page; hours from today also go on today's total
    const ms = end - start, p = state[to] || { status: "out", totalMs: 0 };
    if (dayKey(start) === dayKey(Date.now())) setDoc(REF, { [to]: { ...p, totalMs: (p.totalMs || 0) + ms } }, { merge: true }).catch(fail);
    setDoc(LOGREF, { events: arrayUnion({ c: to, t: Date.now(),
      a: "Guest hours added: table " + T + " seat " + g.s + ", " + new Date(start).toLocaleDateString() + " " + clock(start) + " to " + clock(end) + " (" + fmtHrs(ms) + "), by " + by }) }, { merge: true }).catch(fail);
  }
});

onAuthStateChanged(getAuth(app), u => {
  /* No login for now (Player Tracker is open to anyone with the link while testing). */
  me = u ? (u.displayName || u.email || "") : "";
  document.body.style.visibility = "visible";
  render();
  onSnapshot(REF, snap => { $("warn").style.display = "none"; state = snap.exists() ? snap.data() : {}; render(); }, fail);
  onSnapshot(LOGREF, snap => { events = (snap.exists() && snap.data().events) || []; render(); }, fail);
  onSnapshot(GUESTREF, snap => { guests = snap.exists() ? snap.data() : {}; if (!editing) render(); }, () => {});
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; fillNames(); render(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; fillNames(); render(); }, () => {});
  onSnapshot(LISTREF, snap => {
    const list = snap.exists() ? snap.data() : {}, X = { ...BASE_TABLES };
    for (const [n, t] of Object.entries(list)) { if (!t) continue; if (t.deleted) { delete X[n]; continue; } const g = t.game || (BASE_TABLES[n] || {}).game; if (g) X[n] = { game: g }; }
    TABLES = X; render();
  }, () => {});
  setInterval(() => { if (!editing) render(); }, 60000);
});
function fillNames() {
  $("playerNames").innerHTML = [...new Set([...Object.keys(ROSTER), ...Object.keys(roster)])].map(c => `<option value="${esc(nameOf(c))} #${c}">`).join("");
}
</script>
</body>
</html>
