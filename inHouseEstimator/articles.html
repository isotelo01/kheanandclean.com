<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex, nofollow">
<title>Articles &middot; Khean &amp; Clean</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Articles: SEO article ideas, notes and drafts for the website. Staff only. Firestore: articles.
   Each one moves Idea -> Drafting -> Ready -> Published. Everything saves on its own as you type. */
:root{--navy:#172239;--gold:#E3B64A;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
.back{color:var(--muted);font-size:14px;text-decoration:none}
h1{font:700 30px/1.2 "Archivo",system-ui,sans-serif;margin:8px 0 4px;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
.panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(23,34,57,.08)}
.newbtn{width:100%;background:var(--navy);color:var(--gold);border:0;border-radius:999px;padding:11px;font:700 15px "Archivo",sans-serif;cursor:pointer;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 12.5px "Archivo",sans-serif;cursor:pointer;color:var(--ink)}
.filters button.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:4px solid var(--c,#999);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:#f5f6f8}
.item.on{background:#f0f2f6}
.item b{display:block;font-size:15px;line-height:1.3}
.item small{color:var(--muted);font-size:12.5px}
label.f{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.title{width:100%;font:700 24px/1.25 "Archivo",system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);padding:6px 0;background:transparent;color:var(--ink)}
.title:focus{outline:none;border-color:var(--gold)}
input.t,select,textarea{width:100%;font:16px/1.5 "Archivo",sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
#notes{min-height:160px}
#body{min-height:380px;font-family:"Archivo",system-ui,sans-serif;font-size:17px;line-height:1.7}
.row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.saved{color:var(--muted);font-size:13.5px}
.ghost{background:transparent;color:#b3261e;border:1px solid #b3261e;border-radius:999px;padding:7px 14px;font:600 13.5px "Archivo",sans-serif;cursor:pointer;margin-left:auto}
.copy{background:transparent;color:var(--navy);border:1px solid var(--navy);border-radius:999px;padding:7px 14px;font:600 13.5px "Archivo",sans-serif;cursor:pointer}
.words{color:var(--muted);font-size:13px;text-align:right;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
:where(a,button,input,select,textarea):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:820px){ .layout{grid-template-columns:1fr} .row{grid-template-columns:1fr} }
</style>
<link rel="stylesheet" href="./theme-dark.css">
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <a class="back" href="./hub.html">&lsaquo; Hub</a>
  <h1>Articles</h1>
  <p class="sub">Ideas, notes and drafts for website articles. Everything saves on its own as you type.</p>
  <div class="layout">
    <aside class="panel">
      <button type="button" class="newbtn" id="newBtn">+ New idea</button>
      <div class="filters" id="filters"></div>
      <div id="list"><div class="empty">Loading&hellip;</div></div>
    </aside>
    <main class="panel" id="editor"><div class="empty">Pick an idea on the left, or tap + New idea.</div></main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, addDoc, setDoc, deleteDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const auth = getAuth(app), db = getFirestore(app);
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "5SNJ2DzfrycMrEfbex73Lywf7KB3", "eoYah1xNcaT7R4lAMOVFFMS7ITN2"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STATUS = { idea: ["Idea", "#8a94a6"], drafting: ["Drafting", "#c48a12"], ready: ["Ready", "#2f6fb0"], published: ["Published", "#2e8a57"] };
const ms = t => t && t.toMillis ? t.toMillis() : (Number(t) || 0);
const words = s => (String(s || "").trim().match(/\S+/g) || []).length;

/* First two ideas, added once when the page is empty. */
const STARTERS = [
  { title: "What fabric to buy for your furniture (and what not to)", keywords: "best couch fabric, pet friendly sofa fabric, easy to clean upholstery",
    notes: "A cleaner's honest opinion: which upholstery fabrics hold up and clean well, which ones to avoid, and what to look out for when buying.\n- " },
  { title: "Area rugs: what to buy, what not to buy", keywords: "best area rug material, washable rugs, rugs for pets",
    notes: "What to look for in an area rug from someone who cleans them: materials, backings, dyes, and the ones that give people trouble.\n- " },
  { title: "Why deep cleaning matters", keywords: "is professional carpet cleaning worth it, deep carpet cleaning, how often to deep clean carpet",
    notes: "Why a real deep clean is worth paying a pro for, compared to vacuuming or a rental machine.\n- " },
  { title: "The CRB vs a regular brush (and how it pulls out pet hair)", keywords: "CRB carpet cleaning, counter rotating brush, how to get pet hair out of carpet",
    notes: "Why we use a CRB instead of a regular brush, and how it gets embedded pet hair out of carpet. Could split pet hair into its own article later.\n- " },
  { title: "The truth about cat pee", keywords: "cat urine carpet, how to get cat pee smell out of carpet, cat pee smell keeps coming back",
    notes: "The honest truth about cat urine in carpet: where it really goes and why the smell keeps coming back.\n- " },
  { title: "How to clean dog grease spots off carpet (Folsom)", keywords: "dog grease spot carpet, dark spot where dog lays, how to clean dog oil off carpet, carpet cleaning Folsom",
    notes: "Local article for Folsom dog owners with that one greasy spot where the dog always lays.\n" +
      "Outline:\n1. What the dark greasy spot is\n2. How to fix it yourself (step by step)\n" +
      "3. If it's still there, call us: a quick small job for just that area if you live in Folsom\n- " }
];

let items = [], cur = null, filter = "all", timer = null;
const sorted = () => items.slice().sort((a, b) => ms(b.updatedAt) - ms(a.updatedAt));

function drawFilters(){
  const counts = { all: items.length };
  items.forEach(a => counts[a.status] = (counts[a.status] || 0) + 1);
  $("filters").innerHTML = [["all", "All"], ...Object.entries(STATUS).map(([k, v]) => [k, v[0]])].map(([k, l]) =>
    '<button type="button" data-f="' + k + '" class="' + (filter === k ? "on" : "") + '">' + l + ' ' + (counts[k] || 0) + '</button>').join("");
}
function drawList(){
  const xs = sorted().filter(a => filter === "all" || a.status === filter);
  $("list").innerHTML = xs.length ? xs.map(a => {
    const s = STATUS[a.status] || STATUS.idea;
    return '<button type="button" class="item' + (cur && cur.id === a.id ? " on" : "") + '" style="--c:' + s[1] + '" data-id="' + esc(a.id) + '">' +
      '<b>' + esc(a.title || "Untitled") + '</b><small>' + s[0] + (words(a.body) ? " · " + words(a.body) + " words" : "") + '</small></button>';
  }).join("") : '<div class="empty">Nothing here yet.</div>';
}

function drawEditor(){
  if (!cur) { $("editor").innerHTML = '<div class="empty">Pick an idea on the left, or tap + New idea.</div>'; return; }
  $("editor").innerHTML =
    '<input class="title" id="eTitle" placeholder="Article title" value="' + esc(cur.title) + '" aria-label="Title">' +
    '<div class="row"><div><label class="f" for="eStatus">Status</label><select id="eStatus">' +
      Object.entries(STATUS).map(([k, v]) => '<option value="' + k + '"' + (cur.status === k ? " selected" : "") + '>' + v[0] + '</option>').join("") + '</select></div>' +
    '<div><label class="f" for="eKeys">Search phrases (what people type into Google)</label><input class="t" id="eKeys" value="' + esc(cur.keywords) + '" placeholder="e.g. best couch fabric for pets"></div></div>' +
    '<label class="f" for="notes">Notes and ideas</label><textarea id="notes" placeholder="Points to make, stories from jobs, what to recommend, what to warn about">' + esc(cur.notes) + '</textarea>' +
    '<label class="f" for="body">Article</label><textarea id="body" placeholder="Write the article here when you’re ready">' + esc(cur.body) + '</textarea>' +
    '<div class="words" id="wc">' + words(cur.body) + ' words</div>' +
    '<div class="bar"><span class="saved" id="saved">Saved</span><button type="button" class="copy" id="copyBtn">Copy article</button>' +
    '<button type="button" class="ghost" id="delBtn">Delete</button></div>';
}

/* Saves a second after you stop typing. */
const fields = { eTitle: "title", eStatus: "status", eKeys: "keywords", notes: "notes", body: "body" };
function queueSave(){
  $("saved").textContent = "Saving…";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const a = cur; if (!a) return;
    const data = { title: a.title, status: a.status, keywords: a.keywords, notes: a.notes, body: a.body, updatedAt: serverTimestamp() };
    try { await setDoc(doc(db, "articles", a.id), data, { merge: true }); a.updatedAt = Date.now();
      if ($("saved")) $("saved").textContent = "Saved"; drawFilters(); drawList(); }
    catch (e) { console.error(e); if ($("saved")) $("saved").textContent = "Couldn’t save. Check your connection."; }
  }, 900);
}
$("editor").addEventListener("input", e => {
  const f = fields[e.target.id]; if (!f || !cur) return;
  cur[f] = e.target.value;
  if (f === "body") $("wc").textContent = words(cur.body) + " words";
  queueSave();
});
$("editor").addEventListener("change", e => { if (e.target.id === "eStatus") { cur.status = e.target.value; queueSave(); } });
$("editor").addEventListener("click", async e => {
  if (e.target.id === "copyBtn") {
    const text = (cur.title ? cur.title + "\n\n" : "") + (cur.body || "");
    try { await navigator.clipboard.writeText(text); e.target.textContent = "Copied"; } catch (err) { e.target.textContent = "Couldn’t copy"; }
    setTimeout(() => { if ($("copyBtn")) $("copyBtn").textContent = "Copy article"; }, 1600);
  }
  if (e.target.id === "delBtn" && cur && confirm("Delete “" + (cur.title || "Untitled") + "”?")) {
    try { await deleteDoc(doc(db, "articles", cur.id)); items = items.filter(a => a !== cur); cur = null; drawFilters(); drawList(); drawEditor(); }
    catch (err) { console.error(err); alert("Couldn't delete."); }
  }
});
$("list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  cur = items.find(a => a.id === b.dataset.id); drawList(); drawEditor();
  if (window.innerWidth < 820) $("editor").scrollIntoView({ behavior: "smooth" });
});
$("filters").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; filter = b.dataset.f; drawFilters(); drawList(); });
$("newBtn").onclick = async () => {
  const a = { title: "", status: "idea", keywords: "", notes: "", body: "", createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
  try { const r = await addDoc(collection(db, "articles"), a); cur = { ...a, id: r.id, updatedAt: Date.now() }; items.push(cur);
    filter = "all"; drawFilters(); drawList(); drawEditor(); $("eTitle").focus(); }
  catch (e) { console.error(e); alert("Couldn't add an idea."); }
};

async function load(){
  let snap = await getDocs(collection(db, "articles"));
  /* Starter ideas: each added once (remembered in meta/articlesSeeded), so a deleted one never comes back. */
  const seedRef = doc(db, "meta", "articlesSeeded");
  const seeded = new Set(((await getDoc(seedRef)).data() || {}).titles || []);
  snap.docs.forEach(d => seeded.has(d.data().title) || (d.data().title && seeded.add(d.data().title)));
  const todo = STARTERS.filter(s => !seeded.has(s.title));
  if (todo.length) {
    for (const s of todo) { await addDoc(collection(db, "articles"), { ...s, status: "idea", body: "", createdAt: serverTimestamp(), updatedAt: serverTimestamp() }); seeded.add(s.title); }
    await setDoc(seedRef, { titles: [...seeded].slice(0, 200) }, { merge: true });
    snap = await getDocs(collection(db, "articles"));
  } else if (!(await getDoc(seedRef)).exists()) await setDoc(seedRef, { titles: [...seeded].slice(0, 200) });
  items = snap.docs.map(d => ({ id: d.id, title: "", status: "idea", keywords: "", notes: "", body: "", ...d.data() }));
  drawFilters(); drawList();
}

/* Page lock: staff only. */
onAuthStateChanged(auth, u => {
  if (!u) { location.replace("./login.html?next=articles.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  $("authwait")?.remove();
  load().catch(e => { console.error(e); $("list").innerHTML = '<div class="empty">Couldn’t load articles.</div>'; });
});
</script>
<script src="./tabbar.js" defer></script>
</body>
</html>
