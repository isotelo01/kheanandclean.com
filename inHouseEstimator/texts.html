<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K&amp;C Estimator">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Texts &middot; Khean &amp; Clean</title>
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
/* Same look as leads.html. Texts to and from (916) 767-2520: the list of conversations,
   one conversation with a reply box, and New text. Reading comes straight from Firestore
   (smsThreads); sending goes through the smsSend function, which talks to Twilio. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 80px/1.2 "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
.msg{color:var(--muted);font-size:15px;padding:6px 2px}
.msg.err{color:var(--red)}
:where(a,button):focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* The list: one row per phone number, newest first. Gold edge + count = unread. */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;color:inherit;background:#fff;
  border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:12px 16px;border-left:4px solid transparent}
.row:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
.row.unread{border-left-color:var(--gold)}
.who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .who{font-weight:700}
.when{color:var(--muted);font-size:13px;white-space:nowrap;text-align:right}
.last{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .last{color:var(--ink)}
.badge{justify-self:end;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--navy);font:700 12px/22px "Archivo";text-align:center;padding:0 6px}
.stop{color:var(--red);font-size:12px;font-weight:700;margin-left:8px}
.fbtag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#0866ff;border-radius:999px;padding:1px 8px;margin-left:8px;vertical-align:2px}
/* Delete a conversation: small X under the time (desktop) or swipe left (phone). Both send it to Trash. */
.rside{display:flex;align-items:center;gap:8px;justify-self:end}
.tdel{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--red);font:700 15px/1 "Archivo";cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.tdel{opacity:.35;transition:opacity .15s}
.tdel:hover,.tdel:focus-visible{opacity:1}
.tres{font:600 13px "Archivo";border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:3px 10px;cursor:pointer}
@media (hover:none){.tdel{display:none}}
.swipe{position:relative;border-radius:10px;overflow:hidden;background:var(--red)}
.swipe::after{content:"Trash";position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#fff;font-weight:700;font-size:14px}
.swipe .row{position:relative;z-index:1;transition:transform .2s;touch-action:pan-y}
.swipe.dragging .row{transition:none}
.trashlink{display:inline-block;margin-top:14px;font-size:14px;color:var(--muted)}
.undo{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;z-index:60;display:flex;gap:14px;align-items:center;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.undo button{background:none;border:0;color:var(--gold);font:700 14px "Archivo";cursor:pointer}

/* One conversation: their texts on the left, yours on the right in navy. */
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:16px}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
.chead h2{font:700 22px "Archivo",system-ui,sans-serif;margin:0}
#cname{cursor:pointer}
#cname:hover{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:4px}
.chead a{color:var(--navy);font-weight:600;text-decoration:none}
.banner{background:#f9e7e6;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.thread{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding:4px 2px 8px}
.day{align-self:center;font-size:12px;color:var(--muted);font-weight:600;margin:8px 0 2px}
/* Date labels in a conversation: no box (the dark theme boxes every .day for the calendar), a bit bigger. */
.thread .day{background:none;border:0;box-shadow:none;padding:0;font-size:15px;margin:12px 0 4px}
.b{max-width:80%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45}
.b.in{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.b img{display:block;max-width:220px;max-height:220px;border-radius:8px;margin:2px 0 4px}
/* Photos in a conversation: "+ Text" on each one adds it to a new text (Create text with photos). */
.pwrap{position:relative;display:inline-block;max-width:100%}
.fwd{position:absolute;right:6px;bottom:10px;font:700 12px/1 "Archivo",system-ui,sans-serif;padding:7px 9px;border-radius:999px;cursor:pointer;
  border:1px solid var(--gold);background:rgba(10,15,28,.82);color:var(--gold)}
.fwd.on{background:var(--gold);color:#172239}
.fwdbar{position:fixed;left:12px;right:12px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:45;display:flex;gap:8px;align-items:center;justify-content:space-between;
  max-width:560px;margin:0 auto;padding:10px 12px;border-radius:14px;background:#172239;border:1px solid var(--gold);box-shadow:0 10px 30px -10px rgba(0,0,0,.8)}
.fwdbar[hidden]{display:none}
.fwdbar .new{flex:1;text-align:center}
@media(min-width:820px){.fwdbar{bottom:20px}}
.fwdpics{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.fwdpics span{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.25);background:#000}
.fwdpics img,.fwdpics video{width:100%;height:100%;object-fit:cover;display:block}
.fwdpics button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:15px;line-height:22px;padding:0}
.b a{color:inherit}
.st{font-size:12px;color:var(--muted);margin:-2px 2px 4px}
.st.in{align-self:flex-start}
.st.out{align-self:flex-end;text-align:right}
.st.bad{color:var(--red);font-weight:600}
.reply{margin-top:12px;display:grid;gap:8px}
/* Reply assistant: offer bar, its question, and the 3 suggested replies. */
#ai{margin-top:12px}
.aibar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:14px}
.aibar b{color:var(--gold)}
.aibtns{display:flex;gap:8px;flex-wrap:wrap}
.aiq{display:grid;gap:8px}
.aiq input{font:15px "Archivo",system-ui,sans-serif;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#000;color:#fff}
.aisug{display:block;width:100%;text-align:left;font:15px/1.4 "Archivo",system-ui,sans-serif;padding:10px 12px;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:rgba(227,182,74,.08);color:inherit;cursor:pointer}
.aisug:hover{border-color:var(--gold)}
/* Say it (voice): mic button, red while listening, and the "You said" line. */
.aimic{display:inline-flex;align-items:center;gap:6px}
.aimic svg{width:16px;height:16px;flex:none}
.aimic.on{border-color:#ff6b6b;color:#fff;background:#c0392b;animation:aiPulse 1s ease-in-out infinite}
.aimic.done{border-color:#2ecc71;color:#fff;background:#1e8f4e}
@keyframes aiPulse{50%{box-shadow:0 0 0 6px rgba(255,107,107,.25)}}
.aisaid{font-size:13px;color:var(--muted);font-style:italic}
textarea,.field input{width:100%;font:inherit;padding:10px 12px;border:1px solid #c9cedb;border-radius:8px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus,.field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
#replyForm #body{min-height:120px;max-height:60vh;overflow-y:auto;line-height:1.45}
/* Check: "What's this reply about?" chips before it checks. */
.aitopics{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.ractions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
/* Left panel: everyone you can call or text, hottest first. Leads, Approved leads, Contacts.
   Each person shows once (Approved beats Leads beats Contacts). Tap the name for texts, Call to dial. */
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
#view{min-width:0}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:12px}
.side input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid #c9cedb;border-radius:8px;margin-bottom:6px}
.side input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.grp{border-top:1px solid var(--line);padding-top:4px;margin-top:6px}
.grp summary{cursor:pointer;font:700 13px "Archivo";letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:6px 2px;list-style-position:inside}
.pp{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 6px;border-left:3px solid transparent}
.pp:hover{background:var(--bg)}
.pp.on{background:var(--bg);border-left-color:var(--gold)}
.pp .open{flex:1;min-width:0;text-decoration:none;color:inherit;display:grid}
.pp .pn{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .ph{font-size:13px;color:var(--muted)}
.pp .dot{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--navy);font:700 11px/20px "Archivo";text-align:center;padding:0 5px}
.pp .call{flex:none;font:600 13px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff}
.pp .call:hover{border-color:var(--navy)}
.none{font-size:13px;color:var(--muted);padding:4px 6px}
/* Phone: on/off pill in the top bar, the call bar along the bottom, and the Calls list. */
.phone{font:600 14px "Archivo";background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.phone.on{color:var(--green);border-color:var(--green)}
.phone.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:1px}
.phone.bad{color:var(--red);border-color:var(--red)}
#callbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;width:min(560px,calc(100% - 24px));background:var(--navy);color:#fff;
  border-radius:12px;box-shadow:0 6px 24px rgba(23,34,57,.35);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#callbar .cb-who{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#callbar .cb-sub{display:block;font-weight:400;font-size:13px;opacity:.85}
#callbar button{font:600 15px "Archivo";border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
#callbar .cb-ok{background:#1f8a5b;color:#fff}
#callbar .cb-no{background:var(--red);color:#fff}
#callbar .cb-mute{background:#fff;color:var(--navy)}
#callbar .cb-mute[aria-pressed="true"]{background:var(--gold)}
.row .who a{color:inherit;text-decoration:none}
.row .call{justify-self:end;font:600 13px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:#fff}
.row.missed .last{color:var(--red);font-weight:600}
#callbar[hidden]{display:none}
/* Dial pad: small pop-up to call any number. */
#dialer{position:fixed;right:18px;top:84px;z-index:9;width:260px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(23,34,57,.22);padding:14px}
#dialer .dh{display:flex;align-items:center;justify-content:space-between;font:700 15px "Archivo";color:var(--navy);margin-bottom:8px}
#dialer .dx{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
#dialNum{width:100%;box-sizing:border-box;font:600 22px "Archivo";text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 6px;color:var(--navy)}
#dialer .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#dialer .keys button{font:600 20px "Archivo";background:var(--bg);color:var(--navy);border:0;border-radius:10px;padding:11px 0;cursor:pointer}
#dialer .keys button:hover{background:var(--line)}
#dialer .drow{display:flex;gap:8px}
#dialCall{flex:1;font:700 16px "Archivo";background:#1f8a5b;color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
#dialBack{font:600 18px "Archivo";background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:0 14px;cursor:pointer}
#dialMsg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1em}
#dialMsg.bad{color:var(--red)}
/* Reminders placeholder under the dial pad (nothing sends yet) */
#reminders{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
#reminders .rh{font:700 15px "Archivo";color:var(--navy);margin-bottom:6px}
#reminders .rbtn{display:block;width:100%;text-align:left;font:600 14px "Archivo";background:var(--bg);color:var(--navy);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;margin-top:6px;cursor:not-allowed;opacity:.85}
#reminders .rbtn small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
#reminders .rnote{font-size:12px;color:var(--muted);margin:8px 0 0}
@media(min-width:1024px){
  #reminders{margin:0;padding:0;border-top:0}
  #reminders .rh{background:var(--navy);color:#fff;font:700 18px "Archivo",system-ui,sans-serif;margin:0;padding:14px 18px;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold)}
  #reminders .rbody{padding:12px 18px 18px}
}
@media(max-width:540px){#dialer{left:12px;right:12px;width:auto;top:70px}}
@media(max-width:820px){.cols{grid-template-columns:1fr}.side{position:static;max-height:none}body.in-thread .side{display:none}}
@media(max-width:540px){.b{max-width:88%}.thread{max-height:56vh}.top{gap:10px}}
/* Desktop: the dial pad is part of the page, pinned on the right and always open.
   Phones and narrow windows keep the pop-up above. */
@media(min-width:1024px){
  .wrap{max-width:1400px}
  .cols{grid-template-columns:300px minmax(0,1fr) 290px}
  #dialBtn,#dialX{display:none}
  #dialer,#dialer[hidden]{display:block!important;position:sticky;top:12px;right:auto;width:auto;z-index:1;
    border:0;border-radius:12px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:0;overflow:hidden}
  #dialer .dh{background:var(--navy);color:#fff;font:700 18px "Archivo",system-ui,sans-serif;margin:0;padding:14px 18px;border-bottom:3px solid var(--gold)}
  #dialNum{display:block;width:calc(100% - 36px);margin:18px 18px 0;font-size:26px;letter-spacing:.02em;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:8px 4px}
  #dialNum:focus{outline:0;border-bottom-color:var(--gold)}
  #dialer .keys{gap:10px;margin:18px}
  #dialer .keys button{font-size:22px;padding:14px 0;border:1px solid var(--line);background:#fff;transition:background .12s,border-color .12s}
  #dialer .keys button:hover{background:#fbf3df;border-color:var(--gold)}
  #dialer .keys button:active{background:var(--gold)}
  #dialer .drow{margin:0 18px}
  #dialCall{font-size:17px;padding:13px;box-shadow:0 2px 8px rgba(31,138,91,.3)}
  #dialCall:hover{background:#18744c}
  #dialMsg{margin:12px 18px 18px;text-align:center}
}
/* Leads / Approved leads / Contacts live in the ☰ menu (top right). The search box stays on top
   across the page; typing in it opens the menu with the matches. */
.cols{grid-template-columns:minmax(0,1fr)}
.cols .side{grid-column:1/-1;position:static;max-height:none;overflow:visible;background:none;border:0;box-shadow:none;padding:0}
#people{display:none}
body.menu-open #people{display:block;position:fixed;right:12px;z-index:20;width:min(360px,calc(100% - 24px));max-height:70vh;overflow-y:auto;
  background:#172239;border:1px solid var(--gold);border-radius:12px;padding:6px 12px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#menuBtn{font-size:20px;line-height:1;padding:8px 12px}
/* Top buttons: one line, icon + word. Phones: icons only so they still fit on one line. */
.nav{flex-wrap:nowrap}
.nav a,.nav button{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.nav .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:600px){.nav{margin-left:0;width:100%;justify-content:space-between}.nav .lbl{display:none}.nav a,.nav button{padding:10px 14px}}
@media(min-width:1024px){.cols{grid-template-columns:minmax(0,1fr) 290px}}
@media(max-width:820px){body.in-thread.menu-open .side{display:block}body.in-thread .side #find{display:none}}
/* Conversations: no boxes, a purple line over each one. */
.list{gap:0}
.list .row{background:#000;border:0;border-top:1px solid #8b5cf6;border-radius:0;box-shadow:none;padding:12px 6px}
.list .row:hover{box-shadow:none;background:#0b0f1a}
.list .swipe{border-radius:0}
</style>

<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1>Texts</h1>
    <div class="nav">
      <button type="button" class="phone" id="phoneBtn" style="display:none">Phone off</button><!-- always on now; green Phone tab / pill shows it (live.js) -->

   Uploaded to sms-out/<you>/ right before sending; smsSend turns them into links Twilio sends. */
const ATTACH_MAX = 5, MMS_BYTES = 5 * 1024 * 1024;
function shrinkPhoto(file) {
  if (!/^image\//.test(file.type) || /gif/.test(file.type)) return Promise.resolve(file);
  return new Promise(res => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height; const k = Math.min(1, 1600 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => res(b && b.size < file.size ? b : file), "image/jpeg", 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(file); };
    img.src = url;
  });
}
async function uploadAttachments(files) {
  const uid = getAuth(app).currentUser.uid, paths = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i], blob = await shrinkPhoto(f);
    if (blob.size >= MMS_BYTES) throw new Error((f.name || "That file") + " is too big to text (5 MB max). Send a shorter video.");
    const type = blob.type || f.type || "application/octet-stream";
    const ext = blob !== f ? "jpg" : ((f.name || "").split(".").pop() || type.split("/")[1] || "bin").replace(/[^a-z0-9]/gi, "").slice(0, 5).toLowerCase();
    const p = "sms-out/" + uid + "/" + Date.now() + "_" + i + "." + ext;
    await uploadBytes(sRef(storage, p), blob, {contentType: type});
    paths.push(p);
  }
  return paths;
}

/* ---------- links in texts ----------

const LINK_RX = /(https?:\/\/[^\s<]+|(?:www\.)?kheanandclean\.com\/?[^\s<]*)/gi;
const fullUrl = s => (/^https?:\/\//i.test(s) ? s : "https://" + s).replace(/[.,!?)]+$/, "");
function linkify(text) {
  let out = "", last = 0;
  String(text).replace(LINK_RX, (m, _g, i) => {
    out += esc(text.slice(last, i)) + '<a href="' + esc(fullUrl(m)) + '" target="_blank" rel="noopener">' + esc(m) + '</a>';
    last = i + m.length; return m;

}

    tel.href = "tel:" + (t.phone || "+1" + id);
    document.getElementById("banner").innerHTML = t.optedOut
      ? '<div class="banner">They replied STOP. Texts to this number are blocked until they reply START.</div>' : '';
    }
    if (Number(t.unread) > 0) updateDoc(doc(db, "smsThreads", id), {unread: 0}).catch(e => console.warn("mark read failed", e));
  }, err => console.warn("thread", err)));

  // The texts, oldest at the top. Stays scrolled to the bottom unless you've scrolled up.
  stop.push(onSnapshot(query(collection(db, "smsThreads", id, "messages"), orderBy("at"), limitToLast(300)), snap => {
    const box = document.getElementById("thread");
    if (!box) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    if (snap.empty) { box.innerHTML = '<div class="msg">No texts with this number yet.</div>'; return; }
    let lastDay = "";
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(), at = new Date(ms(m.at) || Date.now()), dir = m.dir === "out" ? "out" : "in";
      let h = "";
      const dl = dayLabel(at);
      if (dl !== lastDay) { h += '<div class="day">' + esc(dl) + '</div>'; lastDay = dl; }
      const pics = (Array.isArray(m.media) ? m.media : []).filter(x => /^https:\/\//.test(x && x.url)).map((x, i) =>
        /^https:\/\/api\.twilio\.com\//.test(x.url)   // came in before pictures were saved to the app: loading it pops up a Twilio sign-in
          ? '<span class="msg" style="display:block;margin-bottom:4px">' + (/^video\//.test(x.type) ? 'Video' : 'Photo') + ' (older, not saved in the app)</span>'
          : /^image\//.test(x.type)
          ? '<span class="pwrap"><a href="' + esc(x.url) + '" target="_blank" rel="noopener"><img src="' + esc(x.url) + '" alt="Photo ' + (i + 1) + '" loading="lazy"></a>' + fwdBtn(x) + '</span>'
          : /^video\//.test(x.type)
          ? '<span class="pwrap" style="display:block"><video src="' + esc(x.url) + '" controls playsinline preload="metadata" style="display:block;max-width:100%;border-radius:10px;margin-bottom:6px"></video>' + fwdBtn(x) + '</span>'
          : '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">Attachment ' + (i + 1) + '</a>').join('');
      h += '<div class="b ' + dir + '">' + pics + linkify(m.body || "") + previewSlot(m.body || "") + '</div>';
      if (dir === "out") {
        const bad = m.status === "failed" || m.status === "undelivered";
        h += '<div class="st out' + (bad ? ' bad' : '') + '">' + esc(timeOf(at) + DOT + (STATUS[m.status] || "Sent") +
          (bad && m.error ? ": " + m.error : "")) + '</div>';
      } else {
        h += '<div class="st in">' + esc(timeOf(at)) + '</div>';
      }
      return h;
    }).join('');
    fillPreviews(box);
    if (first || atBottom) box.scrollTop = box.scrollHeight;
    first = false;
    aiOffer(snap.docs[snap.docs.length - 1]);
  }, err => {
    const box = document.getElementById("thread");
    if (box) box.innerHTML = '<div class="msg err">Could not load this conversation: ' + esc(err.message) + '</div>';
  }));

  const form = document.getElementById("replyForm"), body = document.getElementById("body"),
        btn = document.getElementById("sendBtn"), note = document.getElementById("note"), count = document.getElementById("count");
  body.addEventListener("input", () => { count.textContent = body.value.length + " / " + MAX; });
  /* The reply box opens up to fit the whole message (up to most of the screen, then it scrolls).
     It also refits whenever a suggestion or a checked version is dropped in. */
  const fitBody = () => { body.style.height = "auto"; body.style.height = Math.min(body.scrollHeight + 2, Math.round(window.innerHeight * 0.6)) + "px"; };
  body.addEventListener("input", fitBody);
  new MutationObserver(fitBody).observe(document.getElementById("count"), { childList: true, characterData: true, subtree: true });
  // Opened from a "Text" button with a ready-made message (?body=...): put it in the box once, unsent.
  const pre = new URLSearchParams(location.search).get("body");
  if (pre) {
    body.value = pre.slice(0, MAX); count.textContent = body.value.length + " / " + MAX;
    history.replaceState(null, "", location.pathname + location.hash);
  }
  body.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); } });
  // Photo / video picks: small chips under the box, x to drop one.
  let picks = [];
  const attIn = document.getElementById("attIn"), attList = document.getElementById("attList");
  const drawPicks = () => {
    // Small previews of each picked photo/video, with an × to take one out.
    attList.querySelectorAll("[data-url]").forEach(el => URL.revokeObjectURL(el.dataset.url));
    attList.innerHTML = picks.map((f, i) => {
      const u = URL.createObjectURL(f), vid = /^video\//.test(f.type);
      return '<span data-url="' + u + '" style="position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.25);background:#000">' +
        (vid ? '<video src="' + u + '" muted playsinline style="width:100%;height:100%;object-fit:cover"></video>'
             : '<img src="' + u + '" alt="Photo ' + (i + 1) + '" style="width:100%;height:100%;object-fit:cover;display:block">') +
        '<button type="button" data-x="' + i + '" aria-label="Remove" style="position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:15px;line-height:22px;padding:0">&times;</button></span>';
    }).join("");
  };
  attIn.addEventListener("change", () => {
    picks = picks.concat([...attIn.files]).slice(0, ATTACH_MAX); attIn.value = ""; drawPicks();
  });
  attList.addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (x) { picks.splice(+x.dataset.x, 1); drawPicks(); } });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = body.value.trim();
    if ((!text && !picks.length) || sending) return;
    if (t.optedOut) { note.className = "msg err"; note.textContent = "They replied STOP, so this can't be sent."; return; }
    if (isFb(id)) {   // Messenger reply: words only for now
      if (picks.length) { note.className = "msg err"; note.textContent = "Photos can't go to Messenger from here yet. Send the words, or use Messenger on your phone."; return; }
      sending = true; btn.disabled = true; btn.textContent = "Sending" + ELLIPSIS; note.className = "msg"; note.textContent = "";
      try {
        await fbSend({thread: id, body: text});
        body.value = ""; count.textContent = "0 / " + MAX;
        if (aiSug && text) smsSuggest({learn: {suggested: aiSug, sent: text}}).catch(e => console.warn("assistant learn", e));
        aiSug = ""; aiAnswers = []; document.getElementById("ai").innerHTML = "";
      } catch (err) { note.className = "msg err"; note.textContent = friendly(err); }
      finally { sending = false; btn.disabled = false; btn.textContent = "Send"; }
      return;
    }
    sending = true; btn.disabled = true; btn.textContent = (picks.length ? "Uploading" : "Sending") + ELLIPSIS;
    note.className = "msg"; note.textContent = "";
    try {
      const media = picks.length ? await uploadAttachments(picks) : [];
      btn.textContent = "Sending" + ELLIPSIS;
      // One photo per text: phones were only showing the first picture of a multi-photo text.
      let r = await smsSend({to: t.phone || id, body: text, media: media.slice(0, 1)});
      for (let i = 1; i < media.length; i++) r = await smsSend({to: t.phone || id, body: "", media: [media[i]]});
      body.value = ""; count.textContent = "0 / " + MAX; picks = []; drawPicks();
      if (r && r.data && r.data.saved === false) note.textContent = "Sent, but it didn't save here. Don't send it again.";
      // Reply assistant learns: what it suggested next to what you actually sent.
      if (aiSug && text) smsSuggest({learn: {suggested: aiSug, sent: text}}).catch(e => console.warn("assistant learn", e));
      aiSug = ""; aiAnswers = []; document.getElementById("ai").innerHTML = "";
    } catch (err) {
      note.className = "msg err"; note.textContent = friendly(err);   // your text stays in the box
    } finally {
      sending = false; btn.disabled = false; btn.textContent = "Send";
    }
  });
  body.focus({preventScroll: true});

  /* ---------- reply assistant ----------
     Newest text is from the customer -> ask "Suggest a reply?". Suggest: it either asks you one question
     (your answer is remembered for next time) or gives 3 replies; tap one to put it in the box.
     Nothing is sent until you press Send. No thanks hides it for that text. */
  const aiBox = () => document.getElementById("ai");
  const aiKey = mid => "kcAiNo:" + id + ":" + mid;
  function aiOffer(last) {
    const box = aiBox();
    if (!box || !last) return;
    const m = last.data();
    if (aiFor === last.id) return;                                      // already offered / working on it
    aiFor = last.id; aiSug = ""; aiAnswers = [];
    try { if (sessionStorage.getItem(aiKey(last.id))) { box.innerHTML = ""; return; } } catch (e) {}
    const who = (t.name || nameByKey[id] || "").split(" ")[0] || "them";
    /* Always something to say: their text -> a reply; your text last -> a follow-up or check-in. */
    box.innerHTML = '<div class="aibar"><span>' + (m.dir === "out"
        ? 'Waiting on <b>' + esc(who) + '</b>. Suggest a follow-up?'
        : 'New text from <b>' + esc(who) + '</b>. Suggest a reply?') + '</span>' +
      '<span class="aibtns"><button type="button" class="new" data-ai="go">Suggest</button>' +
      '<button type="button" class="ghost aimic" data-ai="mic" aria-label="Say what you want to tell them">' + MIC_SVG + 'Say it</button>' +
      '<button type="button" class="ghost" data-ai="no">No thanks</button></span></div>';
  }
  /* Say it: tap the mic and say what you want to tell them ("she was supposed to send me pictures of
     the carpets"). Your words go to the assistant the same way Check does (as a draft), and it hands
     back a ready reply built from them. Nothing is saved or sent. Phones without browser speech
     recognition get a box instead: tap the keyboard's mic there. */
  /* Listening: the button is red ("Tap to stop" with a countdown) and keeps listening through pauses.
     Tap it to stop, or it stops by itself after 15 seconds. Then it turns green and writes the reply. */
  let aiRec = null, aiStop = null, aiCancel = null;
  function aiVoice() {
    const box = aiBox();
    box.innerHTML = '<div class="aibar aiq"><span><b>Say what you want to tell them</b></span>' +
      '<input id="aiSay" type="text" maxlength="500" placeholder="Listening' + ELLIPSIS + '" aria-label="What you want to say">' +
      '<span class="aibtns"><button type="button" class="ghost aimic" data-ai="stop" id="aiMicBtn">' + MIC_SVG + '<span>Tap to stop</span></button>' +
      '<button type="button" class="new" data-ai="say">Write it</button>' +
      '<button type="button" class="ghost" data-ai="no">Cancel</button></span></div>';
    const inp = document.getElementById("aiSay"), micBtn = document.getElementById("aiMicBtn"), lbl = micBtn.querySelector("span");
    inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); aiSay(); } });
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const idle = () => { micBtn.dataset.ai = "mic"; micBtn.classList.remove("on", "done"); lbl.textContent = "Talk again"; };
    if (!SR) { idle(); inp.placeholder = "Type it, or tap your keyboard's mic"; inp.focus(); return; }
    const LIMIT = 15000, t0 = Date.now();
    let heard = "", stopped = false, failed = false;
    const rec = new SR();
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true;
    aiRec = rec;
    micBtn.classList.add("on");
    const tick = setInterval(() => {
      const left = Math.max(0, Math.ceil((LIMIT - (Date.now() - t0)) / 1000));
      lbl.textContent = "Tap to stop \u00b7 " + left;
      if (left <= 0) aiStop();
    }, 250);
    aiStop = () => { if (stopped) return; stopped = true; clearInterval(tick); try { rec.stop(); } catch (e) {} };
    /* Cancel, or Write it while still listening: stop for good, without writing a second time. */
    aiCancel = () => { stopped = true; failed = true; clearInterval(tick); aiRec = null; aiCancel = null; try { rec.abort(); } catch (e) {} };
    /* Rebuilt from all of this round's results every time. Android Chrome sends each new result as
       everything said so far ("can we", "can we ask", "can we ask Robin"...), so a result that starts
       with the text before it replaces it instead of adding on. "heard" keeps earlier rounds (the mic
       restarts after a pause). */
    let round = "";
    rec.onresult = e => {
      let text = "";
      for (let k = 0; k < e.results.length; k++) {
        const t = e.results[k][0].transcript.trim();
        if (!t) continue;
        const a = text.toLowerCase(), b = t.toLowerCase();
        if (!text || b.startsWith(a)) text = t;          // cumulative (Android): the newer, longer one wins
        else if (a.endsWith(b) || a.includes(b)) {}      // already have it
        else text += " " + t;                            // a new piece (desktop / iPhone)
      }
      round = text;
      inp.value = (heard + " " + round).trim();
    };
    rec.onerror = e => {
      if (e.error === "no-speech" || e.error === "aborted") return;   // a pause: keep going until stopped
      failed = true; stopped = true; clearInterval(tick);
      inp.placeholder = e.error === "not-allowed" ? "Mic is blocked. Type it, or tap your keyboard's mic" : "Didn't catch that. Type it or tap Talk again";
    };
    rec.onend = () => {
      /* Some phones end on a pause even in continuous mode: start again until tapped or 15 s. */
      if (!stopped && Date.now() - t0 < LIMIT) { heard = (heard + " " + round).trim(); round = ""; try { rec.start(); return; } catch (e) {} }
      clearInterval(tick); stopped = true; aiRec = null; aiCancel = null;
      if (failed || !inp.value.trim()) { idle(); inp.focus(); return; }
      micBtn.classList.remove("on"); micBtn.classList.add("done"); lbl.textContent = "Got it";
      setTimeout(aiSay, 600);
    };
    try { rec.start(); } catch (e) { clearInterval(tick); idle(); inp.focus(); }
  }
  async function aiSay() {
    const box = aiBox(), said = ((document.getElementById("aiSay") || {}).value || "").trim();
    if (!said) return;
    if (aiCancel) aiCancel();   // tapped Write it while still listening
    box.innerHTML = '<div class="aibar"><span>Writing your reply' + ELLIPSIS + '</span></div>';
    try {
      const r = (await smsSuggest({thread: id, draft: said})).data || {};
      box.innerHTML = '<div class="aibar" style="display:block"><div class="aisaid">You said: \u201c' + esc(said) + '\u201d</div>' +
        '<button type="button" class="aisug" data-better="1">' + esc(r.better || said) + '</button>' +
        '<div class="aibtns" style="margin-top:8px"><button type="button" class="new" data-better="1">Use this</button>' +
        '<button type="button" class="ghost aimic" data-ai="mic">' + MIC_SVG + 'Say it again</button>' +
        '<button type="button" class="ghost" data-ai="no">Close</button></div></div>';
      box._better = r.better || said;
    } catch (err) {
      box.innerHTML = '<div class="aibar"><span class="err">' + esc(friendly(err)) + '</span>' +
        '<span class="aibtns"><button type="button" class="ghost aimic" data-ai="mic">' + MIC_SVG + 'Try again</button>' +
        '<button type="button" class="ghost" data-ai="no">Close</button></span></div>';
    }
  }
  async function aiRun() {
    const box = aiBox();
    box.innerHTML = '<div class="aibar"><span>Thinking' + ELLIPSIS + '</span></div>';
    try {
      const r = (await smsSuggest({thread: id, answers: aiAnswers})).data || {};
      if (r.question) {
        box.innerHTML = '<div class="aibar aiq"><span><b>Quick question:</b> ' + esc(r.question) + '</span>' +
          '<input id="aiA" type="text" maxlength="500" placeholder="Your answer" aria-label="Your answer">' +
          '<span class="aibtns"><button type="button" class="new" data-ai="ans">Answer</button>' +
          '<button type="button" class="ghost" data-ai="no">Cancel</button></span></div>';
        box.dataset.q = r.question;
        const inp = document.getElementById("aiA");
        inp.focus();
        inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); aiAnswer(); } });
        return;
      }
      box.innerHTML = '<div class="aibar" style="display:block"><span><b>Pick a reply</b> (you can edit it before sending)</span>' +
        (r.replies || []).map((x, i) => '<button type="button" class="aisug" data-sug="' + i + '">' + esc(x) + '</button>').join("") +
        '<div class="aibtns" style="margin-top:8px"><button type="button" class="ghost" data-ai="go">New ideas</button>' +
        '<button type="button" class="ghost" data-ai="no">Close</button></div></div>';
      box._sugs = r.replies || [];
    } catch (err) {
      box.innerHTML = '<div class="aibar"><span class="err">' + esc(friendly(err)) + '</span>' +
        '<span class="aibtns"><button type="button" class="ghost" data-ai="go">Try again</button>' +
        '<button type="button" class="ghost" data-ai="no">Close</button></span></div>';
    }
  }
  /* Check my reply: reads what you typed against the conversation, lists anything missing,
     and offers a better version that ends with something to keep them talking. Use this swaps it in. */
  /* Check asks what the reply is about first, so it stops bringing up scheduling when the job is
     already booked. Your pick rides along with your reply as a note the assistant reads (it isn't
     part of the text). */
  const TOPICS = [
    { t: "Photos", note: "this reply is about photos. Don't bring up scheduling unless my reply does." },
    { t: "Scheduling", note: "this reply is about picking a day or time." },
    { t: "Price / estimate", note: "this reply is about the price or the estimate. Don't bring up scheduling unless my reply does." },
    { t: "Already booked, just following up", note: "the job is already on the calendar. Don't ask about scheduling, days or times." },
    { t: "Something else", note: "" }
  ];
  document.getElementById("checkBtn").addEventListener("click", () => {
    const draft = body.value.trim(), box = aiBox();
    if (!draft) { note.className = "msg err"; note.textContent = "Type your reply first, then tap Check."; return; }
    note.className = "msg"; note.textContent = "";
    box.innerHTML = '<div class="aibar" style="display:block"><b>What\u2019s this reply about?</b><div class="aitopics">' +
      TOPICS.map((x, i) => '<button type="button" class="ghost" data-topic="' + i + '">' + esc(x.t) + '</button>').join("") +
      '<button type="button" class="ghost" data-ai="no">Cancel</button></div></div>';
  });
  aiBox().addEventListener("click", e => {
    const tb = e.target.closest("[data-topic]");
    if (tb) runCheck(TOPICS[+tb.dataset.topic]);
  });
  async function runCheck(topic) {
    const mine = body.value.trim(), box = aiBox(), cb = document.getElementById("checkBtn");
    if (!mine) return;
    const draft = topic && topic.note ? "(Note for you, not part of my text: " + topic.note + ")\n\nMy reply: " + mine : mine;
    cb.disabled = true; box.innerHTML = '<div class="aibar"><span>Checking your reply' + ELLIPSIS + '</span></div>';
    try {
      const r = (await smsSuggest({thread: id, draft})).data || {};
      box.innerHTML = '<div class="aibar" style="display:block">' +
        ((r.notes || []).length
          ? '<b>You might be missing:</b><ul style="margin:6px 0 4px;padding-left:20px">' + r.notes.map(x => '<li>' + esc(x) + '</li>').join("") + '</ul>'
          : '<b>Looks good.</b> Nothing missing.') +
        '<div style="margin-top:6px"><b>Try this:</b></div>' +
        '<button type="button" class="aisug" data-better="1">' + esc(r.better) + '</button>' +
        '<div class="aibtns" style="margin-top:8px"><button type="button" class="new" data-better="1">Use this</button>' +
        '<button type="button" class="ghost" data-ai="no">Keep mine</button></div></div>';
      box._better = r.better || "";
    } catch (err) {
      box.innerHTML = '<div class="aibar"><span class="err">' + esc(friendly(err)) + '</span>' +
        '<span class="aibtns"><button type="button" class="ghost" data-ai="no">Close</button></span></div>';
    }
    cb.disabled = false;
  }
  function aiAnswer() {
    const box = aiBox(), a = (document.getElementById("aiA") || {}).value || "";
    if (!a.trim()) return;
    aiAnswers.push({q: box.dataset.q || "", a: a.trim()});
    aiRun();
  }
  aiBox().addEventListener("click", e => {
    const b = e.target.closest("[data-ai],[data-sug],[data-better]");
    if (!b) return;
    if (b.dataset.better) {   // Check my reply: use the better version (logged like a suggestion when sent)
      aiSug = aiBox()._better || "";
      body.value = aiSug.slice(0, MAX); count.textContent = body.value.length + " / " + MAX;
      aiBox().innerHTML = ""; body.focus();
      return;
    }
    if (b.dataset.sug != null) {   // tapped a suggestion: into the reply box
      aiSug = (aiBox()._sugs || [])[+b.dataset.sug] || "";
      body.value = aiSug.slice(0, MAX); count.textContent = body.value.length + " / " + MAX;
      body.focus();
      return;
    }
    const a = b.dataset.ai;
    if (a === "go") aiRun();
    else if (a === "ans") aiAnswer();
    else if (a === "mic") aiVoice();
    else if (a === "stop") { if (aiStop) aiStop(); }
    else if (a === "say") aiSay();
    else if (a === "no" && aiCancel) aiCancel();
    if (a === "no") { try { sessionStorage.setItem(aiKey(aiFor), "1"); } catch (e) {} aiBox().innerHTML = ""; aiSug = ""; }
  });
}

/* ---------- new text ----------
   #new, or #new/9165551234 to start with the number filled in. */
function showNew(prefill) {
  view.innerHTML =
    '<div class="panel">' +
      '<div class="chead"><h2>New text</h2></div>' +
      '<form id="newForm">' +
        '<div class="field"><label for="to">Phone number</label>' +

  /* Photos added with "+ Text": shown here with an x to drop one. Words are optional when there are photos. */
  const fwdBox = document.getElementById("fwdPics");
  const drawFwd = () => {
    const list = fwdGet();
    fwdBox.innerHTML = list.length ? '<div class="field"><label>Photos to send (' + list.length + ')</label><div class="fwdpics">' +
      list.map((x, i) => '<span>' + (/^video\//.test(x.type) ? '<video src="' + esc(x.url) + '" muted playsinline></video>' : '<img src="' + esc(x.url) + '" alt="Photo ' + (i + 1) + '">') +
        '<button type="button" data-fx="' + i + '" aria-label="Remove">&times;</button></span>').join("") + '</div></div>' : "";
  };
  fwdBox.addEventListener("click", e => { const x = e.target.closest("[data-fx]"); if (!x) return; const l = fwdGet(); l.splice(+x.dataset.fx, 1); fwdSet(l); drawFwd(); });
  drawFwd();
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const k = key(to.value), text = body.value.trim(), photos = fwdGet();
    note.className = "msg err";
    if (!k) { note.textContent = "Enter a 10-digit phone number."; to.focus(); return; }
    if (!text && !photos.length) { note.textContent = "Type a message first."; body.focus(); return; }
    btn.disabled = true; btn.textContent = (photos.length ? "Uploading" : "Sending") + ELLIPSIS; note.textContent = "";
    try {
      const media = photos.length ? await uploadAttachments(await fwdFiles()) : [];
      btn.textContent = "Sending" + ELLIPSIS;
      await smsSend({to: k, body: text, media: media.slice(0, 1)});
      for (let i = 1; i < media.length; i++) await smsSend({to: k, body: "", media: [media[i]]});
      if (photos.length) fwdSet([]);
      location.hash = k;   // straight into the conversation
    } catch (err) {
      note.textContent = friendly(err);
      btn.disabled = false; btn.textContent = "Send";
    }
  });
  (prefill ? body : to).focus();
}

/* ---------- phone: this page as the business phone ----------
   Phone on = this page rings along with both cells when someone calls (916) 767-2520, and
   Call buttons dial out through the computer showing the business number. Needs the page
   open and the microphone allowed. Phone off = Call buttons dial from this device as before. */
const voiceToken = httpsCallable(getFunctions(app, "us-central1"), "voiceToken");
const phoneBtn = document.getElementById("phoneBtn"), callbar = document.getElementById("callbar");
const baseTitle = document.title;
let device = null, ready = false, live = null, tick = null;
const pref = {
  get: () => { try { return localStorage.getItem("kcPhone"); } catch { return null; } },
  set: v => { try { localStorage.setItem("kcPhone", v); } catch { /* private mode */ } }
};
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const phoneState = (text, cls, why) => { phoneBtn.textContent = text; phoneBtn.className = "phone" + (cls ? " " + cls : ""); phoneBtn.title = why || ""; syncDial(); };
const getToken = async () => (await voiceToken()).data.token;
const who = num => { const k = key(num); return {k, name: nameByKey[k] || "", num: k ? pretty(k) : (num || "Unknown caller")}; };

// Asks the browser for the microphone, so it shows its own "Allow microphone?" pop-up.
// Returns "" if allowed, or a plain-words reason if not.
async function askMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "This browser can't use a microphone here.";
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio: true});
    s.getTracks().forEach(t => t.stop());   // just checking permission; Twilio opens its own
    return "";
  } catch (e) {
    const n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError")
      return "Microphone is blocked. Click the icon left of the web address, set Microphone to Allow, then refresh.";
    if (n === "NotFoundError") return "No microphone found. Plug one in or use a headset.";
    if (n === "NotReadableError") return "Another app is using the microphone. Close it and try again.";
    return "Microphone problem: " + ((e && e.message) || n || e);
  }
}
// Plain error text: which step failed, plus Twilio's code and message.
const errText = (step, e) => step + ": " + (e ? (e.code ? e.code + " " : "") + (e.message || String(e)) : "unknown");

async function phoneOn() {
  if (!window.Twilio || !window.Twilio.Device) { phoneState("Phone unavailable", "bad", "The calling library didn't load."); return; }
  phoneState("Turning on" + ELLIPSIS);
  const mic = await askMic();
  if (mic) { ready = false; phoneState("Phone error", "bad", mic); return; }
  let step = "Getting the sign-in pass", lastErr = null;
  try {
    const token = await getToken();
    step = "Starting the phone";
    device = new window.Twilio.Device(token, {closeProtection: true, codecPreferences: ["opus", "pcmu"]});
    device.on("registered", () => { ready = true; phoneState("Phone on", "on", "This page rings with your cells."); });
    device.on("unregistered", () => { ready = false; if (device) phoneState("Phone off"); });
    device.on("error", e => { lastErr = e; console.warn("phone", e); phoneState("Phone error", "bad", e ? (e.code ? e.code + ": " : "") + (e.message || "") : ""); });
    device.on("incoming", ringing);
    device.on("tokenWillExpire", async () => {
      try { device.updateToken(await getToken()); } catch (e) { console.warn("phone token", e); }
    });
    step = "Connecting to Twilio";
    await device.register();
    pref.set("on");
  } catch (e) {
    console.warn("phone on", step, e);
    if (device) { device.destroy(); device = null; }
    ready = false; phoneState("Phone error", "bad", errText(step, e || lastErr));
  }
}
function phoneOff() {
  if (live) return;   // never cut off a call in progress
  if (device) { device.destroy(); device = null; }
  ready = false; pref.set("off"); phoneState("Phone off");
}
phoneBtn.addEventListener("click", () => device ? phoneOff() : phoneOn());

function endCall() {
  clearInterval(tick); tick = null; live = null;
  callbar.hidden = true; callbar.innerHTML = "";
  document.title = baseTitle;
}

// The bottom bar during a call: name, then Calling…/Connecting… until they pick up, then a timer.
function callBar(c, w, status) {
  live = c;
  const pre = w.name ? w.num + DOT : "";
  callbar.innerHTML = '<span class="cb-who">' + esc(w.name || w.num) + '<span class="cb-sub" id="cbSub">' + esc(pre + status) + '</span></span>' +
    '<button type="button" class="cb-mute" id="cbMute" aria-pressed="false">Mute</button>' +
    '<button type="button" class="cb-no" id="cbHang">Hang up</button>';
  callbar.hidden = false;
  const sub = document.getElementById("cbSub");
  document.getElementById("cbMute").onclick = e => {
    const m = !c.isMuted(); c.mute(m);
    e.currentTarget.setAttribute("aria-pressed", String(m)); e.currentTarget.textContent = m ? "Unmute" : "Mute";
  };
  document.getElementById("cbHang").onclick = () => c.disconnect();
  ["disconnect", "cancel", "reject"].forEach(ev => c.on(ev, () => { if (live === c) endCall(); }));
  c.on("error", e => { console.warn("call", e); if (live === c) endCall(); });
  return () => {   // start the timer once they pick up
    const t0 = Date.now(); sub.textContent = pre + "0:00"; clearInterval(tick);
    tick = setInterval(() => { sub.textContent = pre + mmss(Math.round((Date.now() - t0) / 1000)); }, 1000);
  };
}

// Someone's calling the business number. Your cells ring too; first to answer gets it.
function ringing(c) {
  if (live) { c.reject(); return; }   // already on a call here; the cells keep ringing
  /* Real caller comes as the "caller" parameter (the call itself shows the business number). */
  const w = who((c.customParameters && c.customParameters.get && c.customParameters.get("caller")) || (c.parameters && c.parameters.From));
  live = c;
  document.title = "Incoming call" + ELLIPSIS;
  callbar.innerHTML = '<span class="cb-who">' + esc(w.name || w.num) + '<span class="cb-sub">' +
      esc((w.name ? w.num + DOT : "") + "Incoming call") + '</span></span>' +
    '<button type="button" class="cb-ok" id="cbAns">Answer</button>' +
    '<button type="button" class="cb-no" id="cbDec">Decline</button>';
  callbar.hidden = false;
  // Picked up on a cell, or they hung up: the bar goes away.
  ["cancel", "disconnect"].forEach(ev => c.on(ev, () => { if (live === c) endCall(); }));
  document.getElementById("cbDec").onclick = () => { c.reject(); endCall(); };
  document.getElementById("cbAns").onclick = () => {
    document.title = baseTitle;
    const go = callBar(c, w, "Connecting" + ELLIPSIS);
    c.on("accept", go);
    c.accept();
  };
}

async function callOut(k) {
  if (live) return;
  const w = who(k);
  live = "dialing";
  try {
    const c = await device.connect({params: {To: "+1" + k}});
    const go = callBar(c, w, "Calling" + ELLIPSIS);
    c.on("accept", go);
  } catch (e) {
    console.warn("call out", e); endCall();
    alert("Couldn't place the call: " + ((e && e.message) || e));
  }
}

/* Dial pad removed from Texts (calling lives on the Phone page). Kept so phoneState() still works. */
function syncDial() {}

// Phone on: every Call / phone-number link on this page dials through the computer.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="tel:"]');
  if (!a || !device || !ready) return;   // phone off: let this device dial it normally
  const k = key(a.getAttribute("href"));
  if (!k) return;
  e.preventDefault();
  callOut(k);
});

/* ---------- call log ---------- */
function showCalls() {
  view.innerHTML = '<div class="msg">Loading&hellip;</div>';
  stop.push(onSnapshot(query(collection(db, "calls"), orderBy("at", "desc"), limit(200)), snap => {
    if (snap.empty) {
      view.innerHTML = '<div class="msg">No calls yet. Calls to and from (916) 767-2520 show up here once the ' +
        'business number is switched over in Twilio.</div>';
      return;
    }
    view.innerHTML = '<div class="list">' + snap.docs.map(d => {
      const c = d.data(), out = c.dir === "out";
      const k = c.key || key(out ? c.to : c.from);
      const name = c.name || nameByKey[k] || (k ? pretty(k) : (c.from || "Unknown caller"));
      const missed = c.status === "missed";
      const stale = c.status === "ringing" && Date.now() - ms(c.at) > 120000;
      const what = (out ? "Outgoing" : "Incoming") + DOT +
        (c.status === "answered" ? "Answered" + (c.duration ? " " + mmss(c.duration) : "")
          : missed ? (out ? "No answer" : "Missed")
          : stale ? "Ended" : "Ringing" + ELLIPSIS);
      return '<div class="row' + (missed ? ' missed' : '') + '">' +
        '<span class="who">' + (k ? '<a href="#' + esc(k) + '" title="Texts">' + esc(name) + '</a>' : esc(name)) + '</span>' +
        '<span class="when">' + esc(whenShort(c.at)) + '</span>' +
        '<span class="last">' + esc(what) + '</span>' +
        (k ? '<a class="call" href="tel:+1' + esc(k) + '">Call</a>' : '<span></span>') +
      '</div>';
    }).join('') + '</div>';
  }, err => { view.innerHTML = '<div class="msg err">Could not load calls: ' + esc(err.message) + '</div>'; }));
}

/* ---------- left panel: Leads, Approved leads, Contacts ----------
   Read once when the page opens (same collections leads.html, approved-leads.html and
   customers.html use). Unread counts stay live from smsThreads. */
const people = {leads: [], approved: [], contacts: [], prospects: []};
const nameByKey = {};      // phone key -> name, so texts show a name instead of a number
const profileByKey = {};   // phone key -> their customer profile (or lead if not a customer yet)
// Tap the name at the top of a conversation to open their profile.
document.addEventListener("click", e => {
  if (!e.target.closest("#cname")) return;
  const u = profileByKey[location.hash.slice(1)];
  if (u) location.href = u;
});
let unreadByKey = {}, peopleLoaded = false;
const GROUPS = [
  {k: "leads", label: "Leads", open: true},
  {k: "approved", label: "Approved leads", open: true},
  {k: "contacts", label: "Contacts", open: false},
  {k: "prospects", label: "Cold calls", open: false}   // businesses from the Cold Calls page
];
const openState = {};
GROUPS.forEach(g => { openState[g.k] = g.open; });

async function loadPeople() {
  const [L, A, C, P] = await Promise.allSettled([
    getDocs(collection(db, "leads")), getDocs(collection(db, "acceptedQuotes")), getDocs(collection(db, "customers")),
    getDocs(collection(db, "prospects"))]);
  const seen = new Set();
  const take = (list, rows) => rows.forEach(r => {
    if (!r.k || seen.has(r.k)) return;
    seen.add(r.k); list.push(r);
    if (r.name && !nameByKey[r.k]) nameByKey[r.k] = r.name;
  });
  const docs = s => s.status === "fulfilled" ? s.value.docs.map(d => ({id: d.id, ...d.data()})) : [];
  const byName = (a, b) => (a.name || "").localeCompare(b.name || "", undefined, {sensitivity: "base"});
  // Approved first so someone further along shows there, not as a lead.
  take(people.approved, docs(A).filter(q => !q.trashed).map(q => {
    const c = q.customer || {};
    return {k: key(c.phone), name: c.name || c.business || "No name", sub: q.number || ""};
  }).sort(byName));
  take(people.leads, docs(L).filter(l => !l.trashed && !l.converted)
    .sort((a, b) => ms(b.createdAt || b.updatedAt) - ms(a.createdAt || a.updatedAt))
    .map(l => ({k: key(l.phone), name: l.name || "No name", sub: l.status || "new"})));
  take(people.contacts, docs(C).filter(c => !c.trashed).map(c => {
    const phone = (Array.isArray(c.phones) && c.phones[0]) || c.phone;
    const biz = c.type && !/resid/i.test(c.type) && c.business;
    return {k: key(phone), name: (biz ? c.business : c.name) || c.business || "No name", sub: ""};
  }).sort(byName));
  // Cold calls last: a business that's already a customer or lead shows there instead.
  take(people.prospects, docs(P).map(p => ({k: key(p.phone), name: p.business || p.contact || "No name", sub: p.contact || ""})).sort(byName));
  // Profile links: customers win over leads, leads over cold calls.
  docs(P).forEach(p => { const k = key(p.phone); if (k) profileByKey[k] = "./cold-calls.html#" + encodeURIComponent(p.id); });
  docs(L).filter(l => !l.trashed).forEach(l => { const k = key(l.phone); if (k) profileByKey[k] = "./leads.html#" + encodeURIComponent(l.id); });
  docs(C).filter(c => !c.trashed).forEach(c => {
    [].concat(Array.isArray(c.phones) ? c.phones : [], c.phone || []).forEach(ph => { const k = key(ph); if (k) profileByKey[k] = "./customers.html#" + encodeURIComponent(c.id); });
  });
  [L, A, C, P].forEach(s => { if (s.status === "rejected") console.warn("people load", s.reason); });
  peopleLoaded = true;
  renderPeople();
  // An open conversation with no saved name picks one up now.
  const cn = document.getElementById("cname"), h = location.hash.slice(1);
  if (cn && nameByKey[h] && cn.textContent === pretty(h)) cn.textContent = nameByKey[h];
}

function renderPeople() {
  if (!peopleLoaded) return;   // still says Loading… until the three lists are in
  const box = document.getElementById("people");
  const t = document.getElementById("find").value.trim().toLowerCase(), td = t.replace(/\D/g, "");
  const cur = location.hash.slice(1);
  const match = p => !t || p.name.toLowerCase().includes(t) || (td.length >= 3 && p.k.includes(td));
  box.innerHTML = GROUPS.map(g => {
    const list = people[g.k].filter(match);
    const rows = list.length ? list.map(p => {
      const n = unreadByKey[p.k] || 0;
      return '<div class="pp' + (p.k === cur ? ' on' : '') + '">' +
        '<a class="open" href="#' + esc(p.k) + '" title="Texts with ' + esc(p.name) + '">' +
          '<span class="pn">' + esc(p.name) + '</span><span class="ph">' + esc(pretty(p.k)) + '</span></a>' +
        (n ? '<span class="dot" title="' + n + ' unread">' + n + '</span>' : '') +
        '<a class="call" href="tel:+1' + esc(p.k) + '">Call</a>' +
      '</div>';
    }).join('') : '<div class="none">' + (t ? "No matches" : "Nobody here yet") + '</div>';
    return '<details class="grp" data-g="' + g.k + '"' + (openState[g.k] || t ? ' open' : '') + '>' +
      '<summary>' + esc(g.label) + ' (' + list.length + ')</summary>' + rows + '</details>';
  }).join('');
  box.querySelectorAll("details.grp").forEach(d => d.addEventListener("toggle", () => {
    if (!document.getElementById("find").value.trim()) openState[d.dataset.g] = d.open;
  }));
}

document.getElementById("find").addEventListener("input", renderPeople);

/* ☰ menu: opens/closes the Leads / Approved leads / Contacts list under the button. Typing a search
   opens it with the matches; picking someone, or tapping anywhere else, closes it. */
const menuBtn = document.getElementById("menuBtn");
function setMenu(on) {
  document.body.classList.toggle("menu-open", on);
  menuBtn.setAttribute("aria-expanded", on ? "true" : "false");
  if (on) document.getElementById("people").style.top = Math.max(8, menuBtn.getBoundingClientRect().bottom + 8) + "px";
}
menuBtn.addEventListener("click", () => setMenu(!document.body.classList.contains("menu-open")));
document.getElementById("find").addEventListener("input", e => setMenu(!!e.target.value.trim()));
document.addEventListener("click", e => {
  if (!document.body.classList.contains("menu-open")) return;
  if (e.target.closest("#people .open, #people .call")) { setMenu(false); return; }
  if (!e.target.closest("#people, #menuBtn, #find")) setMenu(false);
});

function startPeople() {
  loadPeople().catch(e => {
    document.getElementById("people").innerHTML = '<div class="none">Could not load people: ' + esc(e.message) + '</div>';
  });
  onSnapshot(query(collection(db, "smsThreads"), orderBy("lastAt", "desc"), limit(200)), snap => {
    unreadByKey = {};
    snap.docs.forEach(d => { const n = Number(d.data().unread) || 0; if (n) unreadByKey[d.id] = n; });
    renderPeople();
  }, err => console.warn("unread", err));
}

/* ---------- which screen ---------- */
const route = () => {
  clearScreen();
  const h = decodeURIComponent(location.hash.slice(1));
  const isNew = h === "new" || h.startsWith("new/");
  document.getElementById("allBtn").hidden = !h;
  document.getElementById("newBtn").hidden = isNew;
  document.getElementById("callsBtn").hidden = h === "calls";
  document.body.classList.toggle("in-thread", !!h);   // phones: hide the people panel inside a conversation
  renderPeople();
  if (isNew) showNew(h.slice(4));
  else if (h === "calls") showCalls();
  else if (/^\d{5,15}$/.test(h) || isFb(h)) showThread(h);
  else showList();
};

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=texts.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) {
    started = true; window.addEventListener("hashchange", route); route(); startPeople();
    phoneOn();   // the business phone is always on while this page is open
  }
});
</script>
