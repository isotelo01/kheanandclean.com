<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Texts &middot; Khean &amp; Clean</title>
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Same look as leads.html. Texts to and from (916) 767-2520: the list of conversations,
   one conversation with a reply box, and New text. Reading comes straight from Firestore
   (smsThreads); sending goes through the smsSend function, which talks to Twilio. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Playfair Display",Georgia,serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
.msg{color:var(--muted);font-size:15px;padding:6px 2px}
.msg.err{color:var(--red)}
:where(a,button):focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* The list: one row per phone number, newest first. Gold edge + count = unread. */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;color:inherit;background:#fff;
  border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:12px 16px;border-left:4px solid transparent}
.row:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
.row.unread{border-left-color:var(--gold)}
.who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .who{font-weight:700}
.when{color:var(--muted);font-size:13px;white-space:nowrap;text-align:right}
.last{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .last{color:var(--ink)}
.badge{justify-self:end;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--navy);font:700 12px/22px "Archivo";text-align:center;padding:0 6px}
.stop{color:var(--red);font-size:12px;font-weight:700;margin-left:8px}

/* One conversation: their texts on the left, yours on the right in navy. */
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:16px}
.chead{display:flex;align-items:baseline;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;border-bottom:2px solid var(--gold);padding-bottom:8px;margin-bottom:12px}
.chead h2{font:700 22px "Playfair Display",Georgia,serif;margin:0}
.chead a{color:var(--navy);font-weight:600;text-decoration:none}
.banner{background:#f9e7e6;color:var(--red);border-radius:8px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px}
.thread{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding:4px 2px 8px}
.day{align-self:center;font-size:12px;color:var(--muted);font-weight:600;margin:8px 0 2px}
.b{max-width:80%;padding:9px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.45}
.b.in{align-self:flex-start;background:var(--bg);border-bottom-left-radius:4px}
.b.out{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.b img{display:block;max-width:220px;max-height:220px;border-radius:8px;margin:2px 0 4px}
.b a{color:inherit}
.st{font-size:12px;color:var(--muted);margin:-2px 2px 4px}
.st.in{align-self:flex-start}
.st.out{align-self:flex-end;text-align:right}
.st.bad{color:var(--red);font-weight:600}
.reply{margin-top:12px;display:grid;gap:8px}
textarea,.field input{width:100%;font:inherit;padding:10px 12px;border:1px solid #c9cedb;border-radius:8px;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus,.field input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.ractions{display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-size:13px;color:var(--muted)}
.field{display:grid;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
/* Left panel: everyone you can call or text, hottest first. Leads, Approved leads, Contacts.
   Each person shows once (Approved beats Leads beats Contacts). Tap the name for texts, Call to dial. */
.cols{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
#view{min-width:0}
.side{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:12px}
.side input{width:100%;font:inherit;font-size:15px;padding:8px 10px;border:1px solid #c9cedb;border-radius:8px;margin-bottom:6px}
.side input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.grp{border-top:1px solid var(--line);padding-top:4px;margin-top:6px}
.grp summary{cursor:pointer;font:700 13px "Archivo";letter-spacing:.06em;text-transform:uppercase;color:var(--navy);padding:6px 2px;list-style-position:inside}
.pp{display:flex;align-items:center;gap:8px;border-radius:8px;padding:6px 6px;border-left:3px solid transparent}
.pp:hover{background:var(--bg)}
.pp.on{background:var(--bg);border-left-color:var(--gold)}
.pp .open{flex:1;min-width:0;text-decoration:none;color:inherit;display:grid}
.pp .pn{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp .ph{font-size:13px;color:var(--muted)}
.pp .dot{min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:var(--navy);font:700 11px/20px "Archivo";text-align:center;padding:0 5px}
.pp .call{flex:none;font:600 13px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:4px 9px;background:#fff}
.pp .call:hover{border-color:var(--navy)}
.none{font-size:13px;color:var(--muted);padding:4px 6px}
/* Phone: on/off pill in the top bar, the call bar along the bottom, and the Calls list. */
.phone{font:600 14px "Archivo";background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer}
.phone.on{color:var(--green);border-color:var(--green)}
.phone.on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:7px;vertical-align:1px}
.phone.bad{color:var(--red);border-color:var(--red)}
#callbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;width:min(560px,calc(100% - 24px));background:var(--navy);color:#fff;
  border-radius:12px;box-shadow:0 6px 24px rgba(23,34,57,.35);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#callbar .cb-who{flex:1;min-width:0;font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#callbar .cb-sub{display:block;font-weight:400;font-size:13px;opacity:.85}
#callbar button{font:600 15px "Archivo";border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
#callbar .cb-ok{background:#1f8a5b;color:#fff}
#callbar .cb-no{background:var(--red);color:#fff}
#callbar .cb-mute{background:#fff;color:var(--navy)}
#callbar .cb-mute[aria-pressed="true"]{background:var(--gold)}
.row .who a{color:inherit;text-decoration:none}
.row .call{justify-self:end;font:600 13px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;background:#fff}
.row.missed .last{color:var(--red);font-weight:600}
#callbar[hidden]{display:none}
/* Dial pad: small pop-up to call any number. */
#dialer{position:fixed;right:18px;top:84px;z-index:9;width:260px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(23,34,57,.22);padding:14px}
#dialer .dh{display:flex;align-items:center;justify-content:space-between;font:700 15px "Archivo";color:var(--navy);margin-bottom:8px}
#dialer .dx{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);cursor:pointer;padding:2px 6px}
#dialNum{width:100%;box-sizing:border-box;font:600 22px "Archivo";text-align:center;border:1px solid var(--line);border-radius:8px;padding:9px 6px;color:var(--navy)}
#dialer .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
#dialer .keys button{font:600 20px "Archivo";background:var(--bg);color:var(--navy);border:0;border-radius:10px;padding:11px 0;cursor:pointer}
#dialer .keys button:hover{background:var(--line)}
#dialer .drow{display:flex;gap:8px}
#dialCall{flex:1;font:700 16px "Archivo";background:#1f8a5b;color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
#dialBack{font:600 18px "Archivo";background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:0 14px;cursor:pointer}
#dialMsg{font-size:13px;color:var(--muted);margin-top:8px;min-height:1em}
#dialMsg.bad{color:var(--red)}
@media(max-width:540px){#dialer{left:12px;right:12px;width:auto;top:70px}}
@media(max-width:820px){.cols{grid-template-columns:1fr}.side{position:static;max-height:none}body.in-thread .side{display:none}}
@media(max-width:540px){.b{max-width:88%}.thread{max-height:56vh}.top{gap:10px}}
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1>Texts</h1>
    <div class="nav">
      <button type="button" class="phone" id="phoneBtn">Phone off</button>
      <a class="ghost" id="allBtn" href="#" hidden>All texts</a>
      <a class="ghost" id="callsBtn" href="#calls">Calls</a>
      <button type="button" class="ghost" id="dialBtn">Dial</button>
      <a class="ghost" href="./leads.html">Leads</a>
      <a class="new" id="newBtn" href="#new">New text</a>
    </div>
  </div>
  <div class="cols">
    <aside class="side" aria-label="People">
      <input id="find" type="search" placeholder="Search name or number" aria-label="Search people" autocomplete="off">
      <div id="people"><div class="none">Loading&hellip;</div></div>
    </aside>
    <div id="view"><div class="msg">Loading&hellip;</div></div>
  </div>
</div>
<div id="callbar" role="status" aria-live="polite" hidden></div>
<div id="dialer" role="dialog" aria-label="Dial a number" hidden>
  <div class="dh">Phone <button type="button" class="dx" id="dialX" aria-label="Close">&times;</button></div>
  <input id="dialNum" type="tel" inputmode="tel" autocomplete="off" placeholder="Enter number" aria-label="Number to call">
  <div class="keys">
    <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
    <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
    <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
    <button type="button" data-k="*">*</button><button type="button" data-k="0">0</button><button type="button" data-k="#">#</button>
  </div>
  <div class="drow"><button type="button" id="dialCall">Call</button><button type="button" id="dialBack" aria-label="Delete">&#9003;</button></div>
  <div id="dialMsg"></div>
</div>

<!-- Twilio's calling library: lets this page ring and talk like a phone. Pinned version. -->
<script src="https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.5/dist/twilio.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, collection, query, orderBy, limit, limitToLast, onSnapshot, doc, updateDoc, getDocs }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const smsSend = httpsCallable(getFunctions(app, "us-central1"), "smsSend");

const view = document.getElementById("view");
const MAX = 1600;
const ELLIPSIS = "…", DOT = " · ";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
// Same key the functions use: the last 10 digits.
const key = p => { const d = String(p || "").replace(/\D/g, "").slice(-10); return d.length === 10 ? d : ""; };
const pretty = p => { const d = key(p); return d ? "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6) : String(p || ""); };
const ms = t => !t ? 0 : typeof t.toMillis === "function" ? t.toMillis() : (Date.parse(t) || 0);
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const yesterday = () => { const y = new Date(); y.setDate(y.getDate() - 1); return y; };
const timeOf = d => d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
function whenShort(t) {
  const m = ms(t); if (!m) return "";
  const d = new Date(m);
  if (sameDay(d, new Date())) return timeOf(d);
  if (sameDay(d, yesterday())) return "Yesterday";
  return d.toLocaleDateString([], {month: "short", day: "numeric"});
}
const dayLabel = d => sameDay(d, new Date()) ? "Today" : sameDay(d, yesterday()) ? "Yesterday"
  : d.toLocaleDateString([], {weekday: "short", month: "short", day: "numeric"});

// What each Twilio delivery status shows under your text.
const STATUS = {accepted: "Sending" + ELLIPSIS, scheduled: "Sending" + ELLIPSIS, queued: "Sending" + ELLIPSIS,
  sending: "Sending" + ELLIPSIS, sent: "Sent", delivered: "Delivered", read: "Read",
  undelivered: "Not delivered", failed: "Failed"};
// The function's own words when it refuses; a generic line for anything unexpected.
const friendly = err => {
  const m = (err && err.message) || "";
  return !m || /^internal$/i.test(m) ? "Couldn't send. Please try again." : m;
};

let stop = [];   // live listeners for the screen showing now
const clearScreen = () => { stop.forEach(f => f()); stop = []; };

/* ---------- all conversations ---------- */
function showList() {
  view.innerHTML = '<div class="msg">Loading&hellip;</div>';
  stop.push(onSnapshot(query(collection(db, "smsThreads"), orderBy("lastAt", "desc"), limit(200)), snap => {
    if (snap.empty) {
      view.innerHTML = '<div class="msg">No texts yet. When a customer texts (916) 767-2520, it shows up here. ' +
        'Tap <b>New text</b> to start one.</div>';
      return;
    }
    view.innerHTML = '<div class="list">' + snap.docs.map(d => {
      const t = d.data(), n = Number(t.unread) || 0;
      return '<a class="row' + (n ? ' unread' : '') + '" href="#' + esc(d.id) + '">' +
        '<span class="who">' + esc(t.name || nameByKey[d.id] || pretty(t.phone || d.id)) + (t.optedOut ? '<span class="stop">STOP</span>' : '') + '</span>' +
        '<span class="when">' + esc(whenShort(t.lastAt)) + '</span>' +
        '<span class="last">' + (t.lastDir === "out" ? "You: " : "") + esc(t.lastBody || "") + '</span>' +
        (n ? '<span class="badge" title="' + n + ' unread">' + n + '</span>' : '<span></span>') +
      '</a>';
    }).join('') + '</div>';
  }, err => { view.innerHTML = '<div class="msg err">Could not load texts: ' + esc(err.message) + '</div>'; }));
}

/* ---------- one conversation ---------- */
function showThread(id) {
  let t = {}, first = true, sending = false;
  view.innerHTML =
    '<div class="panel">' +
      '<div class="chead"><h2 id="cname">' + esc(pretty(id)) + '</h2><a id="ctel" href="tel:+1' + esc(id) + '">' + esc(pretty(id)) + '</a></div>' +
      '<div id="banner"></div>' +
      '<div class="thread" id="thread"><div class="msg">Loading&hellip;</div></div>' +
      '<form class="reply" id="replyForm">' +
        '<textarea id="body" rows="3" maxlength="' + MAX + '" placeholder="Type a reply' + ELLIPSIS + '" aria-label="Reply"></textarea>' +
        '<div class="ractions"><span class="count" id="count">0 / ' + MAX + '</span>' +
          '<button class="new" type="submit" id="sendBtn">Send</button></div>' +
        '<div class="msg" id="note" role="status"></div>' +
      '</form>' +
    '</div>';

  // Name, phone link, STOP warning; opening the conversation marks it read.
  stop.push(onSnapshot(doc(db, "smsThreads", id), s => {
    t = s.exists() ? s.data() : {};
    document.getElementById("cname").textContent = t.name || nameByKey[id] || pretty(t.phone || id);
    const tel = document.getElementById("ctel");
    tel.textContent = pretty(t.phone || id);
    tel.href = "tel:" + (t.phone || "+1" + id);
    document.getElementById("banner").innerHTML = t.optedOut
      ? '<div class="banner">They replied STOP. Texts to this number are blocked until they reply START.</div>' : '';
    if (Number(t.unread) > 0) updateDoc(doc(db, "smsThreads", id), {unread: 0}).catch(e => console.warn("mark read failed", e));
  }, err => console.warn("thread", err)));

  // The texts, oldest at the top. Stays scrolled to the bottom unless you've scrolled up.
  stop.push(onSnapshot(query(collection(db, "smsThreads", id, "messages"), orderBy("at"), limitToLast(300)), snap => {
    const box = document.getElementById("thread");
    if (!box) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    if (snap.empty) { box.innerHTML = '<div class="msg">No texts with this number yet.</div>'; return; }
    let lastDay = "";
    box.innerHTML = snap.docs.map(d => {
      const m = d.data(), at = new Date(ms(m.at) || Date.now()), dir = m.dir === "out" ? "out" : "in";
      let h = "";
      const dl = dayLabel(at);
      if (dl !== lastDay) { h += '<div class="day">' + esc(dl) + '</div>'; lastDay = dl; }
      const pics = (Array.isArray(m.media) ? m.media : []).filter(x => /^https:\/\//.test(x && x.url)).map((x, i) =>
        /^image\//.test(x.type)
          ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener"><img src="' + esc(x.url) + '" alt="Photo ' + (i + 1) + '" loading="lazy"></a>'
          : '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">Attachment ' + (i + 1) + '</a>').join('');
      h += '<div class="b ' + dir + '">' + pics + esc(m.body || "") + '</div>';
      if (dir === "out") {
        const bad = m.status === "failed" || m.status === "undelivered";
        h += '<div class="st out' + (bad ? ' bad' : '') + '">' + esc(timeOf(at) + DOT + (STATUS[m.status] || "Sent") +
          (bad && m.error ? ": " + m.error : "")) + '</div>';
      } else {
        h += '<div class="st in">' + esc(timeOf(at)) + '</div>';
      }
      return h;
    }).join('');
    if (first || atBottom) box.scrollTop = box.scrollHeight;
    first = false;
  }, err => {
    const box = document.getElementById("thread");
    if (box) box.innerHTML = '<div class="msg err">Could not load this conversation: ' + esc(err.message) + '</div>';
  }));

  const form = document.getElementById("replyForm"), body = document.getElementById("body"),
        btn = document.getElementById("sendBtn"), note = document.getElementById("note"), count = document.getElementById("count");
  body.addEventListener("input", () => { count.textContent = body.value.length + " / " + MAX; });
  body.addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); form.requestSubmit(); } });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const text = body.value.trim();
    if (!text || sending) return;
    if (t.optedOut) { note.className = "msg err"; note.textContent = "They replied STOP, so this can't be sent."; return; }
    sending = true; btn.disabled = true; btn.textContent = "Sending" + ELLIPSIS;
    note.className = "msg"; note.textContent = "";
    try {
      const r = await smsSend({to: t.phone || id, body: text});
      body.value = ""; count.textContent = "0 / " + MAX;
      if (r && r.data && r.data.saved === false) note.textContent = "Sent, but it didn't save here. Don't send it again.";
    } catch (err) {
      note.className = "msg err"; note.textContent = friendly(err);   // your text stays in the box
    } finally {
      sending = false; btn.disabled = false; btn.textContent = "Send";
    }
  });
  body.focus({preventScroll: true});
}

/* ---------- new text ----------
   #new, or #new/9165551234 to start with the number filled in. */
function showNew(prefill) {
  view.innerHTML =
    '<div class="panel">' +
      '<div class="chead"><h2>New text</h2></div>' +
      '<form id="newForm">' +
        '<div class="field"><label for="to">Phone number</label>' +
          '<input id="to" type="tel" inputmode="tel" autocomplete="off" placeholder="(916) 555-1234" value="' + esc(pretty(prefill)) + '"></div>' +
        '<div class="reply" style="margin-top:0">' +
          '<textarea id="body" rows="4" maxlength="' + MAX + '" placeholder="Message" aria-label="Message"></textarea>' +
          '<div class="ractions"><span class="count" id="count">0 / ' + MAX + '</span>' +
            '<button class="new" type="submit" id="sendBtn">Send</button></div>' +
          '<div class="msg" id="note" role="status"></div>' +
        '</div>' +
      '</form>' +
    '</div>';
  const form = document.getElementById("newForm"), to = document.getElementById("to"), body = document.getElementById("body"),
        btn = document.getElementById("sendBtn"), note = document.getElementById("note"), count = document.getElementById("count");
  body.addEventListener("input", () => { count.textContent = body.value.length + " / " + MAX; });
  form.addEventListener("submit", async e => {
    e.preventDefault();
    const k = key(to.value), text = body.value.trim();
    note.className = "msg err";
    if (!k) { note.textContent = "Enter a 10-digit phone number."; to.focus(); return; }
    if (!text) { note.textContent = "Type a message first."; body.focus(); return; }
    btn.disabled = true; btn.textContent = "Sending" + ELLIPSIS; note.textContent = "";
    try {
      await smsSend({to: k, body: text});
      location.hash = k;   // straight into the conversation
    } catch (err) {
      note.textContent = friendly(err);
      btn.disabled = false; btn.textContent = "Send";
    }
  });
  (prefill ? body : to).focus();
}

/* ---------- phone: this page as the business phone ----------
   Phone on = this page rings along with both cells when someone calls (916) 767-2520, and
   Call buttons dial out through the computer showing the business number. Needs the page
   open and the microphone allowed. Phone off = Call buttons dial from this device as before. */
const voiceToken = httpsCallable(getFunctions(app, "us-central1"), "voiceToken");
const phoneBtn = document.getElementById("phoneBtn"), callbar = document.getElementById("callbar");
const baseTitle = document.title;
let device = null, ready = false, live = null, tick = null;
const pref = {
  get: () => { try { return localStorage.getItem("kcPhone"); } catch { return null; } },
  set: v => { try { localStorage.setItem("kcPhone", v); } catch { /* private mode */ } }
};
const mmss = s => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const phoneState = (text, cls, why) => { phoneBtn.textContent = text; phoneBtn.className = "phone" + (cls ? " " + cls : ""); phoneBtn.title = why || ""; syncDial(); };
const getToken = async () => (await voiceToken()).data.token;
const who = num => { const k = key(num); return {k, name: nameByKey[k] || "", num: k ? pretty(k) : (num || "Unknown caller")}; };

// Asks the browser for the microphone, so it shows its own "Allow microphone?" pop-up.
// Returns "" if allowed, or a plain-words reason if not.
async function askMic() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return "This browser can't use a microphone here.";
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio: true});
    s.getTracks().forEach(t => t.stop());   // just checking permission; Twilio opens its own
    return "";
  } catch (e) {
    const n = e && e.name;
    if (n === "NotAllowedError" || n === "SecurityError")
      return "Microphone is blocked. Click the icon left of the web address, set Microphone to Allow, then refresh.";
    if (n === "NotFoundError") return "No microphone found. Plug one in or use a headset.";
    if (n === "NotReadableError") return "Another app is using the microphone. Close it and try again.";
    return "Microphone problem: " + ((e && e.message) || n || e);
  }
}
// Plain error text: which step failed, plus Twilio's code and message.
const errText = (step, e) => step + ": " + (e ? (e.code ? e.code + " " : "") + (e.message || String(e)) : "unknown");

async function phoneOn() {
  if (!window.Twilio || !window.Twilio.Device) { phoneState("Phone unavailable", "bad", "The calling library didn't load."); return; }
  phoneState("Turning on" + ELLIPSIS);
  const mic = await askMic();
  if (mic) { ready = false; phoneState("Phone error", "bad", mic); return; }
  let step = "Getting the sign-in pass";
  try {
    const token = await getToken();
    step = "Starting the phone";
    device = new window.Twilio.Device(token, {closeProtection: true, codecPreferences: ["opus", "pcmu"]});
    device.on("registered", () => { ready = true; phoneState("Phone on", "on", "This page rings with your cells."); });
    device.on("unregistered", () => { ready = false; if (device) phoneState("Phone off"); });
    device.on("error", e => { console.warn("phone", e); phoneState("Phone error", "bad", e ? (e.code ? e.code + ": " : "") + (e.message || "") : ""); });
    device.on("incoming", ringing);
    device.on("tokenWillExpire", async () => {
      try { device.updateToken(await getToken()); } catch (e) { console.warn("phone token", e); }
    });
    step = "Connecting to Twilio";
    await device.register();
    pref.set("on");
  } catch (e) {
    console.warn("phone on", step, e);
    if (device) { device.destroy(); device = null; }
    ready = false; phoneState("Phone error", "bad", errText(step, e));
  }
}
function phoneOff() {
  if (live) return;   // never cut off a call in progress
  if (device) { device.destroy(); device = null; }
  ready = false; pref.set("off"); phoneState("Phone off");
}
phoneBtn.addEventListener("click", () => device ? phoneOff() : phoneOn());

function endCall() {
  clearInterval(tick); tick = null; live = null;
  callbar.hidden = true; callbar.innerHTML = "";
  document.title = baseTitle;
}

// The bottom bar during a call: name, then Calling…/Connecting… until they pick up, then a timer.
function callBar(c, w, status) {
  live = c;
  const pre = w.name ? w.num + DOT : "";
  callbar.innerHTML = '<span class="cb-who">' + esc(w.name || w.num) + '<span class="cb-sub" id="cbSub">' + esc(pre + status) + '</span></span>' +
    '<button type="button" class="cb-mute" id="cbMute" aria-pressed="false">Mute</button>' +
    '<button type="button" class="cb-no" id="cbHang">Hang up</button>';
  callbar.hidden = false;
  const sub = document.getElementById("cbSub");
  document.getElementById("cbMute").onclick = e => {
    const m = !c.isMuted(); c.mute(m);
    e.currentTarget.setAttribute("aria-pressed", String(m)); e.currentTarget.textContent = m ? "Unmute" : "Mute";
  };
  document.getElementById("cbHang").onclick = () => c.disconnect();
  ["disconnect", "cancel", "reject"].forEach(ev => c.on(ev, () => { if (live === c) endCall(); }));
  c.on("error", e => { console.warn("call", e); if (live === c) endCall(); });
  return () => {   // start the timer once they pick up
    const t0 = Date.now(); sub.textContent = pre + "0:00"; clearInterval(tick);
    tick = setInterval(() => { sub.textContent = pre + mmss(Math.round((Date.now() - t0) / 1000)); }, 1000);
  };
}

// Someone's calling the business number. Your cells ring too; first to answer gets it.
function ringing(c) {
  if (live) { c.reject(); return; }   // already on a call here; the cells keep ringing
  const w = who(c.parameters && c.parameters.From);
  live = c;
  document.title = "Incoming call" + ELLIPSIS;
  callbar.innerHTML = '<span class="cb-who">' + esc(w.name || w.num) + '<span class="cb-sub">' +
      esc((w.name ? w.num + DOT : "") + "Incoming call") + '</span></span>' +
    '<button type="button" class="cb-ok" id="cbAns">Answer</button>' +
    '<button type="button" class="cb-no" id="cbDec">Decline</button>';
  callbar.hidden = false;
  // Picked up on a cell, or they hung up: the bar goes away.
  ["cancel", "disconnect"].forEach(ev => c.on(ev, () => { if (live === c) endCall(); }));
  document.getElementById("cbDec").onclick = () => { c.reject(); endCall(); };
  document.getElementById("cbAns").onclick = () => {
    document.title = baseTitle;
    const go = callBar(c, w, "Connecting" + ELLIPSIS);
    c.on("accept", go);
    c.accept();
  };
}

async function callOut(k) {
  if (live) return;
  const w = who(k);
  live = "dialing";
  try {
    const c = await device.connect({params: {To: "+1" + k}});
    const go = callBar(c, w, "Calling" + ELLIPSIS);
    c.on("accept", go);
  } catch (e) {
    console.warn("call out", e); endCall();
    alert("Couldn't place the call: " + ((e && e.message) || e));
  }
}

/* ---------- dial pad: call any number without opening a customer ----------
   Dial (top bar) opens it. Type or tap a number, then Call or Enter. If the phone is off it
   turns on first. During a call the keys send tones (for "press 1" menus). Shows the phone's
   status in plain words, including the error if it won't turn on. */
const dialer = document.getElementById("dialer"), dialNum = document.getElementById("dialNum"),
  dialMsg = document.getElementById("dialMsg");
function syncDial(note) {
  if (!dialer || dialer.hidden) return;
  if (note) { dialMsg.textContent = note; dialMsg.className = ""; return; }
  const bad = phoneBtn.classList.contains("bad");
  dialMsg.className = bad ? "bad" : "";
  dialMsg.textContent = bad ? phoneBtn.textContent + (phoneBtn.title ? " (" + phoneBtn.title + ")" : "")
    : device && ready ? "Phone on. People see (916) 767-2520."
    : "Phone is off. It turns on when you press Call.";
}
// Open/closed is remembered. Starts open, except on phone-size screens where it would cover the texts.
const dialPref = {
  get: () => { try { return localStorage.getItem("kcDial"); } catch { return null; } },
  set: v => { try { localStorage.setItem("kcDial", v); } catch { /* private mode */ } }
};
const closeDial = () => { dialer.hidden = true; dialPref.set("closed"); };
function openDial(focus) { dialer.hidden = false; dialPref.set("open"); syncDial(); if (focus !== false) dialNum.focus(); }
document.getElementById("dialBtn").addEventListener("click", () => dialer.hidden ? openDial() : closeDial());
document.getElementById("dialX").addEventListener("click", closeDial);

// (279) 321-2944 as you type. Anything with * or # (phone menus) stays as typed.
const dialDigits = () => dialNum.value.replace(/[^0-9*#]/g, "");
function fmtDial(d) {
  if (/[*#]/.test(d)) return d;
  let pre = "";
  if (d.length > 10 && d[0] === "1") { pre = "1 "; d = d.slice(1); }
  if (d.length > 10) return pre + d;   // too long to be a US number: show it plain
  if (d.length > 6) return pre + "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
  if (d.length > 3) return pre + "(" + d.slice(0, 3) + ") " + d.slice(3);
  return pre + d;
}
const setDial = d => { dialNum.value = fmtDial(d); };
dialNum.addEventListener("input", () => setDial(dialDigits()));

// One key in: during a call it's a tone, otherwise it goes on the number.
function dialKey(k) {
  if (live && typeof live === "object" && live.sendDigits) {
    try { live.sendDigits(k); } catch (err) { console.warn("tone", err); }
  } else setDial(dialDigits() + k);
}
const dialDel = () => setDial(dialDigits().slice(0, -1));
dialer.querySelector(".keys").addEventListener("click", e => {
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  dialKey(b.dataset.k);
  dialNum.focus();
});
document.getElementById("dialBack").addEventListener("click", () => { dialDel(); dialNum.focus(); });
async function dialGo() {
  if (live) { syncDial("You're already on a call."); return; }
  const k = key(dialNum.value);
  if (!k) { syncDial("Enter a 10-digit number."); return; }
  if (!device || !ready) { syncDial("Turning the phone on" + ELLIPSIS); await phoneOn(); }
  if (!device || !ready) { syncDial(); return; }   // couldn't turn on: shows why
  callOut(k);
}
document.getElementById("dialCall").addEventListener("click", dialGo);
dialNum.addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); dialGo(); }
  else if (e.key === "Escape") closeDial();
});

// Your keyboard, anywhere on the page: digits go to the dialer, Backspace deletes, Enter calls.
// Leaves the keys alone while you're typing in the search box, a text message, or any other field.
document.addEventListener("keydown", e => {
  if (dialer.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target;
  if (t && (t === dialNum || t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
  if (/^[0-9*#]$/.test(e.key)) { e.preventDefault(); dialKey(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); dialDel(); }
  else if (e.key === "Enter" && dialDigits()) { e.preventDefault(); dialGo(); }
});
if (dialPref.get() !== "closed" && !window.matchMedia("(max-width:820px)").matches) openDial(false);

// Phone on: every Call / phone-number link on this page dials through the computer.
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[href^="tel:"]');
  if (!a || !device || !ready) return;   // phone off: let this device dial it normally
  const k = key(a.getAttribute("href"));
  if (!k) return;
  e.preventDefault();
  callOut(k);
});

/* ---------- call log ---------- */
function showCalls() {
  view.innerHTML = '<div class="msg">Loading&hellip;</div>';
  stop.push(onSnapshot(query(collection(db, "calls"), orderBy("at", "desc"), limit(200)), snap => {
    if (snap.empty) {
      view.innerHTML = '<div class="msg">No calls yet. Calls to and from (916) 767-2520 show up here once the ' +
        'business number is switched over in Twilio.</div>';
      return;
    }
    view.innerHTML = '<div class="list">' + snap.docs.map(d => {
      const c = d.data(), out = c.dir === "out";
      const k = c.key || key(out ? c.to : c.from);
      const name = c.name || nameByKey[k] || (k ? pretty(k) : (c.from || "Unknown caller"));
      const missed = c.status === "missed";
      const stale = c.status === "ringing" && Date.now() - ms(c.at) > 120000;
      const what = (out ? "Outgoing" : "Incoming") + DOT +
        (c.status === "answered" ? "Answered" + (c.duration ? " " + mmss(c.duration) : "")
          : missed ? (out ? "No answer" : "Missed")
          : stale ? "Ended" : "Ringing" + ELLIPSIS);
      return '<div class="row' + (missed ? ' missed' : '') + '">' +
        '<span class="who">' + (k ? '<a href="#' + esc(k) + '" title="Texts">' + esc(name) + '</a>' : esc(name)) + '</span>' +
        '<span class="when">' + esc(whenShort(c.at)) + '</span>' +
        '<span class="last">' + esc(what) + '</span>' +
        (k ? '<a class="call" href="tel:+1' + esc(k) + '">Call</a>' : '<span></span>') +
      '</div>';
    }).join('') + '</div>';
  }, err => { view.innerHTML = '<div class="msg err">Could not load calls: ' + esc(err.message) + '</div>'; }));
}

/* ---------- left panel: Leads, Approved leads, Contacts ----------
   Read once when the page opens (same collections leads.html, approved-leads.html and
   customers.html use). Unread counts stay live from smsThreads. */
const people = {leads: [], approved: [], contacts: []};
const nameByKey = {};      // phone key -> name, so texts show a name instead of a number
let unreadByKey = {}, peopleLoaded = false;
const GROUPS = [
  {k: "leads", label: "Leads", open: true},
  {k: "approved", label: "Approved leads", open: true},
  {k: "contacts", label: "Contacts", open: false}
];
const openState = {};
GROUPS.forEach(g => { openState[g.k] = g.open; });

async function loadPeople() {
  const [L, A, C] = await Promise.allSettled([
    getDocs(collection(db, "leads")), getDocs(collection(db, "acceptedQuotes")), getDocs(collection(db, "customers"))]);
  const seen = new Set();
  const take = (list, rows) => rows.forEach(r => {
    if (!r.k || seen.has(r.k)) return;
    seen.add(r.k); list.push(r);
    if (r.name && !nameByKey[r.k]) nameByKey[r.k] = r.name;
  });
  const docs = s => s.status === "fulfilled" ? s.value.docs.map(d => ({id: d.id, ...d.data()})) : [];
  const byName = (a, b) => (a.name || "").localeCompare(b.name || "", undefined, {sensitivity: "base"});
  // Approved first so someone further along shows there, not as a lead.
  take(people.approved, docs(A).filter(q => !q.trashed).map(q => {
    const c = q.customer || {};
    return {k: key(c.phone), name: c.name || c.business || "No name", sub: q.number || ""};
  }).sort(byName));
  take(people.leads, docs(L).filter(l => !l.trashed && !l.converted)
    .sort((a, b) => ms(b.createdAt || b.updatedAt) - ms(a.createdAt || a.updatedAt))
    .map(l => ({k: key(l.phone), name: l.name || "No name", sub: l.status || "new"})));
  take(people.contacts, docs(C).filter(c => !c.trashed).map(c => {
    const phone = (Array.isArray(c.phones) && c.phones[0]) || c.phone;
    const biz = c.type && !/resid/i.test(c.type) && c.business;
    return {k: key(phone), name: (biz ? c.business : c.name) || c.business || "No name", sub: ""};
  }).sort(byName));
  [L, A, C].forEach(s => { if (s.status === "rejected") console.warn("people load", s.reason); });
  peopleLoaded = true;
  renderPeople();
  // An open conversation with no saved name picks one up now.
  const cn = document.getElementById("cname"), h = location.hash.slice(1);
  if (cn && nameByKey[h] && cn.textContent === pretty(h)) cn.textContent = nameByKey[h];
}

function renderPeople() {
  if (!peopleLoaded) return;   // still says Loading… until the three lists are in
  const box = document.getElementById("people");
  const t = document.getElementById("find").value.trim().toLowerCase(), td = t.replace(/\D/g, "");
  const cur = location.hash.slice(1);
  const match = p => !t || p.name.toLowerCase().includes(t) || (td.length >= 3 && p.k.includes(td));
  box.innerHTML = GROUPS.map(g => {
    const list = people[g.k].filter(match);
    const rows = list.length ? list.map(p => {
      const n = unreadByKey[p.k] || 0;
      return '<div class="pp' + (p.k === cur ? ' on' : '') + '">' +
        '<a class="open" href="#' + esc(p.k) + '" title="Texts with ' + esc(p.name) + '">' +
          '<span class="pn">' + esc(p.name) + '</span><span class="ph">' + esc(pretty(p.k)) + '</span></a>' +
        (n ? '<span class="dot" title="' + n + ' unread">' + n + '</span>' : '') +
        '<a class="call" href="tel:+1' + esc(p.k) + '">Call</a>' +
      '</div>';
    }).join('') : '<div class="none">' + (t ? "No matches" : "Nobody here yet") + '</div>';
    return '<details class="grp" data-g="' + g.k + '"' + (openState[g.k] || t ? ' open' : '') + '>' +
      '<summary>' + esc(g.label) + ' (' + list.length + ')</summary>' + rows + '</details>';
  }).join('');
  box.querySelectorAll("details.grp").forEach(d => d.addEventListener("toggle", () => {
    if (!document.getElementById("find").value.trim()) openState[d.dataset.g] = d.open;
  }));
}

document.getElementById("find").addEventListener("input", renderPeople);

function startPeople() {
  loadPeople().catch(e => {
    document.getElementById("people").innerHTML = '<div class="none">Could not load people: ' + esc(e.message) + '</div>';
  });
  onSnapshot(query(collection(db, "smsThreads"), orderBy("lastAt", "desc"), limit(200)), snap => {
    unreadByKey = {};
    snap.docs.forEach(d => { const n = Number(d.data().unread) || 0; if (n) unreadByKey[d.id] = n; });
    renderPeople();
  }, err => console.warn("unread", err));
}

/* ---------- which screen ---------- */
const route = () => {
  clearScreen();
  const h = decodeURIComponent(location.hash.slice(1));
  const isNew = h === "new" || h.startsWith("new/");
  document.getElementById("allBtn").hidden = !h;
  document.getElementById("newBtn").hidden = isNew;
  document.getElementById("callsBtn").hidden = h === "calls";
  document.body.classList.toggle("in-thread", !!h);   // phones: hide the people panel inside a conversation
  renderPeople();
  if (isNew) showNew(h.slice(4));
  else if (h === "calls") showCalls();
  else if (/^\d{5,15}$/.test(h)) showThread(h);
  else showList();
};

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=texts.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) {
    started = true; window.addEventListener("hashchange", route); route(); startPeople();
    if (pref.get() === "on") phoneOn();   // left on last time: turn back on
  }
});
</script>
</body>
