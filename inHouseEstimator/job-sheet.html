<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K&amp;C Estimator">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Job Sheet &middot; Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
/* Same look as approved-leads.html. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.summ .top .home,.summ .top #title{display:none}   /* report: no K&C logo, no "Summary" title */
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.new:disabled,.ghost:disabled{opacity:.6;cursor:default}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.panel h2{font:700 20px "Archivo",system-ui,sans-serif;margin:24px 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.panel h2:first-child{margin-top:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.acctno{font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
.cname{font-size:20px;font-weight:700}
.prow{font-size:17px;line-height:1.45}
.summ .prow{font-size:8.5px}   /* report: address and phone half size */
.prow a{color:var(--navy);font-weight:600}
.meta{color:var(--muted);font-size:14px}
.rrow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:baseline;margin-bottom:8px}
@media(max-width:620px){.rrow{grid-template-columns:1fr;gap:2px}}
.rlab{font-size:13px;font-weight:600;color:var(--muted)}
.rval{font-size:16px;white-space:pre-wrap}
.svc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.svc__head{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:17px;margin-bottom:6px}
.svc__head .amt{color:var(--muted);font-weight:600;font-size:15px}
.chk{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid #eef0f4;cursor:pointer;font-size:16px}
.chk:first-of-type{border-top:0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--green)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk .open{margin-left:auto;flex:none;font:600 14px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:#fff}
@media print{.chk .open{display:none}}
/* One button per room / add-on; tap to open its page. A tick shows once it's marked done. */
.spot{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid #eef0f4;color:var(--ink);text-decoration:none;font-size:16px}
.svc__head + .spot{border-top:0}
.spot:hover{background:#f6f7fa}
.spot__tick{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.spot.done .spot__tick{background:var(--green);border-color:var(--green)}
/* Done room: the After Threshold photo shows in place of the tick. */
.spot .spot__tick.thumb{width:64px;height:64px;border:0;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden}
.spot .spot__tick.thumb img{width:100%;height:100%;object-fit:contain;display:block}   /* whole photo, not cropped */
.spot__name{font-weight:600}
.spot__size{color:var(--muted);font-size:14px}
.spot__go{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}
/* On-site quote building: tap a line's header to open its rooms; add or delete rooms. */
button.svc__head{width:100%;background:none;border:0;padding:2px 0;margin:0;font:700 17px "Archivo";color:var(--ink);cursor:pointer;text-align:left;align-items:center}
.svc__head .amt{white-space:nowrap}
.svc__head .caret{display:inline-block;transition:transform .2s}
.svc.open .svc__head .caret{transform:rotate(180deg)}
.svc__body{display:none;margin-top:8px}
.svc.open .svc__body{display:block}
.srow{position:relative;overflow:hidden;border-top:1px solid #eef0f4;max-height:140px;transition:max-height .2s,opacity .2s}
.srow .spot{border-top:0;background:#fff;position:relative;z-index:1;transition:transform .2s}
.srow.swiped .spot{transform:translateX(-88px)}
.srow.gone{max-height:0;opacity:0}
.srow.grayed .spot{opacity:.45}
.srow.grayed .sprice{visibility:hidden}
.srow.grayed .spot__name::after,.srow.extra .spot__name::after{content:" (no charge)";font-weight:400}
.srow.extra .sprice{visibility:hidden}
.srow.gone .spot{transform:translateX(-100%)}
.sdel{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font:600 15px "Archivo";cursor:pointer}
/* Desktop (mouse): a Delete button at the end of each room row instead of swiping. */
@media (hover:hover) and (pointer:fine){
  .srow{display:flex;align-items:center}
  .srow .spot{flex:1;min-width:0;order:1}
  .sdel{position:static;order:2;width:auto;flex:none;padding:6px 12px;margin-left:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--red)}
}
.addroom{margin:10px 0 6px}
/* Straight-sq-ft line: a header that opens its rooms (tracking only, no prices) and Add room. */
.flathead{cursor:pointer}
.flathead .fcaret{font-size:16px;transition:transform .2s}
.flathead.open .fcaret{transform:rotate(180deg)}
.flatsub{display:none;margin:0 0 8px 14px;padding-left:12px;border-left:3px solid var(--gold)}
.flatsub.open,.summ .flatsub{display:block}
/* Room table, same rows as the estimator's room picker. */
.rpick{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rpick[hidden]{display:none}
.rprow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid #eef0f4;cursor:pointer}
.rprow:first-child{border-top:0}
.rpname{flex:1;min-width:0;font-weight:600;font-size:15px}
.rpcap{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rpstep{display:flex;align-items:center;gap:4px;flex:none}
.rpstep button{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px;line-height:1;cursor:pointer;color:var(--navy)}
.rpstep input{width:52px;text-align:center;font:16px "Archivo";padding:6px 4px;border:1px solid var(--line);border-radius:6px}
.rpfoot{display:flex;gap:10px;padding:10px;border-top:1px solid var(--line);background:#f6f7fa}
/* Detergents used: tap to open the sections, tap a section to open its products; Select marks one used. */
.chemfold>summary,.chemgrp>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
.chemfold>summary::-webkit-details-marker,.chemgrp>summary::-webkit-details-marker{display:none}
.chemfold>summary::before,.chemgrp>summary::before{content:"\25B8";color:var(--gold);transition:transform .15s}
.chemfold[open]>summary::before,.chemgrp[open]>summary::before{transform:rotate(90deg)}
.chemfold>summary h2{margin:0}
.chemsum,.chemcnt{margin-left:auto;font-size:14px;color:var(--muted);font-weight:600}
.chemgrp{border:1px solid var(--line);border-radius:8px;margin-top:8px}
.chemgrp>summary{padding:10px 12px;font-weight:700;font-size:15px}
.chemrow:not([data-sel]) .rpstep{display:none}
.chemsel{font:600 14px "Archivo";border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--navy);padding:6px 12px;cursor:pointer;flex:none}
.chemrow[data-sel] .chemsel{background:var(--green);border-color:var(--green);color:#fff}
/* Service header row: the header (tap to open) and, on carpet, the + for add-ons. */
.svc__headrow{display:flex;align-items:center;gap:10px}
.svc__headrow .svc__head{flex:1;min-width:0}
.svc__plus{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 22px/1 "Archivo";cursor:pointer}
.addonbox .rpick{margin:10px 0 4px}
.rpchk{width:26px;height:26px;accent-color:var(--green);cursor:pointer}
.rpall{display:inline-block;margin-top:5px;font:600 13px "Archivo";padding:4px 10px;border:1px solid var(--navy);border-radius:6px;background:#fff;color:var(--navy);cursor:pointer}
@media print{.svc__plus,.addonbox{display:none!important}}
/* + Add service (above the On-site total) and Add furniture (upholstery line). */
.addsvc{margin:4px 0 14px}
.addsvc .rprow{cursor:pointer}
.rpgo{flex:none;font-weight:600;font-size:14px;color:var(--navy)}
.addfurn{margin:10px 0 6px}
/* + Add service: the Add-ons heading between the services and the counted add-ons. */
.rphead{padding:8px 10px;font:700 12px "Archivo",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:#f6f7fa;border-top:1px solid var(--line)}
/* Carpet line: Change package. */
.pkgbox{margin:0 0 8px}
/* Change package and Add room side by side; an open table takes the full width. */
.pkgrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.pkgrow .addtop{margin:0 0 8px}
.pkgrow > div:has(.rpick:not([hidden])){flex-basis:100%;order:2}
.pkgbtn{padding:6px 12px;font:600 14px "Archivo",sans-serif;color:var(--navy);background:#fff;border:1px solid var(--gold);border-radius:6px;cursor:pointer}
.pkgbox .rprow{cursor:pointer}
/* Detergent & material, set once per section (carpet rooms, area rugs, tile): every room fills in from it. */
.secdef{margin:0 0 8px}
.pkgrow > div.secdef:has(.secpanel:not([hidden])){flex-basis:100%;order:2}
.secsum{display:block;font-size:12.5px;color:var(--muted);margin-top:4px}
.secsum:empty{display:none}
.secpanel{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:10px}
.secpanel[hidden]{display:none}
.seclab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600;font-size:14px}
.seclab b{min-width:72px}
.seclab select,.seclab input{font:16px "Archivo";padding:6px;border:1px solid var(--line);border-radius:6px}
.seclab input[type=number]{width:84px}
.seclab input[hidden]{display:none}
.secacts{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rughead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;margin:12px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.rughead .rugttl{font:700 13px "Archivo",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:7px}
.rughead .secdef{text-align:right}
.rughead > .secdef:has(.secpanel:not([hidden])){flex-basis:100%;text-align:left}
@media print{.secdef{display:none!important}}
/* Not billed (taken off in the estimator): on the job sheet at $0, never in the Summary or the customer's report. */
.summ .nbill,.pub .nbill{display:none!important}
@media print{.addsvc,.addfurn{display:none!important}}
/* Job discount ($ or %), staff only, just above the on-site total. */
.jdisc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:14px 0 6px;font-size:15px;font-weight:600}
.jdisc label{display:inline-flex;align-items:center;gap:4px}
.jdisc input{width:84px;font:16px "Archivo",sans-serif;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.jdisc .off{margin-left:auto;color:var(--green)}
.jtotal{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700;border-top:2px solid var(--navy);padding-top:10px;margin-top:4px}
@media print{.svc__body{display:block!important}.addroom,.sdel,.caret{display:none!important}}
.prog{font-size:14px;color:var(--muted);margin-bottom:10px}
textarea{display:block;width:100%;min-height:110px;resize:vertical;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.photos{border:2px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pgrid a{display:block;border-radius:8px;overflow:hidden;background:#eef0f4}
.pgrid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.lbox{position:fixed;inset:0;z-index:1000;background:rgba(10,14,22,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lbox.on{display:flex}
.lbox__fig{position:relative;display:inline-flex;max-width:95vw;max-height:90vh}
.lbox img{display:block;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:6px}
.lbox__x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:2px solid #fff;border-radius:50%;background:#1c2230;color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
/* Job photos: camera button in the heading, photos in a grid, × to take one off. */
.jph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Take photo + Add photos always share one line; on phones they split the width evenly. */
.pbtns{display:flex;gap:8px}
@media (max-width:600px){.pbtns{flex:1 1 100%}.pbtns .pcam{flex:1 1 0;min-width:0}}
.pcam{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 12px;background:#fff;color:var(--navy);border:2px solid var(--gold);border-radius:8px;cursor:pointer;font:600 14px "Archivo";white-space:nowrap}
/* The real file picker sits inside each button, unseen: tapping the button opens it directly (Android blocks code-opened pickers). */
.pin{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.jpgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.jpcell{position:relative;border-radius:8px;overflow:hidden;background:#eef0f4}
.jpcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.jpx{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(10,14,22,.75);color:#fff;font-size:20px;line-height:1;cursor:pointer}
@media print{.pcam,.jpx{display:none!important}}
/* Summary: Notes photos, Job photos and Crew notes read-only, and left out entirely when empty. */
.crewro{display:none;white-space:pre-wrap;font-size:16px}
.summ .crewro{display:block}
/* Headline: a typing box while working; in the Summary, the saved line in big text (nothing when empty). */
#headline{display:block;width:100%;font:600 18px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:transparent}
.headro{display:none;font:700 24px/1.25 "Archivo";color:var(--ink)}
.summ .headro{display:block}
.summ #headline,.summ .headbox.empty{display:none!important}
/* Header photo + headline: on the working sheet a normal box above Customer; on the report a full-width banner. */
.hero{margin-bottom:24px}
.summ .hero{margin:0 0 22px}
.summ .hero:has(#pbw-head:not(.empty)){margin:-18px -18px 22px;border-radius:10px 10px 0 0;overflow:hidden}
.summ #pbw-head .jph,.summ #pnote-head{display:none!important}
.summ #pgrid-head{display:block}
.summ #pgrid-head .jpcell{border-radius:0}
.summ #pgrid-head .jpcell:not(:first-child){display:none}
.summ #pgrid-head .jpcell img{aspect-ratio:auto;height:auto;object-fit:contain;background:#000}   /* whole header photo, nothing cut off */
.summ .hero .headbox{margin:0!important;padding:16px 18px 0;text-align:center}
.summ .headro{font:700 30px/1.2 "Archivo",system-ui,sans-serif}
.summ .cname{display:none}
.summ .pbwrap.empty,.summ .crewbox.empty,.summ .pcam,.summ .jpx,.summ .pbwrap .note,.summ #crewNotes,.summ #saveRow{display:none!important}
/* Summarize: the same sheet cleaned up for the customer. Prices sit where the Delete buttons
   were; staff-only parts (notes, crew notes, photos, add / delete controls) are hidden. Edit flips back. */
.sprice{display:none;margin-left:auto;flex:none;font-weight:600;white-space:nowrap}
.sumonly,.sumword{display:none!important}
.sdsel{display:block;margin:2px 0 8px 40px;font-family:inherit;font-size:13px;font-weight:600;padding:4px 8px;border:1px solid #d6d6d6;border-radius:8px;background:#fff;color:#333}   /* per-item discount, working sheet only */
.summ .sdsel,.pub .sdsel{display:none!important}
.summ .sumonly{display:flex!important}
.summ .sumword{display:inline!important}
.summ .sprice{display:inline}
.summ .sdel,.summ .spot__go,.summ .spot__tick:not(.thumb),.summ .svc__plus,.summ .addonbox,.summ .addroom,.summ .addsvc,
.summ .addfurn,.summ .staff,.summ .staffword,.summ .prog{display:none!important}
/* Summary: each service starts folded, showing its first room photos; tap the header to open it. */
.summ .svc:not(.sopen) .svc__body{display:none}   /* beats the working sheet's own open lines */
.summ .svc.sopen .svc__body{display:block}
.summ .svc.sopen .svc__head .caret{transform:rotate(180deg)}
.summ .svc:not(.sopen) .svc__head .caret{transform:none}
.summ .svc__head .caret{display:none!important}   /* Summary: price only up top; the dropdown is More ▾ under the rows */
.summ .svc__head .amt{color:var(--ink)}
.sthumbs{display:none}
.summ .svc:not(.sopen) .sthumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.summ .svc:not(.sopen) .sthumbs.six{grid-template-columns:repeat(3,1fr)}
.sthumbs span{display:block;aspect-ratio:1;border-radius:8px;background:rgba(0,0,0,.25) center/contain no-repeat}   /* whole photo, not cropped */
/* Folded service in the Summary: first 3 rooms as rows of name + Before + After, then More. */
.summ .svc:not(.sopen) .sthumbs.sprev{display:block}
.sprow{display:grid;grid-template-columns:minmax(0,1fr) 96px 96px;gap:8px;align-items:center;margin-top:10px}
.sprow b{font-weight:600;font-size:15px;overflow-wrap:anywhere}
a.sprow{color:inherit;text-decoration:none;padding:6px;margin-left:-6px;margin-right:-6px;border-radius:8px}
a.sprow:hover,a.sprow:active{background:rgba(227,182,74,.12)}
.sthumbs .sprow .sgo{display:inline;aspect-ratio:auto;background:none;border-radius:0;color:var(--gold);font-weight:700}
/* Plan names in the brand lettering, same as the estimator: Deep in gold, Signature in red script. */
.segGold{color:#E3B64A}
.segScript{font-family:"Dancing Script",cursive;font-size:1.35em;font-weight:600;color:#EA5545;letter-spacing:0}
.sprev .srest{display:none}
.sprev.sall .srest{display:grid}
.spslot{position:relative}
.spslot::after{content:attr(data-lbl);position:absolute;left:4px;bottom:4px;font:700 10.5px "Archivo";background:rgba(10,14,22,.7);color:#fff;border-radius:10px;padding:1px 7px}
.smore{display:block;margin:12px 0 0 auto;background:none;border:1px solid var(--gold);color:inherit;border-radius:8px;padding:8px 16px;font:600 14px "Archivo";cursor:pointer}
@media (max-width:420px){ .sprow{grid-template-columns:minmax(0,1fr) 80px 80px} }
/* Computers: no wide empty gap. Each room / piece is a small card (name on top, Before and After
   side by side, bigger), three cards across; More sits under them on the right. */
@media (min-width:760px){
  .summ .svc:not(.sopen) .sthumbs.sprev{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
  .sthumbs a.sprow{grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:10px;border:1px solid rgba(227,182,74,.28);border-radius:10px}
  .sthumbs .sprow b{grid-column:1/-1}
  .sthumbs .smore{grid-column:1/-1;margin-top:0}
}
.summ .srow .spot{transform:none!important}
.sumrow{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}

        if (a && (l.key || "carpet") === "carpet") { it.addonKey = a.key; it.addonPerSqft = a.sqft; }

         $0, so the quoted sq ft price stays as is. */
      if ((!Array.isArray(it.rooms) || !it.rooms.length) && Array.isArray(it.areas) && it.areas.length) {

/* keepAll (a job-sheet quote edited in the estimator): everything on the old sheet the estimate

  const oldRoomIds = new Set(); old.forEach(l => (l.items || []).forEach(it => (it.rooms || []).forEach(r => oldRoomIds.add(r.id))));
  const claimed = new Set(), lineOf = [];
  fresh.forEach((fl, i) => {
    let oi = old.findIndex(o => !o._u && (o.key || "") === (fl.key || "") && base(o.label) === base(fl.label));
    if (oi < 0) oi = old.findIndex(o => !o._u && base(o.label) === base(fl.label));
    const ol = oi >= 0 ? old[oi] : null; if (ol) ol._u = true; lineOf[i] = oi;
    (fl.items || []).forEach((it, j) => {

      const ot = oj >= 0 ? ol.items[oj] : null; if (ot) ot._u = true;
      if (Array.isArray(it.rooms) && it.rooms.length) {

        it.rooms.forEach(rm => { const m = pool.find(o => !o._u && String(o.name || "").toLowerCase() === String(rm.name || "").toLowerCase());

      } else if (ot && !(Array.isArray(ot.rooms) && ot.rooms.length)) {

    /* keepAll: skip what was already deleted on site, and the hair & debris item the room boxes price. */
    const keepThis = keepAll && !ot.removed && ot.addonKey !== "hairRoom";
    if (Array.isArray(ot.rooms) && ot.rooms.length) {
      const keep = ot.rooms.filter(r => !r._u && (keepThis || hasData(r.id)));
      if (keep.length) { const fl = keepLine();
        fl.items.push({ label: "Not billed (from before the estimate changed)", cost: 0, track: true, notBilled: true,
          rooms: keep.map(r => ({ id: r.id, name: r.name, sqft: Number(r.sqft) || 0, qty: 1, cost: 0 })) }); }
    } else if (!ot._u) {
      const ok = oi + "-" + oj, has = keepThis || hasData(ok) || Object.keys(spots).some(k => k.indexOf(ok + "-") === 0 && hasData(k));
      if (has) { const fl = keepLine(); fl.items.push({ label: String(ot.label || "Item").split(/\s+[—-]\s+/)[0].replace(/\s*\$[\d.,]+/g, "").replace(/\s*\(not billed\)/gi, "") + " (not billed)", cost: 0, kept: true, notBilled: true });
        const nk = fi + "-" + (fl.items.length - 1); if (nk !== ok) moves[nk] = ok; }

  let newSpots = null;

    Object.entries(moves).forEach(([nk, ok]) => Object.keys(spots).forEach(k => {
      if (k === ok) newSpots[nk] = spots[k]; else if (k.indexOf(ok + "-") === 0) newSpots[nk + k.slice(ok.length)] = spots[k]; }));

/* Reprice one line after a room change: each room at the item's rate, then the item's and the
   line's square feet and cost. Other parts of the line (stairs, rugs...) keep their price. */
function recalc(l){
  let delta = 0, lineSq = 0, any = false;

    const old = Number(it.cost) || 0; let sq = 0, c = 0;
    it.rooms.forEach(rm => { rm.cost = r2((Number(rm.sqft) || 0) * it.perSqft * (1 - (Number(rm.disc) || 0) / 100)); sq += Number(rm.sqft) || 0; c += rm.cost; });   /* rm.disc: % off that room */

/* Hair & debris removal checked room by room (job-room.html saves spots.<room id>.hair): the line
   gets one "Hair & debris removal — N sq ft" item priced on just those rooms' sq ft, at the rate in
   pricing.js. Returns true when something changed, so it gets saved. */
function syncHair(lines, spots){
  const base = Number((((PRICING.SERVICES.carpet || {}).addons || {}).hair || {}).sqft) || 0;
  let changed = false;
  lines.forEach(l => {
    const items = Array.isArray(l.items) ? l.items : [];
    /* Quoted with hair & debris on the whole carpet line ("Hair & debris removal — 650 sq ft"):
       hand it over to the room boxes. Every room starts checked at the quoted rate, so the
       total doesn't move; unchecking a room takes its sq ft off. */
    const whole = items.find(x => !x.removed && x.addonKey !== "hairRoom" && /^hair & debris/i.test(String(x.label || "")));
    /* Only when the line has priced rooms to hand it to; a straight-sq-ft line keeps its quoted hair & debris. */
    const pricedRooms = items.some(x => !x.removed && !x.track && Array.isArray(x.rooms) && x.rooms.length);
    if (whole && pricedRooms) {
      const wsq = Number(String((String(whole.label).match(/([\d,]+)\s*sq ft/i) || [])[1] || "").replace(/,/g, "")) || 0;
      l.hairQuoted = true;
      l.hairRate = Number(whole.addonPerSqft) || (wsq ? (Number(whole.cost) || 0) / wsq : base);
      l.cost = r2((Number(l.cost) || 0) - (Number(whole.cost) || 0)); whole.cost = 0; whole.removed = true; changed = true;
    }
    const rate = Number(l.hairRate) || base;
    /* A room's box: what was saved on its page, else checked if the quote had hair & debris. */
    let sq = 0;
    items.forEach(it => { if (it.removed || it.track || !Array.isArray(it.rooms)) return;   /* tracking rooms add no money */
      it.rooms.forEach(rm => { const s = spots[rm.id];
        if (s && typeof s.hair === "boolean" ? s.hair : !!l.hairQuoted) sq += Number(rm.sqft) || 0; }); });
    let it = items.find(x => x.addonKey === "hairRoom");
    if (!sq && (!it || it.removed)) return;
    if (!it) { it = { label: "", cost: 0, addonKey: "hairRoom" }; items.push(it); l.items = items; }
    const cost = sq ? r2(sq * rate) : 0, label = "Hair & debris removal — " + sq.toLocaleString("en-US") + " sq ft";
    if (Number(it.cost) === cost && it.label === label && !!it.removed === !sq) return;
    l.cost = r2((Number(l.cost) || 0) - (Number(it.cost) || 0) + cost);
    it.cost = cost; it.label = label; it.removed = !sq; changed = true;
  });
  return changed;
}

/* Rooms and prices come from pricing.js, the same file the estimator uses, so a size or price
   changed there changes here too. Flight of Stairs is left out of the room table: it's its
   own add-on on the job. */
const PRICING = window.KC_PRICING || { ROOM_TYPES: [], SERVICES: {} };

/* Add-ons offered by the + on each service line, straight from the estimator's list in
   pricing.js (Flight of Stairs and Area Rugs are already on the job). */
/* Hair & debris isn't in the + list: it's the checkbox on each carpet room's page. */
const ADDON_KEYS = { carpet: ["deo", "prot", "filter", "stretch", "pet", "stain"], tile: ["clearseal", "seal", "acid"] };
const addonsFor = svc => (ADDON_KEYS[svc] || [])
  .map(k => ({ key: k, svc, ...(((PRICING.SERVICES[svc] || {}).addons || {})[k] || {}) })).filter(a => a.name);
const CARPET_ADDONS = addonsFor("carpet");
const ALL_ADDONS = Object.keys(ADDON_KEYS).flatMap(addonsFor);
const addonUnit = a => a.key === "filter" ? "linear ft" : a.key === "stretch" ? "room"
  : a.svc === "tile" ? "sq ft" : "spot";
/* Counted add-ons split into one row and page per spot / room (Stain treatment 1, 2, 3...),
   each deletable on its own. Filter lines (linear ft) stay one row. */
const SPLIT_ADDONS = ["stretch", "pet", "stain"];
/* One row and page per piece / spot: the counted add-ons, and upholstery pieces added on site. */
const isSplit = it => !!it.split || SPLIT_ADDONS.includes(it.addonKey);
/* A counted add-on that came from the estimate ("Pet odor treatment × 6", or an older quote with
   no count) gets the same fields as one added on site, so it splits into 1, 2, 3... too. */
function asSplit(it){
  if (!it || it.addonKey || it.removed || (Array.isArray(it.rooms) && it.rooms.length)) return;
  const lab = String(it.label || "").trim();
  const a = ALL_ADDONS.find(x => SPLIT_ADDONS.includes(x.key) && x.linear > 0 &&
    new RegExp("^" + x.name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "(\\s*\u00d7\\s*\\d+)?$", "i").test(lab));
  if (!a) return;
  const m = lab.match(/\u00d7\s*(\d+)$/), q = m ? Number(m[1]) : Math.round((Number(it.cost) || 0) / a.linear);
  if (!(q > 0)) return;
  const unit = addonUnit(a);
  Object.assign(it, { addonKey: a.key, addonRate: a.linear, qty: q, baseName: a.name,
    label: a.name + " \u2014 " + q + " " + unit + (q === 1 ? "" : "s") });
}

    else if (s.mode === "items") out.push({ id: k, svc: k, name: s.name, items: true });

    name: CA.stairs.name, cap: "$" + CA.stairs.linear + " per flight, in halves" },

/* Carpet package on a line: the tier whose name is in the line's or its main item's label. */
const TIERS = (PRICING.SERVICES.carpet || {}).tiers || {};
const tierOf = l => { const txt = [l.label, ...(l.items || []).filter(it => !it.removed).map(it => it.label)].join(" | ");

/* Change package: the line's rate goes to the new package's (rooms kept and repriced; a straight-sq-ft
   line repriced on its sq ft), then the estimator's package rules for the extras:
   Signature includes drying, deodorizer and protector; Deep includes drying;
   Essential has no protector or filter lines; Quick Dry has no drying or protector. */
function changePkg(l, from, to){
  const F = TIERS[from], T = TIERS[to]; if (!F || !T || from === to) return;
  const swap = s => String(s || "").split(F.name).join(T.name)
    .replace(/@\s*\$[\d.]+\s*\/\s*sq\s*ft/i, "@ $" + T.sqft.toFixed(2) + "/sq ft");
  let delta = 0;
  (l.items || []).forEach(it => {
    if (it.removed) return;

    else if (isFlat(it)) {

      const old = Number(it.cost) || 0; it.cost = r2(sq * T.sqft); it.label = swap(it.label); delta += it.cost - old;
    }
  });
  l.label = swap(l.label); l.tier = to;
  /* Extras by package. */
  const keyOf = it => it.addonKey || (["dry", "deo", "prot", "filter"].find(k => CA[k] && String(it.label || "").startsWith(CA[k].name)) || "");
  const drop = { signature: ["dry", "deo", "prot"], essential: ["prot", "filter"], quickdry: ["dry", "prot"] }[to] || [];
  (l.items || []).forEach(it => {
    if (it.removed) return; const k = keyOf(it);
    if (drop.includes(k) || (k === "dry" && it.included && to !== "deep")) { delta -= Number(it.cost) || 0; it.cost = 0; it.removed = true; }
    else if (k === "dry" && to === "deep" && !it.included) { delta -= Number(it.cost) || 0; it.cost = 0; it.included = true; it.label = CA.dry.name; }
  });
  if (to === "deep" && CA.dry && !(l.items || []).some(it => !it.removed && keyOf(it) === "dry"))
    l.items.push({ label: CA.dry.name, cost: 0, included: true });
  l.cost = r2((Number(l.cost) || 0) + delta);
  recalc(l);   /* reprices the rooms at the new rate */
}

        '<textarea id="custNotes" style="margin-top:12px" placeholder="Notes about the customer or the home before starting">' + esc(js.custNotes || "") + '</textarea></div>' +

      '<h2><span class="staffword">The Job</span><span class="sumword">Services performed</span></h2>' +
      '<div class="prog" id="prog"></div>' +
      (sections || '<div class="msg">This quote has no line items.</div>') + addSvc + (sections ? jtotal : '') +

      '<div style="margin-top:24px">' +
      photoBox("job", "Job photos") +   /* shown read-only in the Summary */
      /* Chemicals used: staff only, saved with the Save button under Crew notes. */

        '<div id="chems"><div class="msg">Loading&hellip;</div></div></details></div>' +
      /* Crew notes: in the Summary, the saved text read-only; nothing at all when there's none. */
      '<div class="crewbox' + (String(js.crewNotes || "").trim() ? '' : ' empty') + '" style="margin-top:24px"><h2>Crew notes</h2>' +
      '<div class="crewro">' + esc(js.crewNotes || "") + '</div>' +
      '<textarea id="crewNotes" placeholder="What you found on site, extra spots, anything for next time">' + esc(js.crewNotes || "") + '</textarea></div>' +

      (showVar ? '<div class="varbox"><div>Variance <b>' + (variance > 0 ? '+' : '&minus;') + money(Math.abs(variance)) + '</b></div>' +
        '<div class="meta">Quote ' + money(cur.quoted) + ' &rarr; Job sheet ' + money(r2(sub + cur.adj)) + '</div>' +
        /* On-site estimate (blank sheet started from Create lead), not sent yet: just Send estimate. */
        (q.onsiteEstimate && q.status === "draft"
          ? '<div class="varacts"><button type="button" class="new" id="revBtn">Send estimate</button></div></div>'

      /* Save sits at the very bottom, on the left of the Summarize line. */
      '<div class="sumrow"><div class="actions" id="saveRow" style="margin:0 auto 0 0"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' +
        '<button type="button" class="new" id="sumBtn"></button></div>' +
      /* Invoiced or paid: price locked. Whole job = the estimator's Copy job; Quote extras only = a new
         on-site estimate with just what was added at no charge, priced, to discount and send. */
      ((place === "invoices" || place === "paidInvoices") && !PUBLIC
        ? '<div class="staff" style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0">' +
            '<button type="button" class="new" id="wholeJobBtn">Whole job</button>' +
            '<button type="button" class="new" id="extrasBtn">Quote extras only</button></div>' : '') +
      /* The updated quote's link, Preview / Text / Email, and whether it's been approved. */
      '<div class="revbox" id="revBox"></div>' +
    '</div>';
  applyMode();
  const tripBox = document.getElementById("tripBox");
  if (tripBox) { try { mountTrip({ box: tripBox, db, place, id, addr, trip: q.trip, phone: c.phone || "", custName: c.name || c.business || "" }); } catch (e) { console.error("trip", e); } }

  const prog = document.getElementById("prog"), note = document.getElementById("note");

  /* Swap each done room's tick for its After Threshold photo; the tick stays if the photo won't load. */
  view.querySelectorAll(".spot__tick[data-thumb]").forEach(t =>
    getDownloadURL(ref(storage, t.dataset.thumb)).then(u => {

  /* Summary's folded-service photos: the same photos its room rows show, so the preview matches what opens. */
  view.querySelectorAll(".svc").forEach(sv => { const box = sv.querySelector(".sthumbs"); if (!box || box.classList.contains("sprev")) return;   /* Before / After rows keep their own photos */
    const ps = [...sv.querySelectorAll(".spot__tick[data-thumb]")].map(t => t.dataset.thumb).slice(0, box.classList.contains("six") ? 6 : 4);
    if (ps.length) box.innerHTML = ps.map(p => '<span data-sthumb="' + esc(p) + '"></span>').join(""); });
  view.querySelectorAll("[data-sthumb]").forEach(t =>
    getDownloadURL(ref(storage, t.dataset.sthumb)).then(u => { t.style.backgroundImage = 'url("' + u + '")'; })
      .catch(e => { console.error("Thumb " + t.dataset.sthumb, e); t.remove(); }));
  ["crewNotes", "custNotes", "headline"].forEach(t => document.getElementById(t).addEventListener("input", () => { note.textContent = "Not saved yet."; note.classList.remove("err"); }));

  /* Photo boxes (Notes photos, Job photos): saved on the job as soon as they upload, so none are lost. */
  const wireBox = (k, field, folder) => {
  let jobPhotos = (Array.isArray(q[field]) ? q[field] : []).filter(p => typeof p === "string" && p.startsWith("quick-quote-photos/"));
  const jpgrid = document.getElementById("pgrid-" + k), jobPick = document.getElementById("ppick-" + k), jpNote = document.getElementById("pnote-" + k);
  const drawJP = async () => {
    const urls = await Promise.all(jobPhotos.map(p => getDownloadURL(ref(storage, p)).catch(e => { console.error("Photo " + p, e); return null; })));
    if (!jpgrid.isConnected) return;
    document.getElementById("pbw-" + k).classList.toggle("empty", !urls.some(Boolean));   /* Summary hides a box with nothing to show */
    jpgrid.innerHTML = jobPhotos.map((p, k) => urls[k]
      ? '<div class="jpcell"><a href="' + esc(urls[k]) + '" class="pshot" data-full="' + esc(urls[k]) + '"><img src="' + esc(urls[k]) + '" alt="" loading="lazy"></a>' +
        '<button type="button" class="jpx" data-k="' + k + '" aria-label="Remove photo">×</button></div>' : '').join("") ||
      '<div class="msg">No photos yet.</div>';
  };
  drawJP();
  const saveJP = () => setDoc(doc(db, place, id), { [field]: jobPhotos, [field + "At"]: serverTimestamp() }, { merge: true });
  /* Take photo and Add photos both upload the same way. */
  [jobPick, document.getElementById("pcap-" + k)].forEach(inp => inp.addEventListener("change", async () => {
    const list = [...inp.files]; inp.value = ""; if (!list.length) return;

      jpNote.textContent = "Uploading photo " + (n + 1) + " of " + list.length + "…";

        jobPhotos.push(path);

    }

    catch (e) { console.error(e); jpNote.textContent = "Photos uploaded but not saved to the job: " + e.message; jpNote.classList.add("err"); }

  }));
  /* × takes a photo off the job (the file itself stays in storage). */

  };
  wireBox("notes", "notesPhotos", "notes");
  wireBox("job", "jobPhotos", "sheet");   /* same field and folder as before, so photos already added stay */
  wireBox("finish", "finishPhotos", "finish");
  wireBox("head", "headerPhotos", "header");

  /* ---- Chemicals used: the product list comes from Settings (settings/chemicals). The crew enters how
     much of each went on this job, in ounces or quarts, and the cost works out from the Settings price.
     Saved on the job under jobSheet.chemicals with the price at the time, so later price changes in
     Settings don't rewrite old jobs. A product deleted from Settings still shows here if this job used it. */
  const chemBox = document.getElementById("chems"), CHEM_OZ = { oz: 1, qt: 32 };
  let chemReady = false;
  const chemCostOf = r => {
    const amount = Number(r.querySelector("input").value) || 0, unit = r.querySelector("select").value === "qt" ? "qt" : "oz";
    const unitCost = Number(r.dataset.cost) || 0, perOz = unitCost / CHEM_OZ[r.dataset.punit];
    return { id: r.dataset.chem, name: r.dataset.name, group: r.dataset.group, amount, unit,
      unitCost, priceUnit: r.dataset.punit, cost: Math.round(amount * CHEM_OZ[unit] * perOz * 100) / 100 };
  };
  const readChems = () => [...chemBox.querySelectorAll(".chemrow")].map(chemCostOf).filter(c => c.amount > 0);
  const calcChems = () => {
    let sum = 0, n = 0;
    chemBox.querySelectorAll(".chemrow").forEach(r => {
      const c = chemCostOf(r); sum += c.cost;
      if (c.amount > 0) r.dataset.sel = "1";   // anything with an amount counts as selected
      if (r.dataset.sel) n++;
      r.querySelector(".chemsel").textContent = r.dataset.sel ? "Selected" : "Select";
      r.querySelector(".chemcost").textContent = !c.amount ? "" : c.unitCost ? money(c.cost) : "No price set in Settings";
    });
    chemBox.querySelectorAll(".chemgrp").forEach(g => { const k = g.querySelectorAll(".chemrow[data-sel]").length;
      g.querySelector(".chemcnt").textContent = k ? k + " selected" : ""; });
    const t = document.getElementById("chemTotal"); if (t) t.textContent = money(sum);
    const s = document.getElementById("chemSum"); if (s) s.textContent = n ? n + " used · " + money(sum) : "";
  };
  (async () => {
    const saved = Array.isArray(js.chemicals) ? js.chemicals : [];
    let list = [];
    try { const s = await getDoc(doc(db, "settings", "chemicals")); if (s.exists() && Array.isArray(s.data().items)) list = s.data().items.slice(); }
    catch (e) { console.error("chemicals", e); }
    const ids = new Set(list.map(c => c.id)), used = new Map(saved.map(c => [c.id, c]));
    saved.forEach(c => { if (!ids.has(c.id)) list.push({ id: c.id, name: c.name, group: c.group, cost: c.unitCost, unit: c.priceUnit }); });
    if (!chemBox.isConnected) return;
    if (!list.length) { chemBox.innerHTML = '<div class="msg">No detergents set up yet. Add them in <a href="./settings.html">Settings</a>.</div>'; return; }
    const sel = 'style="font:16px Archivo;padding:6px 4px;border:1px solid var(--line);border-radius:6px"';
    /* Same sections as Settings; anything unknown counts as a pre-spray / detergent. */
    const CHEM_GROUPS = [["general", "Pre-sprays & detergents"], ["rinse", "Rinses"], ["stain", "Stain removers & spotters"],
      ["deo", "Deodorizers & protectors"], ["floor", "Tile & hard floor"], ["machine", "Machine care"]];
    const groupOf = c => CHEM_GROUPS.some(x => x[0] === c.group) ? c.group : "general";
    chemBox.innerHTML = CHEM_GROUPS.map(([g, label]) => {
      const rows = list.filter(c => groupOf(c) === g); if (!rows.length) return "";
      const anyUsed = rows.some(c => Number((used.get(c.id) || {}).amount) > 0);
      return '<details class="chemgrp"' + (anyUsed ? ' open' : '') + '><summary>' + label + '<span class="chemcnt"></span></summary>' + rows.map(c => {
        const u = used.get(c.id) || {};
        return '<div class="rprow chemrow" style="cursor:default" data-chem="' + esc(c.id) + '" data-name="' + esc(c.name) + '" data-group="' + g +
          '" data-cost="' + (Number(c.cost) || 0) + '" data-punit="' + (c.unit === "qt" ? "qt" : "oz") + '">' +
          '<span class="rpname">' + esc(c.name) + '<span class="rpcap chemcost"></span></span>' +
          '<button type="button" class="chemsel">Select</button>' +
          '<span class="rpstep"><input type="number" min="0" step="0.5" inputmode="decimal" placeholder="0" value="' + (Number(u.amount) || "") +
            '" aria-label="How much ' + esc(c.name) + '">' +
          '<select ' + sel + ' aria-label="Ounces or quarts"><option value="oz"' + (u.unit === "qt" ? "" : " selected") + '>oz</option>' +
            '<option value="qt"' + (u.unit === "qt" ? " selected" : "") + '>qt</option></select></span></div>';
      }).join("") + '</details>';
    }).join("") + '<div class="jtotal" style="font-size:16px"><span>Chemical cost for this job</span><b id="chemTotal">$0.00</b></div>';
    calcChems(); chemReady = true;
  })();
  chemBox.addEventListener("input", e => {
    if (!e.target.closest(".chemrow")) return;
    calcChems(); note.textContent = "Not saved yet."; note.classList.remove("err");
  });

  chemBox.addEventListener("click", e => {
    const b = e.target.closest(".chemsel"); if (!b) return;
    const r = b.closest(".chemrow");

  /* ---- Detergent & material per section (carpet rooms, area rugs, tile). Set once and every room in
     that section fills in (job-room.html reads secDefaults.<key>); any room can still be changed on
     its own page. Amounts feed Detergents used below: each product's amount there becomes the total
     across the sections, and the sheet saves. ---- */
  const secDefs = { ...secDefsNow };
  const MATS = { carpet: ["Nylon", "Polyester", "Olefin", "Other"], tile: ["Porcelain", "Ceramic"] };
  const toOz = (a, u) => (Number(a) || 0) * (u === "qt" ? 32 : 1);
  view.querySelectorAll(".secdef").forEach(box => {
    const key = box.dataset.sec, kind = box.dataset.kind, panel = box.querySelector(".secpanel"), sumEl = box.querySelector(".secsum");
    const draw = () => {
      const d = secDefs[key] || {};
      const prods = [...chemBox.querySelectorAll('.chemrow[data-group="general"]')].map(r => ({ id: r.dataset.chem, name: r.dataset.name }));
      const prodRow = f => { const v = d[f] || {};
        return '<label class="seclab"><b>' + (f === "preSpray" ? "Pre-Spray" : "Rinse") + '</b>' +
          '<select data-f="' + f + '"><option value="">None</option>' +
          prods.map(p => '<option value="' + esc(p.id) + '"' + (v.id === p.id ? ' selected' : '') + '>' + esc(p.name) + '</option>').join("") +
          (v.id && !prods.some(p => p.id === v.id) ? '<option value="' + esc(v.id) + '" selected>' + esc(v.name) + '</option>' : '') + '</select>' +
          '<input type="number" min="0" step="0.5" inputmode="decimal" placeholder="Amount" data-a="' + f + '" value="' + (Number(v.amount) || "") + '">' +
          '<select data-u="' + f + '"><option value="oz"' + (v.unit === "qt" ? "" : " selected") + '>oz</option>' +
          '<option value="qt"' + (v.unit === "qt" ? " selected" : "") + '>qt</option></select></label>'; };
      panel.innerHTML = '<label class="seclab"><b>Material</b><select data-f="material"><option value="">Pick one</option>' +
          MATS[kind].map(m => '<option' + (d.material === m ? ' selected' : '') + '>' + m + '</option>').join("") + '</select>' +
          (kind === "carpet" ? '<input type="text" data-f="materialOther" placeholder="Which fiber?" value="' + esc(d.materialOther || "") + '"' + (d.material === "Other" ? '' : ' hidden') + '>' : '') + '</label>' +
        prodRow("preSpray") + prodRow("rinse") +
        (prods.length ? '' : '<div class="meta">No detergents yet. Add them in <a href="./settings.html">Settings</a>.</div>') +
        '<div class="secacts"><button type="button" class="new" data-secapply>Apply to all rooms</button><span class="note"></span></div>';
    };
    box.addEventListener("change", e => {
      if (!e.target.matches('select[data-f="material"]')) return;
      const o = panel.querySelector('[data-f="materialOther"]'); if (o) o.hidden = e.target.value !== "Other";
    });
    box.addEventListener("click", async e => {
      if (e.target.closest("[data-secopen]")) { if (panel.hidden) draw(); panel.hidden = !panel.hidden; return; }
      const btn = e.target.closest("[data-secapply]"); if (!btn) return;
      const msg = panel.querySelector(".secacts .note");
      const pickP = f => { const s = panel.querySelector('select[data-f="' + f + '"]'); if (!s.value) return null;
        return { id: s.value, name: s.options[s.selectedIndex].text, amount: Number(panel.querySelector('[data-a="' + f + '"]').value) || 0,
          unit: panel.querySelector('[data-u="' + f + '"]').value === "qt" ? "qt" : "oz" }; };
      const mat = panel.querySelector('select[data-f="material"]').value, oth = panel.querySelector('[data-f="materialOther"]');
      const d = { material: mat || null, materialOther: mat === "Other" && oth ? oth.value.trim() : "", preSpray: pickP("preSpray"), rinse: pickP("rinse") };
      btn.disabled = true; msg.textContent = "Saving…"; msg.classList.remove("err");
      try {
        await setDoc(doc(db, place, id), { secDefaults: { [key]: d } }, { merge: true });
        secDefs[key] = d; q.secDefaults = { ...secDefs };
        sumEl.textContent = secSummary(d);
        /* Detergents used: each product the sections use gets the sections' total (in oz), then the sheet saves. */
        if (chemReady) {
          const tot = {};
          Object.values(secDefs).forEach(s => ["preSpray", "rinse"].forEach(f => { const p = s && s[f];
            if (p && p.id && p.amount) tot[p.id] = (tot[p.id] || 0) + toOz(p.amount, p.unit); }));
          Object.keys(tot).forEach(pid => {
            const r = [...chemBox.querySelectorAll(".chemrow")].find(x => x.dataset.chem === pid); if (!r) return;
            r.querySelector("input").value = Math.round(tot[pid] * 100) / 100; r.querySelector("select").value = "oz"; });
          calcChems(); document.getElementById("saveBtn").click();
        }
        msg.textContent = "Applied to every room in this section.";
      } catch (err) { console.error(err); msg.textContent = "Could not save: " + err.message; msg.classList.add("err"); }
      finally { btn.disabled = false; }
    });
  });

  /* ---- Send to customer: the job sheet as an updated quote, back to the customer to approve. ----
     It's its own quote (quotes/<new id>) with the SAME number (Q-1068), flagged fromJobSheet and
     revisionOf this job. Approving it books no day and builds no new job sheet; this job stays as
     it is. The job notes which revision is out under revision {id, total, status}. */
  const revBox = document.getElementById("revBox"), revBtn = document.getElementById("revBtn");
  const revLink = rid => new URL("quote.html?id=" + rid, location.href).href;
  const drawRev = (rv, accepted) => {
    if (!rv || !rv.id) { revBox.classList.remove("on"); return; }
    const link = revLink(rv.id), first = String(c.name || "").split(" ")[0];
    const body = "Hi" + (first ? " " + first : "") + ", here is your updated Khean & Clean quote " + (q.number || "") + ": " + link;
    const tel = String(c.phone || "").replace(/\D/g, "");
    revBox.innerHTML = (accepted
        ? '<b>Approved</b> by ' + esc(accepted.acceptedName || "the customer") + ' &middot; ' + money(accepted.total)
        : '<b>Updated quote ' + esc(q.number || "") + '</b> &middot; ' + money(rv.total) + ' &middot; in Estimates, waiting on approval') +
      /* Preview only: texting / emailing it is done from the Dashboard's Estimates. */
      '<div class="revacts"><a href="' + esc(link) + '" target="_blank" rel="noopener">Preview</a>' +
        (accepted ? '' : '<a href="./dashboard.html">Go to Estimates</a>') +
      '</div>';
    revBox.classList.add("on");
  };
  /* No status box on the job sheet: where the updated quote stands shows on the Dashboard and the contact page. */
  /* Ignore variance: keep the original quote price. Saved as the job sheet total that was ignored,
     so a later change on the job sheet brings the variance back. */
  const ignVarBtn = document.getElementById("ignVarBtn");
  if (ignVarBtn) ignVarBtn.addEventListener("click", async () => {
    const t = r2(cur.lines.reduce((a, l) => a + (Number(l.cost) || 0), 0) + cur.adj);
    ignVarBtn.disabled = true; ignVarBtn.textContent = "Saving…";
    try {
      await setDoc(doc(db, place, id), { varianceIgnored: t }, { merge: true });
      q.varianceIgnored = t;
      const vb = view.querySelector(".varbox"); if (vb) vb.remove();
    } catch (e) { console.error(e); ignVarBtn.disabled = false; ignVarBtn.textContent = "Ignore variance";
      revBox.innerHTML = '<span class="note err">Could not save: ' + esc(e.message) + '</span>'; revBox.classList.add("on"); }
  });
  if (revBtn) revBtn.addEventListener("click", async () => {
    revBtn.disabled = true; revBtn.textContent = "Saving…";
    try {
      /* On-site update -> Q-1068-R1, R2...: its own estimate that CARRIES THE JOB (same day, job sheet,
         rooms, photos, crew notes: everything on this record comes along). The first approved quote is
         kept inside it as originalQuote (shown on the contact page) and this record comes off Accepted.
         Still waiting on the customer (we're on R1 in quotes): R1 is updated in place, same link.
         Once R1 is approved, the next tap makes R2. */
      if (place !== "acceptedQuotes" && place !== "quotes") throw new Error("This job is already invoiced.");
      const inPlace = place === "quotes";
      /* Same id the whole way through (Accepted -> Estimates -> Accepted), so the customer's links never break.
         The version it replaces is kept inside it under originals (OG). */
      const rid = id;
      const revNo = inPlace ? (Number(q.revNo) || 1) : (Number(q.revNo) || 0) + 1;
      const base = String(q.baseNumber || q.number || "").replace(/-R\d+$/, "");
      const sub = r2(cur.lines.reduce((a, l) => a + (Number(l.cost) || 0), 0)), adj = r2(cur.adj), total = r2(sub + adj);
      /* Superseded versions, oldest first: shown as Q-1068OG, Q-1068OG2, OG3... (newest highest).
         A new update adds the approved quote it replaces; updating one still waiting adds nothing. */
      const prevOGs = Array.isArray(q.originals) ? q.originals : (q.originalQuote ? [q.originalQuote] : []);
      const snap = {
        number: base, status: "accepted", lines: q.lines || [], subtotal: q.subtotal ?? null,
        discount: q.discount || 0, discountLabel: q.discountLabel || "", total: q.total ?? null,
        acceptedName: q.acceptedName || "", acceptedAt: q.acceptedAt || null, termsAccepted: !!q.termsAccepted,
        createdAt: q.createdAt || null
      };
      const originals = inPlace ? prevOGs : prevOGs.concat([snap]);
      const orig = originals[0];   /* first original: what invoices and older pages read as originalQuote */
      const rev = { ...q };
      ["id", "revision", "revisionOf", "expiresAt", "trashedFrom", "trashedAt"].forEach(k => delete rev[k]);
      Object.assign(rev, {
        /* The live quote keeps the plain number (Q-1068); only superseded ones get OG labels. */
        type: "quote", status: "sent", fromJobSheet: true, revNo, baseNumber: base, number: base,
        /* Lines as the customer sees them: anything deleted on site left out. */
        /* (Not-billed lines and items, at $0, stay on the job sheet only.) */
        lines: JSON.parse(JSON.stringify(cur.lines)).filter(l => !isNotBilled(l))
          .map(l => ({ ...l, items: (l.items || []).filter(it => !it.removed && !isNotBilled(it)) })),
        subtotal: adj > 0 ? total : sub, discount: adj < 0 ? -adj : 0, discountLabel: q.discountLabel || "Discount", total,
        originalQuote: orig, originals,
        /* The job sheet as it stands, so R1 opens with the same rooms (and room ids, so photos stay matched). */
        onsite: { lines: JSON.parse(JSON.stringify(cur.lines)), subtotal: sub, total },
        /* Same day: these are on-site edits. Re-approval keeps it as is (no day picking). */
        scheduledDate: q.scheduledDate || "", scheduledTime: q.scheduledTime || "",
        keptDate: q.scheduledDate || "", keptTime: q.scheduledTime || "",
        acceptedName: "", acceptedAt: null, termsAccepted: false,
        date: new Date().toISOString().slice(0, 10), createdAt: inPlace ? (q.createdAt || serverTimestamp()) : serverTimestamp()
      });
      if (!orig) delete rev.originalQuote;   /* on-site estimate: nothing approved before it */
      await setDoc(doc(db, "quotes", rid), rev);
      /* Back to waiting on approval: the lead comes out of Trash into Leads as "Quoted, not hired",
         pointing at the updated quote. leadTrashed off, so approving it again trashes the lead again. */
      if (q.leadId && !inPlace) {
        try {
          if ((await getDoc(doc(db, "leads", q.leadId))).exists()) {
            await setDoc(doc(db, "leads", q.leadId), { trashed: false, trashedAt: null, status: "quoted", quoteId: rid, updatedAt: serverTimestamp() }, { merge: true });
            await setDoc(doc(db, "quotes", rid), { leadTrashed: false }, { merge: true });
          }
        } catch (e) { console.error("Lead back to Quoted " + q.leadId, e); }
      }
      /* Saved first; only then does the old record come off Accepted (it now lives inside the update). */
      if (!inPlace) await deleteDoc(doc(db, place, id));
      /* Straight to the Dashboard: preview, Text or Email it from Estimates. */
      location.href = "./dashboard.html";
      return;
    } catch (e) { console.error(e); revBox.innerHTML = '<span class="note err">Could not send: ' + esc(e.message) + '</span>'; revBox.classList.add("on"); }
    finally { revBtn.disabled = false; revBtn.textContent = "Resend estimate"; }
  });

  /* Whole job: same as the Dashboard's Copy job (estimator prefilled, same customer, new estimate). */
  const wholeJobBtn = document.getElementById("wholeJobBtn");
  if (wholeJobBtn) wholeJobBtn.addEventListener("click", () => {
    location.href = "./index.html?edit=" + encodeURIComponent(id) + "&from=" + encodeURIComponent(place) + "&copy=1";
  });
  /* Quote extras only: what was added at no charge (extras, warranty / re-clean rooms), at its real price,
     as a new on-site estimate for the same customer. Opens its job sheet: discount there, then Send estimate. */
  const extrasBtn = document.getElementById("extrasBtn");
  if (extrasBtn) extrasBtn.addEventListener("click", async () => {
    const lines = [];
    cur.lines.forEach(l => {
      const items = [], gr = it => Array.isArray(it.grayed) ? it.grayed : [];
      (l.items || []).forEach(it => {
        if (it.removed) return;
        if (it.extra && !gr(it).includes("item:")) {
          const x = JSON.parse(JSON.stringify(it)); x.cost = r2(Number(it.extraCost) || 0);
          ["extra", "extraCost", "grayed"].forEach(k => delete x[k]); items.push(x);
        }
        if (it.warranty) {
          const rooms = (it.rooms || []).filter(rm => !gr(it).includes(rm.id));
          if (!rooms.length) return;
          /* Priced at the line's package rate, else the rate of its priced rooms. */
          const T = TIERS[tierOf(l)] || {}, pr = (l.items || []).find(x => x.perSqft != null && !x.warranty);
          const rate = Number(T.sqft) || (pr ? Number(pr.perSqft) : 0) || 0;
          const rs = rooms.map(rm => ({ ...rm, cost: r2((Number(rm.sqft) || 0) * rate) }));
          const sq = rs.reduce((a, rm) => a + (Number(rm.sqft) || 0), 0);
          items.push({ label: (T.name || String(l.label || "Cleaning").split(/\s+[—-]\s+/)[0]) + " - " + sq.toLocaleString("en-US") + " sq ft @ $" + rate.toFixed(2) + "/sq ft",
            cost: r2(sq * rate), rooms: rs, perSqft: rate });
        }
      });
      if (items.length) lines.push({ key: l.key || "", label: String(l.label || "Service").split(/\s+[—-]\s+/)[0], cost: r2(items.reduce((a, x) => a + (Number(x.cost) || 0), 0)), items, addedOnSite: true });
    });
    if (!lines.length) { alert("No extras on this job yet. Add rooms or add-ons here first, or use Whole job."); return; }
    extrasBtn.disabled = true; extrasBtn.textContent = "Making\u2026";
    try {
      /* Same Q- numbers as the estimator (meta/counters.quote). */
      const n = await runTransaction(db, async tx => {
        const r = doc(db, "meta", "counters"), s = await tx.get(r);
        const next = (s.exists() && s.data().quote ? s.data().quote : 1000) + 1;
        tx.set(r, { quote: next }, { merge: true });
        return next;
      });
      const total = r2(lines.reduce((a, l) => a + l.cost, 0)), qRef = doc(collection(db, "quotes"));
      await setDoc(qRef, { number: "Q-" + n, type: "quote", status: "draft", fromJobSheet: true, onsiteEstimate: true,
        customer: q.customer || {}, customerId: q.customerId || "", extrasOf: id, extrasOfNumber: q.number || "",
        lines: [], subtotal: 0, total: 0,
        onsite: { lines, subtotal: total, total, discount: 0, updatedAt: serverTimestamp() },
        date: new Date().toISOString().slice(0, 10), createdAt: serverTimestamp() });
      location.href = "./job-sheet.html?id=" + encodeURIComponent(qRef.id);
    } catch (e) {
      console.error(e); alert("Couldn't make the extras quote: " + e.message);
      extrasBtn.disabled = false; extrasBtn.textContent = "Quote extras only";
    }
  });

  /* Save: ticks and crew notes go onto the quote, so they follow it into the invoice. */
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true; note.textContent = "Saving\u2026"; note.classList.remove("err");
    try {
      const keys = [...done];   /* old-style ticks kept as they were; Done now lives on each room page */
      await setDoc(doc(db, place, id), { jobSheet: { done: keys, crewNotes: document.getElementById("crewNotes").value.trim(),
        custNotes: document.getElementById("custNotes").value.trim(),
        headline: document.getElementById("headline").value.trim(),
        /* Chemicals only once the list has loaded, so a fast Save can't wipe what's already logged. */
        ...(chemReady ? (ch => ({ chemicals: ch, chemicalCost: Math.round(ch.reduce((a, c) => a + c.cost, 0) * 100) / 100 }))(readChems()) : {}),
        updatedAt: serverTimestamp() } }, { merge: true });
      note.textContent = "Saved.";
      /* The Summary's read-only copy follows what was just saved. */
      const cn = document.getElementById("crewNotes").value.trim();
      view.querySelector(".crewro").textContent = cn; view.querySelector(".crewbox").classList.toggle("empty", !cn);
      const hl = document.getElementById("headline").value.trim();
      view.querySelector(".headro").textContent = hl; view.querySelector(".headbox").classList.toggle("empty", !hl);
    } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
    finally { saveBtn.disabled = false; }
  });

  /* What the customer wrote on the quick quote form, plus our notes on them. */
  let lead = null, cust = null;
  try { if (q.leadId) { const s = await getDoc(doc(db, "leads", q.leadId)); if (s.exists()) lead = s.data(); } }
  catch (e) { console.error("lead", e); }
  try { if (q.customerId) { const s = await getDoc(doc(db, "customers", q.customerId)); if (s.exists()) cust = s.data(); } }
  catch (e) { console.error("customer", e); }
  /* The shared note on the quote (customer and us), if there is one. */
  let qnote = null;
  try { const s = await getDoc(doc(db, "quoteNotes", id)); if (s.exists()) qnote = s.data(); }
  catch (e) { console.error("quote note", e); }

  const notesEl = document.getElementById("notes");
  if (notesEl && notesEl.isConnected) {
    /* Only what a person typed: the "OK to text..." lines (kept saved in the background) and
       the website's automatic "Opened the estimator..." line are left out, and a note that's
       the same as one already shown (Quote notes copied from the customer's message) isn't repeated. */
    const seen = new Set();
    const clean = t => String(t || "").split("\n")
      .filter(s => !/^\s*OK to text( specials)?: (yes|no)\s*$/i.test(s) && !/^\s*Opened the estimator \(details only, no estimate yet\)\s*$/i.test(s))
      .join("\n").replace(/\n{3,}/g, "\n\n").trim();
    const note1 = (lab, t) => { const c = clean(t); if (!c || seen.has(c)) return ""; seen.add(c); return rrow(lab, c); };
    const html =
      note1("Note on the quote", qnote && qnote.text) +
      note1("From the customer", lead && lead.message) +
      note1("Lead notes", lead && lead.staffNotes) +
      /* Customer-profile notes stay on the customer's profile; the Job Sheet shows job notes only. */
      note1("Quote notes", q.notes);
    notesEl.innerHTML = html || '<div class="msg">No notes on file.</div>';
    /* Photos the customer sent: from the message box on their quote, and from the website estimate (their lead). */
    const custPaths = [...new Set(pathsOf({ photoPaths: [...((qnote && qnote.photoPaths) || []), ...((lead && lead.photoPaths) || [])] }))];
    const custUrls = [...((lead && Array.isArray(lead.photos)) ? lead.photos : [])].filter(u => typeof u === "string" && /^https:\/\//.test(u));
    if (custPaths.length || custUrls.length) {
      const urls = custUrls.concat((await Promise.all(custPaths.map(p =>
        getDownloadURL(ref(storage, p)).catch(e => { console.error("Customer photo " + p, e); return null; })))).filter(Boolean));
      if (urls.length && notesEl.isConnected) {
        if (!html) notesEl.innerHTML = "";
        notesEl.insertAdjacentHTML("beforeend", '<div class="rrow"><div class="rlab">Customer photos</div></div>' +
          '<div class="jpgrid">' + urls.map(u => '<div class="jpcell"><a href="' + esc(u) + '" class="pshot" data-full="' + esc(u) +
          '"><img src="' + esc(u) + '" alt="" loading="lazy"></a></div>').join("") + '</div>');
      }
    }
  }
  /* No autofilled photo section: room photos stay on each room's page; Job photos and
     Finishing photos are manual uploads only. */
}

document.getElementById("printBtn").addEventListener("click", () => window.print());

/* Download offline job sheet: puts this job, its room pages and the app files on the phone,
   so the sheet opens and saves with no service. Edits and photos sync once service is back. */
let offJob = null;
const offBtn = document.getElementById("offlineBtn");
offBtn.addEventListener("click", async () => {
  if (!offJob) return;
  if (!navigator.onLine) { offBtn.textContent = "Needs service to download"; return; }
  offBtn.disabled = true; offBtn.textContent = "Downloading…";
  try { await saveForOffline(); rememberJob({ ...offJob, at: Date.now() }); offBtn.textContent = "Ready offline ✓"; }
  catch (e) { console.error(e); offBtn.textContent = "Download failed — tap to retry"; }
  finally { offBtn.disabled = false; }
});

/* ---- Photo viewer: tap a photo to open, tap backdrop, X or Esc to close ---- */
(function () {
  const lb = document.createElement("div");
  lb.className = "lbox";
  lb.innerHTML = '<div class="lbox__fig"><button type="button" class="lbox__x" aria-label="Close">\u00d7</button><img alt=""></div>';
  document.body.appendChild(lb);
  const img = lb.querySelector("img");
  const close = () => { lb.classList.remove("on"); img.src = ""; };
  lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".lbox__x")) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("on")) close(); });
  document.addEventListener("click", e => {
    const a = e.target.closest(".pshot");
    if (!a) return;
    e.preventDefault();
    img.src = a.dataset.full;
    lb.classList.add("on");
  });
})();

/* Page lock. Not signed in -> login page, then back to this same sheet.
   Customer view (?view=customer, linked from their quote): no sign-in, read-only Summary. */
let started = false;
if (PUBLIC) { document.getElementById("authwait")?.remove(); started = true; show(); }
else onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=job-sheet.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; startOffline(storage); show(); }
});

/* Refresh: saves first (same as the Save button) when the sheet has loaded, then reloads.
   If the save fails it stays here with the error showing, so nothing typed is lost. */
document.getElementById("refreshBtn").addEventListener("click", async e => {
  const b = e.currentTarget, s = document.getElementById("saveBtn"), n = document.getElementById("note");
  b.disabled = true;
  if (s && !s.disabled) {
    b.textContent = "Saving…"; s.click();
    for (let i = 0; i < 50 && s.disabled; i++) await new Promise(r => setTimeout(r, 200));
    if (n && n.classList.contains("err")) { b.disabled = false; b.textContent = "Refresh"; return; }
  }
  location.reload();
});
</script>
