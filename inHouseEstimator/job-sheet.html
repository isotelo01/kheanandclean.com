<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Job Sheet &middot; Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Same look as approved-leads.html. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Playfair Display",Georgia,serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.new:disabled,.ghost:disabled{opacity:.6;cursor:default}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.panel h2{font:700 20px "Playfair Display",Georgia,serif;margin:24px 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.panel h2:first-child{margin-top:0}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.acctno{font:600 14px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
.cname{font-size:20px;font-weight:700}
.prow{font-size:17px;line-height:1.45}
.prow a{color:var(--navy);font-weight:600}
.meta{color:var(--muted);font-size:14px}
.rrow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:baseline;margin-bottom:8px}
@media(max-width:620px){.rrow{grid-template-columns:1fr;gap:2px}}
.rlab{font-size:13px;font-weight:600;color:var(--muted)}
.rval{font-size:16px;white-space:pre-wrap}
.svc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.svc__head{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:17px;margin-bottom:6px}
.svc__head .amt{color:var(--muted);font-weight:600;font-size:15px}
.chk{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid #eef0f4;cursor:pointer;font-size:16px}
.chk:first-of-type{border-top:0}
.chk input{width:24px;height:24px;flex:none;accent-color:var(--green)}
.chk.done span{text-decoration:line-through;color:var(--muted)}
.chk .open{margin-left:auto;flex:none;font:600 14px "Archivo";color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px;background:#fff}
@media print{.chk .open{display:none}}
/* One button per room / add-on; tap to open its page. A tick shows once it's marked done. */
.spot{display:flex;align-items:center;gap:12px;padding:12px 6px;border-top:1px solid #eef0f4;color:var(--ink);text-decoration:none;font-size:16px}
.svc__head + .spot{border-top:0}
.spot:hover{background:#f6f7fa}
.spot__tick{width:24px;height:24px;flex:none;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.spot.done .spot__tick{background:var(--green);border-color:var(--green)}
/* Done room: the After Threshold photo shows in place of the tick. */
.spot .spot__tick.thumb{width:44px;height:44px;border:0;border-radius:6px;background:#eef0f4 center/cover no-repeat}
.spot__name{font-weight:600}
.spot__size{color:var(--muted);font-size:14px}
.spot__go{margin-left:auto;color:var(--muted);font-size:22px;line-height:1}
/* On-site quote building: tap a line's header to open its rooms; add or delete rooms. */
button.svc__head{width:100%;background:none;border:0;padding:2px 0;margin:0;font:700 17px "Archivo";color:var(--ink);cursor:pointer;text-align:left;align-items:center}
.svc__head .amt{white-space:nowrap}
.svc__head .caret{display:inline-block;transition:transform .2s}
.svc.open .svc__head .caret{transform:rotate(180deg)}
.svc__body{display:none;margin-top:8px}
.svc.open .svc__body{display:block}
.srow{position:relative;overflow:hidden;border-top:1px solid #eef0f4;max-height:140px;transition:max-height .2s,opacity .2s}
.srow .spot{border-top:0;background:#fff;position:relative;z-index:1;transition:transform .2s}
.srow.swiped .spot{transform:translateX(-88px)}
.srow.gone{max-height:0;opacity:0}
.srow.gone .spot{transform:translateX(-100%)}
.sdel{position:absolute;right:0;top:0;bottom:0;width:88px;border:0;background:var(--red);color:#fff;font:600 15px "Archivo";cursor:pointer}
/* Desktop (mouse): a Delete button at the end of each room row instead of swiping. */
@media (hover:hover) and (pointer:fine){
  .srow{display:flex;align-items:center}
  .srow .spot{flex:1;min-width:0;order:1}
  .sdel{position:static;order:2;width:auto;flex:none;padding:6px 12px;margin-left:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--red)}
}
.addroom{margin:10px 0 6px}
/* Room table, same rows as the estimator's room picker. */
.rpick{margin-top:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rpick[hidden]{display:none}
.rprow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-top:1px solid #eef0f4;cursor:pointer}
.rprow:first-child{border-top:0}
.rpname{flex:1;min-width:0;font-weight:600;font-size:15px}
.rpcap{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.rpstep{display:flex;align-items:center;gap:4px;flex:none}
.rpstep button{width:34px;height:34px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:18px;line-height:1;cursor:pointer;color:var(--navy)}
.rpstep input{width:52px;text-align:center;font:16px "Archivo";padding:6px 4px;border:1px solid var(--line);border-radius:6px}
.rpfoot{display:flex;gap:10px;padding:10px;border-top:1px solid var(--line);background:#f6f7fa}
/* Service header row: the header (tap to open) and, on carpet, the + for add-ons. */
.svc__headrow{display:flex;align-items:center;gap:10px}
.svc__headrow .svc__head{flex:1;min-width:0}
.svc__plus{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--navy);color:#fff;font:600 22px/1 "Archivo";cursor:pointer}
.addonbox .rpick{margin:10px 0 4px}
.rpchk{width:26px;height:26px;accent-color:var(--green);cursor:pointer}
@media print{.svc__plus,.addonbox{display:none!important}}
.jtotal{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;font-weight:700;border-top:2px solid var(--navy);padding-top:10px;margin-top:4px}
@media print{.svc__body{display:block!important}.addroom,.sdel,.caret{display:none!important}}
.prog{font-size:14px;color:var(--muted);margin-bottom:10px}
textarea{display:block;width:100%;min-height:110px;resize:vertical;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px;color:var(--ink)}
.photos{border:2px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted);font-size:14px}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.pgrid a{display:block;border-radius:8px;overflow:hidden;background:#eef0f4}
.pgrid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.lbox{position:fixed;inset:0;z-index:1000;background:rgba(10,14,22,.92);display:none;align-items:center;justify-content:center;padding:24px}
.lbox.on{display:flex}
.lbox__fig{position:relative;display:inline-flex;max-width:95vw;max-height:90vh}
.lbox img{display:block;max-width:95vw;max-height:90vh;object-fit:contain;border-radius:6px}
.lbox__x{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:2px solid #fff;border-radius:50%;background:#1c2230;color:#fff;font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
.note{font-size:14px;color:var(--muted)}
.note.err{color:var(--red)}
/* Paper copy: no buttons, no shadows, photos smaller. */
@media print{
  body{background:#fff}
  .top>div,.actions,#saveRow{display:none!important}
  .panel{box-shadow:none;padding:0}
  .pgrid{grid-template-columns:repeat(4,1fr)}
  textarea{border:1px solid #999;min-height:140px}
}
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1 id="title">Job Sheet</h1>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <button type="button" class="ghost" id="printBtn">Print</button>
      <a class="ghost" id="backBtn" href="./approved-leads.html">Back</a>
    </div>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script src="pricing.js"></script><!-- room sizes and add-on prices, shared with the estimator -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const storage = getStorage(app);

const view = document.getElementById("view"), titleEl = document.getElementById("title");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const ms = t => !t ? 0 : typeof t.toMillis === "function" ? t.toMillis() : (Date.parse(t) || 0);
const shortDate = m => m ? new Date(m).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
const cityLine = c => [[c.city, c.state].filter(Boolean).join(", "), c.zip].filter(Boolean).join(" ");
const photosOf = x => (Array.isArray(x && x.photoUrls) ? x.photoUrls : []).filter(u => /^https:\/\//.test(String(u)));
const pathsOf = x => (Array.isArray(x && x.photoPaths) ? x.photoPaths : [])
  .filter(p => typeof p === "string" && p.startsWith("quick-quote-photos/") && !p.includes(".."));
const rrow = (lab, val) => val ? '<div class="rrow"><div class="rlab">' + lab + '</div><div class="rval">' + esc(val) + '</div></div>' : "";

/* The sheet is built from the quote itself, so it's ready the moment the quote
   is approved. It looks in Approved first, then Invoices / Paid, so the sheet
   still opens after the job is billed. */
const PLACES = ["acceptedQuotes", "invoices", "paidInvoices"];
/* login.html only takes a bare page name, so the job id is held here across sign-in. */
const ss = { get: k => { try { return sessionStorage.getItem(k) || ""; } catch (e) { return ""; } },
             set: (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} } };
const id = new URLSearchParams(location.search).get("id") || ss.get("kcJobSheetId");
if (id) ss.set("kcJobSheetId", id);

/* ---- On-site quote building: open a line, add or delete rooms, prices follow. ---- */
let cur = null;   /* { place, lines, quoted, adj } for the job on screen */
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
/* Which lines are open; kept for this job while the tab is open. */
const openKey = "kcOpenLines_" + id;
const openLines = new Set((ss.get(openKey) || "").split(",").filter(Boolean));
const saveOpen = () => ss.set(openKey, [...openLines].join(","));
/* Price per sq ft of a room item: from its label ("@ $0.50/sq ft"), else from its rooms. */
const rateOf = it => {
  const m = String(it.label || "").match(/@\s*\$([\d.]+)\s*\/\s*sq\s*ft/i); if (m) return Number(m[1]);
  const rm = (it.rooms || []).find(x => Number(x.sqft) > 0); return rm ? (Number(rm.cost) || 0) / Number(rm.sqft) : 0;
};
/* The quote's lines, copied for on-site use: grouped rooms split (Bedroom × 3 = Bedroom 1, 2, 3)
   and each room given the same id its photos were already saved under. */
function onsiteCopy(src){
  return JSON.parse(JSON.stringify(Array.isArray(src) ? src : [])).map((l, i) => {
    (Array.isArray(l.items) ? l.items : []).forEach((it, j) => {
      /* A sq-ft add-on already on the quote (e.g. Hair & debris removal) follows room changes too. */
      if (!Array.isArray(it.rooms) && it.addonPerSqft == null) {
        const a = CARPET_ADDONS.find(x => x.sqft != null && String(it.label || "").startsWith(x.name));
        if (a && (l.key || "carpet") === "carpet") { it.addonKey = a.key; it.addonPerSqft = a.sqft; }
      }
      if (!Array.isArray(it.rooms) || !it.rooms.length) return;
      it.perSqft = rateOf(it);
      let r = 0; const out = [];
      it.rooms.forEach(rm => { const n = Math.max(1, Number(rm.qty) || 1);
        for (let k = 1; k <= n; k++) out.push({ id: i + "-" + j + "-" + (r++), name: n > 1 ? rm.name + " " + k : String(rm.name || "Room"),
          sqft: Math.round((Number(rm.sqft) || 0) / n), qty: 1, cost: r2((Number(rm.cost) || 0) / n) }); });
      it.rooms = out;
    });
    return l;
  });
}
/* Reprice one line after a room change: each room at the item's rate, then the item's and the
   line's square feet and cost. Other parts of the line (stairs, rugs...) keep their price. */
function recalc(l){
  let delta = 0, lineSq = 0, any = false;
  (l.items || []).forEach(it => {
    if (it.perSqft == null) return; any = true;
    const old = Number(it.cost) || 0; let sq = 0, c = 0;
    it.rooms.forEach(rm => { rm.cost = r2((Number(rm.sqft) || 0) * it.perSqft); sq += Number(rm.sqft) || 0; c += rm.cost; });
    it.cost = r2(c); delta += it.cost - old; lineSq += sq;
    it.label = String(it.label || "").replace(/[\d,]+(\s*sq ft)/i, sq.toLocaleString("en-US") + "$1");
  });
  /* Sq-ft add-ons (hair & debris, deodorizer, stain protector) follow the carpet's sq ft. */
  if (any) (l.items || []).forEach(it => {
    if (it.addonPerSqft == null) return;
    const old = Number(it.cost) || 0; it.cost = r2(lineSq * it.addonPerSqft); delta += it.cost - old;
    it.label = String(it.label || "").replace(/[\d,]+(\s*sq ft)/i, lineSq.toLocaleString("en-US") + "$1");
  });
  if (any) { l.cost = r2((Number(l.cost) || 0) + delta); l.label = String(l.label || "").replace(/[\d,]+(\s*sq ft)/i, lineSq.toLocaleString("en-US") + "$1"); }
}
async function saveOnsite(){
  const sub = r2(cur.lines.reduce((a, l) => a + (Number(l.cost) || 0), 0));
  await setDoc(doc(db, cur.place, id), { onsite: { lines: cur.lines, subtotal: sub, total: r2(sub + cur.adj), updatedAt: serverTimestamp() } }, { merge: true });
}
const fail = e => { console.error(e); const n = document.getElementById("note"); if (n) { n.textContent = "Could not save: " + e.message; n.classList.add("err"); } };

/* Tap a line's header: open or close its rooms. */
view.addEventListener("click", e => {
  const h = e.target.closest("[data-toggle]"); if (!h) return;
  const box = h.closest(".svc"), k = h.dataset.toggle, on = !box.classList.contains("open");
  box.classList.toggle("open", on); h.setAttribute("aria-expanded", on);
  on ? openLines.add(k) : openLines.delete(k); saveOpen();
});
/* Rooms and prices come from pricing.js, the same file the estimator uses, so a size or price
   changed there changes here too. Flight of Stairs is left out of the room table: it's its
   own add-on on the job. */
const PRICING = window.KC_PRICING || { ROOM_TYPES: [], SERVICES: {} };
const ROOM_TYPES = PRICING.ROOM_TYPES.filter(rt => rt.key !== "stairs");
/* Carpet add-ons for the + on a carpet line (Stairs and Area Rugs are already on the job;
   Accelerated drying is part of the package). Priced by sq ft of the line's carpet, or per
   linear ft / room / spot with a count. */
const CARPET_ADDONS = ["hair", "deo", "prot", "filter", "stretch", "pet", "stain"]
  .map(k => ({ key: k, ...((PRICING.SERVICES.carpet || {}).addons || {})[k] })).filter(a => a.name);
const addonUnit = a => a.key === "filter" ? "linear ft" : a.key === "stretch" ? "room" : "spot";
const addonCaption = a => a.sqft != null ? "$" + a.sqft.toFixed(2) + " / sq ft of carpet"
  : (a.text || "$" + a.linear + " per " + addonUnit(a));
/* Tap anywhere outside an open room table: it closes and its counts clear (nothing is added). */
document.addEventListener("click", e => {
  document.querySelectorAll(".addroom").forEach(box => {
    const pick = box.querySelector(".rpick");
    if (!pick || pick.hidden || box.contains(e.target)) return;
    pick.hidden = true; pick.querySelectorAll(".rprow input").forEach(x => x.value = 0);
  });
});
/* Add room: open / close the room table; − / + or tap a row to count; Add room at the bottom saves. */
view.addEventListener("click", async e => {
  const box = e.target.closest(".addroom"); if (!box || !cur) return;
  const pick = box.querySelector(".rpick");
  if (e.target.closest("[data-pick]")) { pick.hidden = !pick.hidden; return; }
  if (e.target.closest("[data-rpcancel]")) { pick.hidden = true; pick.querySelectorAll(".rprow input").forEach(x => x.value = 0); return; }
  const row = e.target.closest(".rprow");
  if (row && !e.target.closest("input")) {
    const inp = row.querySelector("input"), st = Number(inp.step) || 1;
    inp.value = Math.max(0, (Number(inp.value) || 0) + (e.target.closest("[data-rpminus]") ? -st : st));
    return;
  }
  if (!e.target.closest("[data-rpadd]")) return;
  const i = Number(box.dataset.line), j = Number(box.dataset.item), it = cur.lines[i].items[j];
  if (it.perSqft == null) it.perSqft = rateOf(it);
  let added = 0;
  pick.querySelectorAll(".rprow").forEach(r => {
    const rt = ROOM_TYPES.find(x => x.key === r.dataset.rt), n = Math.max(0, Math.round(Number(r.querySelector("input").value) || 0));
    if (!rt || !n) return;
    const mk = (name, sqft) => { it.rooms.push({ id: i + "-" + j + "-n" + Date.now().toString(36) + (added++), name, sqft, qty: 1, cost: 0 }); };
    if (rt.key === "addSqft") { mk(rt.name, n); return; }
    /* Same room already on the job, or more than one: number them (Bedroom 2, Bedroom 3...). */
    const have = it.rooms.filter(x => x.name === rt.name || String(x.name).startsWith(rt.name + " ")).length;
    for (let k = 1; k <= n; k++) mk(have + n > 1 ? rt.name + " " + (have + k) : rt.name, rt.sqft);
  });
  if (!added) { pick.hidden = true; return; }
  recalc(cur.lines[i]); e.target.disabled = true;
  try { await saveOnsite(); show(); } catch (err) { fail(err); e.target.disabled = false; }
});
/* Carpet add-ons: + opens the table (tap outside to cancel); tick a sq-ft one, or count
   linear ft / rooms / spots; Add puts them on the line, priced from pricing.js. */
document.addEventListener("click", e => {
  document.querySelectorAll(".addonbox").forEach(box => {
    const pick = box.querySelector(".rpick");
    if (!pick || pick.hidden || box.contains(e.target) || e.target.closest('[data-addons="' + box.dataset.line + '"]')) return;
    pick.hidden = true;
    pick.querySelectorAll(".rprow input[type=number]").forEach(x => x.value = 0);
    pick.querySelectorAll(".rpchk").forEach(x => x.checked = false);
  });
});
view.addEventListener("click", async e => {
  const plusBtn = e.target.closest("[data-addons]");
  if (plusBtn) {
    const p = view.querySelector('.addonbox[data-line="' + plusBtn.dataset.addons + '"] .rpick');
    if (p) p.hidden = !p.hidden; return;
  }
  const box = e.target.closest(".addonbox"); if (!box || !cur) return;
  const pick = box.querySelector(".rpick");
  const row = e.target.closest(".rprow");
  if (row && !e.target.closest("input")) {
    const chk = row.querySelector(".rpchk");
    if (chk) { chk.checked = !chk.checked; return; }
    const inp = row.querySelector("input"), st = Number(inp.step) || 1;
    inp.value = Math.max(0, (Number(inp.value) || 0) + (e.target.closest("[data-rpminus]") ? -st : st));
    return;
  }
  if (!e.target.closest("[data-adadd]")) return;
  const i = Number(box.dataset.line), l = cur.lines[i];
  l.items = Array.isArray(l.items) ? l.items : [];
  /* The line's carpet sq ft (its rooms), which the sq-ft add-ons are priced on. */
  const lineSq = l.items.filter(it => Array.isArray(it.rooms)).reduce((s, it) => s + it.rooms.reduce((t, rm) => t + (Number(rm.sqft) || 0), 0), 0);
  let delta = 0, added = 0;
  pick.querySelectorAll(".rprow").forEach(r => {
    const a = CARPET_ADDONS.find(x => x.key === r.dataset.ak); if (!a) return;
    const have = l.items.find(it => it.addonKey === a.key);
    if (a.sqft != null) {
      if (!r.querySelector(".rpchk").checked || have) return;   /* already on the job: nothing to add */
      const cost = r2(lineSq * a.sqft);
      l.items.push({ label: a.name + " — " + lineSq.toLocaleString("en-US") + " sq ft", cost, addonKey: a.key, addonPerSqft: a.sqft });
      delta += cost; added++; return;
    }
    const n = Math.max(0, Number(r.querySelector("input").value) || 0); if (!n) return;
    const unit = addonUnit(a), it = have || { label: a.name, cost: 0, addonKey: a.key, addonRate: a.linear, qty: 0 };
    if (!have) l.items.push(it);
    const old = Number(it.cost) || 0;
    it.qty = (Number(it.qty) || 0) + n;
    it.cost = r2(it.qty * a.linear);
    it.label = a.name + " — " + it.qty.toLocaleString("en-US") + " " + unit + (it.qty === 1 || unit === "linear ft" ? "" : "s");
    delta += it.cost - old; added++;
  });
  if (!added) { pick.hidden = true; return; }
  l.cost = r2((Number(l.cost) || 0) + delta);
  e.target.disabled = true;
  try { await saveOnsite(); show(); } catch (err) { fail(err); e.target.disabled = false; }
});
/* Delete a room (its photos stay saved on the job, just no longer listed). */
async function delRoom(row){
  if (!cur || row.dataset.busy) return; row.dataset.busy = "1";
  const i = Number(row.dataset.line), j = Number(row.dataset.item), it = cur.lines[i].items[j];
  it.rooms = it.rooms.filter(rm => rm.id !== row.dataset.room);
  recalc(cur.lines[i]);
  row.classList.add("gone");   /* slides out */
  try { await saveOnsite(); setTimeout(show, 200); } catch (err) { fail(err); show(); }
}
view.addEventListener("click", e => { const b = e.target.closest("[data-del]"); if (b) { e.preventDefault(); delRoom(b.closest(".srow")); } });
/* Phones: swipe a room left to show Delete; swipe it most of the way to delete it straight off. */
let sw = null;
view.addEventListener("touchstart", e => {
  const row = e.target.closest(".srow"); if (!row || e.target.closest("[data-del]")) return;
  view.querySelectorAll(".srow.swiped").forEach(x => { if (x !== row) x.classList.remove("swiped"); });
  sw = { row, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, h: null, open: row.classList.contains("swiped") };
}, { passive: true });
view.addEventListener("touchmove", e => {
  if (!sw) return; const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
  if (sw.h == null && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) sw.h = Math.abs(dx) > Math.abs(dy);
  if (!sw.h) return;
  sw.dx = Math.min(0, dx + (sw.open ? -88 : 0));
  const a = sw.row.querySelector(".spot"); a.style.transition = "none"; a.style.transform = "translateX(" + sw.dx + "px)";
}, { passive: true });
view.addEventListener("touchend", () => {
  if (!sw) return; const { row, dx, h } = sw; sw = null; if (!h) return;
  const a = row.querySelector(".spot"); a.style.transition = ""; a.style.transform = "";
  if (dx < -row.offsetWidth * 0.6) delRoom(row);
  else row.classList.toggle("swiped", dx < -44);
  row.dataset.justSwiped = "1"; setTimeout(() => delete row.dataset.justSwiped, 350);
});
/* A tap right after a swipe, or on a row showing Delete, closes it instead of opening the room. */
view.addEventListener("click", e => {
  const a = e.target.closest(".srow .spot"); if (!a) return; const row = a.closest(".srow");
  if (row.dataset.justSwiped || row.classList.contains("swiped")) { e.preventDefault(); row.classList.remove("swiped"); }
});

async function show(){
  if (!id) { view.innerHTML = '<div class="msg">No job picked. <a href="./approved-leads.html">Go to Approved Leads</a></div>'; return; }
  let q = null, place = "";
  try {
    for (const p of PLACES) {
      const s = await getDoc(doc(db, p, id));
      if (s.exists()) { q = { id, ...s.data() }; place = p; break; }
    }
  } catch (e) { console.error(e); view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>'; return; }
  if (!q) { view.innerHTML = '<div class="msg">That job isn\u2019t on file. <a href="./approved-leads.html">Back to Approved Leads</a></div>'; return; }
  if (place === "acceptedQuotes") document.getElementById("backBtn").href = "./approved-leads.html#" + encodeURIComponent(id);

  const c = q.customer || {};
  const name = (c.business && c.name ? c.business + " \u2014 " + c.name : c.name || c.business) || "No name";
  titleEl.textContent = "Job Sheet";
  document.title = "Job Sheet \u00b7 " + name + " \u00b7 Khean & Clean";

  /* Saved progress lives on the quote under jobSheet. */
  const js = q.jobSheet || {};
  const done = new Set(Array.isArray(js.done) ? js.done : []);
  const addr = [c.street, cityLine(c)].filter(Boolean).join(", ");
  const tel = String(c.phone || "").replace(/\D/g, "");

  /* One section per service on the quote; its rooms/areas are the checklist.
     A service with no rooms listed is a single checkbox. */
  /* On-site edits (rooms added or deleted) live on the job under onsite.lines; the customer's
     approved quote (lines) is left as it was. Until the first edit, the quote's lines are used,
     with grouped rooms split one per room and each room given a fixed id, so photos and Done
     stay with the right room when others are added or deleted. */
  const lines = (q.onsite && Array.isArray(q.onsite.lines)) ? q.onsite.lines : onsiteCopy(q.lines);
  cur = { place, lines, quoted: Number(q.total) || 0, adj: (Number(q.total) || 0) - (Number(q.subtotal) || Number(q.total) || 0) };
  let total = 0;
  /* Every line opens its room page (job-room.html): the rooms one by one, no prices. */
  const roomLink = (i, j) => './job-room.html?id=' + encodeURIComponent(id) + '&line=' + i + (j == null ? '' : '&item=' + j);
  const box = (key, label, href) => { total++;
    return '<label class="chk' + (done.has(key) ? ' done' : '') + '"><input type="checkbox" data-k="' + esc(key) + '"' +
      (done.has(key) ? ' checked' : '') + '><span>' + esc(label) + '</span>' +
      (href ? '<a class="open" href="' + esc(href) + '">Open ›</a>' : '') + '</label>'; };
  /* Carpet package extras (stain protector, accelerated drying, deodorizer) aren't lines of
     their own here: they're checked off room by room on the room pages instead. */
  /* Carpet lines are named after the package ("Deep Cleaning — 800 sq ft"), so go by the
     line's service key, or the package names when an older quote has no key. */
  const isCarpet = l => /carpet/i.test(String(l.key || "")) ||
    /carpet|essential cleaning|deep cleaning|signature cleaning|quick dry|encapsulation/i.test(String(l.label || ""));
  const isExtra = it => /accelerated drying|deodori[sz]er|stain (protector|guard|repellent)|scotch ?gard/i.test(String(it.label || ""));
  /* Labels carry prices ("800 sq ft + $100", "@ $0.50/sq ft"); the sheet shows them without. */
  const noPrice = t => String(t || "").replace(/\s*@\s*\$[\d.,]+\s*\/\s*sq ft/i, "").replace(/\s*\+\s*\$[\d.,]+/g, "").replace(/\s*\$[\d.,]+/g, "").trim();
  /* Every room, and every add-on (stairs, pet odor, stain treatment), is its own button that
     opens its own page on job-room.html: photos, notes and Done for that spot, saved on the
     job under spots. Grouped rooms are split: Bedroom × 3 = Bedroom 1, 2 and 3. */
  const spots = (q.spots && typeof q.spots === "object") ? q.spots : {};
  let doneCount = 0;
  const spotLink = (i, j, r) => './job-room.html?id=' + encodeURIComponent(id) + '&line=' + i + (j == null ? '' : '&item=' + j) + (r == null ? '' : '&room=' + r);
  const spotRow = (key, label, size, href) => { total++;
    const d = !!(spots[key] && spots[key].done); if (d) doneCount++;
    /* Thumbnail: a room's After Threshold photo; stairs / rugs (no Threshold) use their first After photo. */
    const thr = d ? pathsOf({ photoPaths: [...((spots[key] && spots[key].photosAfterThreshold) || []), ...((spots[key] && spots[key].photosAfter) || [])] })[0] : "";
    return '<a class="spot' + (d ? ' done' : '') + '" href="' + esc(href) + '"><span class="spot__tick"' + (thr ? ' data-thumb="' + esc(thr) + '"' : '') + '>' + (d ? '✓' : '') + '</span>' +
      '<span class="spot__name">' + esc(label) + '</span>' + (size ? '<span class="spot__size">' + esc(size) + '</span>' : '') +
      '<span class="spot__go">›</span></a>'; };
  const itemRows = (it, i, j) => {
    const rms = Array.isArray(it.rooms) ? it.rooms : [];
    /* Area Rugs "Medium (5×8) × 2" = two rugs, each its own row and page. */
    const rug = !rms.length && /^Area Rugs\b/i.test(String(it.label || "")) && String(noPrice(it.label)).match(/^Area Rugs\s*—\s*(.+?)\s*×\s*(\d+)$/i);
    if (rug) { let out = ""; for (let r = 0; r < Number(rug[2]); r++) out += spotRow(i + "-" + j + "-" + r, "Area Rug " + (r + 1) + " — " + rug[1], "", spotLink(i, j, r)); return out; }
    if (!rms.length && it.perSqft == null) return spotRow(i + "-" + j, noPrice(it.label) || "Area", "", spotLink(i, j));
    /* Rooms: one row each, with Delete (a button on desktop, swipe left on phones), then Add room. */
    return rms.map((rm, r) =>
      '<div class="srow" data-line="' + i + '" data-item="' + j + '" data-room="' + esc(rm.id) + '">' +
        '<button type="button" class="sdel" data-del>Delete</button>' +
        spotRow(rm.id, rm.name, Number(rm.sqft) ? Number(rm.sqft).toLocaleString() + " sq ft" : "", spotLink(i, j, r)) +
      '</div>').join("") +
      /* Add room: opens the estimator's room table (same rooms and sizes, − / + counts). */
      '<div class="addroom" data-line="' + i + '" data-item="' + j + '">' +
        '<button type="button" class="new" data-pick>Add room</button>' +
        '<div class="rpick" hidden>' +
          ROOM_TYPES.map(rt =>
            '<div class="rprow" data-rt="' + rt.key + '">' +
              '<span class="rpname">' + esc(rt.name) + ' <span class="rpcap">' + esc(rt.sqft === 1 ? "sq ft, in 10s" : rt.sqft + " sq ft" + (rt.dims ? " (" + rt.dims + ")" : "")) + '</span></span>' +
              '<span class="rpstep"><button type="button" data-rpminus aria-label="Fewer">&minus;</button>' +
              '<input type="number" min="0" step="' + (rt.step || 1) + '" value="0" inputmode="numeric" aria-label="' + esc(rt.name) + '">' +
              '<button type="button" data-rpplus aria-label="More">+</button></span>' +
            '</div>').join("") +
          '<div class="rpfoot"><button type="button" class="new" data-rpadd>Add room</button></div>' +
        '</div>' +
      '</div>';
  };
  const sections = lines.map((l, i) => {
    const items = Array.isArray(l.items) ? l.items : [];
    const extras = isCarpet(l) ? items.filter(isExtra) : [];
    const shown = items.map((it, j) => [it, j]).filter(([it]) => !extras.includes(it));
    /* Header: "Carpet Deep Cleaning — 540 sq ft" and the line's price; tap it to open or close its rooms. */
    const nm = noPrice(l.label) || "Service";
    const head = isCarpet(l) && !/carpet/i.test(nm) ? "Carpet " + nm : nm;
    /* Residential carpet line: a + where the price was, opening the carpet add-ons table. */
    const plus = (l.key ? l.key === "carpet" : isCarpet(l)) && CARPET_ADDONS.length;
    return '<div class="svc' + (openLines.has(String(i)) ? ' open' : '') + '" data-line="' + i + '">' +
      '<div class="svc__headrow">' +
      '<button type="button" class="svc__head" data-toggle="' + i + '" aria-expanded="' + openLines.has(String(i)) + '">' +
        '<span>' + esc(head) + '</span><span class="amt">' + (plus ? '' : money(l.cost) + ' ') + '<span class="caret">▾</span></span></button>' +
      (plus ? '<button type="button" class="svc__plus" data-addons="' + i + '" aria-label="Add-ons">+</button>' : '') +
      '</div>' +
      (plus ? '<div class="addonbox" data-line="' + i + '"><div class="rpick" hidden>' +
        CARPET_ADDONS.map(a =>
          '<div class="rprow" data-ak="' + a.key + '">' +
            '<span class="rpname">' + esc(a.name) + ' <span class="rpcap">' + esc(addonCaption(a)) + '</span></span>' +
            (a.sqft != null
              ? '<span class="rpstep"><input type="checkbox" class="rpchk" aria-label="' + esc(a.name) + '"></span>'
              : '<span class="rpstep"><button type="button" data-rpminus aria-label="Fewer">&minus;</button>' +
                '<input type="number" min="0" step="' + (a.qtyStep || 1) + '" value="0" inputmode="numeric" aria-label="' + esc(a.name) + '">' +
                '<button type="button" data-rpplus aria-label="More">+</button></span>') +
          '</div>').join("") +
        '<div class="rpfoot"><button type="button" class="new" data-adadd>Add</button></div>' +
      '</div></div>' : '') +
      '<div class="svc__body">' +
      (shown.length ? shown.map(([it, j]) => itemRows(it, i, j)).join("") : spotRow(String(i), noPrice(l.label) || "Service", "", spotLink(i))) +
      (extras.length ? '<div class="meta" style="padding:6px 4px 0">In every room: ' +
        esc(extras.map(it => String(it.label).split(" — ")[0]).join(", ")) + ' (check off on each room page)</div>' : '') +
    '</div></div>';
  }).join("");
  const sub = lines.reduce((a, l) => a + (Number(l.cost) || 0), 0);
  const jtotal = '<div class="jtotal"><span>On-site total</span><b>' + money(sub + cur.adj) + '</b></div>' +
    '<div class="meta" style="text-align:right">Quoted ' + money(cur.quoted) + '</div>';

  view.innerHTML =
    '<div class="panel">' +
      '<div class="head"><h2 style="margin:0;border:0">Customer</h2>' +
        (q.acctNo ? '<span class="acctno">KC-' + esc(q.acctNo) + '</span>' : '') + '</div>' +
      '<div class="cname">' + esc(name) + '</div>' +
      (addr ? '<div class="prow"><a href="https://maps.google.com/?q=' + encodeURIComponent(addr) + '" target="_blank" rel="noopener">' + [c.street, cityLine(c)].filter(Boolean).map(esc).join('<br>') + '</a></div>' : '') +
      (tel ? '<div class="prow"><a href="tel:' + esc(tel) + '">' + esc(c.phone) + '</a></div>' : '') +
      (c.email ? '<div class="prow">' + esc(c.email) + '</div>' : '') +
      '<div class="meta" style="margin-top:6px">' + esc([q.number,
        ms(q.acceptedAt) ? "Approved " + shortDate(ms(q.acceptedAt)) : ""].filter(Boolean).join(" \u00b7 ")) + '</div>' +

      '<h2>Notes</h2><div id="notes">' + rrow("Quote notes", q.notes) + '<div class="msg">Loading&hellip;</div></div>' +

      '<h2>The job</h2>' +
      '<div class="prog" id="prog"></div>' +
      (sections || '<div class="msg">This quote has no line items.</div>') + (sections ? jtotal : '') +

      '<h2>Crew notes</h2>' +
      '<textarea id="crewNotes" placeholder="What you found on site, extra spots, anything for next time">' + esc(js.crewNotes || "") + '</textarea>' +
      '<div class="actions" id="saveRow"><button type="button" class="new" id="saveBtn">Save</button><span class="note" id="note"></span></div>' +

      '<h2>Photos</h2><div id="photos"><div class="msg">Loading photos&hellip;</div></div>' +
    '</div>';

  const prog = document.getElementById("prog"), note = document.getElementById("note");
  /* Done is marked on each room's own page; this just counts them. */
  prog.textContent = total ? doneCount + " of " + total + " done" : "";
  /* Swap each done room's tick for its After Threshold photo; the tick stays if the photo won't load. */
  view.querySelectorAll(".spot__tick[data-thumb]").forEach(t =>
    getDownloadURL(ref(storage, t.dataset.thumb)).then(u => {
      t.textContent = ""; t.classList.add("thumb"); t.style.backgroundImage = 'url("' + u + '")';
    }).catch(e => console.error("Thumb " + t.dataset.thumb, e)));
  document.getElementById("crewNotes").addEventListener("input", () => { note.textContent = "Not saved yet."; note.classList.remove("err"); });

  /* Save: ticks and crew notes go onto the quote, so they follow it into the invoice. */
  const saveBtn = document.getElementById("saveBtn");
  saveBtn.addEventListener("click", async () => {
    saveBtn.disabled = true; note.textContent = "Saving\u2026"; note.classList.remove("err");
    try {
      const keys = [...done];   /* old-style ticks kept as they were; Done now lives on each room page */
      await setDoc(doc(db, place, id), { jobSheet: { done: keys, crewNotes: document.getElementById("crewNotes").value.trim(),
        updatedAt: serverTimestamp() } }, { merge: true });
      note.textContent = "Saved.";
    } catch (e) { console.error(e); note.textContent = "Could not save: " + e.message; note.classList.add("err"); }
    finally { saveBtn.disabled = false; }
  });

  /* What the customer wrote on the quick quote form, plus our notes on them. */
  let lead = null, cust = null;
  try { if (q.leadId) { const s = await getDoc(doc(db, "leads", q.leadId)); if (s.exists()) lead = s.data(); } }
  catch (e) { console.error("lead", e); }
  try { if (q.customerId) { const s = await getDoc(doc(db, "customers", q.customerId)); if (s.exists()) cust = s.data(); } }
  catch (e) { console.error("customer", e); }
  /* The shared note on the quote (customer and us), if there is one. */
  let qnote = null;
  try { const s = await getDoc(doc(db, "quoteNotes", id)); if (s.exists()) qnote = s.data(); }
  catch (e) { console.error("quote note", e); }

  const notesEl = document.getElementById("notes");
  if (notesEl && notesEl.isConnected) {
    /* Only what a person typed: the "OK to text..." lines (kept saved in the background) and
       the website's automatic "Opened the estimator..." line are left out, and a note that's
       the same as one already shown (Quote notes copied from the customer's message) isn't repeated. */
    const seen = new Set();
    const clean = t => String(t || "").split("\n")
      .filter(s => !/^\s*OK to text( specials)?: (yes|no)\s*$/i.test(s) && !/^\s*Opened the estimator \(details only, no estimate yet\)\s*$/i.test(s))
      .join("\n").replace(/\n{3,}/g, "\n\n").trim();
    const note1 = (lab, t) => { const c = clean(t); if (!c || seen.has(c)) return ""; seen.add(c); return rrow(lab, c); };
    const html =
      note1("Note on the quote", qnote && qnote.text) +
      note1("From the customer", lead && lead.message) +
      note1("Lead notes", lead && lead.staffNotes) +
      /* Customer-profile notes stay on the customer's profile; the Job Sheet shows job notes only. */
      note1("Quote notes", q.notes);
    notesEl.innerHTML = html || '<div class="msg">No notes on file.</div>';
  }

  /* Quick-quote photos: links, or storage paths turned into links. */
  /* Plus the photos taken on each room's page. */
  const paths = [...new Set(pathsOf(lead).concat(pathsOf(cust), pathsOf(qnote), ...Object.values(spots).map(pathsOf)))];
  const fromPaths = await Promise.all(paths.map(p =>
    getDownloadURL(ref(storage, p)).catch(e => { console.error("Photo " + p, e); return null; })));
  const shots = [...new Set(photosOf(lead).concat(photosOf(cust), fromPaths.filter(Boolean)))];
  const pbox = document.getElementById("photos");
  if (!pbox || !pbox.isConnected) return;
  pbox.innerHTML = shots.length
    ? '<div class="pgrid">' + shots.map(u =>
        '<a href="' + esc(u) + '" class="pshot" data-full="' + esc(u) + '"><img src="' + esc(u) + '" alt="" loading="lazy"></a>').join("") + '</div>'
    : '<div class="photos">No photos on file.</div>';
}

document.getElementById("printBtn").addEventListener("click", () => window.print());

/* ---- Photo viewer: tap a photo to open, tap backdrop, X or Esc to close ---- */
(function () {
  const lb = document.createElement("div");
  lb.className = "lbox";
  lb.innerHTML = '<div class="lbox__fig"><button type="button" class="lbox__x" aria-label="Close">\u00d7</button><img alt=""></div>';
  document.body.appendChild(lb);
  const img = lb.querySelector("img");
  const close = () => { lb.classList.remove("on"); img.src = ""; };
  lb.addEventListener("click", e => { if (e.target === lb || e.target.closest(".lbox__x")) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && lb.classList.contains("on")) close(); });
  document.addEventListener("click", e => {
    const a = e.target.closest(".pshot");
    if (!a) return;
    e.preventDefault();
    img.src = a.dataset.full;
    lb.classList.add("on");
  });
})();

/* Page lock. Not signed in -> login page, then back to this same sheet. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=job-sheet.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; show(); }
});
