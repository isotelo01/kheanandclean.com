<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
.sheet{max-width:760px;margin:28px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(23,34,57,.08)}
.top{background:var(--navy);color:#fff;padding:26px 30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font:700 26px "Playfair Display",Georgia,serif;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:2px}
.contact{font-size:14px;color:#c9d0de;margin-top:6px}
.contact a{color:#fff}
.kind{text-align:right}
.kind .t{font:700 30px "Playfair Display",Georgia,serif;line-height:1}
.kind .n{color:var(--gold);font-weight:600;margin-top:6px}
.body{padding:26px 30px}
.meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.meta h3{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}
.meta p{margin:0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
.r{text-align:right}
.totals{margin-left:auto;max-width:280px;margin-top:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0}
.grand{font:700 22px "Playfair Display",Georgia,serif;border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.notes{background:#f7f8fa;border-left:4px solid var(--gold);padding:12px 16px;margin-top:22px;white-space:pre-wrap}
.status{display:inline-block;font-weight:700;padding:4px 12px;border-radius:20px;font-size:14px}
.status.paid,.status.accepted{background:#e5f2ec;color:var(--green)}
.status.unpaid{background:#fbe9e6;color:var(--red)}
.accept{margin-top:26px;border:2px solid var(--navy);border-radius:10px;padding:20px}
.accept h2{font:700 20px "Playfair Display",Georgia,serif;margin:0 0 6px}
.accept p{margin:0 0 12px;color:var(--muted)}
.accept form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:200px;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px}
button{font:700 16px "Archivo";background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 20px;cursor:pointer}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:14px;padding:8px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{padding:0 30px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.msg{padding:60px 30px;text-align:center;color:var(--muted)}
@media (max-width:560px){.top,.body,.foot{padding-left:18px;padding-right:18px}.kind{text-align:left}.sheet{margin:0;border-radius:0}}
@media print{body{background:#fff}.sheet{box-shadow:none;margin:0}.accept,.foot button{display:none}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="sheet" id="sheet"><div class="msg">Loading…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyDTjC9bvhtdf3xn7YtqZvjV2e17TaJiXP4",
  authDomain: "khean-estimator.firebaseapp.com",
  projectId: "khean-estimator",
  storageBucket: "khean-estimator.firebasestorage.app",
  messagingSenderId: "1090115579087",
  appId: "1:1090115579087:web:0633fd12df74548ef59bba"
}));

const PHONE = "(916) 767-2520", TEL = "+19167672520", EMAIL = "kheanandclean@gmail.com";
const sheet = document.getElementById("sheet");
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "";

const id = new URLSearchParams(location.search).get("id");

async function load(){
  if (!id) { sheet.innerHTML = `<div class="msg">This link is missing its code. Ask Khean &amp; Clean to resend it, or call ${PHONE}.</div>`; return; }
  let snap;
  try { snap = await getDoc(doc(db, "docs", id)); }
  catch (e) { sheet.innerHTML = `<div class="msg">This page couldn't load. Check your connection and refresh, or call ${PHONE}.</div>`; console.error(e); return; }
  if (!snap.exists()) { sheet.innerHTML = `<div class="msg">This link doesn't match a quote or invoice. Call ${PHONE} and we'll sort it out.</div>`; return; }
  render(snap.data());
}

function render(d){
  const isQuote = d.type === "quote";
  document.title = `${isQuote ? "Quote Q-" : "Invoice #"}${d.number} · Khean & Clean`;
  const c = d.client || {};
  let statusHtml = "";
  if (isQuote && (d.status === "accepted" || d.status === "invoiced"))
    statusHtml = `<span class="status accepted">Accepted${d.acceptedName ? " by " + esc(d.acceptedName) : ""}</span>`;
  if (!isQuote) statusHtml = d.status === "paid" ? `<span class="status paid">Paid</span>` : `<span class="status unpaid">Payment due</span>`;

  const canAccept = isQuote && (d.status === "draft" || d.status === "sent");

  sheet.innerHTML = `
    <div class="top">
      <div>
        <div class="brand">Khean &amp; Clean</div>
        <div class="contact">Folsom, CA<br><a href="tel:${TEL}">${PHONE}</a> · <a href="mailto:${EMAIL}">${EMAIL}</a></div>
      </div>
      <div class="kind"><div class="t">${isQuote ? "Quote" : "Invoice"}</div><div class="n">${isQuote ? "Q-" : "#"}${d.number}</div></div>
    </div>
    <div class="body">
      <div class="meta">
        <div><h3>Prepared for</h3><p><strong>${esc(c.name)}</strong>${c.address ? "<br>" + esc(c.address) : ""}${c.phone ? "<br>" + esc(c.phone) : ""}</p></div>
        <div class="r"><h3>Date</h3><p>${fmtDate(d.date)}</p>${statusHtml ? `<p style="margin-top:10px">${statusHtml}</p>` : ""}</div>
      </div>
      <table>
        <thead><tr><th>Service</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead>
        <tbody>${(d.items || []).map(i => `<tr><td>${esc(i.desc)}</td><td class="r">${i.qty}</td><td class="r">${money(i.price)}</td><td class="r">${money(i.qty * i.price)}</td></tr>`).join("")}</tbody>
      </table>
      <div class="totals">
        <div><span>Subtotal</span><span>${money(d.subtotal)}</span></div>
        ${d.tax ? `<div><span>Tax (${d.taxRate}%)</span><span>${money(d.tax)}</span></div>` : ""}
        <div class="grand"><span>Total</span><span>${money(d.total)}</span></div>
      </div>
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ""}
      ${canAccept ? `
      <div class="accept">
        <h2>Ready to book?</h2>
        <p>Type your name to accept this quote. We'll reach out to schedule.</p>
        <form id="acceptForm">
          <input id="acceptName" aria-label="Your full name" placeholder="Your full name" required autocomplete="name">
          <button type="submit">Accept quote</button>
        </form>
      </div>` : ""}
      ${!isQuote && d.status !== "paid" ? `<p style="margin-top:22px">Questions about this invoice or how to pay? Call or text <a href="tel:${TEL}">${PHONE}</a>.</p>` : ""}
    </div>
    <div class="foot"><span>Thank you for choosing Khean &amp; Clean.</span><button class="ghost" onclick="print()">Print or save as PDF</button></div>`;

  const form = document.getElementById("acceptForm");
  if (form) form.onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById("acceptName").value.trim();
    if (!name) return;
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Accepting…";
    try {
      await updateDoc(doc(db, "docs", id), { status: "accepted", acceptedName: name, acceptedAt: serverTimestamp() });
      render({ ...d, status: "accepted", acceptedName: name });
    } catch (err) {
      console.error(err); btn.disabled = false; btn.textContent = "Accept quote";
      alert(`That didn't go through. Try again, or call ${PHONE}.`);
    }
  };
}

load();
</script>
</body>
</html>
