<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K&amp;C Estimator">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Email &middot; Khean &amp; Clean</title>
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
/* Same look as texts.html. The Zoho mailbox (contact@, israel@ and the other alias all land here):
   folders, the message list, one message, and Reply / New email. Everything goes through the
   mailList / mailRead / mailMove / mailSend functions, which talk to Zoho. Nothing is stored in Firestore. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:1120px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
.nav a,.nav button{display:inline-flex;align-items:center;padding:10px 14px}
.nav [hidden]{display:none}
.nav .ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.ghost.danger{color:var(--red)}
.new:disabled,.ghost:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
.msg{color:var(--muted);font-size:15px;padding:10px 2px}
.msg.err{color:var(--red)}
:where(a,button,select,input,textarea):focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Folders */
.folders{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.folders a{font:600 14px "Archivo";text-decoration:none;color:var(--navy);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px}
.folders a.on{background:var(--navy);border-color:var(--navy);color:#fff}
.folders .n{display:inline-block;min-width:20px;margin-left:6px;border-radius:10px;background:var(--gold);color:var(--navy);font-size:12px;text-align:center;padding:0 6px}

/* The list: newest first. Gold edge + bold = unread. */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-decoration:none;color:inherit;background:#fff;
  border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:12px 16px;border-left:4px solid transparent}
.row:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
.row.unread{border-left-color:var(--gold)}
.who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .who,.row.unread .subj{font-weight:700}
.when{color:var(--muted);font-size:13px;white-space:nowrap;text-align:right}
.subj{grid-column:1/-1;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.unread .subj{color:var(--ink)}
.toaddr{color:var(--muted);font-size:12px;font-weight:500;margin-left:6px}
/* Which of our addresses it came to: a soft color per address, same color on its filter chip. */
.atag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:1px}
.aliases{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}
.achip{font:600 13px "Archivo";border:2px solid transparent;border-radius:999px;padding:5px 13px;cursor:pointer}
.achip.on{border-color:var(--navy)}
/* Each email is a card in its address's color: the email (tap to open) and a row of buttons under it. */
.rwrap{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);border-left:4px solid transparent;overflow:hidden}
.rwrap:hover{box-shadow:0 2px 12px rgba(23,34,57,.18)}
.rwrap.unread{border-left-color:var(--gold)}
.rwrap .row,.rwrap .row:hover{background:transparent;box-shadow:none;border-left:0;border-radius:0}
/* The buttons sit at the right end of the subject line. */
.rwrap{position:relative}
.rwrap .subj{padding-right:150px;align-self:center;min-height:32px;line-height:32px}
.racts{position:absolute;right:12px;bottom:12px;display:flex;gap:6px}
.racts button{font:600 14px "Archivo";background:rgba(255,255,255,.8);color:var(--navy);border:1px solid rgba(23,34,57,.2);border-radius:8px;padding:7px 14px;cursor:pointer}
.racts button.del{color:var(--red)}
.racts .ibtn{width:32px;height:32px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.racts .ibtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.racts .ibtn[data-act="ai"]{color:#b8860b}
.racts .ibtn[data-act="spam"]{color:#8a3b48}
.racts button:disabled{opacity:.6;cursor:default}
/* Spam check (asks first) and the little notice after something is done. */
.pv{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}
.pv>div{background:#fff;color:var(--ink);border-radius:10px;max-width:560px;width:100%;padding:18px}
.pv h3{font:700 19px "Archivo";margin:0 0 6px}
.pv ul{margin:8px 0;padding-left:18px;font-size:14px;color:var(--muted);max-height:220px;overflow:auto}
.pvacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:8px;padding:10px 16px;font-size:14px;z-index:60;max-width:92vw;box-shadow:0 4px 16px rgba(0,0,0,.25)}

/* One message */
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:16px}
.mhead{border-bottom:2px solid var(--gold);padding-bottom:10px;margin-bottom:12px}
.mhead h2{font:700 22px "Archivo",system-ui,sans-serif;margin:0 0 6px;overflow-wrap:anywhere}
.mmeta{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.mmeta b{color:var(--ink);font-weight:600}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.body{width:100%;min-height:360px;border:1px solid var(--line);border-radius:8px;background:#fff}
.plain{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.att{font-size:13px;color:var(--muted);margin-top:8px}

/* Compose */
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;font:15px "Archivo",system-ui,sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 11px}
.fld textarea{min-height:220px;resize:vertical;line-height:1.5}
@media (max-width:600px){ .wrap{padding:16px 12px 50px} h1{font-size:26px} .body{min-height:300px} }
</style>
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1>Email</h1>
    <div class="nav">
      <button type="button" class="ghost" id="refreshBtn" title="Refresh" aria-label="Refresh"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <a class="ghost" href="./texts.html" title="Texts" aria-label="Texts"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></a>
      <a class="new" id="newBtn" href="#new" title="New email" aria-label="New email"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></a>
    </div>
  </div>
  <nav class="folders" id="folders" aria-label="Folders"></nav>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
import { getStorage, ref as sRef, uploadBytes } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const fns = getFunctions(app, "us-central1");
const mailList = httpsCallable(fns, "mailList"), mailRead = httpsCallable(fns, "mailRead");
const mailMove = httpsCallable(fns, "mailMove"), mailSend = httpsCallable(fns, "mailSend");
const mailWith = httpsCallable(fns, "mailWith");
const mailAi = httpsCallable(fns, "mailAi", {timeout: 70000}), mailSpam = httpsCallable(fns, "mailSpam", {timeout: 130000});
const storage = getStorage(app);
/* Quick-attach docs: [key mailSend knows, button label, file name they'll see]. The files themselves are kept
   with the backend (functions/vendor-docs/), not on the public site. */
const mailDoc = httpsCallable(fns, "mailDoc");
const QUICK_DOCS = [["w9", "W-9", "W-9 - Khean & Clean LLC.pdf"], ["coi", "Insurance (COI)", "Certificate of Insurance - Khean & Clean LLC.pdf"],
  ["license", "Business license", "Business License - Khean & Clean LLC.jpg"], ["iicrc", "IICRC cert", "IICRC Certification - Israel Sotelo.pdf"]];
/* Attachments: uploaded to mail-out/<you>/ when you press Send; mailSend attaches them. 20 MB total, 10 files. */
const ATT_TOTAL = 20 * 1024 * 1024;
async function uploadMailFiles(files) {
  const uid = getAuth(app).currentUser.uid, out = [];
  for (let i = 0; i < files.length; i++) {
    const f = files[i], ext = ((f.name || "").split(".").pop() || "bin").replace(/[^a-z0-9]/gi, "").slice(0, 6).toLowerCase() || "bin";
    const p = "mail-out/" + uid + "/" + Date.now() + "_" + i + "." + ext;
    await uploadBytes(sRef(storage, p), f, {contentType: f.type || "application/octet-stream"});
    out.push({path: p, name: f.name || ("attachment." + ext)});
  }
  return out;
}

const FOLDERS = [["INBOX", "Inbox"], ["Sent", "Sent"], ["Spam", "Spam"], ["Archive", "Archive"], ["Receipts", "Receipts"], ["Trash", "Trash"]];
// Addresses he can send from. Any other @kheanandclean.com address a message was sent to gets added
// for that reply (the third alias), so replies go out from the address the customer wrote to.
const FROMS = ["israel@kheanandclean.com", "contact@kheanandclean.com"];
const OURS = a => /@kheanandclean\.com$/i.test(a) && !/^tydakhean@/i.test(a);
/* Soft colors for our addresses: [background, text]. israel@ and contact@ always get the first two. */
const ALIAS_COLORS = [["#dbe8f6", "#2b5c8a"], ["#dcefe3", "#2f6b45"], ["#f7dfe2", "#8a3b48"], ["#e9e1f5", "#5b468a"], ["#f6ead2", "#7a5a1c"]];
const aliasList = [...FROMS];
const aliasColor = a => { a = (a || "").toLowerCase(); if (!aliasList.includes(a)) aliasList.push(a);
  return ALIAS_COLORS[aliasList.indexOf(a) % ALIAS_COLORS.length]; };
const aliasTag = a => { const [bg, fg] = aliasColor(a);
  return '<span class="atag" style="background:' + bg + ';color:' + fg + '">' + esc(a.split("@")[0]) + '@</span>'; };
let aliasFilter = "";   // "" = All (what the page opens on)
let aiDraft = "";       // AI Response text waiting to go into Reply

const view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const who = a => a ? (a.name || a.address || "") : "";
const full = a => a ? (a.name ? a.name + " <" + a.address + ">" : a.address) : "";
const friendly = err => { const m = (err && err.message) || ""; return !m || /^internal$/i.test(m) ? "Something went wrong. Please try again." : m; };
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function whenShort(iso) {
  const d = new Date(iso); if (!iso || isNaN(d)) return "";
  if (sameDay(d, new Date())) return d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"});
  return d.toLocaleDateString([], {month: "short", day: "numeric", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric"});
}
const whenLong = iso => { const d = new Date(iso); return !iso || isNaN(d) ? "" : d.toLocaleString([], {dateStyle: "medium", timeStyle: "short"}); };

let cache = {};          // folder -> {messages, unseen}
let current = null;      // the message open right now (for Reply)
let folder = "INBOX";

function renderFolders() {
  document.getElementById("folders").innerHTML = FOLDERS.map(([k, label]) => {
    const n = k === "INBOX" && cache.INBOX ? cache.INBOX.unseen : 0;
    return '<a href="#' + k + '"' + (k === folder ? ' class="on"' : '') + '>' + label + (n ? '<span class="n">' + n + '</span>' : '') + '</a>';
  }).join("");
}

async function showList(f, force) {
  folder = f; current = null; renderFolders();
  if (!cache[f] || force) {
    view.innerHTML = '<div class="msg">Loading&hellip;</div>';
    try { cache[f] = (await mailList({folder: f})).data; }
    catch (e) { view.innerHTML = '<div class="msg err">' + esc(friendly(e)) + '</div>'; return; }
    renderFolders();
  }
  if (folder !== f) return;   // switched folders while it loaded
  const all = cache[f].messages || [];
  const sentLike = f === "Sent" || f === "Drafts";
  // Which of our addresses each one came to (Sent: which one it went out from).
  const ourOf = m => ((sentLike ? m.from : [...(m.to || []), ...(m.cc || [])]) || []).map(a => (a.address || "").toLowerCase()).find(OURS) || "";
  const here = [...new Set(all.map(ourOf).filter(Boolean))];
  here.forEach(aliasColor);   // gives every address its color, in a steady order
  if (aliasFilter && !here.includes(aliasFilter)) aliasFilter = "";
  const list = aliasFilter ? all.filter(m => ourOf(m) === aliasFilter) : all;
  const chips = here.length > 1 ? '<div class="aliases">' +
    '<button type="button" class="achip' + (aliasFilter ? '' : ' on') + '" data-alias="" style="background:#fff;color:var(--navy)">All</button>' +
    aliasList.filter(a => here.includes(a)).map(a => { const [bg, fg] = aliasColor(a);
      return '<button type="button" class="achip' + (aliasFilter === a ? ' on' : '') + '" data-alias="' + esc(a) + '" style="background:' + bg + ';color:' + fg + '">' +
        esc(a.split("@")[0]) + '@</button>'; }).join("") + '</div>' : '';
  if (!list.length) { view.innerHTML = chips + '<div class="msg">Nothing here.</div>'; return; }
  view.innerHTML = chips + '<div class="list">' + list.map(m => {
    const p = sentLike ? (m.to || [])[0] : (m.from || [])[0], ourTo = ourOf(m);
    const unread = !(m.seen || sentLike);
    return '<div class="rwrap' + (unread ? ' unread' : '') + '"' + (ourTo ? ' style="background:' + aliasColor(ourTo)[0] + '"' : '') + '>' +
      '<a class="row' + (unread ? ' unread' : '') + '" href="#' + f + '/' + m.uid + '">' +
      '<span class="who">' + (sentLike ? "To: " : "") + esc(who(p) || "(no sender)") + (ourTo ? aliasTag(ourTo) : '') + '</span>' +
      '<span class="when">' + esc(whenShort(m.date)) + '</span>' +
      '<span class="subj">' + esc(m.subject || "(no subject)") + '</span></a>' +
      '<div class="racts" data-uid="' + m.uid + '">' + rowButtons(f) + '</div></div>';
  }).join("") + '</div>';
  if (f === "INBOX" && !swept) sweepJunk();
}
/* The buttons under each email. Trash: just Move to Inbox. Sent: Delete and Archive. */
/* Round icon buttons: X in a circle = Delete, archive box = Archive, sparkle = AI Response, no sign = Spam. */
const ICONS = {
  del: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>',
  arch: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9M10 13h4"/></svg>',
  ai: '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z"/></svg>',
  spam: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>'
};
const iconBtn = (act, label, cls) => '<button type="button" class="ibtn' + (cls ? ' ' + cls : '') + '" data-act="' + act +
  '" title="' + label + '" aria-label="' + label + '">' + ICONS[act] + '</button>';
function rowButtons(f) {
  if (f === "Trash") return '<button type="button" data-act="inbox">Move to Inbox</button>';
  return iconBtn("del", "Delete", "del") +
    (f === "Archive" ? '' : iconBtn("arch", "Archive")) +
    (f === "Sent" ? '' : iconBtn("ai", "AI Response")) +
    (f === "Sent" || f === "Spam" ? '' : iconBtn("spam", "Spam"));
}
const toast = t => { const el = document.createElement("div"); el.className = "toast"; el.textContent = t;
  document.body.appendChild(el); setTimeout(() => el.remove(), 5000); };
/* Known junk (anything he has banned before) gets swept out of the Inbox once each time the page opens. */
let swept = false;
async function sweepJunk() {
  swept = true;
  try {
    const r = (await mailSpam({sweep: true})).data;
    if (r.moved) { toast("Moved " + r.moved + " junk email" + (r.moved === 1 ? "" : "s") + " to Spam."); delete cache.Spam;
      cache.INBOX = null; if (folder === "INBOX" && !current) showList("INBOX", true); }
  } catch (e) { /* quiet: the inbox still works */ }
}
/* Spam (AI): it decides junk / mailing list / real email and finds look-alikes. It asks the first few times;
   once he has confirmed a couple, a sure call (or junk he already banned) is done on its own. */
async function runSpam(f, uid, btn) {
  const label0 = btn.textContent; btn.disabled = true; btn.textContent = "Checking…";
  const done = r => {
    delete cache[f]; delete cache.Spam; delete cache.Trash;
    if (r.method === "link") { toast("This list only unsubscribes on their website. Opening it…"); window.open(r.link, "_blank", "noopener"); }
    else if (r.kind === "junk") toast((r.auto ? "Automatic: " : "") + "banned" + (r.label ? " “" + r.label + "”" : "") + ", " + r.moved + " email" + (r.moved === 1 ? "" : "s") + " moved to Spam.");
    else if (r.kind === "list") toast((r.auto ? "Automatic: " : "") + "unsubscribed" + (r.moved > 1 ? ", " + (r.moved - 1) + " more from them moved to Trash." : "."));
    if (location.hash.slice(1) === f) showList(f, true); else location.hash = f;
  };
  let r;
  try { r = (await mailSpam({folder: f, uid})).data; }
  catch (e) { btn.disabled = false; btn.textContent = label0; toast(friendly(e)); return; }
  btn.disabled = false; btn.textContent = label0;
  if (r.auto) { done(r); return; }
  const others = r.matches || [], froms = new Set(others.map(x => x.from).filter(Boolean));
  const pv = document.createElement("div"); pv.className = "pv";
  const lines = others.slice(0, 15).map(x => '<li>' + esc(x.from) + ' &mdash; ' + esc(x.subject || "(no subject)") + '</li>').join("") +
    (others.length > 15 ? '<li>and ' + (others.length - 15) + ' more</li>' : '');
  const head = r.kind === "junk" ? "Junk" : r.kind === "list" ? "Mailing list" : "Looks like a real email";
  pv.innerHTML = '<div><h3>' + head + (r.label ? ': ' + esc(r.label) : '') + '</h3>' +
    '<div class="msg" style="padding:0">' + esc(r.reason || "") + '</div>' +
    (others.length ? '<div style="margin-top:10px;font-weight:600">' + others.length + ' more like it' +
      (froms.size > 1 ? ' from ' + froms.size + ' different addresses' : '') + ':</div><ul>' + lines + '</ul>' : '') +
    '<div class="pvacts">' +
      (r.kind === "junk" ? '<button type="button" class="ghost" data-a="keep">Not junk</button>' +
          (others.length ? '<button type="button" class="ghost" data-a="junk1">Just this one</button>' : '') +
          '<button type="button" class="new" data-a="junkall">Ban' + (others.length ? ' all ' + (others.length + 1) : '') + '</button>'
        : r.kind === "list" ? '<button type="button" class="ghost" data-a="keep">Keep it</button>' +
          '<button type="button" class="new" data-a="listall">Unsubscribe' + (others.length ? ' + clear ' + others.length + ' more' : '') + '</button>'
        : '<button type="button" class="ghost" data-a="keep">Leave it</button><button type="button" class="ghost danger" data-a="junk1">Ban it anyway</button>') +
    '</div></div>';
  pv.addEventListener("click", async e => {
    if (e.target === pv) { pv.remove(); return; }
    const a = e.target.closest("[data-a]"); if (!a) return;
    const k = a.dataset.a, apply = k.startsWith("junk") ? "junk" : k.startsWith("list") ? "list" : "keep";
    const uids = k.endsWith("all") ? others.map(x => x.uid) : [];
    pv.querySelectorAll("button").forEach(b => b.disabled = true); a.textContent = "Working…";
    try { const res = (await mailSpam({folder: f, uid, apply, uids, label: r.label, phrase: r.phrase})).data; pv.remove();
      if (apply === "keep") toast("Got it, left alone. It'll remember that."); else done(res); }
    catch (x) { pv.remove(); toast(friendly(x)); }
  });
  document.body.appendChild(pv);
}
/* List clicks: an address chip filters; the buttons under each email work without opening it. */
let aiAfterOpen = false;
view.addEventListener("click", async e => {
  const chip = e.target.closest("[data-alias]");
  if (chip) { aliasFilter = chip.dataset.alias; showList(folder); return; }
  const b = e.target.closest(".racts [data-act]"); if (!b) return;
  const act = b.dataset.act, uid = Number(b.closest(".racts").dataset.uid), f = folder;
  if (act === "ai") { aiAfterOpen = true; location.hash = f + "/" + uid; return; }   // opens it, then writes the reply
  if (act === "spam") { runSpam(f, uid, b); return; }
  const to = act === "del" ? "Trash" : act === "arch" ? "Archive" : "INBOX";   // no "are you sure": it's all in Trash
  b.disabled = true;
  try {
    await mailMove({folder: f, uid, to});
    if (cache[f]) { const gone = cache[f].messages.find(x => x.uid === uid);
      cache[f].messages = cache[f].messages.filter(x => x.uid !== uid);
      if (f === "INBOX" && gone && !gone.seen && cache.INBOX.unseen) cache.INBOX.unseen--; }
    delete cache[to]; showList(f);
    toast(to === "Trash" ? "Moved to Trash." : to === "Archive" ? "Archived." : "Moved to Inbox.");
  } catch (err) { b.disabled = false; toast(friendly(err)); }
});

/* #with/<address>: every email from them (Inbox) and to them (Sent), newest first. From a customer's Email history. */

async function showMessage(f, uid) {
  folder = f; renderFolders();
  view.innerHTML = '<div class="msg">Opening&hellip;</div>';
  let m;
  try { m = (await mailRead({folder: f, uid})).data; }
  catch (e) { view.innerHTML = '<div class="msg err">' + esc(friendly(e)) + '</div>'; return; }
  current = m;
  const row = cache[f] && (cache[f].messages || []).find(x => x.uid === uid);   // it's read now
  if (row && !row.seen) { row.seen = true; if (f === "INBOX" && cache.INBOX.unseen) cache.INBOX.unseen--; renderFolders(); }
  const list = a => (a || []).map(full).join(", ");
  view.innerHTML = '<div class="panel">' +
    '<div class="mhead"><h2>' + esc(m.subject || "(no subject)") + '</h2>' +
      '<div class="mmeta"><b>From:</b> ' + esc(list(m.from)) + '</div>' +
      '<div class="mmeta"><b>To:</b> ' + esc(list(m.to)) + (m.cc && m.cc.length ? ' &nbsp; <b>Cc:</b> ' + esc(list(m.cc)) : '') + '</div>' +
      '<div class="mmeta">' + esc(whenLong(m.date)) + '</div></div>' +
    '<div class="acts"><a class="ghost" href="#' + f + '">&larr; ' + esc((FOLDERS.find(x => x[0] === f) || [, f])[1]) + '</a>' +
      (f === "Sent" ? '' : '<a class="new" href="#reply">Reply</a>') +
      (f === "Sent" ? '' : '<button type="button" class="ghost" id="aiBtn">AI Response</button>') +
      (f === "Sent" || f === "Trash" || f === "Spam" ? '' : '<button type="button" class="ghost" id="spamBtn">Spam</button>') +
      (f === "Trash" || f === "Archive" ? '' : '<button type="button" class="ghost" id="archBtn">Archive</button>') +
      (f === "Trash" ? '<button type="button" class="ghost" id="moveBtn" data-to="INBOX">Move to Inbox</button>'
        : '<button type="button" class="ghost danger" id="moveBtn" data-to="Trash">Delete</button>') + '</div>' +
    (m.html ? '<iframe class="body" id="mbody" title="Email" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>'
      : '<div class="plain">' + esc(m.text || "(empty)") + '</div>') +
    (m.attachments && m.attachments.length ? '<div class="att">Attachments (open in Zoho to download): ' +
      esc(m.attachments.map(a => a.name).join(", ")) + '</div>' : '') +
    '<p class="msg err" id="mErr" role="alert"></p></div>';
  const fr = document.getElementById("mbody");
  if (fr) {
    // No scripts ever run in here (no allow-scripts). Links open in a new tab.
    fr.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><base target="_blank">' +
      '<style>body{margin:12px;font:15px/1.5 Arial,Helvetica,sans-serif;color:#1c2230;overflow-wrap:anywhere}img{max-width:100%;height:auto}</style>' +
      '</head><body>' + m.html + '</body></html>';
    fr.addEventListener("load", () => {
      try { fr.style.height = Math.min(Math.max(fr.contentDocument.documentElement.scrollHeight + 20, 300), 6000) + "px"; } catch (e) { /* keep default */ }
    });
  }
  /* AI Response: drafts a reply and opens it in Reply to edit. Nothing is sent until you press Send. */
  document.getElementById("aiBtn")?.addEventListener("click", async e => {
    const b = e.currentTarget, er = document.getElementById("mErr");
    b.disabled = true; b.textContent = "Writing…"; er.textContent = "";
    try {
      const r = (await mailAi({folder: f, uid})).data;
      if (r.receipt) saveExpenseBox({...r.receipt, receiptPath: r.receiptPath || ""}, m, f);   // a receipt or bill: offer to save it as an expense
      else { aiDraft = r.reply || ""; location.hash = "reply"; }
    }
    catch (err) { er.textContent = friendly(err); }
    finally { b.disabled = false; b.textContent = "AI Response"; }
  });
  /* Spam (AI) and Archive, same as the buttons in the list. */
  document.getElementById("spamBtn")?.addEventListener("click", e => runSpam(f, uid, e.currentTarget));
  document.getElementById("archBtn")?.addEventListener("click", async e => {
    const b = e.currentTarget; b.disabled = true;
    try { await mailMove({folder: f, uid, to: "Archive"}); delete cache[f]; delete cache.Archive; toast("Archived."); location.hash = f; }
    catch (err) { b.disabled = false; document.getElementById("mErr").textContent = friendly(err); }
  });
  if (aiAfterOpen) { aiAfterOpen = false; document.getElementById("aiBtn")?.click(); }   // AI Response tapped in the list
  document.getElementById("moveBtn").addEventListener("click", async e => {
    const b = e.currentTarget, to = b.dataset.to;
    b.disabled = true;
    try {
      await mailMove({folder: f, uid, to});
      delete cache[f]; delete cache[to];
      location.hash = f;
    } catch (err) { b.disabled = false; document.getElementById("mErr").textContent = friendly(err); }
  });
}

/* Receipt or bill email + sparkle: the AI fills this in; Save puts it in Income & Expenses (the same "expenses"
   list the receipt scanner there uses), linked back to the email. Nothing saves until Save. */
const EXP_CATS = ["Supplies", "Chemicals", "Equipment", "Fuel", "Vehicle", "Insurance", "Marketing", "Software / subscriptions", "Repairs", "Other"];
const PAID_WITH = ["Card", "Cash", "Check", "Bank transfer", "Other"];
function saveExpenseBox(rc, m, f) {
  const today = new Date().toLocaleDateString("en-CA");
  const fld = (label, html) => '<label class="fld"><span>' + label + '</span>' + html + '</label>';
  const pv = document.createElement("div"); pv.className = "pv";
  pv.innerHTML = '<div><h3>Save as expense?</h3><div class="msg" style="padding:0 0 10px">Read from “' + esc(m.subject || "") + '”' +
      (rc.receiptPath ? ' (the PDF receipt is saved with it)' : '') + '. Check it, then Save.</div>' +
    fld("Date", '<input id="xDate" type="date" value="' + esc(rc.date || today) + '">') +
    fld("Vendor", '<input id="xVendor" type="text" value="' + esc(rc.vendor || "") + '">') +
    fld("Amount", '<input id="xAmount" type="number" step="0.01" min="0" inputmode="decimal" value="' + (rc.total ? rc.total.toFixed(2) : "") + '">') +
    fld("Category", '<select id="xCat">' + EXP_CATS.map(c => '<option' + (c === rc.category ? ' selected' : '') + '>' + esc(c) + '</option>').join("") + '</select>') +
    fld("Paid with", '<select id="xPaid">' + PAID_WITH.map(c => '<option>' + esc(c) + '</option>').join("") + '</select>') +
    fld("Invoice / order #", '<input id="xRef" type="text" value="' + esc(rc.ref || "") + '">') +
    fld("Notes", '<input id="xNotes" type="text" value="' + esc((rc.items || []).join(", ")) + '">') +
    '<p class="msg err" id="xErr"></p><div class="pvacts"><button type="button" class="ghost" data-x="close">Cancel</button>' +
    '<button type="button" class="new" data-x="save">Save</button></div></div>';
  pv.addEventListener("click", async e => {
    const x = e.target.closest("[data-x]");
    if (e.target === pv || (x && x.dataset.x === "close")) { pv.remove(); return; }
    if (!x) return;
    const v = id => pv.querySelector("#" + id).value.trim(), err = pv.querySelector("#xErr");
    const date = v("xDate"), vendor = v("xVendor"), amount = Math.round(parseFloat(v("xAmount")) * 100) / 100;
    if (!date || !vendor || !(amount > 0)) { err.textContent = "Date, vendor and amount are required."; return; }
    x.disabled = true; x.textContent = "Saving…";
    try {
      const u = getAuth(app).currentUser;
      await addDoc(collection(getFirestore(app), "expenses"), {
        date, month: date.slice(0, 7), vendor, amount, category: v("xCat"), paidWith: v("xPaid"),
        ref: v("xRef"), notes: v("xNotes"), receiptPath: rc.receiptPath || "",
        fromEmail: {folder: f, uid: m.uid, subject: m.subject || "", from: ((m.from || [])[0] || {}).address || "", messageId: m.messageId || ""},
        createdBy: u ? u.email || u.uid : "", createdAt: serverTimestamp()
      });
      pv.remove(); toast("Saved to Income & Expenses: " + vendor + " $" + amount.toFixed(2));
      // Saved receipts leave the inbox: the email goes to the Receipts folder.
      if (f !== "Receipts") {
        try { await mailMove({folder: f, uid: m.uid, to: "Receipts"}); delete cache[f]; delete cache.Receipts; location.hash = f; }
        catch (y) { toast("Saved, but couldn't move the email to Receipts: " + friendly(y)); }
      }
    } catch (y) { x.disabled = false; x.textContent = "Save"; err.textContent = "Could not save: " + friendly(y); }
  });
  document.body.appendChild(pv);
}

/* New email, or Reply to the open message. A reply goes out from the address the customer wrote to. */
function showCompose(reply, preTo) {
  renderFolders();
  const m = reply ? current : null;
  if (reply && !m) { location.hash = folder; return; }
  const froms = FROMS.slice();
  let fromPick = FROMS[0], to = preTo || "", subject = "", body = "";
  if (m) {
    const ours = [...(m.to || []), ...(m.cc || [])].map(a => (a.address || "").toLowerCase()).filter(OURS);
    ours.forEach(a => { if (!froms.includes(a)) froms.push(a); });
    if (ours.length) fromPick = ours[0];
    to = ((m.replyTo && m.replyTo[0]) || (m.from && m.from[0]) || {}).address || "";
    subject = /^re:/i.test(m.subject || "") ? m.subject : "Re: " + (m.subject || "");
    const quoted = String(m.text || "").trim().split("\n").slice(0, 200).map(l => "> " + l).join("\n");
    body = (aiDraft ? aiDraft.trim() + "\n" : "") + "\n\n\nOn " + whenLong(m.date) + ", " + full((m.from || [])[0]) + " wrote:\n" + quoted;
  }
  aiDraft = "";
  view.innerHTML = '<div class="panel"><div class="mhead"><h2>' + (m ? "Reply" : "New email") + '</h2></div>' +
    '<form id="cForm" novalidate>' +
      '<label class="fld"><span>From</span><select id="cFrom">' +
        froms.map(a => '<option value="' + esc(a) + '"' + (a === fromPick ? ' selected' : '') + '>' + esc(a) + '</option>').join("") + '</select></label>' +
      '<label class="fld"><span>To</span><input id="cTo" type="email" multiple autocomplete="email" value="' + esc(to) + '" placeholder="customer@example.com"></label>' +
      '<label class="fld"><span>CC</span><input id="cCc" type="email" multiple autocomplete="email" placeholder="optional, separate with commas"></label>' +
      '<label class="fld"><span>Subject</span><input id="cSubj" type="text" maxlength="300" value="' + esc(subject) + '"></label>' +
      '<label class="fld"><span>Message</span><textarea id="cBody">' + esc(body) + '</textarea></label>' +
      '<div id="cAtts" style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px"></div>' +
      /* Quick attach: tap to pick (turns blue), tap again to drop. The files live on the server, not here. */
      '<style>.dchip{border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;cursor:pointer}' +
        '.dchip[aria-pressed="true"]{background:#1f6fb2;border-color:#1f6fb2;color:#fff}' +
        '.pv{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 12px}' +
        '.pv>div{background:#fff;color:#111;border-radius:10px;max-width:640px;width:100%;padding:16px 18px}</style>' +
      '<div id="cDocs" style="display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px"><span style="font-size:13px;opacity:.75">Quick attach:</span>' +
        QUICK_DOCS.map(q => '<button type="button" class="dchip" data-doc="' + q[0] + '" aria-pressed="false">' + q[1] + '</button>').join("") + '</div>' +
      '<div class="acts"><button type="button" class="new" id="cPrev">Preview &amp; send</button>' +
        '<label class="ghost" style="cursor:pointer">Attach<input type="file" id="cFiles" multiple hidden></label>' +
        '<a class="ghost" href="#' + (m ? folder + "/" + m.uid : folder) + '">Cancel</a></div>' +
      '<p class="msg err" id="cErr" role="alert"></p>' +
    '</form></div>';
  const ta = document.getElementById("cBody");
  (to ? ta : document.getElementById("cTo")).focus();
  if (to) ta.setSelectionRange(0, 0);
  // Attachments picked so far: chips with the file name, x to remove.
  let files = [];
  const cAtts = document.getElementById("cAtts"), cFiles = document.getElementById("cFiles");
  const drawAtts = () => {
    cAtts.innerHTML = files.map((f, i) => '<span class="ghost" style="display:inline-flex;gap:6px;align-items:center;font-size:13px;max-width:100%">' +
      '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px">' + esc(f.name) + '</span>' +
      '<button type="button" data-x="' + i + '" aria-label="Remove" style="border:0;background:none;color:inherit;cursor:pointer;font-size:15px">&times;</button></span>').join("");
  };
  cFiles.addEventListener("change", () => { files = files.concat([...cFiles.files]).slice(0, 10); cFiles.value = ""; drawAtts(); });
  cAtts.addEventListener("click", e => { const x = e.target.closest("[data-x]"); if (x) { files.splice(+x.dataset.x, 1); drawAtts(); } });
  const pickedDocs = () => [...document.querySelectorAll("#cDocs [aria-pressed='true']")].map(b => b.dataset.doc);
  // Each quick doc is pulled from the server when its button is turned on (once), so the preview can open it.
  const docUrl = {};
  const pullDoc = k => docUrl[k] || (docUrl[k] = mailDoc({doc: k}).then(r => {
    const bytes = Uint8Array.from(atob(r.data.b64), c => c.charCodeAt(0));
    return URL.createObjectURL(new Blob([bytes], {type: r.data.type}));
  }).catch(x => { delete docUrl[k]; throw x; }));
  document.getElementById("cDocs").addEventListener("click", e => {
    const b = e.target.closest("[data-doc]"); if (!b) return;
    const on = b.getAttribute("aria-pressed") !== "true";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    if (on) pullDoc(b.dataset.doc).catch(() => {});
  });
  // Preview & send: the only way to send. Shows the email as they'll see it (same logo header the
  // server adds) with every attachment openable; Send is inside the preview.
  let approved = false;
  const openPreview = async () => {
    const v = id => document.getElementById(id).value.trim(), err = document.getElementById("cErr");
    if (!v("cTo")) { err.textContent = "Add who it's going to."; return; }
    if (!ta.value.trim()) { err.textContent = "Type a message first."; return; }
    err.textContent = "";
    let links;
    try {
      links = files.map(f => [f.name, URL.createObjectURL(f)]).concat(await Promise.all(pickedDocs().map(async k =>
        [(QUICK_DOCS.find(q => q[0] === k) || [, , k])[2], await pullDoc(k)])));
    } catch (x) { err.textContent = "Couldn't load an attachment. " + friendly(x); return; }
    const body = esc(ta.value).replace(/(https?:\/\/[^\s<]+|(?:[a-z0-9-]+\.)+(?:com|net|org)(?:\/[^\s<]*)?)/gi, '<a style="color:#1a56db">$1</a>');
    const pv = document.createElement("div"); pv.className = "pv";
    pv.innerHTML = '<div><div style="font-size:13px;color:#555;line-height:1.6;border-bottom:1px solid #ddd;padding-bottom:8px;margin-bottom:14px">' +
      '<b>From:</b> Israel Sotelo - Khean &amp; Clean &lt;' + esc(v("cFrom")) + '&gt;<br><b>To:</b> ' + esc(v("cTo")) +
      (v("cCc") ? '<br><b>CC:</b> ' + esc(v("cCc")) : '') + '<br><b>Subject:</b> ' + esc(v("cSubj")) + '</div>' +
      /* Same card the server sends: header-colored (#FEFEFE), rounded, thin gold border, black text, on cream. */
      '<div style="background:#f3f0ea;padding:16px 8px;border-radius:8px"><div style="max-width:680px;margin:0 auto;background:#FEFEFE;border:1px solid #e3d6b8;border-radius:12px">' +
        '<img src="https://kheanandclean.com/images/email-header-v2.jpg" alt="Khean &amp; Clean LLC" style="display:block;width:100%;height:auto;border-radius:12px 12px 0 0">' +
        '<div style="height:2px;background:#E3B64A;margin:0 28px"></div>' +
        '<div style="padding:22px 28px 28px;font:15px/1.55 Arial,Helvetica,sans-serif;color:#000;white-space:pre-wrap">' + body + '</div></div></div>' +
      '<div style="margin-top:16px;font-size:13px;color:#333;line-height:1.7"><b>Attached (' + links.length + '):</b> ' +
        (links.length ? links.map(l => '<a href="' + l[1] + '" target="_blank" rel="noopener" style="color:#1a56db">' + esc(l[0]) + '</a>').join(" &middot; ") : "nothing") +
        (links.length ? '<br><span style="color:#777">Tap a file to open it.</span>' : '') + '</div>' +
      '<div style="margin-top:16px;display:flex;gap:10px;justify-content:flex-end">' +
        '<button type="button" data-close style="background:none;border:1px solid #999;border-radius:999px;padding:9px 18px;cursor:pointer">Back to edit</button>' +
        '<button type="button" class="new" data-send>Send</button></div></div>';
    pv.addEventListener("click", e => {
      if (e.target.closest("[data-send]")) { approved = true; pv.remove(); document.getElementById("cForm").requestSubmit(); return; }
      if (e.target === pv || e.target.closest("[data-close]")) pv.remove();
    });
    document.body.appendChild(pv);
  };
  document.getElementById("cPrev").addEventListener("click", openPreview);
  document.getElementById("cForm").addEventListener("submit", async e => {
    e.preventDefault();
    if (!approved) { openPreview(); return; } // Enter key etc.: preview first, always
    approved = false;
    const btn = document.getElementById("cPrev"), err = document.getElementById("cErr");
    const data = {from: document.getElementById("cFrom").value, to: document.getElementById("cTo").value.trim(),
      cc: document.getElementById("cCc").value.trim(), docs: pickedDocs(),
      subject: document.getElementById("cSubj").value.trim(), text: ta.value};
    if (!data.to) { err.textContent = "Add who it's going to."; return; }
    if (!data.text.trim()) { err.textContent = "Type a message first."; return; }
    if (m && m.messageId) { data.inReplyTo = m.messageId; data.references = m.references || []; }
    btn.disabled = true; btn.textContent = "Sending\u2026"; err.textContent = "";
    if (files.reduce((n, f) => n + f.size, 0) > ATT_TOTAL) { btn.disabled = false; btn.textContent = "Preview & send"; err.textContent = "Attachments are too big (20 MB total max)."; return; }
    try {
      if (files.length) data.attachments = await uploadMailFiles(files);
      await mailSend(data);
      delete cache.Sent;
      view.innerHTML = '<div class="panel"><div class="msg">Sent \u2713 from ' + esc(data.from) + '</div>' +
        '<div class="acts"><a class="ghost" href="#' + folder + '">Back to ' + esc((FOLDERS.find(x => x[0] === folder) || [, "Inbox"])[1]) + '</a></div></div>';
    } catch (x) { btn.disabled = false; btn.textContent = "Preview & send"; err.textContent = friendly(x); }
  });
}

/* ---------- which screen ---------- */
const route = () => {
  const h = decodeURIComponent(location.hash.slice(1));
  document.getElementById("newBtn").hidden = h === "new" || h.startsWith("new/") || h === "reply";
  if (h === "new") return showCompose(false);
  if (h.startsWith("new/")) return showCompose(false, h.slice(4));   // #new/<address>: from a customer's or lead's email link
  if (h.startsWith("with/")) return showWith(h.slice(5));   // #with/<address>: a customer's Email history
  if (h === "reply") return showCompose(true);
  const [f, uid] = h.split("/");
  const fk = FOLDERS.some(x => x[0] === f) ? f : "INBOX";
  if (uid && /^\d+$/.test(uid)) return showMessage(fk, Number(uid));
  showList(fk);
};
document.getElementById("refreshBtn").addEventListener("click", () => { cache = {}; route(); });

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=email.html"); return; }
  document.getElementById("authwait")?.remove();
  /* Personal Emails (hub link: email.html?acct=personal). Same page and buttons; the Yahoo hookup comes next,
     once there's a Yahoo app password to plug in. */
  if (new URLSearchParams(location.search).get("acct") === "personal") {
    document.title = "Personal Email · Khean & Clean";
    document.querySelector("h1").textContent = "Personal Email";
    ["refreshBtn", "newBtn", "folders"].forEach(id => { const el = document.getElementById(id); if (el) el.hidden = true; });
    view.innerHTML = '<div class="panel"><div class="mhead"><h2>Yahoo isn’t plugged in yet</h2></div>' +
      '<div class="plain">This page will show your Yahoo inbox with the same Delete, Archive, AI Response and Spam buttons, ' +
      'kept separate from your business mail.\n\nTo plug it in:\n' +
      '1. Sign in at login.yahoo.com, open Account Info, then Account Security.\n' +
      '2. Tap “Generate app password” (or “Manage app passwords”), name it “Khean app” and copy the password it shows.\n' +
      '3. Tell Claude “Yahoo is ready” with your Yahoo address. Claude will give you one command to paste the password in safely, ' +
      'so it is never typed into a chat.</div>' +
      '<div class="acts"><a class="ghost" href="./email.html">Business email</a><a class="ghost" href="./hub.html">Hub</a></div></div>';
    return;
  }
  if (!started) { started = true; window.addEventListener("hashchange", route); route(); }
});
</script>
