<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border-radius:6px;padding:10px 18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar input{flex:1;min-width:200px;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.block{margin-bottom:30px}
.blockhead{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--gold);padding-bottom:6px;margin-bottom:12px}
.blockhead h2{font:700 20px "Archivo",system-ui,sans-serif;margin:0}
.blockhead .count{color:var(--muted);font-size:14px}
.blockhead .tot{margin-left:auto;font:700 17px "Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
.none{color:var(--muted);font-size:14px;padding:6px 2px}
.tab{font:600 14px "Archivo";background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:7px 15px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.sum{color:var(--muted);font-size:14px;margin-bottom:10px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
.trashbtn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 13px;font:600 15px "Archivo",system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.trashbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
/* Refresh: the arrow spins while it reloads, then shows a check for a moment. */
#refreshBtn.spin svg{animation:rspin .7s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
.trashbtn span{margin-left:6px;color:var(--muted);font-size:13px}
.trashbtn[aria-pressed="true"] span{color:#cfd6e4}
/* Top row: logo and icon buttons on one line. */
.top{flex-wrap:nowrap}
.ibar{display:flex;gap:6px;align-items:center;margin-left:auto;flex-wrap:nowrap}
.top .ibtn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:48px;height:50px;padding:0;border-radius:10px;flex:none}
.top .ibtn small{font:600 9.5px/1 "Archivo",sans-serif;white-space:nowrap;letter-spacing:-.1px}
.top .ibtn span{position:absolute;top:-6px;right:-6px;margin:0;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--gold);color:#172239!important;font:700 11px/18px "Archivo",sans-serif;text-align:center}
.top .ibtn span:empty{display:none}
.top .inew{background:var(--gold)!important;color:#172239!important;border-color:var(--gold)!important}
@media (max-width:400px){ .top{gap:8px} .top .home img{width:84px;height:84px} .ibar{gap:5px} .top .ibtn{width:46px;height:48px} }
.custbtn{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px}
.editbtn,.copyjob{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:4px 12px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer;margin-top:7px;margin-left:6px}
.editbtn:hover,.copyjob:hover{background:var(--navy);border-color:var(--navy);color:#fff}
/* Square Job sheet button on accepted estimates, centered in the card's open middle. */
.jsq{flex:none;margin:0 auto;width:62px;height:62px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--navy);font:700 12px/1.15 "Archivo",system-ui,sans-serif;cursor:pointer;text-align:center;padding:0}
.jsq:hover{background:var(--navy);border-color:var(--navy);color:#fff}
.restore{background:var(--green);color:#fff;border:0;border-radius:6px;padding:6px 13px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer;margin-top:7px}
.cardrow{display:flex;align-items:stretch;gap:10px;margin-bottom:10px}
.cardrow .card{flex:1;min-width:0;margin-bottom:0}
.card{position:relative;text-decoration:none;color:inherit;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:14px 46px 14px 16px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.del{position:absolute;top:9px;right:9px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted);font:700 14px/1 "Archivo",system-ui,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.del:hover{background:var(--red);border-color:var(--red);color:#fff}
.del[disabled]{opacity:.5;cursor:default}
.card:hover{box-shadow:0 2px 14px rgba(23,34,57,.16)}
.invbtn{flex:0 0 118px;background:var(--navy);color:#fff;border:0;border-radius:10px;padding:10px;font:700 16px "Archivo",system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 6px rgba(23,34,57,.08)}
.paidbtn{flex:0 0 118px;background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px;font:700 16px "Archivo",system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 6px rgba(23,34,57,.08)}
.paidbtn:hover{background:#0c7a50}
.paidbtn[disabled]{opacity:.55;cursor:default}
.invbtn:hover{background:#24324f}
.invbtn[disabled]{opacity:.55;cursor:default}
.textbtn,.mailbtn,.markbtn{background:#fff;color:var(--navy);border:1px solid var(--line);border-radius:6px;padding:4px 12px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer;margin-top:7px;margin-left:6px}
.textbtn:hover,.mailbtn:hover,.markbtn:hover{background:var(--navy);border-color:var(--navy);color:#fff}
/* Text choice: Business line (app) or My phone */
.textmenu,.markmenu,.editmenu{display:inline-flex;gap:6px;margin-left:6px;vertical-align:middle}
.textmenu button,.markmenu button,.editmenu button{background:var(--gold);color:var(--navy);border:0;border-radius:6px;padding:5px 11px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer;margin-top:7px}
.textmenu button[data-via="phone"]{background:#fff;border:1px solid var(--navy)}
.feebtn{display:block;margin:7px 0 0 auto;background:transparent;color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:4px 12px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer}
.feebtn.on{background:var(--gold);color:#0b0f17}
.feebtn[disabled]{opacity:.55;cursor:default}
.mailbtn.off,.mailbtn.off:hover{background:#fff;color:#b3b8c2;border-color:var(--line);cursor:default}
.who{font-weight:600}
.who[data-go]{cursor:pointer;display:inline-block}
.who[data-go]:hover{text-decoration:underline}
.meta{color:var(--muted);font-size:14px;margin-top:2px}
.card{padding-bottom:30px}
.meta.qnum{position:absolute;top:40px;right:8px;margin:0;font-size:12px;white-space:nowrap}
.meta.cdate{position:absolute;bottom:9px;right:12px;margin:0;font-size:12px;white-space:nowrap}
/* Estimation sheet: let the square widen so the label never spills out. */
.nameline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
/* Sheet button: one line, beside the name. */
.jsq{width:auto;height:auto;margin:0;padding:4px 10px;white-space:nowrap;font-size:13px;line-height:1.2;border-radius:6px}
/* Phones: status on its own line, then Edit, Text, Text Mentor, Email on one line. */
@media (max-width:520px){
  .right .status{display:block;width:fit-content}
  .right .editbtn,.right .textbtn,.right .markbtn,.right .mailbtn{margin-left:4px;padding:4px 9px}
  .right .status + .editbtn,.right .status + .restore{margin-left:0}
}
.right{text-align:right;margin-left:auto}
.amt{font:700 20px "Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
.status{display:inline-block;font-weight:700;padding:3px 11px;border-radius:20px;font-size:13px;margin-top:4px}
.status.sent,.status.draft{background:#eef1f6;color:var(--muted)}
.status.viewed{background:var(--gold,#E3B64A);color:#172239}
.status.accepted,.status.invoiced,.status.paid{background:#e5f2ec;color:var(--green)}
.status.expired,.status.declined{background:#fbe9e6;color:var(--red)}
.msg{background:#fff;border-radius:10px;padding:50px 20px;text-align:center;color:var(--muted)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:520px){.right{text-align:left;margin-left:0;width:100%}.cardrow{flex-wrap:wrap}.cardrow .card{flex:1 1 100%}.invbtn,.paidbtn{flex:1 1 100%;padding:13px}}
/* Red tile: the customer left a message on their quote page that hasn't been handled on Leads yet. */
.card.flag{background:#f8d7d2;box-shadow:0 0 0 2px var(--red)}
/* Royal purple card: an updated quote sent back from a job sheet for re-approval. A customer note (red) still wins. */
.card.rev:not(.flag){background:#3b1a6b;color:#fff;box-shadow:0 0 0 2px #6a3cb4}
.card.rev:not(.flag) .meta{color:#d8ccf2}
.flagnote{display:inline-block;margin-top:6px;background:var(--red);color:#fff;border:0;border-radius:6px;padding:4px 10px;font:600 13px "Archivo",system-ui,sans-serif;cursor:pointer;max-width:100%;text-align:left;white-space:normal}
.flagnote.mine{background:#eef1f6;color:var(--navy)}
/* Note editor (opens from the chip on a tile). */
.nmodal{position:fixed;inset:0;z-index:50;background:rgba(10,14,22,.55);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow:auto}
.nbox{background:#fff;border-radius:12px;max-width:560px;width:100%;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.nhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.nhead strong{font-size:17px}
.nx{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 18px/1 "Archivo",system-ui,sans-serif;cursor:pointer;padding:0}
.nwho{color:var(--muted);font-size:14px;margin:0 0 10px}
.nbox textarea{display:block;width:100%;min-height:130px;resize:vertical;font:16px/1.45 "Archivo",system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;color:var(--ink)}
.ngrid{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.ngrid:empty{display:none}
.nshot{position:relative;width:88px;height:88px}
.nshot a,.nshot img{display:block;width:100%;height:100%;object-fit:cover;border-radius:6px;background:#eef0f4}
.nshot button{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:#fff;font:700 14px/1 "Archivo",system-ui,sans-serif;cursor:pointer;padding:0}
.nact{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.nsave{font:600 15px "Archivo";background:var(--navy);color:#fff;border:0;border-radius:6px;padding:9px 18px;cursor:pointer}
.nclear{font:600 15px "Archivo";background:#fff;color:var(--red);border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer}
.nsave[disabled],.nclear[disabled]{opacity:.6;cursor:default}
.nstat{font-size:14px;color:var(--muted)}
.nhint{font-size:13px;color:var(--muted);margin:10px 0 0}
</style>
<style id="authwait">body{visibility:hidden}</style>

<body>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <!-- Top row: logo, then icon buttons (labels show on long-press / hover). -->
    <div class="ibar">
      <button type="button" id="refreshBtn" class="trashbtn ibtn" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg><small>Refresh</small></button>
      <button type="button" id="trashToggle" class="trashbtn ibtn" aria-pressed="false" title="Trash" aria-label="Trash"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6l-1 14H6L5 6"/><path d="M9 6V4h6v2"/><path d="M10 11v6M14 11v6"/></svg><small>Trash</small><span id="trashCount"></span></button>
      <a class="custbtn ibtn" href="./leads.html" title="Leads" aria-label="Leads"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M19 8v6M16 11h6"/></svg><small>Leads</small></a>
      <a class="custbtn ibtn" href="./approved-leads.html" title="Approved" aria-label="Approved"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><small>Approved</small></a>
      <a class="custbtn ibtn mhide" href="./customers.html" title="Customers" aria-label="Customers"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1"/><path d="M16 4a4 4 0 0 1 0 8M22 21v-1a5 5 0 0 0-3-4.6"/></svg><small>Customers</small></a>
      <a class="custbtn ibtn mhide" href="./expenses.html" title="Income &amp; Expenses" aria-label="Income and Expenses"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20"/><path d="M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg><small>Income</small></a>
      <a class="new ibtn inew" href="./index.html" title="New estimate" aria-label="New estimate"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><small>New</small></a>
    </div>
  </div>
  <div id="board"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp, getApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, where,
         doc, getDoc, setDoc, deleteDoc, runTransaction, serverTimestamp, updateDoc }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getStorage, ref as sRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
}));

const boardEl = document.getElementById("board"), sumEl = document.getElementById("sum"), qEl = document.getElementById("q");
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const when = ts => {
  if (!ts || !ts.toDate) return "";
  const d = ts.toDate(), days = Math.floor((Date.now() - d) / 864e5);
  if (days === 0) return "Today";
  if (days === 1) return "Yesterday";
  if (days < 7) return days + " days ago";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
};

/* An unapproved quote past its expiresAt reads as expired, whatever the stored status says. */
const stateOf = d => {
  const open = d.status === "sent" || d.status === "draft";
  if (open && d.expiresAt && d.expiresAt.toDate && d.expiresAt.toDate() < new Date()) return "expired";
  return d.status || "sent";
};
const LABEL = { sent:"Awaiting reply", draft:"Draft", accepted:"Accepted", invoiced:"Invoiced", paid:"Paid", declined:"Declined", expired:"Expired" };

const SECTIONS = [
  { key: "quotes",         title: "Estimates",          empty: "No estimates yet. Build one and hit Send Estimate &mdash; it will show up here." },
  { key: "acceptedQuotes", title: "Accepted Estimates", empty: "Nothing accepted yet." },
  { key: "invoices",       title: "Invoices",           empty: "No invoices yet." },
  { key: "paidInvoices",   title: "Paid Invoices",      empty: "No paid invoices this month yet." }
];

const TRASH_SECTION = [{ key: "trash", title: "Trash", empty: "Trash is empty." }];
let showTrash = false;
const viewSections = () => showTrash ? TRASH_SECTION : SECTIONS;

/* All four lists are on screen at once; data[key] holds each one's rows. */
const data = {};
let loaded = false;
/* quoteId -> the shared note on that quote (quoteNotes). Red when the customer changed it last. */
const flags = {};
const storage = getStorage(db.app);
const notePreview = n => { const t = String(n.text || "").trim(), k = (n.photoPaths || []).length;
  return t ? (t.length > 90 ? t.slice(0, 90) + "\u2026" : t) : k + " photo" + (k === 1 ? "" : "s"); };

const kindOf = r => (r.source === "invoices" || r.source === "paidInvoices") ? "invoice" : "estimate";

/* Customer name: customer profile if they're a customer, otherwise their lead page. */
const personHref = r => r.custId ? "./customers.html#" + encodeURIComponent(r.custId)
                      : r.leadId ? "./leads.html#" + encodeURIComponent(r.leadId) : "";
document.addEventListener("click", e => {
  const jd = e.target.closest("[data-jd]");
  if (!jd) return;
  e.preventDefault(); e.stopPropagation();
  location.href = "./job-data.html?id=" + encodeURIComponent(jd.dataset.jd);
}, true);
document.addEventListener("click", e => {
  const p = e.target.closest(".who[data-go]");
  if (!p) return;
  e.preventDefault(); e.stopPropagation();
  location.href = p.dataset.go;
}, true);

const card = r =>
  '<div class="cardrow">' +
  '<a class="card' + (r.source !== "trash" && flags[r.id] && flags[r.id].by === "customer" ? ' flag' : '') +
    /* Purple: an on-site update (Q-1068-R1...) waiting on the customer's re-approval. */
    (r.revisionOf || (r.fromJobSheet && r.source === "quotes") ? ' rev' : '') + '" href="./quote.html?id=' + encodeURIComponent(r.id) + '">' +
    '<div>' +
      /* Name line: the customer's name, with the sheet button right beside it. */
      '<div class="nameline">' +
      '<div class="who"' + (personHref(r) ? ' data-go="' + esc(personHref(r)) + '" title="Open profile"' : '') + '>' + esc(r.name || "No name") + '</div>' +
      (r.source === "acceptedQuotes" || r.source === "quotes" ? '<button type="button" class="jsq" data-js="' + esc(r.id) + '">' + (r.source === "quotes" ? 'Estimation sheet' : 'Job sheet') + '</button>' : '') +
      (r.source === "paidInvoices" ? '<button type="button" class="jsq" data-jd="' + esc(r.id) + '">Job data</button>' : '') +
      '</div>' +
      /* Phone under the name; quote number sits under the X (top right), the day in the bottom right. */
      (r.phone ? '<div class="meta">' + esc(r.phone) + '</div>' : '') +
      '<span class="meta qnum">' + esc(r.number) + '</span>' +
      (r.date ? '<span class="meta cdate">' + esc(r.date) + '</span>' : '') +
      (r.source === "trash" && trashLeftLabel(r) ? '<div class="meta">' + esc(trashLeftLabel(r)) + '</div>' : '') +
      (r.source !== "trash" && flags[r.id]
        ? '<button type="button" class="flagnote' + (flags[r.id].by === "customer" ? '' : ' mine') + '" data-note="' + esc(r.id) + '" title="Open note">&#128172; ' +
            esc(notePreview(flags[r.id])) + '</button>'
        : '') +
    '</div>' +
    /* Accepted estimates: a square Job sheet button in the open middle of the card. */
    /* Paid invoices: the same square opens Job Data (drive, miles, time on site, sq ft, chemicals). */
    '<div class="right">' +
      '<div class="amt">' + money(r.total) + '</div>' +

/* Paid Invoices shows only this month; older ones stay in Firestore, customer history, and Income & Expenses. */
const tsMs = t => t && typeof t.toMillis === "function" ? t.toMillis() : (t ? new Date(t).getTime() : 0);
const NOW = new Date();
const MONTH_NAME = NOW.toLocaleString("en-US", { month: "long" });
const thisMonth = r => { const d = new Date(tsMs(r.paidAt) || tsMs(r.createdAt)); return d.getFullYear() === NOW.getFullYear() && d.getMonth() === NOW.getMonth(); };

/* Trash keeps things 30 days, then erases them for good (same rule as Leads).
   There's no manual erase button; the sweep runs each time the Dashboard loads. */
const TRASH_DAYS = 30;
const trashDaysLeft = r => { const t = tsMs(r.trashedAt); return t ? TRASH_DAYS - Math.floor((Date.now() - t) / 864e5) : null; };
const trashLeftLabel = r => { const d = trashDaysLeft(r); return d === null ? "" : d <= 1 ? "Erased tomorrow" : "Erased in " + d + " days"; };
async function purgeTrash(rows){
  const keep = [];
  for (const r of rows) {
    const d = trashDaysLeft(r);
    if (d !== null && d <= 0) {
      try { await deleteDoc(doc(db, "trash", r.id)); continue; }
      catch (e) { console.error("Could not erase trash " + r.id, e); }
    }
    keep.push(r);
  }
  return keep;
}

function render(){
  if (!loaded) return;
  const term = (qEl ? qEl.value : "").trim().toLowerCase();
  const match = r => !term || (r.name + " " + r.phone + " " + r.number).toLowerCase().includes(term);

  let grand = 0, anyRows = 0, anyShown = 0;

  boardEl.innerHTML = viewSections().map(s => {
    const all = s.key === "paidInvoices" ? (data[s.key] || []).filter(thisMonth) : (data[s.key] || []), shown = all.filter(match);
    const title = s.key === "paidInvoices" ? MONTH_NAME + "'s Paid Invoices" : s.title;
    const sum = shown.reduce((a, r) => a + (Number(r.total) || 0), 0);
    grand += sum; anyRows += all.length; anyShown += shown.length;

    const count = term ? shown.length + " of " + all.length : String(all.length);
    const body = !all.length ? '<div class="none">' + s.empty + '</div>'
               : !shown.length ? '<div class="none">Nothing here matches that.</div>'
               : shown.map(card).join("");

    return '<div class="block">' +
      '<div class="blockhead"><h2>' + title + '</h2><span class="count">' + count + '</span>' +
      (shown.length ? '<span class="tot">' + money(sum) + '</span>' : '') + '</div>' +
      body + '</div>';
  }).join("");

  if (sumEl) sumEl.innerHTML = term
    ? anyShown + " of " + anyRows + " matching &ldquo;" + esc(qEl.value.trim()) + "&rdquo; &middot; " + money(grand)
    : anyRows + " total &middot; " + money(grand);
}

async function grab(name){
  const snap = await getDocs(query(collection(db, name), orderBy("createdAt", "desc"), limit(200)));
  /* Updated quotes added from a job sheet (revisionOf) show under Estimates while they wait for
     approval; once approved they belong to the job, so they're left off Accepted and the rest. */
  return snap.docs.filter(s => name === "quotes" || !s.data().revisionOf)
    /* Paid invoices hidden with × stay in Firestore; they just leave the Dashboard. */
    .filter(s => !(name === "paidInvoices" && s.data().dashHidden))
    /* Items trashed from Income & Expenses live in that page's own Trash, not this one. */
    .filter(s => !(name === "trash" && s.data().trashBin === "income")).map(docSnap => {
    const d = docSnap.data(), c = d.customer || {};
    return { id: docSnap.id, source: name, createdAt: d.createdAt, revisionOf: d.revisionOf || "", fromJobSheet: !!d.fromJobSheet,
             custId: d.customerId || "", leadId: d.leadId || "", viewedAt: d.lastViewedAt || d.viewedAt || null,
             number: d.number || "", name: c.name || "", phone: c.phone || "", email: c.email || "",
             sched: /^\d{4}-\d{2}-\d{2}$/.test(String(d.scheduledDate || "")),   /* a job date was sent with it */
             total: d.total, feeWaived: !!d.feeWaived, paidAt: d.paidAt, trashedAt: d.trashedAt, date: when(d.createdAt), state: stateOf(d) };
  });
}

/* Refresh button (top bar): re-pulls the lists without reloading the page. */
document.getElementById("refreshBtn").addEventListener("click", async e => {

  const wait = new Promise(r => setTimeout(r, 600));   /* long enough to see it move */
  try { await Promise.all([load(), wait]); }
  finally {
    b.classList.remove("spin"); b.innerHTML = "&#10003;";
    setTimeout(() => { b.innerHTML = "&#10227;"; b.disabled = false; }, 900);
  }
});

async function load(){
  try {
    /* A missing collection just reads empty, so one absent section can't blank the page. */
    const all = SECTIONS.concat(TRASH_SECTION);
    const got = await Promise.all(all.map(s => grab(s.key).catch(e => { console.error(s.key, e); return []; })));
    all.forEach((s, i) => { data[s.key] = got[i]; });
    data.trash = await purgeTrash(data.trash || []);
    /* Shared notes on quotes (quoteNotes, keyed by quote id). A failure here just means
       no notes on the tiles, never a blank dashboard. */
    Object.keys(flags).forEach(k => delete flags[k]);
    try {
      const ns = await getDocs(collection(db, "quoteNotes"));
      ns.docs.forEach(x => { const n = x.data();
        if (String(n.text || "").trim() || (n.photoPaths || []).length) flags[x.id] = n; });
    } catch (e) { console.error("quote notes", e); }
    /* Name links: records without a saved customerId/leadId are matched by phone or email
       (customer first, then lead). A failure here just leaves names unlinked. */
    try {
      const [cs, ls] = await Promise.all([getDocs(collection(db, "customers")), getDocs(collection(db, "leads"))]);
      const cMap = {}, lMap = {};
      cs.docs.forEach(x => { const v = x.data(); if (v.trashed) return;
        [...(v.phoneKeys || []), v.phoneKey, phoneKey(v.phone)].filter(Boolean).forEach(k => cMap["p" + k] ||= x.id);
        [...(v.emailKeys || []), v.emailKey, emailKey(v.email)].filter(Boolean).forEach(k => cMap["e" + k] ||= x.id); });
      ls.docs.forEach(x => { const v = x.data(); if (v.trashed) return;
        const pk = phoneKey(v.phone), ek = emailKey(v.email);
        if (pk) lMap["p" + pk] ||= x.id; if (ek) lMap["e" + ek] ||= x.id; });
      Object.values(data).flat().forEach(r => {
        if (r.custId) return;
        const pk = phoneKey(r.phone), ek = emailKey(r.email);
        r.custId = (pk && cMap["p" + pk]) || (ek && cMap["e" + ek]) || "";
        if (!r.custId && !r.leadId) r.leadId = (pk && lMap["p" + pk]) || (ek && lMap["e" + ek]) || "";
      });
    } catch (e) { console.error("name links", e); }
    const tc = document.getElementById("trashCount");
    if (tc) tc.textContent = (data.trash || []).length || "";
    loaded = true;
    render();
  } catch (e) {
    console.error(e);
    boardEl.innerHTML = '<div class="msg">Could not load the list. If this keeps happening, check the Firestore Rules tab &mdash; reads may be blocked.</div>';
  }
}

/* ---- Invoiced = the job is done = they're a customer now ----
   Same match keys, photo rules and account counter as customers.html and
   approved-leads.html, so every record lines up. */
const phoneKey = s => { const d = String(s || "").replace(/\D/g, "").slice(-10); return d.length === 10 ? d : ""; };
const emailKey = s => String(s || "").trim().toLowerCase();
/* The estimate saves the type as its label ("Property management"). */
const TYPE_OF = { "residential": "residential", "property management": "pm", "pm": "pm", "realtor": "realtor", "commercial": "commercial" };
const okUrls = x => (Array.isArray(x && x.photoUrls) ? x.photoUrls : []).filter(u => /^https:\/\//.test(String(u)));
const okPaths = x => (Array.isArray(x && x.photoPaths) ? x.photoPaths : [])
  .filter(p => typeof p === "string" && p.startsWith("quick-quote-photos/") && !p.includes(".."));

function randomId(){
  const abc = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
  return Array.from(crypto.getRandomValues(new Uint8Array(20)), b => abc[b % abc.length]).join("");
}

const ACCT_START = 1001;
async function nextAcctNo(){
  const r = doc(db, "meta", "customerCounter");
  return await runTransaction(db, async tx => {
    const snap = await tx.get(r);
    const last = snap.exists() ? Number(snap.data().last) || 0 : 0;
    const n = Math.max(last + 1, ACCT_START);
    tx.set(r, { last: n, updatedAt: serverTimestamp() }, { merge: true });
    return n;
  });
}

/* Already a customer? The one picked in the estimate first, then phone and email.
   Active customers win. If the only match is in the Trash, ask: restore it, or start fresh.
   Start fresh is remembered on the quote (freshCustomer) so it isn't asked again. */
async function findCustomer(d){
  let binned = null;
  if (d.customerId) {
    const s = await getDoc(doc(db, "customers", d.customerId));
    if (s.exists()) { const x = { id: s.id, ...s.data() }; if (!x.trashed) return x; binned = x; }
  }
  const c = d.customer || {}, pk = phoneKey(c.phone), ek = emailKey(c.email);
  for (const [f, op, v] of [["phoneKeys", "array-contains", pk], ["phoneKey", "==", pk],
                            ["emailKeys", "array-contains", ek], ["emailKey", "==", ek]]) {
    if (!v) continue;
    const s = await getDocs(query(collection(db, "customers"), where(f, op, v), limit(5)));
    for (const doc_ of s.docs) { const x = { id: doc_.id, ...doc_.data() }; if (!x.trashed) return x; binned ||= x; }
  }
  if (!binned || d.freshCustomer) return null;
  if (confirm('"' + (binned.name || "This customer") + '" is in the customer Trash.\n\nOK = restore that customer record\nCancel = start a fresh customer')) {
    await setDoc(doc(db, "customers", binned.id), { trashed: false, trashedAt: null, updatedAt: serverTimestamp() }, { merge: true });
    return { ...binned, trashed: false };
  }
  d.freshCustomer = true;
  return null;
}

/* Files the invoiced job under a customer.
   Existing customer: linked, keeps their KC number, gets the lead's photos added.
   New: a profile is made with the KC number from Approved Leads (or the next one),
   plus contact, address, the lead's message and notes, the quote notes and photos. */
async function fileCustomer(id, d){
  const c = d.customer || {};
  let lead = null;
  if (d.leadId) {
    try { const s = await getDoc(doc(db, "leads", d.leadId)); if (s.exists()) lead = s.data(); }
    catch (e) { console.error("lead", e); }
  }
  const cust = await findCustomer(d);
  let custId, acctNo;
  if (cust) {
    custId = cust.id;
    acctNo = cust.acctNo || d.acctNo || await nextAcctNo();
    const patch = { updatedAt: serverTimestamp() };
    if (!cust.acctNo) patch.acctNo = acctNo;
    /* Quote photos stay with the job (job sheet); they are not copied onto the profile. */
    await setDoc(doc(db, "customers", custId), patch, { merge: true });
  } else {
    const phone = String(c.phone || "").trim(), email = String(c.email || "").trim();
    const phones = phone ? [phone] : [], emails = email ? [email] : [];
    const t = TYPE_OF[String(c.type || "").trim().toLowerCase()] || "residential";
    const addresses = (c.street || c.city || c.zip)
      ? [{ street: c.street || "", city: c.city || "", state: c.state || "CA", zip: c.zip || "" }] : [];
    /* Notes start with the lead staff notes only. Lead message and quote notes stay with the job. */
    const notes = lead && lead.staffNotes ? String(lead.staffNotes).trim() : "";
    acctNo = d.acctNo || await nextAcctNo();
    custId = randomId();
    await setDoc(doc(db, "customers", custId), {
      type: t, business: t === "residential" ? "" : String(c.business || "").trim(),
      name: String(c.name || "").trim(), phone, email, notes, addresses, acctNo,
      phones, emails, phoneKeys: phones.map(phoneKey).filter(Boolean), emailKeys: emails.map(emailKey).filter(Boolean),
      phoneKey: phoneKey(phone), emailKey: emailKey(email),
      source: "invoice", quoteId: id, ...(d.leadId ? { leadId: d.leadId } : {}),
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
  }
  /* The invoice remembers who it belongs to, so it shows in their job history. */
  await setDoc(doc(db, "invoices", id), { customerId: custId, acctNo }, { merge: true });
  if (lead) await setDoc(doc(db, "leads", d.leadId),
    { converted: true, convertedAt: serverTimestamp(), customerId: custId, updatedAt: serverTimestamp() }, { merge: true });
  return custId;
}

/* Accepted estimate -> invoice. Its own I- number from meta/counters.invoice,
   copied into "invoices" under a fresh id, then removed from "acceptedQuotes".
   Copy first, delete second: a failure mid-way can never lose the record. */
async function toInvoice(id, btn){
  const src = await getDoc(doc(db, "acceptedQuotes", id));
  if (!src.exists()) { alert("That accepted estimate is no longer there. Refresh the page."); return; }
  const d = src.data();

  const num = await runTransaction(db, async tx => {
    const ref = doc(db, "meta", "counters");
    const snap = await tx.get(ref);
    const next = ((snap.exists() && snap.data().invoice) || 1000) + 1;
    tx.set(ref, { invoice: next }, { merge: true });
    return next;
  });

  /* Edited on site (Job Sheet)? The invoice is the on-site version, and the original
     approved quote is parked on it under originalQuote. */
  /* Variance ignored on the job sheet (varianceIgnored = that job sheet total): bill the original quote. */
  const ignored = d.onsite && d.varianceIgnored != null && Number(d.varianceIgnored) === Number(d.onsite.total);
  const on = d.onsite && Array.isArray(d.onsite.lines) && !ignored ? d.onsite : null;
  const inv = Object.assign({}, d, on ? {
    lines: on.lines, subtotal: on.subtotal ?? null, total: on.total ?? null,
    /* Job discount from the job sheet: the invoice shows the full amount off (quote discount + job discount). */
    ...(on.discount != null ? { discount: on.discount, discountLabel: d.discountLabel || "Discount" } : {}),
    /* An on-site update (R1...) already carries the first approved quote: keep that one. */
    originalQuote: d.originalQuote || { number: d.number || "", status: d.status || "accepted", lines: d.lines || [],
      subtotal: d.subtotal ?? null, total: d.total ?? null }
  } : {}, {
    type: "invoice", status: "unpaid", number: "I-" + num,
    quoteNumber: d.number || "", quoteId: id,
    invoicedAt: serverTimestamp(), createdAt: d.createdAt || serverTimestamp()
  });
  delete inv.expiresAt;

  /* Same id as the quote, so a link already sent keeps resolving. */
  await setDoc(doc(db, "invoices", id), inv);
  await deleteDoc(doc(db, "acceptedQuotes", id));

  /* Invoiced means the job is done, so they're a customer now. The invoice is
     already saved; if this part fails it says so instead of undoing anything. */
  try { await fileCustomer(id, inv); }
  catch (e) {
    console.error("customer", e);
    alert("Invoice I-" + num + " was made, but the customer profile could not be filed: " + e.message);
  }
  return "I-" + num;
}

/* Invoice -> paid. Same id, so a link already sent still resolves. */
async function toPaid(id){
  const src = await getDoc(doc(db, "invoices", id));

/* Paid -> back to Invoices (undo). Same id and number, so the customer's link still works.

async function toUnpaid(id){

/* Text: tapping it opens a small choice.
   "Business line" sends through the app from (916) 767-2520 (smsSend), and it shows on the Texts page.
   "My phone" opens the phone's own messaging app (personal number) with the number and link filled in.
   sms: with a body needs "?body=" on Android and "&body=" on iOS. */
const smsSendFn = httpsCallable(getFunctions(getApp(), "us-central1"), "smsSend");
const closeTextMenu = () => document.querySelectorAll(".textmenu").forEach(m => m.remove());
document.addEventListener("click", e => { if (!e.target.closest(".textmenu, .textbtn")) closeTextMenu(); });
boardEl.addEventListener("click", async e => {
  const choice = e.target.closest(".textmenu button");
  if (choice) {
    e.preventDefault(); e.stopPropagation();
    const m = choice.closest(".textmenu"), t = m.previousElementSibling;
    const digits = String(t.dataset.phone || "").replace(/\D/g, "");
    const link = location.origin + location.pathname.replace(/[^/]*$/, "") + "quote.html?id=" + encodeURIComponent(t.dataset.text);
    const first = String(t.dataset.name || "").trim().split(/\s+/)[0];   /* first name only */
    /* Estimates ask them to review and accept; with no job date on it, also to pick a day. */
    const body = "Hi" + (first ? " " + first : "") + ", here's your " + (t.dataset.kind === "invoice" ? "invoice from Khean & Clean: "
      : "estimate from Khean & Clean. Please review and accept it" + (t.dataset.sched ? " here: " : ", and pick a date that works for you: ")) + link;
    if (choice.dataset.via === "phone") {
      closeTextMenu();
      const sep = /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent) ? "&" : "?";
      location.href = "sms:" + digits + sep + "body=" + encodeURIComponent(body);
      return;
    }
    closeTextMenu();
    t.disabled = true; t.textContent = "Sending…";
    try {
      await smsSendFn({to: digits, body});
      t.textContent = "Sent ✓";
    } catch (err) {
      t.disabled = false; t.textContent = "Text";
      alert("Text didn't send. " + (err.message || ""));
    }
    return;
  }
  const t = e.target.closest(".textbtn");
  if (!t) return;
  e.preventDefault(); e.stopPropagation();
  if (!String(t.dataset.phone || "").replace(/\D/g, "")) { alert("No phone number on this one."); return; }
  // Desktop: no choice, it goes straight out from the business line (asks first so a stray click can't send).
  if (!/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)) {
    if (!confirm("Text this " + (t.dataset.kind === "invoice" ? "invoice" : "estimate") + " from the business line (916) 767-2520?")) return;
    closeTextMenu();
    t.insertAdjacentHTML("afterend", '<span class="textmenu" hidden><button type="button" data-via="app"></button></span>');
    t.nextElementSibling.firstElementChild.click();
    return;
  }
  const open = t.nextElementSibling && t.nextElementSibling.classList.contains("textmenu");
  closeTextMenu();
  if (open) return;
  t.insertAdjacentHTML("afterend", '<span class="textmenu"><button type="button" data-via="app">Business line</button>' +
    '<button type="button" data-via="phone">My phone</button></span>');
});

/* Text Mentor: sends a mentor a private link to this job's sheet (shared-job.html?t=<token>).
   Mentors are the contacts labelled Mentor on the Customers page (e.g. Mark Exner).
   jobShares/<token> = {jobId, active}. One link per job, reused until it's turned off. With it they get
   the full job sheet, room pages and Measure; any other page asks for a login.
   Menu: one button per mentor / Test to my phone / Turn off link (only while one is on). Sends from the business line. */
const MY_CELL = "2793212944";   // test sends go here first
const markMenuOff = () => document.querySelectorAll(".markmenu").forEach(m => m.remove());
document.addEventListener("click", e => { if (!e.target.closest(".markmenu, .markbtn")) markMenuOff(); });
const sharesFor = async jobId => (await getDocs(query(collection(db, "jobShares"),
  where("jobId", "==", jobId), where("active", "==", true), limit(5)))).docs;
/* Mentors with a phone, A–Z by first name (short list, so no search). */
/* Anything put on the job sheet yet (notes, photos, rooms, on-site changes, chemicals)? */
const JOB_INPUT = ["jobSheet", "onsite", "spots", "roomChecks", "starred", "notesPhotos", "jobPhotos", "finishPhotos", "headerPhotos"];
const hasJobInput = d => JOB_INPUT.some(k => { const v = d[k];
  return Array.isArray(v) ? v.length > 0 : v && typeof v === "object" ? Object.keys(v).length > 0 : !!v; });
/* Also counts what the job sheet shows from the customer: the note/photos on their quote (quoteNotes)
   and the photos/message from their website lead, plus the quote's own notes. */
async function hasJobInputAll(id, q){
  if (hasJobInput(q) || String(q.notes || "").trim()) return true;
  const full = x => !!x && (String(x.text || x.message || "").trim() || (x.photoPaths || []).length || (x.photos || []).length);
  try { const n = await getDoc(doc(db, "quoteNotes", id)); if (n.exists() && full(n.data())) return true; } catch (e) { console.warn(e); }
  try { if (q.leadId) { const l = await getDoc(doc(db, "leads", q.leadId)); if (l.exists() && full(l.data())) return true; } } catch (e) { console.warn(e); }
  return false;
}
async function mentors(){
  const s = await getDocs(query(collection(db, "customers"), where("type", "==", "mentor"), limit(30)));
  return s.docs.map(d => d.data()).filter(c => !c.trashed)
    .map(c => ({ name: String(c.name || c.business || "Mentor").trim(),
                 phone: String((Array.isArray(c.phones) && c.phones[0]) || c.phone || "").replace(/\D/g, "").slice(-10) }))
    .filter(m => m.phone.length === 10).sort((a, b) => a.name.localeCompare(b.name));
}
boardEl.addEventListener("click", async e => {
  const choice = e.target.closest(".markmenu button");
  if (choice) {
    e.preventDefault(); e.stopPropagation();
    const b = choice.closest(".markmenu").previousElementSibling, jobId = b.dataset.mark, via = choice.dataset.via;
    const who = via === "test" ? "" : String(choice.dataset.name || "").split(" ")[0];
    markMenuOff();
    b.disabled = true; b.textContent = via === "off" ? "Turning off…" : "Sending…";
    try {
      if (via === "off") {
        for (const d of await sharesFor(jobId)) await updateDoc(d.ref, { active: false, offAt: serverTimestamp() });
        b.textContent = "Link off ✓"; return;
      }
      const to = via === "test" ? MY_CELL : choice.dataset.phone;
      if (!to) throw new Error("No number for that mentor.");
      const job = (b.dataset.name || "this job") + (b.dataset.number ? " (" + b.dataset.number + ")" : "");
      const base = location.origin + location.pathname.replace(/[^/]*$/, "");
      /* Text 1: the estimate / invoice itself (same link the customer gets). */
      await smsSendFn({ to, body: "Hi " + (who || "there") + ", here's the estimate for " + job + ": " +
        base + "quote.html?id=" + encodeURIComponent(jobId) });
      /* Text 2: the job sheet, only once something has been put on it. */
      const snap = await getDoc(doc(db, b.dataset.src || "quotes", jobId));
      if (!snap.exists() || !(await hasJobInputAll(jobId, snap.data()))) {
        b.textContent = (via === "test" ? "Test sent" : "Sent to " + (who || "mentor")) + " ✓ (no job sheet yet)"; return;
      }
      let token = ((await sharesFor(jobId))[0] || {}).id;
      if (!token) {
        token = Array.from(crypto.getRandomValues(new Uint8Array(24)), x => x.toString(16).padStart(2, "0")).join("");
        await setDoc(doc(db, "jobShares", token), { jobId, active: true, name: b.dataset.name || "",
          number: b.dataset.number || "", createdAt: serverTimestamp() });
      }
      await smsSendFn({ to, body: "And the job sheet for " + job + ": " + base + "shared-job.html?t=" + token });
      b.textContent = via === "test" ? "Test sent ✓" : "Sent to " + (who || "mentor") + " ✓";
    } catch (err) {
      b.textContent = "Text Mentor";
      alert("Didn't go through. " + (err.message || ""));
    } finally { b.disabled = false; }
    return;
  }
  const b = e.target.closest(".markbtn");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const open = b.nextElementSibling && b.nextElementSibling.classList.contains("markmenu");
  markMenuOff();
  if (open) return;
  let on = false, list = [];
  try { [on, list] = await Promise.all([sharesFor(b.dataset.mark).then(d => d.length > 0), mentors()]); }
  catch (err) { console.warn(err); }
  b.insertAdjacentHTML("afterend", '<span class="markmenu">' +
    (list.length ? list.map(m => '<button type="button" data-via="mentor" data-phone="' + esc(m.phone) + '" data-name="' + esc(m.name) + '">' + esc(m.name) + '</button>').join("")
                 : '<button type="button" disabled title="Label a contact Mentor on the Customers page">No mentors yet</button>') +
    '<button type="button" data-via="test">Test to my phone</button>' +
    (on ? '<button type="button" data-via="off">Turn off link</button>' : '') + '</span>');
});

/* Email: one click sends it straight from israel@kheanandclean.com (sendEmail function).
   Asks first so a stray click can't send. Greyed-out (no email on file) does nothing. */

  e.preventDefault(); e.stopPropagation();
  if (m.classList.contains("off") || m.disabled) return;
  const kind = m.dataset.kind === "invoice" ? "invoice" : "estimate";

    await sendEmailFn({to: m.dataset.email, name: m.dataset.name || "", kind, docId: m.dataset.mail, link});

    m.disabled = false; m.textContent = "Email";

  }
});

  }

/* Trash is a move, not an erase: the doc is copied to "trash" with a note of the
   collection it came from, so Restore can put it back where it was. */
async function toTrash(id, from){
  /* A paid invoice is the main file: × only hides it from the Dashboard.
     It stays in paidInvoices for Income & Expenses and the customer's history. */
  if (from === "paidInvoices") {
    await setDoc(doc(db, from, id), { dashHidden: true, dashHiddenAt: serverTimestamp() }, { merge: true });
    return;
  }
  const src = await getDoc(doc(db, from, id));
  if (!src.exists()) return;
  const d = src.data();
  await setDoc(doc(db, "trash", id), Object.assign({}, d, {
    trashedFrom: from, trashedAt: serverTimestamp()
  }));
  await deleteDoc(doc(db, from, id));
}

async function restore(id){
  const src = await getDoc(doc(db, "trash", id));
  if (!src.exists()) return;
  const d = src.data();
  const back = d.trashedFrom || "quotes";
  const clean = Object.assign({}, d);
  delete clean.trashedFrom; delete clean.trashedAt;
  await setDoc(doc(db, back, id), clean);
  await deleteDoc(doc(db, "trash", id));
}

document.getElementById("trashToggle").addEventListener("click", e => {
  showTrash = !showTrash;
  e.currentTarget.setAttribute("aria-pressed", String(showTrash));
  render();
});

boardEl.addEventListener("click", async e => {
  const del = e.target.closest(".del"), res = e.target.closest(".restore");
  if (!del && !res) return;
  e.preventDefault(); e.stopPropagation();
  const btn = del || res;
  btn.disabled = true;
  try {
    if (del) await toTrash(del.getAttribute("data-del"), del.getAttribute("data-from"));
    else await restore(res.getAttribute("data-restore"));
    await load();
  } catch (err) {
    console.error(err);
    btn.disabled = false;
    alert("That didn't go through. If it keeps failing, check the Firestore Rules \u2014 writes to \"trash\" or deletes may be blocked.");
  }
});

/* One note per quote, no history. Whatever is saved here is what the customer sees in the box on
   their quote. Saving marks it handled (tile back to normal) until the customer changes it again. */
function openNote(qid){
  const n = flags[qid] || {}, row = SECTIONS.flatMap(s => data[s.key] || []).find(r => r.id === qid) || {};
  let paths = Array.isArray(n.photoPaths) ? n.photoPaths.slice() : [];
  const m = document.createElement("div");
  m.className = "nmodal";
  m.innerHTML = '<div class="nbox" role="dialog" aria-modal="true" aria-label="Note on quote">' +
    '<div class="nhead"><strong>Note on ' + esc(row.number || "quote") + (row.name ? ' &middot; ' + esc(row.name) : '') + '</strong>' +
    '<button type="button" class="nx" aria-label="Close">&times;</button></div>' +
    '<p class="nwho">' + (n.by === "customer" ? "The customer changed this last." : "You changed this last.") +
    ' They see whatever is in here on their quote.</p>' +
    '<textarea id="nText"></textarea><div class="ngrid" id="nPhotos"></div>' +
    '<div class="nact"><button type="button" class="nsave" id="nSave">Save</button>' +
    '<button type="button" class="nclear" id="nClear">Clear note</button><span class="nstat" id="nStat"></span></div>' +
    '<p class="nhint">Saving marks it handled, so the tile goes back to normal until the customer changes it again.</p></div>';
  document.body.appendChild(m);
  const ta = m.querySelector("#nText"), grid = m.querySelector("#nPhotos"), stat = m.querySelector("#nStat");
  ta.value = n.text || "";
  const close = () => m.remove();
  m.addEventListener("click", e => { if (e.target === m || e.target.closest(".nx")) close(); });
  const drawPhotos = () => {
    grid.innerHTML = paths.map((p, i) => '<div class="nshot" data-i="' + i + '"><a target="_blank" rel="noopener"><img alt=""></a>' +
      '<button type="button" aria-label="Remove photo">&times;</button></div>').join("");
    grid.querySelectorAll(".nshot").forEach(el => {
      const p = paths[+el.dataset.i];
      getDownloadURL(sRef(storage, p)).then(u => { el.querySelector("img").src = u; el.querySelector("a").href = u; })
        .catch(err => console.error("Photo " + p, err));
      el.querySelector("button").onclick = () => { paths.splice(+el.dataset.i, 1); drawPhotos(); };
    });
  };
  drawPhotos();
  const save = async (text, list) => {
    m.querySelectorAll(".nsave,.nclear").forEach(b => { b.disabled = true; });
    stat.textContent = "Saving\u2026";
    try {
      await setDoc(doc(db, "quoteNotes", qid), { text, photoPaths: list, by: "staff",
        quoteNumber: String(n.quoteNumber || row.number || ""), name: String(n.name || row.name || ""), updatedAt: serverTimestamp() });
      close(); await load();
    } catch (err) {
      console.error(err); stat.textContent = "Could not save: " + err.message;
      m.querySelectorAll(".nsave,.nclear").forEach(b => { b.disabled = false; });
    }
  };
  m.querySelector("#nSave").onclick = () => save(ta.value.trim(), paths);
  m.querySelector("#nClear").onclick = () => {
    if (confirm("Clear this note and its photos? The customer will see an empty box.")) save("", []);
  };
  ta.focus();
}

/* Edit reopens the estimate in the estimator, which saves back over the same record. */
boardEl.addEventListener("click", e => {
  const js = e.target.closest(".jsq");
  if (js) { e.preventDefault(); e.stopPropagation(); location.href = "./job-sheet.html?id=" + encodeURIComponent(js.getAttribute("data-js")); return; }
  /* Edit on a paid invoice: "Edit invoice" opens the estimator like any Edit. */
  const go = e.target.closest(".editmenu .edgo");
  if (go) {
    e.preventDefault(); e.stopPropagation();
    location.href = "./index.html?edit=" + encodeURIComponent(go.dataset.id) + "&from=paidInvoices";
    return;
  }
  if (e.target.closest(".editmenu")) { e.preventDefault(); return; }   /* Mark unpaid is handled above */
  const ed = e.target.closest(".editbtn");
  if (!ed) return;
  e.preventDefault(); e.stopPropagation();   /* the row is a link; don't follow it */
  /* Paid invoices: Edit opens a small menu with Edit invoice and Mark unpaid. Tap Edit again to close. */
  if (ed.getAttribute("data-from") === "paidInvoices") {
    const open = ed.nextElementSibling && ed.nextElementSibling.classList.contains("editmenu");
    document.querySelectorAll(".editmenu").forEach(m => m.remove());
    if (!open) {
      const id = esc(ed.getAttribute("data-edit"));
      ed.insertAdjacentHTML("afterend", '<span class="editmenu">' +
        '<button type="button" class="edgo" data-id="' + id + '">Edit invoice</button>' +
        '<button type="button" class="unpaidbtn" data-unpaid="' + id + '">Mark unpaid</button></span>');
    }
    return;
  }
  /* An updated quote from a job sheet opens in the estimator too; its job sheet follows the changes
     (anything taken off stays on the job sheet at $0, not billed). The estimator links back to the job sheet. */
  location.href = "./index.html?edit=" + encodeURIComponent(ed.getAttribute("data-edit")) +
                  "&from=" + encodeURIComponent(ed.getAttribute("data-from"));
});
