function shrinkPhoto(file){
  return new Promise(resolve => {
    if (!/^image\//.test(file.type) || file.size < 400 * 1024) { resolve(file); return; }
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let w = img.width, h = img.height;
      if (Math.max(w, h) > MAX_EDGE) { const s = MAX_EDGE / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => resolve(b && b.size < file.size ? b : file), "image/jpeg", JPEG_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function wireNote(d, isQuote, num){
  const $ = s => document.getElementById(s);
  const box = $("photoBox"), pick = $("photoPick"), thumbs = $("photoThumbs"), who = $("noteWho"),
        msg = $("photoMsg"), send = $("photoSend"), status = $("photoStatus");
  let savedText = (note && note.text) || "";
  let paths = note && Array.isArray(note.photoPaths) ? note.photoPaths.slice() : [];   // photos already on the note
  let savedCount = paths.length;
  const files = [];    // photos picked but not sent yet

  const filled = () => !!(msg.value.trim() || paths.length || files.length);

  const label = () => {

  const draw = () => {
    urls.forEach(u => URL.revokeObjectURL(u)); urls = [];
    thumbs.innerHTML = "";
    const tile = (src, drop) => {
      const t = document.createElement("div"); t.className = "pthumb";

        `<button type="button" aria-label="Remove photo">&times;</button>`;
      t.querySelector("button").onclick = () => { drop(); draw(); sync(); };
      thumbs.appendChild(t);
    };
    paths.forEach((p, i) => tile(seen[p] || "", () => paths.splice(i, 1)));
    files.forEach((f, i) => { const u = URL.createObjectURL(f); urls.push(u); tile(u, () => files.splice(i, 1)); });
    const n = paths.length + files.length;
    say(n ? `${n} of ${MAX_FILES} photos` : "");
  };
  const add = list => {
    let capped = false;
    for (const f of Array.from(list || [])) {
      if (!/^image\//.test(f.type)) continue;
      if (paths.length + files.length >= MAX_FILES) { capped = true; break; }
      files.push(f);
    }
    box.classList.add("open"); draw(); sync();
    if (capped) say(`${MAX_FILES} photos max — the extra ones weren't added.`);
  };
  /* Small box until tapped (or while it holds a note); folds back only when empty. */
  if (filled()) box.classList.add("open");
  msg.addEventListener("focus", () => box.classList.add("open"));
  msg.addEventListener("blur", () => setTimeout(() => {
    if (!filled() && !box.contains(document.activeElement)) box.classList.remove("open");
  }, 200));
  $("photoPickBtn").onclick = () => pick.click();
  pick.onchange = () => { add(pick.files); pick.value = ""; };
  msg.oninput = sync;
  label(); draw(); sync();

  send.onclick = async () => {
    send.disabled = true;
    send.textContent = files.length ? "Uploading photos…" : "Saving…";
    const c = d.customer || {};
    const key = "quote_" + id + "_" + Date.now();
    const added = [];
    let failed = 0;
    for (let i = 0; i < files.length; i++) {
      const f = files[i], shrunk = await shrinkPhoto(f);
      if (shrunk.size > MAX_BYTES) { failed++; continue; }
      const safe = f.name.replace(/[^a-zA-Z0-9._-]/g, "_").replace(/\.[^.]+$/, "") + ".jpg";
      const path = "quick-quote-photos/" + key + "/" + Date.now() + "_" + i + "_" + safe;
      try {
        const snap = await uploadBytes(sRef(storage, path), shrunk, { contentType: "image/jpeg" });
        added.push(snap.ref.fullPath); seen[snap.ref.fullPath] = URL.createObjectURL(shrunk);
      } catch (err) { failed++; console.error("Photo upload failed: " + f.name, err); }
    }
    const text = msg.value.trim();
    const next = { text, photoPaths: paths.concat(added), by: "customer",
                   quoteNumber: String(d.number || ""), name: String(c.name || c.business || ""), updatedAt: serverTimestamp() };
    let ok = false;
    try { send.textContent = "Saving…"; await setDoc(doc(db, "quoteNotes", id), next); ok = true; }
    catch (err) { console.error("Note save failed", err); }
    /* Heads-up email. Goes out even if the save failed, so nothing is lost. */
    if (text || added.length) {
      try {
        const fd = new FormData();
        fd.append("access_key", WEB3_KEY);
        fd.append("subject", `Message from ${c.name || c.business || "a customer"} on ${num}` + (added.length ? ` (${added.length} photo${added.length === 1 ? "" : "s"})` : ""));
        fd.append("from_name", "Khean & Clean estimator");
        fd.append("name", c.name || c.business || ""); fd.append("phone", c.phone || "");
        fd.append("quote", String(num)); fd.append("message", text);
        fd.append("photo_count", String(next.photoPaths.length)); fd.append("quote_link", location.href);
        await fetch(WEB3_ENDPOINT, { method: "POST", headers: { Accept: "application/json" }, body: fd });
      } catch (err) { console.error("Notification failed", err); }
    }
    send.textContent = "Send";
    if (ok) {
      note = next; savedText = text; paths = next.photoPaths.slice(); savedCount = paths.length; files.length = 0;
      label(); draw(); sync();
      say(failed ? `Saved, but ${failed} photo${failed === 1 ? "" : "s"} didn't upload. Add ${failed === 1 ? "it" : "them"} again.`
                 : "Sent. We'll take a look — you can change this anytime.", true);
    } else {
      sync(); say(`That didn't go through. Try again, or text us at ${PHONE}.`);
    }
  };
}

/* ===== The job day in "Ready to book?" =====
   The day sent with the quote (scheduledDate "2026-10-08", scheduledTime "09:00" or "13:00",
   blank = whole day) shows as plain text. The customer can't change it here: a different day
   goes through "Edit date or message" (the homepage form), so we approve it first. The open
   days (getOpenSlots) say whether the sent day is still free. Accept saves the quote, then
   bookSlot re-checks the slot and books it, so two customers can't land on one slot. A day sent
   with no time is kept as sent. If the days can't load, the quote keeps its day as sent, like
   before. The month view below is kept but never shown. ===== */
const OPEN_URL = "https://us-central1-khean-estimator-78f3e.cloudfunctions.net/getOpenSlots";
const BOOK_URL = "https://us-central1-khean-estimator-78f3e.cloudfunctions.net/bookSlot";
const WHOLE_DAY_AT = 450;   // same line as the backend
const SLOT_TXT = { am: "AM (9\u20131)", pm: "PM (1\u20136)", all: "All day" };
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const isDay = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));
const shortDay = k => new Date(k + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const slotOf = (time, total) => Number(total) >= WHOLE_DAY_AT ? "all" : time === "09:00" ? "am" : time === "13:00" ? "pm" : "";
const time12 = t => { const m = /^(\d{2}):(\d{2})$/.exec(String(t || "")); if (!m) return ""; const h = +m[1]; return (h % 12 || 12) + ":" + m[2] + (h < 12 ? " AM" : " PM"); };
const dayText = (k, time, total) => { const s = slotOf(time, total), t = s ? SLOT_TXT[s] : time12(time); return shortDay(k) + (t ? " \u00b7 " + t : ""); };

function wireDay(d){
  const $ = s => document.getElementById(s);
  const wrap = $("whenWrap"), btn = $("jobPick"), box = $("jobCal"), noteEl = $("whenNote"), lead = $("acceptLead"), dayEl = $("whenDay");
  const big = Number(d.total) >= WHOLE_DAY_AT;
  const asked = isDay(d.scheduledDate) ? d.scheduledDate : "", askedSlot = asked ? slotOf(d.scheduledTime, d.total) : "";
  let byDate = null, first = "", last = "", shown = "", day = "", slot = "", keep = false;
  const pad = n => String(n).padStart(2, "0");
  const say = t => { noteEl.textContent = t; };
  if (asked) { wrap.hidden = false; dayEl.textContent = dayText(asked, d.scheduledTime, d.total); }

  const slotBtn = (k, o, s, txt) => `<button type="button" class="jobCal__slot" data-day="${k}" data-slot="${s}" aria-pressed="false"` +
    `${o[s] ? "" : " disabled"} aria-label="${shortDay(k)} ${txt}${o[s] ? "" : ", booked"}">${txt}</button>`;
  function draw(){
    const y = +shown.slice(0, 4), m = +shown.slice(5, 7) - 1;
    const blanks = new Date(y, m, 1).getDay(), count = new Date(y, m + 1, 0).getDate();
    let cells = "";
    for (let i = 0; i < blanks; i++) cells += '<span class="jobCal__cell is-blank" aria-hidden="true"></span>';
    for (let n = 1; n <= count; n++) {
      const k = shown + "-" + pad(n), o = byDate[k], at = ` data-cell="${k}"`, num = `<b>${n}</b>`;
      const cls = "jobCal__cell" + (k === first ? " is-today" : "");
      if (!o) { cells += `<span class="${cls} is-off"${at}>${num}</span>`; continue; }   // past, or past the 60 days
      if (big) {   // whole-day job: a day with anything booked isn't an option
        cells += o.am && o.pm
          ? `<button type="button" class="${cls} is-open"${at} data-day="${k}" data-slot="all" aria-pressed="false" aria-label="${shortDay(k)}, all day">${num}<span class="jobCal__all">All day</span></button>`
          : `<span class="${cls} is-full"${at} aria-label="${shortDay(k)}, booked">${num}</span>`;
        continue;
      }
      cells += `<div class="${cls}${o.am || o.pm ? "" : " is-full"}"${at}>${num}${slotBtn(k, o, "am", "AM")}${slotBtn(k, o, "pm", "PM")}</div>`;
    }
    box.innerHTML =
      `<div class="jobCal__head"><button type="button" class="jobCal__nav" data-nav="-1" aria-label="Previous month"${shown <= first.slice(0, 7) ? " disabled" : ""}>&lsaquo;</button>` +
      `<strong class="jobCal__month">${MONTHS[m]} ${y}</strong>` +
      `<button type="button" class="jobCal__nav" data-nav="1" aria-label="Next month"${shown >= last.slice(0, 7) ? " disabled" : ""}>&rsaquo;</button></div>` +
      `<p class="jobCal__hint">${big ? "This job takes the whole day. Tap an open day." : "Tap AM (9\u20131) or PM (1\u20136) on an open day. Grey times are booked."}</p>` +
      `<div class="jobCal__grid">${["Su","Mo","Tu","We","Th","Fr","Sa"].map(w => `<span class="jobCal__dow">${w}</span>`).join("")}${cells}</div>` +
      `<div class="jobCal__foot"><button type="button" class="jobCal__link" data-clear>Clear</button><button type="button" class="jobCal__link" data-close>Close</button></div>`;
    paint();
  }
  /* Show the pick: on the button, and lit up in the month. */
  function paint(){
    btn.firstChild.textContent = day && slot ? shortDay(day) + " \u00b7 " + SLOT_TXT[slot] : "See available days";
    btn.classList.toggle("is-empty", !(day && slot));
    box.querySelectorAll("[data-cell]").forEach(c => c.classList.toggle("is-picked", c.getAttribute("data-cell") === day));
    box.querySelectorAll("[data-slot]").forEach(b => b.setAttribute("aria-pressed",
      b.getAttribute("data-day") === day && b.getAttribute("data-slot") === slot ? "true" : "false"));
  }
  function open(){
    const mo = (day || asked).slice(0, 7);
    shown = mo && mo >= first.slice(0, 7) && mo <= last.slice(0, 7) ? mo : first.slice(0, 7);
    draw(); box.hidden = false; btn.setAttribute("aria-expanded", "true");
  }
  function close(){ box.hidden = true; btn.setAttribute("aria-expanded", "false"); }
  function clear(){ day = ""; slot = ""; keep = false; dayEl.textContent = ""; say(""); paint(); }
  btn.addEventListener("click", () => { if (box.hidden) open(); else close(); });
  box.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b || b.disabled) return;
    if (b.hasAttribute("data-nav")) {
      const nx = new Date(+shown.slice(0, 4), +shown.slice(5, 7) - 1 + Number(b.getAttribute("data-nav")), 1);
      shown = nx.getFullYear() + "-" + pad(nx.getMonth() + 1);
      draw();
    } else if (b.hasAttribute("data-clear")) clear();
    else if (b.hasAttribute("data-close")) close();
    else if (b.hasAttribute("data-slot")) {
      if (b.getAttribute("aria-pressed") === "true") { clear(); return; }   // tap the picked one again to un-pick
      day = b.getAttribute("data-day"); slot = b.getAttribute("data-slot");
      keep = false; dayEl.textContent = "";   /* their pick replaces the day sent with the quote */
      say(""); paint(); close();
    }
  });
  /* Tap anywhere else, or Esc, and the month folds away. */
  document.addEventListener("click", e => {
    if (box.hidden || !box.isConnected) return;
    const path = e.composedPath ? e.composedPath() : [e.target];
    if (!path.includes(box) && !path.includes(btn)) close();
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !box.hidden && box.isConnected) { close(); btn.focus(); } });

  fetch(OPEN_URL)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(data => {
      const all = ((data && data.days) || []).filter(x => x && isDay(x.date));
      if (!all.length || !box.isConnected) return;
      byDate = {};
      all.forEach(x => { byDate[x.date] = { am: !!x.am, pm: !!x.pm }; });
      const ks = Object.keys(byDate).sort(); first = ks[0]; last = ks[ks.length - 1];
      /* The day sent with the quote is booked on Accept only while it's still open. */
      /* The customer picks their day right here (it replaced "Edit date or message", which sent
         them to the homepage). Under $450: AM or PM; $450 and up: the whole day. Nothing is
         saved until Accept, which books it onto the job and from there the calendar. */
      const o = asked ? byDate[asked] : null;
      if (o && askedSlot && (askedSlot === "all" ? o.am && o.pm : o[askedSlot])) { day = asked; slot = askedSlot; dayEl.textContent = ""; say(""); }
      else if (o && !askedSlot && (o.am || o.pm)) { keep = true; say("We'll confirm the time with you, or pick a time below."); }   // a day with no time: kept as sent unless they pick
      else if (asked) { dayEl.textContent = ""; say(shortDay(asked) + " isn't open anymore. Pick another day below, or accept and we'll call you to set one."); }
      else say("Pick a day below, or accept and we'll call you to set one.");
      lead.textContent = "Pick your day, read the terms, then type your name to accept this quote.";
      btn.hidden = false;
      paint();
      wrap.hidden = false;
    })
    .catch(err => console.warn("Open days didn't load; the quote keeps its day as sent.", err));
  return { loaded: () => !!byDate && !keep, pick: () => (byDate && day && slot ? { date: day, slot } : null) };
}

async function load(){
  if (!id) { sheet.innerHTML = `<div class="msg">This link is missing its code. Ask Khean &amp; Clean to resend it, or call ${PHONE}.</div>`; return; }
  /* Live quotes sit in "quotes". Once accepted they move to "acceptedQuotes"
     under the same id, so the customer's original link keeps working. */
  let snap;
  try {
    snap = await getDoc(doc(db, "quotes", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "acceptedQuotes", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "invoices", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "paidInvoices", id));
  }
  catch (e) { sheet.innerHTML = `<div class="msg">This page couldn't load. Check your connection and refresh, or call ${PHONE}.</div>`; console.error(e); return; }
  if (!snap.exists()) { sheet.innerHTML = `<div class="msg">This link doesn't match a quote or invoice. Call ${PHONE} and we'll sort it out.</div>`; return; }
  /* The shared note on this quote, if any. Missing or blocked just means an empty box. */
  try { const ns = await getDoc(doc(db, "quoteNotes", id)); note = ns.exists() ? ns.data() : null; }
  catch (e) { console.error("note", e); }
  render(snap.data());
}

    }
  });

  const form = document.getElementById("acceptForm");
  if (form) {
    const picker = wireDay(d);
    /* The button stays dead until the box is ticked and a name is typed. */
    const box = document.getElementById("acceptTerms"), nameEl = document.getElementById("acceptName"), go = document.getElementById("acceptBtn");
    const sync = () => { go.disabled = !(box.checked && nameEl.value.trim()); };
    box.addEventListener("change", sync); nameEl.addEventListener("input", sync);

    /* The box can't be ticked until the terms link has been opened. */
    const link = document.getElementById("termsLink"), hint = document.getElementById("termsHint");
    link.addEventListener("click", () => { box.disabled = false; if (hint) hint.textContent = "(terms opened)"; });

    form.onsubmit = async e => {
    e.preventDefault();
    const name = nameEl.value.trim();
    if (!name || !box.checked) return;
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Accepting…";
    try {
      /* Copy into acceptedQuotes first, then remove the original. In that order a
         failure leaves the quote where it was rather than losing it.
         Once the open days have loaded, the day is booked by bookSlot afterwards (it re-checks the
         slot, and only books a quote with no day yet), so the copy goes in without a day. */
      const accepted = {
        ...d, status: "accepted", acceptedName: name, acceptedAt: serverTimestamp(),
        termsAccepted: true, termsVersion: "service-terms-2026-09"
      };
      let live = picker.loaded();
      const p = picker.pick();
      try { await setDoc(doc(db, "acceptedQuotes", id), live ? { ...accepted, scheduledDate: "", scheduledTime: "" } : accepted); }
      catch (err) {
        /* If the database won't take it without the day, save it as before: day as sent. */
        if (!live || err.code !== "permission-denied") throw err;
        console.warn("Accepted with the day as sent; it couldn't be saved without it.", err);
        live = false;
        await setDoc(doc(db, "acceptedQuotes", id), accepted);
      }
      await deleteDoc(doc(db, "quotes", id));
      const done = { ...d, status: "accepted", acceptedName: name };
      if (live) {
        done.scheduledDate = ""; done.scheduledTime = "";
        done._whenMsg = "No day set yet. We'll call you to set one.";
        if (p) {
          btn.textContent = "Booking your day\u2026";
          try {
            const r = await fetch(BOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, date: p.date, slot: p.slot === "all" ? "am" : p.slot }) });
            const j = await r.json().catch(() => ({}));
            if (r.ok && isDay(j.scheduledDate)) { done.scheduledDate = j.scheduledDate; done.scheduledTime = j.scheduledTime || ""; done._whenMsg = ""; }
            else done._whenMsg = (r.status === 409 ? "That time was just taken, so your day isn't booked yet." : "Your day couldn't be booked online.") + " We'll call you to set it.";
          } catch (err) {
            console.warn("Booking the day failed", err);
            done._whenMsg = "Your day couldn't be booked online. We'll call you to set it.";
          }
        }
      }
      render(done);
    } catch (err) {
      console.error(err); btn.disabled = false; btn.textContent = "Accept quote";
      alert(`That didn't go through. Try again, or call ${PHONE}.`);
    }
    };
  }
}

load();
</script>
</body>
</html>
