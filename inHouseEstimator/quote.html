<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khean &amp; Clean</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Khean &amp; Clean">
<meta property="og:title" content="Khean &amp; Clean">
<meta property="og:description" content="Your quote is ready. Tap to view and approve.">
<meta property="og:image" content="https://kheanandclean.com/images/quote-preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="1200">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
.sheet{max-width:760px;margin:28px auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 14px rgba(23,34,57,.08)}
.top{background:var(--navy);color:#fff;padding:26px 30px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brand{font:700 26px "Playfair Display",Georgia,serif;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:2px}
.idblock{display:flex;align-items:center;gap:14px}
.idblock img{width:62px;height:62px;object-fit:contain;border-radius:8px;flex:none}
.legal{font-size:13px;color:var(--gold);letter-spacing:.04em;text-transform:uppercase;margin-top:5px}
.contact{font-size:14px;color:#c9d0de;margin-top:6px}
.contact a{color:#fff}
.kind{text-align:right}
.kind .t{font:700 30px "Playfair Display",Georgia,serif;line-height:1}
.kind .n{color:var(--gold);font-weight:600;margin-top:6px}
.body{padding:26px 30px}
.meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.meta h3{font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:600}
.meta p{margin:0}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:600}
.r{text-align:right}
tr.sub td{padding-left:22px;font-size:14px;color:var(--muted)}
.totalrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:14px}
.sig{max-width:360px;margin-top:22px}
.sig .name{font:600 30px "Dancing Script",cursive;color:var(--navy);line-height:1.1;padding:0 4px 2px}
.sig .line{border-bottom:1.5px solid var(--navy);margin-bottom:5px}
.sig .cap{font-size:12.5px;color:var(--muted)}
.sig .ok{margin-top:9px;font-size:13.5px;color:var(--ink);display:flex;gap:7px;align-items:center}
.sig .box{color:var(--green);font-weight:700;font-size:15px}
.totals{max-width:280px;flex:0 0 auto;margin-left:auto}
.totals div{display:flex;justify-content:space-between;gap:24px;padding:4px 0}
.grand{font-weight:700;border-top:2px solid var(--navy);margin-top:6px;padding-top:8px}
.notes{background:#f7f8fa;border-left:4px solid var(--gold);padding:12px 16px;margin-top:22px;white-space:pre-wrap}
.pay{margin-top:26px}
.pay h2{font:700 20px "Playfair Display",Georgia,serif;margin:0 0 4px}
.payamt{margin:0 0 14px;color:var(--muted)}
.payamt strong{color:var(--ink);font:700 19px "Playfair Display",Georgia,serif}
.paygrid{display:block}
.paybox{padding:8px 0;text-decoration:none;color:inherit;display:grid;grid-template-columns:24px 1fr;column-gap:12px}
.pico{width:24px;height:24px;grid-row:1 / span 2;margin-top:1px;color:var(--navy)}
.paybox.soon .pico{color:var(--muted)}
.paybox.go .pname{color:var(--navy);text-decoration:underline}
.paybox.soon{color:var(--muted)}
.pname{font-weight:700;margin-bottom:3px}
.pnote{font-size:13.5px;color:var(--muted);line-height:1.4}
.payhelp{margin:14px 0 0;font-size:14px;color:var(--muted)}
.status{display:inline-block;font-weight:700;padding:4px 12px;border-radius:20px;font-size:14px}
.status.paid,.status.accepted{background:#e5f2ec;color:var(--green)}
.status.unpaid{background:#fbe9e6;color:var(--red)}
.accept{margin-top:26px;border:2px solid var(--navy);border-radius:10px;padding:20px}
.accept h2{font:700 20px "Playfair Display",Georgia,serif;margin:0 0 6px}
.accept p{margin:0 0 12px;color:var(--muted)}
.accept form{display:flex;gap:10px;flex-wrap:wrap}
.terms{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-size:15px;cursor:pointer}
.terms input{flex:none;min-width:0;width:20px;height:20px;margin:2px 0 0;accent-color:var(--navy)}
.terms a{color:var(--navy);font-weight:600}
.accept button[disabled]{opacity:.5;cursor:not-allowed}
input{flex:1;min-width:200px;font:16px "Archivo";padding:10px 12px;border:1px solid var(--line);border-radius:6px}
button{font:700 16px "Archivo";background:var(--navy);color:#fff;border:0;border-radius:6px;padding:10px 20px;cursor:pointer}
button.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);font-weight:600;font-size:14px;padding:8px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.foot{padding:0 30px 26px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.msg{padding:60px 30px;text-align:center;color:var(--muted)}
@media (max-width:560px){.top,.body,.foot{padding-left:18px;padding-right:18px}.kind{text-align:left}.sheet{margin:0;border-radius:0}}
/* phone letterhead: logo spans the full text block (name to phone line); "Invoice #I-1005" becomes one row under a thin rule */
@media (max-width:560px){.idblock{gap:12px}.idblock img{width:88px;height:88px;border-radius:6px}.contact{font-size:13px}.kind{width:100%;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.18);padding-top:12px}.kind .t{font-size:24px}.kind .n{margin-top:0}}
@media print{body{background:#fff}.sheet{box-shadow:none;margin:0}.accept,.foot button{display:none}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="sheet" id="sheet"><div class="msg">Loading…</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
}));

const PHONE = "(916) 767-2520", TEL = "+19167672520", EMAIL = "kheanandclean@gmail.com";
const SITE = "kheanandclean.com", SITE_URL = "https://kheanandclean.com";

/* Payment handles. MOCK VALUES - swap these for the real ones before going live.
   PAYPAL_ME: set up a PayPal.Me handle, then put just the handle here.
   STRIPE_LINK: a Stripe payment link, or leave "" to hide the card button. */
const ZELLE = "(916) 767-2520";
const VENMO = "Khean-Clean";
const PAYPAL_ME = "kheanandclean";
const STRIPE_LINK = "";
const CHECKOUT_URL = "https://us-central1-khean-estimator-78f3e.cloudfunctions.net/createCheckout";
// generic pay-list icons (inline SVG, no image files)
const ico = d => `<svg class="pico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const PICO = {
  dollar: ico('<circle cx="12" cy="12" r="9.5"/><path d="M15 9.3c-.6-.9-1.7-1.4-3-1.4-1.7 0-3 .9-3 2.1 0 2.9 6 1.6 6 4.4 0 1.3-1.3 2.2-3 2.2-1.4 0-2.5-.5-3.1-1.4M12 6v1.9M12 16.6v1.5"/>'),
  phone:  ico('<rect x="6.5" y="2.5" width="11" height="19" rx="2.2"/><path d="M11 18.5h2"/>'),
  wallet: ico('<path d="M4 7.5V6.5A2 2 0 0 1 6 4.5h11v3"/><rect x="3" y="7.5" width="18" height="12.5" rx="2"/><path d="M15.5 13.75h2"/>'),
  card:   ico('<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 9.8h19M6 15h4"/>')
};
const sheet = document.getElementById("sheet");
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "";

const id = new URLSearchParams(location.search).get("id");

async function load(){
  if (!id) { sheet.innerHTML = `<div class="msg">This link is missing its code. Ask Khean &amp; Clean to resend it, or call ${PHONE}.</div>`; return; }
  /* Live quotes sit in "quotes". Once accepted they move to "acceptedQuotes"
     under the same id, so the customer's original link keeps working. */
  let snap;
  try {
    snap = await getDoc(doc(db, "quotes", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "acceptedQuotes", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "invoices", id));
    if (!snap.exists()) snap = await getDoc(doc(db, "paidInvoices", id));
  }
  catch (e) { sheet.innerHTML = `<div class="msg">This page couldn't load. Check your connection and refresh, or call ${PHONE}.</div>`; console.error(e); return; }
  if (!snap.exists()) { sheet.innerHTML = `<div class="msg">This link doesn't match a quote or invoice. Call ${PHONE} and we'll sort it out.</div>`; return; }
  render(snap.data());
}

function render(d){
  const isQuote = d.type !== "invoice";
  const num = isQuote ? d.number : "#" + d.number;
  document.title = `${isQuote ? "Quote" : "Invoice"} ${num} · Khean & Clean`;
  const c = d.customer || {};
  /* two lines: street, then "City, ST ZIP" */
  const addr1 = c.street || "";
  const addr2 = [[c.city, c.state].filter(Boolean).join(", "), c.zip].filter(Boolean).join(" ");
  const dateText = d.createdAt && d.createdAt.toDate
    ? d.createdAt.toDate().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })
    : fmtDate(d.date);
  const acceptedOn = d.acceptedAt && d.acceptedAt.toDate
    ? d.acceptedAt.toDate().toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" })
    : "";
  const sigHtml = d.acceptedName ? `
        <div class="sig">
          <div class="name">${esc(d.acceptedName)}</div>
          <div class="line"></div>
          <div class="cap">Accepted by${acceptedOn ? " &middot; " + acceptedOn : ""}</div>
          ${d.termsAccepted ? `<div class="ok"><span class="box">&#10003;</span><span>Disclaimer approved</span></div>` : ""}
        </div>` : "";
  let statusHtml = "";
  if (isQuote && (d.status === "accepted" || d.status === "invoiced"))
    statusHtml = `<span class="status accepted">Accepted${d.acceptedName ? " by " + esc(d.acceptedName) : ""}</span>`;
  if (!isQuote) statusHtml = d.status === "paid" ? `<span class="status paid">Paid</span>` : `<span class="status unpaid">Payment due</span>`;

  const canAccept = isQuote && (d.status === "draft" || d.status === "sent");

  sheet.innerHTML = `
    <div class="top">
      <div class="idblock">
        <img src="../images/logo.png" alt="Khean &amp; Clean">
        <div>
          <div class="brand">Khean &amp; Clean LLC</div>
          <div class="legal">Folsom, CA</div>
          <div class="contact"><a href="tel:${TEL}">${PHONE}</a> · <a href="${SITE_URL}" target="_blank" rel="noopener">${SITE}</a></div>
        </div>
      </div>
      <div class="kind"><div class="t">${isQuote ? "Quote" : "Invoice"}</div><div class="n">${num}</div></div>
    </div>
    <div class="body">
      <div class="meta">
        <div><h3>Prepared for</h3><p><strong>${esc(c.business || c.name)}</strong>${c.business && c.name ? "<br>" + esc(c.name) : ""}${addr1 ? "<br>" + esc(addr1) : ""}${addr2 ? "<br>" + esc(addr2) : ""}${c.phone ? "<br>" + esc(c.phone) : ""}</p></div>
        <div class="r"><h3>Date</h3><p>${dateText}</p>${statusHtml ? `<p style="margin-top:10px">${statusHtml}</p>` : ""}</div>
      </div>
      <table>
        <thead><tr><th>Service</th><th class="r">Amount</th></tr></thead>
        <tbody>${(d.lines || []).map(l => `<tr><td><strong>${esc(l.label)}</strong></td><td class="r"><strong>${money(l.cost)}</strong></td></tr>` +
          (l.items || []).map(it => `<tr class="sub"><td>${esc(it.label)}</td><td class="r">${money(it.cost)}</td></tr>`).join("")).join("")}</tbody>
      </table>
      <div class="totalrow">
        <div class="totals">
        <div><span>Subtotal</span><span>${money(d.subtotal)}</span></div>
        ${d.discount > 0 ? `<div><span>${esc(d.discountLabel || "Discount")}</span><span>&minus;${money(d.discount)}</span></div>` : ""}
        ${d.tax ? `<div><span>Tax (${d.taxRate}%)</span><span>${money(d.tax)}</span></div>` : ""}
        <div class="grand"><span>Total</span><span>${money(d.total)}</span></div>
        </div>
      </div>
      ${d.minApplied ? `<p style="text-align:right;color:var(--muted);font-size:14px;margin:6px 0 0">Minimum service charge applied.</p>` : ""}
      ${sigHtml}
      ${d.notes ? `<div class="notes">${esc(d.notes)}</div>` : ""}
      ${canAccept ? `
      <div class="accept">
        <h2>Ready to book?</h2>
        <p>Read the terms, then type your name to accept this quote. We'll reach out to schedule.</p>
        <form id="acceptForm">
          <label class="terms">
            <input type="checkbox" id="acceptTerms" disabled>
            <span>I have read and agree to the <a href="./terms.html" id="termsLink" target="_blank" rel="noopener">Service Terms &amp; Conditions</a>. <em id="termsHint" style="color:var(--muted);font-style:normal">(open the terms to enable this)</em></span>
          </label>
          <input id="acceptName" aria-label="Your full name" placeholder="Your full name" required autocomplete="name">
          <button type="submit" id="acceptBtn" disabled>Accept quote</button>
        </form>
      </div>` : ""}
      ${!isQuote && d.status !== "paid" ? `
      <div class="pay">
        <h2>Ways to pay</h2>
        <p class="payamt">Amount due <strong>${money(d.total)}</strong></p>
        <div class="paygrid">
          <div class="paybox">
            ${PICO.dollar}<div class="pname">Zelle</div>
            <div class="pnote">No fees. Send to <strong>${ZELLE}</strong> from your bank app.</div>
          </div>
          <a class="paybox go" href="https://venmo.com/${VENMO}?txn=pay&amount=${Number(d.total).toFixed(2)}&note=${encodeURIComponent("Khean & Clean " + d.number)}" target="_blank" rel="noopener">
            ${PICO.phone}<div class="pname">Venmo</div>
            <div class="pnote">Opens Venmo with the amount filled in.</div>
          </a>
          <a class="paybox go" href="https://paypal.me/${PAYPAL_ME}/${Number(d.total).toFixed(2)}" target="_blank" rel="noopener">
            ${PICO.wallet}<div class="pname">PayPal</div>
            <div class="pnote">Pay with a PayPal balance or a card.</div>
          </a>
          ${CHECKOUT_URL ? `
          <a class="paybox go card" href="#" id="cardPay">
            ${PICO.card}<div class="pname">Card or Apple Pay</div>
            <div class="pnote">Visa, Mastercard, Amex, Apple Pay, Google Pay.</div>
          </a>` : `
          <div class="paybox soon">
            ${PICO.card}<div class="pname">Card or Apple Pay</div>
            <div class="pnote">Coming soon. Call to pay by card for now.</div>
          </div>`}
        </div>
        <p class="payhelp">Questions about this invoice or how to pay? Call or text <a href="tel:${TEL}">${PHONE}</a>.</p>
      </div>` : ""}
    </div>
    <div class="foot"><span>Thank you for choosing Khean &amp; Clean.</span><button class="ghost" onclick="print()">Print or save as PDF</button></div>`;

  const cardPay = document.getElementById("cardPay");
  if (cardPay) cardPay.addEventListener("click", async e => {
    e.preventDefault();
    const note = cardPay.querySelector(".pnote"), was = note.textContent;
    note.textContent = "Opening secure checkout…";
    try {
      const r = await fetch(CHECKOUT_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
      const j = await r.json();
      if (!r.ok || !j.url) throw new Error(j.error || "No checkout URL");
      location.href = j.url;
    } catch (err) {
      console.error(err); note.textContent = was;
      alert(`Card payment couldn't start. Try again, or call ${PHONE}.`);
    }
  });

  const form = document.getElementById("acceptForm");
  if (form) {
    /* The button stays dead until the box is ticked and a name is typed. */
    const box = document.getElementById("acceptTerms"), nameEl = document.getElementById("acceptName"), go = document.getElementById("acceptBtn");
    const sync = () => { go.disabled = !(box.checked && nameEl.value.trim()); };
    box.addEventListener("change", sync); nameEl.addEventListener("input", sync);

    /* The box can't be ticked until the terms link has been opened. */
    const link = document.getElementById("termsLink"), hint = document.getElementById("termsHint");
    link.addEventListener("click", () => { box.disabled = false; if (hint) hint.textContent = "(terms opened)"; });

    form.onsubmit = async e => {
    e.preventDefault();
    const name = nameEl.value.trim();
    if (!name || !box.checked) return;
    const btn = form.querySelector("button"); btn.disabled = true; btn.textContent = "Accepting…";
    try {
      /* Copy into acceptedQuotes first, then remove the original. In that order a
         failure leaves the quote where it was rather than losing it. */
      const accepted = {
        ...d, status: "accepted", acceptedName: name, acceptedAt: serverTimestamp(),
        termsAccepted: true, termsVersion: "service-terms-2026-09"
      };
      await setDoc(doc(db, "acceptedQuotes", id), accepted);
      await deleteDoc(doc(db, "quotes", id));
      render({ ...d, status: "accepted", acceptedName: name });
    } catch (err) {
      console.error(err); btn.disabled = false; btn.textContent = "Accept quote";
      alert(`That didn't go through. Try again, or call ${PHONE}.`);
    }
    };
  }
}

load();
</script>
</body>
</html>
