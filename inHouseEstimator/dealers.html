<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Dealers</title>
<style>
/* Dealers (Player Tracker proof of concept): the 10 test dealers (pt-people.js), where each one is, and
   their hours today. "Dealer log in" opens a keypad: the dealer types their four-digit number, then picks a
   table. One dealer per table: logging in pushes off whoever was dealing that table. Dealer records live in
   playerTracker/poc like players: { status: "seated", seat: 0, table, since, totalMs }. Staff only. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:900px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn.big{font-size:20px;padding:16px 28px;width:100%;margin-top:14px}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.box{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.tag.on{background:var(--ok);color:#000}
.tag.off{background:rgba(255,255,255,.15)}
.note{color:rgba(255,255,255,.7);font-size:14px}
/* keypad */
#modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--navy);border:1px solid var(--gold);border-radius:14px;padding:18px;width:100%;max-width:360px;text-align:center}
.mt{font-weight:700;font-size:20px;color:var(--gold)}
.dots{display:flex;gap:14px;justify-content:center;margin:16px 0 6px}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--gold)}
.dots i.f{background:var(--gold)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.msg{min-height:22px;font-size:14px;color:#fca5a5}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.pad button{background:#0b1220;color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:14px;font:700 26px system-ui,sans-serif;padding:16px 0;cursor:pointer}
.pad button:active{background:#22304f}
.pad button.fn{font-size:15px;color:var(--gold)}
.tbls{display:grid;gap:8px;margin-top:12px;text-align:left}
.tbls .btn{text-align:left;border-radius:12px}
.tbls .btn span{display:block;font-weight:400;font-size:13px}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./player-tracker.html">&lsaquo; Player Tracker</a><h1>Dealers</h1></div>
  <div class="warn" id="warn">Not syncing with the server.</div>
  <button class="btn big" id="login">Dealer log in</button>
  <div class="box" id="list"></div>
</div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc as fsDoc, setDoc, onSnapshot, arrayUnion } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { DEALERS, CASINO, casinoDoc, withCasino } from "./pt-people.js";
const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), LOGREF = doc(db, "playerTracker", "log"), PROFREF = doc(db, "playerTracker", "profiles");
const LISTREF = doc(db, "playerTracker", "tablelist"), TBLREF = doc(db, "playerTracker", "tables");
/* Same 5 tables as the Floor page, changed by its edits (tablelist). */
const BASE_TABLES = CASINO !== "edh" ? {} : {   // starter tables are EDH's; another casino starts blank
  1: { game: "Blackjack" }, 2: { game: "Baccarat" }, 3: { game: "Poker" },
  4: { game: "Three Card Poker" }, 5: { game: "Ultimate Texas Hold'em" }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fail = () => { $("warn").style.display = "block"; };
const fmtHrs = ms => { const m = Math.floor(ms / 60000); return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const liveMs = p => (p.totalMs || 0) + (p.status === "seated" && p.since ? Date.now() - p.since : 0);
let state = {}, profiles = {}, list = {}, open = {};
const get = c => state[c] || { status: "out", totalMs: 0 };
const nameOf = c => (profiles[c] && profiles[c].name) || DEALERS[c] || c;
const on = p => p.status === "seated";
function tables() {
  const T = { ...BASE_TABLES };
  for (const [n, t] of Object.entries(list)) {
    if (!t) continue;
    if (t.deleted) { delete T[n]; continue; }
    if (t.game || T[n]) T[n] = { game: t.game || T[n].game };
  }
  return T;
}
const tblName = n => { const t = tables()[n]; return "Table " + n + (t ? " · " + t.game : ""); };

function save(c, p, a) {
  state[c] = p;
  setDoc(REF, { [c]: p }, { merge: true }).catch(fail);
  if (a) setDoc(LOGREF, { events: arrayUnion({ c, a, t: Date.now() }) }, { merge: true }).catch(fail);
  draw();
}
function logOut(c) {
  const p = get(c); if (!on(p)) return;
  save(c, { status: "out", totalMs: liveMs(p), seat: null, since: null, table: null }, "Logged out of table " + (p.table || 1) + " after " + fmtHrs(Date.now() - (p.since || Date.now())));
}
function deal(c, n) {   // one dealer per table: whoever was on table n gets logged out
  for (const d of Object.keys(DEALERS)) if (d !== c && on(get(d)) && (get(d).table || 1) === n) logOut(d);
  const p = get(c);
  if (on(p) && (p.table || 1) === n) return;
  const total = on(p) ? liveMs(p) : (p.totalMs || 0);   // switching tables: keep the hours, restart the clock
  save(c, { status: "seated", seat: 0, table: n, since: Date.now(), totalMs: total }, "Logged in to table " + n);
}

function draw() {
  $("list").innerHTML = Object.keys(DEALERS).sort((a, b) => nameOf(a).localeCompare(nameOf(b))).map(c => {
    const p = get(c);
    return `<div class="row"><div class="nm"><b>${esc(nameOf(c))}</b><span>#${c} &middot; ${fmtHrs(liveMs(p))} today${on(p) ? " &middot; " + esc(tblName(p.table || 1)) : ""}</span></div>
      ${on(p) ? `<span class="tag on">Table ${p.table || 1}</span><button class="btn ghost sm" data-out="${c}">Log out</button>` : `<span class="tag off">Off</span>`}</div>`;
  }).join("");
}
$("list").onclick = e => { const b = e.target.closest("[data-out]"); if (b) logOut(b.dataset.out); };

/* ---- keypad ---- */
let code = "";
const closeM = () => { $("modal").hidden = true; code = ""; };
$("modal").onclick = e => { if (e.target.id === "modal") closeM(); };
function keypad(msg) {
  code = "";
  $("mbox").innerHTML = `<div class="mt">Enter your dealer number</div>
    <div class="dots" id="dots">${"<i></i>".repeat(4)}</div><div class="msg" id="kmsg">${msg || ""}</div>
    <div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<button data-k="${k}">${k}</button>`).join("")}
      <button class="fn" data-k="x">Cancel</button><button data-k="0">0</button><button class="fn" data-k="b">&#9003;</button></div>`;
  $("modal").hidden = false;
  $("mbox").querySelectorAll("[data-k]").forEach(b => b.onclick = () => press(b.dataset.k));
}
function press(k) {
  if (k === "x") { closeM(); return; }
  if (k === "b") code = code.slice(0, -1);
  else if (code.length < 4) code += k;
  const dots = $("dots"); if (!dots) return;
  dots.querySelectorAll("i").forEach((d, i) => d.classList.toggle("f", i < code.length));
  $("kmsg").textContent = "";
  if (code.length < 4) return;
  if (DEALERS[code]) { setTimeout(() => pickTable(code), 120); return; }
  dots.classList.add("shake"); $("kmsg").textContent = "Number not found. Try again.";
  setTimeout(() => { code = ""; dots.classList.remove("shake"); dots.querySelectorAll("i").forEach(d => d.classList.remove("f")); }, 400);
}
document.addEventListener("keydown", e => {   // a keyboard works too
  if ($("modal").hidden || !$("dots")) return;
  if (/^\d$/.test(e.key)) press(e.key); else if (e.key === "Backspace") press("b"); else if (e.key === "Escape") press("x");
});
function pickTable(c) {
  const p = get(c), T = tables(), here = on(p) ? (p.table || 1) : 0;
  const dealerAt = n => Object.keys(DEALERS).find(d => d !== c && on(get(d)) && (get(d).table || 1) === +n);
  $("mbox").innerHTML = `<div class="mt">Hi, ${esc(nameOf(c))}</div>
    <div class="note">${here ? "You're dealing " + esc(tblName(here)) + "." : "Pick your table."}</div>
    <div class="tbls">${Object.entries(T).map(([n, t]) => { const d = dealerAt(n), closed = open[n] && open[n].open === false;
      return `<button class="btn ${+n === here ? "ok" : "ghost"}" data-t="${n}">Table ${n} &middot; ${esc(t.game)}
        <span>${+n === here ? "You're here" : d ? "Takes over from " + esc(nameOf(d)) : "No dealer"}${closed ? " &middot; closed" : ""}</span></button>`; }).join("")}</div>
    <p style="margin:14px 0 0">${here ? `<button class="btn ghost" id="kOut">Log out</button> ` : ""}<button class="btn ghost" id="kClose">Close</button></p>`;
  $("mbox").querySelectorAll("[data-t]").forEach(b => b.onclick = () => { deal(c, +b.dataset.t); closeM(); });
  if (here) $("kOut").onclick = () => { logOut(c); closeM(); };
  $("kClose").onclick = closeM;
}
$("login").onclick = () => keypad();

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  if (!u) { location.replace("./login.html?next=dealers.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  document.body.style.visibility = "visible";
  draw();
  onSnapshot(REF, snap => { $("warn").style.display = "none"; state = snap.exists() ? snap.data() : {}; draw(); }, fail);
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(LISTREF, snap => { list = snap.exists() ? snap.data() : {}; }, () => {});
  onSnapshot(TBLREF, snap => { open = snap.exists() ? snap.data() : {}; }, () => {});
  setInterval(draw, 60000);
});
</script>
</body>
</html>
