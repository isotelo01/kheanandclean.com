<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="192x192" href="../images/favicon-lotus-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="robots" content="noindex, nofollow">
<title>Neighborhoods &middot; Khean &amp; Clean</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../images/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Neighborhoods: when each area was built, typical home size and likely floors, by zip code.
   Used to guess a house's size from its address, and to pick areas to market to. Staff only.
   Firestore: neighborhoods. Saves on its own as you type. */
:root{--navy:#172239;--gold:#E3B64A;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8;--bg:#eef0f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:var(--bg);z-index:9}
.wrap{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
.back{color:var(--muted);font-size:14px;text-decoration:none}
h1{font:700 30px/1.2 "Archivo",system-ui,sans-serif;margin:8px 0 4px;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.sub{color:var(--muted);margin:4px 0 16px;font-size:15px}
.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:14px;align-items:start}
.panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(23,34,57,.08)}
.newbtn{width:100%;background:var(--navy);color:var(--gold);border:0;border-radius:999px;padding:11px;font:700 15px "Archivo",sans-serif;cursor:pointer;margin-bottom:10px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filters button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font:600 12.5px "Archivo",sans-serif;cursor:pointer;color:var(--ink)}
.filters button.on{background:var(--navy);color:var(--gold);border-color:var(--navy)}
.sortrow{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.sortrow select{width:auto;padding:5px 8px;font-size:13.5px}
.item{display:block;width:100%;text-align:left;background:transparent;border:0;border-left:4px solid var(--c,#999);border-radius:8px;padding:9px 10px;margin-bottom:6px;cursor:pointer;font:inherit;color:inherit}
.item:hover{background:#f5f6f8}
.item.on{background:#f0f2f6}
.item b{display:block;font-size:15px;line-height:1.3}
.item small{color:var(--muted);font-size:12.5px}
label.f{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.title{width:100%;font:700 24px/1.25 "Archivo",system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);padding:6px 0;background:transparent;color:var(--ink)}
.title:focus{outline:none;border-color:var(--gold)}
input.t,select,textarea{width:100%;font:16px/1.5 "Archivo",sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:110px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:14px}
.saved{color:var(--muted);font-size:13.5px}
.ghost{background:transparent;color:#b3261e;border:1px solid #b3261e;border-radius:999px;padding:7px 14px;font:600 13.5px "Archivo",sans-serif;cursor:pointer;margin-left:auto}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
:where(a,button,input,select,textarea):focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:820px){ .layout{grid-template-columns:1fr} .row{grid-template-columns:1fr 1fr} }
</style>
<link rel="stylesheet" href="./theme-dark.css">
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <a class="back" href="./hub.html">&lsaquo; Hub</a>
  <h1>Neighborhoods</h1>
  <p class="sub">When each area was built, typical home size and likely floors. For guessing house size from an address, and for picking where to market. Saves on its own.</p>
  <div class="layout">
    <aside class="panel">
      <button type="button" class="newbtn" id="newBtn">+ New neighborhood</button>
      <div class="filters" id="filters"></div>
      <div class="sortrow"><label for="sortBy">Sort</label><select id="sortBy">
        <option value="name">Name</option><option value="year">Oldest first</option><option value="size">Biggest homes first</option><option value="floor">Floor type</option>
      </select></div>
      <div id="list"><div class="empty">Loading&hellip;</div></div>
    </aside>
    <main class="panel" id="editor"><div class="empty">Pick a neighborhood on the left, or tap + New neighborhood.</div></main>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, collection, getDocs, getDoc, addDoc, setDoc, deleteDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
/* iPhone Safari keeps dropping the database's live connection; use steadier long-polling there (same as the job sheet). */
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };


const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const auth = getAuth(app), db = getFirestore(app);
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "5SNJ2DzfrycMrEfbex73Lywf7KB3", "eoYah1xNcaT7R4lAMOVFFMS7ITN2"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ZIPS = { "95630": "Folsom", "95762": "El Dorado Hills" };
const FLOORS = { "": ["Not sure yet", "#8a94a6"], carpet: ["Mostly carpet", "#c48a12"], tile: ["Lots of tile", "#2f6fb0"],
                 hard: ["Updated to hard floors", "#2e8a57"], mixed: ["Mixed", "#8b5cf6"] };
const BLANK = { name: "", zip: "95630", yearFrom: "", yearTo: "", homeSqft: "", floor: "", streets: "", notes: "" };

let items = [], cur = null, zip = "all", sortBy = "name", timer = null;
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const years = a => a.yearFrom || a.yearTo ? (a.yearFrom || "?") + (a.yearTo && a.yearTo !== a.yearFrom ? "–" + a.yearTo : "") : "";

function sorted(){
  const xs = items.filter(a => zip === "all" || a.zip === zip);
  const by = {
    name: (a, b) => String(a.name).localeCompare(String(b.name)),
    year: (a, b) => (num(a.yearFrom) ?? 9999) - (num(b.yearFrom) ?? 9999),
    size: (a, b) => (num(b.homeSqft) ?? -1) - (num(a.homeSqft) ?? -1),
    floor: (a, b) => String(a.floor || "z").localeCompare(String(b.floor || "z"))
  }[sortBy];
  return xs.sort(by);
}
function drawFilters(){
  const c = { all: items.length }; items.forEach(a => c[a.zip] = (c[a.zip] || 0) + 1);
  $("filters").innerHTML = [["all", "All"], ...Object.entries(ZIPS).map(([z, n]) => [z, z + " " + n])].map(([k, l]) =>
    '<button type="button" data-f="' + k + '" class="' + (zip === k ? "on" : "") + '">' + esc(l) + ' ' + (c[k] || 0) + '</button>').join("");
}
function drawList(){
  const xs = sorted();
  $("list").innerHTML = xs.length ? xs.map(a => {
    const f = FLOORS[a.floor] || FLOORS[""], bits = [a.zip, years(a), a.homeSqft ? Number(a.homeSqft).toLocaleString() + " sq ft" : "", a.floor ? f[0] : ""].filter(Boolean);
    return '<button type="button" class="item' + (cur && cur.id === a.id ? " on" : "") + '" style="--c:' + f[1] + '" data-id="' + esc(a.id) + '">' +
      '<b>' + esc(a.name || "Unnamed") + '</b><small>' + esc(bits.join(" · ")) + '</small></button>';
  }).join("") : '<div class="empty">Nothing here yet.</div>';
}
function drawEditor(){
  if (!cur) { $("editor").innerHTML = '<div class="empty">Pick a neighborhood on the left, or tap + New neighborhood.</div>'; return; }
  const opt = (obj, v) => Object.entries(obj).map(([k, l]) => '<option value="' + k + '"' + (v === k ? " selected" : "") + '>' + esc(Array.isArray(l) ? l[0] : k + " " + l) + '</option>').join("");
  $("editor").innerHTML =
    '<input class="title" id="eName" placeholder="Neighborhood / subdivision name" value="' + esc(cur.name) + '" aria-label="Name">' +
    '<div class="row">' +
      '<div><label class="f" for="eZip">Zip code</label><select id="eZip">' + opt(ZIPS, cur.zip) + '</select></div>' +
      '<div><label class="f" for="eFrom">Built from (year)</label><input class="t" id="eFrom" inputmode="numeric" value="' + esc(cur.yearFrom) + '" placeholder="e.g. 1995"></div>' +
      '<div><label class="f" for="eTo">Built to (year)</label><input class="t" id="eTo" inputmode="numeric" value="' + esc(cur.yearTo) + '" placeholder="e.g. 2004"></div>' +
      '<div><label class="f" for="eSqft">Typical home (sq ft)</label><input class="t" id="eSqft" inputmode="numeric" value="' + esc(cur.homeSqft) + '" placeholder="e.g. 2200"></div>' +
      '<div style="grid-column:span 2"><label class="f" for="eFloor">Likely floors</label><select id="eFloor">' + opt(FLOORS, cur.floor) + '</select></div>' +
    '</div>' +
    '<label class="f" for="eStreets">Streets in it (comma separated, used to match an address)</label><textarea id="eStreets" placeholder="e.g. Sutter St, Figueroa St, Riley St">' + esc(cur.streets) + '</textarea>' +
    '<label class="f" for="eNotes">Notes</label><textarea id="eNotes" placeholder="Builder, home styles, what you’ve seen on jobs there, marketing ideas">' + esc(cur.notes) + '</textarea>' +
    '<div class="bar"><span class="saved" id="saved">Saved</span><button type="button" class="ghost" id="delBtn">Delete</button></div>';
}

/* Saves a second after you stop typing. */
const fields = { eName: "name", eZip: "zip", eFrom: "yearFrom", eTo: "yearTo", eSqft: "homeSqft", eFloor: "floor", eStreets: "streets", eNotes: "notes" };
function queueSave(){
  $("saved").textContent = "Saving…";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const a = cur; if (!a) return;
    const data = { updatedAt: serverTimestamp() }; Object.values(fields).forEach(k => data[k] = a[k] ?? "");
    try { await setDoc(doc(db, "neighborhoods", a.id), data, { merge: true });
      if ($("saved")) $("saved").textContent = "Saved"; drawFilters(); drawList(); }
    catch (e) { console.error(e); if ($("saved")) $("saved").textContent = "Couldn’t save. Check your connection."; }
  }, 900);
}
const onEdit = e => { const f = fields[e.target.id]; if (!f || !cur) return; cur[f] = e.target.value; queueSave(); };
$("editor").addEventListener("input", onEdit);
$("editor").addEventListener("change", onEdit);
$("editor").addEventListener("click", async e => {
  if (e.target.id === "delBtn" && cur && confirm("Delete “" + (cur.name || "Unnamed") + "”?")) {
    try { await deleteDoc(doc(db, "neighborhoods", cur.id)); items = items.filter(a => a !== cur); cur = null; drawFilters(); drawList(); drawEditor(); }
    catch (err) { console.error(err); alert("Couldn't delete."); }
  }
});
$("list").addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  cur = items.find(a => a.id === b.dataset.id); drawList(); drawEditor();
  if (window.innerWidth < 820) $("editor").scrollIntoView({ behavior: "smooth" });
});
$("filters").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (!b) return; zip = b.dataset.f; drawFilters(); drawList(); });
$("sortBy").onchange = e => { sortBy = e.target.value; drawList(); };
$("newBtn").onclick = async () => {
  const a = { ...BLANK, zip: zip === "all" ? "95630" : zip, createdAt: serverTimestamp(), updatedAt: serverTimestamp() };
  try { const r = await addDoc(collection(db, "neighborhoods"), a); cur = { ...a, id: r.id }; items.push(cur);
    drawFilters(); drawList(); drawEditor(); $("eName").focus(); }
  catch (e) { console.error(e); alert("Couldn't add a neighborhood."); }
};

/* Folsom starter list (researched Oct 2026 from listing sites). Years are the main build era; sq ft is a typical
   house there and is a rough guess unless the note says it's an average. Floors left "Not sure yet" to fill in from jobs. */
const S = (name, yearFrom, yearTo, homeSqft, streets, notes) => ({ name, zip: "95630", yearFrom, yearTo, homeSqft, floor: "", streets, notes });
const STARTERS = [
  S("Historic Folsom / Central", "1890", "1965", "1400", "Sutter St, Figueroa St, Natoma St, Riley St, Leidesdorf St, Duchow Way",
    "Oldest part of town. Some homes from the late 1800s; most are post-war 1950s ranch and tri-level homes. Sq ft is a rough guess."),
  S("Willow Creek Estates", "1978", "1990", "2200", "", "Large Willow Creek development started late 1970s / early 1980s. Sq ft is a rough guess."),
  S("American River Canyon", "1982", "1998", "2400", "", "Original American River Canyon, south of Oak Avenue Pkwy, built early 1980s into the 1990s. North section is newer. Sq ft is a rough guess."),
  S("Lexington Hills", "1983", "1993", "2000", "", "East of Oak Avenue Pkwy, south of Blue Ravine Rd; built 1980s and early 1990s. Sq ft is a rough guess."),
  S("Briggs Ranch", "1986", "1999", "2400", "Briggs Ranch Dr, Darrington Dr",
    "Late 1980s and 1990s; semi-custom, custom and large tract plans, big lots, mature oaks, near Folsom Lake. No HOA. Sq ft is a rough guess."),
  S("Natoma Station", "1988", "1999", "1950", "Coventry Cir",
    "Mostly 1990s Spanish-style ranch and two-story homes, median built 1993. Average house about 1,950 sq ft. Tight yards, many remodeled."),
  S("Broadstone", "1991", "2013", "2000", "Broadstone Pkwy, Withers Ct",
    "Built entirely by Elliott Homes, 1991 to 2013, near East Bidwell and Hwy 50. Also has condos. Sq ft is a rough guess."),
  S("Willow Springs", "1990", "2000", "2000", "", "Near Natoma Station and Prairie Oaks. Years and sq ft are rough guesses."),
  S("The Parkway", "1995", "2010", "2500", "", "Planned development with HOA, building started mid-1990s. Sq ft is a rough guess."),
  S("Prairie Oaks", "1997", "2002", "2600", "Williams St, Travis St, Rogers Cir",
    "Northeast of Natoma Station, east of Prairie City Rd, south of Blue Ravine. Listings built 1998 to 2001, mostly 2,500 to 3,600 sq ft."),
  S("Empire Ranch", "1997", "2010", "2600", "Empire Ranch Rd",
    "Master-planned around Empire Ranch Golf Club; mostly late 1990s through 2000s, plus gated areas and condos. Sq ft is a rough guess."),
  S("Lakeview Oaks", "2015", "2022", "3000", "Swingle Rd, Oliver Ct", "Gated custom-home community; listings built 2019 to 2020, 2,500 to 3,100 sq ft."),
  S("Folsom Ranch (incl. Russell Ranch)", "2018", "2026", "2400", "",
    "New master plan south of Hwy 50, building since 2018, median built 2022. Average house about 2,400 sq ft. Still building.")
];

async function load(){
  /* Starters: each added once (remembered in meta/neighborhoodsSeeded), so a deleted one never comes back. */
  const seedRef = doc(db, "meta", "neighborhoodsSeeded");
  const seeded = new Set(((await getDoc(seedRef)).data() || {}).names || []);
  const todo = STARTERS.filter(s => !seeded.has(s.name));
  if (todo.length) {
    for (const s of todo) { await addDoc(collection(db, "neighborhoods"), { ...s, createdAt: serverTimestamp(), updatedAt: serverTimestamp() }); seeded.add(s.name); }
    await setDoc(seedRef, { names: [...seeded] }, { merge: true });
  }
  const snap = await getDocs(collection(db, "neighborhoods"));
  items = snap.docs.map(d => ({ id: d.id, ...BLANK, ...d.data() }));
  drawFilters(); drawList();
}

/* Page lock: staff only. */
onAuthStateChanged(auth, u => {
  if (!u) { location.replace("./login.html?next=neighborhoods.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  $("authwait")?.remove();
  load().catch(e => { console.error(e); $("list").innerHTML = '<div class="empty">Couldn’t load neighborhoods.</div>'; });
});
</script>
<script src="./tabbar.js" defer></script>
</body>
</html>
