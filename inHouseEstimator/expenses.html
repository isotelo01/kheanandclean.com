<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
/* Same look as approved-leads.html. */
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Archivo",system-ui,sans-serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
/* Scan a receipt: gold camera button (opens the camera), small "upload a photo" link under it. File boxes stay out of sight. */
#scanFile,#uploadFile{display:none !important}
.scanrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:12px}
#scanBtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:10px;font:700 16px "Archivo",system-ui,sans-serif;color:#172239;
  background:linear-gradient(135deg,#f6dc8e 0%,#E3B64A 45%,#b98f2e 100%);border:0;border-radius:999px;padding:12px 22px 12px 16px;cursor:pointer;
  box-shadow:0 0 0 1px rgba(255,236,180,.55) inset,0 6px 18px rgba(227,182,74,.35),0 0 26px rgba(227,182,74,.18);transition:transform .15s ease,box-shadow .2s ease}
#scanBtn .cam{width:34px;height:34px;border-radius:50%;background:#172239;display:grid;place-items:center;flex:none;box-shadow:0 0 0 2px rgba(255,240,200,.6)}
#scanBtn .cam,#scanBtn .lbl{position:relative;z-index:1}   /* shine passes behind the icon and words */
#scanBtn .cam svg{width:19px;height:19px;stroke:#E3B64A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#scanBtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,252,240,.75) 50%,transparent 65%);
  background-size:260% 100%;background-position:160% 0;animation:scanShine 3.6s ease-in-out 1s infinite;pointer-events:none;z-index:0}
@keyframes scanShine{0%{background-position:160% 0}35%,100%{background-position:-60% 0}}
#scanBtn:active{transform:scale(.97)}
#scanBtn:disabled{cursor:default;animation:scanPulse 1.1s ease-in-out infinite}
#scanBtn:disabled::after{animation-duration:1.1s;animation-delay:0s}
@keyframes scanPulse{50%{box-shadow:0 0 0 1px rgba(255,236,180,.55) inset,0 6px 26px rgba(227,182,74,.6),0 0 40px rgba(227,182,74,.4)}}
#uploadBtn{background:none;border:0;padding:4px 2px;font:600 14px "Archivo",system-ui,sans-serif;color:var(--gold);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#uploadBtn:disabled{opacity:.5;cursor:default}
#scanMsg:not(:empty){display:inline-block;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid rgba(227,182,74,.5);background:rgba(227,182,74,.10)}
@media (prefers-reduced-motion:reduce){#scanBtn::after,#scanBtn:disabled{animation:none}}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px;margin-bottom:16px}
.panel h2{font:700 20px "Archivo",system-ui,sans-serif;margin:0 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.monthbar{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px}
.monthbar .lab{font:700 20px "Archivo",system-ui,sans-serif;min-width:190px;text-align:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
label{display:block;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{display:block;width:100%;margin-top:4px;font:16px "Archivo";padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
textarea{min-height:60px;resize:vertical}
.full{grid-column:1/-1}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.msg{color:var(--muted);font-size:14px;padding:6px 2px}
.err{color:var(--red)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
/* Expenses: Ref # and date stay on one line. */
#list td.ref,#list td:first-child{white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.amt,th.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:none}
.del{display:inline-flex;align-items:center;justify-content:center;background:none;border:1px solid transparent;border-radius:6px;color:var(--red);cursor:pointer;padding:4px}
.del:hover{border-color:var(--line);background:#fbf1ef}
.del svg{display:block;width:17px;height:17px}
.del{font:400 22px/1 "Archivo",system-ui,sans-serif;width:30px;height:30px}
.restore{font-size:13px;padding:5px 10px}
.note{color:var(--muted);font-size:13px}
.sides{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:16px;align-items:start}
.sides .panel{margin-bottom:0;min-width:0}
.pl{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.pl .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.pl .big{font:700 24px "Archivo",system-ui,sans-serif;font-variant-numeric:tabular-nums lining-nums}
.pl .pos{color:var(--green)}
.pl .neg{color:var(--red)}
@media (max-width:760px){.sides{grid-template-columns:1fr}.pl .big{font-size:19px}}
/* Items pop-up: small scrolling box on desktop, full screen on phones. */
.itemsBox{border:none;padding:0;width:min(440px,92vw);max-height:70vh;display:none;flex-direction:column;overflow:hidden}
.itemsBox[open]{display:flex}
.itemsBox::backdrop{background:rgba(0,0,0,.55)}
.itemsHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:2px solid var(--gold)}
.itemsHead h3{font:700 18px "Archivo",system-ui,sans-serif;margin:0}
#itemsClose{background:none;border:1px solid var(--line);border-radius:6px;color:inherit;font:400 24px/1 "Archivo",system-ui,sans-serif;width:36px;height:36px;cursor:pointer;flex:none}
.itemsBody{padding:14px 16px;overflow-y:auto;font-size:15px}
.exrow{cursor:pointer}
.exrow:hover td{background:rgba(255,255,255,.04)}
.rvendor{font:700 18px "Archivo",system-ui,sans-serif;margin-bottom:10px}
.rl{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.rl span{color:var(--muted)}
.rl b{text-align:right;font-weight:600}
.rsub{color:var(--muted);margin:12px 0 4px}
.ritems{margin:0 0 6px;padding-left:20px}
.ritems li{padding:2px 0}
.rtotal{border-top:2px solid var(--gold);border-bottom:0;margin-top:8px;font-size:17px}
.rtotal b{font-weight:700}
.itemsBody .rcpt{margin-top:16px;width:100%}
.rmemo{margin-top:16px}
.rmemo textarea{min-height:90px}
/* Phones: no boxes around sections, just a line between them, for more room. */
@media (max-width:759px){
  .wrap .panel{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;padding:14px 0;margin:0}
  .wrap .sides{gap:0}
  /* Expenses table: drop Paid with / Ref #, vendor name stops at 2 lines. */
  #list .pw{display:none}
  #list .vname{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;word-break:break-word}
}
@media (max-width:759px){.itemsBox{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;margin:0;border-radius:0}}
</style>

<style>

  box-shadow:0 1px 0 rgba(255,240,200,.08) inset,0 14px 40px rgba(0,0,0,.45);overflow:hidden}

.panel h2::after{content:"";position:absolute;left:0;bottom:0;width:64px;height:3px;border-radius:3px;background:linear-gradient(90deg,#E3B64A,#f6dc8e)}
/* add a payment: navy pill with gold edge, same height as the scan button */
#toggleForm.new{border-radius:999px;padding:12px 22px;background:#0b1222;border:1px solid var(--gold);color:#fff;font-weight:700;
  box-shadow:0 0 18px rgba(227,182,74,.12)}
#toggleForm.new:hover{background:rgba(227,182,74,.12)}
#csvBtn.ghost{border-radius:999px;background:transparent;border:1px solid rgba(227,182,74,.5);color:var(--gold);font-weight:700;padding:9px 18px}
#csvBtn.ghost:hover{background:rgba(227,182,74,.12)}
#saveBtn.new{border-radius:999px;padding:11px 28px;border:0;color:#172239;font-weight:700;background:linear-gradient(135deg,#f6dc8e,#E3B64A 50%,#b98f2e);box-shadow:0 6px 18px rgba(227,182,74,.3)}
/* form */
#formWrap{margin-top:14px;padding:16px;border-radius:14px;background:rgba(0,0,0,.35);border:1px solid rgba(227,182,74,.22)}
#formWrap h2{margin-top:0 !important}
label{color:#c9cfdb;letter-spacing:.02em}
.wrap input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),.wrap select,.wrap textarea{
  border-radius:10px;background:#060a14 !important;border-color:#33415f !important;transition:border-color .15s,box-shadow .15s}
.wrap input:focus,.wrap select:focus,.wrap textarea:focus{outline:none;border-color:var(--gold) !important;box-shadow:0 0 0 3px rgba(227,182,74,.22)}
/* tables */
th{color:#d9b866;font-size:11px;letter-spacing:.09em;border-bottom:1px solid rgba(227,182,74,.35)}
td{border-bottom:1px solid rgba(255,255,255,.07)}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(227,182,74,.06)}
#list .exrow{cursor:pointer}
td.amt{color:#fff;font-weight:700}

a.rcpt{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:999px;border:1px solid rgba(227,182,74,.5);background:rgba(227,182,74,.10);
  color:var(--gold);font-size:12px;font-weight:700;text-decoration:none;letter-spacing:.02em}
tfoot td{border-top:1px solid rgba(227,182,74,.45);color:#fff;padding-top:12px}
tfoot td.amt{color:#f6dc8e;font-size:17px}
.del{color:#ff8a7a}
.wrap .msg{color:#aeb6c6}
/* profit: three stat tiles */
#profitBox .pl{gap:10px}
#profitBox .pl > div{padding:14px 8px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08)}
#profitBox .pl > div:last-child{border-color:rgba(227,182,74,.45);background:rgba(227,182,74,.07)}

<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1>Income &amp; Expenses</h1>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto">
      <button type="button" class="ghost" id="trashBtn" aria-expanded="false">Trash <span id="trashCount"></span></button>
      <a class="ghost" href="./dashboard.html">Dashboard</a>
      <a class="ghost" href="./customers.html">Contacts</a>
    </div>
  </div>

  <div class="monthbar">

    <div class="lab" id="monthLab"></div>
    <button type="button" class="ghost" id="nextM" aria-label="Next month">&rsaquo;</button>
  </div>

  <div class="panel" id="trashBox" hidden>
    <h2>Income &amp; Expenses Trash</h2>
    <div class="note" style="margin-bottom:8px">Restore puts an item back where it was. Anything here is erased 30 days after it was trashed.</div>
    <div id="trashList"><div class="msg">Loading&hellip;</div></div>

    <button type="button" class="new" id="toggleForm" aria-expanded="false">+ Add a payment</button>
    <div class="scanrow">
      <button type="button" id="scanBtn"><span class="cam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2A1.5 1.5 0 0 1 9.8 5h4.4a1.5 1.5 0 0 1 1.2.8L17 8h3a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 4 8z"/><circle cx="12" cy="13" r="3.6"/></svg></span><span class="lbl">Scan a receipt</span></button>
      <button type="button" id="uploadBtn">or upload a photo</button>
      <span class="msg" id="scanMsg"></span>

    <input type="file" id="scanFile" accept="image/*" capture="environment" hidden>
    <input type="file" id="uploadFile" accept="image/*" hidden>

    </div>
  </div>

    <h2 id="incHead">Income</h2>

    <div id="list"><div class="msg">Loading&hellip;</div></div>
    <div class="actions">
      <button type="button" class="ghost" id="csvBtn">Export month (CSV)</button>
    </div>

  </div>
  <div class="panel" id="profitBox" style="margin-top:16px"></div>
</div>

</dialog>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore as fsGetFirestore, initializeFirestore, collection, query, where, getDocs, getDoc, setDoc, addDoc, deleteDoc, doc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { findDupes, confirmDupes } from "./expense-dupes.js";   /* rule: let Israel know about duplicate receipts */
/* iPhone Safari keeps dropping the database's live connection; use steadier long-polling there (same as the job sheet). */
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };

import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const auth = getAuth(app);
const storage = getStorage(app);
const readReceipt = httpsCallable(getFunctions(app, "us-central1"), "readReceipt");
let pendingReceipt = "";   // Storage path of a scanned receipt, saved with the next expense

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';

/* Accountant-friendly fields. Each expense stores month "YYYY-MM" so a month loads with one simple query. */
const CATEGORIES = ["Supplies", "Chemicals", "Equipment", "Fuel", "Vehicle", "Insurance", "Marketing", "Software / subscriptions", "Repairs", "Other"];
const PAID_WITH = ["Card", "Cash", "Check", "Bank transfer", "Other"];
$("fCat").innerHTML = CATEGORIES.map(c => '<option>' + esc(c) + '</option>').join("");
$("fPaid").innerHTML = PAID_WITH.map(c => '<option>' + esc(c) + '</option>').join("");

const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const now = new Date();
let cur = { y: now.getFullYear(), m: now.getMonth() + 1 };
const monthKey = () => cur.y + "-" + pad(cur.m);
const monthName = () => new Date(cur.y, cur.m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
$("fDate").value = todayStr();

let rows = [];
let income = [];

/* Income = customer invoices marked Paid, placed in the month of their paidAt. */
async function loadIncome(){
  $("incHead").textContent = "Income \u2014 " + monthName();
  $("incList").innerHTML = '<div class="msg">Loading&hellip;</div>';
  const start = new Date(cur.y, cur.m - 1, 1), end = new Date(cur.y, cur.m, 1);
  try {
    const snap = await getDocs(query(collection(db, "paidInvoices"), where("paidAt", ">=", start), where("paidAt", "<", end)));
    income = snap.docs.map(d => {
      const x = d.data(), p = x.paidAt && x.paidAt.toDate ? x.paidAt.toDate() : null;
      return { id: d.id, number: x.number || "", name: (x.customer && x.customer.name) || "", custId: x.customerId || "", total: Number(x.total) || 0,
               paid: p, date: p ? p.getFullYear() + "-" + pad(p.getMonth() + 1) + "-" + pad(p.getDate()) : "" };
    }).sort((a, b) => (a.paid || 0) - (b.paid || 0));
    renderIncome();
  } catch (e) {
    console.error(e);
    income = [];
    $("incList").innerHTML = '<div class="msg err">Could not load income: ' + esc(e.message) + '</div>';
  }
  renderProfit();
}

function renderIncome(){
  if (!income.length) { $("incList").innerHTML = '<div class="msg">No paid invoices in ' + esc(monthName()) + '.</div>'; return; }
  const total = income.reduce((s, r) => s + r.total, 0);
  $("incList").innerHTML = '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Invoice</th><th class="amt">Amount</th><th></th></tr></thead><tbody>' +
    income.map(r => '<tr><td>' + esc(String(r.date || "").replace(/^\d{4}-0?(\d{1,2})-0?(\d{1,2})$/, "$1/$2")) + '</td><td>' +
      (r.custId ? '<a href="./customers.html#' + encodeURIComponent(r.custId) + '">' + esc(r.name || "No name") + '</a>' : esc(r.name || "No name")) + '</td><td>' +
      '<a href="./quote.html?id=' + encodeURIComponent(r.id) + '">' + esc(r.number) + '</a></td><td class="amt">' + money(r.total) +
      '</td><td><button type="button" class="del" data-id="' + esc(r.id) + '" title="Move to trash" aria-label="Move invoice ' + esc(r.number) + ' to trash">&times;</button></td></tr>').join("") +
    '</tbody><tfoot><tr><td colspan="3">Total (' + income.length + ')</td><td class="amt">' + money(total) + '</td><td></td></tr></tfoot></table></div>';
}

function renderProfit(){
  const inc = income.reduce((s, r) => s + r.total, 0);
  const exp = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  const net = inc - exp;
  $("profitBox").innerHTML = '<div class="pl">' +
    '<div><div class="lbl">Income</div><div class="big">' + money(inc) + '</div></div>' +
    '<div><div class="lbl">Expenses</div><div class="big">' + money(exp) + '</div></div>' +
    '<div><div class="lbl">Profit</div><div class="big ' + (net < 0 ? "neg" : "pos") + '">' + (net < 0 ? "-" : "") + money(Math.abs(net)) + '</div></div>' +
    '</div>';
}

async function loadMonth(){
  $("monthLab").textContent = monthName();
  $("listHead").textContent = "Expenses \u2014 " + monthName();
  $("list").innerHTML = '<div class="msg">Loading&hellip;</div>';
  const inc = loadIncome();
  try {
    const snap = await getDocs(query(collection(db, "expenses"), where("month", "==", monthKey())));
    rows = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(a.date).localeCompare(String(b.date)));
    render();
  } catch (e) {
    console.error(e);
    rows = [];
    $("list").innerHTML = '<div class="msg err">Could not load: ' + esc(e.message) + '</div>';
  }
  await inc;
  renderProfit();
}

function render(){
  if (!rows.length) { $("list").innerHTML = '<div class="msg">Nothing logged for ' + esc(monthName()) + ' yet.</div>'; return; }
  const total = rows.reduce((s, r) => s + (Number(r.amount) || 0), 0);
  $("list").innerHTML = '<div class="tablewrap"><table><thead><tr>' +
    '<th>Date</th><th>Vendor</th><th>Category</th><th class="pw">Paid with</th><th class="pw">Ref #</th><th class="amt">Amount</th></tr></thead><tbody>' +
    rows.map(r => '<tr class="exrow" data-id="' + esc(r.id) + '"><td>' + esc(String(r.date || "").replace(/^\d{4}-0?(\d{1,2})-0?(\d{1,2})$/, "$1/$2")) + '</td><td><span class="vname">' + esc(r.vendor) + '</span>' +
      '</td><td>' + esc(r.category) +
      '</td><td class="pw">' + esc(r.paidWith) + '</td><td class="pw ref">' + esc(r.ref) + '</td><td class="amt">' + money(r.amount) +
      (r.receiptPath ? '<div><a href="#" class="rcpt" data-path="' + esc(r.receiptPath) + '">Receipt</a></div>' : '') +
      '</td></tr>').join("") +
    '</tbody><tfoot><tr><td colspan="3">Total (' + rows.length + ')</td><td class="pw"></td><td class="pw"></td><td class="amt">' + money(total) + '</td></tr></tfoot></table></div>';
}

$("toggleForm").addEventListener("click", () => {
  const open = $("formWrap").hidden;
  $("formWrap").hidden = !open;
  $("toggleForm").setAttribute("aria-expanded", String(open));
  $("toggleForm").textContent = open ? "Close" : "+ Add a payment";
});

/* Scan a receipt: photo -> shrink -> Storage receipts/ -> readReceipt fills the form. Nothing saves until Save. */
async function shrink(file, max = 2400){
  const img = await createImageBitmap(file);
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
}
$("scanBtn").addEventListener("click", () => $("scanFile").click());       // opens the camera
$("uploadBtn").addEventListener("click", () => $("uploadFile").click());   // picks a photo already on the phone
["scanFile", "uploadFile"].forEach(id => $(id).addEventListener("change", async () => {
  const file = $(id).files[0];
  $(id).value = "";
  if (!file) return;
  const msg = $("scanMsg"), btn = $("scanBtn");
  btn.disabled = true; $("uploadBtn").disabled = true; msg.className = "msg"; msg.textContent = "Uploading\u2026";
  try {
    const blob = await shrink(file);
    const path = "receipts/" + todayStr().slice(0, 7) + "/" + Date.now() + ".jpg";
    await uploadBytes(sRef(storage, path), blob, { contentType: "image/jpeg" });
    pendingReceipt = path;   // photo rides with the entry even if reading fails and he types it in
    msg.textContent = "Reading receipt\u2026";
    const r = (await readReceipt({ path })).data || {};
    if (r.date) $("fDate").value = r.date;
    if (r.vendor) $("fVendor").value = r.vendor;
    if (r.total) $("fAmount").value = r.total.toFixed(2);
    if (r.category) $("fCat").value = r.category;
    $("fNotes").value = (r.items || []).join(", ");
    $("formWrap").hidden = false;
    $("toggleForm").setAttribute("aria-expanded", "true");
    $("toggleForm").textContent = "Close";
    msg.textContent = "Check it over, then Save.";
  } catch (e) {
    console.error(e);
    msg.className = "msg err"; msg.textContent = "Could not read receipt: " + e.message;
  } finally { btn.disabled = false; $("uploadBtn").disabled = false; }
}));

$("saveBtn").addEventListener("click", async () => {
  const date = $("fDate").value, vendor = $("fVendor").value.trim(), amount = Math.round(parseFloat($("fAmount").value) * 100) / 100;
  const msg = $("formMsg");
  if (!date || !vendor || !(amount > 0)) { msg.className = "msg err"; msg.textContent = "Date, vendor and amount are required."; return; }
  const btn = $("saveBtn"); btn.disabled = true; msg.className = "msg"; msg.textContent = "Saving\u2026";
  try {
    /* Same amount on the same day, or same vendor within a week: ask before saving it again. */
    const dupes = await findDupes({ collection, query, where, getDocs }, db, { date, vendor, amount }).catch(() => []);
    if (!confirmDupes({ date, vendor, amount }, dupes)) { msg.textContent = "Not saved (duplicate)."; return; }
    await addDoc(collection(db, "expenses"), {
      date, month: date.slice(0, 7), vendor, amount,
      category: $("fCat").value, paidWith: $("fPaid").value,
      ref: $("fRef").value.trim(), notes: $("fNotes").value.trim(),
      receiptPath: pendingReceipt,
      createdBy: auth.currentUser ? auth.currentUser.email || auth.currentUser.uid : "",
      createdAt: serverTimestamp()
    });
    $("fVendor").value = ""; $("fAmount").value = ""; $("fRef").value = ""; $("fNotes").value = "";
    pendingReceipt = ""; $("scanMsg").textContent = "";
    msg.textContent = "Saved.";
    const [y, m] = date.split("-").map(Number);
    cur = { y, m };
    await loadMonth();
  } catch (e) {
    console.error(e);
    msg.className = "msg err"; msg.textContent = "Could not save: " + e.message;
  } finally { btn.disabled = false; }
});

/* ---- Income & Expenses Trash ----
   Its own bin, separate from the Dashboard's: rows go into the shared "trash" collection
   tagged trashBin: "income", and the Dashboard Trash leaves those out. × sends an item here
   with no pop-up; Restore puts it back where it came from. No manual erase — anything
   trashed more than 30 days ago is erased when this page loads. */
const TRASH_DAYS = 30;
const tsMs = t => t && typeof t.toMillis === "function" ? t.toMillis() : 0;
const daysLeft = r => { const t = tsMs(r.trashedAt); return t ? TRASH_DAYS - Math.floor((Date.now() - t) / 864e5) : null; };
const leftLabel = r => { const d = daysLeft(r); return d === null ? "" : d <= 1 ? "Erased tomorrow" : "Erased in " + d + " days"; };
let trashRows = [];

async function moveToTrash(from, id){
  const ref = doc(db, from, id), src = await getDoc(ref);
  if (!src.exists()) return;
  await setDoc(doc(db, "trash", id), Object.assign({}, src.data(), {
    trashedFrom: from, trashBin: "income", trashedAt: serverTimestamp()
  }));
  await deleteDoc(ref);
}

async function loadTrash(){
  try {
    const snap = await getDocs(query(collection(db, "trash"), where("trashBin", "==", "income")));
    const keep = [];
    for (const d of snap.docs) {
      const r = { id: d.id, ...d.data() }, left = daysLeft(r);
      if (left !== null && left <= 0) {
        try { await deleteDoc(doc(db, "trash", r.id)); continue; }
        catch (e) { console.error("Could not erase trash " + r.id, e); }
      }
      keep.push(r);
    }
    trashRows = keep.sort((a, b) => tsMs(b.trashedAt) - tsMs(a.trashedAt));
  } catch (e) { console.error(e); trashRows = null; }
  renderTrash();
}

function renderTrash(){
  $("trashCount").textContent = trashRows && trashRows.length ? "(" + trashRows.length + ")" : "";
  if (trashRows === null) { $("trashList").innerHTML = '<div class="msg err">Could not load the trash.</div>'; return; }
  if (!trashRows.length) { $("trashList").innerHTML = '<div class="msg">The trash is empty.</div>'; return; }
  $("trashList").innerHTML = '<div class="tablewrap"><table><thead><tr><th>Type</th><th>Who</th><th>Ref</th><th class="amt">Amount</th><th>Erased</th><th></th></tr></thead><tbody>' +
    trashRows.map(r => { const inc = r.trashedFrom === "paidInvoices";
      return '<tr><td>' + (inc ? "Income" : "Expense") + '</td><td>' + esc(inc ? ((r.customer && r.customer.name) || "No name") : r.vendor) +
        '</td><td>' + esc(inc ? r.number : r.date) + '</td><td class="amt">' + money(inc ? r.total : r.amount) +
        '</td><td class="note">' + esc(leftLabel(r)) + '</td><td><button type="button" class="ghost restore" data-id="' + esc(r.id) + '">Restore</button></td></tr>'; }).join("") +
    '</tbody></table></div>';
}

$("trashBtn").addEventListener("click", () => {
  const open = $("trashBox").hidden;
  $("trashBox").hidden = !open;
  $("trashBtn").setAttribute("aria-expanded", String(open));
});

$("trashList").addEventListener("click", async e => {
  const b = e.target.closest(".restore");
  if (!b) return;
  b.disabled = true;
  try {
    const ref = doc(db, "trash", b.dataset.id), src = await getDoc(ref);
    if (src.exists()) {
      const d = Object.assign({}, src.data()), back = d.trashedFrom;
      delete d.trashedFrom; delete d.trashedAt; delete d.trashBin;
      if (back === "paidInvoices" || back === "expenses") { await setDoc(doc(db, back, b.dataset.id), d); await deleteDoc(ref); }
    }
    await Promise.all([loadMonth(), loadTrash()]);
  } catch (err) { console.error(err); b.disabled = false; alert("Could not restore: " + err.message); }
});

/* × on an Income or Expenses row: straight to this page's Trash, no pop-up, stay put. */
async function trashRow(from, b){
  b.disabled = true;
  try { await moveToTrash(from, b.dataset.id); await Promise.all([loadMonth(), loadTrash()]); }
  catch (err) { console.error(err); b.disabled = false; alert("Could not move to Trash: " + err.message); }
}
$("list").addEventListener("click", e => { const b = e.target.closest(".del"); if (b) trashRow("expenses", b); });
/* Receipt photo button (inside the digital receipt): open the saved photo in a new tab (window opened first so phones don't block it). */
$("itemsBox").addEventListener("click", async e => {
  const a = e.target.closest(".rcpt"); if (!a) return;
  e.preventDefault();
  const w = window.open("", "_blank");
  try { const url = await getDownloadURL(sRef(storage, a.dataset.path)); if (w) w.location = url; else location.href = url; }
  catch (err) { console.error(err); if (w) w.close(); alert("Could not open receipt: " + err.message); }
});
/* Digital receipt: tap a row, Items or Receipt to see everything saved for that expense (full screen on phones). */
$("list").addEventListener("click", e => {
  if (e.target.closest(".del")) return;
  const tr = e.target.closest("tr.exrow"); if (!tr) return;
  e.preventDefault();
  const r = rows.find(x => x.id === tr.dataset.id); if (!r) return;
  const md = String(r.date || "").replace(/^\d{4}-0?(\d{1,2})-0?(\d{1,2})$/, "$1/$2");
  const items = String(r.notes || "").split(/\s*,\s*|\n+/).filter(Boolean);
  const line = (k, v) => v ? '<div class="rl"><span>' + k + '</span><b>' + esc(v) + '</b></div>' : '';
  $("itemsTitle").textContent = "Receipt";
  $("itemsBody").innerHTML =
    '<div class="rvendor">' + esc(r.vendor || "No vendor") + '</div>' +
    line("Date", md) + line("Category", r.category) + line("Paid with", r.paidWith) + line("Ref #", r.ref) +
    (items.length ? '<div class="rsub">Items</div><ul class="ritems">' + items.map(i => '<li>' + esc(i) + '</li>').join("") + '</ul>' : '') +
    '<div class="rl rtotal"><span>Total</span><b>' + money(r.amount) + '</b></div>' +
    (r.receiptPath ? '<button type="button" class="ghost rcpt" data-path="' + esc(r.receiptPath) + '">View receipt</button>' : '') +
    '<label class="rmemo">Notes<textarea id="memoText" rows="4" placeholder="Add a note">' + esc(r.memo || "") + '</textarea></label>' +
    '<div class="actions"><button type="button" class="new" id="memoSave" data-id="' + esc(r.id) + '">Save note</button><span id="memoMsg" class="msg"></span></div>' +
    '<div class="actions" style="margin-top:18px"><button type="button" class="ghost" id="rDel" data-id="' + esc(r.id) + '" style="color:var(--red)">Delete (move to Trash)</button></div>';
  $("itemsBox").showModal();
});
/* Delete inside the receipt: same as the old row × — goes to this page's Trash, restorable for 30 days. */
$("itemsBox").addEventListener("click", async e => {
  const b = e.target.closest("#rDel"); if (!b) return;
  b.disabled = true;
  try { await moveToTrash("expenses", b.dataset.id); $("itemsBox").close(); await Promise.all([loadMonth(), loadTrash()]); }
  catch (err) { console.error(err); b.disabled = false; alert("Could not move to Trash: " + err.message); }
});
/* Notes on a receipt: saved to the expense as "memo" (the "notes" field holds the items list). */
$("itemsBox").addEventListener("click", async e => {
  const b = e.target.closest("#memoSave"); if (!b) return;
  const memo = $("memoText").value.trim();
  b.disabled = true; $("memoMsg").textContent = "Saving\u2026";
  try {
    await setDoc(doc(db, "expenses", b.dataset.id), { memo }, { merge: true });
    const r = rows.find(x => x.id === b.dataset.id); if (r) r.memo = memo;
    $("memoMsg").textContent = "Saved.";
  } catch (err) { console.error(err); $("memoMsg").textContent = "Could not save: " + err.message; }
  b.disabled = false;
});
$("itemsClose").addEventListener("click", () => $("itemsBox").close());
$("itemsBox").addEventListener("click", e => { if (e.target === $("itemsBox")) $("itemsBox").close(); });
/* Income × asks first: a paid invoice is the real record (it leaves the customer's history too while it's in the Trash). */
$("incList").addEventListener("click", e => { const b = e.target.closest(".del"); if (!b) return;
  if (!confirm("Move this paid invoice to the Trash?\n\nIt leaves Income and the customer's history until you restore it. Restore within 30 days.")) return;
  trashRow("paidInvoices", b); });

/* CSV for the accountant: one row per expense, plain columns. */
$("csvBtn").addEventListener("click", () => {
  if (!rows.length) { alert("Nothing to export for " + monthName() + "."); return; }
  const cell = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const lines = [["Date", "Vendor", "Category", "Paid with", "Invoice/receipt #", "Amount", "Notes"].map(cell).join(",")]
    .concat(rows.map(r => [r.date, r.vendor, r.category, r.paidWith, r.ref, (Number(r.amount) || 0).toFixed(2), r.notes].map(cell).join(",")));
  const blob = new Blob([lines.join("\r\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "khean-expenses-" + monthKey() + ".csv";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

$("prevM").addEventListener("click", () => { cur.m--; if (cur.m < 1) { cur.m = 12; cur.y--; } loadMonth(); });
$("nextM").addEventListener("click", () => { cur.m++; if (cur.m > 12) { cur.m = 1; cur.y++; } loadMonth(); });

/* Page lock. Not signed in -> login page, then back here. */
let started = false;
onAuthStateChanged(auth, user => {
  if (!user) { location.replace("./login.html?next=expenses.html"); return; }
  document.getElementById("authwait")?.remove();
  if (!started) { started = true; loadMonth(); loadTrash(); }
});
</script>
