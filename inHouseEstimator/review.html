<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1b2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="K&amp;C Estimator">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex, nofollow">
<title>Review request &middot; Khean &amp; Clean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&text=%26&display=swap");
:root{--navy:#172239;--gold:#E3B64A;--green:#0F5C3E;--red:#A6402F;--ink:#1c2230;--muted:#5f6675;--line:#dde1e8}
*{box-sizing:border-box}
body{margin:0;background:#eef0f4;color:var(--ink);font:16px/1.55 "Archivo",system-ui,sans-serif}
#authwait{position:fixed;inset:0;background:#eef0f4;z-index:9}
.wrap{max-width:960px;margin:0 auto;padding:22px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.home{display:flex;flex:none;border-radius:6px}
.home img{display:block;width:34px;height:34px;border-radius:6px}
h1{font:700 30px "Cinzel","Playfair Display",Georgia,serif;margin:0;border-bottom:3px solid var(--gold);display:inline-block;padding-bottom:3px}
.new{font:600 15px "Archivo";background:var(--navy);color:#fff;text-decoration:none;border:1px solid var(--navy);border-radius:6px;padding:9px 18px;cursor:pointer}
.new:disabled{opacity:.6;cursor:default}
.ghost{font:600 15px "Archivo";background:#fff;color:var(--navy);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:9px 16px;cursor:pointer}
.panel{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(23,34,57,.08);padding:18px}
.panel h2{font:700 20px "Cinzel","Playfair Display",Georgia,serif;margin:24px 0 12px;border-bottom:2px solid var(--gold);padding-bottom:6px}
.panel h2:first-child{margin-top:0}
.msg,.note{color:var(--muted);font-size:14px}
.note.err{color:var(--red)}
.who{font-weight:700;font-size:18px}
select,textarea{display:block;width:100%;font:16px "Archivo";padding:9px 11px;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff}
textarea{min-height:130px;resize:vertical}
.room{margin-bottom:14px}
.rlab{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
/* Photos in the send. The X in the corner takes one out. Same X as the customer profile. */
.pcell{position:relative;border-radius:10px;overflow:hidden;background:#eef0f4}
.pcell img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
/* Header photo: the whole picture, nothing cut off (it's a tall card). */
#head{grid-template-columns:minmax(0,220px)}
#head .pcell img{aspect-ratio:auto;height:auto;object-fit:contain}
.pcell .tag{position:absolute;left:6px;bottom:6px;font:700 12px "Archivo";background:rgba(10,14,22,.65);color:#fff;border-radius:20px;padding:2px 9px}
.pdel{position:absolute;top:6px;right:6px;width:32px;height:32px;border:2px solid rgba(255,255,255,.6);border-radius:50%;background:rgba(10,14,22,.4);color:#fff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.2)}
.pdel:hover{background:rgba(10,14,22,.75);border-color:#fff}
/* Room picker: one row per room, its After photo as the thumbnail, a box to tick. */
.rlist{border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.rpk{display:flex;align-items:center;gap:12px;padding:8px 12px;border-top:1px solid var(--line);cursor:pointer}
.rpk:first-child{border-top:0}
.rpk input{width:22px;height:22px;flex:none;accent-color:var(--navy)}
.rpk img,.rpk .nothumb{width:56px;height:56px;flex:none;border-radius:6px;object-fit:cover;background:#eef0f4}
.rpk b{flex:1}
.rpk small{color:var(--muted)}
.rpk small.lurl{overflow-wrap:anywhere;text-align:right}
.padd,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
</style>
<link rel="stylesheet" href="./theme-dark.css">
</head>
<body>
<div id="authwait"></div>
<div class="wrap">
  <div class="top">
    <a class="home" href="./hub.html" aria-label="Hub"><img src="../images/icon-180.png" alt=""></a>
    <h1>Review request</h1>
    <a class="ghost" id="back" href="./customers.html" style="margin-left:auto">Back to customer</a>
  </div>
  <div id="view"><div class="msg">Loading&hellip;</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getStorage, ref, getDownloadURL, getBlob, uploadBytes } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";

const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const db = getFirestore(app);
const storage = getStorage(app);
const smsSend = httpsCallable(getFunctions(app, "us-central1"), "smsSend");
const mailSend = httpsCallable(getFunctions(app, "us-central1"), "mailSend");
/* Photos for a text: shrunk to 1200px JPEGs so 5 fit in one picture text. */
function shrink(blob){
  return new Promise(res => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 1200 / Math.max(img.width, img.height)), w = Math.round(img.width * k), h = Math.round(img.height * k);
      const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
      c.toBlob(b => res(b || blob), "image/jpeg", 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); res(blob); };
    img.src = url;
  });
}

/* Opened from the customer's Pre-made texts: ?c=<customer id>&t=<review text, name already filled in>. */
const qs = new URLSearchParams(location.search);
const cid = qs.get("c") || "";
const startText = qs.get("t") || "";
const startJob = qs.get("j") || "";   /* from a job's Request review button: open on that job */

const $ = id => document.getElementById(id);
const view = $("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits = s => String(s || "").replace(/\D/g, "");
const phoneKey = s => { const d = digits(s).slice(-10); return d.length === 10 ? d : ""; };
const listOf = (arr, one) => (Array.isArray(arr) && arr.length ? arr : [one]).map(x => String(x || "").trim()).filter(Boolean);
const phonesOf = c => listOf(c.phones, c.phone);
const telOf = p => { const d = digits(p); return d.length === 10 ? "+1" + d : d; };
const anyMs = t => { if (!t) return null; if (typeof t.toMillis === "function") return t.toMillis(); const n = Date.parse(t); return isNaN(n) ? null : n; };
const money = n => "$" + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const shortDate = ms => ms ? new Date(ms).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "";
/* Job photos live under quick-quote-photos/ (same rule as the other pages). */
const okPath = p => typeof p === "string" && p.startsWith("quick-quote-photos/") && !p.includes("..");

/* Every photo on the page, by key: { label, url, path } for job photos, { label, url, file } for added ones. */
const photos = new Map();
const picked = new Set();
let localNo = 0, jobTok = 0;
let withPh = false;   /* "Add photos to text": off to start. Off = only the header photo goes; the message just asks for the review. */

async function start(){
  if (!cid) { view.innerHTML = '<div class="msg">No customer picked. <a href="./customers.html">Go to Customers</a></div>'; return; }
  $("back").href = "./customers.html#" + encodeURIComponent(cid);
  let c;
  try {
    const s = await getDoc(doc(db, "customers", cid));
    if (!s.exists()) { view.innerHTML = '<div class="msg">Customer not found.</div>'; return; }
    c = { id: cid, ...s.data() };
  } catch (e) { console.error(e); view.innerHTML = '<div class="msg">Could not load: ' + esc(e.message) + '</div>'; return; }

  /* Jobs: same match as the customer's Job History (customer link, or phone on older records). */
  let jobs = [];
  try {
    const pks = phonesOf(c).map(phoneKey).filter(Boolean);
    const snaps = await Promise.all(["invoices", "paidInvoices", "acceptedQuotes"].map(k => getDocs(collection(db, k))));
    jobs = snaps.flatMap((snap, i) => snap.docs.map(d => ({ id: d.id, ...d.data(), paid: i === 1 })))
      .filter(r => r.customerId === c.id || pks.includes(phoneKey(r.customer && r.customer.phone)))
      .map(r => ({ ...r, ms: (r.paid && anyMs(r.paidAt)) || anyMs(r.invoicedAt) || anyMs(r.acceptedAt) || anyMs(r.scheduledDate) || anyMs(r.createdAt) }))
      .sort((a, b) => (b.ms || 0) - (a.ms || 0));
  } catch (e) { console.error("jobs", e); }

  const tel = telOf(phonesOf(c)[0] || "");
  view.innerHTML = '<div class="panel">' +
    '<div class="who">' + esc(c.name || c.business || "Customer") + '</div>' +
    '<div class="msg">' + esc(phonesOf(c)[0] || "No phone on file") + '</div>' +
    /* Order: header photo (the thank-you card, goes out first), message, before & after, your photos. */
    '<h2>Header photo</h2>' +
    '<div id="head" class="pgrid"></div>' +
    '<div class="padd"><button type="button" class="ghost" id="headBtn">Change header photo</button>' +
      '<input type="file" id="headIn" accept="image/*" hidden></div>' +
    '<h2>Message</h2>' +
    '<div class="padd" id="msgPick" style="margin-bottom:8px"><button type="button" class="ghost" data-msg="left">Just left</button>' +
      '<button type="button" class="ghost" data-msg="follow">Follow-up</button>' +
      '<button type="button" class="ghost" data-msg="late">Late ask</button></div>' +
    '<button type="button" class="ghost" id="linkBtn">Review link: Google</button>' +
    '<div class="rlist" id="linkList" hidden></div>' +
    '<textarea id="txt" style="margin-top:10px">' + esc(startText) + '</textarea>' +
    '<div class="padd"><button type="button" class="ghost" id="phBtn" aria-pressed="false">Add photos to text</button></div>' +
    '<h2>Before &amp; after</h2>' +
    (jobs.length > 1
      ? '<select id="job">' + jobs.map((j, i) => '<option value="' + i + '">' +
          esc([j.number || "Job", shortDate(j.ms), money(j.total)].filter(Boolean).join(" \u00b7 ")) + '</option>').join("") + '</select>'
      : (jobs.length ? '<div class="msg">' + esc([jobs[0].number || "Job", shortDate(jobs[0].ms)].filter(Boolean).join(" \u00b7 ")) + '</div>' : '')) +
    '<div id="ba" style="margin-top:12px"></div>' +
    '<h2>Your photos</h2>' +
    '<div id="mine" class="pgrid"></div>' +
    '<div class="padd"><button type="button" class="ghost" id="addBtn">Add photos</button>' +
      '<button type="button" class="ghost" id="camBtn">Take photo</button>' +
      '<input type="file" id="addIn" accept="image/*" multiple hidden>' +
      '<input type="file" id="camIn" accept="image/*" capture="environment" hidden></div>' +
    '<div class="actions"><button type="button" class="new" id="sendBtn">Text from business</button>' +
      '<button type="button" class="new" id="myBtn">Text from my phone</button>' +
      '<button type="button" class="new" id="mailBtn">Send email</button></div>' +
    '<div class="note" id="say" style="margin-top:8px">No photos in this send yet.</div>' +
  '</div>';

  const say = (t, err) => { const n = $("say"); n.textContent = t; n.classList.toggle("err", !!err); };
  const thumb = (key, o) => '<div class="pcell"><img src="' + esc(o.url) + '" alt="" loading="lazy">' +
    (o.tag ? '<span class="tag">' + esc(o.tag) + '</span>' : '') +
    '<button type="button" class="pdel" data-x="' + esc(key) + '" aria-label="Remove photo">\u00d7</button></div>';
  const sayCount = () => {
    const n = [...picked].filter(k => k !== "h:card").length;
    say(!withPh ? "Photos off: just the header photo and your message. Tap Add photos to text to send the job photos."
      : n ? n + " photo" + (n === 1 ? "" : "s") + " go in a second text. Tap \u00d7 to take one out." : "Photos on, but none picked yet.");
  };

  /* Header photo: a saved preset (settings/reviewRequest.headerPath, the file in Storage presets/).
     Until one is saved it's the thank-you card on the website (images/thank-you-card.jpg).
     Picked to start on every review request; it always goes out first. */
  const CARD = "h:card", HEAD_REF = doc(db, "settings", "reviewRequest");
  const setHead = o => {
    photos.set(CARD, Object.assign({ tag: "Thank you" }, o));
    picked.add(CARD);
    $("head").innerHTML = thumb(CARD, photos.get(CARD));
    sayCount();
  };
  setHead({ url: "../images/thank-you-card.jpg", src: "../images/thank-you-card.jpg" });
  getDoc(HEAD_REF).then(async s => {
    const p = s.exists() && s.data().headerPath;
    if (p && p.startsWith("presets/")) setHead({ url: await getDownloadURL(ref(storage, p)), path: p });
  }).catch(e => console.error("header preset", e));
  /* Change header photo: saved as the new preset for every review request after this. */
  $("headBtn").addEventListener("click", () => $("headIn").click());
  $("headIn").addEventListener("change", async e => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f) return;
    say("Saving the new header photo...");
    try {
      const blob = await shrink(f), p = "presets/review-header-" + Date.now() + ".jpg";
      await uploadBytes(ref(storage, p), blob, { contentType: "image/jpeg" });
      await setDoc(HEAD_REF, { headerPath: p, updatedAt: serverTimestamp() }, { merge: true });
      setHead({ url: await getDownloadURL(ref(storage, p)), path: p });
      say("Saved. This header goes on every review request now.");
    } catch (err) { console.error(err); say("Couldn't save the header photo: " + ((err && err.message) || err), true); }
  });
  const inOrder = () => [...picked].sort((a, b) => (b === CARD) - (a === CARD));   // card first, then the rest as picked
  const sendKeys = () => inOrder().filter(k => withPh || k === CARD);              // photos off: header only
  const blobOf = async o => o.file || (o.src ? await (await fetch(o.src)).blob() : await getBlob(ref(storage, o.path)));

  /* One row per room: its Threshold Before and After photos. Rooms are saved by a code, so they show as Room 1, 2... */
  async function showJob(j){
    const box = $("ba");
    [...photos.keys()].filter(k => k.startsWith("j:")).forEach(k => { photos.delete(k); picked.delete(k); });
    if (!j) { box.innerHTML = '<div class="msg">No jobs on file for this customer.</div>'; sayCount(); return; }
    box.innerHTML = '<div class="msg">Loading photos&hellip;</div>';
    const spots = (j.spots && typeof j.spots === "object") ? j.spots : {};
    const num = k => k.split("-").map(n => String(Number(n) || 0).padStart(4, "0")).join("-");
    const keys = Object.keys(spots).sort((a, b) => num(a).localeCompare(num(b)));
    const tok = ++jobTok;   /* switching jobs mid-load drops the old one's results */
    const rooms = [];
    for (const k of keys) {
      const s = spots[k] || {};
      const bef = (Array.isArray(s.photosBeforeThreshold) ? s.photosBeforeThreshold : []).filter(okPath);
      const aft = (Array.isArray(s.photosAfterThreshold) ? s.photosAfterThreshold : []).filter(okPath);
      /* Starred photos from the room's other photo spots come along too (Before ones with Before). */
      const starSet = new Set(Array.isArray(j.starred) ? j.starred : []);
      Object.keys(s).filter(f => /^photo/.test(f) && !/Threshold$/.test(f) && Array.isArray(s[f])).forEach(f =>
        s[f].filter(p => okPath(p) && starSet.has(p) && !bef.includes(p) && !aft.includes(p)).forEach(p => (/Before|Inspect/i.test(f) ? bef : aft).push(p)));
      if (!bef.length && !aft.length) continue;
      rooms.push({ no: rooms.length + 1, bef, aft, on: false });
    }
    /* Thumbnail for each room in the picker: its After Threshold photo (Before if there's no After). */
    const thumbs = await Promise.all(rooms.map(r => getDownloadURL(ref(storage, r.aft[0] || r.bef[0])).catch(e => { console.error("Thumb", e); return ""; })));
    if (tok !== jobTok) return;
    if (!rooms.length) { box.innerHTML = '<div class="msg">No Threshold photos on this job.</div>'; sayCount(); return; }
    box.innerHTML = '<button type="button" class="ghost" id="roomBtn"></button>' +
      '<div class="rlist" id="roomList">' + rooms.map((r, i) =>
        '<label class="rpk"><input type="checkbox" data-room="' + i + '">' +
          (thumbs[i] ? '<img src="' + esc(thumbs[i]) + '" alt="" loading="lazy">' : '<span class="nothumb"></span>') +
          '<b>Room ' + r.no + '</b><small>' + (r.bef.length + r.aft.length) + ' photo' + (r.bef.length + r.aft.length === 1 ? '' : 's') + '</small></label>').join("") +
      '</div><div id="sendJob" style="margin-top:12px"></div>';
    const roomBtn = () => { $("roomBtn").textContent = "Pick rooms (" + rooms.filter(r => r.on).length + " of " + rooms.length + ")"; };
    /* The photos in the send, grouped by room, each with its X. */
    const drawSend = () => {
      $("sendJob").innerHTML = rooms.filter(r => r.on).map(r => {
        const cells = r.bef.concat(r.aft).map(p => "j:" + p).filter(k => picked.has(k)).map(k => thumb(k, photos.get(k)));
        return cells.length ? '<div class="room"><div class="rlab">Room ' + r.no + '</div><div class="pgrid">' + cells.join("") + '</div></div>' : '';
      }).join("");
      roomBtn(); sayCount();
    };
    /* Tick a room: its Before and After photos go in the send. Untick: they come out. */
    const stars = new Set(Array.isArray(j.starred) ? j.starred : []);
    let starOnly = stars.size > 0;
    const setRoom = async (r, on) => {
      r.on = on;
      const list = r.bef.map(p => ({ path: p, tag: "Before" })).concat(r.aft.map(p => ({ path: p, tag: "After" })));
      if (!on) { list.forEach(x => { photos.delete("j:" + x.path); picked.delete("j:" + x.path); }); drawSend(); return; }
      const urls = await Promise.all(list.map(x => getDownloadURL(ref(storage, x.path)).catch(e => { console.error("Photo " + x.path, e); return null; })));
      if (tok !== jobTok || !r.on) return;
      list.forEach((x, i) => { if (!urls[i]) return; const key = "j:" + x.path; photos.set(key, { url: urls[i], path: x.path, tag: x.tag });
        if (!starOnly || stars.has(x.path)) picked.add(key); });   /* opening with stars: only the starred ones go in */
      drawSend();
    };
    $("roomList").addEventListener("change", e => {
      const cb = e.target.closest("[data-room]");
      if (cb) setRoom(rooms[+cb.dataset.room], cb.checked);
    });
    $("roomBtn").addEventListener("click", () => { $("roomList").hidden = !$("roomList").hidden; });
    /* To start: the job's starred photos (star on the job sheet), with their rooms ticked.
       No stars on this job: the first three rooms, as before. Ticking a room by hand adds all its photos. */
    const startRooms = stars.size ? rooms.filter(r => r.bef.concat(r.aft).some(p => stars.has(p))) : rooms.slice(0, 3);
    /* starOnly stays on until every starting room has loaded, so no room brings in its unstarred photos. */
    Promise.all(startRooms.map(r => { box.querySelector('[data-room="' + rooms.indexOf(r) + '"]').checked = true; return setRoom(r, true); }))
      .then(() => { starOnly = false; });
    roomBtn();
  }
  const ji = Math.max(0, jobs.findIndex(j => j.id === startJob));
  if ($("job")) $("job").value = String(ji);
  showJob(jobs[ji]);
  $("job")?.addEventListener("change", e => showJob(jobs[+e.target.value]));

  /* Your photos: kept on this page only, for this send. Not saved to the customer. */
  const showMine = () => {
    $("mine").innerHTML = [...photos.entries()].filter(([k]) => k.startsWith("l:")).map(([k, o]) => thumb(k, o)).join("");
  };
  const onPick = e => {
    const files = [...e.target.files].filter(f => /^image\//.test(f.type));
    e.target.value = "";
    files.forEach(f => { const key = "l:" + (++localNo); photos.set(key, { url: URL.createObjectURL(f), file: f }); picked.add(key); });
    showMine(); sayCount();
  };
  $("addBtn").addEventListener("click", () => { setPh(true); $("addIn").click(); });
  $("camBtn").addEventListener("click", () => { setPh(true); $("camIn").click(); });
  $("addIn").addEventListener("change", onPick);
  $("camIn").addEventListener("change", onPick);

  /* X: takes that one photo out of the send. Untick and re-tick its room to bring it back. */
  view.addEventListener("click", e => {
    const b = e.target.closest("[data-x]");
    if (!b) return;
    const k = b.dataset.x, o = photos.get(k);
    if (o && o.file) URL.revokeObjectURL(o.url);
    photos.delete(k); picked.delete(k);
    const room = b.closest(".room");
    b.closest(".pcell").remove();
    if (room && !room.querySelector(".pcell")) room.remove();
    sayCount();
  });


  /* Review link: Google by default. Pick another site and the link in the message swaps.
     Same links as the public reviews page. */
  const LINKS = [
    ["Google", "kheanandclean.com/review"],
    ["Yelp", "https://www.yelp.com/biz/khean-and-clean-folsom"],
    ["Nextdoor", "https://nextdoor.com/page/khean-clean-llc/"],
    ["Facebook", "https://www.facebook.com/kheanandclean/reviews/"]
  ];
  let curLink = LINKS[0][1];
  $("linkList").innerHTML = LINKS.map(([n, u], i) =>
    '<label class="rpk"><input type="radio" name="rvl" value="' + i + '"' + (i ? '' : ' checked') + '>' +
    '<b>' + esc(n) + '</b><small class="lurl">' + esc(u.replace(/^https:\/\/(www\.)?/, "")) + '</small></label>').join("");
  $("linkBtn").addEventListener("click", () => { $("linkList").hidden = !$("linkList").hidden; });
  $("linkList").addEventListener("change", e => {
    const [n, u] = LINKS[+e.target.value];
    const t = $("txt");
    t.value = t.value.includes(curLink) ? t.value.replace(curLink, u) : t.value.trimEnd() + " " + u;
    curLink = u;
    $("linkBtn").textContent = "Review link: " + n;
  });

  /* Message buttons: fill the box with one of the saved review messages (first name filled in).
     The review link in it follows whatever site is picked above. You can still edit it after. */
  const first = ((c.name || "").trim().split(/\s+/)[0]) || "there";
  /* "Add photos to text" on: this line goes at the end of the message and the photos go in a second text.
     Off: the line comes out and only the header photo goes. */
  const PHOTO_LINE = "If you'd like, you can save these photos to your phone and add them to your Google review.";
  const PHOTO_RX = /\s*(I've included a few photos from your job if you'd like to add them( to your review)?\.|If you'd like, you can save these photos to your phone and add them to your Google review\.)/g;
  const setPh = on => {
    withPh = on;
    const t = $("txt"), base = t.value.replace(PHOTO_RX, "").trimEnd();
    t.value = on ? (base ? base + "\n\n" : "") + PHOTO_LINE : base;   // its own paragraph
    $("phBtn").classList.toggle("new", on);
    $("phBtn").setAttribute("aria-pressed", String(on));
    $("phBtn").textContent = on ? "\u2713 Photos added to text" : "Add photos to text";
    sayCount();
  };
  setPh(false);   /* starts off (also cleans the line out of older saved wording) */
  $("phBtn").addEventListener("click", () => setPh(!withPh));
  const MSGS = {
    left: "Hi {name}, thanks for having us out today! If you're happy with how everything turned out, a quick Google review would mean a lot to our small family business: kheanandclean.com/review",
    follow: "Hi {name}, hope your floors are still looking great! If you get a minute, a quick review would mean a lot: kheanandclean.com/review And if there's anything else we can help with, just let us know.",
    late: "Hi {name}, it's Israel with Khean & Clean. I know it's been a little while, but I wanted to follow up and see how everything's holding up. If you were happy with the job, a quick Google review would mean a lot to our small family business: kheanandclean.com/review"
  };
  $("msgPick").addEventListener("click", e => {
    const b = e.target.closest("[data-msg]");
    if (!b) return;
    $("txt").value = MSGS[b.dataset.msg].replace(/\{name\}/g, first).replace(LINKS[0][1], curLink);
    setPh(withPh);   /* keeps the photo line in step with the switch */
    $("msgPick").querySelectorAll("[data-msg]").forEach(x => x.classList.toggle("new", x === b));
  });

  /* Send: texts the message and the picked photos from the business line (916) 767-2520.
     Up to 5 photos ride in each picture text; more than 5 go in follow-up texts. */
  $("sendBtn").addEventListener("click", async () => {
    const btn = $("sendBtn"), text = $("txt").value.trim();
    if (!tel) { say("No phone on file.", true); return; }
    if (!text && !picked.size) { say("Type a message or add photos first.", true); return; }
    btn.disabled = true; btn.textContent = "Sending";
    try {
      const uid = getAuth(app).currentUser.uid, paths = [];
      let n = 0;
      for (const k of sendKeys()) {
        const o = photos.get(k);
        if (!o) continue;
        n++;
        say("Getting photo " + n + " of " + picked.size + "...");
        const src = await blobOf(o);
        const blob = await shrink(src);
        const p = "sms-out/" + uid + "/" + Date.now() + "_" + n + ".jpg";
        await uploadBytes(ref(storage, p), blob, { contentType: "image/jpeg" });
        paths.push(p);
      }
      // One text: the message, with the logo card first and the job photos after it.
      // smsSend takes 5 pictures max per text, so the logo card + up to 4 job photos.
      const texts = [{ body: text, media: paths.slice(0, 5) }];
      for (let i = 0; i < texts.length; i++) {
        if (i === 1) await new Promise(r => setTimeout(r, 3000));   // 3 seconds after the review text so it lands first
        say("Sending" + (texts.length > 1 ? " text " + (i + 1) + " of " + texts.length : "") + "...");
        await smsSend({ to: tel, body: texts[i].body, media: texts[i].media });
      }
      say("Sent from (916) 767-2520. It's in Texts.");
      btn.textContent = "Sent";
      return;
    } catch (err) {
      console.error(err);
      say("Couldn't send: " + ((err && err.message) || err), true);
    }
    btn.disabled = false; btn.textContent = "Text from business";
  });

  /* Text from my phone (for friends who know your personal number): opens the phone's share menu
     with the message and picked photos; pick Messages and the contact. Where photos can't be
     shared, it opens Messages to this customer with just the text. Nothing goes through Twilio. */
  $("myBtn").addEventListener("click", async () => {
    const btn = $("myBtn"), text = $("txt").value.trim();
    if (!text && !picked.size) { say("Type a message or add photos first.", true); return; }
    const smsLink = () => { location.href = "sms:" + tel + (/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?") + "body=" + encodeURIComponent(text); };
    btn.disabled = true;
    try {
      const files = [];
      let n = 0;
      for (const k of sendKeys()) {
        const o = photos.get(k);
        if (!o) continue;
        n++;
        say("Getting photo " + n + " of " + picked.size + "...");
        files.push(new File([await shrink(await blobOf(o))], "photo" + n + ".jpg", { type: "image/jpeg" }));
      }
      if (files.length && navigator.canShare && navigator.canShare({ files })) {
        say("Pick Messages, then " + (c.name || "the customer") + ".");
        await navigator.share({ text, files });
      } else {
        if (files.length) say("This device can't share photos from here, so it's the text only.", true);
        smsLink();
      }
    } catch (err) {
      if (!(err && err.name === "AbortError")) { console.error(err); say("Couldn't open your phone's messages: " + ((err && err.message) || err), true); }
    }
    btn.disabled = false;
  });

  /* Send email: same message and photos (attached) to the customer's email, from israel@kheanandclean.com.
     Goes through Zoho, so it's in Mail's Sent folder too. */
  const email = listOf(c.emails, c.email)[0] || "";
  $("mailBtn").addEventListener("click", async () => {
    const btn = $("mailBtn"), text = $("txt").value.trim();
    if (!email) { say("No email on file for this customer.", true); return; }
    if (!text) { say("Type a message first.", true); return; }
    btn.disabled = true; btn.textContent = "Sending";
    try {
      const uid = getAuth(app).currentUser.uid, attachments = [];
      let n = 0;
      for (const k of sendKeys()) {
        const o = photos.get(k);
        if (!o) continue;
        n++;
        say("Getting photo " + n + " of " + picked.size + "...");
        const blob = await shrink(await blobOf(o));
        const p = "mail-out/" + uid + "/" + Date.now() + "_" + n + ".jpg";
        await uploadBytes(ref(storage, p), blob, { contentType: "image/jpeg" });
        attachments.push({ path: p, name: "khean-clean-" + (o.tag || "photo").toLowerCase().replace(/\s+/g, "-") + "-" + n + ".jpg" });
      }
      say("Sending email...");
      await mailSend({ from: "israel@kheanandclean.com", to: email, subject: "How did we do? - Khean & Clean", text, attachments });
      say("Email sent to " + email + ".");
      btn.textContent = "Sent";
      return;
    } catch (err) {
      console.error(err);
      say("Couldn't send the email: " + ((err && err.message) || err), true);
    }
    btn.disabled = false; btn.textContent = "Send email";
  });
}

/* Page lock. Not signed in -> login page. */
let started = false;
onAuthStateChanged(getAuth(app), user => {
  if (!user) { location.replace("./login.html?next=customers.html"); return; }
  $("authwait")?.remove();
  if (!started) { started = true; start(); }
});
</script>
<script src="./tabbar.js" defer></script>
</body>
</html>
