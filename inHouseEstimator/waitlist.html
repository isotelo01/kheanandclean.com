<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Waitlist</title>
<style>
/* Waitlist (Player Tracker proof of concept): every game's list, longest wait on top, plus players who joined
   from their phone and any names whose game list is gone. Names are added on the Floor page (left column).
   Same data as floor.html: playerTracker/waitgames { id: { name, at } }, playerTracker/waitlist { id: { name, game, at } },
   and playerTracker/poc (phone players with status "wait"). Staff only. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 12px;font-size:14px}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
.lists{display:flex;gap:12px;margin-top:16px;align-items:flex-start;overflow-x:auto;padding-bottom:6px}
.lists>.gbox{flex:1 0 240px}
.gbox{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gh b{flex:1;color:var(--gold);font-size:18px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.12)}
.row.call{background:rgba(56,189,248,.12);border-left:4px solid #38bdf8;padding-left:8px}
.row.call .nm b{color:#7dd3fc}
.tag.on{background:var(--ok);color:#000}
.gh .cnt{font-size:13px;color:rgba(255,255,255,.7)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.empty{color:rgba(255,255,255,.6);font-size:14px;padding:10px 0}
input{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;font:inherit}
.hint{color:rgba(255,255,255,.6);font-size:13px}
.wlbl{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.bubs{display:flex;flex-wrap:wrap;gap:6px}
.bub{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:4px 11px;font:700 13px system-ui,sans-serif;cursor:pointer}
.bub.on{background:var(--ok);border-color:var(--ok);color:#000}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <div class="top"><a class="btn ghost sm" href="./player-tracker.html">&lsaquo; Player Tracker</a><h1>Waitlist</h1>
    <a class="btn sm" href="./floor.html" style="margin-left:auto">Floor &rsaquo;</a></div>
  <div class="warn" id="warn">Not syncing with the server.</div>
  <!-- Add a name: Name (players pop up as you type), Phoned in (walk-in if not), the games (tap one or more), then the button. -->
  <div id="addWBox" style="margin-top:14px;display:grid;gap:8px;max-width:420px">
    <input id="wName" list="wPlayers" placeholder="Name" autocomplete="off">
    <datalist id="wPlayers"></datalist>
    <div><button class="bub" id="wPhone" type="button">Phoned in</button> <span class="hint" id="wHow">Walk-in</span></div>
    <div class="wlbl">Games</div><div class="bubs" id="wGames"></div>
    <button class="btn" id="wAdd">+ Add to wait list</button>
  </div>
  <div class="lists" id="lists"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore as fsGetFirestore, initializeFirestore, doc as fsDoc, setDoc, onSnapshot, deleteField } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { ROSTER, DEALERS, CASINO, casinoDoc, withCasino, liveLists, expired, CALL_MS } from "./pt-people.js";   // 200 test players, 10 test dealers
const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents
const app = initializeApp({
  apiKey: "AIzaSyCC1AXsqeWVBS792gor4BA6MLmz1yLypqg",
  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), ROSTREF = doc(db, "playerTracker", "roster"), PROFREF = doc(db, "playerTracker", "profiles");
const WAITREF = doc(db, "playerTracker", "waitlist"), GAMESREF = doc(db, "playerTracker", "waitgames");
const TBLREF = doc(db, "playerTracker", "tables"), LISTREF = doc(db, "playerTracker", "tablelist");   // which tables are open, and their games
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const ago = t => { const m = Math.max(0, Math.floor((Date.now() - t) / 60000)); return m < 1 ? "just now" : m < 60 ? m + "m" : Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; };
const fail = () => { $("warn").style.display = "block"; };
let state = {}, roster = {}, profiles = {}, wait = {}, games = {}, tables = {}, tlist = {};
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || c;
const isPlayer = c => !!(ROSTER[c] || roster[c]);

function draw() {
  /* Phoned-in names are blue, with how long until they drop off (an hour after they called). */
  const row = (w, i) => `<div class="row${w.call ? " call" : ""}">
      <div class="nm"><b>${i + 1}. ${w.src === "app" || w.card ? `<a href="./player-tracker.html?profile=${encodeURIComponent(w.card || w.id)}" style="color:inherit">${esc(w.name)}</a>` : esc(w.name)}</b><span>${w.call
        ? "Phoned in " + (ago(w.at) === "just now" ? "just now" : ago(w.at) + " ago") + " &middot; drops off in " + Math.max(1, Math.ceil((w.at + CALL_MS - Date.now()) / 60000)) + "m" : "waiting " + ago(w.at)}</span></div>
      <button class="btn ghost sm" data-rm="${esc(w.id)}" data-src="${w.src}">Remove</button></div>`;
  const box = (title, list, tag) => `<div class="gbox"><div class="gh"><b>${esc(title)}</b>${tag || ""}<span class="cnt">${list.length} waiting</span></div>
      ${list.length ? list.map(row).join("") : `<div class="empty">Nobody waiting.</div>`}</div>`;
  const gone = Object.keys(wait).filter(id => expired(wait[id]));   // phoned-in, past an hour: drop them
  if (gone.length) { const upd = {}; gone.forEach(id => { upd[id] = deleteField(); delete wait[id]; }); setDoc(WAITREF, upd, { merge: true }).catch(fail); }
  const names = Object.entries(wait).filter(([, v]) => v && v.name).map(([id, v]) => ({ id, name: v.name, game: v.game || "", at: v.at, src: "floor", call: !!v.call, card: v.card || "" }));
  /* Live: open poker tables' games first, then interest lists (game not running, people still on it). */
  let html = liveLists(games, wait, tables, tlist).filter(L => L.open || L.count).map(L => box(L.name, names.filter(w => w.game === L.gid).sort((a, b) => a.at - b.at),
    L.open ? `<span class="tag on">Open</span>` : `<span class="tag">Interest</span>`)).join("");
  const phones = Object.entries(state).filter(([c, p]) => isPlayer(c) && p && p.status === "wait")
    .map(([c, p]) => ({ id: c, name: nameOf(c), at: p.waitAt || Date.now(), src: "app" })).sort((a, b) => a.at - b.at);
  if (phones.length) html += box("From phones", phones);
  const other = names.filter(w => !games[w.game]).sort((a, b) => a.at - b.at);
  if (other.length) html += box("Other", other);
  /* + Add to wait list: every list as a bubble (tap one or more), and every player's name for the pop-up. */
  const all = liveLists(games, wait, tables, tlist);
  for (const g of [...wSel]) if (!all.some(L => L.gid === g)) wSel.delete(g);
  $("wGames").innerHTML = all.length ? all.map(L => `<button class="bub${wSel.has(L.gid) ? " on" : ""}" data-wg="${esc(L.gid)}" type="button">${esc(L.name)}</button>`).join("")
    : `<span class="hint">No games yet. Open a poker table on the Floor page.</span>`;
  const pl = [...new Set([...Object.keys(ROSTER), ...Object.keys(roster)].map(nameOf))].sort();
  if (pl.length !== plCount) { plCount = pl.length; $("wPlayers").innerHTML = pl.map(n => `<option value="${esc(n)}">`).join(""); }
  $("lists").innerHTML = html || `<div class="empty">No lists yet. Open a poker table with its game picked on the Floor page.</div>`;
}
/* + Add to wait list: a name and which game's list. */
const wSel = new Set();   // games picked for + Add to wait list
let plCount = 0, wCall = false;
$("wGames").addEventListener("click", e => {
  const b = e.target.closest("[data-wg]"); if (!b) return;
  const g = b.dataset.wg; if (wSel.has(g)) wSel.delete(g); else wSel.add(g);
  b.classList.toggle("on", wSel.has(g));
});
$("wPhone").onclick = () => { wCall = !wCall; $("wPhone").classList.toggle("on", wCall); $("wHow").textContent = wCall ? "Phoned in: drops off in 1 hour" : "Walk-in"; };
const addToWait = () => {
  const name = $("wName").value.trim(), picked = [...wSel].filter(g => games[g]);
  if (!name) { $("wName").focus(); return; }
  if (!picked.length) { alert("Tap at least one game."); return; }
  const card = [...Object.keys(ROSTER), ...Object.keys(roster)].find(c => nameOf(c).toLowerCase() === name.toLowerCase());
  const upd = {}, now = Date.now();
  picked.forEach((gid, k) => {
    const id = "w" + now + k + Math.random().toString(36).slice(2, 6), v = { name, game: gid, at: now };
    if (wCall) v.call = true;      // phoned in (walk-in is the default)
    if (card) v.card = card;       // a known player
    upd[id] = wait[id] = v;
  });
  setDoc(WAITREF, upd, { merge: true }).catch(fail);
  $("wName").value = ""; $("wName").focus();
  if (wCall) $("wPhone").onclick();   // back to walk-in for the next one
  draw();
};
$("wAdd").onclick = addToWait;
$("wName").onkeydown = e => { if (e.key === "Enter") addToWait(); };
document.addEventListener("click", e => {
  const rm = e.target.closest("[data-rm]"); if (!rm) return;
  const id = rm.dataset.rm;
  if (rm.dataset.src === "app") { const p = state[id] || {}; setDoc(REF, { [id]: { ...p, status: "out", waitAt: null } }, { merge: true }).catch(fail); }
  else setDoc(WAITREF, { [id]: deleteField() }, { merge: true }).catch(fail);
});

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  if (!u) { location.replace("./login.html?next=waitlist.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  document.body.style.visibility = "visible";
  draw();
  const on = (ref, set) => onSnapshot(ref, snap => { $("warn").style.display = "none"; set(snap.exists() ? snap.data() : {}); draw(); }, fail);
  on(REF, v => state = v); on(WAITREF, v => wait = v); on(GAMESREF, v => games = v); on(TBLREF, v => tables = v); on(LISTREF, v => tlist = v);
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  setInterval(draw, 30000);   // keep the wait times ticking
});
</script>
</body>
</html>
