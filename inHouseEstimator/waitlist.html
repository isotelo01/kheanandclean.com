<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="48x48">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172239">
<meta name="robots" content="noindex, nofollow">
<title>Waitlist</title>
<style>
/* Waitlist (Player Tracker proof of concept): every game's list, longest wait on top, plus players who joined
   from their phone and any names whose game list is gone. Names are added on the Floor page (left column).
   Same data as floor.html: playerTracker/waitgames { id: { name, at } }, playerTracker/waitlist { id: { name, game, at } },
   and playerTracker/poc (phone players with status "wait"). Staff only. */
:root{--navy:#172239;--gold:#E3B64A;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box}
/* Always landscape: when the screen is upright, the whole page is turned sideways (same as Dealer Control). */
html.turned body{position:fixed;top:0;left:0;transform-origin:0 0;transform:rotate(90deg) translateY(-100%);overflow:auto;box-sizing:border-box}
body{margin:0;background:var(--navy);color:#fff;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:calc(env(safe-area-inset-top) + 12px) 16px 40px}
.wrap{max-width:none;margin:0 auto}   /* wide screen: use the whole width */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:26px;color:var(--gold)}
.btn{display:inline-block;background:var(--gold);color:#000;border:0;border-radius:999px;padding:10px 16px;font:700 15px system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold)}
.btn.sm{padding:6px 12px;font-size:14px}
.warn{background:#5a1d1d;border:1px solid var(--bad);border-radius:10px;padding:10px;font-size:14px;margin-top:12px;display:none}
/* Top: left column (title, favorites, add-a-name form) and the floor plan in the page's top-right corner.
   Underneath, the board: the game lists on a 12-column grid. On a phone everything stacks. */
.hdr{display:grid;grid-template-columns:minmax(260px,3fr) minmax(230px,3fr) minmax(230px,3fr) minmax(460px,4fr);gap:12px;align-items:stretch}   /* add-a-name | dealers | promotions | floor plan */
.drow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}.drow:last-child{border-bottom:0}
.drow b{flex:1;min-width:0;font-weight:600}.drow span{font-size:13px;color:rgba(255,255,255,.65)}
.drow .mini.brk{border-color:#3b82f6;color:#93c5fd}.drow .mini.brk.on{background:#3b82f6;color:#000}
.drow .onbrk{color:#93c5fd}
.drow .mini{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:2px 8px;cursor:pointer;font:600 13px system-ui,sans-serif}
select{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:8px;font:inherit}
.hl{display:flex;flex-direction:column;gap:10px;min-width:0}
.hl .favs{margin-top:0}
.hl .wdg{flex:1}
.hdr .wdg[data-w="floor"]{height:560px}
@media (max-width:760px){html:not(.turned) .hdr{grid-template-columns:1fr}html:not(.turned) .hdr .wdg[data-w="floor"]{height:420px}}
/* Lists: one row, five across the page; more than five keep going to the right with a scroll bar. */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 48px) / 5);grid-template-rows:minmax(360px,auto);gap:12px;margin-top:14px;overflow-x:auto;padding-bottom:8px}
/* Scroll bar on top of the lists: flip the row upside down (bar goes to the top), then flip each list back. */
.board{transform:rotateX(180deg)}.board>.wdg{transform:rotateX(180deg)}
.board::-webkit-scrollbar{height:12px}.board::-webkit-scrollbar-thumb{background:rgba(227,182,74,.5);border-radius:6px}.board::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:6px}
.wdg{position:relative;background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px;overflow:auto;min-width:0}
.wdg button,.wdg a,.wdg input{cursor:pointer}.wdg input{cursor:text}
.wdg[data-w="floor"]{display:flex;flex-direction:column;padding-bottom:6px}
.wdg[data-w="floor"] iframe{flex:1;width:100%;border:0;border-radius:8px;background:transparent;min-height:0;overflow:hidden}
.wdg[data-w="floor"]{overflow:hidden;background:none;border:0;padding:0}   /* no frame: just the tables floating */
.fopen{position:absolute;top:0;right:0;z-index:2}   /* Open in the top-right corner, over the plan's spot (the plan stays centered) */
@media (max-width:760px){html:not(.turned) .board,html:not(.turned) .board>.wdg{transform:none}html:not(.turned) .board{grid-auto-flow:row;grid-auto-columns:auto;grid-template-columns:1fr;grid-template-rows:none;grid-auto-rows:auto;overflow-x:visible}html:not(.turned) .wdg{grid-column:1/-1!important;grid-row:auto!important}
  html:not(.turned) .wdg[data-w="floor"]{height:420px}}
.tbls{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tb{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.75)}
.tb.seat{background:rgba(74,222,128,.15);color:var(--ok)}
/* Favorite games under the Games button: live (a table open running it) = green, not live = clear. */
[hidden]{display:none!important}
#seatModal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
#seatModal .sm-in{background:#0b1220;border:1px solid var(--gold);border-radius:14px;padding:14px 16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#seatModal .sm-h{display:flex;align-items:center;margin-bottom:8px}#seatModal .sm-h b{flex:1;color:var(--gold);font-size:18px}
#seatModal .x{background:none;border:0;color:rgba(255,255,255,.7);font-size:26px;line-height:1;cursor:pointer}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin:6px 0 14px}
.sgrid button{border:1px solid var(--ok);background:rgba(74,222,128,.12);color:#fff;border-radius:10px;padding:10px 4px;font:700 16px system-ui,sans-serif;cursor:pointer}
.sgrid button:disabled{border-color:rgba(255,255,255,.15);background:none;color:rgba(255,255,255,.35);cursor:default;font-size:12px}
.sgrid button span{display:block;font-size:11px;font-weight:600}
.favs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fav{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;border-radius:999px;padding:5px 12px;font:700 13px system-ui,sans-serif;cursor:pointer}
.fav.live{background:var(--ok);border-color:var(--ok);color:#000}
#pgBox{margin-top:10px}
.gbox{background:#0b1220;border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px 12px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.gh b{flex:1;color:var(--gold);font-size:18px}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.12)}
.row.call{background:rgba(56,189,248,.12);border-left:4px solid #38bdf8;padding-left:8px}
.row.call .nm b{color:#7dd3fc}
.tag.on{background:var(--ok);color:#000}
.gh .cnt{font-size:13px;color:rgba(255,255,255,.7)}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row:last-child{border-bottom:0}
.row .nm{flex:1;min-width:0}
.row .nm span{display:block;font-size:13px;color:rgba(255,255,255,.65)}
.empty{color:rgba(255,255,255,.6);font-size:14px;padding:10px 0}
input{background:#000;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:10px;padding:10px;font:inherit}
.hint{color:rgba(255,255,255,.6);font-size:13px}
.wlbl{font-size:11px;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
.bubs{display:flex;flex-wrap:wrap;gap:6px}
/* Game buttons in the add-a-name box: an even grid, two across, each with an x to remove it. */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.wgrid .bub{display:flex;align-items:center;gap:6px;text-align:left;width:100%}.wgrid .bub span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wgrid .bub i{font-style:normal;opacity:.6;font-size:15px;line-height:1;padding:0 2px}.wgrid .bub i:hover{opacity:1}
a.bub{text-decoration:none;display:inline-block}
/* Live games (a table open running it) on top in green; a game you've tapped turns blue. */
.wgrid .bub.live{background:var(--ok);border-color:var(--ok);color:#000}
.wgrid .bub.on{background:#38bdf8;border-color:#38bdf8;color:#000}
.bub{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:999px;padding:4px 11px;font:700 13px system-ui,sans-serif;cursor:pointer}
.bub.on{background:var(--ok);border-color:var(--ok);color:#000}
</style>
</head>
<body style="visibility:hidden">
<div class="wrap">
  <!-- Header area: title, favorites and the add-a-name form on the left; the floor plan in the top-right corner of the page. -->
  <div class="hdr"><div class="hl">
  <div class="favs" id="favs" hidden></div>   <!-- favorites row: hidden for a clean page -->
  <div class="warn" id="warn">Not syncing with the server.</div>
  <!-- Add a name: Name (players pop up as you type), Phoned in (walk-in if not), the games (tap one or more), then the button. -->
  <div class="wdg" data-w="form">
  <div id="addWBox" style="display:grid;gap:8px">
    <input id="wName" list="wPlayers" placeholder="Name" autocomplete="off">
    <datalist id="wPlayers"></datalist>
    <div class="bubs"><button class="bub" id="wPhone" type="button">Phoned in</button><a class="bub" id="wHist" href="./wait-history.html">History</a> <span class="hint" id="wHow"></span></div>
    <div class="wlbl">Games</div><div class="wgrid" id="wGames"></div>

    <div id="dupBox" hidden style="border:1px solid var(--bad);border-radius:10px;padding:8px 10px;display:grid;gap:6px">
      <div><b style="color:var(--bad)">Duplicate</b> <span class="hint" id="dupMsg"></span></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><input id="dupInit" maxlength="3" placeholder="Last initial" style="width:110px" autocomplete="off">
        <button class="btn sm" id="dupAdd" type="button">Add with initial</button><button class="btn ghost sm" id="dupSame" type="button">Same person</button></div>
    </div>
    <button class="btn" id="wAdd">+ Add to wait list</button>
  </div></div>
  </div>
  <!-- Dealers: who's dealing now (and at which table), and the dealer rotation (next up on top). -->
  <div class="wdg" data-w="dealers" style="display:flex;flex-direction:column;gap:8px">
    <div class="wlbl">Active dealers</div><div id="dActive"></div>
    <div class="wlbl">Rotation</div><div id="dRot"></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap"><select id="dPick" style="flex:1;min-width:0"></select><button class="btn sm" id="dAdd">Add</button><button class="btn ghost sm" id="dNext" title="Top dealer goes to the bottom">Rotate</button></div>
  </div>
  <!-- Promotions: players given a promotion today (from the Promotions page), newest first. -->
  <div class="wdg" data-w="promos" style="display:flex;flex-direction:column;gap:6px">
    <div style="display:flex;align-items:center"><div class="wlbl" style="flex:1">Promotions today</div><a class="btn ghost sm" href="./promotions.html" target="_blank">Promotions &rsaquo;</a></div>
    <div id="prList"></div>
  </div>
  <div class="wdg" data-w="floor"><div class="fopen"><a class="btn ghost sm" href="./floor.html" target="_blank">Open &rsaquo;</a></div><iframe id="floorFrame" title="Floor plan"></iframe></div>
  </div>
  <div id="pgBox" hidden></div>   <!-- the Games menu (pg-menu.js, same as the Floor page) -->
  <!-- The game lists, underneath. -->
  <div class="board" id="board"></div>
</div>
<script type="module">

const doc = casinoDoc(fsDoc);   // this casino's Player Tracker documents

  document.body.style.width = t ? innerHeight + "px" : "";
  document.body.style.height = t ? innerWidth + "px" : "";
}
fitTurn(); addEventListener("resize", fitTurn);

  authDomain: "khean-estimator-78f3e.firebaseapp.com",
  projectId: "khean-estimator-78f3e",
  storageBucket: "khean-estimator-78f3e.firebasestorage.app",
  messagingSenderId: "581692353222",
  appId: "1:581692353222:web:21f62f057ac5506bbb45c7"
});
const STAFF = ["6lZy8VTy4gTBeLg4HrEGnTNPixg1", "eoYah1xNcaT7R4lAMOVFFMS7ITN2", "p0cjvQnfHiWXDxRvMuAWm5dyb9e2"];
const getFirestore = a => { try { return initializeFirestore(a, /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ? { experimentalForceLongPolling: true } : {}); } catch (e) { return fsGetFirestore(a); } };
const db = getFirestore(app);
const REF = doc(db, "playerTracker", "poc"), ROSTREF = doc(db, "playerTracker", "roster"), PROFREF = doc(db, "playerTracker", "profiles");

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const fail = () => { $("warn").style.display = "block"; };
let state = {}, roster = {}, profiles = {}, wait = {}, games = {}, tables = {}, tlist = {};
/* Seats at each table: same starter tables as the Floor page, plus tables added or edited there (tablelist). */
const BASE_SEATS = CASINO !== "edh" ? {} : { 1: 7, 2: 7, 3: 9, 4: 7, 5: 7 };
const BASE_GAME = CASINO !== "edh" ? {} : { 1: "Blackjack", 2: "Baccarat", 3: "Poker", 4: "Three Card Poker", 5: "Ultimate Texas Hold'em" };
/* Open poker tables running a game, with how many seats are open at each: [{ n, open }]. */
const tablesFor = name => Object.entries(tlist || {})
  .filter(([n, t]) => t && t.variant && !t.deleted && tables[n] && tables[n].open && (t.stakes ? t.stakes + " " : "") + t.variant === name)
  .map(([n, t]) => { const seats = Array.isArray(t.seats) ? t.seats.length : BASE_SEATS[n] || 0;
    const sat = Object.entries(state).filter(([c, p]) => isPlayer(c) && p && p.status === "seated" && String(p.table || 1) === String(n)).length;   // players only, not the dealer
    return { n, open: Math.max(0, seats - sat) }; })
  .sort((a, b) => a.n - b.n);
const nameOf = c => (profiles[c] && profiles[c].name) || (roster[c] && roster[c].name) || ROSTER[c] || c;
const isPlayer = c => !!(ROSTER[c] || roster[c]);

/* List order: live games first, interest games after. Inside each, grouped by the exact game in the Games menu order
   (No-Limit Hold'em together, Limit Hold'em, Pot-Limit Omaha, ...), then table games, then lowest stakes first. */
const gameKey = name => {
  const m = String(name).match(/^(\d+(?:\.\d+)?(?:\/\d+(?:\.\d+)?)+)\s+(.*)$/), v = m ? m[2] : String(name);
  let gi = pgAll().findIndex(id => pgName(id) === v);
  if (gi < 0) { const t = Object.values(TABLE_GAMES).indexOf(v); gi = 1000 + (t < 0 ? 99 : t); }
  return { gi, v, st: m ? m[1].split("/").map(Number) : [] };

const byGame = (a, b) => {
  if (!!b.open !== !!a.open) return b.open ? 1 : -1;
  const x = gameKey(a.name), y = gameKey(b.name);

function draw() {
  /* Phoned-in names are blue, with how long until they drop off (an hour after they called). */
  const row = (w, i) => `<div class="row${w.call ? " call" : ""}">
      <div class="nm"><b>${i + 1}. ${w.src === "app" || w.card ? `<a href="./player-tracker.html?profile=${encodeURIComponent(w.card || w.id)}" style="color:inherit">${esc(w.name)}</a>` : esc(w.name)}</b><span>${w.call
        ? "Phoned in " + (ago(w.at) === "just now" ? "just now" : ago(w.at) + " ago") + " &middot; drops off in " + Math.max(1, Math.ceil((w.at + CALL_MS - Date.now()) / 60000)) + "m" : "waiting " + ago(w.at)}</span></div>
      ${w.call ? `<button class="btn sm" data-arr="${esc(w.id)}" title="They're here">Arrived</button>` : ""}${w.src === "floor" && games[w.game] && seatTables(games[w.game].name).length ? `<button class="btn sm" data-seat="${esc(w.id)}" title="Pick a seat">Seat</button>` : ""}<button class="btn ghost sm" data-rm="${esc(w.id)}" data-src="${w.src}">Remove</button></div>`;
  /* Under each game: its table numbers, and how many seats are open at each. */
  const tblLine = name => { const T = tablesFor(name); return T.length ? `<div class="tbls">${T.map(t => `<span class="tb${t.open ? " seat" : ""}">Table ${esc(t.n)} &middot; ${t.open ? t.open + (t.open > 1 ? " seats" : " seat") + " open" : "Full"}</span>`).join("")}</div>` : ""; };
  const box = (id, title, list, tag) => ({ id, html: `<div class="gh"><b>${esc(title)}</b>${tag || ""}<span class="cnt">${list.length} waiting</span></div>${tag ? tblLine(title) : ""}
      ${list.length ? list.map(row).join("") : `<div class="empty">Nobody waiting.</div>`}` });
  const gone = Object.keys(wait).filter(id => expired(wait[id]));   // phoned-in, past an hour: drop them
  if (gone.length) { const upd = {}; gone.forEach(id => { upd[id] = deleteField(); delete wait[id]; }); setDoc(WAITREF, upd, { merge: true }).catch(fail); }
  const names = Object.entries(wait).filter(([, v]) => v && v.name).map(([id, v]) => ({ id, name: v.name, game: v.game || "", at: v.at, src: "floor", call: !!v.call, card: v.card || "" }));
  /* Live: open poker tables' games first, then interest lists (game not running, people still on it). */
  const items = liveLists(games, wait, tables, tlist).filter(L => L.open || L.count).sort(byGame).map(L => box(L.gid, L.name, names.filter(w => w.game === L.gid).sort((a, b) => a.at - b.at),
    L.open ? `<span class="tag on">Open</span>` : `<span class="tag">Interest</span>`));
  const phones = Object.entries(state).filter(([c, p]) => isPlayer(c) && p && p.status === "wait")
    .map(([c, p]) => ({ id: c, name: nameOf(c), at: p.waitAt || Date.now(), src: "app" })).sort((a, b) => a.at - b.at);
  if (phones.length) items.unshift(box("phones", "From phones", phones));   // phones first, then the game lists
  const other = names.filter(w => !games[w.game]).sort((a, b) => a.at - b.at);
  if (other.length) items.push(box("other", "Other", other));
  /* + Add to wait list: every list as a bubble (tap one or more), and every player's name for the pop-up. */
  const all = liveLists(games, wait, tables, tlist);

  const openT = Object.keys({ ...BASE_GAME, ...tlist }).filter(n => tables[n] && tables[n].open && !(tlist[n] && tlist[n].deleted)).map(n => tlist[n] || {});
  const favChip = (name, liveStakes, live) => `<button class="fav${live ? " live" : ""}" data-favopen>${esc(name)}${liveStakes.length ? " &middot; " + liveStakes.map(esc).join(", ") : ""}</button>`;
  $("favs").innerHTML = [
    /* Each stake is its own bubble ("1/2 No-Limit Hold'em", "2/3 No-Limit Hold'em"): stakes with a list or running at an open table.

    ...pgAll().filter(id => pg.fav[id]).flatMap(id => {
      const nm = pgName(id), run = openT.filter(t => t.variant === nm).map(t => t.stakes).filter(Boolean);
      const st = [...new Set([...stakesFor(id).filter(s => listFor(s + " " + nm)), ...run])];
      return st.length ? st.map(s => favChip(s + " " + nm, [], run.includes(s))) : [favChip(nm, [], openT.some(t => t.variant === nm))];
    }),
    ...Object.entries(TABLE_GAMES).filter(([id]) => pg.fav[id]).map(([, nm]) => favChip(nm, [], Object.keys({ ...BASE_GAME, ...tlist }).some(n => tables[n] && tables[n].open && !(tlist[n] && tlist[n].deleted) && ((tlist[n] && tlist[n].game) || BASE_GAME[n]) === nm)))
  ].join("");
  pgMenu.draw(); drawDealers(); drawPromos();
  /* The game lists on the board: update the ones there, add new ones, take away ones that are gone. */
  const board = $("board"), keep = new Set(["form", "floor", ...items.map(it => it.id)]);
  if (!items.length) items.push({ id: "none", html: `<div class="gh"><b>Lists</b></div><div class="empty">No lists yet. Open a poker table with its game picked on the Floor page.</div>` }), keep.add("none");
  items.forEach(it => {
    let el = board.querySelector(`.wdg[data-w="${CSS.escape(it.id)}"]`);
    if (!el) { el = document.createElement("div"); el.className = "wdg"; el.dataset.w = it.id; board.appendChild(el); }
    if (el.dataset.h !== it.html) { el.dataset.h = it.html; el.innerHTML = it.html; }
  });
  board.querySelectorAll(".wdg").forEach(el => { if (!keep.has(el.dataset.w)) el.remove(); });
  items.forEach((it, i) => { const el = board.querySelector(`.wdg[data-w="${CSS.escape(it.id)}"]`); if (el && board.children[i] !== el) board.insertBefore(el, board.children[i] || null); });   // keep the order (a game going live moves up)
  layoutApply();
}

/* ---- Board layout (fixed): form and floor plan across the top, game lists 3 columns wide underneath. ---- */
const LDEF = {}, LIST_DEF = { w: 3, h: 8 };   // the form and floor plan sit in the header area
function layoutApply() {
  $("board").querySelectorAll(".wdg").forEach(el => {
    const z = LDEF[el.dataset.w] || LIST_DEF;
    el.style.gridColumn = ""; el.style.gridRow = "";   // lists sit in one scrolling row (CSS: five across)
  });
}
/* Games button: the Games menu (star favorites, start lists for poker and table games). Tap a favorite to open it too. */
const listFor = name => Object.keys(games).find(gid => games[gid] && games[gid].name === name);
const pgMenu = mountPgMenu($("pgBox"), { PGREF, GAMESREF, games: () => games, listFor, fail, after: () => draw(),
  WAITREF, wait: () => wait, running: nm => openGameNames(tables, tlist).has(nm) });
document.addEventListener("click", e => { if (e.target.closest("[data-favopen]") && $("pgBox").hidden) pgMenu.toggle(); });
/* + Add to wait list: a name and which game's list. */
const wSel = new Set();   // games picked for + Add to wait list
let plCount = 0, wCall = false;
$("wGames").addEventListener("click", e => {
  const x = e.target.closest("[data-wgx]");
  if (x) { e.stopPropagation(); removeGame(x.dataset.wgx); return; }
  const b = e.target.closest("[data-wg]"); if (!b) return;
  const g = b.dataset.wg; if (wSel.has(g)) wSel.delete(g); else wSel.add(g);
  b.classList.toggle("on", wSel.has(g));
});
/* Phoned in or Arrived (here now; the default). Phoned-in names drop off after an hour unless they arrive. */
const setHow = c => { wCall = c; $("wPhone").classList.toggle("on", c); $("wHow").textContent = c ? "drops off in 1 hour" : ""; };
$("wPhone").onclick = () => setHow(!wCall);   // tap to turn Phoned in on or off
/* x on a game button: close that list and take the game off your favorites. Not while a table runs it; asks first if
   people are on it (they go to History, so they can be put back). */
function removeGame(gid) {
  const g = games[gid]; if (!g) return;
  const name = g.name;
  if (openGameNames(tables, tlist).has(name)) { alert("A table is open running " + name + ". Close the table first."); return; }
  const ids = Object.keys(wait).filter(k => wait[k] && wait[k].game === gid);
  if (ids.length && !confirm(ids.length + (ids.length > 1 ? " people are" : " person is") + " on the " + name + " list. Remove the game and take them off? (They go to History.)")) return;
  if (ids.length) { const upd = {}; ids.forEach(k => { toHistory(k, wait[k], "floor"); upd[k] = deleteField(); delete wait[k]; }); setDoc(WAITREF, upd, { merge: true }).catch(fail); }
  delete games[gid]; wSel.delete(gid); setDoc(GAMESREF, { [gid]: deleteField() }, { merge: true }).catch(fail);
  /* Off the favorites: the poker game (name without its stakes) or the table game. */
  const variant = name.replace(/^\d+(\.\d+)?(\/\d+(\.\d+)?)+\s+/, "");
  const fid = pgAll().find(id => pgName(id) === variant) || Object.keys(TABLE_GAMES).find(id => TABLE_GAMES[id] === name);
  if (fid && pg.fav[fid]) { delete pg.fav[fid]; setDoc(PGREF, { fav: { [fid]: deleteField() } }, { merge: true }).catch(fail); }
  draw();
}
/* History: removed names, with the list they were on, so they can be put back (wait-history.html). */
const HISTREF = doc(db, "playerTracker", "waitHistory");
function toHistory(id, v, src, seated) {
  const listName = src === "app" ? "From phones" : ((games[v.game] || {}).name || "Other");
  setDoc(HISTREF, { [id]: { ...v, src, listName, removedAt: Date.now(), ...(seated ? { seated } : {}) } }, { merge: true }).catch(fail);
}
/* Duplicate check: if that name is already on a wait list, say so and ask for a last initial. "Same person" adds
   them anyway (e.g. the same player going on another game's list). Typing a different name clears it. */
const onListNamed = n => Object.values(wait).filter(v => v && v.name && v.name.trim().toLowerCase() === n.trim().toLowerCase());
const hideDup = () => { $("dupBox").hidden = true; $("dupInit").value = ""; };
$("wName").addEventListener("input", hideDup);
$("dupAdd").onclick = () => {
  const ini = $("dupInit").value.trim().replace(/\.+$/, ""); if (!ini) { $("dupInit").focus(); return; }
  $("wName").value = $("wName").value.trim() + " " + ini.toUpperCase() + "."; hideDup(); addToWait();
};
$("dupSame").onclick = () => { hideDup(); addToWait(true); };
$("dupInit").onkeydown = e => { if (e.key === "Enter") $("dupAdd").onclick(); };
const addToWait = (same) => {
  const name = $("wName").value.trim(), picked = [...wSel].filter(g => games[g]);
  if (!name) { $("wName").focus(); return; }
  if (!picked.length) { alert("Tap at least one game."); return; }
  const dups = same ? [] : onListNamed(name);
  if (dups.length) {
    const where = [...new Set(dups.map(v => (games[v.game] || {}).name || "a list"))].join(", ");
    $("dupMsg").textContent = name + " is already on " + where + ". Add a last initial.";
    $("dupBox").hidden = false; $("dupInit").focus(); return;
  }
  const card = [...Object.keys(ROSTER), ...Object.keys(roster)].find(c => nameOf(c).toLowerCase() === name.toLowerCase());
  const upd = {}, now = Date.now();
  picked.forEach((gid, k) => {
    const id = "w" + now + k + Math.random().toString(36).slice(2, 6), v = { name, game: gid, at: now };
    if (wCall) v.call = true;      // phoned in (walk-in is the default)
    if (card) v.card = card;       // a known player
    upd[id] = wait[id] = v;
  });
  setDoc(WAITREF, upd, { merge: true }).catch(fail);
  $("wName").value = ""; $("wName").focus();
  if (wCall) setHow(false);   // back to walk-in for the next one
  wSel.clear(); hideDup();    // games start over for the next name
  draw();
};
$("wAdd").onclick = () => addToWait();
$("wName").onkeydown = e => { if (e.key === "Enter") addToWait(); };
document.addEventListener("click", e => {
  const ar = e.target.closest("[data-arr]");   // phoned-in player showed up: no more drop-off timer
  if (ar) {   // the same player on every list they phoned in for (same card, or same name if not a saved player)
    const w0 = wait[ar.dataset.arr] || {}, key = v => v.card ? "c:" + v.card : "n:" + String(v.name || "").trim().toLowerCase();
    const ids = Object.keys(wait).filter(k => wait[k] && wait[k].call && key(wait[k]) === key(w0));
    if (!ids.includes(ar.dataset.arr)) ids.push(ar.dataset.arr);
    const upd = {}; ids.forEach(k => { if (wait[k]) delete wait[k].call; upd[k] = { call: deleteField() }; });
    draw(); setDoc(WAITREF, upd, { merge: true }).catch(fail); return;
  }
  const rm = e.target.closest("[data-rm]"); if (!rm) return;
  const id = rm.dataset.rm;
  if (rm.dataset.src === "app") { const p = state[id] || {}; toHistory(id, { name: nameOf(id), card: id, at: p.waitAt || Date.now() }, "app"); setDoc(REF, { [id]: { ...p, status: "out", waitAt: null } }, { merge: true }).catch(fail); }
  else { if (wait[id]) toHistory(id, wait[id], "floor"); setDoc(WAITREF, { [id]: deleteField() }, { merge: true }).catch(fail); }
});

/* ---- Dealers box: active dealers (logged in at a table) and the rotation list (playerTracker/rotation { order: [ids] }). ---- */
const ROTREF = doc(db, "playerTracker", "rotation");
let rot = [];
const dName = d => DEALERS[d] || nameOf(d);
const dTable = d => { const p = state[d]; return p && p.status === "seated" ? (p.table || 1) : 0; };
const saveRot = () => setDoc(ROTREF, { order: rot }, { merge: true }).catch(fail);
function drawDealers() {
  const act = Object.keys(DEALERS).filter(dTable).sort((a, b) => dTable(a) - dTable(b));
  /* B = break: off the table, on break (blue, with how long). Tap B again to end the break. */
  const brk = d => state[d] && state[d].status === "break" ? state[d].breakAt || Date.now() : 0;
  const bBtn = d => `<button class="mini brk${brk(d) ? " on" : ""}" data-dbrk="${esc(d)}" title="${brk(d) ? "End break" : "Break"}">B</button>`;
  const where = d => dTable(d) ? "Table " + dTable(d) : brk(d) ? `<span class="onbrk">Break ${ago(brk(d))}</span>` : "Off";
  $("dActive").innerHTML = act.length ? act.map(d => `<div class="drow"><b>${esc(dName(d))}</b><span>Table ${dTable(d)}</span>${bBtn(d)}</div>`).join("") : `<div class="empty">No dealers on a table.</div>`;
  $("dRot").innerHTML = rot.length ? rot.map((d, i) => `<div class="drow"><b>${i + 1}. ${esc(dName(d))}</b><span>${where(d)}</span>
      ${bBtn(d)}<button class="mini" data-dseat="${esc(d)}" title="Put on a table">Seat</button>${i ? `<button class="mini" data-dup="${i}" title="Move up">&uarr;</button>` : ""}<button class="mini" data-drm="${i}" title="Take off the rotation">&times;</button></div>`).join("")
    : `<div class="empty">Add dealers below to build the rotation.</div>`;
  const pick = Object.keys(DEALERS).filter(d => !rot.includes(d)).sort((a, b) => dName(a).localeCompare(dName(b)));
  const cur = $("dPick").value;
  $("dPick").innerHTML = pick.length ? pick.map(d => `<option value="${esc(d)}"${d === cur ? " selected" : ""}>${esc(dName(d))}</option>`).join("") : `<option value="">Everyone's on it</option>`;
}
$("dAdd").onclick = () => { const d = $("dPick").value; if (!d || rot.includes(d)) return; rot.push(d); saveRot(); drawDealers(); };
$("dNext").onclick = () => { if (rot.length < 2) return; rot.push(rot.shift()); saveRot(); drawDealers(); };
$("dRot").addEventListener("click", e => {
  const up = e.target.closest("[data-dup]"), rm = e.target.closest("[data-drm]");
  if (up) { const i = +up.dataset.dup; [rot[i - 1], rot[i]] = [rot[i], rot[i - 1]]; }
  else if (rm) rot.splice(+rm.dataset.drm, 1); else return;
  saveRot(); drawDealers();
});

/* ---- Promotions tile: who got what today (playerTracker/promoGiven). ---- */
const GIVEREF = doc(db, "playerTracker", "promoGiven");
let given = {};
const money = n => "$" + (Math.round(n * 100) / 100).toFixed(n % 1 ? 2 : 0);
function drawPromos() {
  const day = new Date(); day.setHours(0, 0, 0, 0);
  const by = {};   // player -> { name, card, items: [..], last }
  Object.values(given).filter(v => v && v.at >= day.getTime()).forEach(v => {
    const k = v.card || "n:" + String(v.name || "").toLowerCase();
    (by[k] = by[k] || { name: v.card ? nameOf(v.card) : v.name, card: v.card, items: [], last: 0 }).items.push(v);
    by[k].last = Math.max(by[k].last, v.at);
  });
  const P = Object.values(by).sort((a, b) => b.last - a.last);
  $("prList").innerHTML = P.length ? P.map(p => `<div class="drow" style="align-items:flex-start"><b>${p.card ? `<a href="./player-tracker.html?profile=${encodeURIComponent(p.card)}" style="color:inherit">${esc(p.name)}</a>` : esc(p.name)}</b>
      <span style="text-align:right">${p.items.sort((a, b) => a.at - b.at).map(v => esc(v.promoName) + (v.amount ? " " + money(+v.amount) : "")).join("<br>")}</span></div>`).join("")
    : `<div class="empty">No promotions given today.</div>`;
}

/* ---- Seat: a player from a wait list (their game's open tables, tap a seat) or a dealer from the rotation (tap a table).
   Seating writes to playerTracker/poc like the Player Tracker does; the player comes off that list. ---- */
const LOGREF = doc(db, "playerTracker", "log");
const logEvent = (c, a) => setDoc(LOGREF, { events: arrayUnion({ c, a, t: Date.now() }) }, { merge: true }).catch(() => {});
const BASE_SEATLIST = CASINO !== "edh" ? {} : { 1: [1, 2, 3, 4, 5, 6, 7], 2: [1, 2, 3, 5, 6, 7, 8], 3: [1, 2, 3, 4, 5, 6, 7, 8, 9], 4: [1, 2, 3, 4, 5, 6, 7], 5: [1, 2, 3, 4, 5, 6, 7] };
const tblName = n => { const t = tlist[n] || {}; return t.variant ? (t.stakes ? t.stakes + " " : "") + t.variant : t.game || BASE_GAME[n] || ""; };
const allTables = () => Object.keys({ ...BASE_GAME, ...tlist }).filter(n => !(tlist[n] && tlist[n].deleted) && tblName(n)).sort((a, b) => a - b);
const seatTables = name => allTables().filter(n => tables[n] && tables[n].open && tblName(n) === name);
const seatsOf = n => Array.isArray((tlist[n] || {}).seats) ? tlist[n].seats : BASE_SEATLIST[n] || [];
const whoAt = (n, s) => Object.keys(state).find(c => isPlayer(c) && state[c] && state[c].status === "seated" && String(state[c].table || 1) === String(n) && state[c].seat === s);
const closeSeat = () => { $("seatModal").hidden = true; seatFor = null; };
let seatFor = null;   // { kind: "player", wid } or { kind: "dealer", d }
$("smClose").onclick = closeSeat;
$("seatModal").addEventListener("click", e => { if (e.target === $("seatModal")) closeSeat(); });
function openSeatPlayer(wid) {
  const w = wait[wid]; if (!w || !games[w.game]) return;
  const name = games[w.game].name, T = seatTables(name);
  seatFor = { kind: "player", wid };
  $("smTitle").textContent = "Seat " + w.name + " · " + name;
  $("smBody").innerHTML = T.length ? T.map(n => `<div class="wlbl">Table ${esc(n)}</div><div class="sgrid">${seatsOf(n).map(s => {
      const c = whoAt(n, s); return c ? `<button disabled>${s}<span>${esc(nameOf(c).split(" ")[0])}</span></button>` : `<button data-pick="${esc(n)}|${s}">${s}</button>`; }).join("")}</div>`).join("")
    : `<div class="empty">No open table is running ${esc(name)}.</div>`;
  $("seatModal").hidden = false;
}
function openSeatDealer(d) {
  seatFor = { kind: "dealer", d };
  const T = allTables().filter(n => tables[n] && tables[n].open);
  $("smTitle").textContent = "Seat " + dName(d) + " (dealer)";
  $("smBody").innerHTML = T.length ? `<div class="sgrid">${T.map(n => { const cur = Object.keys(DEALERS).find(x => dTable(x) === +n);
      return `<button data-dpick="${esc(n)}">T${esc(n)}<span>${esc(tblName(n))}${cur ? " · " + esc(dName(cur)) : ""}</span></button>`; }).join("")}</div>`
    : `<div class="empty">No tables are open.</div>`;
  $("seatModal").hidden = false;
}
$("smBody").addEventListener("click", e => {
  const pk = e.target.closest("[data-pick]"), dp = e.target.closest("[data-dpick]");
  if (pk && seatFor && seatFor.kind === "player") {
    const [n, s] = pk.dataset.pick.split("|"), w = wait[seatFor.wid]; if (!w) { closeSeat(); return; }
    if (whoAt(n, +s)) { alert("Seat " + s + " is taken."); return; }
    let c = w.card || [...Object.keys(ROSTER), ...Object.keys(roster)].find(k => nameOf(k).toLowerCase() === w.name.toLowerCase());
    if (!c) { c = "P" + Date.now().toString(36).toUpperCase(); roster[c] = { name: w.name }; setDoc(ROSTREF, { [c]: { name: w.name } }, { merge: true }).catch(fail); }   // not a saved player yet: make a player file
    const p = state[c] || {};
    state[c] = { ...p, status: "seated", seat: +s, table: +n, since: clockStart(tables, +n), waitAt: null, breakAt: null };
    setDoc(REF, { [c]: state[c] }, { merge: true }).catch(fail);
    logEvent(c, "Seated at table " + n + " seat " + s + " (from the wait list)");
    toHistory(seatFor.wid, w, "floor", "Table " + n + ", seat " + s);   // seated names go to History too
    delete wait[seatFor.wid]; setDoc(WAITREF, { [seatFor.wid]: deleteField() }, { merge: true }).catch(fail);
    closeSeat(); draw(); return;
  }
  if (dp && seatFor && seatFor.kind === "dealer") {
    const n = +dp.dataset.dpick, d = seatFor.d, upd = {};
    for (const x of Object.keys(DEALERS)) if (x !== d && dTable(x) === n) { state[x] = { ...state[x], status: "out", since: null }; upd[x] = state[x]; logEvent(x, "Off table " + n + " (dealer change)"); }
    state[d] = { ...(state[d] || {}), status: "seated", seat: 0, table: n, since: Date.now() }; upd[d] = state[d];
    setDoc(REF, upd, { merge: true }).catch(fail); logEvent(d, "Dealing table " + n);
    closeSeat(); draw();
  }
});
document.addEventListener("click", e => {
  const sb = e.target.closest("[data-seat]"); if (sb) { openSeatPlayer(sb.dataset.seat); return; }
  const ds = e.target.closest("[data-dseat]"); if (ds) { openSeatDealer(ds.dataset.dseat); return; }
  const db = e.target.closest("[data-dbrk]");   // dealer break on / off
  if (db) {
    const d = db.dataset.dbrk, p = state[d] || {};
    if (p.status === "break") { state[d] = { ...p, status: "out", breakAt: null }; logEvent(d, "Break over"); }
    else { const t = dTable(d); state[d] = { ...p, status: "break", breakAt: Date.now(), since: null }; logEvent(d, "On break" + (t ? " (off table " + t + ")" : "")); }
    setDoc(REF, { [d]: state[d] }, { merge: true }).catch(fail); draw();
  }
});

/* ---- start (staff only) ---- */
onAuthStateChanged(getAuth(app), u => {
  if (!u) { location.replace("./login.html?next=waitlist.html"); return; }
  if (!STAFF.includes(u.uid)) { location.replace("./partner.html"); return; }
  document.body.style.visibility = "visible";
  $("floorFrame").src = withCasino("./floor.html?embed=1");   // the floor plan, live, inside its box
  draw();
  const on = (ref, set) => onSnapshot(ref, snap => { $("warn").style.display = "none"; set(snap.exists() ? snap.data() : {}); draw(); }, fail);
  on(REF, v => state = v); on(ROTREF, v => rot = Array.isArray(v.order) ? v.order.filter(d => DEALERS[d]) : []); on(GIVEREF, v => given = v); on(WAITREF, v => wait = v); on(GAMESREF, v => games = v); on(TBLREF, v => tables = v); on(LISTREF, v => tlist = v); on(PGREF, setPg);
  onSnapshot(ROSTREF, snap => { roster = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  onSnapshot(PROFREF, snap => { profiles = snap.exists() ? snap.data() : {}; draw(); }, () => {});
  setInterval(draw, 30000);   // keep the wait times ticking
});
</script>
<!-- Seat picker (players from a wait list, dealers from the rotation) -->
<div id="seatModal" hidden><div class="sm-in"><div class="sm-h"><b id="smTitle"></b><button class="x" id="smClose" aria-label="Close">&times;</button></div><div id="smBody"></div></div></div>
</body>
