<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<title>K&amp;C Floor Cleaning</title>
<style>
  :root { --black:#0a0a0b; --gold:#d9a94a; --gold-lite:#efcd7d; --ink:#ece4d0; --dim:#8d8676; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  .wrap { text-align: center; width: 100%; max-width: 360px; }
  .ring { position: relative; width: 190px; height: 190px; margin: 0 auto 28px; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: #1f1d19; stroke-width: 6; }
  .arc { fill: none; stroke: url(#g); stroke-width: 6; stroke-linecap: round;
    stroke-dasharray: 565; stroke-dashoffset: 565; animation: fill 1.6s ease-in-out forwards; }
  .logo { position: absolute; inset: 34px; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.85); animation: pop .7s .15s ease-out forwards; }
  .logo img { max-width: 100%; max-height: 100%; }
  .glow { position: absolute; inset: -10px; border-radius: 50%; opacity: 0;
    box-shadow: 0 0 40px 6px rgba(217,169,74,.45); animation: glow .6s 1.55s ease-out forwards; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .2px; }
  .msg { font-size: 15px; color: var(--dim); margin: 0; min-height: 20px; }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  .btn { display: inline-block; margin-top: 26px; padding: 14px 26px; border-radius: 999px;
    background: var(--gold); color: #1a1004; font-weight: 600; font-size: 16px; text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity .3s; }
  .btn.show { opacity: 1; pointer-events: auto; }
  @keyframes fill { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }
  @keyframes glow { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: .6; } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  @media (prefers-reduced-motion: reduce) {
    .arc { animation-duration: .01s; } .logo, .glow { animation-delay: 0s; animation-duration: .01s; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="ring">
    <div class="glow"></div>
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a67c1e"/><stop offset=".45" stop-color="#fce7ae"/><stop offset="1" stop-color="#c9982d"/>
        </linearGradient>
      </defs>
      <circle class="track" cx="100" cy="100" r="90"/>
      <circle class="arc" cx="100" cy="100" r="90"/>
    </svg>
    <div class="logo"><img src="images/logo.png" alt="K&amp;C Floor Cleaning"></div>
  </div>
  <h1>K&amp;C Floor Cleaning</h1>
  <p class="msg" id="msg">Loading contact<span class="dots"></span></p>
  <a class="btn" id="save" href="khean-clean.vcf">Save contact</a>
</div>
<script>
  var CARD = 'khean-clean.vcf';
  setTimeout(function () {
    document.getElementById('msg').textContent = 'Tap Add to Contacts';
    window.location.href = CARD;
  }, 1800);
  // If the card didn't pop up (some browsers), show a button they can tap.
  setTimeout(function () { document.getElementById('save').classList.add('show'); }, 2600);
</script>
</body>
</html>
