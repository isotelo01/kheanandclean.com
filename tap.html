<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02050d">
<title>K&amp;C Floor Cleaning</title>
<style>
  html, body { margin: 0; height: 100%; background: #02050d; overflow: hidden;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .name { position: fixed; left: 0; right: 0; bottom: max(48px, env(safe-area-inset-bottom)); text-align: center;
    color: #ece4d0; font-size: 15px; letter-spacing: 3px; text-transform: uppercase; font-weight: 500;
    opacity: 0; transition: opacity 1s ease; }
  .name.show { opacity: .75; }
  .btn { position: fixed; left: 50%; bottom: max(96px, calc(env(safe-area-inset-bottom) + 48px)); transform: translateX(-50%);
    padding: 14px 26px; border-radius: 999px; background: #d9a94a; color: #1a1004; font-weight: 600; font-size: 16px;
    text-decoration: none; opacity: 0; pointer-events: none; transition: opacity .3s; white-space: nowrap; }
  .btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="name" id="name">K&amp;C Floor Cleaning</div>
<a class="btn" id="save" href="khean-clean.vcf">Save contact</a>
<script>
(function () {
  var CARD = 'khean-clean.vcf', GO_AT = 3.4;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W, H, DPR, WL, S;              // size, waterline, logo size
  var logo = new Image(), off = document.createElement('canvas'), octx = off.getContext('2d');
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function size() {
    DPR = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    WL = Math.round(H * 0.58);
    S = Math.min(230, W * 0.62, H * 0.32);
  }
  size(); addEventListener('resize', size);

  // ---- helpers
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function ease(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
  function backOut(x) { x = clamp(x, 0, 1); var c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); }

  // ---- things in the scene
  var ripples = [], drops = [], motes = [];
  function ripple(x, t0, big) { ripples.push({ x: x, t0: t0, max: big ? W * 0.55 : 60 + Math.random() * 40, life: big ? 2.2 : 1.2 }); }
  for (var i = 0; i < 70; i++) motes.push(newMote(true));
  function newMote(anywhere) {
    return { x: Math.random() * W, y: anywhere ? Math.random() * WL : WL + Math.random() * 10,
      r: .6 + Math.random() * 1.8, v: 6 + Math.random() * 22, ph: Math.random() * 6.28,
      hue: Math.random() < .75 ? 0 : 1, a: 0 };
  }
  var dripsMade = false, emerged = [false, false, false];
  var stars = [];
  for (var st = 0; st < 160; st++) stars.push({ x: Math.random(), y: Math.pow(Math.random(), 1.4), r: .3 + Math.random() * 1.1,
    ph: Math.random() * 6.28, sp: .8 + Math.random() * 2.5, b: .3 + Math.random() * .7 });

  // ---- the logo, drawn onto its own canvas so we can shine it and reflect it
  function logoFrame(shineX) {
    var lw = S, lh = S * (logo.height / logo.width);
    off.width = Math.ceil(lw * DPR); off.height = Math.ceil(lh * DPR);
    octx.setTransform(DPR, 0, 0, DPR, 0, 0);
    octx.clearRect(0, 0, lw, lh);
    octx.drawImage(logo, 0, 0, lw, lh);
    // moonlight catching the gold from the upper right
    octx.globalCompositeOperation = 'source-atop';
    var ml = octx.createLinearGradient(lw, 0, lw * .35, lh * .8);
    ml.addColorStop(0, 'rgba(225,235,255,.38)'); ml.addColorStop(.45, 'rgba(225,235,255,.08)'); ml.addColorStop(1, 'rgba(225,235,255,0)');
    octx.fillStyle = ml; octx.fillRect(0, 0, lw, lh);
    octx.globalCompositeOperation = 'source-over';
    if (shineX !== null) {
      octx.globalCompositeOperation = 'source-atop';
      var g = octx.createLinearGradient(shineX - 70, 0, shineX + 70, lh * .4);
      g.addColorStop(0, 'rgba(255,250,230,0)'); g.addColorStop(.5, 'rgba(255,250,230,.9)'); g.addColorStop(1, 'rgba(255,250,230,0)');
      octx.fillStyle = g; octx.fillRect(0, 0, lw, lh);
      octx.globalCompositeOperation = 'source-over';
    }
    return { w: lw, h: lh };
  }

  function draw(t) {
    // sky + water
    var sky = ctx.createLinearGradient(0, 0, 0, WL);
    sky.addColorStop(0, '#02050d'); sky.addColorStop(.6, '#071230'); sky.addColorStop(1, '#10224a');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, WL);
    // twinkling stars
    for (var si = 0; si < stars.length; si++) {
      var Sx = stars[si], tw2 = .35 + .65 * (.5 + .5 * Math.sin(t * Sx.sp + Sx.ph));
      ctx.globalAlpha = Sx.b * tw2 * (1 - Sx.y * .6);
      ctx.fillStyle = '#eef3ff'; ctx.beginPath(); ctx.arc(Sx.x * W, Sx.y * WL * .95, Sx.r, 0, 6.283); ctx.fill();
      if (Sx.r > 1.1 && tw2 > .85) { ctx.fillRect(Sx.x * W - 4, Sx.y * WL * .95 - .3, 8, .6); ctx.fillRect(Sx.x * W - .3, Sx.y * WL * .95 - 4, .6, 8); }
    }
    ctx.globalAlpha = 1;
    // bright full moon
    var MX = W * .78, MY = Math.max(70, H * .12), MR = Math.min(W, H) * .075;
    var halo = ctx.createRadialGradient(MX, MY, MR * .8, MX, MY, MR * 6);
    halo.addColorStop(0, 'rgba(210,225,255,.35)'); halo.addColorStop(.3, 'rgba(160,190,255,.10)'); halo.addColorStop(1, 'rgba(160,190,255,0)');
    ctx.fillStyle = halo; ctx.fillRect(0, 0, W, WL);
    var disk = ctx.createRadialGradient(MX - MR * .3, MY - MR * .3, MR * .1, MX, MY, MR);
    disk.addColorStop(0, '#ffffff'); disk.addColorStop(.7, '#f1f4fb'); disk.addColorStop(1, '#d9e1f0');
    ctx.shadowColor = 'rgba(220,232,255,.9)'; ctx.shadowBlur = 40;
    ctx.fillStyle = disk; ctx.beginPath(); ctx.arc(MX, MY, MR, 0, 6.283); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(150,165,195,.1)';
    [[-.3,-.15,.28],[.25,.2,.22],[.05,-.4,.14],[-.15,.35,.12],[.38,-.25,.1]].forEach(function (c) {
      ctx.beginPath(); ctx.arc(MX + c[0] * MR, MY + c[1] * MR, c[2] * MR, 0, 6.283); ctx.fill(); });
    // deep blue water
    var sea = ctx.createLinearGradient(0, WL, 0, H);
    sea.addColorStop(0, '#0d2a5a'); sea.addColorStop(.5, '#06173a'); sea.addColorStop(1, '#020818');
    ctx.fillStyle = sea; ctx.fillRect(0, WL, W, H - WL);
    // moonlight path on the water
    for (var mp = 0; mp < 46; mp++) {
      var q2 = mp / 46, py = WL + 2 + Math.pow(q2, 1.5) * (H - WL);
      var spread = 6 + q2 * W * .16, len = 4 + q2 * 26 + Math.random() * 8;
      var px = MX + (Math.sin(t * 2.3 + mp * 1.7) * .9) * spread;
      ctx.globalAlpha = (.25 + .55 * Math.abs(Math.sin(t * 3 + mp * 2.1))) * (1 - q2 * .55);
      ctx.fillStyle = '#e6eeff'; ctx.fillRect(px - len / 2, py, len, .8 + q2 * 1.6);
    }
    ctx.globalAlpha = 1;

    // light from the logo glowing on the water
    var rise = ease((t - .25) / 1.6);
    var glow = ctx.createRadialGradient(W / 2, WL, 0, W / 2, WL, W * .7);
    glow.addColorStop(0, 'rgba(217,169,74,' + (.22 * rise) + ')'); glow.addColorStop(1, 'rgba(217,169,74,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, WL - H * .3, W, H * .6);

    // shimmering gold lines on the water (closer = lower = further apart)
    for (var k = 0; k < 34; k++) {
      var p = k / 34, y = WL + 3 + Math.pow(p, 1.7) * (H - WL);
      var amp = 1 + p * 5, a = (.05 + .22 * (1 - p)) * (.35 + .65 * rise);
      ctx.beginPath();
      for (var x = 0; x <= W; x += 8) {
        var yy = y + Math.sin(x * (.035 - p * .02) + t * (1.6 + p) + k) * amp;
        x ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy);
      }
      var lg = ctx.createLinearGradient(0, 0, W, 0);
      lg.addColorStop(0, 'rgba(120,160,230,' + a * .5 + ')'); lg.addColorStop(.5, 'rgba(240,210,150,' + a + ')'); lg.addColorStop(.78, 'rgba(210,225,255,' + a * .9 + ')'); lg.addColorStop(1, 'rgba(120,160,230,' + a * .4 + ')');
      ctx.strokeStyle = lg; ctx.lineWidth = .6 + p * 1.2; ctx.stroke();
    }

    // logo position: rises out of the water, settles, then breathes
    var lift = backOut((t - .25) / 1.6);
    var bob = Math.sin(t * 2.1) * 4 * ease((t - 1.8) / 1);
    var shineX = (t > 1.9 && t < 2.8) ? -80 + (t - 1.9) / .9 * (S + 160) : null;
    var L = logoFrame(shineX);
    var cy = WL + L.h * .55 - lift * (L.h * .55 + L.h * .62) + bob;   // centre of logo
    var dw = L.w, dh = L.h;                                        // always its true shape

    // reflection under the waterline, rippling row by row
    var top = cy - dh / 2;
    var vis = clamp((WL - top) / dh, 0, 1);
    if (vis > 0) {
      var rowH = 2, rows = Math.ceil((WL - top) * .85 / rowH);
      for (var r = 0; r < rows; r++) {
        var srcRow = (WL - (r * rowH) / .85) - top;            // mirror across the waterline
        if (srcRow < 0 || srcRow > L.h) continue;
        var dy = WL + r * rowH;
        var wob = Math.sin(r * .22 + t * 5) * (1.5 + r * .06) + Math.sin(r * .07 - t * 2) * 2;
        ctx.globalAlpha = .38 * (1 - r / rows) * vis;
        ctx.drawImage(off, 0, srcRow * DPR, off.width, rowH / .85 * DPR,
          W / 2 - dw / 2 + wob, dy, dw, rowH + .5);
      }
      ctx.globalAlpha = 1;
    }

    // ripples
    for (var j = ripples.length - 1; j >= 0; j--) {
      var R = ripples[j], age = (t - R.t0) / R.life;
      if (age < 0) continue;
      if (age > 1) { ripples.splice(j, 1); continue; }
      for (var n = 0; n < 3; n++) {
        var aa = age - n * .08; if (aa <= 0) continue;
        var rad = ease(aa) * R.max;
        ctx.beginPath(); ctx.ellipse(R.x, WL + 2, rad, rad * .16, 0, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(252,231,174,' + (.5 * (1 - age) * (1 - n * .3)) + ')';
        ctx.lineWidth = 1.2 - n * .3; ctx.stroke();
      }
    }
    [.3, .75, 1.25].forEach(function (when, i) { if (!emerged[i] && t > when) { emerged[i] = true; ripple(W / 2, t, true); } });

    // the logo itself, cut off at the waterline while it's coming up
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W, WL + 1); ctx.clip();
    ctx.shadowColor = 'rgba(240,198,112,' + (.3 * rise) + ')'; ctx.shadowBlur = 18;
    ctx.drawImage(off, W / 2 - dw / 2, cy - dh / 2, dw, dh);
    ctx.restore();
    // wet line where it breaks the surface
    if (cy + dh / 2 > WL - 2 && t > .25) {
      ctx.fillStyle = 'rgba(252,231,174,.35)';
      ctx.fillRect(W / 2 - dw / 2, WL - 1, dw, 2);
    }

    // drips fall back into the water once it's out
    if (!dripsMade && t > 1.75) {
      dripsMade = true;
      for (var d = 0; d < 5; d++) drops.push({ x: W / 2 + (Math.random() - .5) * dw * .7, y: cy + dh * .32, v: 0, t0: 1.75 + d * .18 });
    }
    for (var q = drops.length - 1; q >= 0; q--) {
      var D = drops[q]; if (t < D.t0) continue;
      D.v += 900 / 60; D.y += D.v / 60;
      if (D.y >= WL) { ripple(D.x, t, false); drops.splice(q, 1); continue; }
      ctx.beginPath(); ctx.ellipse(D.x, D.y, 1.6, 3.2, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(252,231,174,.9)'; ctx.fill();
    }

    // glowing motes drifting up, like the light is lifting off the water
    for (var m = 0; m < motes.length; m++) {
      var M = motes[m];
      M.y -= M.v / 60 * (.6 + rise); M.x += Math.sin(t * .8 + M.ph) * .25;
      M.a = Math.min(1, M.a + .02);
      if (M.y < -10) motes[m] = newMote(false);
      var tw = .5 + .5 * Math.sin(t * 3 + M.ph), fade = clamp(M.y / WL, 0, 1);
      ctx.beginPath(); ctx.arc(M.x, M.y, M.r, 0, Math.PI * 2);
      ctx.fillStyle = M.hue ? 'rgba(200,225,255,' + (.5 * tw * fade * M.a) + ')' : 'rgba(252,231,174,' + (.7 * tw * fade * M.a) + ')';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 8;
      ctx.fill(); ctx.shadowBlur = 0;
    }
  }

  var start = null, sent = false;
  function loop(now) {
    if (start === null) start = now;
    var t = (now - start) / 1000;
    if (still) t = 4;
    draw(t);
    if (t > 2.1) document.getElementById('name').classList.add('show');
    if (!sent && t > GO_AT) { sent = true; window.location.href = CARD;
      setTimeout(function () { document.getElementById('save').classList.add('show'); }, 800); }
    requestAnimationFrame(loop);
  }
  logo.onload = function () { requestAnimationFrame(loop); };
  logo.onerror = function () { window.location.href = CARD; };
  logo.src = 'images/logo.png';
})();
</script>
</body>
</html>
