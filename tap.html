<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0b">
<title>K&amp;C Floor Cleaning</title>
<style>
  :root { --black:#0a0a0b; --gold:#d9a94a; --gold-lite:#efcd7d; --ink:#ece4d0; --dim:#8d8676; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--black); color: var(--ink);
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  .wrap { text-align: center; width: 100%; max-width: 360px; }
  .stage { position: relative; width: 220px; height: 220px; margin: 0 auto 24px; }
  .logo { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: translateY(46px) scale(.94); filter: blur(6px);
    animation: float 1.3s .1s cubic-bezier(.2,.8,.25,1) forwards, bob 2.4s 1.4s ease-in-out infinite; }
  .logo img { max-width: 100%; max-height: 100%; }
  .shine { position: absolute; inset: 0; pointer-events: none;
    -webkit-mask: url(images/logo.png) center / contain no-repeat; mask: url(images/logo.png) center / contain no-repeat;
    background: linear-gradient(110deg, transparent 35%, rgba(255,248,225,.95) 50%, transparent 65%) no-repeat;
    background-size: 250% 100%; background-position: 150% 0; animation: sweep .9s 1.3s ease-in-out forwards; }
  .flash { position: absolute; inset: -40px; border-radius: 50%; opacity: 0; pointer-events: none;
    background: radial-gradient(circle, rgba(252,231,174,.75) 0%, rgba(217,169,74,.35) 35%, transparent 68%);
    animation: flash .7s 2.05s ease-out forwards; }
  .spark { position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    background: #fce7ae; box-shadow: 0 0 6px 2px rgba(252,231,174,.7); opacity: 0;
    animation: spark 1.1s ease-out forwards; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .2px; }
  .btn { display: inline-block; margin-top: 26px; padding: 14px 26px; border-radius: 999px;
    background: var(--gold); color: #1a1004; font-weight: 600; font-size: 16px; text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity .3s; }
  .btn.show { opacity: 1; pointer-events: auto; }
  h1 { opacity: 0; animation: fadein .8s .9s ease-out forwards; }
  @keyframes float { to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes sweep { to { background-position: -50% 0; } }
  @keyframes flash { 0% { opacity: 0; transform: scale(.6); } 35% { opacity: 1; } 100% { opacity: 0; transform: scale(1.25); } }
  @keyframes spark { 0% { opacity: 0; transform: translate(-50%,-50%); }
    20% { opacity: 1; } 100% { opacity: 0; transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.4); } }
  @keyframes fadein { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .logo, h1 { animation: none; opacity: 1; transform: none; filter: none; } .shine, .flash, .spark { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <div class="flash"></div>
    <div class="logo"><img src="images/logo.png" alt="K&amp;C Floor Cleaning"><div class="shine"></div></div>
  </div>
  <h1>K&amp;C Floor Cleaning</h1>
  <a class="btn" id="save" href="khean-clean.vcf">Save contact</a>
</div>
<script>
  var CARD = 'khean-clean.vcf';
  // Sparkles drift off the logo right after the flash.
  var stage = document.getElementById('stage');
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('span'), a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 70;
    s.className = 'spark';
    s.style.setProperty('--x', Math.round(Math.cos(a) * d) + 'px');
    s.style.setProperty('--y', Math.round(Math.sin(a) * d - 20) + 'px');
    s.style.animationDelay = (2.15 + Math.random() * 0.35).toFixed(2) + 's';
    stage.appendChild(s);
  }
  setTimeout(function () { window.location.href = CARD; }, 2900);
  // If the card didn't pop up (some browsers), show a button they can tap.
  setTimeout(function () { document.getElementById('save').classList.add('show'); }, 3700);
</script>
</body>
</html>
