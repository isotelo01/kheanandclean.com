<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<title>K&amp;C Floor Cleaning</title>
<link rel="preload" as="image" href="/images/logo-clear-1280.png">
<style>
/* Same opening as the Instant Quote intro (quote-finder.html .intro2), without the words. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
  font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
.intro2{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; overflow:hidden;
  background:radial-gradient(120% 75% at 50% 42%, #1c1609 0%, #08090d 52%, #000 100%); }
.intro2 canvas{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.intro2 .rays{ position:absolute; left:50%; top:50%; width:170vmax; height:170vmax; translate:-50% -50%; opacity:0; transition:opacity 1.8s ease; pointer-events:none;
  background:conic-gradient(from 0deg, transparent 0 7%, rgba(227,182,74,.09) 10%, transparent 13% 28%, rgba(227,182,74,.06) 31%, transparent 35% 54%, rgba(227,182,74,.08) 57%, transparent 61% 79%, rgba(227,182,74,.06) 82%, transparent 86%);
  -webkit-mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); mask-image:radial-gradient(circle, #000 0 14%, transparent 48%); animation:i2spin 30s linear infinite; }
.intro2.on .rays{ opacity:1; }
@keyframes i2spin{ to{ rotate:360deg; } }
.intro2 .mark{ position:relative; width:min(54vw,230px); aspect-ratio:1280/1143; z-index:1; }
.intro2 .mark img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; clip-path:inset(100% 0 0 0); transition:clip-path 1.6s cubic-bezier(.45,.05,.25,1), filter 1.2s ease;
  filter:drop-shadow(0 0 22px rgba(227,182,74,.55)) brightness(1.25); }
.intro2.on .mark img{ clip-path:inset(-10% -10% -10% -10%); }
.intro2.drawn .mark img{ filter:drop-shadow(0 0 14px rgba(227,182,74,.35)) brightness(1); }
.intro2 .scan{ position:absolute; left:-12%; right:-12%; bottom:0; height:3px; border-radius:3px; opacity:0;
  background:linear-gradient(90deg, transparent, #fff3cf 30%, #fffaf0 50%, #fff3cf 70%, transparent); box-shadow:0 0 16px 4px rgba(227,182,74,.85), 0 0 46px 10px rgba(227,182,74,.35);
  transition:bottom 1.6s cubic-bezier(.45,.05,.25,1), opacity .3s ease; }
.intro2.on .scan{ bottom:100%; opacity:1; }
.intro2.drawn .scan{ opacity:0; }
.intro2 .shine{ position:absolute; inset:0; pointer-events:none; background:linear-gradient(105deg, transparent 38%, rgba(255,246,220,.85) 50%, transparent 62%) no-repeat; background-size:260% 100%; background-position:160% 0;
  -webkit-mask:url(/images/logo-clear-1280.png) center/contain no-repeat; mask:url(/images/logo-clear-1280.png) center/contain no-repeat; mix-blend-mode:screen; }
.intro2.drawn .shine{ transition:background-position 1.3s ease .15s; background-position:-60% 0; }
.intro2 svg{ position:absolute; left:50%; top:50%; width:150%; height:auto; translate:-50% -50%; overflow:visible; pointer-events:none; transition:opacity 1.4s ease; }
.intro2.fade svg{ opacity:0; }
.intro2 circle{ fill:none; stroke:#E3B64A; stroke-linecap:round; filter:drop-shadow(0 0 4px rgba(227,182,74,.9)); }
.intro2 .r1{ stroke-width:1.1; stroke-dasharray:352; stroke-dashoffset:352; transform-origin:60px 60px; transform:rotate(-90deg); transition:stroke-dashoffset 1.2s cubic-bezier(.6,0,.2,1); }
.intro2.drawn .r1{ stroke-dashoffset:0; }
.intro2 .r2{ stroke-width:.6; stroke-dasharray:2 7; opacity:0; transform-origin:60px 60px; transition:opacity 1s ease .4s; animation:i2spin 18s linear infinite reverse; }
.intro2.drawn .r2{ opacity:.7; }
.btn{ position:fixed; left:50%; bottom:max(48px, calc(env(safe-area-inset-bottom) + 24px)); translate:-50% 0; z-index:2;
  padding:14px 26px; border-radius:999px; background:#E3B64A; color:#1a1004; font-weight:600; font-size:16px; text-decoration:none;
  opacity:0; pointer-events:none; transition:opacity .3s; white-space:nowrap; }
.btn.show{ opacity:1; pointer-events:auto; }
@media (prefers-reduced-motion: reduce){
  .intro2 .mark img{ clip-path:none; transition:none; } .intro2 .scan, .intro2 .shine{ display:none; }
}
</style>
</head>
<body>
<div class="intro2" id="ov" aria-hidden="true">
  <div class="rays"></div><canvas></canvas>
  <div class="mark"><svg viewBox="0 0 120 120"><circle class="r1" cx="60" cy="60" r="56"/><circle class="r2" cx="60" cy="60" r="51"/></svg>
    <img src="/images/logo-clear-1280.png" alt=""><i class="scan"></i><i class="shine"></i></div>
</div>
<a class="btn" id="save" href="khean-clean.vcf">Save contact</a>
<script>
(function(){
  var CARD = 'khean-clean.vcf?v=' + Date.now();   /* always fetch the newest card, never a cached copy */
  var ov = document.getElementById('ov');
  var at = function(ms, f){ setTimeout(f, ms); };

  /* Gold sparks: drifting up the whole time, plus one burst out of the logo when it finishes drawing. */
  var cv = ov.querySelector('canvas'), g = cv.getContext('2d'), dpr = Math.min(2, window.devicePixelRatio || 1), P = [];
  var size = function(){ cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  size(); addEventListener('resize', size);
  var spark = function(x, y, vx, vy, life){ P.push({ x:x, y:y, vx:vx, vy:vy, life:life, age:0, r:(Math.random() * 1.6 + .6) * dpr, tw:Math.random() * 6 }); };
  var rise = function(){ return -(Math.random() * .7 + .4) * dpr; };
  for(var k = 0; k < 70; k++){ spark(Math.random() * cv.width, Math.random() * cv.height, (Math.random() - .5) * .15 * dpr, rise(), 1e9); P[P.length - 1].age = 30; }
  var tick = function(){
    g.clearRect(0, 0, cv.width, cv.height); g.globalCompositeOperation = 'lighter';
    for(var i = P.length - 1; i >= 0; i--){ var q = P[i]; q.age++; q.x += q.vx; q.y += q.vy;
      if(q.burst){ q.vx *= .992; q.vy = q.vy * .992 - .002 * dpr; if(q.age > q.life){ P.splice(i, 1); continue; } }
      else if(q.y < -12 * dpr){ q.x = Math.random() * cv.width; q.y = cv.height + 10 * dpr; q.vy = rise(); q.age = 0; }   /* floated off the top: start again at the bottom */
      var top = q.burst ? 1 : Math.max(0, Math.min(1, q.y / (cv.height * .08) + .15));   /* fade only right at the very top */
      var a = Math.min(1, q.age / 30) * (q.burst ? Math.min(1, (q.life - q.age) / 60) : top) * (.55 + .45 * Math.sin(q.age * .12 + q.tw));
      var gr = g.createRadialGradient(q.x, q.y, 0, q.x, q.y, q.r * 4);
      gr.addColorStop(0, 'rgba(255,240,200,' + a + ')'); gr.addColorStop(.35, 'rgba(227,182,74,' + a * .7 + ')'); gr.addColorStop(1, 'rgba(227,182,74,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(q.x, q.y, q.r * 4, 0, Math.PI * 2); g.fill(); }
    requestAnimationFrame(tick); };
  tick();
  var burst = function(){
    var m = ov.querySelector('.mark').getBoundingClientRect(), cx = (m.left + m.width / 2) * dpr, cy = (m.top + m.height / 2) * dpr;
    for(var j = 0; j < 70; j++){ var an = Math.random() * Math.PI * 2, sp = (Math.random() * 3 + 1.2) * dpr;
      spark(cx + Math.cos(an) * m.width * .35 * dpr, cy + Math.sin(an) * m.height * .35 * dpr, Math.cos(an) * sp, Math.sin(an) * sp, 70 + Math.random() * 60);
      P[P.length - 1].burst = true; } };

  var go = function(){
    window.location.href = CARD;
    at(800, function(){ document.getElementById('save').classList.add('show'); });
  };
  var img = ov.querySelector('.mark img');
  var start = function(){
    at(30, function(){ ov.classList.add('on'); });                 /* rays fade in, logo draws up */
    at(1700, function(){ ov.classList.add('drawn'); burst(); });   /* ring, shimmer, sparks burst */
    at(3400, function(){ ov.classList.add('fade'); });              /* circles fade away */
    at(6200, go);                                                  /* card pops 3 seconds after the shimmer */
  };
  if (img.complete) start(); else { img.onload = start; img.onerror = go; }
})();
</script>
</body>
</html>
